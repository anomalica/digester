        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      We're going through our due diligence. Is it some sort of new type of cruise missile technology that China has developed? Is it some sort of high-altitude balloon that's conducting reconnaissance? Ultimately, when you have exhausted all those what-ifs and you're still left with the fact that this is in our airspace and it's real, that's when it becomes compelling and that's when it becomes problematic.
    text: |-
      AATIP went through due diligence to rule out explanations such as new cruise missile technology developed by China or high-altitude reconnaissance balloons before concluding some UAP are real and in US airspace.
