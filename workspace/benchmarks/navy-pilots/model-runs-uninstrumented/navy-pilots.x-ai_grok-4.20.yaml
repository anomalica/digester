      - name: Tic Tac UAP
      - name: 2004 USS Nimitz UAP encounter [date_start=2004-11-14]
    quote: |-
      I want to see how close I can get. So I go like this, and it's climbing still. And when it gets right in front of me, it just disappears. Disappears? Disappears, like gone. It had sped off.
    text: |-
      During the 2004 USS Nimitz UAP encounter when David Fravor tried to get closer the Tic Tac UAP climbed, positioned in front of him and then disappeared after speeding off.
  - id: a8a76e36-b6e1-4250-bde2-c3b209bf6554
    type: opinion
    speaker:
      id: b422db94-fa94-4077-81c2-a617473aa427
      name: Dietrich, Alex
    location: 00:08:49.4-00:09:00.9
    date: '2004-11-14'
    refs:
      - id: b422db94-fa94-4077-81c2-a617473aa427
        name: Dietrich, Alex
      - name: Tic Tac UAP
      - name: 2004 USS Nimitz UAP encounter [date_start=2004-11-14]
    quote: |-
      What are you thinking? So your mind tries to make sense of it. I'm going to categorize this as maybe a helicopter or maybe a drone. And when it disappeared, I mean, it was just...
    text: |-
      During the 2004 USS Nimitz UAP encounter Alex Dietrich initially categorised the Tic Tac UAP as possibly a helicopter or a drone.
  - id: bd02b032-e850-4b56-bcab-3a33faf99dd9
    type: observation
    speaker:
      id: d09daf5f-bda2-4b56-bfb2-418133ca41b0
      name: Fravor, David
    location: 00:09:00.9-00:09:09.8
    date: '2004-11-14'
    refs:
