    quote: |-
      After receiving classified briefings on UAPs, Senator Marco Rubio called for a detailed analysis.
    text: |-
      After receiving classified briefings on Unidentified Aerial Phenomena (UAP), Senator Marco Rubio called for a detailed analysis while head of the United States Senate Select Committee on Intelligence.
  - id: 8c669064-9d51-423a-a115-dca367bb5c88
    type: administrative
