      - id: 3167eebf-db8c-4720-9cf6-92028c245d0d
        name: United States Congress
    quote: Anything that enters an airspace that's not supposed to be there is a threat.
    text: |-
      Senator Marco Rubio said anything that enters airspace that is not supposed to be there is a threat.
