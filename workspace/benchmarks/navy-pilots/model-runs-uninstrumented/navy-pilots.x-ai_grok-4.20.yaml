        name: Whitaker, Bill
    quote: |-
      This past August, the Pentagon resurrected AATIP. It's now called the UAP Task Force. Service members now are encouraged to report strange encounters.
    text: |-
      In August 2021 the Pentagon resurrected the Advanced Aerospace Threat Identification Program (AATIP) as the UAP Task Force and encouraged service members to report strange encounters.
  - id: 5b992793-40db-4cc4-b464-0c4ed5ce8c5f
    type: opinion
