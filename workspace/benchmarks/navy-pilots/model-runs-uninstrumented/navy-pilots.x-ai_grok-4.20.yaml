      Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo.
    text: |-
      Luis Elizondo spent 20 years running military intelligence operations worldwide including in Afghanistan, the Middle East and Guantanamo.
