        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      Bill, I think we're beyond that already. The government has already stated for the record that they're real. I'm not telling you that. The United States government is telling you that.
    text: |-
      During the 60 Minutes interview with Navy pilots and officials on UAP encounters (2021), Luis Elizondo said the United States government has officially confirmed that Unidentified Aerial Phenomena (UAP) are real.
