    quote: |-
      This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month.
    text: |-
      In December 2020 while head of the United States Senate Select Committee on Intelligence Senator Marco Rubio asked the Office of the Director of National Intelligence (ODNI) and the Pentagon to present an unclassified report on Unidentified Aerial Phenomena (UAP) to Congress by June 2021.
  - id: bb99e191-f364-48d5-98e5-bf3d14b36b46
    type: opinion
