  - id: 3b32d12e-b121-40f2-81b7-c25133edfc85
    type: opinion
    speaker:
      id: 45c68f97-e0aa-49cb-80b7-3eb685a98476
      name: Elizondo, Luis
    location: 00:03:20.4-00:03:52.6
    refs:
      - id: 45c68f97-e0aa-49cb-80b7-3eb685a98476
        name: Elizondo, Luis
      - id: 6eeb35a4-3426-43be-9c9c-10fe57be500a
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      In some cases, there are simple explanations for what people are witnessing, but there are some that that are not.
    text: |-
      In some cases there are simple explanations for what people are witnessing as Unidentified Aerial Phenomena (UAP) but some cases have no simple explanation.
  - id: d3b3b5a1-168f-47e9-8510-526577e32c01
    type: administrative
    speaker:
      id: 45c68f97-e0aa-49cb-80b7-3eb685a98476
      name: Elizondo, Luis
    location: 00:03:20.4-00:04:06.2
    refs:
      - name: |-
          Advanced Aerospace Threat Identification Program (AATIP) [date_start=2008-01-01, date_end=2012-01-01]
      - id: 6eeb35a4-3426-43be-9c9c-10fe57be500a
        name: Unidentified Aerial Phenomena (UAP)
      - id: 45c68f97-e0aa-49cb-80b7-3eb685a98476
        name: Elizondo, Luis
    quote: |-
      We're not just simply jumping to a conclusion that's saying, oh, that's a UAP out there. We're going through our due diligence. Is it some sort of new type of cruise missile technology that China has developed? Is it some sort of high-altitude balloon that's conducting reconnaissance? Ultimately, when you have exhausted all those what-ifs and you're still left with the fact that this is in our airspace and it's real, that's when it becomes compelling and that's when it becomes problematic.
    text: |-
      The Advanced Aerospace Threat Identification Program (AATIP) performed due diligence before concluding that some sightings were Unidentified Aerial Phenomena (UAP) by ruling out possibilities such as new Chinese cruise missile technology or high-altitude reconnaissance balloons.
  - id: 20a01de7-e5a9-41b7-a66c-46b899e5172b
