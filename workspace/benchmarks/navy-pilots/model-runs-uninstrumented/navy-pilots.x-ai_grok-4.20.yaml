      - id: 6eeb35a4-3426-43be-9c9c-10fe57be500a
        name: Unidentified Aerial Phenomena (UAP)
    quote: You know, I don't see an exhaust plume.
    text: |-
      Ryan Graves observed no exhaust plume on the Unidentified Aerial Phenomena (UAP) off the Atlantic coast.
  - id: 0b896c3b-8b1e-4f0e-9114-e945347c7940
    type: observation
    speaker:
      id: 9786180d-e6c3-4392-afc1-4115af01c6ed
      name: Graves, Ryan
    location: 00:05:04.3-00:05:25.4
    date: '2015-01-01'
    refs:
      - id: 9786180d-e6c3-4392-afc1-4115af01c6ed
