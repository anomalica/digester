      - id: b422db94-fa94-4077-81c2-a617473aa427
        name: Dietrich, Alex
      - name: Tic Tac UAP
      - name: 2004 USS Nimitz UAP encounter [date_start=2004-11-14]
    quote: |-
      Did your back seaters see this too? Yeah. Oh, yeah. There was four of us in the airplanes literally watching this thing for roughly about five minutes.
    text: |-
      During the 2004 USS Nimitz UAP encounter the four naval aviators including David Fravor, Alex Dietrich and their two back-seaters watched the Tic Tac UAP for roughly five minutes.
  - id: e44275cd-1aa9-4bd9-b75c-707d98850be7
    type: observation
    speaker:
      id: 0d0e6dfa-65c4-44fc-baa4-372a0e4215bf
      name: Whitaker, Bill
    location: 00:09:08.9-00:09:20.8
    date: '2004-11-14'
    refs:
      - id: 267c40f7-0908-4c41-ad11-178cc61a39fa
        name: USS Princeton
      - name: 2004 USS Nimitz UAP encounter [date_start=2004-11-14]
      - id: 0d0e6dfa-65c4-44fc-baa4-372a0e4215bf
        name: Whitaker, Bill
    quote: |-
      Seconds later, the Princeton reacquired the target, 60 miles away. Another crew managed to briefly lock onto it with a targeting camera before it zipped off again.
    text: |-
      Seconds after disappearing in the 2004 USS Nimitz UAP encounter the target was reacquired by the USS Princeton 97 kilometres away and another crew briefly locked onto it with a targeting camera before it zipped off again.
  - id: 50be6c86-8a99-4827-9998-af9f8e2bc97a
    type: opinion
    speaker:
      id: b422db94-fa94-4077-81c2-a617473aa427
      name: Dietrich, Alex
    location: 00:09:14.4-00:09:31.1
    date: '2004-11-14'
    refs:
      - id: b422db94-fa94-4077-81c2-a617473aa427
        name: Dietrich, Alex
      - name: 2004 USS Nimitz UAP encounter [date_start=2004-11-14]
    quote: |-
      You know, I think that over beers, we've sort of said, hey, man, if I saw this solo, I don't know that I would have come back and said anything because it sounds so crazy when I say it.
    text: |-
      Alex Dietrich said that over beers the aircrew have said if she saw the object solo she might not have reported it because it sounds crazy.
  - id: f55af745-6bf4-4341-8fe2-107326ed07c3
    type: opinion
    speaker:
      id: d09daf5f-bda2-4b56-bfb2-418133ca41b0
      name: Fravor, David
    location: 00:09:31.1-00:09:39.8
    refs:
      - id: d09daf5f-bda2-4b56-bfb2-418133ca41b0
        name: Fravor, David
      - id: c72d3540-3a33-405b-a1f1-59eeba311935
        name: Unidentified Flying Object (UFO)
    quote: |-
      You understand that reaction? I do. I've had some people tell me, you know, when you say that, you can sound crazy. I'll be honest. I'm not a UFO guy.
    text: |-
      David Fravor understands why people might not report seeing something that sounds crazy and said some people have told him he can sound crazy when describing it.
  - id: f14eb8b8-de5f-45e8-8394-a9ce16530df9
    type: opinion
    speaker:
      id: d09daf5f-bda2-4b56-bfb2-418133ca41b0
      name: Fravor, David
    location: 00:09:39.8-00:09:56.5
    date: '2004-11-14'
    refs:
      - id: d09daf5f-bda2-4b56-bfb2-418133ca41b0
        name: Fravor, David
      - name: 2004 USS Nimitz UAP encounter [date_start=2004-11-14]
    quote: |-
      But from what I hear you guys saying, there's something. Yes. There's definitely something that, I don't know who's building it, who's got the technology, who's got the brains, but there's something out there that was better than our airplane.
    text: |-
      David Fravor said there is definitely something out there that was better than our airplane in the 2004 USS Nimitz UAP encounter although he does not know who is building it.
  - id: f7eaa8cc-7cd1-4134-91a2-10eaaab10070
    type: administrative
    speaker:
      id: 0d0e6dfa-65c4-44fc-baa4-372a0e4215bf
      name: Whitaker, Bill
    location: 00:09:56.5-00:10:04.2
    date: '2004-11-14'
    refs:
      - id: 0d0e6dfa-65c4-44fc-baa4-372a0e4215bf
        name: Whitaker, Bill
      - name: 2004 USS Nimitz UAP encounter [date_start=2004-11-14]
      - id: 45c68f97-e0aa-49cb-80b7-3eb685a98476
        name: Elizondo, Luis
    quote: |-
      The air crew filed reports. Then, like the mysterious flying object, the Nimitz encounter disappeared. Nothing was said or done officially for five years until Lou Elizondo came across the story and investigated.
    text: |-
      The air crew of the 2004 USS Nimitz UAP encounter filed reports but the incident was not addressed officially for five years.
  - id: b70f5d61-61fa-444f-9829-008ed04acb31
    type: opinion
    speaker:
      id: 45c68f97-e0aa-49cb-80b7-3eb685a98476
      name: Elizondo, Luis
    location: 00:10:04.2-00:10:27.7
    refs:
      - id: 45c68f97-e0aa-49cb-80b7-3eb685a98476
        name: Elizondo, Luis
    quote: |-
      We spend millions of dollars in training these pilots, and they are seeing something that they can't explain. Furthermore, that information's being backed up on electro-optical data, like gun camera footage, and by radar data. Now, to me, that's compelling.
    text: |-
      Luis Elizondo said the US government spends millions of dollars training pilots who are seeing something they cannot explain, backed up by electro-optical gun camera footage and radar data which he finds compelling.
  - id: 7a82dde6-6ddf-46fc-ab54-2b2d49f318a1
    type: administrative
    speaker:
