        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      Lieutenant Graves told us pilots training off the Atlantic coast see things like that all the time. Every day. Every day for at least a couple of years.
    text: |-
      Ryan Graves said Navy pilots training off the Atlantic coast see Unidentified Aerial Phenomena (UAP) every day for at least a couple of years.
  - id: f2759952-5bd3-4547-b23b-3db93662548c
    type: observation
    speaker:
      id: 9786180d-e6c3-4392-afc1-4115af01c6ed
