    location: 00:10:27.7-00:10:39.5
    date: '2012-01-01'
    refs:
      - id: dd72f7bb-6726-407c-9799-4f24da85c53d
        name: Pentagon
      - id: 45c68f97-e0aa-49cb-80b7-3eb685a98476
        name: Elizondo, Luis
      - name: |-
          Advanced Aerospace Threat Identification Program (AATIP) [date_start=2008-01-01, date_end=2012-01-01]
      - name: 2004 USS Nimitz UAP encounter [date_start=2004-11-14]
      - id: 0d0e6dfa-65c4-44fc-baa4-372a0e4215bf
        name: Whitaker, Bill
    quote: |-
      Inside the Pentagon, his findings were met with skepticism. AATIP's funding was eliminated in 2012, but Elizondo says he and a handful of others kept the mission alive.
    text: |-
      Inside the Pentagon Luis Elizondo's findings on the 2004 USS Nimitz UAP encounter were met with skepticism and Advanced Aerospace Threat Identification Program (AATIP) funding was eliminated in 2012.
  - id: 43d00ef2-9df1-45c0-baae-5a84bb926baf
    type: administrative
    speaker:
      id: 0d0e6dfa-65c4-44fc-baa4-372a0e4215bf
      name: Whitaker, Bill
    location: 00:10:31.7-00:10:48.8
    date: '2017-01-01'
    refs:
      - id: 45c68f97-e0aa-49cb-80b7-3eb685a98476
        name: Elizondo, Luis
      - id: dd72f7bb-6726-407c-9799-4f24da85c53d
