        name: Graves, Ryan
      - id: 6eeb35a4-3426-43be-9c9c-10fe57be500a
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      So you're seeing it both with the radar and with the infrared, and that tells you that there is something out there. Pretty hard to spoof that.
    text: |-
      Ryan Graves observed Unidentified Aerial Phenomena (UAP) with both radar and infrared, confirming there is something physically out there.
  - id: 02710778-7a06-4ee7-b0bd-fe276e50452a
    type: opinion
