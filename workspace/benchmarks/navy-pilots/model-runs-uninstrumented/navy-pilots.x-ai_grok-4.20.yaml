      - id: dce27061-2e4e-4cdc-b507-e6565bf77ed4
        name: United States Department of Defense (DoD)
    quote: |-
      I tried to help my colleague, Lou Elizondo, elevate the issue in the department and actually get it to the Secretary of Defense.
    text: |-
      Christopher Mellon tried to help Luis Elizondo elevate the UAP issue in the Department of Defense and get it to the Secretary of Defense.
  - id: 5513d93e-caa9-4900-bd62-3b02c0588234
    type: administrative
    speaker:
      id: 0d0e6dfa-65c4-44fc-baa4-372a0e4215bf
      name: Whitaker, Bill
    location: 00:10:51.9-00:11:08.4
    refs:
      - id: 634197a6-0b53-4336-8d80-78fb9c9275b0
        name: Mellon, Christopher
      - id: 0d0e6dfa-65c4-44fc-baa4-372a0e4215bf
        name: Whitaker, Bill
    quote: |-
      Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush, and had access to top-secret government programs.
    text: |-
      Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush and had access to top-secret government programmes.
  - id: dafe2286-74e3-4f17-9bee-92504952fe8a
    type: opinion
    speaker:
      id: 634197a6-0b53-4336-8d80-78fb9c9275b0
      name: Mellon, Christopher
    location: 00:11:08.4-00:11:18.7
    refs:
      - id: 634197a6-0b53-4336-8d80-78fb9c9275b0
        name: Mellon, Christopher
      - id: 6eeb35a4-3426-43be-9c9c-10fe57be500a
        name: Unidentified Aerial Phenomena (UAP)
      - id: dce27061-2e4e-4cdc-b507-e6565bf77ed4
        name: United States Department of Defense (DoD)
    quote: |-
      So it's not us, that's one thing we know. We know that? I could say that with a very high degree of confidence, in part because of the positions I held in the department, and I know the process.
    text: |-
      Christopher Mellon said with high confidence that the observed Unidentified Aerial Phenomena (UAP) are not US technology because of the positions he held in the Department of Defense and knowledge of the processes.
  - id: b2dd3646-71b3-4910-bf45-4eaa4f0f672f
    type: administrative
    speaker:
      id: 634197a6-0b53-4336-8d80-78fb9c9275b0
      name: Mellon, Christopher
    location: 00:11:18.7-00:11:46.1
    date: '2017-01-01'
    refs:
      - id: 634197a6-0b53-4336-8d80-78fb9c9275b0
        name: Mellon, Christopher
      - id: 45c68f97-e0aa-49cb-80b7-3eb685a98476
        name: Elizondo, Luis
      - id: 6eeb35a4-3426-43be-9c9c-10fe57be500a
        name: Unidentified Aerial Phenomena (UAP)
      - id: f78b53a2-f482-451a-84c6-3f3773444d70
        name: The New York Times
    quote: |-
      Mellon says he grew concerned nothing was being done about UAPs, so he decided to do something. In 2017, as a private citizen, he surreptitiously acquired the three Navy videos Elizondo had declassified and leaked them to The New York Times.
    text: |-
      In 2017 as a private citizen Christopher Mellon surreptitiously acquired the three Navy UAP videos declassified by Luis Elizondo and leaked them to The New York Times.
  - id: 1a87c4c2-2978-4bac-9f44-5c6dc488a9b4
    type: opinion
    speaker:
      id: 634197a6-0b53-4336-8d80-78fb9c9275b0
      name: Mellon, Christopher
    location: 00:11:26.2-00:11:46.1
    refs:
      - id: 634197a6-0b53-4336-8d80-78fb9c9275b0
        name: Mellon, Christopher
      - id: 6eeb35a4-3426-43be-9c9c-10fe57be500a
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      It's bizarre and unfortunate that someone like myself has to do something like that to get a national security issue like this on the agenda.
    text: |-
      Christopher Mellon said it is bizarre and unfortunate that he had to leak the Navy UAP videos to get a national security issue on the agenda.
  - id: 2f7570b2-c07b-4c1e-9f6f-deaeab753484
    type: opinion
    speaker:
      id: 634197a6-0b53-4336-8d80-78fb9c9275b0
      name: Mellon, Christopher
    location: 00:11:46.1-00:12:07.2
    refs:
      - id: 634197a6-0b53-4336-8d80-78fb9c9275b0
        name: Mellon, Christopher
      - id: 45c68f97-e0aa-49cb-80b7-3eb685a98476
        name: Elizondo, Luis
      - id: 3167eebf-db8c-4720-9cf6-92028c245d0d
        name: United States Congress
      - id: dce27061-2e4e-4cdc-b507-e6565bf77ed4
        name: United States Department of Defense (DoD)
      - id: 6eeb35a4-3426-43be-9c9c-10fe57be500a
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      We knew and understood that you had to go to the public, get the public interested to get Congress interested, to then circle back to the Defense Department and get them to start taking a look at it.
    text: |-
      Christopher Mellon and Luis Elizondo knew they had to go to the public to generate interest that would lead Congress to press the Department of Defense to address Unidentified Aerial Phenomena (UAP).
  - id: 7640c85d-c711-4aac-b059-571a9057c3f1
    type: administrative
    speaker:
      id: 0d0e6dfa-65c4-44fc-baa4-372a0e4215bf
      name: Whitaker, Bill
    location: 00:12:07.2-00:12:20.1
    date: '2021-08-01'
    refs:
      - id: dd72f7bb-6726-407c-9799-4f24da85c53d
        name: Pentagon
      - name: |-
          Advanced Aerospace Threat Identification Program (AATIP) [date_start=2008-01-01, date_end=2012-01-01]
