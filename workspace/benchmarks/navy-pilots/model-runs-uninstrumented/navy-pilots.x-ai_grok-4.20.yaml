        name: Unidentified Aerial Phenomena (UAP)
      - id: 0d0e6dfa-65c4-44fc-baa4-372a0e4215bf
        name: Whitaker, Bill
    quote: |-
      until finally, frustrated, he quit the Pentagon in 2017, but not before getting these three videos declassified.
    text: |-
      Luis Elizondo quit the Pentagon in 2017 after Advanced Aerospace Threat Identification Program (AATIP) funding ended but before leaving he got three UAP videos declassified.
  - id: 53e2f3c7-8947-4abc-8602-096c6a697358
    type: administrative
    speaker:
      id: 634197a6-0b53-4336-8d80-78fb9c9275b0
      name: Mellon, Christopher
    location: 00:10:39.5-00:10:57.5
    refs:
      - id: 634197a6-0b53-4336-8d80-78fb9c9275b0
        name: Mellon, Christopher
      - id: 45c68f97-e0aa-49cb-80b7-3eb685a98476
