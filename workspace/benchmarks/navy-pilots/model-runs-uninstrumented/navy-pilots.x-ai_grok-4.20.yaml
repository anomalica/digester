      - name: 2015 East Coast UAP encounters [date_start=2015-01-01, date_end=2015-12-31]
    quote: |-
      He told us his F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar, making it possible to zero in with infrared targeting cameras.
    text: |-
      Ryan Graves' F/A-18 squadron began seeing Unidentified Aerial Phenomena (UAP) hovering over restricted airspace southeast of Virginia Beach in 2014 after their jet's radar was updated, allowing zero-in with infrared targeting cameras.
  - id: 47e633f7-2de0-4978-95f1-b7284778f35e
    type: observation
    speaker:
      id: 9786180d-e6c3-4392-afc1-4115af01c6ed
      name: Graves, Ryan
    location: 00:04:29.7-00:04:38.6
    refs:
