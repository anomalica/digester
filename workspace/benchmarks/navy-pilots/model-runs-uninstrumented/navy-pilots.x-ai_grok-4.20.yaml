    text: |-
      Photographs taken in 2019 in the area southeast of Virginia Beach show objects the Pentagon confirms it cannot identify as Unidentified Aerial Phenomena (UAP).
  - id: 9057e44a-d363-415e-ae0a-9a2f87819efa
    type: observation
    speaker:
      id: 9786180d-e6c3-4392-afc1-4115af01c6ed
