        name: Unidentified Aerial Phenomena (UAP)
      - id: dd72f7bb-6726-407c-9799-4f24da85c53d
        name: Pentagon
    quote: |-
      This is a bizarre issue. The Pentagon and other branches of the military have a long history of sort of dismissing this. What makes you think that this time is going to be different? I mean, we're going to find out when we get that report. You know, there's a stigma on Capitol Hill. I mean, some of my colleagues are very interested in this topic and some kind of, you know, giggle when you bring it up. But I don't think we can allow the stigma to keep us from having an answer to a very fundamental question.
    text: |-
      Senator Marco Rubio said there is a stigma on Capitol Hill where some colleagues giggle when UAP is brought up but it should not prevent seeking answers.
  - id: a2522448-5750-47d8-b945-8722b6273978
    type: opinion
    speaker:
      id: b4805897-5ee3-43f5-ab04-99e16ef32bf0
      name: Rubio, Marco
    location: 00:13:12.2-00:13:35.4
    refs:
      - id: b4805897-5ee3-43f5-ab04-99e16ef32bf0
        name: Rubio, Marco
      - id: 6eeb35a4-3426-43be-9c9c-10fe57be500a
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      What do you want us to do about this? I want us to take it seriously and have a process to take it seriously. I want us to have a process to analyze the data. every time it comes in, that there be a place where this is cataloged and constantly analyzed until we get some answers. Maybe it has a very simple answer. Maybe it doesn't.
    text: |-
      Senator Marco Rubio wants a process to take Unidentified Aerial Phenomena (UAP) seriously by analysing incoming data that is catalogued and constantly reviewed until answers are obtained.
