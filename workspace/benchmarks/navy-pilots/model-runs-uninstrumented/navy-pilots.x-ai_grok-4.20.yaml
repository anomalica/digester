      - id: 6eeb35a4-3426-43be-9c9c-10fe57be500a
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      including this one, off the coast of Jacksonville, Florida in 2015, captured on a targeting camera by members of Graves' squadron. Look at that thing! It's rotating. My gosh! They're all going against the wind. The wind's 120 knots far west. Look at that thing, dude.
    text: |-
      During the 2015 East Coast UAP encounters, members of Ryan Graves' squadron captured footage off the coast of Jacksonville, Florida on 2015-01-01 of an object that appeared to be rotating and moving against a wind of approximately 220 kilometres per hour.
  - id: 234fbd49-5c5d-482a-a4e0-ad52050b874d
    type: opinion
    speaker:
      id: 9786180d-e6c3-4392-afc1-4115af01c6ed
      name: Graves, Ryan
    location: 00:05:25.4-00:05:33.2
    date: '2015-01-01'
    refs:
      - id: 9786180d-e6c3-4392-afc1-4115af01c6ed
        name: Graves, Ryan
      - name: 2015 East Coast UAP encounters [date_start=2015-01-01, date_end=2015-12-31]
      - id: 6eeb35a4-3426-43be-9c9c-10fe57be500a
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      You can sort of hear the surprise in their voices. You certainly can. They seem to have broke character a bit, and were just kind of amazed at what they were seeing.
    text: |-
      Ryan Graves said the pilots' voices in the 2015 East Coast UAP encounters footage conveyed surprise and they broke character because they were amazed at what they were seeing.
  - id: c7ce5209-dc9a-482d-b8e2-ad050d3813f6
    type: opinion
    speaker:
      id: 9786180d-e6c3-4392-afc1-4115af01c6ed
      name: Graves, Ryan
    location: 00:05:33.2-00:05:44.9
    date: '2015-01-01'
    refs:
      - id: 9786180d-e6c3-4392-afc1-4115af01c6ed
        name: Graves, Ryan
      - name: 2015 East Coast UAP encounters [date_start=2015-01-01, date_end=2015-12-31]
      - id: 6eeb35a4-3426-43be-9c9c-10fe57be500a
        name: Unidentified Aerial Phenomena (UAP)
      - id: 3d0c60cd-9245-424d-b891-55b8920d261e
        name: USA, Florida, Jacksonville
    quote: |-
      What do you think when you see something like this? This is a difficult one to explain. You have rotation, you have high altitudes, you have propulsion, right? I don't know. I don't know what it is, frankly.
    text: |-
      Ryan Graves said the object in the 2015 East Coast UAP encounters footage off Jacksonville is difficult to explain because it shows rotation, high altitude and propulsion.
  - id: 026dd585-7779-46d1-a6ce-04806c0fd288
    type: opinion
    speaker:
      id: 9786180d-e6c3-4392-afc1-4115af01c6ed
      name: Graves, Ryan
    location: 00:05:44.9-00:06:00.5
    refs:
      - id: 9786180d-e6c3-4392-afc1-4115af01c6ed
        name: Graves, Ryan
      - id: 6eeb35a4-3426-43be-9c9c-10fe57be500a
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      He told us pilots speculate they are one of three things, secret U.S. technology, an adversary spy vehicle, or something otherworldly. I'd say, you know, the highest probability is it's a threat observation program.
    text: |-
      Ryan Graves considers the highest probability explanation for the observed Unidentified Aerial Phenomena (UAP) is a threat observation programme.
  - id: d426422a-366e-4611-a302-af696087673e
    type: opinion
    speaker:
      id: 9786180d-e6c3-4392-afc1-4115af01c6ed
      name: Graves, Ryan
    location: 00:06:00.5-00:06:05.4
    refs:
      - id: 9786180d-e6c3-4392-afc1-4115af01c6ed
        name: Graves, Ryan
      - id: 6eeb35a4-3426-43be-9c9c-10fe57be500a
        name: Unidentified Aerial Phenomena (UAP)
    quote: Could it be Russian or Chinese technology? I don't see why not.
    text: |-
      Ryan Graves considers Russian or Chinese technology a possible explanation for the observed Unidentified Aerial Phenomena (UAP).
  - id: b21ccd26-5571-44d0-83c0-99f55e932996
    type: opinion
    speaker:
      id: 9786180d-e6c3-4392-afc1-4115af01c6ed
      name: Graves, Ryan
    location: 00:06:05.4-00:06:23.4
    refs:
      - id: 9786180d-e6c3-4392-afc1-4115af01c6ed
        name: Graves, Ryan
      - id: 6eeb35a4-3426-43be-9c9c-10fe57be500a
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      Are you alarmed? I am worried, frankly. You know, if these were tactical jets from another country that were hanging out up there, it would be a massive issue. But because it looks slightly different, we're not willing to actually look at the problem in the face. We're happy to just ignore the fact that these are out there watching us every day.
    text: |-
      Ryan Graves is worried about the observed Unidentified Aerial Phenomena (UAP) because they are watching every day and the difference in appearance prevents proper attention to the problem.
