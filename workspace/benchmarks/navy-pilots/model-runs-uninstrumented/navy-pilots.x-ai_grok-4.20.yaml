      - name: Tic Tac UAP
      - name: 2004 USS Nimitz UAP encounter [date_start=2004-11-14]
    quote: |-
      He said it was about the size of his F-18, with no markings, no wings, no exhaust plumes.
    text: |-
      David Fravor said the Tic Tac UAP in the 2004 USS Nimitz UAP encounter was about the size of his F/A-18, with no markings, no wings and no exhaust plumes.
  - id: e642a0a2-c71c-4c8c-a19b-fc70ee8ed595
    type: observation
    speaker:
      id: d09daf5f-bda2-4b56-bfb2-418133ca41b0
