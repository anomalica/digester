      - id: e67c59eb-d46c-4b1b-aaf2-45f6887ebf2a
        name: United States Navy
    quote: |-
      They combed through data and records and analyzed videos like this. A Navy aircrew struggles to lock onto a fast-moving object off the U.S. Atlantic coast in 2015.
    text: |-
      The Advanced Aerospace Threat Identification Program (AATIP) team analyzed videos of Unidentified Aerial Phenomena (UAP) observed by United States Navy personnel.
  - id: 3726b2be-ecfc-4e79-8b66-3557900d9150
    type: testimony
