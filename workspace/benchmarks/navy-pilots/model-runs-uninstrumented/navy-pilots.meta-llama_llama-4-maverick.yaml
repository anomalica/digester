      - id: 7803740f-c28e-4ff5-a421-2515949bd800
        name: USA, Virginia, Virginia Beach
    quote: |-
      He told us his F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar, making it possible to zero in with infrared targeting cameras.
    text: |-
      Ryan Graves' F/A-18 squadron began seeing Unidentified Aerial Phenomena (UAP) hovering over restricted airspace southeast of Virginia Beach in 2014 after they updated their jet's radar.
  - id: fa7f33fd-2a29-41f2-8a65-6ef897572abd
    type: opinion
    attestation: first_hand
    speaker:
      id: a65a93de-d005-4464-952b-8be402b74b9b
