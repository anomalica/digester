      - id: aacc00b2-dbbd-4089-bcdc-2f364150423e
        name: Advanced Aerospace Threat Identification Program (AATIP)
    quote: |-
      When Elizondo took over in 2010, he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members.
    text: |-
      Luis Elizondo focused on the national security implications of Unidentified Aerial Phenomena (UAP) documented by United States service members when he took over the Advanced Aerospace Threat Identification Program (AATIP) in 2010.
  - id: b49d22b9-3df6-4db0-a174-32ec5dc328ba
    type: testimony
    attestation: first_hand
    speaker:
      id: 3e4be3b9-4c7d-42cf-a46e-770cc8ca88b3
      name: Luis Elizondo
    location: 00:02:12.6-00:02:35.2
    refs:
      - id: 25b2b1a5-8cf7-47d8-b7f6-a702a37e15c9
        name: Unidentified Aerial Phenomena (UAP)
      - id: e67c59eb-d46c-4b1b-aaf2-45f6887ebf2a
        name: United States Navy
    quote: |-
      Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity. That's precisely what we're seeing.
    text: |-
      The Unidentified Aerial Phenomena (UAP) observed by United States Navy personnel can do approximately 960 to 1,100 kilometres per hour, evade radar, and travel through air and water with no obvious signs of propulsion, no wings, no control surfaces, and defy the natural effects of Earth's gravity.
  - id: 787cefc3-c39b-4598-84e3-8bb29c330aee
    type: administrative
    speaker:
