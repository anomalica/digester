    refs:
      - id: 3e4be3b9-4c7d-42cf-a46e-770cc8ca88b3
        name: Luis Elizondo
    quote: |-
      Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo.
    text: Luis Elizondo spent 20 years running military intelligence operations worldwide.
  - id: a164c394-7efc-43da-8804-d6f586ce0990
    type: administrative
    attestation: first_hand
    speaker:
      id: 3e4be3b9-4c7d-42cf-a46e-770cc8ca88b3
      name: Luis Elizondo
    location: 00:01:15.6-00:01:24.1
    date: '2008-01-01'
    refs:
      - id: 3e4be3b9-4c7d-42cf-a46e-770cc8ca88b3
        name: Luis Elizondo
      - id: aacc00b2-dbbd-4089-bcdc-2f364150423e
        name: Advanced Aerospace Threat Identification Program (AATIP)
    quote: |-
      He hadn't given UFOs a second thought until 2008. That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP.
    text: |-
      Luis Elizondo was asked to join the Advanced Aerospace Threat Identification Program (AATIP) in 2008.
  - id: 10185026-e65c-4b18-9c3e-efc4ee07de05
    type: testimony
    attestation: first_hand
    speaker:
      id: 3e4be3b9-4c7d-42cf-a46e-770cc8ca88b3
      name: Luis Elizondo
    location: 00:01:24.1-00:01:34.3
    refs:
      - id: aacc00b2-dbbd-4089-bcdc-2f364150423e
        name: Advanced Aerospace Threat Identification Program (AATIP)
      - id: 25b2b1a5-8cf7-47d8-b7f6-a702a37e15c9
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      The mission of AATIP was quite simple. It was to collect and analyse information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs. We call them UAPs.
    text: |-
      The mission of the Advanced Aerospace Threat Identification Program (AATIP) was to collect and analyze information involving Unidentified Aerial Phenomena (UAP).
  - id: 3177f516-6fd4-42e6-8621-7136a1798e6d
    type: administrative
    speaker:
      id: e671adad-7d1f-4c96-a330-8d07b768477d
