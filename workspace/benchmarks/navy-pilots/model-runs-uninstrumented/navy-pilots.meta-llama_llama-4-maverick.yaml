      The Unidentified Aerial Phenomena (UAP) observed by David Fravor and Alex Dietrich was about the size of an F/A-18, with no markings, no wings, and no exhaust plumes.
  - id: 01127989-096d-40f4-a8bd-f931754c73f7
    type: observation
    attestation: first_hand
    speaker:
      id: 561110e9-f8ea-46a2-86a6-cf080a4f2360
      name: David Fravor
    location: 00:08:17.9-00:08:30.5
    refs:
      - id: 561110e9-f8ea-46a2-86a6-cf080a4f2360
        name: David Fravor
      - id: 6a709cf1-b0f9-4095-8703-cd1783dea131
        name: Alex Dietrich
      - id: 25b2b1a5-8cf7-47d8-b7f6-a702a37e15c9
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      The tic-tac's still pointing north-south. It goes and just turns abruptly and starts mirroring me. So as I'm coming down, it starts coming up. So it's mimicking your moves. Yeah, it was aware we were there.
    text: |-
      The Unidentified Aerial Phenomena (UAP) observed by David Fravor and Alex Dietrich mimicked Fravor's moves and was aware of their presence.
  - id: df3a8df0-041c-4bcb-b608-f21409644cca
    type: observation
    attestation: first_hand
