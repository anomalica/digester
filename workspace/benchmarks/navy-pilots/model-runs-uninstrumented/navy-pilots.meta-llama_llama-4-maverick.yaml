        name: Advanced Aerospace Threat Identification Program (AATIP)
      - id: dc76bcec-466d-4681-96ad-9143a0a87968
        name: Harry Reid
    quote: |-
      Buried away in the Pentagon, AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs.
    text: |-
      The Advanced Aerospace Threat Identification Program (AATIP) was part of a 22 million dollar program sponsored by Harry Reid.
  - id: 1d1c0747-1d52-4631-9131-eb4f517a7dde
    type: administrative
    speaker:
      id: e671adad-7d1f-4c96-a330-8d07b768477d
      name: Bill Whitaker
    location: 00:02:01.6-00:02:12.6
    date: '2010-01-01'
    refs:
      - id: 3e4be3b9-4c7d-42cf-a46e-770cc8ca88b3
        name: Luis Elizondo
      - id: 25b2b1a5-8cf7-47d8-b7f6-a702a37e15c9
