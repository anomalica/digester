    location: 00:07:14.4-00:07:39.3
    date: '2004-11-14'
    refs:
      - id: dfd3666c-bcfa-4e95-9de8-cd061948fd88
        name: USS Nimitz
      - id: dd50e192-3d71-4509-a442-bdc492c1dbd3
        name: USA, California, San Diego
      - id: 14f9438e-e723-47f8-a512-11e62e14287c
        name: 2004 USS Nimitz UAP encounter
    quote: |-
      It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego. For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 80,000 feet in less than a second. On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate.
    text: |-
      The USS Nimitz Carrier Strike Group was training approximately 180 kilometres southwest of San Diego on 2004-11-14.
  - id: 1c6895ae-34d2-40d3-9318-cf87bb09664a
    type: observation
    attestation: first_hand
    speaker:
      id: 561110e9-f8ea-46a2-86a6-cf080a4f2360
      name: David Fravor
    location: 00:07:55.9-00:08:09.7
    refs:
      - id: 561110e9-f8ea-46a2-86a6-cf080a4f2360
        name: David Fravor
      - id: 6a709cf1-b0f9-4095-8703-cd1783dea131
