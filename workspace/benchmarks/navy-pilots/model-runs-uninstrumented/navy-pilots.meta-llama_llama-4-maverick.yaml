    text: |-
      Pilots training off the Atlantic coast see Unidentified Aerial Phenomena (UAP) every day.
  - id: 3c118f19-f69e-441b-b763-7791fafd6b73
    type: administrative
    speaker:
      id: e671adad-7d1f-4c96-a330-8d07b768477d
