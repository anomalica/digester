      Ryan Graves observed no exhaust plume on the Unidentified Aerial Phenomena (UAP) off the Atlantic coast.
  - id: 9f18a4c5-ccac-463f-bdcb-657d4d9dac42
    type: testimony
    attestation: second_hand
    speaker:
      id: e671adad-7d1f-4c96-a330-8d07b768477d
