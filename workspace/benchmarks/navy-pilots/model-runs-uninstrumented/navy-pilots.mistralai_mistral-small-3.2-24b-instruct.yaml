      - id: 1818ca8e-eec7-4652-9476-c94f8b696f14
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      So it's not us, that's one thing we know. Bill Whitaker: We know that? Christopher Mellon: I could say that with a very high degree of confidence, in part because of the positions I held in the department, and I know the process.
    text: |-
      Christopher Mellon stated that it is not the United States behind the Unidentified Aerial Phenomena (UAP) with a very high degree of confidence.
  - id: 0e0d4a21-fac0-4021-95e0-76c7d5de1e33
