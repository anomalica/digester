      The United States government has officially confirmed for the record that Unidentified Aerial Phenomena (UAP) are real.
  - id: 3bf57bfc-3156-413c-ade6-faaf523fcf91
    type: administrative
    speaker:
      name: Bill Whitaker
    location: 00:01:02.4-00:01:11.5
    date: '2021-05-17'
    refs:
      - name: Luis Elizondo
    quote: |-
      Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo.
    text: |-
      Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo.
  - id: 5bdc8261-50a3-4416-b0f0-4a730eedfa06
    type: administrative
    speaker:
      name: Bill Whitaker
    location: 00:01:11.5-00:01:24.1
    date: '2021-05-17'
    refs:
      - name: Luis Elizondo
      - id: 1f2ea67b-263f-4202-9d1e-fed6a35a7d57
        name: Advanced Aerospace Threat Identification Program (AATIP)
    quote: |-
      He hadn't given UFOs a second thought until 2008. That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP.
    text: |-
      Luis Elizondo joined the Advanced Aerospace Threat Identification Program (AATIP) at the Pentagon in 2008.
  - id: deff97fc-c797-443e-a54b-f22b76f2c07d
    type: administrative
    speaker:
      name: Luis Elizondo
    location: 00:01:24.1-00:01:35.9
    date: '2021-05-17'
    refs:
      - id: 1f2ea67b-263f-4202-9d1e-fed6a35a7d57
        name: Advanced Aerospace Threat Identification Program (AATIP)
      - id: 1818ca8e-eec7-4652-9476-c94f8b696f14
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs. We call them UAPs.
    text: |-
      The mission of the Advanced Aerospace Threat Identification Program (AATIP) was to collect and analyze information involving anomalous aerial vehicles, also known as Unidentified Aerial Phenomena (UAP).
  - id: ee23d02f-7dae-49c6-b867-ef86a29c9340
    type: administrative
    speaker:
      name: Bill Whitaker
    location: 00:02:01.6-00:02:12.6
    date: '2021-05-17'
    refs:
      - name: Luis Elizondo
      - id: 1f2ea67b-263f-4202-9d1e-fed6a35a7d57
        name: Advanced Aerospace Threat Identification Program (AATIP)
      - id: 1818ca8e-eec7-4652-9476-c94f8b696f14
        name: Unidentified Aerial Phenomena (UAP)
      - name: United States service members
    quote: |-
      When Elizondo took over in 2010, he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members.
    text: |-
      Luis Elizondo focused on the national security implications of Unidentified Aerial Phenomena (UAP) documented by U.S. service members when he took over the Advanced Aerospace Threat Identification Program (AATIP) in 2010.
  - id: 31eade8d-48d3-4245-ab65-755957845809
    type: observation
    speaker:
      name: Luis Elizondo
    location: 00:02:12.6-00:02:35.2
    date: '2021-05-17'
    refs:
      - name: Luis Elizondo
      - id: 1818ca8e-eec7-4652-9476-c94f8b696f14
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity. That's precisely what we're seeing.
    text: |-
      Luis Elizondo described a technology that can do 600 to 700 G-forces, fly at approximately 21,000 kilometres per hour, evade radar, and fly through air and water and possibly space, with no obvious signs of propulsion, no wings, no control surfaces, and can defy the natural effects of Earth's gravity.
  - id: 58e50274-ff55-4e87-925b-09333982a51b
    type: administrative
    speaker:
      name: Bill Whitaker
    location: 00:02:37.0-00:02:57.7
    date: '2021-05-17'
    refs:
      - name: Luis Elizondo
      - id: 1f2ea67b-263f-4202-9d1e-fed6a35a7d57
        name: Advanced Aerospace Threat Identification Program (AATIP)
      - id: 1818ca8e-eec7-4652-9476-c94f8b696f14
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      Elizondo tells us AATIP was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time. They combed through data and records and analyzed videos like this.
    text: |-
      Luis Elizondo led a team of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time, to analyze data and records and videos related to Unidentified Aerial Phenomena (UAP).
