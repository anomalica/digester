    refs:
      - name: Luis Elizondo
      - id: b89b5a43-b42d-4848-8a46-4fa1ee024b79
        name: 2004 USS Nimitz UAP encounter
    quote: |-
      The air crew filed reports. Then, like the mysterious flying object, the Nimitz encounter disappeared. Nothing was said or done officially for five years until Lou Elizondo came across the story and investigated.
    text: |-
      The air crew filed reports about the 2004 USS Nimitz UAP encounter, but nothing was said or done officially for five years until Luis Elizondo came across the story and investigated.
  - id: e4e83208-8cea-4818-9bbf-0549ba7854ec
    type: testimony
    speaker:
      name: Luis Elizondo
    location: 00:10:13.2-00:10:27.7
    date: '2021-05-17'
    refs:
      - name: Luis Elizondo
      - name: United States government
      - id: 1818ca8e-eec7-4652-9476-c94f8b696f14
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      We spend millions of dollars in training these pilots, and they are seeing something that they can't explain. Furthermore, that information's being backed up on electro-optical data, like gun camera footage, and by radar data. Now, to me, that's compelling.
    text: |-
      Luis Elizondo stated that the United States government spends millions of dollars in training these pilots, and they are seeing something that they can't explain, which is backed up on electro-optical data and radar data.
  - id: 1323e8c9-e11a-4b70-88a8-05a5c14bfe04
