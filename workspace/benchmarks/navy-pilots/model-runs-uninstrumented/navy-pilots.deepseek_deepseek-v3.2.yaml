    location: 00:03:52.6-00:04:06.2
    refs:
      - id: c27dc040-5853-4fc9-903e-77ee4c2e4102
        name: Elizondo, Luis
      - name: 'topic: Unidentified Aerial Phenomena (UAP)'
    quote: |-
      Ultimately, when you have exhausted all those what-ifs and you're still left with the fact that this is in our airspace and it's real, that's when it becomes compelling and that's when it becomes problematic.
    text: |-
      Luis Elizondo considers it compelling and problematic when all potential explanations are exhausted and an unidentified object is still confirmed to be real and in U.S. airspace.
