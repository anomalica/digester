    refs:
      - id: c27dc040-5853-4fc9-903e-77ee4c2e4102
        name: Elizondo, Luis
      - name: 'project: Advanced Aerospace Threat Identification Program (AATIP)'
      - name: 'topic: Unidentified Aerial Phenomena (UAP)'
    quote: |-
      We're not just simply jumping to a conclusion that's saying, oh, that's a UAP out there. We're going through our due diligence. Is it some sort of new type of cruise missile technology that China has developed? Is it some sort of high-altitude balloon that's conducting reconnaissance?
    text: |-
      Luis Elizondo says the AATIP programme goes through due diligence and considers potential explanations like new Chinese cruise missile technology or high-altitude reconnaissance balloons.
  - id: 90280792-f931-4b45-851c-d080e61a7fe5
    type: opinion
    attestation: first_hand
    speaker:
      id: c27dc040-5853-4fc9-903e-77ee4c2e4102
