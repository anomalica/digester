      - id: 1a8ef720-c8a1-4b31-90d4-ac0c4c7b616f
        name: Guantanamo
    quote: |-
      Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo.
    text: |-
      Luis Elizondo spent 20 years running military intelligence operations in Afghanistan and Guantanamo.
  - id: ee694187-5e83-4598-b3b7-0d03b5438993
    type: administrative
    speaker:
      id: 4d38acfd-b878-4bc5-ae01-be464ad743e8
      name: Whitaker, Bill
    location: 00:01:11.5-00:01:15.6
    refs:
      - id: 030685b6-9863-488d-bb94-d9358346bc1d
        name: Elizondo, Luis
      - id: 1cff19aa-bb91-4497-bb6d-f0419231c445
        name: Advanced Aerospace Threat Identification Program (AATIP)
    quote: |-
      He hadn't given UFOs a second thought until 2008. That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP.
    text: |-
      Luis Elizondo joined the Advanced Aerospace Threat Identification Program (AATIP) at the Pentagon in 2008.
  - id: 018cfdb8-6f6e-4933-8941-aa2c55a23476
    type: administrative
    attestation: second_hand
    speaker:
      id: 030685b6-9863-488d-bb94-d9358346bc1d
      name: Elizondo, Luis
    location: 00:01:24.1-00:01:34.3
    refs:
      - id: 1cff19aa-bb91-4497-bb6d-f0419231c445
        name: Advanced Aerospace Threat Identification Program (AATIP)
      - id: 22974813-b43b-4280-b029-2174a8db9523
        name: Anomalous Aerial Vehicle (AAV)
    quote: |-
      The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs. We call them UAPs.
    text: |-
      The mission of the Advanced Aerospace Threat Identification Program (AATIP) was to collect and analyse information involving Anomalous Aerial Vehicles (AAV).
  - id: e1991659-be70-46ea-9d8b-dfe247b8f6e3
