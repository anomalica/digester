    text: |-
      Luis Elizondo focused on the national security implications of Unidentified Aerial Phenomena (UAP) documented by United States service members when he took over AATIP in 2010.
  - id: 34a5c47c-39c4-46d6-b17d-b29e98ce6f42
    type: opinion
    attestation: first_hand
    speaker:
      id: 9b53764f-f89b-41ae-b275-cb97381dc5b7
      name: Luis Elizondo
    location: 00:02:12.6-00:02:35.2
    refs:
      - id: b17a6ff1-28a8-467c-8f57-1b22f71e360f
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity. That's precisely what we're seeing.
    text: |-
      Some observed UAP have capabilities including doing approximately 970 to 1,130 kilometre-per-hour speeds, evading radar, and flying through air and water with no obvious signs of propulsion, no wings, no control surfaces, and defying the natural effects of Earth's gravity.
