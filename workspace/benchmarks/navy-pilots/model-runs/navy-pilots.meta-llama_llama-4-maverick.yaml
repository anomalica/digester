      - id: b17a6ff1-28a8-467c-8f57-1b22f71e360f
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      Lieutenant Graves told us pilots training off the Atlantic coast see things like that all the time. Ryan Graves: Every day. Every day for at least a couple of years.
    text: |-
      Ryan Graves observed Unidentified Aerial Phenomena (UAP) every day for at least a couple of years while training off the Atlantic coast.
