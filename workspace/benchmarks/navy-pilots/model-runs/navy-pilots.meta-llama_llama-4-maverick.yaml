        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      So as we're looking at this, her backseater says, hey, Skipper, do you? And about that got out, I said, dude, do you see that thing down there? And we saw this little white tic-tac-looking object. And it's just kind of moving above the whitewater area.
    text: |-
      David Fravor and Alex Dietrich observed a small white object, described as 'Tic Tac'-shaped, moving above a whitewater area during the 2004 USS Nimitz UAP encounter.
