    text: Marco Rubio considers any object entering restricted airspace a threat.
  - id: b548382a-b177-4c3b-92d9-1211971144d6
    type: opinion
    attestation: first_hand
    speaker:
      id: a3a7c467-33b4-4654-803d-12104b4605cc
      name: Ryan Graves
    location: 00:06:07.0-00:06:18.5
    refs:
      - id: a3a7c467-33b4-4654-803d-12104b4605cc
        name: Ryan Graves
      - id: b17a6ff1-28a8-467c-8f57-1b22f71e360f
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      I am worried, frankly. You know, if these were tactical jets from another country that were hanging out up there, it would be a massive issue. But because it looks slightly different, we're not willing to actually look at the problem in the face. We're happy to just ignore the fact that these are out there watching us every day.
    text: |-
      Ryan Graves is worried about the implications of Unidentified Aerial Phenomena (UAP) sightings.
  - id: 0c20e02e-5993-4338-b87d-b366a89263dd
    type: testimony
    attestation: first_hand
    speaker:
