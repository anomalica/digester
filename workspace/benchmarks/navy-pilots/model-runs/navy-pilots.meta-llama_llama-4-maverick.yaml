        name: 2004 USS Nimitz UAP encounter
    quote: |-
      It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego. For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 24,000 metres in less than a second. On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate.
    text: |-
      The USS Nimitz Carrier Strike Group was training approximately 180 kilometres southwest of San Diego on 2004-11-14.
