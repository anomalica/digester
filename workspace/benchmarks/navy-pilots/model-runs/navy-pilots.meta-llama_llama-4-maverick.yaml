    quote: |-
      In 2017, as a private citizen, he surreptitiously acquired the three Navy videos Elizondo had declassified and leaked them to The New York Times.
    text: |-
      Christopher Mellon leaked three Navy videos of Unidentified Aerial Phenomena (UAP) to The New York Times in 2017.
  - id: 87efadfa-abab-4a8e-9dcd-30a0d69dc992
