    quote: |-
      We knew and understood that you had to go to the public, get the public interested to get Congress interested, to then circle back to the Defense Department and get them to start taking a look at it.
    text: |-
      Christopher Mellon's strategy was to engage the public in UAP issues in order to generate Congressional interest, which would then pressure the Department of Defence to take the matter seriously.
