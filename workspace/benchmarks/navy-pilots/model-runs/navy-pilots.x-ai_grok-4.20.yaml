    quote: |-
      It's the story of the U.S. government's grudging acknowledgement of Unidentified Aerial Phenomena, UAP, more commonly known as ufos after decades of public denial the pentagon now admits there's something out there and the u.s senate wants to know what it is
    text: |-
      During 60 Minutes (CBS) 2021-05-17 Navy pilots describe encounters with UFOs, Bill Whitaker introduces the topic of the United States government's acknowledgement of Unidentified Aerial Phenomena (UAP).
