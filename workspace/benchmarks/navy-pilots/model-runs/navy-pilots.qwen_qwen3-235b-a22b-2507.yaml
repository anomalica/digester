        name: Rubio, Marco
    quote: Anything that enters an airspace that's not supposed to be there is a threat.
    text: |-
      Marco Rubio believes any object in restricted airspace that is not supposed to be there constitutes a threat.
  - id: fd7ac5a6-5642-474c-9706-2ae0fd6ac608
    type: opinion
    speaker:
      id: 9998efcc-00bb-40e4-918b-dfbe8ceddef5
