      - id: 778a1cbd-7dd1-4bff-9189-6f77c6163988
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      I want us to take it seriously and have a process to take it seriously. I want us to have a process to analyze the data. every time it comes in, that there be a place where this is cataloged and constantly analyzed until we get some answers.
    text: |-
      Marco Rubio wants a serious and systematic process in place to analyse Unidentified Aerial Phenomena (UAP) data as it comes in.
