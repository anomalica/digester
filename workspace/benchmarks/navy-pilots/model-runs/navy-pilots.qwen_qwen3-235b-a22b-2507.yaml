    quote: |-
      I could say that with a very high degree of confidence, in part because of the positions I held in the department, and I know the process.
    text: |-
      Christopher Mellon asserts with high confidence that the observed Unidentified Aerial Phenomena (UAP) are not of U.S. origin.
  - id: 0a315d5f-95ac-436c-804f-ab806c606b23
    type: opinion
    attestation: first_hand
    speaker:
      id: 0c6bf449-b878-4f28-9b10-1e3319ad94a8
