      - id: 3f31dc7d-296e-4e23-8d5f-7772462bff3d
        name: Department of Defense (DoD)
    quote: |-
      He joined forces with now civilian Lou Elizondo, and they started to tell their story to anybody who would listen, to newspapers, the History Channel, to members of Congress. We knew and understood that you had to go to the public, get the public interested to get Congress interested, to then circle back to the Defense Department and get them to start taking a look at it.
    text: |-
      Christopher Mellon and Luis Elizondo engaged the public, media, and Congress to pressure the Department of Defense to take Unidentified Aerial Phenomena (UAP) seriously.
