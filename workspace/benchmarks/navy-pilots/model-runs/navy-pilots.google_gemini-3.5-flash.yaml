      David Fravor: The tic-tac's still pointing north-south. It goes and just turns abruptly and starts mirroring me. So as I'm coming down, it starts coming up. Bill Whitaker: So it's mimicking your moves. David Fravor: Yeah, it was aware we were there.
    text: |-
      During the November 2004 USS Nimitz UAP encounter, the Unidentified Aerial Phenomenon mimicked the flight movements of David Fravor's F/A-18 Hornet, appearing actively aware of the jet's presence.
