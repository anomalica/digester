    quote: |-
      This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month.
    text: |-
      In December 2020, Senator Marco Rubio, while serving as Chairman of the United States Senate Select Committee on Intelligence, requested that the Director of National Intelligence and the Department of Defense present Congress with an unclassified report on Unidentified Aerial Phenomena.
  - id: 344f54e1-b669-462d-90b9-9b6a138b80f4
    type: opinion
    speaker:
      id: c1f493d5-102c-459c-9915-f50dc2145887
      name: Rubio, Marco
    location: 00:13:12.2-00:13:25.9
    date: '2021-05-17'
    refs:
      - id: c1f493d5-102c-459c-9915-f50dc2145887
        name: Rubio, Marco
      - id: a997d645-9a18-4f2e-80e1-eb2875d047e3
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      I want us to take it seriously and have a process to take it seriously. I want us to have a process to analyze the data. every time it comes in, that there be a place where this is cataloged and constantly analyzed until we get some answers.
    text: |-
      Senator Marco Rubio believes the United States government should take Unidentified Aerial Phenomena seriously and develop an official, ongoing process to compile and analyse incoming sensor data.
