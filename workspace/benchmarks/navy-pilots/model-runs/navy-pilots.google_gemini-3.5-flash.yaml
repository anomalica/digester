    quote: |-
      The government has ignored it, at least publicly, since closing its Project Blue Book investigation in 1969. But that began to change after an incident off Southern California in 2004
    text: |-
      The United States government publicly ignored Unidentified Aerial Phenomena since terminating Project Blue Book in 1969, until a 2004 incident off Southern California.
