      This past August, the Pentagon resurrected AATIP. It's now called the UAP Task Force.
    text: |-
      In August 2020, the United States Department of Defense established the Unidentified Aerial Phenomena Task Force, effectively resurrecting the mission of the Advanced Aerospace Threat Identification Program.
