    quote: |-
      Christopher Mellon: So it's not us, that's one thing we know. Bill Whitaker: We know that? Christopher Mellon: I could say that with a very high degree of confidence, in part because of the positions I held in the department, and I know the process.
    text: |-
      Christopher Mellon is highly confident that the observed Unidentified Aerial Phenomena do not belong to secret United States military technology programs.
