    quote: |-
      For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 80,000 feet in less than a second.
    text: |-
      During the November 2004 USS Nimitz UAP encounter, the radar on the USS Princeton detected multiple Unidentified Aerial Phenomena descending from approximately 24,000 metres in less than a second.
