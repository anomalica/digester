        name: United States Department of Defense
    quote: |-
      The air crew filed reports. Then, like the mysterious flying object, the Nimitz encounter disappeared. Nothing was said or done officially for five years until Lou Elizondo came across the story and investigated.
    text: |-
      No official investigation or action was pursued by the United States Department of Defense regarding the USS Nimitz encounter for five years, until Luis Elizondo discovered the case in 2009.
