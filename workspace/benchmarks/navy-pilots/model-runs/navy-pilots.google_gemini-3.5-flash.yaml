      AATIP's funding was eliminated in 2012, but Elizondo says he and a handful of others kept the mission alive.
    text: |-
      Funding for the Advanced Aerospace Threat Identification Program was eliminated in 2012, though Luis Elizondo and others continued the mission informally.
