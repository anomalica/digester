        name: Dietrich, Alex
    quote: |-
      On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate. They found an area of roiling white water the size of a 737 in an otherwise calm blue sea.
    text: |-
      During the November 2004 USS Nimitz UAP encounter, David Fravor and Alex Dietrich were diverted to investigate and located an area of roiling white water the size of a Boeing 737 aircraft in the ocean.
