    quote: |-
      We knew and understood that you had to go to the public, get the public interested to get Congress interested, to then circle back to the Defense Department and get them to start taking a look at it.
    text: |-
      Christopher Mellon and Luis Elizondo deliberately engaged the public to pressure the United States Congress, intending to compel the Department of Defense (DoD) to formally investigate Unidentified Aerial Phenomena (UAP).
