    quote: |-
      Then, like the mysterious flying object, the Nimitz encounter disappeared. Nothing was said or done officially for five years until Lou Elizondo came across the story and investigated.
    text: |-
      No official investigation was launched into the 2004 USS Nimitz UAP encounter for five years, until Luis Elizondo reviewed and investigated the case files.
  - id: b159bdaf-f014-45f7-9ec1-55c8d2ed7527
    type: opinion
    attestation: second_hand
    speaker:
      id: 90aa2632-7e86-435a-b6fc-1ba93e405f00
      name: Elizondo, Luis
    location: 00:10:13.2-00:10:25.3
    date: '2021-05-17'
    refs:
      - id: 90aa2632-7e86-435a-b6fc-1ba93e405f00
        name: Elizondo, Luis
      - id: 3c598bc0-ddcd-4ed2-990d-c6ef8797f80b
        name: United States Navy
      - id: 494e24b7-fe1e-4ac0-80e9-bd8499b50bcb
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      We spend millions of dollars in training these pilots, and they are seeing something that they can't explain. Furthermore, that information's being backed up on electro-optical data... and by radar data. Now, to me, that's compelling.
    text: |-
      Luis Elizondo considers the combination of United States Navy pilot eyewitness testimony, electro-optical gun camera footage, and radar data regarding Unidentified Aerial Phenomena (UAP) to be compelling evidence of real, unexplained contacts.
  - id: c974d2d0-0906-452e-bfe5-a91406449108
