    text: |-
      In December 2020, Marco Rubio formally requested the Office of the Director of National Intelligence (ODNI) and the Department of Defense (DoD) to submit an unclassified report on Unidentified Aerial Phenomena (UAP) to the United States Congress.
  - id: ccaebaaf-3077-4095-8e1b-0301e35e2fc9
    type: opinion
    attestation: first_hand
    speaker:
      id: 4d95b54f-8d59-41cc-9890-83a553df272e
