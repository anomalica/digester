      Inside the Pentagon, his findings were met with skepticism. AATIP's funding was eliminated in 2012...
    text: |-
      Funding for the Advanced Aerospace Threat Identification Program (AATIP) was terminated in 2012 due to scepticism from United States Department of Defense (DoD) officials.
  - id: 108c9c1c-4d6f-4430-8aef-d6131e23fd38
