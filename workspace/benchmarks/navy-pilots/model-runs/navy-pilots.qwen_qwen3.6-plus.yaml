      ...but Elizondo says he and a handful of others kept the mission alive until finally, frustrated, he quit the Pentagon in 2017...
    text: |-
      Despite the 2012 termination of the Advanced Aerospace Threat Identification Program (AATIP), Luis Elizondo and a small team continued the mission in secret until his resignation from the Department of Defense (DoD) in 2017.
