    quote: |-
      I want us to take it seriously and have a process... I want us to have a process to analyze the data every time it comes in, that there be a place where this is cataloged and constantly analyzed until we get some answers.
    text: |-
      Marco Rubio advocates for the establishment of a permanent, standardised process within the Department of Defense (DoD) to catalogue and continuously analyse Unidentified Aerial Phenomena (UAP) data.
