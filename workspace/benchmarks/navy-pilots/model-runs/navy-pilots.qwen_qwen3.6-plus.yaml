    quote: |-
      He joined forces with now civilian Lou Elizondo, and they started to tell their story to anybody who would listen, to newspapers, the History Channel, to members of Congress.
    text: |-
      Christopher Mellon and Luis Elizondo actively promoted awareness of Unidentified Aerial Phenomena (UAP) through media outlets and meetings with members of the United States Congress.
  - id: dedd585e-74d6-40f7-9673-b63e9d36996c
