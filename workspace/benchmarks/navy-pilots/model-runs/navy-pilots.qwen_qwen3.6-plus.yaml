    text: |-
      In 2014, a United States Navy F/A-18 squadron commanded by Ryan Graves observed Unidentified Aerial Phenomena (UAP) hovering over restricted airspace southeast of Virginia Beach after upgrading their radar systems to include infrared targeting capabilities.
