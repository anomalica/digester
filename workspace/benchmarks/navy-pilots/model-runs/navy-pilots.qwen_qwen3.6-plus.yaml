    text: |-
      Marco Rubio acknowledges a political stigma on Capitol Hill regarding Unidentified Aerial Phenomena (UAP) research, but insists institutionalised mockery must not prevent official analysis.
  - id: 4bd3ab0f-6d58-487b-a96c-6c6a1c2edd59
    type: opinion
    attestation: first_hand
    speaker:
      id: 4d95b54f-8d59-41cc-9890-83a553df272e
