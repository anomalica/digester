    quote: |-
      In 2017, as a private citizen, he surreptitiously acquired the three Navy videos Elizondo had declassified and leaked them to The New York Times.
    text: |-
      In 2017, Christopher Mellon acquired and transmitted three declassified United States Navy videos to The New York Times to force public acknowledgement of the national security issue surrounding Unidentified Aerial Phenomena (UAP).
