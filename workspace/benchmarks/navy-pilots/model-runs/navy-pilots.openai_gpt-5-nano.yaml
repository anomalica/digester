infrastructure_claims:
  - id: 7be003fc-c5b9-4256-93b5-e4e44b53d4cc
    type: observation
    attestation: second_hand
    speaker:
      id: 41c94c11-d654-43bd-9bbf-ab0892501852
      name: Mellon, Christopher
    location: 00:11:46.1-00:12:07.2
    date: '2011-01-01'
    refs:
      - id: a067ece9-8fc5-4a71-a8c0-f3698e5afaef
        name: The New York Times
      - id: d4dcf696-8408-4b88-8950-d79004641858
        name: History Channel
      - id: 5b93f1af-71d9-4c0d-a2a6-5fdea2b47ed7
        name: United States Congress
    quote: |-
      Mellon says he grew concerned nothing was being done about UAPs, so he decided to do something. In 2017, as a private citizen, he surreptitiously acquired the three Navy videos Elizondo had declassified and leaked them to The New York Times. It's bizarre and unfortunate that someone like myself has to do something like that to get a national security issue like this on the agenda. He joined forces with now civilian Lou Elizondo, and they started to tell their story to anybody who would listen, to newspapers, the History Channel, to members of Congress.
    text: |-
      Christopher Mellon and Louis Elizondo began sharing their story with newspapers, the History Channel, and members of Congress to generate public and legislative interest in UAP.
