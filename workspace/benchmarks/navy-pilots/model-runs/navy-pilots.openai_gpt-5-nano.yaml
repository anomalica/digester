        name: Unidentified Flying Object (UFO)
    quote: |-
      Buried away in the Pentagon, AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs.
    text: |-
      AATIP was part of a US$22 million programme sponsored by then Senate Majority Leader Harry Reid to investigate UFOs.
