      - id: 1a87a244-4219-42ec-aa5d-6962c5d95f13
        name: Elizondo, Luis
      - id: 5aea9855-6e35-40b2-b5cb-2c32074e2ff8
        name: Unidentified Flying Object (UFO)
    quote: |-
      That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP.
    text: |-
      Luis Elizondo was asked to join the Advanced Aerospace Threat Identification Program (AATIP) at the Pentagon in 2008.
  - id: 3468fabf-89ec-44cc-840b-d3790d7ec8a7
    type: observation
    attestation: first_hand
    speaker:
      id: 1a87a244-4219-42ec-aa5d-6962c5d95f13
      name: Elizondo, Luis
    location: 00:01:24.1-00:01:34.3
    date: '2008-01-01'
    refs:
      - id: aebfebd7-4ec0-47d0-a8ce-a42a308955ad
        name: Advanced Aerospace Threat Identification Program (AATIP)
      - id: 5aea9855-6e35-40b2-b5cb-2c32074e2ff8
        name: Unidentified Flying Object (UFO)
      - id: 1a847181-75c8-411a-b6d6-58dc5e5f9da4
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs. We call them UAPs.
    text: |-
      The mission of the Advanced Aerospace Threat Identification Program (AATIP) was to collect and analyse information involving anomalous aerial vehicles, which are commonly referred to as UFOs and called UAPs.
  - id: 316e48c2-4921-4555-aec4-c49df85fa5d0
