      - id: 26d7a63c-9239-445d-b92d-39f767a08b1f
        name: F/A-18
      - id: 96b98f77-3f80-43d5-a206-407b68cca478
        name: USS Nimitz
    quote: |-
      Fravor, and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate. They found an area of roiling white water the size of a 737... the tic-tac's still pointing north-south.
    text: |-
      David Fravor, who was in command of the F-18 squadron on the USS Nimitz, described the encounter and the tic-tac object.
