        name: F/A-18
    quote: |-
      They found an area of roiling white water the size of a 737 in an otherwise calm blue sea.
    text: |-
      The area of roiling white water observed during the encounter was described as the area the size of a Boeing 737.
  - id: b8623cf7-8e41-4af8-87f4-d1921c3a9019
