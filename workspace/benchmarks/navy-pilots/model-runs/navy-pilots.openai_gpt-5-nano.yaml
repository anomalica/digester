      It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego.
    text: |-
      The Nimitz encounter occurred in November 2004 off Southern California, with the USS Nimitz Carrier Strike Group training about 161 kilometres southwest of San Diego.
