    quote: |-
      Bill Whitaker: So what you're telling me is that UFOs, unidentified flying objects, are real. Luis Elizondo: Bill, I think we're beyond that already. The government has already stated for the record that they're real. I'm not telling you that. The United States government is telling you that.
    text: |-
      The United States government has officially confirmed for the record that Unidentified Aerial Phenomena (UAP) are real.
  - id: 6823ef2d-8be9-45fd-b9d0-8728c668a2ac
    type: administrative
    speaker:
      name: Bill Whitaker
    location: 00:01:02.4-00:01:11.5
    date: '2021-05-17'
    refs:
      - name: Luis Elizondo
    quote: |-
      Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo.
    text: |-
      Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo.
  - id: 808ca1ed-3cb6-4dbe-862f-dd9e84c5454e
    type: administrative
    speaker:
      name: Bill Whitaker
    location: 00:01:11.5-00:01:24.1
    date: '2021-05-17'
    refs:
      - name: Luis Elizondo
      - id: 92350b64-57aa-4fd5-9902-69508dc04e77
        name: Advanced Aerospace Threat Identification Program (AATIP)
    quote: |-
      He hadn't given UFOs a second thought until 2008. That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP.
    text: |-
      Luis Elizondo joined the Advanced Aerospace Threat Identification Program (AATIP) at the Pentagon in 2008.
  - id: fe848aba-edc2-410d-8c92-91c4d440c133
    type: administrative
    speaker:
      name: Luis Elizondo
    location: 00:01:24.1-00:01:35.9
    date: '2021-05-17'
    refs:
      - name: Luis Elizondo
      - id: 92350b64-57aa-4fd5-9902-69508dc04e77
        name: Advanced Aerospace Threat Identification Program (AATIP)
      - id: 8357998b-8d96-402e-ba12-f7255c354f3c
        name: Anomalous Aerial Vehicle (AAV)
      - id: 24290da4-9e92-42f1-be67-e48929260f15
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs. We call them UAPs.
    text: |-
      The mission of the Advanced Aerospace Threat Identification Program (AATIP) was to collect and analyse information involving anomalous aerial vehicles, also known as Unidentified Aerial Phenomena (UAP).
  - id: d668b56d-0d03-41e4-8f18-7149e9a48eb1
    type: administrative
    speaker:
      name: Bill Whitaker
    location: 00:02:01.6-00:02:12.6
    date: '2021-05-17'
    refs:
      - name: Luis Elizondo
      - id: 92350b64-57aa-4fd5-9902-69508dc04e77
        name: Advanced Aerospace Threat Identification Program (AATIP)
      - id: 24290da4-9e92-42f1-be67-e48929260f15
        name: Unidentified Aerial Phenomena (UAP)
      - name: United States
    quote: |-
      When Elizondo took over in 2010, he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members.
    text: |-
      Luis Elizondo took over the Advanced Aerospace Threat Identification Program (AATIP) in 2010 and focused on the national security implications of Unidentified Aerial Phenomena (UAP) documented by United States service members.
  - id: 7a3a65b4-be45-4799-b77e-545e87941f01
    type: observation
    speaker:
      name: Luis Elizondo
    location: 00:02:12.6-00:02:35.2
    date: '2021-05-17'
    refs:
      - name: Luis Elizondo
      - id: 24290da4-9e92-42f1-be67-e48929260f15
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity. That's precisely what we're seeing.
    text: |-
      Luis Elizondo described a technology that can do 600 to 700 G-forces, fly at approximately 21,000 kilometres per hour, evade radar, fly through air and water and possibly space, and has no obvious signs of propulsion, no wings, no control surfaces, and can defy the natural effects of Earth's gravity.
  - id: 9c7b45fc-c9f8-4e5f-87c9-0114fcfd1b7b
    type: administrative
    speaker:
      name: Bill Whitaker
    location: 00:02:37.0-00:02:47.7
    date: '2021-05-17'
    refs:
      - name: Luis Elizondo
      - id: 92350b64-57aa-4fd5-9902-69508dc04e77
        name: Advanced Aerospace Threat Identification Program (AATIP)
    quote: |-
      Elizondo tells us AATIP was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time.
    text: |-
      The Advanced Aerospace Threat Identification Program (AATIP) was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time.
  - id: db2065e4-113c-4614-bc9c-ebe80b97709f
