    text: |-
      Former Navy pilot Lieutenant Ryan Graves calls whatever is out there a security risk.
  - id: 19827a80-25e2-443a-a408-a3cce8174e87
    type: testimony
    speaker:
      name: Bill Whitaker
    location: 00:04:12.9-00:04:29.7
    date: '2021-05-17'
    refs:
      - name: Ryan Graves
      - id: 1981b9d8-a863-4558-ad03-a6586898b03e
        name: United States Navy
      - id: 24290da4-9e92-42f1-be67-e48929260f15
        name: Unidentified Aerial Phenomena (UAP)
      - id: 25f945af-30aa-4109-9eae-ba6b2b4ebce3
        name: United States, Virginia, Virginia Beach
      - id: 9ad5d26a-8fb5-47cc-a9ff-7c8018956769
        name: F/A-18
    quote: |-
      He told us his F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar, making it possible to zero in with infrared targeting cameras.
    text: |-
      Ryan Graves stated that his F-18 squadron began seeing Unidentified Aerial Phenomena (UAP) hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar, making it possible to zero in with infrared targeting cameras.
  - id: 58570c2c-3da6-4ea7-8a0d-4675fd400862
    type: testimony
    speaker:
      name: Ryan Graves
    location: 00:04:29.7-00:04:38.6
    date: '2021-05-17'
    refs:
      - name: Ryan Graves
      - id: 24290da4-9e92-42f1-be67-e48929260f15
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      So you're seeing it both with the radar and with the infrared, and that tells you that there is something out there. Ryan Graves: Pretty hard to spoof that.
    text: |-
      Ryan Graves stated that seeing an object both with radar and with infrared indicates that there is something out there.
  - id: 20d3aafa-7236-4ad1-89c9-00aca7b13d4a
    type: testimony
    speaker:
      name: Bill Whitaker
    location: 00:04:38.6-00:04:48.2
    date: '2021-05-17'
    refs:
      - id: 0381a171-4570-4136-a94f-d23ce36c87ee
        name: United States Department of Defense (DoD)
      - id: 24290da4-9e92-42f1-be67-e48929260f15
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      These photographs were taken in 2019 in the same area. The Pentagon confirms these are images of objects it can't identify.
    text: |-
      The United States Department of Defense (DoD) confirms that photographs taken in 2019 in the same area as the 2014 sightings are images of objects it cannot identify.
  - id: 44a3a13a-27ca-4b16-badf-eab9b233fab9
    type: testimony
    speaker:
      name: Ryan Graves
    location: 00:04:48.2-00:05:02.5
    date: '2021-05-17'
    refs:
      - name: Ryan Graves
      - id: 24290da4-9e92-42f1-be67-e48929260f15
        name: Unidentified Aerial Phenomena (UAP)
      - name: United States, Atlantic coast
    quote: |-
      Lieutenant Graves told us pilots training off the Atlantic coast see things like that all the time. Ryan Graves: Every day. Every day for at least a couple of years. Bill Whitaker: Wait a minute. Every day for a couple of years? Ryan Graves: Mm-hmm.
    text: |-
      Ryan Graves stated that pilots training off the Atlantic coast see Unidentified Aerial Phenomena (UAP) every day for at least a couple of years.
  - id: fd5d7716-aee9-4d0f-89f7-5f4291b55f80
    type: testimony
    speaker:
      name: Ryan Graves
    location: 00:05:02.5-00:05:04.3
    date: '2021-05-17'
    refs:
      - name: Ryan Graves
      - id: 24290da4-9e92-42f1-be67-e48929260f15
        name: Unidentified Aerial Phenomena (UAP)
      - name: United States, Atlantic coast
    quote: You know, I don't see an exhaust plume.
    text: |-
      Ryan Graves stated that he does not see an exhaust plume on the Unidentified Aerial Phenomena (UAP) off the Atlantic coast.
  - id: 9d336cee-19ef-48fe-9920-5b63027ddcb4
    type: testimony
    speaker:
      name: Ryan Graves
    location: 00:05:35.8-00:05:42.8
    date: '2021-05-17'
    refs:
      - name: Ryan Graves
      - id: 24290da4-9e92-42f1-be67-e48929260f15
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      This is a difficult one to explain. You have rotation, you have high altitudes, you have propulsion, right? I don't know. I don't know what it is, frankly.
    text: |-
      Ryan Graves stated that he does not know what the Unidentified Aerial Phenomena (UAP) are, but they have rotation, high altitudes, and propulsion.
  - id: 7d58fb60-1172-4c9b-af2b-bfd2c429cf36
    type: testimony
    speaker:
      name: Ryan Graves
    location: 00:05:56.0-00:06:00.5
    date: '2021-05-17'
    refs:
      - name: Ryan Graves
      - id: 24290da4-9e92-42f1-be67-e48929260f15
        name: Unidentified Aerial Phenomena (UAP)
    quote: I'd say, you know, the highest probability is it's a threat observation program.
    text: |-
      Ryan Graves stated that the highest probability is that the Unidentified Aerial Phenomena (UAP) are a threat observation program.
  - id: 0481b5fa-b32e-4fc3-969f-3734cacfc139
    type: opinion
    speaker:
      name: Ryan Graves
    location: 00:06:00.5-00:06:04.1
    date: '2021-05-17'
    refs:
      - name: Ryan Graves
      - id: 24290da4-9e92-42f1-be67-e48929260f15
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      Bill Whitaker: Could it be Russian or Chinese technology? Ryan Graves: I don't see why not.
    text: |-
      Ryan Graves considers Russian or Chinese technology a possible explanation for the observed Unidentified Aerial Phenomena (UAP).
  - id: 096c4d12-43a3-4ff8-ad12-797a223f21b2
    type: opinion
    speaker:
      name: Ryan Graves
    location: 00:06:07.0-00:06:18.5
    date: '2021-05-17'
    refs:
      - name: Ryan Graves
      - id: 24290da4-9e92-42f1-be67-e48929260f15
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      I am worried, frankly. You know, if these were tactical jets from another country that were hanging out up there, it would be a massive issue. But because it looks slightly different, we're not willing to actually look at the problem in the face. We're happy to just ignore the fact that these are out there watching us every day.
    text: |-
      Ryan Graves is worried about the Unidentified Aerial Phenomena (UAP) because if they were tactical jets from another country, it would be a massive issue, but because they look slightly different, the problem is being ignored.
  - id: 0bec894f-3116-4de0-b8a0-2e38d3220f97
    type: administrative
    speaker:
