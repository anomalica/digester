      A Navy aircrew struggles to lock onto a fast-moving object off the U.S. Atlantic coast in 2015.
    text: |-
      A Navy aircrew struggled to lock onto a fast-moving object off the United States Atlantic coast in 2015.
  - id: f37d4644-1937-4574-a7fc-8bff6f0adc92
    type: testimony
    speaker:
      name: Bill Whitaker
    location: 00:03:07.3-00:03:20.4
    date: '2021-05-17'
    refs:
      - id: 0381a171-4570-4136-a94f-d23ce36c87ee
        name: United States Department of Defense (DoD)
      - id: 24290da4-9e92-42f1-be67-e48929260f15
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      Recently released images may not convince UFO skeptics, but the Pentagon admits it doesn't know what in the world this is, or this, or this.
    text: |-
      The United States Department of Defense (DoD) admits it does not know what the objects in the recently released images are.
  - id: 32c62777-0a78-422f-9af7-b83caeab253c
    type: testimony
    speaker:
      name: Luis Elizondo
    location: 00:03:20.4-00:03:38.6
    date: '2021-05-17'
    refs:
      - name: Luis Elizondo
      - id: 24290da4-9e92-42f1-be67-e48929260f15
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      So what do you say to the skeptics? It's refracted light, weather balloons, a rocket being launched, Venus. In some cases, there are simple explanations for what people are witnessing, but there are some that that are not.
    text: |-
      Luis Elizondo stated that in some cases, there are simple explanations for what people are witnessing, but there are some that are not.
  - id: ab1804fd-1294-4c7a-bedc-a8b3c0133e34
    type: testimony
    speaker:
      name: Luis Elizondo
    location: 00:03:38.6-00:03:52.6
    date: '2021-05-17'
    refs:
      - name: Luis Elizondo
      - id: 0381a171-4570-4136-a94f-d23ce36c87ee
        name: United States Department of Defense (DoD)
      - id: 24290da4-9e92-42f1-be67-e48929260f15
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      We're not just simply jumping to a conclusion that's saying, oh, that's a UAP out there. We're going through our due diligence. Is it some sort of new type of cruise missile technology that China has developed? Is it some sort of high-altitude balloon that's conducting reconnaissance? Ultimately, when you have exhausted all those what-ifs and you're still left with the fact that this is in our airspace and it's real, that's when it becomes compelling and that's when it becomes problematic.
    text: |-
      Luis Elizondo stated that the United States Department of Defense (DoD) goes through due diligence to determine if Unidentified Aerial Phenomena (UAP) are some sort of new type of cruise missile technology that China has developed or some sort of high-altitude balloon that is conducting reconnaissance.
  - id: 55a176fe-c561-4c2b-8b81-5e7ea74cc216
