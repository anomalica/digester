ot willing to actually look at the problem in the face. We're happy to just ignore the fact that these are out there watching us every day."},{"id":"0bec894f-3116-4de0-b8a0-2e38d3220f97","type":"administrative","location":"00:06:18.5-00:06:30.3","speaker":"Bill Whitaker","text":"The United States government has ignored Unidentified Aerial Phenomena (UAP) publicly since closing its Project Blue Book investigation in 1969.","quote":"The government has ignored it, at least publicly, since closing its Project Blue Book investigation in 1969."},{"id":"4e4a878b-79e6-4309-8fdf-3c68e401849a","type":"administrative","location":"00:06:30.3-00:06:40.8","speaker":"Bill Whitaker","text":"The 2004 USS Nimitz UAP encounter was documented by radar, by camera, and four naval aviators.","quote":"But that began to change after an incident off Southern California in 2004, which was documented by radar, by camera, and four naval aviators."},{"id":"f8fd5a60-a791-4f9e-941c-7855ac8f268c","type":"administrative","location":"00:06:40.8-00:06:57.3","speaker":"Bill Whitaker","text":"David Fravor is a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz.","quote":"We spoke to two of them, David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz, and flying at his wing, Lieutenant Alex Dietrich, who has never spoken publicly about the encounter."},{"id":"14752ad2-5f35-44d2-85af-dfe78eb392d4","type":"administrative","location":"00:06:40.8-00:06:57.3","speaker":"Bill Whitaker","text":"Alex Dietrich is a lieutenant who has never spoken publicly about the 2004 USS Nimitz UAP encounter.","quote":"We spoke to two of them, David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz, and flying at his wing, Lieutenant Alex Dietrich, who has never spoken publicly about the encounter."},{"id":"edf47e61-c338-4a3e-8544-7a46aa102d78","type":"testimony","location":"00:06:57.3-00:07:14.4","speaker":"Alex Dietrich","text":"Alex Dietrich stated that she never wanted to be on national TV but felt a responsibility to share what she can about the 2004 USS Nimitz UAP encounter because she was in a government aircraft and on the clock.","quote":"Alex Dietrich: I never wanted to be on national TV, no offense. Bill Whitaker: So why are you doing this? Alex Dietrich: Because I was in a government aircraft, because I was on the clock, and so I feel a responsibility to share what I can, and it is unclassified."},{"id":"b9b57455-1fd1-41c1-a9b0-c545a8bf451f","type":"administrative","location":"00:07:14.4-00:07:23.1","speaker":"Bill Whitaker","text":"On 2004-11-14, the USS Nimitz Carrier Strike Group was training about 160 kilometres southwest of San Diego.","quote":"It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego."},{"id":"1b27f667-52ca-4a0b-8db1-26e90c8264c2","type":"observation","location":"00:07:23.1-00:07:39.3","speaker":"Bill Whitaker","text":"For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 24,000 metres in less than a second.","quote":"For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 80,000 feet in less than a second."},{"id":"c2a72b02-74b5-45c1-8180-5a6f796c842a","type":"administrative","location":"00:07:39.3-00:07:47.8","speaker":"Bill Whitaker","text":"On 2004-11-14, David Fravor and Alex Dietrich, each with a weapons system officer in the backseat, were diverted to investigate the 2004 USS Nimitz UAP encounter.","quote":"On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate."},{"id":"3559a12f-6a8f-4259-be18-d81b6550ecef","type":"observation","location":"00:07:47.8-00:07:55.9","speaker":"Bill Whitaker","text":"David Fravor and Alex Dietrich found an area of roiling white water the size of a Boeing 737 in an otherwise calm blue sea during the 2004 USS Nimitz UAP encounter.","quote":"They found an area of roiling white water the size of a 737 in an otherwise calm blue sea."},{"id":"7a569d97-c42c-4759-bb38-04692ed805f4","type":"observation","location":"00:07:55.9-00:08:09.7","speaker":"David Fravor","text":"During the 2004 USS Nimitz UAP encounter, David Fravor and his backseater saw a little white Tic-Tac-looking object moving above the whitewater area.","quote":"So as we're looking at this, her backseater says, hey, Skipper, do you? And about that got out, I said, dude, do you see that thing down there? And we saw this little white tic-tac-looking object. And it's just kind of moving above the whitewater area."},{"id":"8d14545f-ae30-4afe-a8cf-1ac9bfef3ef2","type":"observation","location":"00:08:12.3-00:08:17.9","speaker":"Bill Whitaker","text":"During the 2004 USS Nimitz UAP encounter, as Alex Dietrich circled above, David Fravor went in for a closer look, spiralling down.","quote":"As Dietrich circled above, Fravor went in for a closer look. Bill Whitaker: Sort of spiraling down? David Fravor: Yep."},{"id":"4825e997-0543-45ec-a295-dec773501032","type":"observation","location":"00:08:17.9-00:08:24.5","speaker":"David Fravor","text":"During the 2004 USS Nimitz UAP encounter, the Tic-Tac object went and just turned abruptly and started mirroring David Fravor's movements as he was coming down.","quote":"The tic-tac's still pointing north-south. It goes and just turns abruptly and starts mirroring me. So as I'm coming down, it starts coming up."},{"id":"575f9c40-5683-42ab-ae43-6de8e69903cb","type":"testimony","location":"00:08:24.5-00:08:30.5","speaker":"David Fravor","text":"During the 2004 USS Nimitz UAP encounter, David Fravor stated that the Tic-Tac object was aware of their presence.","quote":"Bill Whitaker: So it's mimicking your moves. David Fravor: Yeah, it was aware we were there."},{"id":"b28064aa-090a-4dd7-93b9-c122aa66270c","type":"testimony","location":"00:08:30.5-00:08:37.0","speaker":"Bill Whitaker","text":"During the 2004 USS Nimitz UAP encounter, David Fravor stated that the Tic-Tac object was about the size of his F-18, with no markings, no wings, and no exhaust plumes.","quote":"He said it was about the size of his F-18, with no markings, no wings, no exhaust plumes."},{"id":"427f17d2-7209-4b09-b198-af370a5cd923","type":"testimony","location":"00:08:37.0-00:08:49.4","speaker":"David Fravor","text":"During the 2004 USS Nimitz UAP encounter, David Fravor stated that as he got closer to the Tic-Tac object, it climbed and then disappeared.","quote":"I want to see how close I can get. So I go like this, and it's climbing still. And when it gets right in front of me, it just disappears. Disappears, like gone. It had sped off."},{"id":"14726312-edc0-4656-bb3f-c3bba72145de","type":"testimony","location":"00:08:50.9-00:09:00.9","speaker":"Alex Dietrich","text":"During the 2004 USS Nimitz UAP encounter, Alex Dietrich stated that her mind tried to make sense of what she saw and she categorised it as maybe a helicopter or maybe a drone, but when it disappeared, she was just...","quote":"So your mind tries to make sense of it. I'm going to categorize this as maybe a helicopter or maybe a drone. And when it disappeared, I mean, it was just..."},{"id":"7731c1a5-6413-40eb-a5b3-75b7bac2f9a3","type":"testimony","location":"00:09:00.9-00:09:03.3","speaker":"Alex Dietrich","text":"During the 2004 USS Nimitz UAP encounter, Alex Dietrich's backseater also saw the object.","quote":"Bill Whitaker: Did your back seaters see this too? Alex Dietrich: Yeah."},{"id":"9d90e0cd-2371-44e2-af36-1e727b5b905b","type":"testimony","location":"00:09:03.3-00:09:08.9","speaker":"David Fravor","text":"During the 2004 USS Nimitz UAP encounter, David Fravor stated that there were four of them in the airplanes literally watching the object for roughly about five minutes.","quote":"David Fravor: Oh, yeah. There was four of us in the airplanes literally watching this thing for roughly about five minutes."},{"id":"7d7103f2-19fd-40f4-9fa0-66a39b074707","type":"observation","location":"00:09:08.9-00:09:14.4","speaker":"Bill Whitaker","text":"Seconds after the 2004 USS Nimitz UAP encounter, the USS Princeton reacquired the target 96 kilometres away.","quote":"Seconds later, the Princeton reacquired the target, 60 miles away."},{"id":"18b0b4c1-d140-4e71-b423-b4964ace1948","type":"observation","location":"00:09:14.4-00:09:20.8","speaker":"Bill Whitaker","text":"Another crew managed to briefly lock onto the target with a targeting camera before it zipped off again during the 2004 USS Nimitz UAP encounter.","quote":"Another crew managed to briefly lock onto it with a targeting camera before it zipped off again."},{"id":"8bafbf37-9a4a-4ecd-93e3-1e43e75ff56a","type":"testimony","location":"00:09:20.8-00:09:31.1","speaker":"Alex Dietrich","text":"Alex Dietrich stated that over beers, they've sort of said, hey, man, if I saw this solo, I don't know that I would have come back and said anything because it sounds so crazy when I say it.","quote":"You know, I think that over beers, we've sort of said, hey, man, if I saw this solo, I don't know that I would have come back and said anything because it sounds so crazy when I say it."},{"id":"fbac0123-0900-4d6a-b810-e1ea8eafdd4b","type":"testimony","location":"00:09:31.1-00:09:45.5","speaker":"David Fravor","text":"David Fravor stated that he understands the reaction to the 2004 USS Nimitz UAP encounter and that he's had some people tell him that when you say that, you can sound crazy.","quote":"You understand that reaction? I do. I've had some people tell me, you know, when you say that, you can sound crazy. I'll be honest. I'm not a UFO guy."},{"id":"1ef2ebbc-7164-44cd-b405-b86b65f0b604","type":"testimony","location":"00:09:45.5-00:09:56.5","speaker":"David Fravor","text":"David Fravor stated that there's definitely something out there that is better than their airplane.","quote":"But from what I hear you guys saying, there's something. There's definitely something that, I don't know who's building it, who's got the technology, who's got the brains, but there's something out there that was better than our airplane."},{"id":"86ef8958-741d-4625-bb46-7f5e156db99b","type":"administrative","location":"00:09:56.5-00:10:13.2","speaker":"Bill Whitaker","text":"The air crew filed reports about the 2004 USS Nimitz UAP encounter, but then, like the mysterious flying object, the Nimitz encounter disappeared and nothing was said or done officially for five years until Luis Elizondo came across the story and investigated.","quote":"The air crew filed reports. Then, like the mysterious flying object, the Nimitz encounter disappeared. Nothing was said or done officially for five years until Lou Elizondo came across the story and investigated."},{"id":"47f37e03-a568-40ec-a516-626f9f5dc6b4","type":"testimony","location":"00:10:13.2-00:10:27.7","speaker":"Luis Elizondo","text":"Luis Elizondo stated that the United States spends millions of dollars in training these pilots, and they are seeing something that they can't explain, and that information's being backed up on electro-optical data, like gun camera footage, and by radar data.","quote":"We spend millions of dollars in training these pilots, and they are seeing something that they can't explain. Furthermore, that information's being backed up on electro-optical data, like gun camera footage, and by radar data. Now, to me, that's compelling."},{"id":"802f1d2b-7b20-4bcb-b2a3-7291207a79ea","type":"administrative","location":"00:10:27.7-00:10:48.8","speaker":"Bill Whitaker","text":"Inside the Pentagon, Luis Elizondo's findings were met with skepticism and the Advanced Aerospace Threat Identification Program (AATIP)'s funding was eliminated in 2012, but Elizondo says he and a handful of others kept the mission alive until finally, frustrated, he quit the Pentagon in 2017, but not before getting these three videos declassified.","quote":"Inside the Pentagon, his findings were met with skepticism. AATIP's funding was eliminated in 2012, but Elizondo says he and a handful of others kept the mission alive. until finally, frustrated, he quit the Pentagon in 2017, but not before getting these three videos declassified."},{"id":"afed3cf0-eae7-4b6d-9e12-6b7e6e646474","type":"administrative","location":"00:10:57.5-00:11:08.4","speaker":"Bill Whitaker","text":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush, and had access to top-secret government programs.","quote":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush, and had access to top-secret government programs."},{"id":"f255c678-37e0-489f-85a8-5e367983a10b","type":"testimony","location":"00:11:08.4-00:11:18.7","speaker":"Christopher Mellon","text":"Christopher Mellon stated that it is not the United States, that's one thing he knows with a very high degree of confidence, in part because of the positions he held in the Department of Defense (DoD), and he knows the process.","quote":"So it's not us, that's one thing we know. I could say that with a very high degree of confidence, in part because of the positions I held in the department, and I know the process."},{"id":"e228a302-5207-41e6-bef8-da45505e87ba","type":"testimony","location":"00:11:37.0-00:11:46.1","speaker":"Christopher Mellon","text":"Christopher Mellon stated that it is bizarre and unfortunate that someone like himself has to do something like that to get a national security issue like Unidentified Aerial Phenomena (UAP) on the agenda.","quote":"It's bizarre and unfortunate that someone like myself has to do something like that to get a national security issue like this on the agenda."},{"id":"adf61752-d0eb-4e82-8ae8-81258398a19f","type":"testimony","location":"00:11:46.1-00:11:57.6","speaker":"Bill Whitaker","text":"Christopher Mellon stated that he and Luis Elizondo started to tell their story to anybody who would listen, to newspapers, the History Channel, to members of Congress.","quote":"He joined forces with now civilian Lou Elizondo, and they started to tell their story to anybody who would listen, to newspapers, the History Channel, to members of Congress."},{"id":"1ff1deef-d5d5-460b-a58f-170d9ead6fae","type":"testimony","location":"00:11:57.6-00:12:07.2","speaker":"Christopher Mellon","text":"Christopher Mellon stated that they knew and understood that you had to go to the public, get the public interested to get Congress interested, to then circle back to the Defense Department and get them to start taking a look at Unidentified Aerial Phenomena (UAP).","quote":"We knew and understood that you had to go to the public, get the public interested to get Congress interested, to then circle back to the Defense Department and get them to start taking a look at it."},{"id":"80538f51-ffc9-4801-bbf1-5bdab8e54498","type":"administrative","location":"00:12:07.2-00:12:20.1","speaker":"Bill Whitaker","text":"The United States Department of Defense (DoD) resurrected the Advanced Aerospace Threat Identification Program (AATIP) in August 2020, now called the UAP Task Force, and service members are now encouraged to report strange encounters.","quote":"And now it is. This past August, the Pentagon resurrected AATIP. It's now called the UAP Task Force. Service members now are encouraged to report strange encounters."},{"id":"17d3f75d-1c8e-4278-8168-fd27223d525d","type":"administrative","location":"00:12:20.1-00:12:34.0","speaker":"Bill Whitaker","text":"Senator Marco Rubio called for a detailed analysis of Unidentified Aerial Phenomena (UAP) after receiving classified briefings.","quote":"After receiving classified briefings on UAPs, Senator Marco Rubio called for a detailed analysis."},{"id":"1e375977-7945-4234-8762-edbecc5bf206","type":"administrative","location":"00:12:34.0-00:12:46.3","speaker":"Bill Whitaker","text":"In December 2020, while he was still head of the Intelligence Committee, Marco Rubio asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month.","quote":"This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month."},{"id":"6ace16ba-4d7f-4aaa-998d-e50abd1d9368","type":"testimony","location":"00:12:46.3-00:13:06.9","speaker":"Marco Rubio","text":"Marco Rubio stated that there is a stigma on Capitol Hill about Unidentified Aerial Phenomena (UAP) and that some of his colleagues are very interested in this topic and some kind of giggle when you bring it up, but he doesn't think they can allow the stigma to keep them from having an answer to a very fundamental question.","quote":"This is a bizarre issue. The Pentagon and other branches of the military have a long history of sort of dismissing this. What makes you think that this time is going to be different? I mean, we're going to find out when we get that report. You know, there's a stigma on Capitol Hill. I mean, some of my colleagues are very interested in this topic and some kind of, you know, giggle when you bring it up. But I don't think we can allow the stigma to keep us from having an answer to a very fundamental question."},{"id":"7bef7da9-2e3c-4b78-beea-dd31291b5ecb","type":"testimony","location":"00:13:06.9-00:13:28.3","speaker":"Marco Rubio","text":"Marco Rubio stated that he wants the United States to take Unidentified Aerial Phenomena (UAP) seriously and have a process to take it seriously, to analyse the data every time it comes in, that there be a place where this is catalogued and constantly analysed until they get some answers.","quote":"I want us to take it seriously and have a process to take it seriously. I want us to have a process to analyze the data. every time it comes in, that there be a place where this is cataloged and constantly analyzed until we get some answers. Maybe it has a very simple answer. Maybe it doesn't."},{"id":"03f2f08c-bc8f-4bdf-8a0d-92e4483e643f","type":"testimony","location":"00:13:37.3-00:13:41.7","speaker":"Alex Dietrich","text":"Alex Dietrich stated that she felt the vulnerability of not having anything to defend themselves during the 2004 USS Nimitz UAP encounter.","quote":"I felt the vulnerability of not having anything to defend ourselves."}],"nodes":[{"id":"c4aa28fd-9ace-461c-ae89-d2cef161a5ff","type":"organisation","name":"United States Senate Select Committee on Intelligence"},{"id":"81b713a0-b635-4bf5-b3c0-c34b2c229900","type":"organisation","name":"Office of the Director of National Intelligence (ODNI)"},{"id":"0381a171-4570-4136-a94f-d23ce36c87ee","type":"organisation","name":"United States Department of Defense (DoD)"},{"id":"1981b9d8-a863-4558-ad03-a6586898b03e","type":"organisation","name":"United States Navy"},{"id":"35d4d9d7-dd4e-487f-9ea8-4886233ada44","type":"organisation","name":"United States Senate"},{"id":"469e9290-1b2f-45e2-9dc4-6622b1f48df8","type":"organisation","name":"United States Congress"},{"id":"92350b64-57aa-4fd5-9902-69508dc04e77","type":"project","name":"Advanced Aerospace Threat Identification Program (AATIP)"},{"id":"984a4d19-7f51-45cf-84c1-90b66d929218","type":"project","name":"UAP Task Force"},{"id":"22cfc3f9-e45d-42d7-a4c4-e41dcb7c1cc1","type":"project","name":"Project Blue Book"},{"id":"db8b9551-bdd2-4b82-8f7f-799e02792e23","type":"place","name":"United States, California, San Diego"},{"id":"25f945af-30aa-4109-9eae-ba6b2b4ebce3","type":"place","name":"United States, Virginia, Virginia Beach"},{"id":"07c8e5bf-3a57-4c4c-be0c-fbea925e8a90","type":"place","name":"United States, Florida, Jacksonville"},{"id":"2f36674a-672b-43f6-a698-225a8cbdaa7e","type":"event","name":"2004 USS Nimitz UAP encounter"},{"id":"e0c404d5-71b2-45fa-b296-6f270768acf4","type":"object","name":"USS Nimitz"},{"id":"12466bdb-590b-46ba-96d3-669b07b53eed","type":"object","name":"USS Princeton"},{"id":"9ad5d26a-8fb5-47cc-a9ff-7c8018956769","type":"object","name":"F/A-18"},{"id":"0cbd5e7f-53e7-44a3-a392-88ce42ee875a","type":"document","name":"60 Minutes"},{"id":"24290da4-9e92-42f1-be67-e48929260f15","type":"topic","name":"Unidentified Aerial Phenomena (UAP)"},{"id":"2fe8f167-0364-46f6-99af-119e557de017","type":"topic","name":"Unidentified Flying Object (UFO)"},{"id":"8357998b-8d96-402e-ba12-f7255c354f3c","type":"topic","name":"Anomalous Aerial Vehicle (AAV)"},{"id":"cd892779-3b8f-4d2c-9628-47e56b9157eb","type":"person","name":"Whitaker, Bill"},{"id":"9d88398a-b74c-4aed-91e3-085f4c189940","type":"person","name":"Elizondo, Luis"},{"id":"4155af0b-8275-48aa-a5fd-8a6af7ec0330","type":"person","name":"Reid, Harry"},{"id":"e70bbaff-746e-433a-85ff-3d78e236ac01","type":"person","name":"Graves, Ryan"},{"id":"5328486a-abb6-4c0f-b218-fa612c76de98","type":"person","name":"Fravor, David"},{"id":"fbdd1be9-4b63-432d-8db0-aca03a4c8769","type":"person","name":"Dietrich, Alex"},{"id":"28959f5c-d541-4311-9d75-0f35ea0a1dc8","type":"person","name":"Mellon, Christopher"},{"id":"6db3989d-f347-4cb0-8a05-ee00193679e0","type":"person","name":"Rubio, Marco"},{"id":"56eea087-75ae-4707-980a-5d8df40bb009","type":"organisation","name":"Top Gun Naval Flight School"}]},{"id":"openai_gpt-5-mini","name":"openai / gpt-5-mini","errata":null,"claims":[{"id":"7f756ccb-6391-409c-8193-72e36f0c181e","type":"administrative","location":"00:00:07.6-00:00:09.1","speaker":"Whitaker, Bill","text":"The United States government has grudgingly acknowledged Unidentified Aerial Phenomena (UAP).","quote":"It's the story of the U.S.\ngovernment's grudging acknowledgement of Unidentified Aerial Phenomena, UAP,"},{"id":"c529a319-e3d7-4f2d-af0e-15bbe5e3efaf","type":"administrative","location":"00:00:09.1-00:00:09.1","speaker":"Whitaker, Bill","text":"Unidentified Aerial Phenomena (UAP) are more commonly known as Unidentified Flying Object (UFO).","quote":"more commonly known as ufos"},{"id":"c83123f8-b6cd-49bb-9af9-add4514163d2","type":"administrative","location":"00:00:09.1-00:00:14.9","speaker":"Whitaker, Bill","text":"The United States Department of Defense (DoD) now admits there is something out there.","quote":"the pentagon now admits there's something out there"},{"id":"2293ff17-e069-4481-b9aa-887de3cfa5ed","type":"administrative","location":"00:00:09.1-00:00:14.9","speaker":"Whitaker, Bill","text":"The United States Senate Select Committee on Intelligence has ordered the Office of the Director of National Intelligence (ODNI) and the United States Secretary of Defense to deliver a report on the mysterious sightings by next month.","quote":"and the u.s senate wants to know what it is the intelligence committee has ordered the director of national intelligence and the secretary of defense to deliver a report on the mysterious sightings by next month"},{"id":"3a6bd326-7386-4239-890a-3fce6dc76838","type":"administrative","location":"00:00:54.6-00:00:59.6","speaker":"Elizondo, Luis","text":"The United States government has officially stated for the record that Unidentified Aerial Phenomena (UAP) are real.","quote":"The government has already stated for the record that they're real.\nI'm not telling you that.\nThe United States government is telling you that."},{"id":"6da8975b-987d-4ce7-979a-f28e0a6d51f3","type":"administrative","location":"00:01:02.4-00:01:02.4","speaker":"Whitaker, Bill","text":"Luis Elizondo spent twenty years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantánamo Bay.","quote":"Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo."},{"id":"45a38590-791c-454c-a913-8bce80a406db","type":"administrative","location":"00:01:11.5-00:01:11.5","speaker":"Whitaker, Bill","text":"Luis Elizondo had not given Unidentified Flying Object (UFO) matters a second thought until 2008.","quote":"He hadn't given UFOs a second thought until 2008."},{"id":"6c98934d-ef15-4422-9481-6bcda067d3fa","type":"administrative","location":"00:01:15.6-00:01:15.6","speaker":"Whitaker, Bill","text":"In 2008, Luis Elizondo was asked to join the Advanced Aerospace Threat Identification Program (AATIP) at the United States Department of Defense (DoD).","quote":"That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP."},{"id":"9ffa86b5-8471-45a6-a33c-a7ede62a7698","type":"administrative","location":"00:01:24.1-00:01:25.8","speaker":"Elizondo, Luis","text":"The mission of the Advanced Aerospace Threat Identification Program (AATIP) was to collect and analyse information involving Anomalous Aerial Vehicle (AAV).","quote":"The mission of AATIP was quite simple.\nIt was to collect and analyze information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs."},{"id":"7837908d-931c-43eb-84ef-88abd1294c6f","type":"administrative","location":"00:01:24.1-00:01:25.8","speaker":"Elizondo, Luis","text":"Anomalous Aerial Vehicle (AAV) is commonly referred to as Unidentified Flying Object (UFO).","quote":"what I guess in the vernacular you call them UFOs."},{"id":"0438903c-1d85-457d-8628-f0d8b53b96d2","type":"administrative","location":"00:01:34.3-00:01:34.3","speaker":"Elizondo, Luis","text":"Members of the Advanced Aerospace Threat Identification Program (AATIP) referred to those objects as Unidentified Aerial Phenomena (UAP).","quote":"We call them UAPs."},{"id":"60fcd172-25e2-447b-a4f6-528c6b35717d","type":"administrative","location":"00:01:50.3-00:01:50.3","speaker":"Whitaker, Bill","text":"The Advanced Aerospace Threat Identification Program (AATIP) was part of a 22 million dollar programme sponsored by then Senate Majority Leader Harry Reid to investigate Unidentified Flying Object (UFO) reports.","quote":"Buried away in the Pentagon, AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs."},{"id":"1a655794-49a4-48f9-ada6-b8b40afb5a22","type":"administrative","location":"00:02:01.6-00:02:01.6","speaker":"Whitaker, Bill","text":"In 2010, Luis Elizondo took over AATIP.","quote":"When Elizondo took over in 2010,"},{"id":"4dd0ee92-70ff-4f1e-8d4d-cdd25486b24b","type":"administrative","location":"00:02:01.6-00:02:10.8","speaker":"Whitaker, Bill","text":"Luis Elizondo focused on the national security implications of Unidentified Aerial Phenomena (UAP) documented by United States service members.","quote":"he focused on the national security implications of unidentified aerial phenomena documented by U.S.\nservice members."},{"id":"8f182de7-fbfb-4853-b5dc-e1850b759921","type":"measurement","location":"00:02:12.6-00:02:12.6","speaker":"Elizondo, Luis","text":"The Unidentified Aerial Phenomena (UAP) observed can withstand approximately six hundred to seven hundred times Earth's gravitational acceleration.","quote":"Imagine a technology that can do 600 to 700 G-forces,"},{"id":"455f1b18-e960-42ed-be44-6f162a9f587b","type":"measurement","location":"00:02:12.6-00:02:12.6","speaker":"Elizondo, Luis","text":"The Unidentified Aerial Phenomena (UAP) observed can fly at approximately 21,000 kilometres per hour.","quote":"that can fly at 13,000 miles an hour,"},{"id":"ae939768-da65-4fc6-9cf2-c54e19f34f9a","type":"observation","location":"00:02:12.6-00:02:12.6","speaker":"Elizondo, Luis","text":"The Unidentified Aerial Phenomena (UAP) observed can evade radar.","quote":"that can evade radar,"},{"id":"4213d274-96c5-42b6-a98c-03a96f596a79","type":"observation","location":"00:02:12.6-00:02:12.6","speaker":"Elizondo, Luis","text":"The Unidentified Aerial Phenomena (UAP) observed can fly through air and water.","quote":"and that can fly through air and water"},{"id":"59b3ad80-cbcd-4589-9a28-34fa31e0a294","type":"opinion","location":"00:02:12.6-00:02:12.6","speaker":"Elizondo, Luis","text":"The Unidentified Aerial Phenomena (UAP) observed possibly can operate in space.","quote":"and possibly space,"},{"id":"8cfaf9d9-1bb2-4c33-a908-fe31ece45f8e","type":"observation","location":"00:02:12.6-00:02:12.6","speaker":"Elizondo, Luis","text":"The Unidentified Aerial Phenomena (UAP) observed show no obvious signs of propulsion.","quote":"has no obvious signs of propulsion,"},{"id":"866baf85-b5c9-4c2c-95ec-b85345a000a7","type":"observation","location":"00:02:12.6-00:02:12.6","speaker":"Elizondo, Luis","text":"The Unidentified Aerial Phenomena (UAP) observed have no wings.","quote":"no wings,"},{"id":"89987679-3d1b-4671-aadd-a64e08b11ce9","type":"observation","location":"00:02:12.6-00:02:12.6","speaker":"Elizondo, Luis","text":"The Unidentified Aerial Phenomena (UAP) observed have no control surfaces.","quote":"no control surfaces,"},{"id":"cc907f7a-b487-49e3-a878-7605da47730f","type":"observation","location":"00:02:12.6-00:02:12.6","speaker":"Elizondo, Luis","text":"The Unidentified Aerial Phenomena (UAP) observed appear to defy the natural effects of Earth's gravity.","quote":"and yet still can defy the natural effects of Earth's gravity."},{"id":"1647a7c5-0627-4546-a751-3acf0928507f","type":"administrative","location":"00:02:37.0-00:02:37.0","speaker":"Whitaker, Bill","text":"The Advanced Aerospace Threat Identification Program (AATIP) was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time.","quote":"Elizondo tells us AATIP was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time."},{"id":"02922774-e31b-43bf-9dd8-9d8d49b753f8","type":"administrative","location":"00:02:37.0-00:02:47.7","speaker":"Whitaker, Bill","text":"The Advanced Aerospace Threat Identification Program (AATIP) combed through data and records and analysed videos.","quote":"They combed through data and records and analyzed videos like this."},{"id":"573f2423-ad14-43d5-b2f8-115e96446e5b","type":"observation","location":"00:02:57.7-00:03:02.1","speaker":"Whitaker, Bill","text":"In 2015 a United States Navy aircrew struggled to lock onto a fast-moving object off the United States Atlantic coast.","quote":"A Navy aircrew struggles to lock onto a fast-moving object off the U.S.\nAtlantic coast in 2015."},{"id":"a7826f7d-4b21-4433-9d54-37a139c48ae0","type":"administrative","location":"00:03:07.3-00:03:07.3","speaker":"Whitaker, Bill","text":"The United States Department of Defense (DoD) admits it cannot identify certain recently released images of objects.","quote":"Recently released images may not convince UFO skeptics, but the Pentagon admits it doesn't know what in the world this is, or this, or this."},{"id":"f0f5577f-b2ca-4950-93e4-4e9fdaed4a80","type":"observation","location":"00:03:20.4-00:03:20.4","speaker":"Whitaker, Bill","text":"Some Unidentified Aerial Phenomena (UAP) sightings have simple explanations such as refracted light, weather balloons, rocket launches, or the planet Venus.","quote":"It's refracted light, weather balloons, a rocket being launched, Venus."},{"id":"cfe7838c-4883-4ee0-b87e-7eed99be5e6a","type":"observation","location":"00:03:30.4-00:03:37.4","speaker":"Elizondo, Luis","text":"Some Unidentified Aerial Phenomena (UAP) sightings do not have simple explanations.","quote":"In some cases, there are simple explanations for what people are witnessing, but there are some that\nthat are not."},{"id":"aea9e863-4d0c-48d1-937b-5200912b8417","type":"administrative","location":"00:03:42.7-00:03:52.6","speaker":"Elizondo, Luis","text":"The Advanced Aerospace Threat Identification Program (AATIP) considered whether sightings were new cruise missile technology developed by China or high-altitude reconnaissance balloons.","quote":"Is it some sort of new type of cruise missile technology that China has developed?\nIs it some sort of high-altitude balloon that's conducting reconnaissance?"},{"id":"49c57fa7-dbd1-436e-8e45-5e4dc513dabe","type":"opinion","location":"00:03:52.6-00:03:52.6","speaker":"Elizondo, Luis","text":"When alternative explanations are exhausted and the Unidentified Aerial Phenomena (UAP) remain in United States airspace and are real, the cases become compelling and problematic.","quote":"Ultimately, when you have exhausted all those what-ifs and you're still left with the fact that this is in our airspace and it's real, that's when it becomes compelling and that's when it becomes problematic."},{"id":"f1689d2a-c470-4aac-90c9-115435326b21","type":"opinion","location":"00:04:06.2-00:04:06.2","speaker":"Whitaker, Bill","text":"Ryan Graves considers Unidentified Aerial Phenomena (UAP) a security risk.","quote":"Former Navy pilot Lieutenant Ryan Graves calls whatever is out there a security risk."},{"id":"1d0d9450-a2eb-404f-ac51-0b4d60e80313","type":"testimony","location":"00:04:12.9-00:04:29.7","speaker":"Whitaker, Bill","text":"In 2014 Ryan Graves's F/A-18 squadron began seeing Unidentified Aerial Phenomena (UAP) hovering over restricted airspace southeast of Virginia Beach when their jets' radar was updated, enabling infrared targeting cameras to lock on.","quote":"He told us his F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar, making it possible to zero in with infrared targeting cameras."},{"id":"8dccf450-7d09-44a7-b0d9-d1ebfd73d2a1","type":"opinion","location":"00:04:29.7-00:04:37.1","speaker":"Graves, Ryan","text":"The dual radar-and-infrared detection of Unidentified Aerial Phenomena (UAP) is hard to spoof.","quote":"So you're seeing it both with the radar and with the infrared, and that tells you that there is something out there.\nPretty hard to spoof that."},{"id":"71a6bf27-8993-45a7-867f-5a059ed0e9e3","type":"administrative","location":"00:04:38.6-00:04:38.6","speaker":"Whitaker, Bill","text":"Photographs were taken in 2019 in the same area southeast of Virginia Beach.","quote":"These photographs were taken in 2019 in the same area."},{"id":"f185db73-13d7-478f-ad97-42a956bb1008","type":"administrative","location":"00:04:43.0-00:04:43.0","speaker":"Whitaker, Bill","text":"The United States Department of Defense (DoD) confirms the 2019 images are of objects it cannot identify.","quote":"The Pentagon confirms these are images of objects it can't identify."},{"id":"8eef4faa-5737-416c-8555-90e7d9d6e045","type":"testimony","location":"00:04:48.2-00:04:48.2","speaker":"Whitaker, Bill","text":"Pilots training off the United States Atlantic coast see Unidentified Aerial Phenomena (UAP) like those photographed frequently.","quote":"Lieutenant Graves told us pilots training off the Atlantic coast see things like that all the time."},{"id":"ee454245-502b-4aa0-9658-4d752774b898","type":"testimony","location":"00:04:55.3-00:04:56.6","speaker":"Graves, Ryan","text":"Ryan Graves says pilots saw Unidentified Aerial Phenomena (UAP) every day for at least a couple of years while training off the Atlantic coast.","quote":"Every day.\nEvery day for at least a couple of years."},{"id":"0f726915-cdd3-44d2-b350-9a569a7e0abd","type":"observation","location":"00:05:02.5-00:05:02.5","speaker":"Graves, Ryan","text":"Ryan Graves observed no exhaust plume on the Unidentified Aerial Phenomena (UAP) off the Atlantic coast.","quote":"You know, I don't see an exhaust plume."},{"id":"668881ad-4479-433e-9df5-08cb5d00390d","type":"observation","location":"00:05:04.3-00:05:04.3","speaker":"Whitaker, Bill","text":"A Unidentified Aerial Phenomenon off the coast of Jacksonville, Florida in 2015 was captured on a targeting camera by members of Ryan Graves's squadron.","quote":"including this one, off the coast of Jacksonville, Florida in 2015, captured on a targeting camera by members of Graves' squadron."},{"id":"2d4e3cd7-a42e-4fc2-a52b-5bc89efddf8c","type":"observation","location":"00:05:12.8-00:05:17.9","speaker":null,"text":"The external footage contains an exclamation that the object is rotating.","quote":"Look at that thing!\nIt's rotating.\nMy gosh!"},{"id":"29b6c87b-5ad9-41af-b517-3419856083f4","type":"observation","location":"00:05:17.9-00:05:17.9","speaker":null,"text":"The external footage contains an observation that the objects were going against the wind.","quote":"They're all going against the wind."},{"id":"8c8ab10d-329c-4693-8553-9b494a8dd1c0","type":"measurement","location":"00:05:21.6-00:05:21.6","speaker":null,"text":"The external footage reports the wind as 120 knots from the west.","quote":"The wind's 120 knots far west."},{"id":"f91596d4-e54c-4fa3-8388-31fe4b13e42d","type":"measurement","location":"00:05:21.6-00:05:21.6","speaker":null,"text":"The wind reported as 120 knots is approximately 220 kilometres per hour from the west.","quote":"The wind's 120 knots far west."},{"id":"8d633d7b-82a7-4278-b623-dc7ebb066205","type":"observation","location":"00:05:25.4-00:05:25.4","speaker":"Whitaker, Bill","text":"Bill Whitaker notes the surprise in the pilots' voices in the footage.","quote":"You can sort of hear the surprise in their voices."},{"id":"fda791e4-a355-49ed-b3ef-e826d6f7612e","type":"observation","location":"00:05:27.3-00:05:27.9","speaker":"Graves, Ryan","text":"Ryan Graves observed that the pilots seemed to have broken character and were amazed at what they were seeing.","quote":"They seem to have broke character a bit, and were just kind of amazed at what they were seeing."},{"id":"0644da2f-f838-46a3-b5e1-90df92323cb8","type":"observation","location":"00:05:35.8-00:05:42.5","speaker":"Graves, Ryan","text":"Ryan Graves characterised that particular incident as difficult to explain and noted rotation, high altitudes, and apparent propulsion.","quote":"This is a difficult one to explain.\nYou have rotation, you have high altitudes, you have propulsion, right?"},{"id":"eb606c6e-4552-4ab3-b9f7-6affa641317a","type":"opinion","location":"00:05:42.8-00:05:42.8","speaker":"Graves, Ryan","text":"Ryan Graves does not know what the observed object is.","quote":"I don't know what it is, frankly."},{"id":"454143aa-05b8-4160-b89a-6ecf53f5597d","type":"hearsay","location":"00:05:44.9-00:05:50.0","speaker":"Whitaker, Bill","text":"Pilots speculated the Unidentified Aerial Phenomena (UAP) could be secret United States technology, an adversary spy vehicle, or something otherworldly.","quote":"He told us pilots speculate they are one of three things, secret U.S.\ntechnology, an adversary spy vehicle, or something otherworldly."},{"id":"5076486a-3a63-409a-b791-abf553511408","type":"opinion","location":"00:05:56.0-00:05:56.0","speaker":"Graves, Ryan","text":"Ryan Graves considers the highest probability explanation to be a threat observation programme.","quote":"I'd say, you know, the highest probability is it's a threat observation program."},{"id":"7ce88c6d-f9f9-4abc-a7a3-37bde0549bf9","type":"opinion","location":"00:06:00.5-00:06:04.1","speaker":"Graves, Ryan","text":"Ryan Graves considers Russian or Chinese technology a possible explanation for the observed Unidentified Aerial Phenomena (UAP).","quote":"Could it be Russian or Chinese technology?\nI don't see why not."},{"id":"97af1e31-8e9d-4fd6-8c1b-482948621361","type":"opinion","location":"00:06:07.0-00:06:07.0","speaker":"Graves, Ryan","text":"Ryan Graves is worried about the presence of Unidentified Aerial Phenomena (UAP) over training airspace.","quote":"I am worried, frankly."},{"id":"422e8aed-e961-43c0-a85e-8230d1a7be39","type":"opinion","location":"00:06:07.0-00:06:13.6","speaker":"Graves, Ryan","text":"Ryan Graves stated that if the objects were tactical jets from another country hanging out there it would be a massive issue.","quote":"You know, if these were tactical jets from another country that were hanging out up there, it would be a massive issue."},{"id":"cade6a4f-18c0-48a5-80a6-2467d345b077","type":"opinion","location":"00:06:13.6-00:06:18.5","speaker":"Graves, Ryan","text":"Ryan Graves said authorities are unwilling to look at the problem because the objects look slightly different.","quote":"But because it looks slightly different, we're not willing to actually look at the problem in the face."},{"id":"7387df09-74a7-4692-a45f-9584fcd3a132","type":"administrative","location":"00:06:23.4-00:06:23.4","speaker":"Whitaker, Bill","text":"The United States government publicly ignored Unidentified Flying Object investigations since closing Project Blue Book in 1969.","quote":"The government has ignored it, at least publicly, since closing its Project Blue Book investigation in 1969."},{"id":"a284e523-ff06-4932-ad26-eb3d0564fccf","type":"observation","location":"00:06:30.3-00:06:30.3","speaker":"Whitaker, Bill","text":"The 2004 USS Nimitz UAP encounter off Southern California was documented by radar, by camera, and by four naval aviators.","quote":"But that began to change after an incident off Southern California in 2004, which was documented by radar, by camera, and four naval aviators."},{"id":"a0f05442-e621-48bd-b5dd-4f6d5d7a0eda","type":"administrative","location":"00:06:40.8-00:06:40.8","speaker":"Whitaker, Bill","text":"David Fravor is a graduate of the Top Gun Naval Flight School.","quote":"We spoke to two of them, David Fravor, a graduate of the Top Gun Naval Flight School"},{"id":"a876d326-db1e-478e-8caa-ab691f693dbb","type":"administrative","location":"00:06:40.8-00:06:40.8","speaker":"Whitaker, Bill","text":"David Fravor was commander of the F/A-18 squadron on the USS Nimitz at the time of the 2004 encounter.","quote":"and commander of the F-18 squadron on the USS Nimitz,"},{"id":"2929116c-d083-4b87-8217-ec23339430cd","type":"administrative","location":"00:06:40.8-00:06:40.8","speaker":"Whitaker, Bill","text":"Alex Dietrich was flying at David Fravor's wing during the 2004 USS Nimitz UAP encounter and had never spoken publicly about the encounter prior to this.","quote":"and flying at his wing, Lieutenant Alex Dietrich, who has never spoken publicly about the encounter."},{"id":"cc51d399-a9a3-485b-a3d9-e5b46fa2c7b3","type":"opinion","location":"00:06:57.3-00:06:57.3","speaker":"Dietrich, Alex","text":"Alex Dietrich said she never wanted to be on national television.","quote":"I never wanted to be on national TV, no offense."},{"id":"e75c9773-e070-4617-9efd-913da5b116a6","type":"testimony","location":"00:07:02.7-00:07:02.7","speaker":"Dietrich, Alex","text":"Alex Dietrich said she was in a government aircraft and on the clock during the encounter and therefore felt a responsibility to share what she can, and that what she shares is unclassified.","quote":"Because I was in a government aircraft, because I was on the clock, and so I feel a responsibility to share what I can, and it is unclassified."},{"id":"30b4244d-fa08-4021-85e6-88638820edad","type":"administrative","location":"00:07:14.4-00:07:14.4","speaker":"Whitaker, Bill","text":"The 2004 USS Nimitz UAP encounter occurred in November 2004.","quote":"It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego."},{"id":"fa0915c6-07ad-4c7f-83e8-dfa0cb190104","type":"administrative","location":"00:07:14.4-00:07:14.4","speaker":"Whitaker, Bill","text":"The USS Nimitz Carrier Strike Group was training about 161 kilometres southwest of San Diego.","quote":"the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego."},{"id":"ae1b52f0-eec2-4d69-b696-0f58280572ed","type":"observation","location":"00:07:23.1-00:07:23.1","speaker":"Whitaker, Bill","text":"For a week the USS Princeton's advanced new radar detected multiple Anomalous Aerial Vehicle (AAV) targets over the horizon.","quote":"For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon,"},{"id":"b6685417-a4c6-46ac-9245-b118e9703524","type":"measurement","location":"00:07:23.1-00:07:23.1","speaker":"Whitaker, Bill","text":"The anomalous aerial vehicles were recorded descending approximately 24,000 metres in less than a second.","quote":"descending 80,000 feet in less than a second."},{"id":"60d344ee-c49f-49b8-8d19-95d4d72dadc7","type":"administrative","location":"00:07:39.3-00:07:39.3","speaker":"Whitaker, Bill","text":"On 2004-11-14 David Fravor and Alex Dietrich, each with a weapons system officer in the backseat, were diverted to investigate the targets.","quote":"On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate."},{"id":"4004753d-fa0a-4ac5-a82f-1df02b62d212","type":"observation","location":"00:07:47.8-00:07:47.8","speaker":"Whitaker, Bill","text":"David Fravor and Alex Dietrich found an area of roiling white water the size of a Boeing 737 in an otherwise calm sea during the 2004 USS Nimitz UAP encounter.","quote":"They found an area of roiling white water the size of a 737 in an otherwise calm blue sea."},{"id":"ecd451ba-c7f6-41f5-be67-4a6544f89139","type":"observation","location":"00:07:55.9-00:08:09.7","speaker":"Fravor, David","text":"David Fravor and his backseater saw a small white tic-tac-shaped object moving above the white water area during the 2004 USS Nimitz UAP encounter.","quote":"And we saw this little white tic-tac-looking object.\nAnd it's just kind of moving above the whitewater area."},{"id":"7ab54198-8bf1-4a15-8c5c-0f7ccc40e25d","type":"observation","location":"00:08:12.3-00:08:12.3","speaker":"Whitaker, Bill","text":"As Alex Dietrich circled above, David Fravor descended for a closer look at the object.","quote":"As Dietrich circled above, Fravor went in for a closer look."},{"id":"1bc50eac-5fe2-4236-b002-c9528c6d0961","type":"observation","location":"00:08:17.9-00:08:17.9","speaker":"Fravor, David","text":"During the 2004 USS Nimitz UAP encounter the tic-tac object was oriented north-south.","quote":"The tic-tac's still pointing north-south."},{"id":"acc677fe-79e5-4552-bd93-19c91e7a6737","type":"observation","location":"00:08:20.2-00:08:24.5","speaker":"Fravor, David","text":"The tic-tac object turned abruptly and began mirroring David Fravor's manoeuvres.","quote":"It goes and just turns abruptly and starts mirroring me.\nSo as I'm coming down, it starts coming up."},{"id":"05f50a5a-2368-45f7-83fd-81ee754a9555","type":"observation","location":"00:08:28.9-00:08:28.9","speaker":"Fravor, David","text":"David Fravor judged the object was aware of their presence.","quote":"Yeah, it was aware we were there."},{"id":"c343dc4f-e779-4bce-bcab-d00d1dff9cc7","type":"observation","location":"00:08:30.5-00:08:30.5","speaker":"Whitaker, Bill","text":"The tic-tac object was about the size of an F/A-18, with no markings, no wings, and no exhaust plumes.","quote":"He said it was about the size of his F-18, with no markings, no wings, no exhaust plumes."},{"id":"f973f936-82a3-40ca-b3d6-81f82931c795","type":"observation","location":"00:08:37.0-00:08:47.8","speaker":"Fravor, David","text":"When David Fravor got the tic-tac right in front of him it disappeared and had sped off.","quote":"And when it gets right in front of me, it just disappears.\nDisappears, like gone.\nIt had sped off."},{"id":"af3646d9-82d5-4419-9219-214d51144f23","type":"opinion","location":"00:08:50.9-00:08:58.3","speaker":"Dietrich, Alex","text":"Alex Dietrich initially tried to categorise the object as maybe a helicopter or maybe a drone.","quote":"I'm going to categorize this as maybe a helicopter or maybe a drone."},{"id":"2a5370c4-9d0c-4a52-a309-a394ce7e094a","type":"testimony","location":"00:09:00.9-00:09:03.3","speaker":"Dietrich, Alex","text":"The backseaters in the aircraft also saw the object.","quote":"Did your back seaters see this too?\nYeah."},{"id":"bfa64119-6af0-4a43-b617-e33ee51646ca","type":"observation","location":"00:09:03.5-00:09:04.2","speaker":"Fravor, David","text":"Four of the crew in the two airplanes watched the object for roughly about five minutes.","quote":"There was four of us in the airplanes literally watching this thing for roughly about five minutes."},{"id":"9ddd8375-9923-4bab-9f2f-1895607180ed","type":"observation","location":"00:09:08.9-00:09:08.9","speaker":"Whitaker, Bill","text":"Seconds later the USS Princeton reacquired the target approximately 97 kilometres away.","quote":"Seconds later, the Princeton reacquired the target, 60 miles away."},{"id":"aa038999-ac0b-48d6-944e-dbdfa66253c5","type":"observation","location":"00:09:08.9-00:09:14.4","speaker":"Whitaker, Bill","text":"Another crew briefly locked onto the object with a targeting camera before it zipped off again.","quote":"Another crew managed to briefly lock onto it with a targeting camera before it zipped off again."},{"id":"754c65dc-d799-4ffe-bdf2-5e83f47364d3","type":"opinion","location":"00:09:20.8-00:09:20.8","speaker":"Dietrich, Alex","text":"Alex Dietrich said she might not have reported seeing the object if she had seen it alone because it sounds crazy when described.","quote":"You know, I think that over beers, we've sort of said, hey, man, if I saw this solo, I don't know that I would have come back and said anything because it sounds so crazy when I say it."},{"id":"e0abf101-6808-43d0-8b88-47d0ed722926","type":"opinion","location":"00:09:33.1-00:09:37.9","speaker":"Fravor, David","text":"David Fravor is not a 'UFO guy'.","quote":"I'll be honest.\nI'm not a UFO guy."},{"id":"f6514fa2-dfee-476f-b85e-ba75a5bc62a8","type":"opinion","location":"00:09:45.5-00:09:45.8","speaker":"Fravor, David","text":"David Fravor said there is something out there that outperformed their aeroplane.","quote":"There's definitely something that, I don't know who's building it, who's got the technology, who's got the brains, but there's something out there that was better than our airplane."},{"id":"257d2afe-283a-4ff3-b699-51ccdc971650","type":"administrative","location":"00:09:56.5-00:09:56.5","speaker":"Whitaker, Bill","text":"The air crew filed reports about the 2004 USS Nimitz UAP encounter.","quote":"The air crew filed reports."},{"id":"74c10d60-69f5-4c33-843b-00c28e0ab0cb","type":"administrative","location":"00:09:58.7-00:10:04.2","speaker":"Whitaker, Bill","text":"Nothing was said or done officially about the Nimitz encounter for five years until Luis Elizondo came across the story and investigated.","quote":"Nothing was said or done officially for five years until Lou Elizondo came across the story and investigated."},{"id":"9d0cf99c-85aa-4ec4-b6ac-8876e40cc588","type":"opinion","location":"00:10:13.2-00:10:13.2","speaker":"Elizondo, Luis","text":"Luis Elizondo said the United States spends millions of dollars training pilots and that those pilots are seeing things they cannot explain.","quote":"We spend millions of dollars in training these pilots, and they are seeing something that they can't explain."},{"id":"b28eece1-2049-474e-b568-8d76d6fa7e78","type":"observation","location":"00:10:13.2-00:10:25.3","speaker":"Elizondo, Luis","text":"Luis Elizondo said the information is backed up on electro-optical data, like gun camera footage, and by radar data.","quote":"Furthermore, that information's being backed up on electro-optical data, like gun camera footage, and by radar data."},{"id":"19f5526b-93ea-43e7-82d1-13004c55ffb1","type":"administrative","location":"00:10:27.7-00:10:27.7","speaker":"Whitaker, Bill","text":"Inside the United States Department of Defense (DoD) Elizondo's findings were met with skepticism.","quote":"Inside the Pentagon, his findings were met with skepticism."},{"id":"865c458e-49fa-498a-aa23-92084a9fb0b4","type":"administrative","location":"00:10:31.7-00:10:31.7","speaker":"Whitaker, Bill","text":"AATIP's funding was eliminated in 2012.","quote":"AATIP's funding was eliminated in 2012,"},{"id":"27a5fbf4-6284-4e74-94c9-f38152e2cd1c","type":"administrative","location":"00:10:31.7-00:10:39.5","speaker":"Whitaker, Bill","text":"Luis Elizondo and a handful of others kept AATIP's mission alive after its funding was cut.","quote":"but Elizondo says he and a handful of others kept the mission alive."},{"id":"82e8e5c3-4a76-4a58-ad67-6e1bd08360ef","type":"administrative","location":"00:10:39.5-00:10:39.5","speaker":"Whitaker, Bill","text":"Luis Elizondo quit the United States Department of Defense in 2017.","quote":"until finally, frustrated, he quit the Pentagon in 2017,"},{"id":"20ac363e-8782-4782-87e0-7aa3a912d84c","type":"administrative","location":"00:10:39.5-00:10:48.8","speaker":"Whitaker, Bill","text":"Before leaving, Luis Elizondo obtained declassification of three Navy videos.","quote":"but not before getting these three videos declassified."},{"id":"f6b2b023-7d4b-4c7f-8b19-84b79e66bf64","type":"administrative","location":"00:10:57.5-00:11:04.3","speaker":"Whitaker, Bill","text":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush and had access to top-secret government programmes.","quote":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W.\nBush, and had access to top-secret government programs."},{"id":"4e98c29a-6fc5-465a-835c-da96d6fd4b6b","type":"opinion","location":"00:11:08.4-00:11:08.4","speaker":"Mellon, Christopher","text":"Christopher Mellon is confident the Unidentified Aerial Phenomena (UAP) are not United States technology.","quote":"So it's not us, that's one thing we know."},{"id":"991d5abf-7151-4820-bcf7-e3da64310dd0","type":"opinion","location":"00:11:11.7-00:11:11.7","speaker":"Mellon, Christopher","text":"Christopher Mellon said he had a very high degree of confidence in that judgement in part because of the positions he held in the United States Department of Defense and his knowledge of the process.","quote":"I could say that with a very high degree of confidence, in part because of the positions I held in the department, and I know the process."},{"id":"6242539c-1d06-4cea-8a40-e2079728a49c","type":"administrative","location":"00:11:18.7-00:11:18.7","speaker":"Whitaker, Bill","text":"Christopher Mellon grew concerned that nothing was being done about Unidentified Aerial Phenomena (UAP).","quote":"Mellon says he grew concerned nothing was being done about UAPs, so he decided to do something."},{"id":"9f396afc-9a7c-4b3e-8814-1583258792e8","type":"opinion","location":"00:11:37.0-00:11:37.0","speaker":"Mellon, Christopher","text":"Christopher Mellon considered it bizarre and unfortunate that he had to leak the videos to get a national security issue on the agenda.","quote":"It's bizarre and unfortunate that someone like myself has to do something like that to get a national security issue like this on the agenda."},{"id":"0d1df4f7-2a0c-4347-b32e-e1498f5b4990","type":"opinion","location":"00:11:57.6-00:11:57.6","speaker":"Mellon, Christopher","text":"Christopher Mellon believed that going to the public would get Congress interested and then prompt the Department of Defense to take another look at Unidentified Aerial Phenomena (UAP).","quote":"We knew and understood that you had to go to the public, get the public interested to get Congress interested, to then circle back to the Defense Department and get them to start taking a look at it."},{"id":"222d972b-c688-4ff7-afc0-4b3eb1b62e76","type":"administrative","location":"00:12:07.2-00:12:12.6","speaker":"Whitaker, Bill","text":"The United States Department of Defense resurrected the Advanced Aerospace Threat Identification Program (AATIP) as the Unidentified Aerial Phenomena Task Force.","quote":"This past August, the Pentagon resurrected AATIP.\nIt's now called the UAP Task Force."},{"id":"ee050bb0-a4d6-40b1-993d-9267ad9d1f07","type":"administrative","location":"00:12:12.6-00:12:15.6","speaker":"Whitaker, Bill","text":"Service members are now encouraged to report strange encounters with Unidentified Aerial Phenomena (UAP).","quote":"Service members now are encouraged to report strange encounters."},{"id":"0a70ec44-4c79-4398-bb1a-813e06e29710","type":"administrative","location":"00:12:15.6-00:12:15.6","speaker":"Whitaker, Bill","text":"The United States Senate Select Committee on Intelligence wants answers about Unidentified Aerial Phenomena (UAP).","quote":"And the Senate wants answers."},{"id":"c7691de8-1e8b-472e-bfe6-3cc75a6429fa","type":"opinion","location":"00:12:22.6-00:12:22.6","speaker":"Rubio, Marco","text":"Marco Rubio said anything that enters an airspace that is not supposed to be there is a threat.","quote":"Anything that enters an airspace that's not supposed to be there is a threat."},{"id":"edba5290-6004-481d-b325-da6251166a7d","type":"administrative","location":"00:12:26.5-00:12:26.5","speaker":"Whitaker, Bill","text":"After receiving classified briefings on Unidentified Aerial Phenomena (UAP), Senator Marco Rubio called for a detailed analysis.","quote":"After receiving classified briefings on UAPs, Senator Marco Rubio called for a detailed analysis."},{"id":"fdd88250-631b-4fa8-a883-736a6501d191","type":"administrative","location":"00:12:34.0-00:12:46.3","speaker":"Whitaker, Bill","text":"In December while he was still head of the Intelligence Committee, Marco Rubio asked the Office of the Director of National Intelligence (ODNI) and the United States Department of Defense to present United States Congress an unclassified report by next month.","quote":"This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month."},{"id":"ad487075-83bf-4fd1-8139-b139e2b9c114","type":"administrative","location":"00:12:46.3-00:12:54.5","speaker":"Whitaker, Bill","text":"The United States Department of Defense and other branches of the military have a long history of dismissing Unidentified Aerial Phenomena (UAP).","quote":"The Pentagon and other branches of the military have a long history of sort of dismissing this."},{"id":"a0adfcaa-1211-49ab-b27c-1c9c7e666d6b","type":"opinion","location":"00:12:56.2-00:13:00.8","speaker":"Rubio, Marco","text":"Marco Rubio said there is a stigma on Capitol Hill about discussing Unidentified Aerial Phenomena (UAP).","quote":"You know, there's a stigma on Capitol Hill.\nI mean, some of my colleagues are very interested in this topic and some kind of, you know, giggle when you bring it up."},{"id":"243cd940-0f8d-4a1f-89c2-e2cd72477efa","type":"opinion","location":"00:13:14.1-00:13:19.7","speaker":"Rubio, Marco","text":"Marco Rubio wants a process to take Unidentified Aerial Phenomena (UAP) seriously and to analyse and catalogue incoming data until answers are found.","quote":"I want us to take it seriously and have a process to take it seriously.\nI want us to have a process to analyze the data.\nevery time it comes in, that there be a place where this is cataloged and constantly analyzed until we get some answers."},{"id":"a6c8d779-2c50-4562-85cc-a15241b4a85d","type":"opinion","location":"00:13:37.3-00:13:37.3","speaker":"Dietrich, Alex","text":"Alex Dietrich said she felt the vulnerability of not having anything to defend themselves.","quote":"I felt the vulnerability of not having anything to defend ourselves."}],"nodes":[{"id":"2ff5a8cc-b8c7-4bd2-942c-bf798f384f59","type":"person","name":"Elizondo, Luis"},{"id":"bffecaf0-f2d9-4c3f-af24-58d1c493e0fa","type":"person","name":"Whitaker, Bill"},{"id":"f6df2868-aec0-4204-921e-abf5e546ab62","type":"person","name":"Reid, Harry"},{"id":"8bdfc156-bb66-486d-98e7-1c57275a26cb","type":"person","name":"Graves, Ryan"},{"id":"4b8b8252-b978-444f-9842-567b23377e33","type":"person","name":"Fravor, David"},{"id":"183dc01f-d8b3-4669-af16-959c0ac4bf93","type":"person","name":"Dietrich, Alex"},{"id":"ec36363a-88e9-41e8-bad8-becc0b3b9f5f","type":"person","name":"Mellon, Christopher"},{"id":"30867847-8e8b-44d7-95dc-bb73f8caa354","type":"person","name":"Rubio, Marco"},{"id":"50a4d149-00f1-478c-99f3-9aeaef52cac5","type":"organisation","name":"60 Minutes (TV program)"},{"id":"1af41611-f071-41a3-99ea-a24095012055","type":"organisation","name":"United States government"},{"id":"3afe380c-4479-4431-a06d-bb8f883aadee","type":"organisation","name":"United States Department of Defense (DoD)"},{"id":"b34f2101-5a8e-44bf-b27e-865cac1b8bfc","type":"organisation","name":"United States Senate Select Committee on Intelligence (Senate Intelligence Committee)"},{"id":"0bf8a224-cb7b-4a11-84b9-e9c0eac548ce","type":"organisation","name":"United States Congress"},{"id":"017287c6-1f8f-43ee-a1ca-c149a95d83fa","type":"organisation","name":"Office of the Director of National Intelligence (ODNI)"},{"id":"ba07a0cd-1030-408d-9e5d-d08fdf12278d","type":"organisation","name":"The New York Times"},{"id":"f8920794-df82-4cbc-b872-8ce2b939287a","type":"organisation","name":"History Channel"},{"id":"4b2e567c-abd6-40b5-b040-0b8b98ac14e1","type":"organisation","name":"Kologuard"},{"id":"cac8f98f-047f-4460-80e8-476e47a503ab","type":"organisation","name":"Top Gun Naval Flight School"},{"id":"a92c47fe-8d62-4056-95a2-51b4bbec62b9","type":"object","name":"USS Nimitz"},{"id":"a3baaeef-21b0-483f-9b43-93e37aaa7483","type":"object","name":"USS Princeton"},{"id":"27bd252a-43f9-47ee-9fd4-c85abf24dcf8","type":"object","name":"F/A-18"},{"id":"5c293202-c176-4d6b-b8aa-dfd5dba1d82b","type":"project","name":"Advanced Aerospace Threat Identification Program (AATIP)"},{"id":"d3f75936-be28-4e1e-9c22-a735501d5af3","type":"project","name":"Unidentified Aerial Phenomena Task Force (UAP Task Force)"},{"id":"209bff9f-7965-4683-8ccf-1b21b26a8959","type":"project","name":"Project Blue Book"},{"id":"0ea7bf14-25f1-476e-86bb-863b536f9933","type":"place","name":"USA, California, San Diego"},{"id":"15864fd2-aad8-4d56-813f-9a37945d4c9f","type":"place","name":"USA, Virginia, Virginia Beach"},{"id":"da46ed52-1a19-40f3-bd9a-617d89ff20d4","type":"place","name":"USA, Florida, Jacksonville"},{"id":"3c658b1b-509d-4ab8-9684-eafd0e4d844d","type":"place","name":"Cuba, Guantánamo Bay"},{"id":"302763a9-6291-43a4-aa2a-083a1d2eacaf","type":"event","name":"2004 USS Nimitz UAP encounter"},{"id":"38dd5822-54ad-4b47-b5cf-8a87ae6c3737","type":"event","name":"2014 Virginia Beach UAP sightings"},{"id":"742eb364-c40a-4d6e-809b-2da678f2f7c4","type":"event","name":"2015 U.S. Atlantic Coast UAP incidents"},{"id":"4cabf077-a68c-469a-89ba-b3cdd3ea037f","type":"event","name":"2019 UAP photographs off Virginia Beach"},{"id":"aabb0271-f812-45c2-a6d0-296780c18203","type":"document","name":"Three declassified U.S. Navy videos leaked to The New York Times (2017)"},{"id":"43212433-7d37-42e8-b8ee-820a2e23d399","type":"document","name":"60MinutesOvertime.com"},{"id":"ec0e52ac-3b3c-4fb6-8105-96f5d7d67284","type":"topic","name":"Unidentified Aerial Phenomena (UAP)"},{"id":"7bb6f54b-a20c-4881-8859-43acd3e14044","type":"topic","name":"Unidentified Flying Object (UFO)"},{"id":"eced1d46-eb1a-4af9-b369-ac7c31491f4f","type":"topic","name":"Anomalous Aerial Vehicle (AAV)"},{"id":"676db0f6-11d0-493b-87a7-47c25d8e02db","type":"organisation","name":"USS Nimitz Carrier Strike Group"},{"id":"e8f98712-fd08-48c0-b483-5b7339edcfd6","type":"organisation","name":"United States Secretary of Defense"}]},{"id":"openai_gpt-5-nano","name":"openai / gpt-5-nano","errata":null,"claims":[{"id":"eceb9fef-c81a-47ee-a354-38c6b1cf6f1f","type":"testimony","location":"00:00:58.7-00:01:02.4","speaker":null,"text":"The United States government has stated for the record that Unidentified Aerial Phenomena (UAP) are real.","quote":"The United States government is telling you that."},{"id":"d946615b-6d6f-4f36-8ba8-5003bb89abd0","type":"observation","location":"00:01:11.5-00:01:25.8","speaker":"Elizondo, Luis","text":"Luis Elizondo was asked to join the Advanced Aerospace Threat Identification Program (AATIP) at the Pentagon in 2008.","quote":"That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP."},{"id":"3468fabf-89ec-44cc-840b-d3790d7ec8a7","type":"observation","location":"00:01:24.1-00:01:34.3","speaker":"Elizondo, Luis","text":"The mission of the Advanced Aerospace Threat Identification Program (AATIP) was to collect and analyse information involving anomalous aerial vehicles, which are commonly referred to as UFOs and called UAPs.","quote":"The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs. We call them UAPs."},{"id":"316e48c2-4921-4555-aec4-c49df85fa5d0","type":"observation","location":"00:01:50.3-00:02:01.6","speaker":"Bill Whitaker","text":"AATIP was part of a US$22 million programme sponsored by then Senate Majority Leader Harry Reid to investigate UFOs.","quote":"Buried away in the Pentagon, AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs."},{"id":"8f91b5c9-b146-4069-9474-13b8a220f7b3","type":"observation","location":"00:02:01.6-00:02:10.8","speaker":"Bill Whitaker","text":"Luis Elizondo took over AATIP in 2010.","quote":"When Elizondo took over in 2010, he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members."},{"id":"d23eb1c9-1784-4275-9fbc-a2b7646658c8","type":"observation","location":"00:02:37.0-00:02:47.7","speaker":"Whitaker, Bill","text":"AATIP was described as a loose-knit mix of scientists, electro-optical engineers, avionics specialists, and intelligence experts, often working part-time.","quote":"Elizondo tells us AATIP was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time."},{"id":"b64b7f6f-5fa7-4275-b566-f1982eb75c86","type":"observation","location":"00:02:57.7-00:03:12.1","speaker":"Whitaker, Bill","text":"A Navy aircrew saw Unidentified Aerial Phenomena (UAP) hovering off the Atlantic coast in 2015, and their jet's radar was updated to allow infrared targeting cameras to lock on.","quote":"A Navy aircrew struggles to lock onto a fast-moving object off the U.S. Atlantic coast in 2015. ... updated their jet's radar, making it possible to zero in with infrared targeting cameras."},{"id":"698247ba-9608-4c0b-a36b-66a624b02c60","type":"observation","location":"00:04:38.6-00:04:48.2","speaker":"Whitaker, Bill","text":"The 2019 photographs show images of objects the Pentagon cannot identify.","quote":"The photographs were taken in 2019 in the same area. The Pentagon confirms these are images of objects it can't identify."},{"id":"206febcf-4733-4d40-ac4a-2e2c15d9de71","type":"opinion","location":"00:04:37.1-00:04:38.6","speaker":"Graves, Ryan","text":"Ryan Graves stated that the combination of radar and infrared observations is hard to spoof.","quote":"Pretty hard to spoof that."},{"id":"b7c963ee-dc37-4491-aa5e-3498930ec622","type":"observation","location":"00:05:04.3-00:05:12.8","speaker":"Whitaker, Bill","text":"The 2015 Jacksonville footage was captured on a targeting camera by members of Graves' squadron.","quote":"including this one, off the coast of Jacksonville, Florida in 2015, captured on a targeting camera by members of Graves' squadron."},{"id":"f8ae1789-0c53-4347-94b2-7a495358b737","type":"observation","location":"00:05:12.8-00:05:15.1","speaker":"external_footage","text":"The tic-tac looking object was observed rotating.","quote":"Look at that thing! It's rotating."},{"id":"8b4b3b77-aa5f-4902-9712-4010b7d65d83","type":"observation","location":"00:08:28.9-00:08:30.5","speaker":"David Fravor","text":"The tic-tac object appeared to mirror the fighter's movements and was aware they were there.","quote":"Yeah, it was aware we were there."},{"id":"a9a2325a-5436-4b03-98e8-02d868fe690a","type":"observation","location":"00:08:30.5-00:08:39.0","speaker":"Fravor, David","text":"The tic-tac object was about the size of an F-18, with no markings, no wings, and no exhaust plumes.","quote":"It was about the size of his F-18, with no markings, no wings, no exhaust plumes."},{"id":"bbee9b6f-0743-45d0-ac4a-a70076681e74","type":"observation","location":"00:08:44.8-00:08:50.0","speaker":"David Fravor","text":"The tic-tac object disappeared after Fravor's approach and sped off.","quote":"Disappears, like gone. It had sped off."},{"id":"80142f97-bae2-4802-8170-1ece1f245d9b","type":"observation","location":"00:06:57.3-00:07:23.1","speaker":"Bill Whitaker","text":"The Nimitz encounter occurred in November 2004 off Southern California, with the USS Nimitz Carrier Strike Group training about 161 kilometres southwest of San Diego.","quote":"It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego."},{"id":"e0f50d3b-9e77-434a-902f-01c5e73034d8","type":"observation","location":"00:07:23.1-00:07:39.3","speaker":"Bill Whitaker","text":"The USS Princeton detected the phenomenon with radar on the USS Nimitz mission off Southern California in 2004.","quote":"the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 80,000 feet in less than a second."},{"id":"fd065b3d-d8b2-456f-8513-45afd31f29e2","type":"observation","location":"00:07:47.8-00:07:55.9","speaker":"David Fravor","text":"The area of roiling white water observed during the encounter was described as the area the size of a Boeing 737.","quote":"They found an area of roiling white water the size of a 737 in an otherwise calm blue sea."},{"id":"b8623cf7-8e41-4af8-87f4-d1921c3a9019","type":"observation","location":"00:06:57.3-00:08:20.2","speaker":"Fravor, David","text":"David Fravor, who was in command of the F-18 squadron on the USS Nimitz, described the encounter and the tic-tac object.","quote":"Fravor, and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate. They found an area of roiling white water the size of a 737... the tic-tac's still pointing north-south."},{"id":"6366b800-53f9-4330-ad50-a7dd035061f2","type":"observation","location":"00:07:02.7-00:07:14.4","speaker":"Dietrich, Alex","text":"Alex Dietrich stated she was in a government aircraft on duty and felt a responsibility to share what she could, as the encounter was unclassified.","quote":"Because I was in a government aircraft, because I was on the clock, and so I feel a responsibility to share what I can, and it is unclassified."},{"id":"d06e51c8-30c7-46ea-b49e-3fee7745e2dc","type":"observation","location":"00:09:04.2-00:09:08.9","speaker":"Fravor, David","text":"David Fravor and Alex Dietrich observed the object for roughly five minutes, with two backseaters also seeing it.","quote":"There were four of us in the airplanes literally watching this thing for roughly about five minutes."},{"id":"6415c0e4-06e9-4f37-959d-8276417a3463","type":"observation","location":"00:09:08.9-00:09:20.8","speaker":"Bill Whitaker","text":"The Nimitz encounter continued to unfold with the Princeton reacquiring the target at about sixty miles distance and a later camera lock.","quote":"Seconds later, the Princeton reacquired the target, 60 miles away. Another crew managed to briefly lock onto it with a targeting camera before it zipped off again."},{"id":"a0d19eba-89f8-4441-bbab-30bf337e984e","type":"observation","location":"00:08:24.5-00:08:39.0","speaker":"Fravor, David","text":"The tic-tac object appeared to mimic the fighter's movements and was aware of the observers' presence.","quote":"So as I'm coming down, it starts coming up. ... It mimicked your moves. It was aware we were there."},{"id":"1aea6bb3-1113-40c9-9a6b-3e2311ce0c5a","type":"observation","location":"00:08:30.5-00:08:39.0","speaker":"Fravor, David","text":"The tic-tac object appeared to be roughly the size of the observer's F-18, with no markings, no wings, and no exhaust plumes.","quote":"It was about the size of his F-18, with no markings, no wings, no exhaust plumes."},{"id":"e02413c6-93cf-42d7-876c-cae143980eaf","type":"observation","location":"00:09:56.5-00:10:13.2","speaker":"Bill Whitaker","text":"The encounter off Southern California was not officially acknowledged for five years until Lou Elizondo became involved.","quote":"The air crew filed reports. Then, like the mysterious flying object, the Nimitz encounter disappeared. Nothing was said or done officially for five years until Lou Elizondo came across the story and investigated."},{"id":"e83868c7-25b0-4764-84bd-45a9fee6160f","type":"observation","location":"00:10:13.2-00:10:27.7","speaker":"Elizondo, Luis","text":"Lou Elizondo stated that hundreds of millions of dollars were invested in training pilots who were seeing something they could not explain, with supporting electro‑optical data and radar data.","quote":"We spend millions of dollars in training these pilots, and they are seeing something that they can't explain. Furthermore, that information's being backed up on electro-optical data, like gun camera footage, and by radar data."},{"id":"f2352779-d3b5-4b7d-af9a-82f2eead1416","type":"observation","location":"00:04:43.0-00:04:48.2","speaker":"Whitaker, Bill","text":"The Pentagon acknowledged that the 2019 photographs show images of objects it cannot identify.","quote":"The Pentagon confirms these are images of objects it can't identify."},{"id":"ceaad10c-ff02-42bc-815a-f7b46a51bc74","type":"observation","location":"00:11:26.2-00:11:37.0","speaker":"Mellon, Christopher","text":"Christopher Mellon leaked Navy videos to The New York Times in 2017 after privately acquiring them as a private citizen.","quote":"In 2017, as a private citizen, he surreptitiously acquired the three Navy videos Elizondo had declassified and leaked them to The New York Times."},{"id":"2a3cce43-8196-4b5b-9bc6-f38048083d56","type":"observation","location":"00:12:09.1-00:12:15.6","speaker":"Bill Whitaker","text":"The Pentagon resurrected AATIP in August and it is now called the UAP Task Force.","quote":"This past August, the Pentagon resurrected AATIP. It's now called the UAP Task Force."},{"id":"4f30fa92-5d53-4362-acdf-d47664050311","type":"observation","location":"00:12:15.6-00:12:22.6","speaker":"Whitaker, Bill","text":"Service members are now encouraged to report strange encounters with UAP, and the United States Senate wants answers.","quote":"Service members now are encouraged to report strange encounters. And the Senate wants answers."},{"id":"53b61a2a-6879-41da-a239-3e4cb8eaf617","type":"opinion","location":"00:12:22.6-00:12:46.3","speaker":"Rubio, Marco","text":"Marco Rubio asserted that anything entering airspace not intended to be there is a threat and called for a detailed, ongoing analysis with an unclassified report to Congress by the following month.","quote":"Anything that enters an airspace that's not supposed to be there is a threat. ... This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month."}],"nodes":[{"id":"1a847181-75c8-411a-b6d6-58dc5e5f9da4","type":"topic","name":"Unidentified Aerial Phenomena (UAP)"},{"id":"38b5d057-ef34-402e-9c2c-d00a87bb4144","type":"topic","name":"Anomalous Aerial Vehicle (AAV)"},{"id":"5aea9855-6e35-40b2-b5cb-2c32074e2ff8","type":"topic","name":"Unidentified Flying Object (UFO)"},{"id":"aebfebd7-4ec0-47d0-a8ce-a42a308955ad","type":"project","name":"Advanced Aerospace Threat Identification Program (AATIP)"},{"id":"59fc218a-417c-4602-97a3-03090df122c6","type":"project","name":"UAP Task Force"},{"id":"ccf1a8d1-1b43-44fe-aec4-ceca65f7aae9","type":"organisation","name":"Office of the Director of National Intelligence (ODNI)"},{"id":"876ee113-2af6-4023-8c72-768018eb27a4","type":"organisation","name":"United States Senate Select Committee on Intelligence"},{"id":"c6ae1bdd-e7c1-4e16-9c26-5b317c54ed5c","type":"organisation","name":"United States Senate"},{"id":"4a34ee89-70a6-44ff-830c-4626ac50f969","type":"organisation","name":"Pentagon"},{"id":"9928ff0c-f9c9-4ebd-b587-fbae36fded82","type":"organisation","name":"United States Navy"},{"id":"fc3448a6-bef7-4f54-a673-1ebd5d8c3478","type":"organisation","name":"Carrier Strike Group 11 (CSG-11)"},{"id":"55fcbe07-a616-4cf4-8d84-1fa2d0fdc7d2","type":"organisation","name":"Top Gun Naval Flight School"},{"id":"96b98f77-3f80-43d5-a206-407b68cca478","type":"object","name":"USS Nimitz"},{"id":"4d3774af-96ff-4c5d-a8e7-93a1eb923d1f","type":"object","name":"USS Princeton"},{"id":"26d7a63c-9239-445d-b92d-39f767a08b1f","type":"object","name":"F/A-18"},{"id":"885acbff-3817-4268-ac57-be358a986be1","type":"document","name":"60 Minutes (Document)"},{"id":"a067ece9-8fc5-4a71-a8c0-f3698e5afaef","type":"organisation","name":"The New York Times"},{"id":"d4dcf696-8408-4b88-8950-d79004641858","type":"organisation","name":"History Channel"},{"id":"6793428f-1848-420b-ae7b-2475b6ee1eb4","type":"organisation","name":"Kologuard"},{"id":"b1b1f4f7-7546-42b5-8e9a-faf24d1c32eb","type":"place","name":"USA, California, San Diego"},{"id":"44faf853-29e4-4a66-bc94-c2f2c1239a22","type":"place","name":"USA, Virginia, Virginia Beach"},{"id":"341983b2-43e3-4dd1-852c-f6b16dfc473e","type":"place","name":"USA, Florida, Jacksonville"},{"id":"9a11da75-d2c4-4b50-9e2d-f794a8f08e5f","type":"place","name":"Cuba, Guantánamo Bay"},{"id":"43af451a-820f-499e-a793-6047ab065a33","type":"place","name":"USA, California, Southern California"},{"id":"5b93f1af-71d9-4c0d-a2a6-5fdea2b47ed7","type":"organisation","name":"United States Congress"},{"id":"1729c6a8-6e4c-4477-b9d3-ef89b11bf96b","type":"person","name":"Reid, Harry"},{"id":"1a87a244-4219-42ec-aa5d-6962c5d95f13","type":"person","name":"Elizondo, Luis"},{"id":"1683b8c1-1bf4-453d-8d2b-0c8f6b093c83","type":"person","name":"Fravor, David"},{"id":"3720efe3-8565-45e9-bfbd-9638e4b69f22","type":"person","name":"Dietrich, Alex"},{"id":"41c94c11-d654-43bd-9bbf-ab0892501852","type":"person","name":"Mellon, Christopher"},{"id":"1a38e39f-c682-4db5-9f06-fc4983113638","type":"person","name":"Rubio, Marco"},{"id":"0c8fa654-ff94-453e-ab08-9ed735c6c4fa","type":"person","name":"Whitaker, Bill"},{"id":"3feaf53d-2b0c-440f-abed-246814b6a4f2","type":"person","name":"Bush, George W."},{"id":"bbca1fb9-dba0-4a36-8d2b-2469a2cc72ea","type":"person","name":"Clinton, William J."}]},{"id":"openai_gpt-5.1","name":"openai / gpt-5.1","errata":null,"claims":[{"id":"b91e09c2-7c41-4dda-895f-361effaecc1b","type":"administrative","location":"00:00:07.6-00:00:14.9","speaker":"Whitaker, Bill","text":"The United States government has grudgingly acknowledged the existence of Unidentified Aerial Phenomena.","quote":"It's the story of the U.S.\n00:00:09.1 government's grudging acknowledgement of Unidentified Aerial Phenomena, UAP,"},{"id":"cb68af49-2ce3-487e-a445-7ecba400483a","type":"administrative","location":"00:00:09.1-00:00:14.9","speaker":"Whitaker, Bill","text":"Unidentified Aerial Phenomena are more commonly known as Unidentified Flying Objects.","quote":"Unidentified Aerial Phenomena, UAP,\n00:00:14.9 more commonly known as ufos"},{"id":"1a1276e5-7180-4fc7-a089-68cdb1300943","type":"administrative","location":"00:00:14.9-00:00:21.5","speaker":"Whitaker, Bill","text":"After decades of public denial about Unidentified Flying Objects, the United States Department of Defense now admits there is something unexplained in the sky.","quote":"after decades of public denial the pentagon now admits there's something out there"},{"id":"e8b80d31-2d0e-4d11-ace1-ee5831bb3bf1","type":"administrative","location":"00:00:18.5-00:00:24.5","speaker":"Whitaker, Bill","text":"The United States Senate wants to know what the unexplained aerial phenomena acknowledged by the United States Department of Defense are.","quote":"and the u.s senate wants to know what it is"},{"id":"9756dedc-725e-4026-bcb3-31ab0be2efb7","type":"administrative","
