597-8f984cf7bbca","type":"observation","location":"00:08:30.5-00:08:37.0","speaker":"Whitaker, Bill","text":"During the USS Nimitz UAP encounter (2004-11-14), the Unidentified Aerial Phenomena (UAP) had no wings.","quote":"no wings"},{"id":"4c2fc907-dd80-49fb-ac55-d4d73645988c","type":"observation","location":"00:08:30.5-00:08:37.0","speaker":"Whitaker, Bill","text":"During the USS Nimitz UAP encounter (2004-11-14), the Unidentified Aerial Phenomena (UAP) had no exhaust plumes.","quote":"no exhaust plumes."},{"id":"b22a2e48-1704-4b5b-8a93-9ca8be928e40","type":"observation","location":"00:08:37.0-00:08:40.9","speaker":"Fravor, David","text":"During the USS Nimitz UAP encounter (2004-11-14), the Unidentified Aerial Phenomena (UAP) disappeared when it got right in front of David Fravor.","quote":"And when it gets right in front of me, it just disappears."},{"id":"c29ae76e-4d9a-4ec2-b1e6-25bd2c1ab8b4","type":"observation","location":"00:08:44.8-00:08:47.8","speaker":"Fravor, David","text":"During the USS Nimitz UAP encounter (2004-11-14), David Fravor described the Unidentified Aerial Phenomena (UAP) as having sped off after disappearing.","quote":"Bill Whitaker: Disappears?\n\nDavid Fravor: Disappears, like gone.\n\nIt had sped off."},{"id":"74aa2b69-3424-4892-b067-7d25e9b9ea3a","type":"testimony","location":"00:08:50.9-00:08:58.3","speaker":"Dietrich, Alex","text":"During the USS Nimitz UAP encounter (2004-11-14), Alex Dietrich initially tried to categorise the Unidentified Aerial Phenomena (UAP) as possibly a helicopter or possibly a drone.","quote":"I'm going to categorize this as maybe a helicopter or maybe a drone."},{"id":"f91539e3-93df-472e-8df9-2794562f4e28","type":"observation","location":"00:08:58.3-00:09:00.9","speaker":"Dietrich, Alex","text":"During the USS Nimitz UAP encounter (2004-11-14), Alex Dietrich observed the Unidentified Aerial Phenomena (UAP) disappear.","quote":"And when it disappeared, I mean, it was just..."},{"id":"d1e436ad-511d-48fa-867f-a2442e57d3cb","type":"testimony","location":"00:09:00.9-00:09:03.3","speaker":"Dietrich, Alex","text":"During the USS Nimitz UAP encounter (2004-11-14), Alex Dietrich confirmed her backseater saw the Unidentified Aerial Phenomena (UAP).","quote":"Bill Whitaker: Did your back seaters see this too?\n\nAlex Dietrich: Yeah."},{"id":"1d1cbf19-921c-418d-bb25-ee9ddbd75a95","type":"testimony","location":"00:09:00.9-00:09:04.2","speaker":"Fravor, David","text":"During the USS Nimitz UAP encounter (2004-11-14), David Fravor confirmed his backseater saw the Unidentified Aerial Phenomena (UAP).","quote":"Bill Whitaker: Did your back seaters see this too?\n\nDavid Fravor: Oh, yeah."},{"id":"38012d10-545c-4b89-b718-6d5dd7acb5be","type":"measurement","location":"00:09:04.2-00:09:08.9","speaker":"Fravor, David","text":"During the USS Nimitz UAP encounter (2004-11-14), four crew members in two aircraft watched the Unidentified Aerial Phenomena (UAP) for roughly about five minutes.","quote":"There was four of us in the airplanes literally watching this thing for roughly about five minutes."},{"id":"2d7e9c29-f111-48da-b7a6-cc025165fce5","type":"measurement","location":"00:09:08.9-00:09:14.4","speaker":"Whitaker, Bill","text":"Seconds after the USS Nimitz UAP encounter (2004-11-14), the USS Princeton reacquired the target approximately 97 kilometres away.","quote":"Seconds later, the Princeton reacquired the target, 60 miles away."},{"id":"f90f33a6-82cc-42c1-96c8-4468e77eae72","type":"observation","location":"00:09:14.4-00:09:18.7","speaker":"Whitaker, Bill","text":"During the USS Nimitz UAP encounter (2004-11-14), another United States Navy crew managed to briefly lock onto the target with a targeting camera before it zipped off again.","quote":"Another crew managed to briefly lock onto it with a targeting camera before it zipped off again."},{"id":"3d3031b3-406f-4a52-bb09-cefb83cb5884","type":"opinion","location":"00:09:18.7-00:09:27.0","speaker":"Dietrich, Alex","text":"Alex Dietrich believes that if she had seen the USS Nimitz UAP encounter (2004-11-14) alone, she might not have reported it because it sounds crazy when she says it.","quote":"if I saw this solo, I don't know that I would have come back and said anything because it sounds so crazy when I say it."},{"id":"19da5e8a-96c7-4571-8254-c2bd782255e1","type":"opinion","location":"00:09:31.1-00:09:37.4","speaker":"Fravor, David","text":"David Fravor understands the reaction that describing the USS Nimitz UAP encounter (2004-11-14) can sound crazy.","quote":"Bill Whitaker: You understand that reaction?\n\nDavid Fravor: I do.\n\nI've had some people tell me, you know, when you say that, you can sound crazy."},{"id":"f9c5cbfa-e330-4a69-a76a-fb1b5bcf478a","type":"opinion","location":"00:09:37.4-00:09:37.9","speaker":"Fravor, David","text":"David Fravor does not consider himself a Unidentified Flying Object (UFO) guy.","quote":"I'll be honest.\n\nI'm not a UFO guy."},{"id":"267566bb-7480-46ea-ae79-d3fca02e3157","type":"opinion","location":"00:09:39.8-00:09:45.8","speaker":"Fravor, David","text":"David Fravor believes there was definitely something out there during the USS Nimitz UAP encounter (2004-11-14).","quote":"Bill Whitaker: But from what I hear you guys saying, there's something.\n\nDavid Fravor: Yes.\n\nThere's definitely something"},{"id":"ce0ca4aa-f983-4591-b126-5ac29e2811f7","type":"testimony","location":"00:09:45.8-00:09:52.6","speaker":"Fravor, David","text":"David Fravor does not know who was building the object observed in the USS Nimitz UAP encounter (2004-11-14).","quote":"I don't know who's building it"},{"id":"7dbb15d4-6ea4-4653-aeec-237148ed612b","type":"opinion","location":"00:09:45.8-00:09:52.6","speaker":"Fravor, David","text":"David Fravor believes the object observed in the USS Nimitz UAP encounter (2004-11-14) was better than the McDonnell Douglas F/A-18 Hornet (F/A-18).","quote":"there's something out there that was better than our airplane."},{"id":"e83b3d75-3cce-41a2-a469-2c8169201dc7","type":"administrative","location":"00:09:56.5-00:09:58.7","speaker":"Whitaker, Bill","text":"During the USS Nimitz UAP encounter (2004-11-14), the aircrew filed reports.","quote":"The air crew filed reports."},{"id":"9cb22c22-f891-4f9d-9883-2dd551fcc324","type":"administrative","location":"00:10:04.2-00:10:12.0","speaker":"Whitaker, Bill","text":"After the USS Nimitz UAP encounter (2004-11-14), nothing was said or done officially for five years until Luis Elizondo investigated it.","quote":"Nothing was said or done officially for five years until Lou Elizondo came across the story and investigated."},{"id":"3022d970-a252-483a-a251-2915fa9c46f5","type":"opinion","location":"00:10:13.2-00:10:19.1","speaker":"Elizondo, Luis","text":"Luis Elizondo considers that the United States Government spends millions of dollars training United States Navy pilots.","quote":"We spend millions of dollars in training these pilots"},{"id":"3d7cee93-94cd-4d2c-85fa-801d746e0870","type":"testimony","location":"00:10:13.2-00:10:19.1","speaker":"Elizondo, Luis","text":"Luis Elizondo describes United States Navy pilots as seeing something they cannot explain.","quote":"and they are seeing something that they can't explain."},{"id":"f8c985ac-f7bd-4bce-a5ad-c70c8cdd7e7e","type":"testimony","location":"00:10:19.1-00:10:25.3","speaker":"Elizondo, Luis","text":"Luis Elizondo describes information about such observations as being backed up by electro-optical data.","quote":"that information's being backed up on electro-optical data, like gun camera footage"},{"id":"3402b448-e30c-4a3f-90f2-34e2256288e0","type":"testimony","location":"00:10:19.1-00:10:25.3","speaker":"Elizondo, Luis","text":"Luis Elizondo describes information about such observations as being backed up by radar data.","quote":"and by radar data."},{"id":"289dcfa7-361c-4a1c-a19a-6cd41f87d198","type":"opinion","location":"00:10:25.3-00:10:25.3","speaker":"Elizondo, Luis","text":"Luis Elizondo considers radar and electro-optical backing for these observations compelling.","quote":"Now, to me, that's compelling."},{"id":"e53cd9a7-6f31-4855-b4c7-bf6457a842e3","type":"administrative","location":"00:10:27.7-00:10:31.7","speaker":"Whitaker, Bill","text":"Inside The Pentagon, Luis Elizondo's findings were met with scepticism.","quote":"Inside the Pentagon, his findings were met with skepticism."},{"id":"26f97a89-975f-47b5-827e-5c11f0d2674a","type":"administrative","location":"00:10:31.7-00:10:39.5","speaker":"Whitaker, Bill","text":"Funding for the Advanced Aerospace Threat Identification Program (AATIP) was eliminated in 2012.","quote":"AATIP's funding was eliminated in 2012"},{"id":"476747c3-a5a9-4ca4-aeeb-6338b4c2b8d7","type":"administrative","location":"00:10:31.7-00:10:39.5","speaker":"Whitaker, Bill","text":"After 2012, Luis Elizondo and a handful of others kept the mission of the Advanced Aerospace Threat Identification Program (AATIP) alive.","quote":"but Elizondo says he and a handful of others kept the mission alive."},{"id":"3136f03e-308e-47c3-9aba-13da7858ec31","type":"administrative","location":"00:10:39.5-00:10:48.8","speaker":"Whitaker, Bill","text":"In 2017, Luis Elizondo quit The Pentagon.","quote":"until finally, frustrated, he quit the Pentagon in 2017"},{"id":"c99a7aea-f88f-485b-bd34-5bae85211b90","type":"administrative","location":"00:10:39.5-00:10:48.8","speaker":"Whitaker, Bill","text":"Before quitting The Pentagon in 2017, Luis Elizondo got three United States Navy videos declassified.","quote":"but not before getting these three videos declassified."},{"id":"2eaf0c7f-4fe8-486a-9383-5ef586aa079c","type":"administrative","location":"00:10:51.9-00:10:57.5","speaker":"Mellon, Christopher","text":"Christopher Mellon tried to help Luis Elizondo elevate the issue of Unidentified Aerial Phenomena (UAP) within the United States Department of Defense (DoD) and get it to the Secretary of Defense.","quote":"I tried to help my colleague, Lou Elizondo, elevate the issue in the department and actually get it to the Secretary of Defense."},{"id":"11eaf5a7-b03f-4a67-8c97-822d3c5c675d","type":"administrative","location":"00:10:57.5-00:11:04.3","speaker":"Whitaker, Bill","text":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Bill Clinton.","quote":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton"},{"id":"a078acc4-d0e4-48e4-9608-76a11447e75a","type":"administrative","location":"00:11:01.0-00:11:04.3","speaker":"Whitaker, Bill","text":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for George W. Bush.","quote":"and George W.\n\nBush"},{"id":"c249e974-a87d-4cf2-9976-0e22c63a09d2","type":"administrative","location":"00:11:04.3-00:11:08.4","speaker":"Whitaker, Bill","text":"Christopher Mellon had access to top-secret United States Government programmes.","quote":"and had access to top-secret government programs."},{"id":"4125055a-d082-443f-aab9-ae961a1924cf","type":"opinion","location":"00:11:08.4-00:11:11.7","speaker":"Mellon, Christopher","text":"Christopher Mellon is highly confident that Unidentified Aerial Phenomena (UAP) are not United States technology.","quote":"So it's not us, that's one thing we know.\n\nWe know that?\n\nI could say that with a very high degree of confidence"},{"id":"13d496b5-f0dc-40ba-89a0-5278cf3877fe","type":"testimony","location":"00:11:11.7-00:11:18.7","speaker":"Mellon, Christopher","text":"Christopher Mellon bases his high confidence that Unidentified Aerial Phenomena (UAP) are not United States technology partly on the positions he held in the United States Department of Defense (DoD) and his knowledge of the process.","quote":"in part because of the positions I held in the department, and I know the process."},{"id":"97f657d7-df7a-4f8b-a5d1-b4a7d5c53e9a","type":"opinion","location":"00:11:18.7-00:11:26.2","speaker":"Whitaker, Bill","text":"Christopher Mellon grew concerned that nothing was being done about Unidentified Aerial Phenomena (UAP).","quote":"Mellon says he grew concerned nothing was being done about UAPs"},{"id":"dd1402d5-b5f0-4d7a-882c-01651e6ec2ff","type":"administrative","location":"00:11:26.2-00:11:34.5","speaker":"Whitaker, Bill","text":"In 2017, as a private citizen, Christopher Mellon surreptitiously acquired three declassified United States Navy videos and leaked them to The New York Times.","quote":"In 2017, as a private citizen, he surreptitiously acquired the three Navy videos Elizondo had declassified and leaked them to The New York Times."},{"id":"1b19ca43-3d30-456e-a5c1-3b90b1049657","type":"opinion","location":"00:11:37.0-00:11:46.1","speaker":"Mellon, Christopher","text":"Christopher Mellon considers it bizarre and unfortunate that he had to leak the United States Navy videos to get a national security issue onto the agenda.","quote":"It's bizarre and unfortunate that someone like myself has to do something like that to get a national security issue like this on the agenda."},{"id":"bc806ed5-8eaa-4e52-a40b-7ca2aabeba92","type":"administrative","location":"00:11:46.1-00:11:52.5","speaker":"Whitaker, Bill","text":"Christopher Mellon joined forces with Luis Elizondo after Luis Elizondo became a civilian.","quote":"He joined forces with now civilian Lou Elizondo"},{"id":"d63f42da-f44f-4333-8a5e-4face0cda037","type":"opinion","location":"00:11:57.6-00:12:07.2","speaker":"Mellon, Christopher","text":"Christopher Mellon believes engaging the public is necessary to get the United States Senate interested and then get the United States Department of Defense (DoD) to start taking a look at Unidentified Aerial Phenomena (UAP).","quote":"We knew and understood that you had to go to the public, get the public interested to get Congress interested, to then circle back to the Defense Department and get them to start taking a look at it."},{"id":"8dccbc94-caae-40a7-9290-eaf48022ed3f","type":"administrative","location":"00:12:07.2-00:12:15.6","speaker":"Whitaker, Bill","text":"In 2020-08, the United States Department of Defense (DoD) resurrected the Advanced Aerospace Threat Identification Program (AATIP) as the Unidentified Aerial Phenomena Task Force (UAPTF).","quote":"This past August, the Pentagon resurrected AATIP.\n\nIt's now called the UAP Task Force."},{"id":"1b225641-3065-4b4e-b989-c10759340286","type":"administrative","location":"00:12:15.6-00:12:20.1","speaker":"Whitaker, Bill","text":"United States Navy service members are encouraged to report strange encounters related to Unidentified Aerial Phenomena (UAP).","quote":"Service members now are encouraged to report strange encounters."},{"id":"e3f191bf-7dfb-4d76-a45e-af3661859148","type":"opinion","location":"00:12:22.6-00:12:26.5","speaker":"Rubio, Marco","text":"Marco Rubio considers anything that enters an airspace it is not supposed to be in to be a threat.","quote":"Anything that enters an airspace that's not supposed to be there is a threat."},{"id":"6a871a78-bd96-4871-b9ae-e0967e9d4a40","type":"administrative","location":"00:12:26.5-00:12:34.0","speaker":"Whitaker, Bill","text":"After receiving classified briefings on Unidentified Aerial Phenomena (UAP), Marco Rubio called for a detailed analysis.","quote":"After receiving classified briefings on UAPs, Senator Marco Rubio called for a detailed analysis."},{"id":"c2e2c3bf-10c3-4048-96b1-6a2892b434c0","type":"administrative","location":"00:12:34.0-00:12:46.3","speaker":"Whitaker, Bill","text":"In 2020-12, while head of the United States Senate Select Committee on Intelligence (SSCI), Marco Rubio asked the Office of the Director of National Intelligence (ODNI) and the United States Department of Defense (DoD) to present an unclassified report on Unidentified Aerial Phenomena (UAP) to the United States Senate.","quote":"This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month."},{"id":"bede73c1-0d08-4d86-876a-0fda4f779d74","type":"opinion","location":"00:12:59.0-00:13:00.8","speaker":"Rubio, Marco","text":"Marco Rubio believes there is a stigma on USA, District of Columbia, Capitol Hill regarding Unidentified Aerial Phenomena (UAP).","quote":"You know, there's a stigma on Capitol Hill."},{"id":"9021439f-3d82-440e-bf92-8f4b339e21dc","type":"observation","location":"00:13:00.8-00:13:06.9","speaker":"Rubio, Marco","text":"Marco Rubio observes that some of his colleagues in the United States Senate are very interested in Unidentified Aerial Phenomena (UAP).","quote":"some of my colleagues are very interested in this topic"},{"id":"b260b1bd-da07-40dd-9f8d-cd4b64e03c62","type":"observation","location":"00:13:00.8-00:13:06.9","speaker":"Rubio, Marco","text":"Marco Rubio observes that some of his colleagues in the United States Senate giggle when Unidentified Aerial Phenomena (UAP) are brought up.","quote":"and some kind of, you know, giggle when you bring it up."},{"id":"0b16de9e-ba1e-400e-a98e-3f4f92d18525","type":"opinion","location":"00:13:06.9-00:13:12.2","speaker":"Rubio, Marco","text":"Marco Rubio believes stigma should not prevent having an answer to a fundamental question about Unidentified Aerial Phenomena (UAP).","quote":"But I don't think we can allow the stigma to keep us from having an answer to a very fundamental question."},{"id":"77f75e36-0a37-439b-bbe4-4657ed89361a","type":"opinion","location":"00:13:14.1-00:13:17.3","speaker":"Rubio, Marco","text":"Marco Rubio wants the United States Government to take Unidentified Aerial Phenomena (UAP) seriously.","quote":"I want us to take it seriously"},{"id":"5f4b7cce-5b10-4913-a93e-c2a557f68d1f","type":"opinion","location":"00:13:14.1-00:13:17.3","speaker":"Rubio, Marco","text":"Marco Rubio wants the United States Government to have a process to take Unidentified Aerial Phenomena (UAP) seriously.","quote":"and have a process to take it seriously."},{"id":"fbf9ef5c-4687-42a0-9f1d-e74538e40f9c","type":"opinion","location":"00:13:17.3-00:13:19.7","speaker":"Rubio, Marco","text":"Marco Rubio wants the United States Government to have a process to analyse data about Unidentified Aerial Phenomena (UAP).","quote":"I want us to have a process to analyze the data."},{"id":"d28f773e-28dd-4309-8b22-394c39dcad32","type":"opinion","location":"00:13:19.7-00:13:25.9","speaker":"Rubio, Marco","text":"Marco Rubio wants data about Unidentified Aerial Phenomena (UAP) to be catalogued and constantly analysed until answers are obtained.","quote":"every time it comes in, that there be a place where this is cataloged and constantly analyzed until we get some answers."},{"id":"584bd924-775c-493c-8e41-59f190b2cf81","type":"opinion","location":"00:13:25.9-00:13:28.3","speaker":"Rubio, Marco","text":"Marco Rubio considers that Unidentified Aerial Phenomena (UAP) may have a very simple answer.","quote":"Maybe it has a very simple answer."},{"id":"3c7fef59-b5c5-4ac8-acbb-92c54093674e","type":"opinion","location":"00:13:25.9-00:13:28.3","speaker":"Rubio, Marco","text":"Marco Rubio considers that Unidentified Aerial Phenomena (UAP) may not have a very simple answer.","quote":"Maybe it doesn't."},{"id":"5587a4b2-7f90-43fc-9596-92c31f611632","type":"opinion","location":"00:13:37.3-00:13:41.7","speaker":"Dietrich, Alex","text":"Alex Dietrich felt vulnerable due to not having anything to defend against during the USS Nimitz UAP encounter (2004-11-14).","quote":"I felt the vulnerability of not having anything to defend ourselves."}],"nodes":[{"id":"56c7618c-a94d-431d-ab22-a6659f02863c","type":"topic","name":"Unidentified Aerial Phenomena (UAP)"},{"id":"2a32c612-f659-41a9-9804-19488e75e392","type":"topic","name":"Unidentified Flying Object (UFO)"},{"id":"24c722eb-155a-4abc-85fb-50adfe120d2d","type":"topic","name":"Anomalous Aerial Vehicle (AAV)"},{"id":"f9170c60-ad88-434b-8abe-ec2427908d28","type":"document","name":"Navy pilots describe encounters with Unidentified Aerial Phenomena (UAP) (60 Minutes video, 2021-05-17)"},{"id":"8f9a6511-a125-4d4c-9b7e-1b56b54314a8","type":"organisation","name":"60 Minutes"},{"id":"51106540-e2db-4558-a30f-630a8258d742","type":"document","name":"60MinutesOvertime.com"},{"id":"0949aa1b-7ac2-4fd3-a306-f73179b266ad","type":"organisation","name":"The New York Times"},{"id":"31660195-9cd3-40f6-a1b2-30d741ab3c0c","type":"organisation","name":"History Channel"},{"id":"4c94dc2c-7d8a-49f2-81af-802602f680ec","type":"organisation","name":"Kologuard"},{"id":"0b9e6d7c-7d19-4241-8ba8-0a13b9809b04","type":"organisation","name":"United States Government"},{"id":"f5d28d3c-6e18-4edf-9533-a097c07717b8","type":"organisation","name":"United States Department of Defense (DoD)"},{"id":"43751297-eab2-4f01-9b8c-37eacdc8107e","type":"organisation","name":"Office of the Director of National Intelligence (ODNI)"},{"id":"52d0129e-af17-4d90-a425-60dc7ba05f55","type":"organisation","name":"United States Senate"},{"id":"a927c9de-cb8e-4769-9248-c36820451fe0","type":"organisation","name":"United States Senate Select Committee on Intelligence (SSCI)"},{"id":"ec98d5c5-5224-4239-bbd3-9dbd794b455a","type":"organisation","name":"United States Navy"},{"id":"50fd0c26-019e-4468-9bf9-85e8e71cbbb0","type":"organisation","name":"United States Navy Strike Fighter Tactics Instructor program (TOPGUN)"},{"id":"3824cf54-00c5-465f-b8a1-04202a6d73e2","type":"project","name":"Advanced Aerospace Threat Identification Program (AATIP)"},{"id":"4d5f18d3-52ac-40ef-af59-5b5b98f7a589","type":"project","name":"Unidentified Aerial Phenomena Task Force (UAPTF)"},{"id":"bd6a89f6-0c4d-4a4d-af7c-db9497e05e1d","type":"project","name":"Project Blue Book"},{"id":"de8e3f1c-de46-4cf6-97ea-49c55170e9c4","type":"person","name":"Whitaker, Bill"},{"id":"5d355cb8-39e3-4e0f-ac7e-102eca50637b","type":"person","name":"Elizondo, Luis"},{"id":"32b606cc-dbb6-4576-9e3d-d115c76193d1","type":"person","name":"Reid, Harry"},{"id":"c8a36b64-820b-494d-8b8d-166b5802ee06","type":"person","name":"Graves, Ryan"},{"id":"6489c825-d804-4afe-89c9-ca70e75b06d8","type":"person","name":"Fravor, David"},{"id":"e8fbfad4-c999-48fe-b734-a056b256ee08","type":"person","name":"Dietrich, Alex"},{"id":"252aa893-b6c0-487b-977a-2b4f2e88e679","type":"person","name":"Mellon, Christopher"},{"id":"557582b9-3668-4aaf-a063-474cbf767594","type":"person","name":"Rubio, Marco"},{"id":"cbe96f03-97c3-44d9-8158-43a8fa62629c","type":"person","name":"Clinton, Bill"},{"id":"32a2a8a6-69ed-49d2-a8a8-8a68361ca2b7","type":"person","name":"Bush, George W."},{"id":"e6c3fbb8-0ea0-4298-853f-c7c949c6ea85","type":"object","name":"The Pentagon"},{"id":"57491d59-eaad-46cf-9215-73668af84c13","type":"object","name":"USS Nimitz"},{"id":"bd65166f-410a-4f9d-b3c1-1ee88379b8f2","type":"object","name":"USS Princeton"},{"id":"7807150d-6280-42fb-9ffa-edd2ef891989","type":"object","name":"McDonnell Douglas F/A-18 Hornet (F/A-18)"},{"id":"f35c26cb-5f6b-4b25-a982-c951b466260d","type":"object","name":"Boeing 737"},{"id":"ea125a31-87ef-4edd-8b31-afe619b7d63b","type":"place","name":"Cuba, Guantanamo Bay"},{"id":"14a0df0b-1b31-484d-8354-cecab0613a88","type":"place","name":"USA, Virginia, Virginia Beach"},{"id":"4ffa67e3-247f-416e-8de2-ffc237bbf991","type":"place","name":"USA, Florida, Jacksonville"},{"id":"f3293848-7d18-46b6-a485-670e045bae91","type":"place","name":"USA, California, Southern California"},{"id":"03763ff8-5603-490f-956b-89f89fead0de","type":"place","name":"USA, California, San Diego"},{"id":"c7c27685-1111-40f6-bf35-1fe05213c1e9","type":"place","name":"USA, District of Columbia, Capitol Hill"},{"id":"e7c4a553-16b4-4950-a88b-550cae919579","type":"place","name":"USA, Atlantic Coast"},{"id":"90b8a5be-4b2c-43a9-a298-951e6d8a6869","type":"event","name":"Closure of Project Blue Book (1969)"},{"id":"3bc29b7c-6bd9-4782-899b-3da97d2c9253","type":"event","name":"USS Nimitz UAP encounter (2004-11-14)"},{"id":"092874be-5463-4f68-8c9f-bc2b18c59114","type":"event","name":"UAP sightings southeast of Virginia Beach (2014-2016)"},{"id":"4e2150cb-99ba-4e1f-b281-dae9041ffc06","type":"event","name":"UAP sighting off USA Atlantic Coast (2015)"},{"id":"264a5cbc-5789-4979-a609-56d74dd75a23","type":"event","name":"UAP sighting off Jacksonville, Florida (2015)"},{"id":"1d8d46dc-5b53-4e1c-a84b-62e07c405258","type":"event","name":"Termination of Advanced Aerospace Threat Identification Program funding (2012)"},{"id":"1e89eab2-3b1e-4a63-9cd8-32f26c6cde0f","type":"event","name":"Luis Elizondo resignation from United States Department of Defense (2017)"},{"id":"1963e6e5-6f1f-4a0d-af1d-fb2cf56d391b","type":"event","name":"Leak of declassified United States Navy UAP videos to The New York Times (2017)"},{"id":"95fcf329-3dc5-4e00-953a-eb280b87598b","type":"event","name":"Creation of Unidentified Aerial Phenomena Task Force (UAPTF) (2020-08)"},{"id":"f6ee121e-91a9-47e9-afc4-294cda0079c1","type":"event","name":"United States Senate Select Committee on Intelligence request for UAP report (2020-12)"}]},{"id":"qwen_qwen3-235b-a22b-2507","name":"qwen / qwen3-235b-a22b-2507","errata":null,"claims":[{"id":"af99b671-80c8-4ed5-b6e3-6be51c4e2f6a","type":"testimony","location":"00:00:56.3-00:00:59.6","speaker":"Elizondo, Luis","text":"The United States government has officially confirmed for the record that Unidentified Aerial Phenomena (UAP) are real.","quote":"The government has already stated for the record that they're real."},{"id":"4d18e6ec-a6e4-4431-a4b7-c2d3ed94ae6c","type":"administrative","location":"00:01:02.4-00:01:11.5","speaker":null,"text":"Luis Elizondo spent 20 years running military intelligence operations in Afghanistan, the Middle East, and Guantanamo.","quote":"Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo."},{"id":"50738ac3-e2c5-465d-a8e2-20d4f43f079c","type":"administrative","location":"00:01:15.6-00:01:24.1","speaker":null,"text":"Luis Elizondo joined the Advanced Aerospace Threat Identification Program (AATIP) in 2008.","quote":"That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP."},{"id":"99bc3999-231c-4b83-8131-0e4e8fdc4c75","type":"administrative","location":"00:01:24.1-00:01:34.3","speaker":"Elizondo, Luis","text":"The mission of the Advanced Aerospace Threat Identification Program (AATIP) was to collect and analyse information involving anomalous aerial vehicles, also known as Unidentified Aerial Phenomena (UAP).","quote":"The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs. We call them UAPs."},{"id":"69c3f0e3-1be2-4cd7-bf54-4911fd5432f8","type":"administrative","location":"00:01:50.3-00:02:01.6","speaker":null,"text":"The Advanced Aerospace Threat Identification Program (AATIP) was part of a $22 million programme sponsored by Senator Harry Reid.","quote":"Buried away in the Pentagon, AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs."},{"id":"92ade35a-6b3f-4d70-a020-a31c85549968","type":"administrative","location":"00:02:01.6-00:02:10.8","speaker":null,"text":"Luis Elizondo took over leadership of the Advanced Aerospace Threat Identification Program (AATIP) in 2010.","quote":"When Elizondo took over in 2010, he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members."},{"id":"d1ba7fba-3ed2-4bb6-b7a7-6488e1c832a2","type":"domain","location":"00:02:01.6-00:02:10.8","speaker":null,"text":"The Advanced Aerospace Threat Identification Program (AATIP) focused on the national security implications of Unidentified Aerial Phenomena (UAP) witnessed by U.S. service members.","quote":"When Elizondo took over in 2010, he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members."},{"id":"828da73d-0ca8-46b8-ad99-62ccf7c42f21","type":"measurement","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Unidentified Aerial Phenomena (UAP) have been observed to perform at 600 to 700 G-forces.","quote":"Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity."},{"id":"55eae429-f0ba-4a06-9676-16a05b2f724f","type":"measurement","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Unidentified Aerial Phenomena (UAP) have been observed to fly at approximately 21,000 kilometres per hour.","quote":"Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity."},{"id":"6b0085a0-b273-4193-9e55-447b9e3a9ad0","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Unidentified Aerial Phenomena (UAP) have been observed to evade radar.","quote":"Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity."},{"id":"02291753-b5d6-480c-b807-2ae57ddadf55","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Unidentified Aerial Phenomena (UAP) have been observed to fly through air, water, and possibly space.","quote":"Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity."},{"id":"656a61d7-dbcf-4dcc-bd9b-5e660786d25f","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Unidentified Aerial Phenomena (UAP) have been observed to have no obvious propulsion systems, wings, or control surfaces.","quote":"Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity."},{"id":"63ed6907-c3ef-44e0-acdb-764b8369a7d8","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Unidentified Aerial Phenomena (UAP) have been observed to defy the natural effects of Earth's gravity.","quote":"Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity."},{"id":"69e2b379-4857-4cc6-8ef6-f72e0fa98b8a","type":"administrative","location":"00:02:37.0-00:02:47.7","speaker":null,"text":"The Advanced Aerospace Threat Identification Program (AATIP) consisted of scientists, electro-optical engineers, avionics experts, and intelligence analysts who often worked part-time.","quote":"Elizondo tells us AATIP was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time."},{"id":"9607d169-be85-4925-8213-41947dc96580","type":"administrative","location":"00:02:47.7-00:02:57.7","speaker":null,"text":"The Advanced Aerospace Threat Identification Program (AATIP) analysed video data from naval encounters with Unidentified Aerial Phenomena (UAP).","quote":"They combed through data and records and analyzed videos like this."},{"id":"85061720-b68d-489b-88dd-35aae7d15a69","type":"observation","location":"00:02:57.7-00:03:02.1","speaker":null,"text":"A Navy aircrew observed a fast-moving Unidentified Aerial Phenomenon (UAP) off the U.S. Atlantic coast in 2015.","quote":"A Navy aircrew struggles to lock onto a fast-moving object off the U.S. Atlantic coast in 2015."},{"id":"233a5d41-cc08-4938-9550-39d8aa2884f0","type":"testimony","location":"00:03:07.3-00:03:20.4","speaker":null,"text":"The Pentagon does not know the identity of recently released UAP images.","quote":"Recently released images may not convince UFO skeptics, but the Pentagon admits it doesn't know what in the world this is, or this, or this."},{"id":"fbfe02d9-3815-4e1b-b7a8-2f9eafba5e0d","type":"hearsay","location":"00:03:30.4-00:03:37.4","speaker":"Elizondo, Luis","text":"Some Unidentified Aerial Phenomena (UAP) sightings have simple explanations such as refracted light, weather balloons, rockets, or Venus.","quote":"In some cases, there are simple explanations for what people are witnessing, but there are some that that are not."},{"id":"9403e26d-ab9d-437d-b5b4-646de514ff34","type":"process","location":"00:03:38.6-00:03:52.6","speaker":"Elizondo, Luis","text":"The Advanced Aerospace Threat Identification Program (AATIP) systematically ruled out conventional explanations such as Chinese cruise missile technology or high-altitude reconnaissance balloons before concluding that some Unidentified Aerial Phenomena (UAP) are unexplained.","quote":"We're not just simply jumping to a conclusion that's saying, oh, that's a UAP out there. We're going through our due diligence. Is it some sort of new type of cruise missile technology that China has developed? Is it some sort of high-altitude balloon that's conducting reconnaissance? Ultimately, when you have exhausted all those what-ifs and you're still left with the fact that this is in our airspace and it's real, that's when it becomes compelling and that's when it becomes problematic."},{"id":"64afeb62-1055-48ee-a7d1-a51096c4353e","type":"observation","location":"00:04:12.9-00:04:29.7","speaker":null,"text":"Unidentified Aerial Phenomena (UAP) have been observed both on radar and with infrared targeting cameras.","quote":"So you're seeing it both with the radar and with the infrared, and that tells you that there is something out there."},{"id":"a0d6f023-3df6-435a-bd27-f28b7f30e55f","type":"opinion","location":"00:04:29.7-00:04:37.1","speaker":"Graves, Ryan","text":"The dual radar-and-infrared detection of Unidentified Aerial Phenomena (UAP) is hard to spoof.","quote":"Bill Whitaker: So you're seeing it both with the radar and with the infrared, and that tells you that there is something out there. Ryan Graves: Pretty hard to spoof that."},{"id":"b991321c-b8ad-41bc-b697-d9af1284d3bc","type":"testimony","location":"00:04:43.0-00:04:48.2","speaker":null,"text":"The Pentagon has confirmed that recently released photos show objects it cannot identify.","quote":"The Pentagon confirms these are images of objects it can't identify."},{"id":"424c3349-feff-4cef-a26d-6beb6e562b5f","type":"testimony","location":"00:04:55.3-00:05:02.5","speaker":"Graves, Ryan","text":"Ryan Graves observed that pilots training off the Atlantic coast see Unidentified Aerial Phenomena (UAP) every day for at least a couple of years.","quote":"Bill Whitaker: Every day for a couple of years? Ryan Graves: Mm-hmm. Every day for at least a couple of years."},{"id":"d70098a1-0a30-4f2f-8dfd-77dacb81e0ae","type":"observation","location":"00:05:01.2-00:05:02.5","speaker":"Graves, Ryan","text":"Ryan Graves observed no exhaust plume on a Unidentified Aerial Phenomenon (UAP) off the Atlantic coast.","quote":"Bill Whitaker: Every day for a couple of years? Ryan Graves: Mm-hmm. You know, I don't see an exhaust plume."},{"id":"b076dcd3-74ca-4a1e-ade8-bf76972bac86","type":"observation","location":"00:04:58.7-00:05:23.8","speaker":"Graves, Ryan","text":"A video captured by members of Ryan Graves' squadron in 2015 near Jacksonville, Florida, shows a rotating Unidentified Aerial Phenomenon (UAP) moving against 120-knot winds.","quote":"Bill Whitaker: including this one, off the coast of Jacksonville, Florida in 2015, captured on a targeting camera by members of Graves' squadron. [external footage]: Look at that thing! It's rotating. My gosh! They're all going against the wind. The wind's 120 knots far west."},{"id":"9a0cb117-51d5-46d1-b642-993712d22cdc","type":"observation","location":"00:05:25.4-00:05:27.9","speaker":"Graves, Ryan","text":"Ryan Graves observed that aircrew voices expressed surprise and amazement when observing a rotating Unidentified Aerial Phenomenon (UAP) off the Atlantic coast.","quote":"Bill Whitaker: You can sort of hear the surprise in their voices. Ryan Graves: You certainly can. They seem to have broke character a bit, and were just kind of amazed at what they were seeing."},{"id":"f3797029-cbb2-4261-9d88-0270e5d59d29","type":"opinion","location":"00:05:33.2-00:05:42.8","speaker":"Graves, Ryan","text":"Ryan Graves finds the rotating, high-altitude Unidentified Aerial Phenomenon (UAP) with propulsion difficult to explain and does not know what it is.","quote":"Bill Whitaker: What do you think when you see something like this? Ryan Graves: This is a difficult one to explain. You have rotation, you have high altitudes, you have propulsion, right? I don't know. I don't know what it is, frankly."},{"id":"a6401db7-46ca-4db9-b642-12d94f8626b5","type":"opinion","location":"00:05:44.9-00:05:56.0","speaker":"Graves, Ryan","text":"Ryan Graves considers the most probable explanation for Unidentified Aerial Phenomena (UAP) to be a threat observation programme.","quote":"Bill Whitaker: He told us pilots speculate they are one of three things, secret U.S. technology, an adversary spy vehicle, or something otherworldly. Ryan Graves: I'd say, you know, the highest probability is it's a threat observation program."},{"id":"73e2510a-e80e-4976-be73-39023f7c2ec5","type":"opinion","location":"00:06:00.5-00:06:04.1","speaker":"Graves, Ryan","text":"Ryan Graves considers Russian or Chinese technology a possible explanation for the observed Unidentified Aerial Phenomena (UAP).","quote":"Bill Whitaker: Could it be Russian or Chinese technology? Ryan Graves: I don't see why not."},{"id":"c7e87ea3-9889-470c-857b-2d915eaeb8eb","type":"opinion","location":"00:06:05.4-00:06:18.5","speaker":"Graves, Ryan","text":"Ryan Graves is worried about the presence of Unidentified Aerial Phenomena (UAP) over U.S. airspace.","quote":"Bill Whitaker: Are you alarmed? Ryan Graves: I am worried, frankly. You know, if these were tactical jets from another country that were hanging out up there, it would be a massive issue. But because it looks slightly different, we're not willing to actually look at the problem in the face. We're happy to just ignore the fact that these are out there watching us every day."},{"id":"30c36677-a0fb-4107-9e16-0590a4e5c6ed","type":"historical","location":"00:06:23.4-00:06:30.3","speaker":null,"text":"The United States government publicly ignored Unidentified Aerial Phenomena (UAP) after closing Project Blue Book in 1969.","quote":"The government has ignored it, at least publicly, since closing its Project Blue Book investigation in 1969."},{"id":"5af545c2-e161-4321-95c5-af6970ffbd54","type":"testimony","location":"00:06:30.3-00:06:40.8","speaker":null,"text":"The 2004 USS Nimitz UAP encounter was documented by radar, camera, and four naval aviators.","quote":"But that began to change after an incident off Southern California in 2004, which was documented by radar, by camera, and four naval aviators."},{"id":"f41600a3-bc7b-4493-b888-a1054dedb4d2","type":"administrative","location":"00:06:40.8-00:06:57.3","speaker":null,"text":"David Fravor is a graduate of the Top Gun Naval Flight School and was commander of Strike Fighter Squadron 41 (VFA-41) on the USS Nimitz.","quote":"We spoke to two of them, David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz, and flying at his wing, Lieutenant Alex Dietrich, who has never spoken publicly about the encounter."},{"id":"b663016c-9392-4ae8-8bfb-c1b635a325e3","type":"administrative","location":"00:06:40.8-00:06:57.3","speaker":null,"text":"Alex Dietrich had never spoken publicly about the 2004 USS Nimitz UAP encounter before this interview.","quote":"We spoke to two of them, David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz, and flying at his wing, Lieutenant Alex Dietrich, who has never spoken publicly about the encounter."},{"id":"04755319-cf5e-454d-9ed4-6f45bd7c4178","type":"opinion","location":"00:07:01.1-00:07:14.4","speaker":"Dietrich, Alex","text":"Alex Dietrich feels a responsibility to share his unclassified experience from the 2004 USS Nimitz UAP encounter because he was on duty in a government aircraft.","quote":"Bill Whitaker: So why are you doing this? Alex Dietrich: Because I was in a government aircraft, because I was on the clock, and so I feel a responsibility to share what I can, and it is unclassified."},{"id":"63dca80e-303f-435b-9c6b-8f67de2227b7","type":"historical","location":"00:07:14.4-00:07:23.1","speaker":null,"text":"In November 2004, the USS Nimitz Carrier Strike Group was training approximately 160 kilometres southwest of San Diego.","quote":"It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego."},{"id":"357159e4-be4d-4888-a4b9-8ed3fc030829","type":"observation","location":"00:07:23.1-00:07:39.3","speaker":null,"text":"The USS Princeton's advanced radar detected multiple anomalous aerial vehicles descending from approximately 24,000 metres in less than a second over the horizon in 2004.","quote":"For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 80,000 feet in less than a second."},{"id":"68e936a9-a2d7-4425-b030-7faf8b2caeed","type":"historical","location":"00:07:39.3-00:07:47.8","speaker":null,"text":"On 2004-11-14, David Fravor and Alex Dietrich were diverted to investigate anomalous radar contacts detected by the USS Princeton.","quote":"On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate."},{"id":"848fe161-c625-4d80-969c-2ec2e6d9f828","type":"observation","location":"00:07:47.8-00:07:55.9","speaker":"Fravor, David","text":"David Fravor observed a roiling area of white water the size of a Boeing 737 in an otherwise calm sea during the 2004 USS Nimitz UAP encounter.","quote":"They found an area of roiling white water the size of a 737 in an otherwise calm blue sea."},{"id":"3ae8ce8b-3617-42c0-8e35-b1f5a0031a36","type":"observation","location":"00:07:55.9-00:08:09.7","speaker":"Fravor, David","text":"David Fravor observed a white Tic Tac-shaped object moving above roiling water during the 2004 USS Nimitz UAP encounter.","quote":"And we saw this little white tic-tac-looking object. And it's just kind of moving above the whitewater area."},{"id":"d08b1f89-3909-4c42-b319-19e9811a6d7d","type":"observation","location":"00:08:18.5-00:08:24.5","speaker":"Fravor, David","text":"During the 2004 USS Nimitz UAP encounter, the observed object mirrored David Fravor's manoeuvres as he descended towards it.","quote":"The tic-tac's still pointing north-south. It goes and just turns abruptly and starts mirroring me. So as I'm coming down, it starts coming up."},{"id":"baef7dfb-3b39-4820-b5ca-dbab4182b267","type":"observation","location":"00:08:27.0-00:08:30.5","speaker":"Fravor, David","text":"David Fravor observed that the Tic Tac-shaped object was aware of his presence during the 2004 USS Nimitz UAP encounter.","quote":"So it's mimicking your moves. David Fravor: Yeah, it was aware we were there."},{"id":"f73a4a50-3df4-47e9-ad36-4454542dc000","type":"observation","location":"00:08:30.5-00:08:37.0","speaker":"Fravor, David","text":"The Tic Tac-shaped object observed during the 2004 USS Nimitz UAP encounter was approximately the size of an F/A-18, had no markings, wings, or exhaust plumes.","quote":"He said it was about the size of his F-18, with no markings, no wings, no exhaust plumes."},{"id":"9c11a06e-e3cf-4628-9368-6125e9cef112","type":"observation","location":"00:08:37.0-00:08:47.8","speaker":"Fravor, David","text":"During the 2004 USS Nimitz UAP encounter, the Tic Tac-shaped object disappeared abruptly when David Fravor approached it, having sped away.","quote":"I want to see how close I can get. So I go like this, and it's climbing still. And when it gets right in front of me, it just disappears. Disappears? Disappears, like gone. It had sped off."},{"id":"c8b09c65-3ea9-4cb8-8d89-2d4ccf9a8c15","type":"testimony","location":"00:09:03.5-00:09:08.9","speaker":"Fravor, David","text":"Four crew members in two F/A-18 aircraft observed the Tic Tac-shaped object during the 2004 USS Nimitz UAP encounter for approximately five minutes.","quote":"There was four of us in the airplanes literally watching this thing for roughly about five minutes."},{"id":"3af35808-52c9-4c07-9d86-8d398035f963","type":"observation","location":"00:08:49.4-00:09:14.4","speaker":null,"text":"The USS Princeton reacquired the Tic Tac-shaped object 97 kilometres away seconds after it disappeared from visual observation during the 2004 USS Nimitz UAP encounter.","quote":"Seconds later, the Princeton reacquired the target, 60 miles away."},{"id":"d06a9076-e15f-443f-91c9-c2dd9ba50c8b","type":"observation","location":"00:09:14.4-00:09:20.8","speaker":null,"text":"Another aircrew briefly locked onto the Tic Tac-shaped object with a targeting camera before it rapidly departed during the 2004 USS Nimitz UAP encounter.","quote":"Another crew managed to briefly lock onto it with a targeting camera before it zipped off again."},{"id":"ca2b72b8-0eea-4f60-8cad-08041ab6aec0","type":"opinion","location":"00:09:20.8-00:09:31.1","speaker":"Dietrich, Alex","text":"Alex Dietrich remarked that if he had seen the Tic Tac-shaped object alone during the 2004 USS Nimitz UAP encounter, he might not have reported it because it sounds so implausible.","quote":"You know, I think that over beers, we've sort of said, hey, man, if I saw this solo, I don't know that I would have come back and said anything because it sounds so crazy when I say it."},{"id":"ec4bde31-8547-472b-aa9a-a4e21bc583ee","type":"opinion","location":"00:09:31.1-00:09:39.8","speaker":"Fravor, David","text":"David Fravor acknowledges that describing the 2004 USS Nimitz UAP encounter can make someone sound crazy, even though he personally does not identify as a UFO enthusiast.","quote":"I do. I've had some people tell me, you know, when you say that, you can sound crazy. I'll be honest. I'm not a UFO guy."},{"id":"35cefa47-a6fe-45bf-bf8b-060e9f0dea53","type":"opinion","location":"00:09:45.5-00:09:56.5","speaker":"Fravor, David","text":"David Fravor believes there is definitively something in the 2004 USS Nimitz UAP encounter that was technologically superior to his aircraft.","quote":"Yes. There's definitely something that, I don't know who's building it, who's got the technology, who's got the brains, but there's something out there that was better than our airplane."},{"id":"5862327f-49a5-4efe-9a12-c826cbcfda3d","type":"administrative","location":"00:09:56.5-00:09:58.7","speaker":null,"text":"Naval aviators submitted official reports after the 2004 USS Nimitz UAP encounter.","quote":"The air crew filed reports."},{"id":"86d5d531-34a2-472b-b06d-6da5f1e2970c","type":"historical","location":"00:09:58.7-00:10:04.2","speaker":null,"text":"The 2004 USS Nimitz UAP encounter received no official response for five years.","quote":"Then, like the mysterious flying object, the Nimitz encounter disappeared. Nothing was said or done officially for five years"},{"id":"6d5f5abe-1b2e-4594-b5f8-599f0f5a28d1","type":"administrative","location":"00:09:58.7-00:10:13.2","speaker":null,"text":"Luis Elizondo investigated the 2004 USS Nimitz UAP encounter after encountering it within the Pentagon.","quote":"until finally, frustrated, he quit the Pentagon in 2017, but not before getting these three videos declassified. Inside the Pentagon, his findings were met with skepticism. AATIP's funding was eliminated in 2012, but Elizondo says he and a handful of others kept the mission alive. Nothing was said or done officially for five years until Lou Elizondo came across the story and investigated."},{"id":"c625a4f1-afc1-408e-946d-457c864d6893","type":"opinion","location":"00:10:13.2-00:10:25.3","speaker":"Elizondo, Luis","text":"Luis Elizondo considers it compelling that trained military pilots observe Unidentified Aerial Phenomena (UAP) that are corroborated by electro-optical and radar data.","quote":"We spend millions of dollars in training these pilots, and they are seeing something that they can't explain. Furthermore, that information's being backed up on electro-optical data, like gun camera footage, and by radar data. Now, to me, that's compelling."},{"id":"eeb357c3-ab0b-4df0-9d97-1414b3a0cfea","type":"administrative","location":"00:10:27.7-00:10:39.5","speaker":null,"text":"The Advanced Aerospace Threat Identification Program (AATIP) faced internal skepticism and had its funding eliminated in 2012.","quote":"Inside the Pentagon, his findings were met with skepticism. AATIP's funding was eliminated in 2012, but Elizondo says he and a handful of others kept the mission alive."},{"id":"95e7fef4-3f8b-43d0-8db8-34e837823450","type":"administrative","location":"00:10:31.7-00:10:39.5","speaker":"Elizondo, Luis","text":"Luis Elizondo continued the Advanced Aerospace Threat Identification Program (AATIP) mission informally after 2012.","quote":"AATIP's funding was eliminated in 2012, but Elizondo says he and a handful of others kept the mission alive."},{"id":"22795faf-8f93-4fac-9251-c453a7f14a83","type":"administrative","location":"00:10:39.5-00:10:48.8","speaker":"Elizondo, Luis","text":"Luis Elizondo resigned from the Pentagon in 2017 after becoming frustrated with the lack of official action on Unidentified Aerial Phenomena (UAP).","quote":"until finally, frustrated, he quit the Pentagon in 2017"},{"id":"3f882367-a95f-43bc-bc5f-fd3e6bf2cacb","type":"administrative","location":"00:10:39.5-00:10:48.8","speaker":"Elizondo, Luis","text":"Luis Elizondo succeeded in declassifying three Navy UAP videos before leaving the Pentagon in 2017.","quote":"until finally, frustrated, he quit the Pentagon in 2017, but not before getting these three videos declassified."},{"id":"2b164a32-0536-4858-a8ce-81bf98938735","type":"administrative","location":"00:10:57.5-00:11:04.3","speaker":null,"text":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence under Presidents Clinton and George W. Bush.","quote":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush, and had access to top-secret government programs."},{"id":"49d541f2-d76e-4168-94ed-5bfee35efc5f","type":"opinion","location":"00:11:11.7-00:11:18.7","speaker":"Mellon, Christopher","text":"Christopher Mellon asserts with high confidence that the observed Unidentified Aerial Phenomena (UAP) are not of U.S. origin.","quote":"I could say that with a very high degree of confidence, in part because of the positions I held in the department, and I know the process."},{"id":"0a315d5f-95ac-436c-804f-ab806c606b23","type":"opinion","location":"00:11:37.0-00:11:46.1","speaker":"Mellon, Christopher","text":"Christopher Mellon described leaking the Navy UAP videos as bizarre and unfortunate, necessary to gain attention for a national security issue.","quote":"It's bizarre and unfortunate that someone like myself has to do something like that to get a national security issue like this on the agenda."},{"id":"f8f5cf13-a8a3-4c89-a9fb-977639aa933b","type":"administrative","location":"00:12:09.1-00:12:12.6","speaker":null,"text":"The Department of Defense has resumed the work of the Advanced Aerospace Threat Identification Program (AATIP) under the new name UAP Task Force.","quote":"This past August, the Pentagon resurrected AATIP. It's now called the UAP Task Force."},{"id":"50cae066-c375-4626-a1ca-1623be1609fa","type":"administrative","location":"00:12:15.6-00:12:20.1","speaker":null,"text":"The UAP Task Force encourages service members to report Unidentified Aerial Phenomena (UAP) encounters.","quote":"Service members now are encouraged to report strange encounters."},{"id":"4aa224be-6dde-4b6a-ae95-fda783a595a6","type":"opinion","location":"00:12:22.6-00:12:26.5","speaker":"Rubio, Marco","text":"Marco Rubio believes any object in restricted airspace that is not supposed to be there constitutes a threat.","quote":"Anything that enters an airspace that's not supposed to be there is a threat."},{"id":"fd7ac5a6-5642-474c-9706-2ae0fd6ac608","type":"opinion","location":"00:13:12.2-00:13:25.9","speaker":"Rubio, Marco","text":"Marco Rubio wants a serious and systematic process in place to analyse Unidentified Aerial Phenomena (UAP) data as it comes in.","quote":"I want us to take it seriously and have a process to take it seriously. I want us to have a process to analyze the data. every time it comes in, that there be a place where this is cataloged and constantly analyzed until we get some answers."},{"id":"04f648a7-f0bf-4d95-b07e-64dff5347b84","type":"opinion","location":"00:13:37.3-00:13:41.7","speaker":"Dietrich, Alex","text":"Alex Dietrich felt vulnerable during the 2004 USS Nimitz UAP encounter because he had no means of defence.","quote":"I felt the vulnerability of not having anything to defend ourselves."}],"nodes":[{"id":"ab3fb0de-507a-4491-bf47-f9cc063850ab","type":"organisation","name":"United States Navy"},{"id":"3b5d0a74-74e2-4549-8b83-470371de2971","type":"project","name":"Advanced Aerospace Threat Identification Program (AATIP)"},{"id":"778a1cbd-7dd1-4bff-9189-6f77c6163988","type":"topic","name":"Unidentified Aerial Phenomena (UAP)"},{"id":"c70ebe21-cbcc-464c-a303-d919ae4d57fe","type":"event","name":"2004 USS Nimitz UAP encounter"},{"id":"6a6322de-5d16-448e-8b2c-e201a75353db","type":"person","name":"Elizondo, Luis"},{"id":"61757438-3931-4ddc-858c-29b2cfa4c2ab","type":"person","name":"Fravor, David"},{"id":"492564f6-b9af-42a2-8a4c-640217fe85f0","type":"person","name":"Dietrich, Alex"},{"id":"81065125-9fe2-4a0a-a753-337f40d36ad8","type":"person","name":"Graves, Ryan"},{"id":"0c6bf449-b878-4f28-9b10-1e3319ad94a8","type":"person","name":"Mellon, Christopher"},{"id":"9998efcc-00bb-40e4-918b-dfbe8ceddef5","type":"person","name":"Rubio, Marco"},{"id":"01f1006f-3db0-492e-9003-4997746919f4","type":"organisation","name":"United States Senate"},{"id":"59be2fac-4ef3-476a-812d-cb712193b5a0","type":"organisation","name":"United States Congress"},{"id":"2ba556a4-f70d-411f-a6f2-41c711bf923b","type":"organisation","name":"Director of National Intelligence (DNI)"},{"id":"bab8348c-a396-4090-adee-604eed4a499d","type":"organisation","name":"Secretary of Defense"},{"id":"cae0bbc9-6027-4f1b-8eee-8cdee6a9f461","type":"project","name":"UAP Task Force"},{"id":"52e9351d-057a-4007-93a2-66e16e86522d","type":"project","name":"Project Blue Book"},{"id":"52d0bbb4-a036-4d83-a1f4-78c4c46d7410","type":"organisation","name":"Top Gun Naval Flight School"},{"id":"d9053015-d2f1-4644-93f6-3ae9ee46f64d","type":"object","name":"USS Nimitz"},{"id":"73eee403-e08c-4186-9069-2801ad046d33","type":"object","name":"USS Princeton"},{"id":"cff7d5c0-20a1-499a-a8b8-a86cbcc17a2e","type":"object","name":"F/A-18"},{"id":"d98025b9-c7c5-4c6f-9e59-f929a579663f","type":"organisation","name":"New York Times"},{"id":"0afa0237-0808-47d2-8501-69f8e479af62","type":"organisation","name":"History Channel"},{"id":"936f8d86-9c28-4988-a9eb-d232d5c70daa","type":"document","name":"60 Minutes"},{"id":"e2627e6a-b212-4412-be3a-d3c96bd5c78f","type":"topic","name":"Tic Tac"},{"id":"5e40c9f9-7310-48fa-b8e8-9665d2d822db","type":"topic","name":"Fast Walker"},{"id":"8fd3f3a2-1303-48c8-ad27-11f62fadd96c","type":"place","name":"USA, California, San Diego"},{"id":"3d5e8e78-6aad-4d9b-90d9-132d78b0b572","type":"place","name":"USA, Florida, Jacksonville"},{"id":"3f31dc7d-296e-4e23-8d5f-7772462bff3d","type":"organisation","name":"Department of Defense (DoD)"},{"id":"e19df5da-f45f-4017-a31a-2d2d11d785c0","type":"place","name":"Pentagon"},{"id":"a487dddf-7167-45b5-92b6-8b14c7eff1c2","type":"place","name":"Capitol Hill"},{"id":"228af9d6-57cc-4376-831a-30ed5b09067f","type":"organisation","name":"USS Nimitz Carrier Strike Group"},{"id":"05214b94-d0fd-4882-be53-aff822847388","type":"organisation","name":"Strike Fighter Squadron 41 (VFA-41)"}]},{"id":"qwen_qwen3.6-plus","name":"qwen / qwen3.6-plus","errata":null,"claims":[{"id":"56eb4516-0f5d-4386-8a10-7c46e8fbc430","type":"testimony","location":"00:00:54.6-00:00:59.6","speaker":"Elizondo, Luis","text":"The United States government has officially confirmed for the record that Unidentified Flying Objects (UFO) are real.","quote":"The government has already stated for the record that they're real. The United States government is telling you that."},{"id":"581f5173-2776-4867-88f9-881bdb874dba","type":"administrative","location":"00:01:02.4-00:01:11.5","speaker":"Whitaker, Bill","text":"Luis Elizondo spent 20 years managing military intelligence operations worldwide, including in the Middle East and at the Guantanamo Bay Naval Base.","quote":"Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo."},{"id":"73b4397c-86d4-4768-b03a-d6d6b8886900","type":"administrative","location":"00:01:15.6","speaker":"Whitaker, Bill","text":"Luis Elizondo had not considered Unidentified Flying Objects (UFO) a serious concern prior to 2008.","quote":"He hadn't given UFOs a second thought until 2008."},{"id":"839c95fa-e7ca-44ac-826c-9961874a9713","type":"administrative","location":"00:01:15.6-00:01:24.1","speaker":"Whitaker, Bill","text":"In 2008, Luis Elizondo was recruited to work on the Advanced Aerospace Threat Identification Program (AATIP) at the Pentagon.","quote":"That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP."},{"id":"ce5f3809-018d-426c-9ff9-8bfa5ef6ae25","type":"administrative","location":"00:01:24.1-00:01:31.0","speaker":"Elizondo, Luis","text":"The Advanced Aerospace Threat Identification Program (AATIP) was established to collect and analyse information on Anomalous Aerial Vehicles (AAV).","quote":"The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles..."},{"id":"a8460633-ce30-4146-a4c9-4fdbe4f246d2","type":"administrative","location":"00:01:31.0-00:01:36.0","speaker":"Elizondo, Luis","text":"Personnel in the Advanced Aerospace Threat Identification Program (AATIP) referred to Anomalous Aerial Vehicles (AAV) as Unidentified Aerial Phenomena (UAP).","quote":"what I guess in the vernacular you call them UFOs. ... We call them UAPs."},{"id":"80fb7e57-7f2f-48a0-b90b-814df500d8e6","type":"opinion","location":"00:01:40.0-00:01:49.6","speaker":"Elizondo, Luis","text":"Luis Elizondo maintains that Unidentified Aerial Phenomena (UAP) are physically real, but their origins, intentions, and capabilities remain unknown.","quote":"Look, Bill, I'm not telling you that it doesn't sound wacky. What I'm telling you is real. The question is, what is it? What are its intentions? What are its capabilities?"},{"id":"2485ed62-75fc-451d-8111-45d90ed25662","type":"administrative","location":"00:01:50.3-00:02:01.6","speaker":"Whitaker, Bill","text":"The Advanced Aerospace Threat Identification Program (AATIP) operated with an annual budget of $22 million, sponsored by United States Senate Majority Leader Harry Reid to investigate Unidentified Flying Objects (UFO).","quote":"Buried away in the Pentagon, AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs."},{"id":"3ba3f2aa-7ea3-4a85-9b50-1b518ffa5853","type":"administrative","location":"00:02:01.6-00:02:12.6","speaker":"Whitaker, Bill","text":"From 2010, Luis Elizondo focused his work on the Advanced Aerospace Threat Identification Program (AATIP) on assessing the national security implications of Unidentified Aerial Phenomena (UAP) documented by United States Navy service members.","quote":"When Elizondo took over in 2010, he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members."},{"id":"3e580327-3b48-4638-91d6-ce810b3546e8","type":"measurement","location":"00:02:12.6-00:02:18.0","speaker":"Elizondo, Luis","text":"Some observed Unidentified Aerial Phenomena (UAP) have demonstrated the capability to withstand forces of 600 to 700 G.","quote":"Imagine a technology that can do 600 to 700 G-forces..."},{"id":"d8ee1b24-584c-4bea-835d-b2779810d124","type":"measurement","location":"00:02:18.0-00:02:21.0","speaker":"Elizondo, Luis","text":"Some observed Unidentified Aerial Phenomena (UAP) have recorded flight speeds of approximately 21,000 kilometres per hour.","quote":"...that can fly at 13,000 miles an hour..."},{"id":"ecd0d4e4-950a-419b-ae36-2825769d543b","type":"observation","location":"00:02:21.0-00:02:23.0","speaker":"Elizondo, Luis","text":"Some observed Unidentified Aerial Phenomena (UAP) possess the ability to evade radar detection.","quote":"...that can evade radar..."},{"id":"46c3c1ae-09e0-4ebe-8f80-52ed39f02646","type":"observation","location":"00:02:23.0-00:02:27.0","speaker":"Elizondo, Luis","text":"Some observed Unidentified Aerial Phenomena (UAP) are capable of travelling through air, water, and potentially space.","quote":"...and that can fly through air and water and possibly space..."},{"id":"ec8c71e2-d3d3-44ad-9b81-9038cbba8bc5","type":"observation","location":"00:02:27.0-00:02:32.0","speaker":"Elizondo, Luis","text":"Some observed Unidentified Aerial Phenomena (UAP) exhibit no visible signs of propulsion, wings, or control surfaces.","quote":"...has no obvious signs of propulsion, no wings, no control surfaces..."},{"id":"05697491-79c8-4c46-9cac-bebdc3d9ad9c","type":"observation","location":"00:02:32.0-00:02:35.2","speaker":"Elizondo, Luis","text":"Some observed Unidentified Aerial Phenomena (UAP) appear to defy the natural effects of Earth's gravity.","quote":"...and yet still can defy the natural effects of Earth's gravity."},{"id":"992df624-f6f6-44bf-ac53-6c003ee536c4","type":"administrative","location":"00:02:37.0-00:02:47.7","speaker":"Whitaker, Bill","text":"The Advanced Aerospace Threat Identification Program (AATIP) comprised scientists, electro-optical engineers, avionics specialists, and intelligence experts, many working part-time.","quote":"Elizondo tells us AATIP was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time."},{"id":"6d0e1e5e-63cd-4a1f-8148-08a178a4ddd4","type":"administrative","location":"00:02:47.7-00:03:07.3","speaker":"Whitaker, Bill","text":"Personnel in the Advanced Aerospace Threat Identification Program (AATIP) analysed flight footage of a United States Navy air crew struggling to track a fast-moving Unidentified Aerial Phenomena (UAP) off the Atlantic coast in 2015.","quote":"They combed through data and records and analyzed videos like this. A Navy aircrew struggles to lock onto a fast-moving object off the U.S. Atlantic coast in 2015."},{"id":"9369df0c-5250-4dea-95b4-49a42a32edff","type":"testimony","location":"00:03:07.3-00:03:15.0","speaker":"Whitaker, Bill","text":"The Department of Defense (DoD) officially acknowledges it cannot identify the Unidentified Aerial Phenomena (UAP) captured in recently released flight footage.","quote":"the Pentagon admits it doesn't know what in the world this is"},{"id":"b63c2d70-9776-4f3c-8eea-b8e28b162971","type":"opinion","location":"00:03:30.4-00:03:38.6","speaker":"Elizondo, Luis","text":"Luis Elizondo states that while some reported Unidentified Aerial Phenomena (UAP) have simple explanations, a portion of them do not.","quote":"In some cases, there are simple explanations for what people are witnessing, but there are some that that are not."},{"id":"9548d035-0f84-489c-8d8f-5721db01a039","type":"opinion","location":"00:03:52.6-00:04:06.2","speaker":"Elizondo, Luis","text":"Luis Elizondo considers that advanced Unidentified Aerial Phenomena (UAP) represent a compelling national security concern only after conventional explanations have been thoroughly exhausted.","quote":"Ultimately, when you have exhausted all those what-ifs and you're still left with the fact that this is in our airspace and it's real, that's when it becomes compelling and that's when it becomes problematic."},{"id":"5fe2c3d3-22c0-4225-8776-635fe594801c","type":"opinion","location":"00:04:06.2-00:04:12.9","speaker":"Graves, Ryan","text":"Ryan Graves considers observed Unidentified Aerial Phenomena (UAP) to be a national security risk.","quote":"Former Navy pilot Lieutenant Ryan Graves calls whatever is out there a security risk."},{"id":"3168ba76-912a-496d-91c5-2ba1ed9488ea","type":"observation","location":"00:04:12.9-00:04:29.7","speaker":"Graves, Ryan","text":"In 2014, a United States Navy F/A-18 squadron commanded by Ryan Graves observed Unidentified Aerial Phenomena (UAP) hovering over restricted airspace southeast of Virginia Beach after upgrading their radar systems to include infrared targeting capabilities.","quote":"He told us his F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar, making it possible to zero in with infrared targeting cameras."},{"id":"9be6a9ed-df7a-4315-935e-5a5cf6b34894","type":"testimony","location":"00:04:29.7-00:04:38.6","speaker":"Graves, Ryan","text":"The dual radar and infrared tracking capability used by United States Navy pilots makes Unidentified Aerial Phenomena (UAP) difficult to spoof.","quote":"So you're seeing it both with the radar and with the infrared... Pretty hard to spoof that."},{"id":"56b53850-312f-437f-9226-cb50f5f6eb8b","type":"observation","location":"00:04:38.6-00:04:48.2","speaker":"Whitaker, Bill","text":"Photographs of unidentified objects hovering southeast of Virginia Beach were taken in 2019 by United States Navy personnel.","quote":"These photographs were taken in 2019 in the same area. The Pentagon confirms these are images of objects it can't identify."},{"id":"b0fad3ab-464e-44ef-9dfb-98f7385d9c6c","type":"observation","location":"00:05:02.5","speaker":"Graves, Ryan","text":"Ryan Graves observed no exhaust plume emanating from the Unidentified Aerial Phenomena (UAP) hovering southeast of Virginia Beach.","quote":"You know, I don't see an exhaust plume."},{"id":"65843769-8c7f-4239-b94d-8d95e95bf381","type":"observation","location":"00:05:04.3-00:05:21.6","speaker":"Whitaker, Bill","text":"In 2015, a United States Navy targeting camera recorded Unidentified Aerial Phenomena (UAP) rotating and moving against 120-knot winds off the coast of Jacksonville, Florida.","quote":"including this one, off the coast of Jacksonville, Florida in 2015, captured on a targeting camera by members of Graves' squadron... The wind's 120 knots far west."},{"id":"9d24de50-5826-4f4d-8d36-f9aeb2e12c53","type":"opinion","location":"00:05:25.4-00:05:33.2","speaker":"Graves, Ryan","text":"Ryan Graves observed pilot reaction during a 2015 Unidentified Aerial Phenomena (UAP) encounter off Jacksonville as genuinely amazed and surprised.","quote":"You can sort of hear the surprise in their voices. You certainly can. They seem to have broke character a bit, and were just kind of amazed at what they were seeing."},{"id":"ecad4e39-ea4c-4cd8-85b1-46d7b0cd0b9c","type":"opinion","location":"00:05:33.2-00:05:44.9","speaker":"Graves, Ryan","text":"Ryan Graves considers a specific 2015 Unidentified Aerial Phenomena (UAP) sighting off Jacksonville to be difficult to explain due to its rotation, high altitude, and unknown propulsion system.","quote":"This is a difficult one to explain. You have rotation, you have high altitudes, you have propulsion, right? I don't know. I don't know what it is, frankly."},{"id":"83e04c06-caea-4107-a2a7-eff9e94bc9b1","type":"testimony","location":"00:05:44.9-00:05:56.0","speaker":"Graves, Ryan","text":"United States Navy pilots hypothesize that Unidentified Aerial Phenomena (UAP) are likely either advanced adversary surveillance technology, secret United States projects, or something unknown.","quote":"He told us pilots speculate they are one of three things, secret U.S. technology, an adversary spy vehicle, or something otherworldly."},{"id":"4d3693b2-d270-4f3c-ac87-446bde46ca29","type":"opinion","location":"00:05:56.0-00:06:00.5","speaker":"Graves, Ryan","text":"Ryan Graves considers it highly probable that observed Unidentified Aerial Phenomena (UAP) are part of an adversary threat observation program.","quote":"I'd say, you know, the highest probability is it's a threat observation program."},{"id":"96f1a242-ff3f-463c-beca-3e1e1141c832","type":"opinion","location":"00:06:00.5-00:06:05.4","speaker":"Graves, Ryan","text":"Ryan Graves considers Russian or Chinese technology to be a plausible explanation for Unidentified Aerial Phenomena (UAP) observed over United States airspace.","quote":"Could it be Russian or Chinese technology? I don't see why not."},{"id":"94147af3-3820-4630-9033-544ccebda079","type":"opinion","location":"00:06:05.4-00:06:23.4","speaker":"Graves, Ryan","text":"Ryan Graves is concerned by the United States military's reluctance to formally address Unidentified Aerial Phenomena (UAP) that monitor United States Navy training exercises daily.","quote":"Are you alarmed? I am worried, frankly... we're not willing to actually look at the problem in the face. We're happy to just ignore the fact that these are out there watching us every day."},{"id":"40b91717-fe15-49aa-8ee9-fd0c9ae4aa60","type":"administrative","location":"00:06:23.4-00:06:30.3","speaker":"Whitaker, Bill","text":"Public United States government investigations into Unidentified Aerial Phenomena (UAP) were suspended following the closure of Project Blue Book in 1969.","quote":"The government has ignored it, at least publicly, since closing its Project Blue Book investigation in 1969."},{"id":"6ec4b56b-f913-48f3-93df-4d61e306eced","type":"observation","location":"00:06:30.3-00:06:40.8","speaker":null,"text":"The 2004 USS Nimitz UAP encounter involved United States Navy aviators documented by radar and optical sensors off the coast of California.","quote":"But that began to change after an incident off Southern California in 2004, which was documented by radar, by camera, and four naval aviators."},{"id":"ec3fa522-3d88-4da0-bb52-863d9446c838","type":"administrative","location":"00:06:40.8-00:06:57.3","speaker":"Whitaker, Bill","text":"David Fravor and Alex Dietrich were two of the four naval aviators involved in the 2004 USS Nimitz UAP encounter.","quote":"We spoke to two of them, David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz, and flying at his wing, Lieutenant Alex Dietrich..."},{"id":"4b653a8b-78bd-4233-affe-1d9de423395c","type":"testimony","location":"00:07:02.7-00:07:14.4","speaker":"Dietrich, Alex","text":"Alex Dietrich agreed to discuss the 2004 USS Nimitz UAP encounter publicly because he was on official duty in a government aircraft and felt a responsibility to share unclassified information.","quote":"Because I was in a government aircraft, because I was on the clock, and so I feel a responsibility to share what I can, and it is unclassified."},{"id":"9740b0ae-ef32-410f-adad-44fab6f5abda","type":"administrative","location":"00:07:14.4-00:07:23.1","speaker":"Whitaker, Bill","text":"In November 2004, the USS Nimitz Carrier Strike Group conducted training exercises approximately 160 kilometres southwest of San Diego.","quote":"It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego."},{"id":"216e3a81-34e7-4072-bd01-e53be6f20587","type":"measurement","location":"00:07:23.1-00:07:39.3","speaker":"Whitaker, Bill","text":"Over a seven-day period in 2004, radar operators aboard the USS Princeton detected multiple Anomalous Aerial Vehicles (AAV) over the horizon descending approximately 24,000 metres in less than one second.","quote":"For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 80,000 feet in less than a second."},{"id":"84494aaa-d5a6-4e76-9a19-244ed87d6fce","type":"observation","location":"00:07:39.3-00:07:47.8","speaker":"Whitaker, Bill","text":"On 2004-11-14, David Fravor and Alex Dietrich each flying an F/A-18 fighter jet were diverted from their flight path to investigate an Unidentified Aerial Phenomena (UAP) during the 2004 USS Nimitz UAP encounter.","quote":"On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate."},{"id":"2a9ba236-6d7c-4368-91f9-fe3c456438d5","type":"observation","location":"00:07:47.8-00:07:55.9","speaker":"Fravor, David","text":"During the 2004 USS Nimitz UAP encounter, David Fravor and Alex Dietrich observed a disturbed water patch roughly the size of a commercial aircraft in calm seas.","quote":"They found an area of roiling white water the size of a 737 in an otherwise calm blue sea."},{"id":"265dc188-4ae1-47e4-a0df-d1b57dd1fb1c","type":"observation","location":"00:08:02.4-00:08:12.3","speaker":"Fravor, David","text":"David Fravor and Alex Dietrich visually identified a small, white, cylindrical object hovering above the disturbed water patch during the 2004 USS Nimitz UAP encounter.","quote":"And we saw this little white tic-tac-looking object. And it's just kind of moving above the whitewater area."},{"id":"1b80fbe4-3a8b-4e62-a566-479e7311bb32","type":"observation","location":"00:08:12.3-00:08:28.9","speaker":"Fravor, David","text":"During the 2004 USS Nimitz UAP encounter, the observed object abruptly changed direction to mirror the flight path of David Fravor's F/A-18.","quote":"The tic-tac's still pointing north-south. It goes and just turns abruptly and starts mirroring me. So as I'm coming down, it starts coming up."},{"id":"3284f2ab-42e3-4850-b4d4-3de49df4159b","type":"opinion","location":"00:08:28.9-00:08:30.5","speaker":"Fravor, David","text":"David Fravor considers that the object observed during the 2004 USS Nimitz UAP encounter was actively aware of the presence of his F/A-18.","quote":"Yeah, it was aware we were there."},{"id":"aadf3a38-ef59-433e-923d-9db04f773a1c","type":"measurement","location":"00:08:30.5-00:08:39.0","speaker":"Fravor, David","text":"The object observed during the 2004 USS Nimitz UAP encounter was approximately the size of an F/A-18 fighter jet and lacked visible markings, wings, or exhaust plumes.","quote":"He said it was about the size of his F-18, with no markings, no wings, no exhaust plumes."},{"id":"7a15261f-9c3d-4b7a-9970-58dfc4e9a024","type":"observation","location":"00:08:39.0-00:08:49.4","speaker":"Fravor, David","text":"The object observed during the 2004 USS Nimitz UAP encounter suddenly accelerated out of sight when approached closely.","quote":"And when it gets right in front of me, it just disappears. Disappears, like gone. It had sped off."},{"id":"8c01d7d9-eae4-483b-965b-91f0821a672c","type":"testimony","location":"00:08:49.4-00:09:00.9","speaker":"Dietrich, Alex","text":"Alex Dietrich attempted to categorise the object seen during the 2004 USS Nimitz UAP encounter as a helicopter or drone prior to its sudden disappearance.","quote":"So your mind tries to make sense of it. I'm going to categorize this as maybe a helicopter or maybe a drone. And when it disappeared, I mean, it was just..."},{"id":"88ed43e6-3ffe-4746-980f-e253e85756a6","type":"observation","location":"00:09:00.9-00:09:08.9","speaker":"Fravor, David","text":"Four United States Navy aviators visually tracked the object for approximately five minutes during the 2004 USS Nimitz UAP encounter.","quote":"There was four of us in the airplanes literally watching this thing for roughly about five minutes."},{"id":"1cb85798-0a7c-445c-85df-2508f72ec27c","type":"observation","location":"00:09:08.9-00:09:14.4","speaker":"Whitaker, Bill","text":"Immediately after the 2004 USS Nimitz UAP encounter, the USS Princeton reacquired the target on radar approximately 95 kilometres away from the original location.","quote":"Seconds later, the Princeton reacquired the target, 60 miles away."},{"id":"76688947-b332-4c6a-81fd-2f8be1091bb9","type":"observation","location":"00:09:14.4-00:09:20.8","speaker":"Whitaker, Bill","text":"A second naval aircrew operating a targeting camera from the USS Princeton briefly acquired a visual lock on the object from the 2004 USS Nimitz UAP encounter before it accelerated out of range.","quote":"Another crew managed to briefly lock onto it with a targeting camera before it zipped off again."},{"id":"a22195b1-4f27-43b0-b3cf-c03623da5851","type":"testimony","location":"00:09:31.1-00:09:45.5","speaker":"Fravor, David","text":"David Fravor acknowledges that describing the 2004 USS Nimitz UAP encounter can sound unconventional, but he maintains he is not a believer in Unidentified Flying Objects (UFO).","quote":"I do. I've had some people tell me, you know, when you say that, you can sound crazy. I'll be honest. I'm not a UFO guy."},{"id":"4b6488d0-5ed6-480f-896c-2cd0f2cd0523","type":"opinion","location":"00:09:45.5-00:09:56.5","speaker":"Fravor, David","text":"David Fravor considers that the object from the 2004 USS Nimitz UAP encounter possessed flight capabilities superior to the United States Navy F/A-18 fighter jet.","quote":"Yes. There's definitely something that... there's something out there that was better than our airplane."},{"id":"a90bfb6a-3eb9-42de-ae42-57a47b2c1e0b","type":"administrative","location":"00:09:56.5-00:10:04.2","speaker":"Whitaker, Bill","text":"United States Navy aviation crews filed official reports following the 2004 USS Nimitz UAP encounter.","quote":"The air crew filed reports."},{"id":"28cc418f-6daf-4cf4-9eb9-8cd2b76cc606","type":"administrative","location":"00:09:58.7-00:10:04.2","speaker":"Whitaker, Bill","text":"No official investigation was launched into the 2004 USS Nimitz UAP encounter for five years, until Luis Elizondo reviewed and investigated the case files.","quote":"Then, like the mysterious flying object, the Nimitz encounter disappeared. Nothing was said or done officially for five years until Lou Elizondo came across the story and investigated."},{"id":"b159bdaf-f014-45f7-9ec1-55c8d2ed7527","type":"opinion","location":"00:10:13.2-00:10:25.3","speaker":"Elizondo, Luis","text":"Luis Elizondo considers the combination of United States Navy pilot eyewitness testimony, electro-optical gun camera footage, and radar data regarding Unidentified Aerial Phenomena (UAP) to be compelling evidence of real, unexplained contacts.","quote":"We spend millions of dollars in training these pilots, and they are seeing something that they can't explain. Furthermore, that information's being backed up on electro-optical data... and by radar data. Now, to me, that's compelling."},{"id":"c974d2d0-0906-452e-bfe5-a91406449108","type":"admi
