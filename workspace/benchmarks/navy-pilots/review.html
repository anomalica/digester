7891f8325","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Unidentified Aerial Phenomena (UAP) tracked by military sensors have the capability to evade radar detection.","quote":"that can evade radar... That's precisely what we're seeing."},{"id":"06b9f40f-3f81-4c04-8b44-a68266b0ca8b","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Unidentified Aerial Phenomena (UAP) tracked by military sensors demonstrate the ability to travel seamlessly through both air and water.","quote":"and that can fly through air and water and possibly space... That's precisely what we're seeing."},{"id":"66dcf0e2-d2b7-421d-aab5-ac24a7123bbc","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Unidentified Aerial Phenomena (UAP) tracked by military sensors display no detectable methods of propulsion.","quote":"has no obvious signs of propulsion... That's precisely what we're seeing."},{"id":"da0b86c3-aa35-494a-8679-26f6b8cd974d","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Unidentified Aerial Phenomena (UAP) tracked by military sensors are constructed without wings.","quote":"no wings... That's precisely what we're seeing."},{"id":"b22135ba-4e13-4a78-b543-dcc8deb288d8","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Unidentified Aerial Phenomena (UAP) tracked by military sensors lack visible aerodynamic control surfaces.","quote":"no control surfaces... That's precisely what we're seeing."},{"id":"061427b7-c2ff-489a-8647-e1892f5d19e0","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Unidentified Aerial Phenomena (UAP) tracked by military sensors appear to defy the natural effects of Earth's gravity.","quote":"and yet still can defy the natural effects of Earth's gravity. That's precisely what we're seeing."},{"id":"82ffc296-be13-418c-b1e1-23de69e2ae21","type":"administrative","location":"00:02:37.0-00:02:47.7","speaker":"Whitaker, Bill","text":"The Advanced Aerospace Threat Identification Program (AATIP) was composed of a loose-knit mixture of part-time scientists, electro-optical engineers, avionics technicians, and intelligence experts.","quote":"Elizondo tells us AATIP was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time."},{"id":"c5e5a2ac-efac-490a-b0b7-334958584475","type":"observation","location":"00:02:57.7-00:03:02.1","speaker":"Whitaker, Bill","text":"In 2015, a United States Navy aircrew experienced difficulty maintaining a sensor lock on a fast-moving Unidentified Aerial Phenomena (UAP) off the United States Atlantic coast.","quote":"A Navy aircrew struggles to lock onto a fast-moving object off the U.S. Atlantic coast in 2015."},{"id":"e3e13ea9-8d8e-4c12-a93c-0383061e7ba5","type":"administrative","location":"00:03:07.3-00:03:20.4","speaker":"Whitaker, Bill","text":"The United States Department of Defense (DoD) officially stated that it cannot identify the objects filmed in recently released military aviation videos.","quote":"the Pentagon admits it doesn't know what in the world this is, or this, or this."},{"id":"cbede4aa-6e2f-4d37-bd48-65cf6728fe20","type":"opinion","location":"00:03:30.4-00:03:52.6","speaker":"Elizondo, Luis","text":"Luis Elizondo led investigations into whether the observed Unidentified Aerial Phenomena (UAP) were classified cruise missile systems developed by the People's Republic of China.","quote":"We're going through our due diligence. Is it some sort of new type of cruise missile technology that China has developed?"},{"id":"a1bb68d1-1e08-4c8c-ae28-12bec9f4400e","type":"administrative","location":"00:04:06.2-00:04:12.9","speaker":"Whitaker, Bill","text":"Ryan Graves previously served as a fighter pilot for the United States Navy.","quote":"Former Navy pilot Lieutenant Ryan Graves"},{"id":"9aeab32d-86b9-4059-ad81-8756f92e91a3","type":"opinion","location":"00:04:06.2-00:04:12.9","speaker":"Whitaker, Bill","text":"Ryan Graves considers Unidentified Aerial Phenomena (UAP) operating in United States airspace to be a national security risk.","quote":"calls whatever is out there a security risk."},{"id":"e3e88156-89f7-403d-9eb0-79a7d1e4bdd9","type":"observation","location":"00:04:06.2-00:04:12.9","speaker":"Whitaker, Bill","text":"In 2014, the F/A-18 squadron assigned to Ryan Graves began detecting Unidentified Aerial Phenomena (UAP) hovering inside restricted military airspace southeast of USA, Virginia, Virginia Beach.","quote":"He told us his F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014"},{"id":"54d41709-ad12-4fd6-bbfe-2366287e06ed","type":"observation","location":"00:04:06.2-00:04:12.9","speaker":"Whitaker, Bill","text":"The detection of Unidentified Aerial Phenomena (UAP) by the F/A-18 squadron of Ryan Graves coincided with an upgrade to the active radar systems on their aircraft.","quote":"when they updated their jet's radar, making it possible to zero in with infrared targeting cameras."},{"id":"94c38b4f-484f-4d3f-9010-f8b560a5f499","type":"opinion","location":"00:04:29.7-00:04:37.1","speaker":"Graves, Ryan","text":"Ryan Graves considers the simultaneous tracking of Unidentified Aerial Phenomena (UAP) using both radar arrays and infrared sensors to be difficult to spoof.","quote":"Bill Whitaker: So you're seeing it both with the radar and with the infrared, and that tells you that there is something out there. Ryan Graves: Pretty hard to spoof that."},{"id":"bdb552bf-4468-413d-8530-ab6dc66512ee","type":"observation","location":"00:04:48.2-00:04:56.6","speaker":"Graves, Ryan","text":"United States Navy pilots conducting training operations off the Atlantic coast tracked Unidentified Aerial Phenomena (UAP) on a daily basis for a duration of at least two years.","quote":"Bill Whitaker: Lieutenant Graves told us pilots training off the Atlantic coast see things like that all the time. Ryan Graves: Every day. Every day for at least a couple of years."},{"id":"940ce436-f116-4c5b-81d4-b9cebd32d897","type":"observation","location":"00:04:58.7-00:05:02.5","speaker":"Graves, Ryan","text":"Ryan Graves did not observe any exhaust plumes generated by the Unidentified Aerial Phenomena (UAP) during their aerial manoeuvres.","quote":"You know, I don't see an exhaust plume."},{"id":"f88171de-f535-4334-b725-ac5df1e7fe03","type":"observation","location":"00:05:04.3-00:05:12.8","speaker":"Whitaker, Bill","text":"In 2015, members of the squadron assigned to Ryan Graves captured Unidentified Aerial Phenomena (UAP) on targeting cameras off the coast of USA, Florida, Jacksonville.","quote":"including this one, off the coast of Jacksonville, Florida in 2015, captured on a targeting camera by members of Graves' squadron."},{"id":"4acffdda-6e2c-4dcb-8ae1-325c1e8d728d","type":"observation","location":"00:05:12.8-00:05:23.8","speaker":null,"text":"During the 2015 Jacksonville UAP encounter, United States Navy aviators observed the Unidentified Aerial Phenomena (UAP) progressing directly against a prevailing wind of approximately 220 kilometres per hour.","quote":"They're all going against the wind. The wind's 120 knots far west."},{"id":"5deb7ba8-712d-4823-bd2d-139d7e704985","type":"observation","location":"00:05:35.8-00:05:42.8","speaker":"Graves, Ryan","text":"Ryan Graves observed structural rotation associated with the Unidentified Aerial Phenomena (UAP) tracked by his F/A-18 squadron.","quote":"You have rotation"},{"id":"9906a347-8795-4834-8074-22269c2eb021","type":"observation","location":"00:05:35.8-00:05:42.8","speaker":"Graves, Ryan","text":"Ryan Graves observed the Unidentified Aerial Phenomena (UAP) operating stably at very high altitudes.","quote":"you have high altitudes"},{"id":"db18de1f-cef1-49ef-893f-4bb9e86e6523","type":"observation","location":"00:05:35.8-00:05:42.8","speaker":"Graves, Ryan","text":"Ryan Graves verified that the Unidentified Aerial Phenomena (UAP) maintained forward propulsion despite lacking visual evidence of a conventional engine.","quote":"you have propulsion, right?"},{"id":"40263bc4-bfdc-46ea-9170-dc7eae2fad6a","type":"opinion","location":"00:05:35.8-00:05:42.8","speaker":"Graves, Ryan","text":"Ryan Graves cannot identify the actual nature or origin of the Unidentified Aerial Phenomena (UAP).","quote":"I don't know what it is, frankly."},{"id":"be3c689c-c80f-4278-a631-666c19b8e261","type":"opinion","location":"00:05:44.9-00:05:56.0","speaker":"Graves, Ryan","text":"Ryan Graves assesses that the highest probability explanation for the Unidentified Aerial Phenomena (UAP) is an adversarial threat observation programme.","quote":"I'd say, you know, the highest probability is it's a threat observation program."},{"id":"16e43730-23d6-49c4-a566-abfb0885607a","type":"opinion","location":"00:06:00.5-00:06:04.1","speaker":"Graves, Ryan","text":"Ryan Graves considers aerial technology deployed by the Russian Federation or the People's Republic of China to be a possible explanation for the Unidentified Aerial Phenomena (UAP).","quote":"Bill Whitaker: Could it be Russian or Chinese technology? Ryan Graves: I don't see why not."},{"id":"fe59af6c-4718-4cb7-b6d8-0bb0527ca3a8","type":"opinion","location":"00:06:05.4-00:06:18.5","speaker":"Graves, Ryan","text":"Ryan Graves is worried by the persistent operational presence of Unidentified Aerial Phenomena (UAP) inside United States airspace.","quote":"I am worried, frankly. You know, if these were tactical jets from another country that were hanging out up there, it would be a massive issue. But because it looks slightly different, we're not willing to actually look at the problem in the face."},{"id":"5f21cc16-bd3d-420f-9ef3-ce33da351154","type":"administrative","location":"00:06:23.4-00:06:30.3","speaker":"Whitaker, Bill","text":"The United States government officially closed the Project Blue Book investigation into Unidentified Flying Objects (UFO) in 1969.","quote":"since closing its Project Blue Book investigation in 1969."},{"id":"0a91c5b9-af43-4d8a-a743-8a753932487a","type":"administrative","location":"00:06:23.4-00:06:30.3","speaker":"Whitaker, Bill","text":"The 2004 USS Nimitz UAP encounter occurred off the coast of USA, California, Southern California.","quote":"after an incident off Southern California in 2004, which was documented by radar, by camera, and four naval aviators."},{"id":"275b34d3-7e52-4a58-8a5a-a166c6af7fab","type":"administrative","location":"00:06:30.3-00:06:40.8","speaker":"Whitaker, Bill","text":"David Fravor graduated from the Top Gun Naval Flight School.","quote":"David Fravor, a graduate of the Top Gun Naval Flight School"},{"id":"4b2c3b2b-c3bf-4fd7-bee3-06e15d16b8e1","type":"administrative","location":"00:06:30.3-00:06:40.8","speaker":"Whitaker, Bill","text":"During the 2004 USS Nimitz UAP encounter, David Fravor commanded a United States Navy F/A-18 fighter squadron attached to the USS Nimitz.","quote":"commander of the F-18 squadron on the USS Nimitz"},{"id":"fe826ebb-1b6a-43eb-9da2-bd03164cef68","type":"administrative","location":"00:06:30.3-00:06:40.8","speaker":"Whitaker, Bill","text":"Alex Dietrich flew as David Fravor's designated wingman during the 2004 USS Nimitz UAP encounter.","quote":"and flying at his wing, Lieutenant Alex Dietrich"},{"id":"9159587a-08d9-4a23-b651-a79e832bee46","type":"administrative","location":"00:07:14.4-00:07:39.3","speaker":"Whitaker, Bill","text":"In November 2004, the USS Nimitz Carrier Strike Group conducted naval training operations approximately 160 kilometres southwest of USA, California, San Diego.","quote":"It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego."},{"id":"1f793b98-ce32-4c4e-853b-5182d9ad77e1","type":"observation","location":"00:07:14.4-00:07:39.3","speaker":"Whitaker, Bill","text":"For a period of one week in November 2004, the newly upgraded radar systems aboard the USS Princeton tracked multiple Anomalous Aerial Vehicles (AAV).","quote":"For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon"},{"id":"b58c9628-c2c0-4929-97bb-303ff8408c2f","type":"measurement","location":"00:07:14.4-00:07:39.3","speaker":"Whitaker, Bill","text":"Radar operators aboard the USS Princeton measured Anomalous Aerial Vehicles (AAV) rapidly descending approximately 24,000 metres in less than one second.","quote":"descending 80,000 feet in less than a second."},{"id":"7416c257-2535-427b-8d4b-072e077b8446","type":"administrative","location":"00:07:39.3-00:07:47.8","speaker":"Whitaker, Bill","text":"On 2004-11-14, David Fravor and Alex Dietrich were diverted from their scheduled training routines to visually investigate the radar targets tracked by the USS Princeton.","quote":"On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate."},{"id":"53491612-afd6-4242-be48-b7cc88010332","type":"observation","location":"00:07:39.3-00:07:47.8","speaker":"Whitaker, Bill","text":"David Fravor and Alex Dietrich visually observed an area of roiling white water approximately equivalent in size to a Boeing 737 isolated within an otherwise calm sea state.","quote":"They found an area of roiling white water the size of a 737 in an otherwise calm blue sea."},{"id":"3e1a08f1-b1a4-46ef-973c-4761ce666bab","type":"observation","location":"00:07:55.9-00:08:12.3","speaker":"Fravor, David","text":"David Fravor visually acquired a small, white Anomalous Aerial Vehicle (AAV) darting erratically just above the area of disturbed white water.","quote":"And we saw this little white tic-tac-looking object. And it's just kind of moving above the whitewater area."},{"id":"3abd6c79-6381-4652-a771-0e8fca8300b1","type":"observation","location":"00:08:12.3-00:08:30.5","speaker":"Fravor, David","text":"During the 2004 USS Nimitz UAP encounter, the Anomalous Aerial Vehicle (AAV) visibly reacted to David Fravor's descent and actively mirrored his aerial manoeuvres.","quote":"It goes and just turns abruptly and starts mirroring me. So as I'm coming down, it starts coming up."},{"id":"f795bc7c-718e-49d3-a64d-26382947c549","type":"measurement","location":"00:08:12.3-00:08:30.5","speaker":"Whitaker, Bill","text":"David Fravor estimates that the Anomalous Aerial Vehicle (AAV) he encountered was roughly the same size as his F/A-18 aircraft.","quote":"He said it was about the size of his F-18"},{"id":"0537bf12-d4be-4232-b1a9-5564288abde1","type":"observation","location":"00:08:12.3-00:08:30.5","speaker":"Whitaker, Bill","text":"David Fravor detected no identifying markings on the exterior of the Anomalous Aerial Vehicle (AAV).","quote":"with no markings"},{"id":"f060ce06-e20b-4142-91a1-2419ca0261a7","type":"observation","location":"00:08:12.3-00:08:30.5","speaker":"Whitaker, Bill","text":"David Fravor noted a complete absence of wings on the structure of the Anomalous Aerial Vehicle (AAV).","quote":"no wings"},{"id":"badfee9d-134e-4024-8d14-ae2d6b219c23","type":"observation","location":"00:08:12.3-00:08:30.5","speaker":"Whitaker, Bill","text":"David Fravor observed no thermal exhaust plumes emitting from the Anomalous Aerial Vehicle (AAV).","quote":"no exhaust plumes."},{"id":"f336e9a9-6e7b-4806-8510-fa532059b1a7","type":"observation","location":"00:08:37.0-00:08:49.4","speaker":"Fravor, David","text":"The Anomalous Aerial Vehicle (AAV) abruptly vanished from visual sight entirely when David Fravor attempted to close the final distance in front of it.","quote":"And when it gets right in front of me, it just disappears."},{"id":"c9aeec81-9926-4f98-86ba-409de41c1c6e","type":"observation","location":"00:08:50.9-00:09:08.9","speaker":"Dietrich, Alex","text":"Alex Dietrich and her weapons system officer directly witnessed the Anomalous Aerial Vehicle (AAV) manoeuvres alongside David Fravor during the 2004 USS Nimitz UAP encounter.","quote":"Bill Whitaker: Did your back seaters see this too? Alex Dietrich: Yeah."},{"id":"fab109db-e73a-40b6-a7df-9607c08ef145","type":"observation","location":"00:08:50.9-00:09:08.9","speaker":"Fravor, David","text":"Four United States Navy aviators simultaneously maintained unaided visual contact with the Anomalous Aerial Vehicle (AAV) for roughly five minutes.","quote":"There was four of us in the airplanes literally watching this thing for roughly about five minutes."},{"id":"fe1c7890-14f8-4c2a-b49b-b099c0c07c47","type":"observation","location":"00:09:08.9-00:09:20.8","speaker":"Whitaker, Bill","text":"Seconds after the Anomalous Aerial Vehicle (AAV) vanished from visual contact, radar technicians on the USS Princeton locked onto the contact again approximately 97 kilometres away.","quote":"Seconds later, the Princeton reacquired the target, 60 miles away."},{"id":"a3adaaf9-ae49-4e9e-a476-67e625970a76","type":"observation","location":"00:09:08.9-00:09:20.8","speaker":"Whitaker, Bill","text":"Following the visual engagement by David Fravor, a separate United States Navy F/A-18 crew achieved a brief target lock on the Anomalous Aerial Vehicle (AAV) using an infrared targeting camera.","quote":"Another crew managed to briefly lock onto it with a targeting camera before it zipped off again."},{"id":"e0acb6d1-35d4-4473-ae2c-54a8ccfefbdf","type":"opinion","location":"00:09:39.8-00:09:56.5","speaker":"Fravor, David","text":"David Fravor assesses that the propulsion and flight characteristics exhibited by the Anomalous Aerial Vehicle (AAV) significantly outperformed contemporary United States Navy aircraft capabilities.","quote":"there's definitely something that, I don't know who's building it, who's got the technology, who's got the brains, but there's something out there that was better than our airplane."},{"id":"7c95d441-597f-40fa-bbb7-e3c8b2f0af2a","type":"administrative","location":"00:09:56.5-00:10:13.2","speaker":"Whitaker, Bill","text":"The United States Department of Defense (DoD) conducted no formal official follow-up regarding the 2004 USS Nimitz UAP encounter for five years, until Luis Elizondo began reviewing the incident.","quote":"Nothing was said or done officially for five years until Lou Elizondo came across the story and investigated."},{"id":"377b4792-1e70-4814-83c3-5316c8176006","type":"opinion","location":"00:10:13.2-00:10:27.7","speaker":"Elizondo, Luis","text":"Luis Elizondo considers Unidentified Aerial Phenomena (UAP) encounters compelling due to the robust cross-verification between highly trained pilot observations, radar telemetry, and infrared gun camera data.","quote":"Furthermore, that information's being backed up on electro-optical data, like gun camera footage, and by radar data. Now, to me, that's compelling."},{"id":"26684f3f-436e-452b-95cc-e8fb3159f9e6","type":"administrative","location":"00:10:27.7-00:10:48.8","speaker":"Whitaker, Bill","text":"The United States Department of Defense (DoD) eliminated all dedicated funding for the Advanced Aerospace Threat Identification Program (AATIP) in 2012.","quote":"AATIP's funding was eliminated in 2012"},{"id":"8f1e5ea4-8a09-401f-be00-32a2097e0a2d","type":"administrative","location":"00:10:27.7-00:10:48.8","speaker":"Whitaker, Bill","text":"Frustrated with bureaucratic resistance, Luis Elizondo formally resigned his position at the United States Department of Defense (DoD) in 2017.","quote":"until finally, frustrated, he quit the Pentagon in 2017"},{"id":"8f3cdc00-18a4-4e8c-b7ba-2c30c73eac83","type":"administrative","location":"00:10:27.7-00:10:48.8","speaker":"Whitaker, Bill","text":"Prior to resigning from the Pentagon in 2017, Luis Elizondo facilitated the declassification of the Three Declassified Navy UAP Videos (2017 disclosure).","quote":"but not before getting these three videos declassified."},{"id":"db300911-ef24-4a3f-a26a-d18947475f5c","type":"administrative","location":"00:10:51.9-00:11:04.3","speaker":"Whitaker, Bill","text":"Christopher Mellon held the position of Deputy Assistant Secretary of Defense for Intelligence under the administration of Bill Clinton.","quote":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton"},{"id":"9a7b3e57-755f-4300-a432-38d7a1fbfaaf","type":"administrative","location":"00:10:51.9-00:11:04.3","speaker":"Whitaker, Bill","text":"Christopher Mellon held the position of Deputy Assistant Secretary of Defense for Intelligence under the administration of George W. Bush.","quote":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents... George W. Bush"},{"id":"d9736ba8-76fb-45e9-bb27-cffd7b5fd662","type":"opinion","location":"00:11:08.4-00:11:18.7","speaker":"Mellon, Christopher","text":"Drawing upon his high-level departmental oversight experience, Christopher Mellon maintains a very high degree of confidence that the observed Unidentified Aerial Phenomena (UAP) do not originate from classified United States technology programmes.","quote":"Bill Whitaker: We know that? Christopher Mellon: I could say that with a very high degree of confidence, in part because of the positions I held in the department, and I know the process."},{"id":"880be7d8-874d-4642-861b-6975daff92b4","type":"administrative","location":"00:11:18.7-00:11:37.0","speaker":"Whitaker, Bill","text":"Acting as a private citizen in 2017, Christopher Mellon obtained the Three Declassified Navy UAP Videos (2017 disclosure) and subsequently leaked them to The New York Times.","quote":"In 2017, as a private citizen, he surreptitiously acquired the three Navy videos Elizondo had declassified and leaked them to The New York Times."},{"id":"bacd65b4-d3eb-4ecd-bf00-095d25aa6b1f","type":"administrative","location":"00:11:46.1-00:12:07.2","speaker":"Whitaker, Bill","text":"Christopher Mellon and Luis Elizondo strategically targeted media networks, including the History Channel, as well as members of the United States Congress to build public pressure concerning Unidentified Aerial Phenomena (UAP).","quote":"they started to tell their story to anybody who would listen, to newspapers, the History Channel, to members of Congress."},{"id":"8e07781b-465d-40ec-a728-31f4e8322844","type":"administrative","location":"00:12:07.2-00:12:20.1","speaker":"Whitaker, Bill","text":"In August 2020, the United States Department of Defense (DoD) formalised a successor to the Advanced Aerospace Threat Identification Program (AATIP) by launching the Unidentified Aerial Phenomena Task Force (UAPTF).","quote":"This past August, the Pentagon resurrected AATIP. It's now called the UAP Task Force."},{"id":"b342ca08-6262-4981-9ec0-16b9cd17db66","type":"administrative","location":"00:12:07.2-00:12:20.1","speaker":"Whitaker, Bill","text":"The United States Department of Defense (DoD) currently encourages all active duty service members to document and report any strange aerial encounters.","quote":"Service members now are encouraged to report strange encounters."},{"id":"105f0861-6d6c-4eab-b88f-ec8dcd0df46f","type":"opinion","location":"00:12:20.1-00:12:46.3","speaker":"Rubio, Marco","text":"Marco Rubio designates any unauthorised objects permeating restricted airspace as a direct threat.","quote":"Anything that enters an airspace that's not supposed to be there is a threat."},{"id":"3b71c62e-5e08-4768-a7b4-53e2c907468e","type":"administrative","location":"00:12:20.1-00:12:46.3","speaker":"Whitaker, Bill","text":"While serving as the chair of the United States Senate Select Committee on Intelligence (SSCI) in December 2020, Marco Rubio legislatively requested the 2021 Preliminary Assessment on Unidentified Aerial Phenomena from the Office of the Director of National Intelligence (ODNI) and the United States Department of Defense (DoD).","quote":"This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month."},{"id":"46fe0374-30b4-4c01-beaa-91ad23fc4649","type":"observation","location":"00:12:46.3-00:13:12.2","speaker":"Rubio, Marco","text":"Marco Rubio acknowledges an ongoing stigma permeating USA, Washington D.C., Capitol Hill which hampers serious discussions concerning Unidentified Aerial Phenomena (UAP).","quote":"You know, there's a stigma on Capitol Hill. I mean, some of my colleagues are very interested in this topic and some kind of, you know, giggle when you bring it up."},{"id":"d1081462-8eb5-44a6-a0dc-add0c5a1a692","type":"opinion","location":"00:12:46.3-00:13:12.2","speaker":"Rubio, Marco","text":"Marco Rubio firmly believes the social stigma regarding Unidentified Aerial Phenomena (UAP) must not deter the United States Congress from thoroughly investigating the core fundamental questions of the phenomenon.","quote":"But I don't think we can allow the stigma to keep us from having an answer to a very fundamental question."},{"id":"a74f87f5-68c8-406f-bc0b-d29344f1228c","type":"opinion","location":"00:13:12.2-00:13:35.4","speaker":"Rubio, Marco","text":"Marco Rubio demands a formalised pipeline allowing the constant ingestion, cataloguing, and rigorous scientific analysis of Unidentified Aerial Phenomena (UAP) data feeds.","quote":"I want us to take it seriously and have a process to take it seriously. I want us to have a process to analyze the data. every time it comes in, that there be a place where this is cataloged and constantly analyzed until we get some answers."},{"id":"bf6ff144-cd0d-48fe-8636-e92202466ddf","type":"testimony","location":"00:13:35.4-00:13:41.7","speaker":"Dietrich, Alex","text":"During the 2004 USS Nimitz UAP encounter, Alex Dietrich felt utterly vulnerable as her F/A-18 strike fighter was completely unarmed.","quote":"I felt the vulnerability of not having anything to defend ourselves."}],"nodes":[{"id":"48eaf60b-5e08-485f-bf93-a461407e3afa","type":"person","name":"Whitaker, Bill"},{"id":"78f5d6ba-3c35-479f-a741-7aed2718f504","type":"person","name":"Elizondo, Luis"},{"id":"b920ddda-7c95-49fc-a5f5-1d79e18d1337","type":"person","name":"Reid, Harry"},{"id":"4f450480-7c48-4015-9c9a-1290c36ba687","type":"person","name":"Graves, Ryan"},{"id":"ddee48a3-c6ec-47bc-af39-8f7babdc3b1f","type":"person","name":"Fravor, David"},{"id":"c22f8dd4-34cf-40b3-895e-df541e8c7fc9","type":"person","name":"Dietrich, Alex"},{"id":"b1eec826-165e-48fe-9a90-147cfe101de3","type":"person","name":"Mellon, Christopher"},{"id":"50517bcd-76db-41ce-b555-0e931a11c2b7","type":"person","name":"Clinton, Bill"},{"id":"661a59d3-6894-4cc9-8d0c-7cdb9856ca33","type":"person","name":"Bush, George W."},{"id":"37808cc9-d15b-45ac-b3f6-642becb6137b","type":"person","name":"Rubio, Marco"},{"id":"8109cc0e-aed9-41c8-9585-3f5fc8eb28c8","type":"organisation","name":"60 Minutes"},{"id":"8449528f-5c89-4453-9775-308a6bbcfd9b","type":"organisation","name":"United States Department of Defense (DoD)"},{"id":"45aaf0e5-0afc-4bf3-89c9-ff600546f9f5","type":"organisation","name":"United States Senate"},{"id":"c0f904ad-328f-494d-bf17-0c6ed0071d54","type":"organisation","name":"United States Congress"},{"id":"1d0c5cd7-ece6-49e3-b55a-3da6568a5978","type":"organisation","name":"United States Senate Select Committee on Intelligence (SSCI)"},{"id":"798a93e5-ed44-440a-a4db-424642167092","type":"organisation","name":"Office of the Director of National Intelligence (ODNI)"},{"id":"8a68555c-80b6-4123-904f-28dd8a7b87b3","type":"organisation","name":"United States Navy"},{"id":"1d85ba0d-9af8-4826-aa0b-1686ad22f30c","type":"organisation","name":"Top Gun Naval Flight School"},{"id":"fac382f0-66c9-4f77-be28-ebe7c67694cb","type":"organisation","name":"USS Nimitz Carrier Strike Group"},{"id":"6ec851e3-3f0a-4c9e-98de-616f211bac8e","type":"organisation","name":"The New York Times"},{"id":"1ed4e9cb-524f-40b0-9546-28f47eeef40e","type":"organisation","name":"History Channel"},{"id":"16929c17-7ed9-40b1-bd05-16ab8c5d8186","type":"organisation","name":"Unidentified Aerial Phenomena Task Force (UAPTF)"},{"id":"9b703c69-38f7-42ca-89d2-126af1d11342","type":"organisation","name":"People's Republic of China"},{"id":"c69a567b-8eaa-43f4-8c39-69183d5e36d7","type":"organisation","name":"Russian Federation"},{"id":"d410f763-fbf2-4981-9b17-4cf1193645e5","type":"organisation","name":"Kologuard"},{"id":"0d6abf15-76f8-49d5-afca-05d045b7af75","type":"project","name":"Advanced Aerospace Threat Identification Program (AATIP)"},{"id":"36fac69b-75a5-41eb-85f9-6daf8f1164d5","type":"project","name":"Project Blue Book"},{"id":"85297e94-bc83-4e07-9165-feb5070abfa8","type":"topic","name":"Unidentified Aerial Phenomena (UAP)"},{"id":"ef1d44d2-d415-45fc-8cb0-26b606181816","type":"topic","name":"Unidentified Flying Object (UFO)"},{"id":"0476d815-e749-43bd-a5d3-07c7ef7bbeaa","type":"topic","name":"Anomalous Aerial Vehicle (AAV)"},{"id":"6003361d-35a9-4bef-b5c5-e7c1c4f8a759","type":"place","name":"Afghanistan"},{"id":"687c787d-016c-4b42-aad0-7ad7b7417616","type":"place","name":"Middle East"},{"id":"13568882-6777-4de1-9563-940ba59c262a","type":"place","name":"Cuba, Guantánamo Bay"},{"id":"6864cfed-f0e7-4197-9e18-ba3992467b7d","type":"place","name":"USA, Virginia, Virginia Beach"},{"id":"b9302c90-8f84-4182-8132-a0c66172c197","type":"place","name":"USA, Florida, Jacksonville"},{"id":"613733e5-3343-44aa-b2b4-8c25a3913555","type":"place","name":"USA, California, Southern California"},{"id":"8173643c-f3e9-4632-aac1-7bce8b834cdf","type":"place","name":"USA, California, San Diego"},{"id":"394f1748-17a3-406a-84f6-e009753dc431","type":"place","name":"USA, Washington D.C., Capitol Hill"},{"id":"5c050182-3abc-4eb0-9e00-5671f9466da5","type":"object","name":"F/A-18"},{"id":"1d6bc35d-2bfd-47b5-ab9e-739355305462","type":"object","name":"USS Nimitz"},{"id":"b4bbd630-2143-448b-b557-d0dd63b62918","type":"object","name":"USS Princeton"},{"id":"db4d97b3-301a-42d2-a11c-5e3f9bdca8ae","type":"object","name":"Boeing 737"},{"id":"3d0688a9-0a76-4006-896f-121835d7cb49","type":"event","name":"2004 USS Nimitz UAP encounter"},{"id":"23e7c148-4529-4c58-acd6-26e96864beed","type":"event","name":"2014 Virginia Beach UAP encounters"},{"id":"ca6dd92e-3ec9-47bc-8b8b-79089433b479","type":"event","name":"2015 Jacksonville UAP encounter"},{"id":"02715c0b-ca48-4c9b-b29a-491019b09d69","type":"document","name":"Three Declassified Navy UAP Videos (2017 disclosure)"},{"id":"e36be870-8e75-4efc-9df3-a77b61d800fd","type":"document","name":"2021 Preliminary Assessment on Unidentified Aerial Phenomena"}]},{"id":"google_gemini-3.5-flash","name":"google / gemini-3.5-flash","errata":null,"claims":[{"id":"bb0a7072-746a-4902-9f28-0cb6f8079f19","type":"administrative","location":"00:00:14.9-00:00:30.0","speaker":"Whitaker, Bill","text":"The intelligence committee ordered the Office of the Director of National Intelligence and the United States Department of Defense to deliver a report on the mysterious sightings of Unidentified Aerial Phenomena by next month.","quote":"the senate wants to know what it is the intelligence committee has ordered the director of national intelligence and the secretary of defense to deliver a report on the mysterious sightings by next month"},{"id":"22dd9e55-6fdc-4015-94bc-040ca0bbef19","type":"testimony","location":"00:00:56.3-00:00:59.6","speaker":"Elizondo, Luis","text":"The United States government has officially stated for the record that Unidentified Aerial Phenomena are real.","quote":"The government has already stated for the record that they're real. I'm not telling you that. The United States government is telling you that."},{"id":"eb53f3da-0e6b-4716-958c-8e85b80758f1","type":"administrative","location":"00:01:02.4-00:01:11.5","speaker":"Whitaker, Bill","text":"Luis Elizondo spent 20 years running military intelligence operations worldwide, including in Afghanistan, the Middle East, and Guantanamo.","quote":"Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo."},{"id":"149cc0a7-1d07-4252-a29a-eb6bd7181f8d","type":"administrative","location":"00:01:11.5-00:01:24.1","speaker":"Whitaker, Bill","text":"In 2008, Luis Elizondo was asked to join the Advanced Aerospace Threat Identification Program at the United States Department of Defense.","quote":"He hadn't given UFOs a second thought until 2008. That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP."},{"id":"57504998-ab9f-4750-bb10-48e02d9610d7","type":"administrative","location":"00:01:24.1-00:01:34.3","speaker":"Elizondo, Luis","text":"The mission of the Advanced Aerospace Threat Identification Program was to collect and analyse information involving anomalous aerial vehicles, also termed Unidentified Aerial Phenomena.","quote":"The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs. We call them UAPs."},{"id":"e12b73f7-0582-45f4-b31c-d39f70c7a180","type":"administrative","location":"00:01:50.3-00:02:01.6","speaker":"Whitaker, Bill","text":"The Advanced Aerospace Threat Identification Program was part of a 22 million dollar program sponsored by then Senate Majority Leader Harry Reid to investigate Unidentified Aerial Phenomena.","quote":"Buried away in the Pentagon, AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs."},{"id":"7e34f3ae-f24a-4cf4-bc31-558eb73e580d","type":"administrative","location":"00:02:01.6-00:02:10.8","speaker":"Whitaker, Bill","text":"When Luis Elizondo took over the Advanced Aerospace Threat Identification Program in 2010, he focused on the national security implications of Unidentified Aerial Phenomena documented by United States service members.","quote":"When Elizondo took over in 2010, he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members."},{"id":"0088fb4b-630b-4aa3-9db5-1a26ee709382","type":"measurement","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"The observed Unidentified Aerial Phenomena display technology capable of executing manoeuvres pulling 600 to 700 G-forces.","quote":"Imagine a technology that can do 600 to 700 G-forces... That's precisely what we're seeing."},{"id":"8ecc8e04-3aef-4368-b576-5c5e903ee8b8","type":"measurement","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"The observed Unidentified Aerial Phenomena display technology capable of flying at approximately 21,000 kilometres per hour.","quote":"Imagine a technology that... can fly at 13,000 miles an hour... That's precisely what we're seeing."},{"id":"43c25ab0-b2f1-4681-a8b3-e0eaac383d2d","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"The observed Unidentified Aerial Phenomena display technology capable of evading radar.","quote":"Imagine a technology that... can evade radar... That's precisely what we're seeing."},{"id":"a092109b-e0b7-439d-9aee-48184910a886","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"The observed Unidentified Aerial Phenomena display technology capable of flying through air, water, and possibly space.","quote":"Imagine a technology that... can fly through air and water and possibly space... That's precisely what we're seeing."},{"id":"02fca2d3-cc92-49bc-abbb-180a2010e644","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"The observed Unidentified Aerial Phenomena have no obvious signs of propulsion, wings, or control surfaces, yet still defy the natural effects of Earth's gravity.","quote":"Imagine a technology that... has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity. That's precisely what we're seeing."},{"id":"af1bc560-9065-4e83-9d18-7c2abaf6d7a3","type":"observation","location":"00:02:57.7-00:03:02.1","speaker":"Whitaker, Bill","text":"An aircrew from the United States Navy struggled to obtain a radar/sensor lock on a fast-moving Unidentified Aerial Phenomenon off the United States Atlantic coast in 2015.","quote":"A Navy aircrew struggles to lock onto a fast-moving object off the U.S. Atlantic coast in 2015."},{"id":"a1048eff-8e14-486b-99e4-760cb8e2007c","type":"opinion","location":"00:04:06.2-00:04:12.9","speaker":"Whitaker, Bill","text":"Lieutenant Ryan Graves, a former United States Navy pilot on F/A-18 Hornet, considers the Unidentified Aerial Phenomena observed in restricted airspace to be a national security risk.","quote":"Former Navy pilot Lieutenant Ryan Graves calls whatever is out there a security risk."},{"id":"2c4743d4-b765-4f52-9172-1e3205ac8116","type":"observation","location":"00:04:12.9-00:04:29.7","speaker":"Graves, Ryan","text":"Ryan Graves' F/A-18 Hornet squadron began observing Unidentified Aerial Phenomena hovering over restricted airspace southeast of Virginia Beach, Virginia in 2014, following an upgrade to their jets' radar systems.","quote":"He told us his F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar, making it possible to zero in with infrared targeting cameras."},{"id":"895aecfc-da1d-4202-a704-8aaac7cc5100","type":"observation","location":"00:04:29.7-00:04:37.1","speaker":"Graves, Ryan","text":"The simultaneous detection of Unidentified Aerial Phenomena via both radar and infrared targeting cameras is extremely difficult to spoof.","quote":"Bill Whitaker: So you're seeing it both with the radar and with the infrared, and that tells you that there is something out there. Ryan Graves: Pretty hard to spoof that."},{"id":"74ebeb2b-0ada-4e13-b8e5-40415bfc4153","type":"observation","location":"00:04:38.6-00:04:48.2","speaker":"Whitaker, Bill","text":"The United States Department of Defense confirmed that photos taken southeast of Virginia Beach in 2019 are of Unidentified Aerial Phenomena.","quote":"These photographs were taken in 2019 in the same area. The Pentagon confirms these are images of objects it can't identify."},{"id":"bfde8407-5711-4b51-b484-314318732859","type":"observation","location":"00:04:48.2-00:04:56.6","speaker":"Graves, Ryan","text":"United States Navy pilots training off the Atlantic coast observe Unidentified Aerial Phenomena every day and have done so for at least a couple of years.","quote":"Bill Whitaker: Lieutenant Graves told us pilots training off the Atlantic coast see things like that all the time. Ryan Graves: Every day. Every day for at least a couple of years."},{"id":"4ddb9e65-411a-4136-8628-53002a18967c","type":"observation","location":"00:05:02.5-00:05:12.8","speaker":"Whitaker, Bill","text":"An Unidentified Aerial Phenomenon was captured off the coast of Jacksonville, Florida in 2015 on a targeting camera by members of Ryan Graves' squadron.","quote":"including this one, off the coast of Jacksonville, Florida in 2015, captured on a targeting camera by members of Graves' squadron."},{"id":"acb1d3d4-049f-4905-9d77-0725c56c62fd","type":"observation","location":"00:05:12.8-00:05:23.8","speaker":"Graves, Ryan","text":"During the 2015 Jacksonville encounter, United States Navy pilots observed multiple Unidentified Aerial Phenomena travelling against a wind blowing at approximately 222 kilometres per hour.","quote":"My gosh! They're all going against the wind. The wind's 120 knots far west."},{"id":"288da71c-d8bd-426e-bafc-ec1fc7910e05","type":"observation","location":"00:05:12.8-00:05:23.8","speaker":"Graves, Ryan","text":"During the 2015 Jacksonville encounter, the filmed Unidentified Aerial Phenomenon was observed rotating.","quote":"It's rotating. My gosh!"},{"id":"64439e53-ee20-412f-9a29-72f68f1625ce","type":"opinion","location":"00:06:00.5-00:06:04.1","speaker":"Graves, Ryan","text":"Ryan Graves considers Russian or Chinese military technology to be a potential explanation for the observed Unidentified Aerial Phenomena.","quote":"Bill Whitaker: Could it be Russian or Chinese technology? Ryan Graves: I don't see why not."},{"id":"4c379c5a-5139-4bee-b887-76e12ebad5d3","type":"administrative","location":"00:06:23.4-00:06:40.8","speaker":"Whitaker, Bill","text":"The United States government publicly ignored Unidentified Aerial Phenomena since terminating Project Blue Book in 1969, until a 2004 incident off Southern California.","quote":"The government has ignored it, at least publicly, since closing its Project Blue Book investigation in 1969. But that began to change after an incident off Southern California in 2004"},{"id":"1d6c1882-861e-4d29-b0b1-2d345c4b1870","type":"administrative","location":"00:06:30.3-00:06:57.3","speaker":"Whitaker, Bill","text":"The November 2004 USS Nimitz UAP encounter was documented by radar, by camera, and by four naval aviators, including David Fravor and Alex Dietrich.","quote":"which was documented by radar, by camera, and four naval aviators. We spoke to two of them, David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz, and flying at his wing, Lieutenant Alex Dietrich"},{"id":"0235adff-0f77-4f4b-8ff9-2ec9106105f9","type":"observation","location":"00:07:14.4-00:07:39.3","speaker":"Whitaker, Bill","text":"During the November 2004 USS Nimitz UAP encounter, the radar on the USS Princeton detected multiple Unidentified Aerial Phenomena descending from approximately 24,000 metres in less than a second.","quote":"For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 80,000 feet in less than a second."},{"id":"478ceb9a-1a28-4b53-a720-b2022e1fedcb","type":"observation","location":"00:07:39.3-00:07:47.8","speaker":"Fravor, David","text":"During the November 2004 USS Nimitz UAP encounter, David Fravor and Alex Dietrich were diverted to investigate and located an area of roiling white water the size of a Boeing 737 aircraft in the ocean.","quote":"On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate. They found an area of roiling white water the size of a 737 in an otherwise calm blue sea."},{"id":"a310f8b2-9f96-498f-8c37-8935e1ce628a","type":"observation","location":"00:07:55.9-00:08:12.3","speaker":"Fravor, David","text":"During the November 2004 USS Nimitz UAP encounter, David Fravor and Alex Dietrich observed a white Tic-Tac-shaped Unidentified Aerial Phenomenon hovering over the roiling ocean water.","quote":"and about that got out, I said, dude, do you see that thing down there? And we saw this little white tic-tac-looking object. And it's just kind of moving above the whitewater area."},{"id":"37a19dd7-b8a9-4b48-b995-45181b647fb7","type":"observation","location":"00:08:17.9-00:08:30.5","speaker":"Fravor, David","text":"During the November 2004 USS Nimitz UAP encounter, the Unidentified Aerial Phenomenon mimicked the flight movements of David Fravor's F/A-18 Hornet, appearing actively aware of the jet's presence.","quote":"David Fravor: The tic-tac's still pointing north-south. It goes and just turns abruptly and starts mirroring me. So as I'm coming down, it starts coming up. Bill Whitaker: So it's mimicking your moves. David Fravor: Yeah, it was aware we were there."},{"id":"223c5a62-281d-4633-be68-5f250bfba154","type":"observation","location":"00:08:30.5-00:08:37.0","speaker":"Fravor, David","text":"During the November 2004 USS Nimitz UAP encounter, the observed Unidentified Aerial Phenomenon was about the size of an F/A-18 Hornet, and possessed no markings, no wings, and no exhaust plumes.","quote":"He said it was about the size of his F-18, with no markings, no wings, no exhaust plumes."},{"id":"a5b25483-0ed6-42ea-a459-cfbac819fd43","type":"observation","location":"00:08:37.0-00:08:47.8","speaker":"Fravor, David","text":"During the November 2004 Encounters, David Fravor attempted to fly closer to the Unidentified Aerial Phenomenon, which climbed and then suddenly disappeared from view.","quote":"I want to see how close I can get. So I go like this, and it's climbing still. And when it gets right in front of me, it just disappears... Disappears, like gone. It had sped off."},{"id":"bce66efc-8e7c-499b-a43c-72944eb04dd8","type":"observation","location":"00:09:00.9-00:09:08.9","speaker":"Fravor, David","text":"Four navy aviators in two F/A-18 Hornet jets visually tracked the Unidentified Aerial Phenomenon off Southern California for approximately five minutes.","quote":"Bill Whitaker: Did your back seaters see this too? Alex Dietrich: Yeah. David Fravor: Oh, yeah. There was four of us in the airplanes literally watching this thing for roughly about five minutes."},{"id":"ada2939a-baf9-4a7e-b9fa-eef22c175d15","type":"observation","location":"00:09:08.9-00:09:20.8","speaker":"Whitaker, Bill","text":"Seconds after the Unidentified Aerial Phenomenon disappeared from David Fravor's position, the radar on the USS Princeton reacquired the target approximately 111 kilometres away.","quote":"Seconds later, the Princeton reacquired the target, 60 miles away. Another crew managed to briefly lock onto it with a targeting camera before it zipped off again."},{"id":"b270c119-341d-4182-87df-c2af275c1824","type":"administrative","location":"00:09:56.5-00:10:13.2","speaker":"Whitaker, Bill","text":"No official investigation or action was pursued by the United States Department of Defense regarding the USS Nimitz encounter for five years, until Luis Elizondo discovered the case in 2009.","quote":"The air crew filed reports. Then, like the mysterious flying object, the Nimitz encounter disappeared. Nothing was said or done officially for five years until Lou Elizondo came across the story and investigated."},{"id":"e73b8a42-d53d-474d-82e0-c8f92bc73c3b","type":"administrative","location":"00:10:31.7-00:10:39.5","speaker":"Whitaker, Bill","text":"Funding for the Advanced Aerospace Threat Identification Program was eliminated in 2012, though Luis Elizondo and others continued the mission informally.","quote":"AATIP's funding was eliminated in 2012, but Elizondo says he and a handful of others kept the mission alive."},{"id":"0d9b7ed2-714a-4888-84aa-9e4f9c7d47f6","type":"administrative","location":"00:10:39.5-00:10:48.8","speaker":"Whitaker, Bill","text":"Luis Elizondo resigned from the United States Department of Defense in 2017 after successfully obtaining the declassification of three Navy videos of Unidentified Aerial Phenomena.","quote":"until finally, frustrated, he quit the Pentagon in 2017, but not before getting these three videos declassified."},{"id":"ec1e52b4-13ae-4105-bb9a-f0c2220a23de","type":"administrative","location":"00:10:57.5-00:11:08.4","speaker":"Whitaker, Bill","text":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence under United States Presidents Bill Clinton and George W. Bush.","quote":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush, and had access to top-secret government programs."},{"id":"575b9617-4c18-4810-b873-b3103351f1a9","type":"opinion","location":"00:11:08.4-00:11:18.7","speaker":"Mellon, Christopher","text":"Christopher Mellon is highly confident that the observed Unidentified Aerial Phenomena do not belong to secret United States military technology programs.","quote":"Christopher Mellon: So it's not us, that's one thing we know. Bill Whitaker: We know that? Christopher Mellon: I could say that with a very high degree of confidence, in part because of the positions I held in the department, and I know the process."},{"id":"f0639436-f986-40b8-996c-5e2384404f2a","type":"administrative","location":"00:12:07.2-00:12:15.6","speaker":"Whitaker, Bill","text":"In August 2020, the United States Department of Defense established the Unidentified Aerial Phenomena Task Force, effectively resurrecting the mission of the Advanced Aerospace Threat Identification Program.","quote":"This past August, the Pentagon resurrected AATIP. It's now called the UAP Task Force."},{"id":"a7260841-7f6d-401f-8f5c-660f5f90c991","type":"administrative","location":"00:12:34.0-00:12:46.3","speaker":"Whitaker, Bill","text":"In December 2020, Senator Marco Rubio, while serving as Chairman of the United States Senate Select Committee on Intelligence, requested that the Director of National Intelligence and the Department of Defense present Congress with an unclassified report on Unidentified Aerial Phenomena.","quote":"This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month."},{"id":"344f54e1-b669-462d-90b9-9b6a138b80f4","type":"opinion","location":"00:13:12.2-00:13:25.9","speaker":"Rubio, Marco","text":"Senator Marco Rubio believes the United States government should take Unidentified Aerial Phenomena seriously and develop an official, ongoing process to compile and analyse incoming sensor data.","quote":"I want us to take it seriously and have a process to take it seriously. I want us to have a process to analyze the data. every time it comes in, that there be a place where this is cataloged and constantly analyzed until we get some answers."}],"nodes":[{"id":"a997d645-9a18-4f2e-80e1-eb2875d047e3","type":"topic","name":"Unidentified Aerial Phenomena (UAP)"},{"id":"a6a49109-9b39-4d1c-8771-416a4373d9a5","type":"topic","name":"anomalous aerial vehicle (AAV)"},{"id":"875c3b91-6059-436b-9f7f-7f3a979fc9e9","type":"person","name":"Whitaker, Bill"},{"id":"4038a8ec-aca3-4fa8-87bb-0c04d4649aa8","type":"person","name":"Elizondo, Luis"},{"id":"13b711c0-ffbe-486d-a0f9-c03372b439b8","type":"person","name":"Graves, Ryan"},{"id":"c7f8999b-4a4c-4380-bfd9-7d1c2796b89c","type":"person","name":"Mellon, Christopher"},{"id":"8b084742-fd3d-4a35-b1f8-8564a1862ac3","type":"person","name":"Fravor, David"},{"id":"bd20bbe9-93fe-4ffd-bd23-044f2db70928","type":"person","name":"Dietrich, Alex"},{"id":"9b5275f7-c865-4278-a1e0-ab63d42d1c66","type":"person","name":"Reid, Harry"},{"id":"c1f493d5-102c-459c-9915-f50dc2145887","type":"person","name":"Rubio, Marco"},{"id":"91a114da-28bc-48e7-be7d-7d91db64b62d","type":"organisation","name":"United States Department of Defense"},{"id":"a864417b-b701-4556-b7ad-47fb9264d68a","type":"organisation","name":"United States Navy"},{"id":"e1bf4cda-ba97-44b1-8f7e-8c19593ee53a","type":"organisation","name":"United States Senate Select Committee on Intelligence"},{"id":"f16c3abc-9232-4d81-a8fb-49d41a0ecc6c","type":"organisation","name":"Office of the Director of National Intelligence (ODNI)"},{"id":"24b5feba-d0c9-4cdc-8075-b3c74f81371b","type":"organisation","name":"The New York Times"},{"id":"52aea703-6ed9-47f4-b6df-ceedaf6b2c6e","type":"organisation","name":"Top Gun Naval Flight School"},{"id":"0cd31ccd-4161-43d9-9416-43ded011398f","type":"project","name":"Advanced Aerospace Threat Identification Program (AATIP)"},{"id":"95af09d0-6b75-4c2c-9fa8-c32b134dc0ef","type":"project","name":"Project Blue Book"},{"id":"f3d14c33-e266-43b6-9a53-6a905471658b","type":"project","name":"Unidentified Aerial Phenomena Task Force (UAPTF)"},{"id":"88c61cdb-c30b-4510-af06-b73a79dc5a61","type":"document","name":"60 Minutes"},{"id":"ec3787fb-5740-4136-92a4-0c5954c65e26","type":"event","name":"2004 USS Nimitz UAP encounter"},{"id":"34f03ba7-4a29-428f-b97d-e2c9461a26b3","type":"object","name":"F/A-18 Hornet"},{"id":"32fdb8be-90f1-43c0-892f-f433fa47c899","type":"object","name":"USS Nimitz"},{"id":"e3a54917-34e4-465f-acad-feb2f2157344","type":"object","name":"USS Princeton"},{"id":"97327c6d-acdf-483e-9ad7-0405131fda77","type":"place","name":"USA, California, San Diego"},{"id":"6cec28b2-1120-42d3-bfb7-2d357e05d507","type":"place","name":"USA, Virginia, Virginia Beach"},{"id":"d09ba6e5-4375-407d-b639-9eb59b5e37be","type":"place","name":"USA, Florida, Jacksonville"}]},{"id":"meta-llama_llama-4-maverick","name":"meta-llama / llama-4-maverick","errata":null,"claims":[{"id":"42bdfc76-9cb3-47f4-aca7-cafed0eaebcb","type":"testimony","location":"00:00:44.4-00:00:59.6","speaker":"Luis Elizondo","text":"The United States government has officially confirmed for the record that Unidentified Aerial Phenomena (UAP) are real.","quote":"Bill Whitaker: So what you're telling me is that UFOs, unidentified flying objects, are real. Luis Elizondo: Bill, I think we're beyond that already. The government has already stated for the record that they're real."},{"id":"34ad450d-f121-4cd1-bfda-fbe29d048fbd","type":"administrative","location":"00:01:02.4-00:01:11.5","speaker":"Bill Whitaker","text":"Luis Elizondo spent 20 years running military intelligence operations worldwide.","quote":"Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo."},{"id":"64ec8ec5-684e-4ebf-a3cd-2c61bf29b622","type":"administrative","location":"00:01:50.3-00:02:01.6","speaker":"Bill Whitaker","text":"The Advanced Aerospace Threat Identification Program (AATIP) was part of a $22 million program sponsored by Harry Reid to investigate Unidentified Aerial Phenomena (UAP).","quote":"Buried away in the Pentagon, AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs."},{"id":"f85fbaec-4162-4ae5-a002-6e63db886e98","type":"testimony","location":"00:01:24.1-00:01:34.3","speaker":"Luis Elizondo","text":"The mission of AATIP was to collect and analyse information involving Anomalous Aerial Vehicles (AAV).","quote":"The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs. We call them UAPs."},{"id":"27e81c86-9d97-4cd6-bfb0-251fd9f7229a","type":"testimony","location":"00:02:01.6-00:02:12.6","speaker":"Bill Whitaker","text":"Luis Elizondo focused on the national security implications of Unidentified Aerial Phenomena (UAP) documented by United States service members when he took over AATIP in 2010.","quote":"When Elizondo took over in 2010, he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members."},{"id":"34a5c47c-39c4-46d6-b17d-b29e98ce6f42","type":"opinion","location":"00:02:12.6-00:02:35.2","speaker":"Luis Elizondo","text":"Some observed UAP have capabilities including doing approximately 970 to 1,130 kilometre-per-hour speeds, evading radar, and flying through air and water with no obvious signs of propulsion, no wings, no control surfaces, and defying the natural effects of Earth's gravity.","quote":"Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity. That's precisely what we're seeing."},{"id":"e3c0196f-9e54-4cf0-9281-58d5ae6c60f2","type":"testimony","location":"00:02:37.0-00:03:02.1","speaker":"Bill Whitaker","text":"A Navy aircrew struggled to lock onto a fast-moving Unidentified Aerial Phenomena (UAP) off the United States Atlantic coast in 2015.","quote":"A Navy aircrew struggles to lock onto a fast-moving object off the U.S. Atlantic coast in 2015."},{"id":"af5dcb01-b5ec-4846-8b95-998522539f98","type":"testimony","location":"00:04:06.2-00:04:29.7","speaker":"Bill Whitaker","text":"Ryan Graves' F/A-18 squadron began seeing Unidentified Aerial Phenomena (UAP) hovering over restricted airspace southeast of Virginia Beach in 2014 after they updated their jet's radar.","quote":"He told us his F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar, making it possible to zero in with infrared targeting cameras."},{"id":"e74c5b73-67ec-485a-9ef9-f761f5a5aa70","type":"opinion","location":"00:04:29.7-00:04:38.6","speaker":"Ryan Graves","text":"The dual radar-and-infrared detection of Unidentified Aerial Phenomena (UAP) is hard to spoof.","quote":"So you're seeing it both with the radar and with the infrared, and that tells you that there is something out there. Ryan Graves: Pretty hard to spoof that."},{"id":"0f9d03fb-8e80-45ce-bf11-987122ca69dd","type":"observation","location":"00:04:29.7-00:05:04.3","speaker":"Ryan Graves","text":"Ryan Graves observed no exhaust plume on the Unidentified Aerial Phenomena (UAP) off the Atlantic coast.","quote":"Bill Whitaker: So you're seeing it both with the radar and with the infrared, and that tells you that there is something out there. Ryan Graves: Pretty hard to spoof that. Bill Whitaker: ...including this one, off the coast of Jacksonville, Florida in 2015, captured on a targeting camera by members of Graves' squadron. Ryan Graves: I don't see an exhaust plume."},{"id":"6dcb2e74-e95e-46aa-b23c-1a3dbcf2340a","type":"opinion","location":"00:06:00.5-00:06:05.4","speaker":"Ryan Graves","text":"Ryan Graves considers Russian or Chinese technology a possible explanation for the observed Unidentified Aerial Phenomena (UAP).","quote":"Bill Whitaker: Could it be Russian or Chinese technology? Ryan Graves: I don't see why not."},{"id":"f0631b71-f76b-4c91-a5d6-0dc8fcb26ab2","type":"testimony","location":"00:07:14.4-00:07:39.3","speaker":"Bill Whitaker","text":"The USS Nimitz Carrier Strike Group was training approximately 180 kilometres southwest of San Diego on 2004-11-14.","quote":"It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego. For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 24,000 metres in less than a second. On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate."},{"id":"506b8965-2590-4d7c-8cee-57a5b25e18dc","type":"observation","location":"00:07:55.9-00:08:09.7","speaker":"David Fravor","text":"David Fravor and Alex Dietrich observed a small white object, described as 'Tic Tac'-shaped, moving above a whitewater area during the 2004 USS Nimitz UAP encounter.","quote":"So as we're looking at this, her backseater says, hey, Skipper, do you? And about that got out, I said, dude, do you see that thing down there? And we saw this little white tic-tac-looking object. And it's just kind of moving above the whitewater area."},{"id":"2581461e-d161-4b6c-90ce-279df18729be","type":"testimony","location":"00:08:30.5-00:08:37.0","speaker":"Bill Whitaker","text":"The observed Unidentified Aerial Phenomena (UAP) during the 2004 USS Nimitz UAP encounter was about the size of an F/A-18, with no markings, no wings, and no exhaust plumes.","quote":"He said it was about the size of his F-18, with no markings, no wings, no exhaust plumes."},{"id":"089933b7-b6c0-46d0-9087-c619b87bdd2d","type":"observation","location":"00:08:17.9-00:08:30.5","speaker":"David Fravor","text":"The Unidentified Aerial Phenomena (UAP) observed during the 2004 USS Nimitz UAP encounter was aware of the F/A-18 aircraft and mirrored their movements before disappearing.","quote":"The tic-tac's still pointing north-south. It goes and just turns abruptly and starts mirroring me. So as I'm coming down, it starts coming up. Yeah, it was aware we were there."},{"id":"d33829cc-74b7-489f-bdbb-00b996570fa9","type":"testimony","location":"00:00:07.6-00:00:44.4","speaker":"Bill Whitaker","text":"The United States Senate Intelligence Committee has ordered the Director of National Intelligence and the Secretary of Defense to deliver a report on Unidentified Aerial Phenomena (UAP) by next month.","quote":"The story will continue in a moment. The intelligence committee has ordered the director of national intelligence and the secretary of defense to deliver a report on the mysterious sightings by next month."},{"id":"6ed41a57-b903-4cc3-bc12-46f0dc414fc0","type":"testimony","location":"00:12:07.2-00:12:12.6","speaker":"Bill Whitaker","text":"The Advanced Aerospace Threat Identification Program (AATIP) is now called the Unidentified Aerial Phenomena (UAP) Task Force.","quote":"This past August, the Pentagon resurrected AATIP. It's now called the UAP Task Force."},{"id":"bbbfbfa1-a57b-4bfc-8fa4-a7fc31a756ff","type":"testimony","location":"00:12:12.6-00:12:20.1","speaker":"Bill Whitaker","text":"Service members are now encouraged to report strange encounters with Unidentified Aerial Phenomena (UAP).","quote":"Service members now are encouraged to report strange encounters."},{"id":"45425542-7246-4329-beab-1df930004525","type":"testimony","location":"00:11:18.7-00:11:37.0","speaker":"Bill Whitaker","text":"Christopher Mellon leaked three Navy videos of Unidentified Aerial Phenomena (UAP) to The New York Times in 2017.","quote":"In 2017, as a private citizen, he surreptitiously acquired the three Navy videos Elizondo had declassified and leaked them to The New York Times."},{"id":"87efadfa-abab-4a8e-9dcd-30a0d69dc992","type":"opinion","location":"00:10:51.9-00:11:11.7","speaker":"Christopher Mellon","text":"Christopher Mellon considers it highly likely that observed Unidentified Aerial Phenomena (UAP) are not of United States origin.","quote":"So it's not us, that's one thing we know. Christopher Mellon: I could say that with a very high degree of confidence, in part because of the positions I held in the department, and I know the process."},{"id":"80280acd-65f9-4975-9a07-917294d57520","type":"administrative","location":"00:10:57.5-00:11:04.3","speaker":"Bill Whitaker","text":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush.","quote":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush, and had access to top-secret government programs."},{"id":"445a5dda-1bfc-42f2-a982-b15b35fb2567","type":"administrative","location":"00:01:50.3-00:02:01.6","speaker":"Bill Whitaker","text":"Harry Reid sponsored a $22 million program to investigate Unidentified Aerial Phenomena (UAP).","quote":"AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs."},{"id":"ae6435cb-428d-42f4-b5b2-66ad3554949f","type":"administrative","location":"00:06:23.4-00:06:30.3","speaker":"Bill Whitaker","text":"The United States government closed its Project Blue Book investigation in 1969.","quote":"The government has ignored it, at least publicly, since closing its Project Blue Book investigation in 1969."},{"id":"c88bf668-47f0-4892-907f-a05244beb9de","type":"testimony","location":"00:12:26.5-00:12:34.0","speaker":"Bill Whitaker","text":"Marco Rubio requested a detailed analysis of Unidentified Aerial Phenomena (UAP) while he was head of the Intelligence Committee.","quote":"This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month."},{"id":"06ab2137-3938-4fdc-b0d8-34ac2a55dbbf","type":"opinion","location":"00:12:22.6-00:12:26.5","speaker":"Marco Rubio","text":"Marco Rubio considers any object entering restricted airspace a threat.","quote":"Anything that enters an airspace that's not supposed to be there is a threat."},{"id":"b548382a-b177-4c3b-92d9-1211971144d6","type":"opinion","location":"00:06:07.0-00:06:18.5","speaker":"Ryan Graves","text":"Ryan Graves is worried about the implications of Unidentified Aerial Phenomena (UAP) sightings.","quote":"I am worried, frankly. You know, if these were tactical jets from another country that were hanging out up there, it would be a massive issue. But because it looks slightly different, we're not willing to actually look at the problem in the face. We're happy to just ignore the fact that these are out there watching us every day."},{"id":"0c20e02e-5993-4338-b87d-b366a89263dd","type":"testimony","location":"00:04:48.2-00:05:01.2","speaker":"Ryan Graves","text":"Ryan Graves observed Unidentified Aerial Phenomena (UAP) every day for at least a couple of years while training off the Atlantic coast.","quote":"Lieutenant Graves told us pilots training off the Atlantic coast see things like that all the time. Ryan Graves: Every day. Every day for at least a couple of years."},{"id":"321e5732-a605-4b0c-b1a5-79bb55b48a1c","type":"opinion","location":"00:13:37.3-00:13:41.7","speaker":"Alex Dietrich","text":"Alex Dietrich felt vulnerable during the 2004 USS Nimitz UAP encounter due to the lack of defensive capabilities against the observed Unidentified Aerial Phenomena (UAP).","quote":"I felt the vulnerability of not having anything to defend ourselves."},{"id":"941abb32-4014-41db-8dc1-b134a8cc14ce","type":"testimony","location":"00:07:14.4-00:07:39.3","speaker":"Bill Whitaker","text":"The USS Princeton detected multiple Anomalous Aerial Vehicles (AAV) over the horizon, descending approximately 24,000 metres in less than a second, during the 2004 USS Nimitz UAP encounter.","quote":"For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 80,000 feet in less than a second."},{"id":"54e0dbf5-752b-4014-866b-8c051501a3d8","type":"testimony","location":"00:07:14.4-00:07:39.3","speaker":"Bill Whitaker","text":"David Fravor and Alex Dietrich were diverted to investigate the Unidentified Aerial Phenomena (UAP) on 2004-11-14.","quote":"On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate."},{"id":"4920a35b-d823-4b07-9a8c-d1db0ae0741e","type":"testimony","location":"00:05:12.8-00:05:23.8","speaker":"Bill Whitaker","text":"The wind speed during the Unidentified Aerial Phenomena (UAP) sighting off Jacksonville, Florida in 2015 was approximately 220 kilometres per hour.","quote":"The wind's 120 knots far west."}],"nodes":[{"id":"9b53764f-f89b-41ae-b275-cb97381dc5b7","type":"person","name":"Luis Elizondo"},{"id":"d86f5c57-ac30-4450-b528-55cb1f321a8e","type":"person","name":"Bill Whitaker"},{"id":"a3a7c467-33b4-4654-803d-12104b4605cc","type":"person","name":"Ryan Graves"},{"id":"58118585-5d8e-4077-ab06-940cc08d5241","type":"person","name":"David Fravor"},{"id":"17d9e251-5efb-43e6-a825-174ecf6cdab2","type":"person","name":"Alex Dietrich"},{"id":"d42a6df0-1af4-4f55-aa42-03753e3c9ffd","type":"person","name":"Christopher Mellon"},{"id":"f7b38379-19de-407a-bfeb-8a7222f69b59","type":"person","name":"Marco Rubio"},{"id":"14694470-bb0c-427f-ac81-50d35399eb96","type":"person","name":"Harry Reid"},{"id":"8cc71d43-0853-426d-875b-0b733c711dff","type":"organisation","name":"United States Navy"},{"id":"1373ba17-c354-4fe8-9cb4-c68585523bfe","type":"project","name":"Advanced Aerospace Threat Identification Program (AATIP)"},{"id":"f701d957-a9af-486b-8ff3-892031a6b44d","type":"project","name":"UAP Task Force"},{"id":"b8b8292f-d38f-4f30-88bf-5da1b5d51275","type":"project","name":"Project Blue Book"},{"id":"c684a991-11b4-4451-89ac-c03c21f72386","type":"place","name":"Pentagon"},{"id":"b25bd6c0-1250-4e1d-9095-5c7f5f576686","type":"place","name":"USA, California, San Diego"},{"id":"a219bcae-f348-4e10-ad97-8662be046a4f","type":"place","name":"USA, Virginia, Virginia Beach"},{"id":"8976de07-eaa8-442c-aaf2-f889c2159cec","type":"place","name":"USA, Florida, Jacksonville"},{"id":"fa2b7e53-862c-4a75-b72f-c9a99338c635","type":"object","name":"USS Nimitz"},{"id":"b4e19b47-7975-475c-afb1-f3c084457577","type":"object","name":"USS Princeton"},{"id":"288a7a38-0db4-4b8f-a537-6dd596d0eebd","type":"object","name":"F/A-18"},{"id":"4c8dac8b-ab01-4a6c-97d1-61f12ddb8d6f","type":"organisation","name":"Strike Fighter Squadron 41 (VFA-41)"},{"id":"955a790c-d7c8-4c62-acc9-3eb2221136a1","type":"organisation","name":"Carrier Strike Group 11 (CSG-11)"},{"id":"d5d007d3-f55d-4a89-8c2e-dfa2a8946992","type":"organisation","name":"Top Gun Naval Flight School"},{"id":"81e18b8c-3f20-4603-81a5-cd519e79cda9","type":"organisation","name":"United States Senate"},{"id":"5e596bc0-fa8a-4227-8399-477992cb91cd","type":"organisation","name":"United States Congress"},{"id":"aac2b9be-7eb3-400b-99a6-1a3e9f8826a6","type":"organisation","name":"Office of the Director of National Intelligence (ODNI)"},{"id":"bf991b42-c2ec-4b69-b1fc-9f0f1b94377d","type":"organisation","name":"Department of Defense (DoD)"},{"id":"b5ebcf74-69fe-47d7-a3a3-4c2f202ba786","type":"organisation","name":"Defense Intelligence Agency (DIA)"},{"id":"00336117-901b-4d73-b7e8-bdaa9225f185","type":"document","name":"60 Minutes"},{"id":"aa32109c-9a22-411a-a1d0-3994dc74fc56","type":"organisation","name":"The New York Times"},{"id":"a4fa2c2b-0d70-45fa-93bc-5eb1baed7316","type":"event","name":"2004 USS Nimitz UAP encounter"},{"id":"b17a6ff1-28a8-467c-8f57-1b22f71e360f","type":"topic","name":"Unidentified Aerial Phenomena (UAP)"},{"id":"21fedfc4-c41b-4613-827b-11e193edf059","type":"topic","name":"Anomalous Aerial Vehicle (AAV)"}]},{"id":"mistralai_mistral-small-3.2-24b-instruct","name":"mistralai / mistral-small-3.2-24b-instruct","errata":null,"claims":[{"id":"b5ba0f65-3806-4e3d-ba78-7d4efbfb51ca","type":"testimony","location":"00:00:44.4-00:01:02.4","speaker":"Luis Elizondo","text":"The United States government has officially confirmed for the record that Unidentified Aerial Phenomena (UAP) are real.","quote":"Bill Whitaker: So what you're telling me is that UFOs, unidentified flying objects, are real. Luis Elizondo: Bill, I think we're beyond that already. The government has already stated for the record that they're real. I'm not telling you that. The United States government is telling you that."},{"id":"6823ef2d-8be9-45fd-b9d0-8728c668a2ac","type":"administrative","location":"00:01:02.4-00:01:11.5","speaker":"Bill Whitaker","text":"Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo.","quote":"Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo."},{"id":"808ca1ed-3cb6-4dbe-862f-dd9e84c5454e","type":"administrative","location":"00:01:11.5-00:01:24.1","speaker":"Bill Whitaker","text":"Luis Elizondo joined the Advanced Aerospace Threat Identification Program (AATIP) at the Pentagon in 2008.","quote":"He hadn't given UFOs a second thought until 2008. That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP."},{"id":"fe848aba-edc2-410d-8c92-91c4d440c133","type":"administrative","location":"00:01:24.1-00:01:35.9","speaker":"Luis Elizondo","text":"The mission of the Advanced Aerospace Threat Identification Program (AATIP) was to collect and analyse information involving anomalous aerial vehicles, also known as Unidentified Aerial Phenomena (UAP).","quote":"The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs. We call them UAPs."},{"id":"d668b56d-0d03-41e4-8f18-7149e9a48eb1","type":"administrative","location":"00:02:01.6-00:02:12.6","speaker":"Bill Whitaker","text":"Luis Elizondo took over the Advanced Aerospace Threat Identification Program (AATIP) in 2010 and focused on the national security implications of Unidentified Aerial Phenomena (UAP) documented by United States service members.","quote":"When Elizondo took over in 2010, he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members."},{"id":"7a3a65b4-be45-4799-b77e-545e87941f01","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Luis Elizondo","text":"Luis Elizondo described a technology that can do 600 to 700 G-forces, fly at approximately 21,000 kilometres per hour, evade radar, fly through air and water and possibly space, and has no obvious signs of propulsion, no wings, no control surfaces, and can defy the natural effects of Earth's gravity.","quote":"Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity. That's precisely what we're seeing."},{"id":"9c7b45fc-c9f8-4e5f-87c9-0114fcfd1b7b","type":"administrative","location":"00:02:37.0-00:02:47.7","speaker":"Bill Whitaker","text":"The Advanced Aerospace Threat Identification Program (AATIP) was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time.","quote":"Elizondo tells us AATIP was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time."},{"id":"db2065e4-113c-4614-bc9c-ebe80b97709f","type":"observation","location":"00:02:57.7-00:03:02.1","speaker":"Bill Whitaker","text":"A Navy aircrew struggled to lock onto a fast-moving object off the United States Atlantic coast in 2015.","quote":"A Navy aircrew struggles to lock onto a fast-moving object off the U.S. Atlantic coast in 2015."},{"id":"f37d4644-1937-4574-a7fc-8bff6f0adc92","type":"testimony","location":"00:03:07.3-00:03:20.4","speaker":"Bill Whitaker","text":"The United States Department of Defense (DoD) admits it does not know what the objects in the recently released images are.","quote":"Recently released images may not convince UFO skeptics, but the Pentagon admits it doesn't know what in the world this is, or this, or this."},{"id":"32c62777-0a78-422f-9af7-b83caeab253c","type":"testimony","location":"00:03:20.4-00:03:38.6","speaker":"Luis Elizondo","text":"Luis Elizondo stated that in some cases, there are simple explanations for what people are witnessing, but there are some that are not.","quote":"So what do you say to the skeptics? It's refracted light, weather balloons, a rocket being launched, Venus. In some cases, there are simple explanations for what people are witnessing, but there are some that that are not."},{"id":"ab1804fd-1294-4c7a-bedc-a8b3c0133e34","type":"testimony","location":"00:03:38.6-00:03:52.6","speaker":"Luis Elizondo","text":"Luis Elizondo stated that the United States Department of Defense (DoD) goes through due diligence to determine if Unidentified Aerial Phenomena (UAP) are some sort of new type of cruise missile technology that China has developed or some sort of high-altitude balloon that is conducting reconnaissance.","quote":"We're not just simply jumping to a conclusion that's saying, oh, that's a UAP out there. We're going through our due diligence. Is it some sort of new type of cruise missile technology that China has developed? Is it some sort of high-altitude balloon that's conducting reconnaissance? Ultimately, when you have exhausted all those what-ifs and you're still left with the fact that this is in our airspace and it's real, that's when it becomes compelling and that's when it becomes problematic."},{"id":"55a176fe-c561-4c2b-8b81-5e7ea74cc216","type":"opinion","location":"00:04:06.2-00:04:12.9","speaker":"Bill Whitaker","text":"Former Navy pilot Lieutenant Ryan Graves calls whatever is out there a security risk.","quote":"Former Navy pilot Lieutenant Ryan Graves calls whatever is out there a security risk."},{"id":"19827a80-25e2-443a-a408-a3cce8174e87","type":"testimony","location":"00:04:12.9-00:04:29.7","speaker":"Bill Whitaker","text":"Ryan Graves stated that his F-18 squadron began seeing Unidentified Aerial Phenomena (UAP) hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar, making it possible to zero in with infrared targeting cameras.","quote":"He told us his F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar, making it possible to zero in with infrared targeting cameras."},{"id":"58570c2c-3da6-4ea7-8a0d-4675fd400862","type":"testimony","location":"00:04:29.7-00:04:38.6","speaker":"Ryan Graves","text":"Ryan Graves stated that seeing an object both with radar and with infrared indicates that there is something out there.","quote":"So you're seeing it both with the radar and with the infrared, and that tells you that there is something out there. Ryan Graves: Pretty hard to spoof that."},{"id":"20d3aafa-7236-4ad1-89c9-00aca7b13d4a","type":"testimony","location":"00:04:38.6-00:04:48.2","speaker":"Bill Whitaker","text":"The United States Department of Defense (DoD) confirms that photographs taken in 2019 in the same area as the 2014 sightings are images of objects it cannot identify.","quote":"These photographs were taken in 2019 in the same area. The Pentagon confirms these are images of objects it can't identify."},{"id":"44a3a13a-27ca-4b16-badf-eab9b233fab9","type":"testimony","location":"00:04:48.2-00:05:02.5","speaker":"Ryan Graves","text":"Ryan Graves stated that pilots training off the Atlantic coast see Unidentified Aerial Phenomena (UAP) every day for at least a couple of years.","quote":"Lieutenant Graves told us pilots training off the Atlantic coast see things like that all the time. Ryan Graves: Every day. Every day for at least a couple of years. Bill Whitaker: Wait a minute. Every day for a couple of years? Ryan Graves: Mm-hmm."},{"id":"fd5d7716-aee9-4d0f-89f7-5f4291b55f80","type":"testimony","location":"00:05:02.5-00:05:04.3","speaker":"Ryan Graves","text":"Ryan Graves stated that he does not see an exhaust plume on the Unidentified Aerial Phenomena (UAP) off the Atlantic coast.","quote":"You know, I don't see an exhaust plume."},{"id":"9d336cee-19ef-48fe-9920-5b63027ddcb4","type":"testimony","location":"00:05:35.8-00:05:42.8","speaker":"Ryan Graves","text":"Ryan Graves stated that he does not know what the Unidentified Aerial Phenomena (UAP) are, but they have rotation, high altitudes, and propulsion.","quote":"This is a difficult one to explain. You have rotation, you have high altitudes, you have propulsion, right? I don't know. I don't know what it is, frankly."},{"id":"7d58fb60-1172-4c9b-af2b-bfd2c429cf36","type":"testimony","location":"00:05:56.0-00:06:00.5","speaker":"Ryan Graves","text":"Ryan Graves stated that the highest probability is that the Unidentified Aerial Phenomena (UAP) are a threat observation program.","quote":"I'd say, you know, the highest probability is it's a threat observation program."},{"id":"0481b5fa-b32e-4fc3-969f-3734cacfc139","type":"opinion","location":"00:06:00.5-00:06:04.1","speaker":"Ryan Graves","text":"Ryan Graves considers Russian or Chinese technology a possible explanation for the observed Unidentified Aerial Phenomena (UAP).","quote":"Bill Whitaker: Could it be Russian or Chinese technology? Ryan Graves: I don't see why not."},{"id":"096c4d12-43a3-4ff8-ad12-797a223f21b2","type":"opinion","location":"00:06:07.0-00:06:18.5","speaker":"Ryan Graves","text":"Ryan Graves is worried about the Unidentified Aerial Phenomena (UAP) because if they were tactical jets from another country, it would be a massive issue, but because they look slightly different, the problem is being ignored.","quote":"I am worried, frankly. You know, if these were tactical jets from another country that were hanging out up there, it would be a massive issue. But because it looks slightly different, we're n
