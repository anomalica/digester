ernment has ignored it, at least publicly, since closing its Project Blue Book investigation on 1969."},{"id":"7e86f46a-4fb4-4093-bc32-b61806733e7d","type":"administrative","location":"00:06:30.3-00:06:40.8","speaker":"Whitaker, Bill","text":"An incident off Southern California in 2004 was documented by radar, by camera, and four naval aviators.","quote":"But that began to change after an incident off Southern California in 2004, which was documented by radar, by camera, and four naval aviators."},{"id":"cea4523a-ffe7-461e-9cd1-5c1c9aae1959","type":"administrative","location":"00:06:40.8-00:06:57.3","speaker":"Whitaker, Bill","text":"David Fravor is a graduate of the Top Gun Naval Flight School and was commander of the F/A-18 squadron on the USS Nimitz.","quote":"David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz"},{"id":"b8280d07-e763-47d6-8648-f51c362ce9ab","type":"administrative","location":"00:06:40.8-00:06:57.3","speaker":"Whitaker, Bill","text":"Alex Dietrich was flying at David Fravor's wing during the 2004 USS Nimitz UAP encounter and had never spoken publicly about the encounter before this segment.","quote":"and flying at his wing, Lieutenant Alex Dietrich, who has never spoken publicly about the encounter."},{"id":"574230cb-b000-4a66-824f-6a7f98b7963b","type":"testimony","location":"00:07:01.1-00:07:14.4","speaker":"Dietrich, Alex","text":"Alex Dietrich felt a responsibility to share what she could about the 2004 USS Nimitz UAP encounter because she was in a government aircraft on the clock and the information is unclassified.","quote":"Because I was in a government aircraft, because I was on the clock, and so I feel a responsibility to share what I can, and it is unclassified."},{"id":"57ae0663-0508-437e-a851-f8cc38cb6d1a","type":"administrative","location":"00:07:14.4-00:07:23.1","speaker":"Whitaker, Bill","text":"In November 2004, the USS Nimitz Carrier Strike Group was training approximately 160 kilometres southwest of San Diego.","quote":"It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego."},{"id":"c92a5164-59cf-4baa-a91b-de2d2302ec48","type":"observation","location":"00:07:23.1-00:07:39.3","speaker":"Whitaker, Bill","text":"For a week before 2004-11-14, the advanced new radar on the USS Princeton had detected multiple Anomalous Aerial Vehicles (AAV) over the horizon, descending approximately 24,000 metres in less than a second.","quote":"the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 80,000 feet in less than a second."},{"id":"3f48e21a-584e-4ff0-ad46-ed21ae6d33fb","type":"administrative","location":"00:07:39.3-00:07:47.8","speaker":"Whitaker, Bill","text":"On 2004-11-14, David Fravor and Alex Dietrich, each with a weapons system officer in the backseat, were diverted to investigate the Anomalous Aerial Vehicles (AAV).","quote":"On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate."},{"id":"22ad0e46-eb15-4a75-8550-af4a5db3eafa","type":"observation","location":"00:07:47.8-00:07:55.9","speaker":"Whitaker, Bill","text":"David Fravor and Alex Dietrich found an area of roiling white water the size of a 737 in an otherwise calm blue sea during the 2004 USS Nimitz UAP encounter.","quote":"They found an area of roiling white water the size of a 737 in an otherwise calm blue sea."},{"id":"d004e00b-84d4-44ea-a269-d033681b63b9","type":"observation","location":"00:07:55.9-00:08:12.3","speaker":"Fravor, David","text":"During the 2004 USS Nimitz UAP encounter, David Fravor and his crew saw a little white tic-tac-looking object moving above the whitewater area.","quote":"And we saw this little white tic-tac-looking object. And it's just kind of moving above the whitewater area."},{"id":"d2dd657f-68f0-4c8d-b5b1-83ec9f157420","type":"observation","location":"00:08:12.3-00:08:17.9","speaker":"Whitaker, Bill","text":"During the 2004 USS Nimitz UAP encounter, Alex Dietrich circled above while David Fravor went in for a closer look, spiralling down.","quote":"As Dietrich circled above, Fravor went in for a closer look. Sort of spiraling down?"},{"id":"003892ae-9537-4484-8f7e-3d4916b4f648","type":"observation","location":"00:08:17.9-00:08:27.0","speaker":"Fravor, David","text":"During the 2004 USS Nimitz UAP encounter, the tic-tac object turned abruptly and started mirroring David Fravor's descending manoeuvre by climbing as he came down.","quote":"The tic-tac's still pointing north-south. It goes and just turns abruptly and starts mirroring me. So as I'm coming down, it starts coming up."},{"id":"9cda56d7-3415-464d-9f67-c72bdd2bcc79","type":"opinion","location":"00:08:27.0-00:08:30.5","speaker":"Fravor, David","text":"David Fravor believes the tic-tac object was aware of their presence during the 2004 USS Nimitz UAP encounter.","quote":"Bill Whitaker: So it's mimicking your moves. David Fravor: Yeah, it was aware we were there."},{"id":"7bb0bc8d-4b66-4834-a853-45cc07a74555","type":"observation","location":"00:08:30.5-00:08:37.0","speaker":"Whitaker, Bill","text":"During the 2004 USS Nimitz UAP encounter, the tic-tac object was about the size of David Fravor's F/A-18, with no markings, no wings, and no exhaust plumes.","quote":"He said it was about the size of his F-18, with no markings, no wings, no exhaust plumes."},{"id":"c1894431-d85e-4d89-8b0e-5bae468b7c48","type":"observation","location":"00:08:37.0-00:08:49.4","speaker":"Fravor, David","text":"During the 2004 USS Nimitz UAP encounter, the tic-tac object disappeared when it got right in front of David Fravor, having sped off.","quote":"And when it gets right in front of me, it just disappears. ... It had sped off."},{"id":"b08566d2-cbcf-450d-a583-8e83c7bea669","type":"testimony","location":"00:08:49.4-00:09:00.9","speaker":"Dietrich, Alex","text":"During the 2004 USS Nimitz UAP encounter, Alex Dietrich tried to categorise the object as maybe a helicopter or a drone before it disappeared.","quote":"I'm going to categorize this as maybe a helicopter or maybe a drone. And when it disappeared, I mean, it was just..."},{"id":"db495765-edd4-4b82-8884-4258886e1493","type":"testimony","location":"00:09:00.9-00:09:04.2","speaker":"Dietrich, Alex","text":"The backseaters of both David Fravor and Alex Dietrich's aircraft also saw the object during the 2004 USS Nimitz UAP encounter.","quote":"Bill Whitaker: Did your back seaters see this too? Alex Dietrich: Yeah. David Fravor: Oh, yeah."},{"id":"94e9fa8c-a575-483f-b8d0-6980a03de098","type":"observation","location":"00:09:04.2-00:09:08.9","speaker":"Fravor, David","text":"There were four crew members in the airplanes literally watching the object for roughly about five minutes during the 2004 USS Nimitz UAP encounter.","quote":"There was four of us in the airplanes literally watching this thing for roughly about five minutes."},{"id":"34e94367-ade1-406e-b7f7-49257c19e080","type":"observation","location":"00:09:08.9-00:09:14.4","speaker":"Whitaker, Bill","text":"Seconds after the tic-tac object disappeared, the USS Princeton reacquired the target approximately 95 kilometres away.","quote":"Seconds later, the Princeton reacquired the target, 60 miles away."},{"id":"840a36ab-c9a5-4b71-86e2-1110f8780256","type":"observation","location":"00:09:14.4-00:09:20.8","speaker":"Whitaker, Bill","text":"Another crew managed to briefly lock onto the tic-tac object with a targeting camera before it zipped off again during the 2004 USS Nimitz UAP encounter.","quote":"Another crew managed to briefly lock onto it with a targeting camera before it zipped off again."},{"id":"de827c4c-b751-475f-b249-e117b1a13247","type":"opinion","location":"00:09:20.8-00:09:31.1","speaker":"Dietrich, Alex","text":"Alex Dietrich acknowledged that had she seen the object solo, she might not have reported it because it sounds so crazy.","quote":"I think that over beers, we've sort of said, hey, man, if I saw this solo, I don't know that I would have come back and said anything because it sounds so crazy when I say it."},{"id":"83709378-2492-4a35-aa69-347d3f17ec33","type":"testimony","location":"00:09:31.1-00:09:39.8","speaker":"Fravor, David","text":"David Fravor has been told that when he describes the 2004 USS Nimitz UAP encounter, he can sound crazy.","quote":"I've had some people tell me, you know, when you say that, you can sound crazy."},{"id":"6b7a7e1b-704f-4182-b679-c937574b043d","type":"opinion","location":"00:09:37.9-00:09:39.8","speaker":"Fravor, David","text":"David Fravor states he is not a UFO guy.","quote":"I'm not a UFO guy."},{"id":"f0106299-35bf-45be-918a-445358cecd16","type":"opinion","location":"00:09:39.8-00:09:56.5","speaker":"Fravor, David","text":"David Fravor asserts there is definitely something out there that was better than their aeroplane during the 2004 USS Nimitz UAP encounter.","quote":"There's definitely something that, I don't know who's building it, who's got the technology, who's got the brains, but there's something out there that was better than our airplane."},{"id":"9191757e-eb7c-489e-9602-aa434a9f2f61","type":"administrative","location":"00:09:56.5-00:09:58.7","speaker":"Whitaker, Bill","text":"The air crew filed reports about the 2004 USS Nimitz UAP encounter.","quote":"The air crew filed reports."},{"id":"5f08230a-18ff-46f7-9f90-80c51ffb77fb","type":"administrative","location":"00:09:58.7-00:10:13.2","speaker":"Whitaker, Bill","text":"Nothing was said or done officially about the 2004 USS Nimitz UAP encounter for five years until Luis Elizondo came across the story and investigated.","quote":"Nothing was said or done officially for five years until Lou Elizondo came across the story and investigated."},{"id":"3e7ddd5b-d4fb-4bef-8982-012c09e33ef2","type":"testimony","location":"00:10:13.2-00:10:19.1","speaker":"Elizondo, Luis","text":"Luis Elizondo states that the United States spends millions of dollars training pilots who are seeing something they cannot explain.","quote":"We spend millions of dollars in training these pilots, and they are seeing something that they can't explain."},{"id":"22319451-39e8-4976-afd8-e90a4cda395b","type":"opinion","location":"00:10:19.1-00:10:27.7","speaker":"Elizondo, Luis","text":"Luis Elizondo states that pilot observations of UAP are backed up by electro-optical data such as gun camera footage and by radar data, which he finds compelling.","quote":"that information's being backed up on electro-optical data, like gun camera footage, and by radar data. Now, to me, that's compelling."},{"id":"565b6148-268c-426c-87d8-e539e6e3a0c2","type":"administrative","location":"00:10:27.7-00:10:31.7","speaker":"Whitaker, Bill","text":"Inside the Pentagon, Luis Elizondo's findings were met with scepticism.","quote":"Inside the Pentagon, his findings were met with skepticism."},{"id":"b90709cf-1fbf-4452-b3ca-bd665e013858","type":"administrative","location":"00:10:31.7-00:10:39.5","speaker":"Whitaker, Bill","text":"The Advanced Aerospace Threat Identification Program (AATIP)'s funding was eliminated in 2012.","quote":"AATIP's funding was eliminated in 2012"},{"id":"b1488854-db0e-48f0-a90e-550bb712b3e8","type":"testimony","location":"00:10:31.7-00:10:39.5","speaker":"Elizondo, Luis","text":"Luis Elizondo states that he and a handful of others kept the AATIP mission alive after funding was eliminated in 2012.","quote":"Elizondo says he and a handful of others kept the mission alive."},{"id":"7802457b-6838-4225-ac8e-4fff69cbc1e0","type":"administrative","location":"00:10:39.5-00:10:48.8","speaker":"Whitaker, Bill","text":"Luis Elizondo quit the Pentagon in 2017 out of frustration.","quote":"frustrated, he quit the Pentagon in 2017"},{"id":"24afeb85-a5a0-4f13-b57a-c14dd537a607","type":"administrative","location":"00:10:39.5-00:10:48.8","speaker":"Whitaker, Bill","text":"Before quitting the Pentagon in 2017, Luis Elizondo got three UAP videos declassified.","quote":"not before getting these three videos declassified."},{"id":"ff32e686-1511-4d66-a4f3-5ec14777d8ce","type":"testimony","location":"00:10:48.8-00:10:57.5","speaker":"Mellon, Christopher","text":"Christopher Mellon tried to help Luis Elizondo elevate the UAP issue in the Department of Defense and get it to the Secretary of Defense.","quote":"I tried to help my colleague, Lou Elizondo, elevate the issue in the department and actually get it to the Secretary of Defense."},{"id":"3ab46532-cc60-4017-83be-05040b1835ed","type":"administrative","location":"00:10:57.5-00:11:04.3","speaker":"Whitaker, Bill","text":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Bill Clinton and George W. Bush.","quote":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush"},{"id":"dd8ac009-c181-44a3-adc7-371b6e4a4aaa","type":"administrative","location":"00:11:04.3-00:11:08.4","speaker":"Whitaker, Bill","text":"Christopher Mellon had access to top-secret government programmes.","quote":"and had access to top-secret government programs."},{"id":"4aff53fb-7f20-4dfc-9fbb-ae689ca8a28e","type":"opinion","location":"00:11:08.4-00:11:18.7","speaker":"Mellon, Christopher","text":"Christopher Mellon states with a very high degree of confidence that the UAP are not United States technology, based on the positions he held in the department and his knowledge of the process.","quote":"Bill Whitaker: We know that? Christopher Mellon: I could say that with a very high degree of confidence, in part because of the positions I held in the department, and I know the process."},{"id":"9bebff12-a2ca-4a01-8294-d21210b9329d","type":"opinion","location":"00:11:18.7-00:11:26.2","speaker":"Whitaker, Bill","text":"Christopher Mellon grew concerned that nothing was being done about UAPs.","quote":"Mellon says he grew concerned nothing was being done about UAPs"},{"id":"9a0fa3ec-571c-46fb-9dd8-66c1008adaf1","type":"administrative","location":"00:11:26.2-00:11:37.0","speaker":"Whitaker, Bill","text":"In 2017, as a private citizen, Christopher Mellon surreptitiously acquired the three Navy videos Luis Elizondo had declassified and leaked them to The New York Times.","quote":"In 2017, as a private citizen, he surreptitiously acquired the three Navy videos Elizondo had declassified and leaked them to The New York Times."},{"id":"c1075a45-bc13-4fe6-ae36-768bced3b723","type":"opinion","location":"00:11:37.0-00:11:46.1","speaker":"Mellon, Christopher","text":"Christopher Mellon considers it bizarre and unfortunate that someone like himself has to leak videos to get a national security issue like UAP on the agenda.","quote":"It's bizarre and unfortunate that someone like myself has to do something like that to get a national security issue like this on the agenda."},{"id":"216db95a-b99e-4702-bf42-26f3591c0d3e","type":"administrative","location":"00:11:46.1-00:11:57.6","speaker":"Whitaker, Bill","text":"Christopher Mellon and Luis Elizondo joined forces as civilians to tell their story to newspapers, the History Channel, and members of the United States Congress.","quote":"He joined forces with now civilian Lou Elizondo, and they started to tell their story to anybody who would listen, to newspapers, the History Channel, to members of Congress."},{"id":"016408fb-d65f-4b1f-964e-d55033d06df5","type":"testimony","location":"00:11:57.6-00:12:07.2","speaker":"Mellon, Christopher","text":"Christopher Mellon states that they understood they had to go to the public to get the public interested, then get Congress interested, to then circle back to the Defense Department to get them to start taking a look at the UAP issue.","quote":"We knew and understood that you had to go to the public, get the public interested to get Congress interested, to then circle back to the Defense Department and get them to start taking a look at it."},{"id":"9814d7d1-75a2-4fd8-8ef7-db5618fa4fe8","type":"administrative","location":"00:12:07.2-00:12:15.6","speaker":"Whitaker, Bill","text":"In August 2020, the Pentagon resurrected AATIP under the name UAP Task Force.","quote":"This past August, the Pentagon resurrected AATIP. It's now called the UAP Task Force."},{"id":"3801b8e6-07f7-4c06-9eaa-b1a1e8418362","type":"administrative","location":"00:12:15.6-00:12:20.1","speaker":"Whitaker, Bill","text":"Service members are now encouraged to report strange UAP encounters.","quote":"Service members now are encouraged to report strange encounters."},{"id":"094accd8-6ea3-4340-bd12-b703f691310d","type":"opinion","location":"00:12:20.1-00:12:26.5","speaker":"Rubio, Marco","text":"Marco Rubio states that anything that enters an airspace that is not supposed to be there is a threat.","quote":"Anything that enters an airspace that's not supposed to be there is a threat."},{"id":"b5741c78-aee7-4d5f-8005-59b2e791ebc4","type":"administrative","location":"00:12:26.5-00:12:34.0","speaker":"Whitaker, Bill","text":"After receiving classified briefings on UAPs, Senator Marco Rubio called for a detailed analysis.","quote":"After receiving classified briefings on UAPs, Senator Marco Rubio called for a detailed analysis."},{"id":"083ba305-6f1e-49f3-883a-3f71d52c3cc5","type":"administrative","location":"00:12:34.0-00:12:46.3","speaker":"Whitaker, Bill","text":"In December 2020, while still head of the United States Senate Select Committee on Intelligence, Marco Rubio asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report on UAP.","quote":"This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month."},{"id":"ebefba77-2d85-4036-a656-0f8ecb204c0b","type":"testimony","location":"00:12:46.3-00:13:06.9","speaker":"Rubio, Marco","text":"Marco Rubio states there is a stigma on Capitol Hill about the UAP topic, with some colleagues very interested and some who giggle when it is brought up.","quote":"there's a stigma on Capitol Hill. I mean, some of my colleagues are very interested in this topic and some kind of, you know, giggle when you bring it up."},{"id":"f3c6690e-6e65-4726-b544-6bf3b8063faf","type":"opinion","location":"00:13:00.8-00:13:06.9","speaker":"Rubio, Marco","text":"Marco Rubio believes the stigma should not be allowed to prevent getting an answer to the fundamental question about UAP.","quote":"But I don't think we can allow the stigma to keep us from having an answer to a very fundamental question."},{"id":"79b691a1-09de-4592-9843-bfee4342f450","type":"opinion","location":"00:13:12.2-00:13:17.3","speaker":"Rubio, Marco","text":"Marco Rubio wants the United States government to take UAP seriously and have a process to take it seriously.","quote":"I want us to take it seriously and have a process to take it seriously."},{"id":"bbf883e1-3e2b-47f5-a1ce-1912dc9c647d","type":"opinion","location":"00:13:17.3-00:13:25.9","speaker":"Rubio, Marco","text":"Marco Rubio wants a process to analyse UAP data every time it comes in, with a place where it is catalogued and constantly analysed until answers are obtained.","quote":"I want us to have a process to analyze the data. every time it comes in, that there be a place where this is cataloged and constantly analyzed until we get some answers."},{"id":"1c52842d-cb8a-4988-8ef7-878c73c72229","type":"opinion","location":"00:13:25.9-00:13:28.3","speaker":"Rubio, Marco","text":"Marco Rubio acknowledges the UAP issue may have a very simple answer, or it may not.","quote":"Maybe it has a very simple answer. Maybe it doesn't."},{"id":"285a49a2-9e77-49a4-abbe-e16304461952","type":"testimony","location":"00:13:35.4-00:13:41.7","speaker":"Dietrich, Alex","text":"Alex Dietrich felt the vulnerability of not having anything to defend themselves during the 2004 USS Nimitz UAP encounter.","quote":"I felt the vulnerability of not having anything to defend ourselves."}],"nodes":[{"id":"c44c6d01-9c88-48e6-9590-b279739538fc","type":"person","name":"Whitaker, Bill"},{"id":"824d0601-2cf2-4596-83fa-147173c94919","type":"person","name":"Elizondo, Luis"},{"id":"e5524930-56c0-4d26-801f-990fe19068a9","type":"person","name":"Reid, Harry"},{"id":"5d5fbc9c-6e01-486b-a5e7-8e080aa0a2ab","type":"person","name":"Graves, Ryan"},{"id":"6a01f461-ce63-406a-9501-84b9e360dc15","type":"person","name":"Fravor, David"},{"id":"a33eb375-96cf-4f4b-afe8-9133b66e9041","type":"person","name":"Dietrich, Alex"},{"id":"55ff8bea-f926-472a-94cc-32fcd3f9eb58","type":"person","name":"Mellon, Christopher"},{"id":"3f9963f4-be61-418c-b462-89fc55473616","type":"person","name":"Rubio, Marco"},{"id":"5f638557-8217-47cc-8b26-dbfe1db21f2b","type":"person","name":"Clinton, Bill"},{"id":"4645123b-e2cb-4775-b4d4-141dbc550e0a","type":"person","name":"Bush, George W."},{"id":"c95055d7-f0c6-45e9-a95c-d27ac7ed8efd","type":"organisation","name":"60 Minutes"},{"id":"8b2edd2e-842b-43b8-ac17-d4a2d6eaeb42","type":"organisation","name":"United States Congress"},{"id":"7c713f27-24e4-44f7-a621-7182c017c130","type":"organisation","name":"United States Senate"},{"id":"56740010-7f77-425c-8d5a-aaf1378aa4a7","type":"organisation","name":"United States Senate Select Committee on Intelligence"},{"id":"e3a9dc97-4d9a-4318-8853-f42d4ff06ca0","type":"organisation","name":"Department of Defense (DoD)"},{"id":"f9afde6a-348f-462c-aeaa-fdbddc9021d5","type":"organisation","name":"Office of the Director of National Intelligence (ODNI)"},{"id":"86155304-cb7b-4aaa-aac8-bad28e327e1e","type":"organisation","name":"United States Navy"},{"id":"b643aa41-c0da-40c3-955f-1a248e0bfe07","type":"organisation","name":"Top Gun Naval Flight School"},{"id":"a3549ad0-a018-456a-9f38-9bddff681822","type":"organisation","name":"The New York Times"},{"id":"cbac6f78-f79d-491f-80de-08d15e5993e4","type":"organisation","name":"History Channel"},{"id":"468fb164-1483-45fa-9ee4-04c93cd47b64","type":"project","name":"Advanced Aerospace Threat Identification Program (AATIP)"},{"id":"1d10f90c-6ea6-4e44-b21e-984a7d3a0f5d","type":"project","name":"Project Blue Book"},{"id":"b3b2e2bf-f740-4186-863d-0c46bf9b1157","type":"project","name":"UAP Task Force"},{"id":"afbb508c-7e58-4dff-adb4-5e1c8b30d8b5","type":"place","name":"USA, Virginia, Virginia Beach"},{"id":"dc255305-4e27-4a05-acbf-2c0f29394940","type":"place","name":"USA, Florida, Jacksonville"},{"id":"7ee5c623-02c7-4e12-98c1-3272adfa7bd2","type":"place","name":"USA, California, San Diego"},{"id":"eb607771-ed2e-4617-a480-d939231542aa","type":"place","name":"USA, Cuba, Guantanamo Bay"},{"id":"de3c0e53-e254-4af8-92e4-05d07fc5b3e8","type":"event","name":"2004 USS Nimitz UAP encounter"},{"id":"80ed6823-7fcd-4d25-b538-e22decc0fe0e","type":"event","name":"2015 Atlantic coast UAP sightings"},{"id":"c2fd1d50-75df-47ac-be54-475f24ce7338","type":"event","name":"2019 Virginia Beach UAP photographs"},{"id":"ca5bedc6-615f-4b22-b99f-27827ff2e317","type":"object","name":"USS Nimitz"},{"id":"948630f2-c39e-4fcd-ab31-74e6465bb09a","type":"object","name":"USS Princeton"},{"id":"704df6a3-5eb4-4f21-8911-cc5ede40c9a2","type":"object","name":"F/A-18"},{"id":"17d91952-59f8-4f36-9e42-e56c043cd093","type":"object","name":"Carrier Strike Group 11 (CSG-11)"},{"id":"283a0ab7-a817-4f47-980e-c27ca40e3da8","type":"topic","name":"Unidentified Aerial Phenomena (UAP)"},{"id":"6c119648-0de9-4ad3-8d9d-828ad39f9b72","type":"topic","name":"Unidentified Flying Object (UFO)"},{"id":"1a910037-d1e7-4694-9b9b-38b6740c9b39","type":"topic","name":"Anomalous Aerial Vehicle (AAV)"},{"id":"790be1b1-a763-46a4-9425-664a77571ab5","type":"document","name":"Navy pilots describe encounters with UFOs (60 Minutes segment)"}]},{"id":"z-ai_glm-5","name":"z-ai / glm-5","errata":null,"claims":[{"id":"39b412b9-70fa-4f29-afd4-8f5e0fe9782c","type":"observation","location":"00:00:07.6-00:00:14.9","speaker":"Whitaker, Bill","text":"The United States Government has grudgingly acknowledged Unidentified Aerial Phenomena (UAP) after decades of public denial.","quote":"It's the story of the U.S. government's grudging acknowledgement of Unidentified Aerial Phenomena, UAP, more commonly known as ufos after decades of public denial"},{"id":"2142860b-91fc-483b-9bf0-e41fa050cacc","type":"observation","location":"00:00:14.9-00:00:17.0","speaker":"Whitaker, Bill","text":"The United States Department of Defense (DoD) admits there is something out there.","quote":"the pentagon now admits there's something out there"},{"id":"0ab8be4b-efdc-47ec-84a6-a6718f3133ce","type":"administrative","location":"00:00:21.0-00:00:28.0","speaker":"Whitaker, Bill","text":"The United States Senate Select Committee on Intelligence has ordered the Director of National Intelligence and the Secretary of Defense to deliver a report on mysterious sightings by 2021-06.","quote":"the intelligence committee has ordered the director of national intelligence and the secretary of defense to deliver a report on the mysterious sightings by next month"},{"id":"0b8e9a40-16c8-4b64-a641-e0c04252c668","type":"testimony","location":"00:00:44.4-00:00:59.6","speaker":"Elizondo, Luis","text":"The United States Government has officially stated for the record that Unidentified Aerial Phenomena (UAP) are real.","quote":"Bill Whitaker: So what you're telling me is that UFOs, unidentified flying objects, are real. Luis Elizondo: Bill, I think we're beyond that already. The government has already stated for the record that they're real. I'm not telling you that. The United States government is telling you that."},{"id":"ac307e98-a3e3-4ae7-b347-effe531f7c14","type":"biographical","location":"00:01:02.4-00:01:11.5","speaker":"Whitaker, Bill","text":"Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo Bay.","quote":"Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo."},{"id":"504741f4-f076-4808-ac61-7f8a71c6e375","type":"biographical","location":"00:01:11.5-00:01:15.6","speaker":"Whitaker, Bill","text":"Luis Elizondo had not given Unidentified Flying Objects (UFO) a second thought until 2008.","quote":"He hadn't given UFOs a second thought until 2008."},{"id":"9dab6e0e-2576-4511-ae90-cbc33a9fe061","type":"biographical","location":"00:01:15.6-00:01:22.0","speaker":"Whitaker, Bill","text":"In 2008, Luis Elizondo was asked to join the Advanced Aerospace Threat Identification Program (AATIP) at the Pentagon.","quote":"That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP."},{"id":"d171a249-7138-428e-b889-130c71cc0429","type":"testimony","location":"00:01:24.1-00:01:34.3","speaker":"Elizondo, Luis","text":"The mission of the Advanced Aerospace Threat Identification Program (AATIP) was to collect and analyse information involving Anomalous Aerial Vehicles (AAV).","quote":"The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs. We call them UAPs."},{"id":"4869dd7e-abcc-4c28-8104-0de7ce62803c","type":"opinion","location":"00:01:40.0-00:01:45.6","speaker":"Elizondo, Luis","text":"Luis Elizondo considers the phenomena he investigated to be real.","quote":"Look, Bill, I'm not telling you that it doesn't sound wacky. What I'm telling you is real."},{"id":"05900ea5-bc7c-4cb4-a6ab-ee3383288a08","type":"administrative","location":"00:01:50.3-00:02:01.6","speaker":"Whitaker, Bill","text":"The Advanced Aerospace Threat Identification Program (AATIP) was part of a $22 million programme sponsored by Harry Reid to investigate Unidentified Flying Objects (UFO).","quote":"Buried away in the Pentagon, AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs."},{"id":"8ae6257d-fd3e-462d-935c-2d74c95feccf","type":"biographical","location":"00:02:01.6-00:02:05.0","speaker":"Whitaker, Bill","text":"Luis Elizondo took over the Advanced Aerospace Threat Identification Program (AATIP) in 2010.","quote":"When Elizondo took over in 2010"},{"id":"5b9beb7c-1532-4a3b-bf1a-33c405ada4da","type":"biographical","location":"00:02:05.0-00:02:10.8","speaker":"Whitaker, Bill","text":"Luis Elizondo focused on the national security implications of Unidentified Aerial Phenomena (UAP) documented by United States service members.","quote":"he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members."},{"id":"f951447d-cff6-456a-8f37-51470a8e9882","type":"testimony","location":"00:02:12.6-00:02:16.0","speaker":"Elizondo, Luis","text":"The Unidentified Aerial Phenomena (UAP) observed can withstand 600 to 700 G-forces.","quote":"Imagine a technology that can do 600 to 700 G-forces"},{"id":"7859b9cb-aab1-4d62-8648-e1a14a87daa5","type":"testimony","location":"00:02:16.0-00:02:19.0","speaker":"Elizondo, Luis","text":"The Unidentified Aerial Phenomena (UAP) observed can fly at approximately 21,000 kilometres per hour.","quote":"that can fly at 13,000 miles an hour"},{"id":"d08aa0fc-4261-423f-b140-19065ef43b1c","type":"testimony","location":"00:02:19.0-00:02:21.0","speaker":"Elizondo, Luis","text":"The Unidentified Aerial Phenomena (UAP) observed can evade radar.","quote":"that can evade radar"},{"id":"6a0d8718-c036-46d5-8afe-8454db9f2f2c","type":"testimony","location":"00:02:21.0-00:02:25.0","speaker":"Elizondo, Luis","text":"The Unidentified Aerial Phenomena (UAP) observed can fly through air and water and possibly space.","quote":"and that can fly through air and water and possibly space"},{"id":"73f3b9ab-9179-4069-858a-50bbc0ac17ab","type":"testimony","location":"00:02:25.0-00:02:31.0","speaker":"Elizondo, Luis","text":"The Unidentified Aerial Phenomena (UAP) observed have no obvious signs of propulsion, no wings, and no control surfaces.","quote":"and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces"},{"id":"120ee3d3-d4d8-48c3-a6aa-919655dd12b5","type":"testimony","location":"00:02:31.0-00:02:35.2","speaker":"Elizondo, Luis","text":"The Unidentified Aerial Phenomena (UAP) observed can defy the natural effects of Earth's gravity.","quote":"and yet still can defy the natural effects of Earth's gravity."},{"id":"557e6eee-5ab2-4d04-b8eb-f549797984f8","type":"testimony","location":"00:02:37.0-00:02:47.7","speaker":"Whitaker, Bill","text":"The Advanced Aerospace Threat Identification Program (AATIP) was a loose-knit mix of scientists, electro-optical engineers, avionics experts, and intelligence experts, often working part-time.","quote":"Elizondo tells us AATIP was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time."},{"id":"cb7f7334-f118-406e-88fc-cc369e93fe63","type":"observation","location":"00:02:57.7-00:03:02.1","speaker":"Whitaker, Bill","text":"A United States Navy aircrew struggled to lock onto a fast-moving object off the United States Atlantic coast in 2015.","quote":"A Navy aircrew struggles to lock onto a fast-moving object off the U.S. Atlantic coast in 2015."},{"id":"58ff2da2-aab1-46a3-9d6a-e448751d7c61","type":"observation","location":"00:03:07.3-00:03:13.0","speaker":"Whitaker, Bill","text":"The United States Department of Defense (DoD) admits it does not know what the objects in the released images are.","quote":"Recently released images may not convince UFO skeptics, but the Pentagon admits it doesn't know what in the world this is, or this, or this."},{"id":"e8694fee-837e-4551-888c-20de8daeafa3","type":"opinion","location":"00:03:30.4-00:03:37.4","speaker":"Elizondo, Luis","text":"In some cases there are simple explanations for what people are witnessing, but there are some that are not.","quote":"In some cases, there are simple explanations for what people are witnessing, but there are some that that are not."},{"id":"712bb666-f789-43c8-97ab-d0e8870c4305","type":"testimony","location":"00:03:38.6-00:03:46.0","speaker":"Elizondo, Luis","text":"The Advanced Aerospace Threat Identification Program (AATIP) conducted due diligence to determine if sightings were some sort of new Chinese cruise missile technology.","quote":"We're going through our due diligence. Is it some sort of new type of cruise missile technology that China has developed?"},{"id":"2015964f-b2b9-4649-a228-511f98a1d61e","type":"testimony","location":"00:03:46.0-00:03:52.6","speaker":"Elizondo, Luis","text":"The Advanced Aerospace Threat Identification Program (AATIP) conducted due diligence to determine if sightings were some sort of high-altitude reconnaissance balloon.","quote":"Is it some sort of high-altitude balloon that's conducting reconnaissance?"},{"id":"28645495-b55f-4bd2-b4ea-1cf7721e89b5","type":"opinion","location":"00:03:52.6-00:04:02.0","speaker":"Elizondo, Luis","text":"When all alternative explanations are exhausted and an object remains in United States airspace and is real, it becomes compelling and problematic.","quote":"Ultimately, when you have exhausted all those what-ifs and you're still left with the fact that this is in our airspace and it's real, that's when it becomes compelling and that's when it becomes problematic."},{"id":"4ad87026-3551-4ab0-a803-cefed9c314fa","type":"opinion","location":"00:04:06.2-00:04:12.9","speaker":"Whitaker, Bill","text":"Ryan Graves considers whatever is out there to be a security risk.","quote":"Former Navy pilot Lieutenant Ryan Graves calls whatever is out there a security risk."},{"id":"09ff075d-3702-473f-8220-dc12a7e59da2","type":"testimony","location":"00:04:12.9-00:04:23.0","speaker":"Whitaker, Bill","text":"Ryan Graves's F/A-18 squadron began seeing Unidentified Aerial Phenomena (UAP) hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar.","quote":"He told us his F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar"},{"id":"f7389cd4-cc6f-424a-890e-43f76c432379","type":"observation","location":"00:04:23.0-00:04:29.7","speaker":"Whitaker, Bill","text":"The updated radar on the F/A-18 made it possible to zero in with infrared targeting cameras.","quote":"making it possible to zero in with infrared targeting cameras."},{"id":"fb02527b-96a6-45bc-bf55-bef8a87364a6","type":"opinion","location":"00:04:29.7-00:04:37.1","speaker":"Graves, Ryan","text":"The dual radar-and-infrared detection of Unidentified Aerial Phenomena (UAP) is hard to spoof.","quote":"Bill Whitaker: So you're seeing it both with the radar and with the infrared, and that tells you that there is something out there. Ryan Graves: Pretty hard to spoof that."},{"id":"440151ac-dc13-4396-a435-e1ad7f91e610","type":"observation","location":"00:04:38.6-00:04:43.0","speaker":"Whitaker, Bill","text":"Photographs of Unidentified Aerial Phenomena (UAP) were taken in 2019 in the same area off Virginia Beach.","quote":"These photographs were taken in 2019 in the same area."},{"id":"cc013e3c-2c81-4ae0-b60c-602ff1c7f3ea","type":"observation","location":"00:04:43.0-00:04:48.2","speaker":"Whitaker, Bill","text":"The United States Department of Defense (DoD) confirms the 2019 photographs are images of objects it cannot identify.","quote":"The Pentagon confirms these are images of objects it can't identify."},{"id":"fe1b6b50-cfe1-4c2d-a655-59ead50bdee3","type":"testimony","location":"00:04:48.2-00:05:02.5","speaker":"Graves, Ryan","text":"Pilots training off the Atlantic coast see Unidentified Aerial Phenomena (UAP) every day for at least a couple of years.","quote":"Bill Whitaker: Lieutenant Graves told us pilots training off the Atlantic coast see things like that all the time. Ryan Graves: Every day. Every day for at least a couple of years."},{"id":"36f4b60f-5d9d-4e74-b6be-1bb355295883","type":"observation","location":"00:05:01.2-00:05:04.3","speaker":"Graves, Ryan","text":"Ryan Graves observed no exhaust plume on the Unidentified Aerial Phenomena (UAP).","quote":"You know, I don't see an exhaust plume."},{"id":"72dd420e-c7c5-4dac-a4df-8b09c0341ce3","type":"observation","location":"00:05:04.3-00:05:12.8","speaker":"Whitaker, Bill","text":"A targeting camera captured footage of an Unidentified Aerial Phenomena (UAP) off the coast of Jacksonville, Florida in 2015 by members of Ryan Graves's squadron.","quote":"including this one, off the coast of Jacksonville, Florida in 2015, captured on a targeting camera by members of Graves' squadron."},{"id":"343532d5-ae4d-4cac-8ace-80e66081d2a1","type":"observation","location":"00:05:12.8-00:05:17.1","speaker":null,"text":"During the 2015 Jacksonville UAP incident, the Unidentified Aerial Phenomena (UAP) was rotating.","quote":"Look at that thing! It's rotating."},{"id":"bbfc64d9-0e13-420d-8bbe-2308a00e4982","type":"observation","location":"00:05:17.1-00:05:21.6","speaker":null,"text":"During the 2015 Jacksonville UAP incident, the Unidentified Aerial Phenomena (UAP) were going against the wind.","quote":"They're all going against the wind."},{"id":"65906797-bda4-4d1c-b6f5-18ce171f3bf4","type":"measurement","location":"00:05:21.6-00:05:23.8","speaker":null,"text":"During the 2015 Jacksonville UAP incident, the wind was approximately 220 kilometres per hour to the west.","quote":"The wind's 120 knots far west."},{"id":"ce877521-d162-418c-8e6c-3c9a3bd6fc63","type":"opinion","location":"00:05:25.4-00:05:32.0","speaker":"Graves, Ryan","text":"The aircrew during the 2015 Jacksonville UAP incident seemed to break character and were amazed at what they were seeing.","quote":"Bill Whitaker: You can sort of hear the surprise in their voices. Ryan Graves: You certainly can. They seem to have broke character a bit, and were just kind of amazed at what they were seeing."},{"id":"ea72940d-6405-4622-a19f-076117d7f32a","type":"opinion","location":"00:05:33.2-00:05:42.5","speaker":"Graves, Ryan","text":"The 2015 Jacksonville UAP incident is difficult to explain due to the rotation, high altitudes, and propulsion observed.","quote":"Bill Whitaker: What do you think when you see something like this? Ryan Graves: This is a difficult one to explain. You have rotation, you have high altitudes, you have propulsion, right?"},{"id":"80f04c26-c803-48a7-a04d-93233ea5c8cb","type":"opinion","location":"00:05:42.5-00:05:42.8","speaker":"Graves, Ryan","text":"Ryan Graves does not know what the Unidentified Aerial Phenomena (UAP) are.","quote":"I don't know. I don't know what it is, frankly."},{"id":"bb02a9cb-e26e-44d5-b050-72ebbbd552e5","type":"testimony","location":"00:05:44.9-00:05:50.0","speaker":"Whitaker, Bill","text":"Pilots speculate that the Unidentified Aerial Phenomena (UAP) are one of three things: secret United States technology, an adversary spy vehicle, or something otherworldly.","quote":"He told us pilots speculate they are one of three things, secret U.S. technology, an adversary spy vehicle, or something otherworldy."},{"id":"e7a5011f-5ff0-44e2-a2e5-fbe5ee1c13e9","type":"opinion","location":"00:05:56.0-00:05:58.0","speaker":"Graves, Ryan","text":"Ryan Graves considers the highest probability to be that the Unidentified Aerial Phenomena (UAP) are a threat observation programme.","quote":"I'd say, you know, the highest probability is it's a threat observation program."},{"id":"c5246de4-c662-488e-a825-6794e1e31d7f","type":"opinion","location":"00:06:00.5-00:06:04.1","speaker":"Graves, Ryan","text":"Ryan Graves considers Russian or Chinese technology to be a possible explanation for the observed Unidentified Aerial Phenomena (UAP).","quote":"Bill Whitaker: Could it be Russian or Chinese technology? Ryan Graves: I don't see why not."},{"id":"6f9fbcca-b95c-467a-9647-87cb16ecf57f","type":"opinion","location":"00:06:05.4-00:06:07.0","speaker":"Graves, Ryan","text":"Ryan Graves is worried about the Unidentified Aerial Phenomena (UAP) observations.","quote":"Bill Whitaker: Are you alarmed? Ryan Graves: I am worried, frankly."},{"id":"e23e9b4d-39ad-4c8e-9e63-c25884e8eccf","type":"opinion","location":"00:06:07.0-00:06:13.6","speaker":"Graves, Ryan","text":"If tactical jets from another country were hanging out in United States airspace, it would be a massive issue.","quote":"You know, if these were tactical jets from another country that were hanging out up there, it would be a massive issue."},{"id":"3f0c2900-49c9-4260-bca7-c47234bd6610","type":"opinion","location":"00:06:13.6-00:06:18.5","speaker":"Graves, Ryan","text":"The Unidentified Aerial Phenomena (UAP) are being ignored because they look slightly different, even though they are out there watching United States forces every day.","quote":"But because it looks slightly different, we're not willing to actually look at the problem in the face. We're happy to just ignore the fact that these are out there watching us every day."},{"id":"9644c5f7-cf6f-4014-ab7c-27f12ab60851","type":"administrative","location":"00:06:23.4-00:06:30.3","speaker":"Whitaker, Bill","text":"The United States Government ignored Unidentified Flying Objects (UFO) publicly since closing Project Blue Book in 1969.","quote":"The government has ignored it, at least publicly, since closing its Project Blue Book investigation in 1969."},{"id":"36f53c90-dcb2-4ddd-9fd4-c9fe48488940","type":"observation","location":"00:06:30.3-00:06:35.0","speaker":"Whitaker, Bill","text":"The change in government attention began after an incident off Southern California in 2004.","quote":"But that began to change after an incident off Southern California in 2004"},{"id":"e07f40ea-8876-4390-823e-f915320413e8","type":"observation","location":"00:06:35.0-00:06:40.8","speaker":"Whitaker, Bill","text":"The 2004 USS Nimitz UAP encounter was documented by radar, camera, and four naval aviators.","quote":"which was documented by radar, by camera, and four naval aviators."},{"id":"62c1731d-e56d-4add-80f4-06cda08b2837","type":"biographical","location":"00:06:40.8-00:06:50.0","speaker":"Whitaker, Bill","text":"David Fravor is a graduate of the Top Gun Naval Flight School and was commander of the F/A-18 squadron on the USS Nimitz.","quote":"David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz"},{"id":"5b47cc35-de19-4f8a-9d24-5c2fe319bc23","type":"biographical","location":"00:06:50.0-00:06:54.0","speaker":"Whitaker, Bill","text":"Alex Dietrich was flying at David Fravor's wing during the 2004 USS Nimitz UAP encounter.","quote":"and flying at his wing, Lieutenant Alex Dietrich"},{"id":"4349e463-3084-4c8a-a9d5-f8f892b0c27b","type":"biographical","location":"00:06:54.0-00:06:57.3","speaker":"Whitaker, Bill","text":"Alex Dietrich had never spoken publicly about the 2004 USS Nimitz UAP encounter before this interview.","quote":"who has never spoken publicly about the encounter."},{"id":"a6064328-cd7f-40d2-8d41-b633d5af553b","type":"opinion","location":"00:06:57.3-00:07:01.1","speaker":"Dietrich, Alex","text":"Alex Dietrich never wanted to be on national television.","quote":"I never wanted to be on national TV, no offense."},{"id":"7700be5e-d6ef-4324-91d7-f0d01c4278ce","type":"opinion","location":"00:07:01.1-00:07:10.0","speaker":"Dietrich, Alex","text":"Alex Dietrich feels a responsibility to share what she can because she was in a government aircraft and on the clock during the 2004 USS Nimitz UAP encounter.","quote":"Because I was in a government aircraft, because I was on the clock, and so I feel a responsibility to share what I can"},{"id":"ccdc6f67-ff2b-4705-b923-c2c35578781e","type":"administrative","location":"00:07:10.0-00:07:14.4","speaker":"Dietrich, Alex","text":"The information Alex Dietrich shares about the 2004 USS Nimitz UAP encounter is unclassified.","quote":"and it is unclassified."},{"id":"14c1b2bd-71df-4dba-82f0-97251579be84","type":"observation","location":"00:07:14.4-00:07:23.1","speaker":"Whitaker, Bill","text":"In 2004-11, the USS Nimitz Carrier Strike Group was training approximately 160 kilometres southwest of San Diego.","quote":"It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego."},{"id":"4b87d9b7-d636-4af1-bcd9-4f62c7d1fbb2","type":"observation","location":"00:07:23.1-00:07:31.0","speaker":"Whitaker, Bill","text":"For a week before 2004-11-14, the advanced new radar on the USS Princeton detected multiple Anomalous Aerial Vehicles (AAV) over the horizon.","quote":"For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon"},{"id":"71f2c010-c2ad-411c-a0b9-12525ecbd42e","type":"measurement","location":"00:07:31.0-00:07:39.3","speaker":"Whitaker, Bill","text":"The Anomalous Aerial Vehicles (AAV) detected by the USS Princeton radar were descending approximately 24,000 metres in less than a second.","quote":"descending 80,000 feet in less than a second."},{"id":"59b11619-eace-407f-9724-7350fa6a368e","type":"observation","location":"00:07:39.3-00:07:47.8","speaker":"Whitaker, Bill","text":"On 2004-11-14, David Fravor and Alex Dietrich, each with a weapons system officer in the backseat, were diverted to investigate the Anomalous Aerial Vehicles (AAV).","quote":"On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate."},{"id":"b047f12d-fa87-4fb8-a239-195f2b56309d","type":"observation","location":"00:07:47.8-00:07:55.9","speaker":"Whitaker, Bill","text":"David Fravor and Alex Dietrich found an area of roiling white water the size of a Boeing 737 in an otherwise calm blue sea during the 2004 USS Nimitz UAP encounter.","quote":"They found an area of roiling white water the size of a 737 in an otherwise calm blue sea."},{"id":"ae9082de-186d-4bcc-8cb0-56d7766f2d2c","type":"observation","location":"00:07:55.9-00:08:12.3","speaker":"Fravor, David","text":"David Fravor saw a little white tic-tac-looking object moving above the whitewater area during the 2004 USS Nimitz UAP encounter.","quote":"And we saw this little white tic-tac-looking object. And it's just kind of moving above the whitewater area."},{"id":"030d3b57-3f07-458c-98d3-03246ed3a250","type":"observation","location":"00:08:12.3-00:08:17.0","speaker":"Whitaker, Bill","text":"During the 2004 USS Nimitz UAP encounter, Alex Dietrich circled above while David Fravor went in for a closer look.","quote":"As Dietrich circled above, Fravor went in for a closer look."},{"id":"1472b420-1c6e-4826-bcb4-53bc665f31c3","type":"observation","location":"00:08:17.0-00:08:27.0","speaker":"Fravor, David","text":"During the 2004 USS Nimitz UAP encounter, the object was pointing north-south and then turned abruptly and started mirroring David Fravor's movements.","quote":"The tic-tac's still pointing north-south. It goes and just turns abruptly and starts mirroring me. So as I'm coming down, it starts coming up."},{"id":"62a52999-49ab-4cb7-ad63-cf7d3516538c","type":"opinion","location":"00:08:27.0-00:08:28.9","speaker":"Fravor, David","text":"David Fravor believes the object during the 2004 USS Nimitz UAP encounter was aware they were there.","quote":"Bill Whitaker: So it's mimicking your moves. David Fravor: Yeah, it was aware we were there."},{"id":"f3a26e0d-640b-4e6e-adb3-c78c2ea35b28","type":"testimony","location":"00:08:30.5-00:08:37.0","speaker":"Whitaker, Bill","text":"The object observed during the 2004 USS Nimitz UAP encounter was about the size of an F/A-18, with no markings, no wings, and no exhaust plumes.","quote":"He said it was about the size of his F-18, with no markings, no wings, no exhaust plumes."},{"id":"e047d341-728e-40f6-bef8-89107ed31323","type":"observation","location":"00:08:37.0-00:08:47.8","speaker":"Fravor, David","text":"When David Fravor tried to get close to the object during the 2004 USS Nimitz UAP encounter, it disappeared by speeding off.","quote":"I want to see how close I can get. So I go like this, and it's climbing still. And when it gets right in front of me, it just disappears... Disappears, like gone. It had sped off."},{"id":"58b6103e-650c-4e8c-ba12-631101dad133","type":"opinion","location":"00:08:49.4-00:09:00.9","speaker":"Dietrich, Alex","text":"Alex Dietrich's mind tried to make sense of the object during the 2004 USS Nimitz UAP encounter by categorising it as maybe a helicopter or a drone.","quote":"So your mind tries to make sense of it. I'm going to categorize this as maybe a helicopter or maybe a drone."},{"id":"586bd051-cf16-40dc-939b-0ef435b365bd","type":"observation","location":"00:09:00.9-00:09:04.2","speaker":"Dietrich, Alex","text":"The back seaters in both aircraft also saw the object during the 2004 USS Nimitz UAP encounter.","quote":"Bill Whitaker: Did your back seaters see this too? Alex Dietrich: Yeah. David Fravor: Oh, yeah."},{"id":"18eb50ec-dcf6-47be-afcf-510a258b9940","type":"observation","location":"00:09:04.2-00:09:08.9","speaker":"Fravor, David","text":"Four aviators in the aircraft watched the object during the 2004 USS Nimitz UAP encounter for roughly five minutes.","quote":"There was four of us in the airplanes literally watching this thing for roughly about five minutes."},{"id":"a3bb002b-afad-4d51-bba1-9d50724fc06a","type":"observation","location":"00:09:08.9-00:09:14.4","speaker":"Whitaker, Bill","text":"Seconds after the object disappeared, the USS Princeton reacquired the target approximately 97 kilometres away.","quote":"Seconds later, the Princeton reacquired the target, 60 miles away."},{"id":"0560f9ff-7aee-48e4-ba6b-29d339479f25","type":"observation","location":"00:09:14.4-00:09:20.8","speaker":"Whitaker, Bill","text":"Another crew managed to briefly lock onto the object with a targeting camera before it sped off again during the 2004 USS Nimitz UAP encounter.","quote":"Another crew managed to briefly lock onto it with a targeting camera before it zipped off again."},{"id":"b0b18f35-e290-4a10-909b-5a3b4314f1e3","type":"opinion","location":"00:09:20.8-00:09:31.1","speaker":"Dietrich, Alex","text":"Alex Dietrich notes that if she had seen the object solo during the 2004 USS Nimitz UAP encounter, she might not have reported it because it sounds so crazy.","quote":"You know, I think that over beers, we've sort of said, hey, man, if I saw this solo, I don't know that I would have come back and said anything because it sounds so crazy when I say it."},{"id":"1307bb73-4f8f-4c81-a27f-ce5a1b5b0e79","type":"opinion","location":"00:09:31.1-00:09:37.4","speaker":"Fravor, David","text":"David Fravor understands the reaction that saying what he saw sounds crazy.","quote":"Bill Whitaker: You understand that reaction? David Fravor: I do. I've had some people tell me, you know, when you say that, you can sound crazy."},{"id":"d9e8b05e-53fc-4cda-a726-c43bfbc1182c","type":"opinion","location":"00:09:37.4-00:09:39.8","speaker":"Fravor, David","text":"David Fravor is not a Unidentified Flying Object (UFO) enthusiast.","quote":"I'll be honest. I'm not a UFO guy."},{"id":"593371b9-2f9f-4dda-a44d-2550a4d3de81","type":"opinion","location":"00:09:39.8-00:09:55.0","speaker":"Fravor, David","text":"David Fravor confirms there is definitely something out there that was better than the United States airplane.","quote":"There's definitely something that, I don't know who's building it, who's got the technology, who's got the brains, but there's something out there that was better than our airplane."},{"id":"f54a8eb7-afd3-4dbd-99c5-2cc5b535977b","type":"administrative","location":"00:09:56.5-00:09:58.7","speaker":"Whitaker, Bill","text":"The air crew filed reports about the 2004 USS Nimitz UAP encounter.","quote":"The air crew filed reports."},{"id":"9dd528c3-524a-49cf-b81c-d93652633d7f","type":"administrative","location":"00:09:58.7-00:10:04.2","speaker":"Whitaker, Bill","text":"Nothing was said or done officially about the 2004 USS Nimitz UAP encounter for five years.","quote":"Then, like the mysterious flying object, the Nimitz encounter disappeared. Nothing was said or done officially for five years"},{"id":"5ac93322-0745-4ccc-bc01-916199c8b6fe","type":"biographical","location":"00:10:04.2-00:10:13.2","speaker":"Whitaker, Bill","text":"Luis Elizondo came across the story of the 2004 USS Nimitz UAP encounter and investigated it after five years of official silence.","quote":"until Lou Elizondo came across the story and investigated."},{"id":"791864bd-b0fa-426d-b1d0-602bdccb4b8a","type":"testimony","location":"00:10:13.2-00:10:19.1","speaker":"Elizondo, Luis","text":"The United States Government spends millions of dollars training pilots who are seeing something they cannot explain.","quote":"We spend millions of dollars in training these pilots, and they are seeing something that they can't explain."},{"id":"52b2b576-2e3a-468d-aa4b-eb0a9412164f","type":"testimony","location":"00:10:19.1-00:10:25.3","speaker":"Elizondo, Luis","text":"The information about Unidentified Aerial Phenomena (UAP) is backed up by electro-optical data such as gun camera footage and by radar data.","quote":"Furthermore, that information's being backed up on electro-optical data, like gun camera footage, and by radar data."},{"id":"4ce2e4b5-c866-4543-8918-5719d984b52d","type":"opinion","location":"00:10:25.3-00:10:27.7","speaker":"Elizondo, Luis","text":"Luis Elizondo finds the combination of pilot observations, electro-optical data, and radar data to be compelling.","quote":"Now, to me, that's compelling."},{"id":"f2e484fb-7ca5-43b2-8cce-16fc55322329","type":"observation","location":"00:10:27.7-00:10:31.7","speaker":"Whitaker, Bill","text":"Inside the Pentagon, Luis Elizondo's findings were met with scepticism.","quote":"Inside the Pentagon, his findings were met with skepticism."},{"id":"256bbe11-f39e-4054-ab9d-fd3e9255101d","type":"administrative","location":"00:10:31.7-00:10:35.0","speaker":"Whitaker, Bill","text":"The Advanced Aerospace Threat Identification Program (AATIP)'s funding was eliminated in 2012.","quote":"AATIP's funding was eliminated in 2012"},{"id":"f176f72b-eb55-428f-8803-21eaab75a628","type":"testimony","location":"00:10:35.0-00:10:39.5","speaker":"Whitaker, Bill","text":"Luis Elizondo and a handful of others kept the Advanced Aerospace Threat Identification Program (AATIP) mission alive after funding was eliminated.","quote":"but Elizondo says he and a handful of others kept the mission alive."},{"id":"d0b6db0b-88a8-4534-9f0d-fd90d96c8796","type":"biographical","location":"00:10:39.5-00:10:44.0","speaker":"Whitaker, Bill","text":"Luis Elizondo quit the Pentagon in 2017 out of frustration.","quote":"until finally, frustrated, he quit the Pentagon in 2017"},{"id":"294c575a-649b-46fe-8670-27f9a077fd65","type":"administrative","location":"00:10:44.0-00:10:48.8","speaker":"Whitaker, Bill","text":"Before quitting, Luis Elizondo got three videos declassified.","quote":"but not before getting these three videos declassified."},{"id":"f61345c5-2272-4e77-bf46-b5351dbfe6ec","type":"testimony","location":"00:10:51.9-00:10:57.5","speaker":"Mellon, Christopher","text":"Christopher Mellon tried to help Luis Elizondo elevate the Unidentified Aerial Phenomena (UAP) issue in the department and get it to the Secretary of Defense.","quote":"I tried to help my colleague, Lou Elizondo, elevate the issue in the department and actually get it to the Secretary of Defense."},{"id":"23292579-d6c7-4d08-941d-bd0a0672eb4f","type":"biographical","location":"00:10:57.5-00:11:04.3","speaker":"Whitaker, Bill","text":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Bill Clinton and George W. Bush.","quote":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush"},{"id":"4752c4bb-5c3c-4400-bc01-302722465b8c","type":"biographical","location":"00:11:04.3-00:11:08.4","speaker":"Whitaker, Bill","text":"Christopher Mellon had access to top-secret government programmes.","quote":"and had access to top-secret government programs."},{"id":"7e39ff51-43f3-44ba-b7f7-d9829a166ad2","type":"opinion","location":"00:11:08.4-00:11:18.7","speaker":"Mellon, Christopher","text":"Christopher Mellon can say with a very high degree of confidence that the Unidentified Aerial Phenomena (UAP) are not United States technology.","quote":"Bill Whitaker: We know that? Christopher Mellon: I could say that with a very high degree of confidence, in part because of the positions I held in the department, and I know the process."},{"id":"3106d997-4281-46e8-a077-1f97e51180a1","type":"opinion","location":"00:11:18.7-00:11:26.2","speaker":"Whitaker, Bill","text":"Christopher Mellon grew concerned that nothing was being done about Unidentified Aerial Phenomena (UAP).","quote":"Mellon says he grew concerned nothing was being done about UAPs"},{"id":"8c73d3ce-5fda-47d5-aa3f-b31a9fb390d2","type":"biographical","location":"00:11:26.2-00:11:37.0","speaker":"Whitaker, Bill","text":"In 2017, as a private citizen, Christopher Mellon acquired the three declassified United States Navy videos and leaked them to The New York Times.","quote":"In 2017, as a private citizen, he surreptitiously acquired the three Navy videos Elizondo had declassified and leaked them to The New York Times."},{"id":"f4c48ae7-d18c-4bd3-8ecb-36fa3a7aa2e6","type":"opinion","location":"00:11:37.0-00:11:46.1","speaker":"Mellon, Christopher","text":"Christopher Mellon considers it bizarre and unfortunate that someone like him has to leak videos to get a national security issue like Unidentified Aerial Phenomena (UAP) on the agenda.","quote":"It's bizarre and unfortunate that someone like myself has to do something like that to get a national security issue like this on the agenda."},{"id":"039c8437-26f0-4bde-b5d9-94ab52ffb8f8","type":"biographical","location":"00:11:46.1-00:11:57.6","speaker":"Whitaker, Bill","text":"Christopher Mellon joined forces with Luis Elizondo and started to tell their story to newspapers, the History Channel, and members of Congress.","quote":"He joined forces with now civilian Lou Elizondo, and they started to tell their story to anybody who would listen, to newspapers, the History Channel, to members of Congress."},{"id":"4dfb92d5-281d-4b7e-83fd-476f4379ab27","type":"opinion","location":"00:11:57.6-00:12:07.2","speaker":"Mellon, Christopher","text":"Christopher Mellon and Luis Elizondo understood they had to go to the public to get Congress interested to then circle back to the Defense Department.","quote":"We knew and understood that you had to go to the public, get the public interested to get Congress interested, to then circle back to the Defense Department and get them to start taking a look at it."},{"id":"75f8547f-cefd-4a9a-b4ff-ea61cc13518b","type":"administrative","location":"00:12:07.2-00:12:15.6","speaker":"Whitaker, Bill","text":"The Pentagon resurrected the Advanced Aerospace Threat Identification Program (AATIP) in 2020-08 under the name UAP Task Force.","quote":"This past August, the Pentagon resurrected AATIP. It's now called the UAP Task Force."},{"id":"75688806-e934-45ad-8d8f-ec6c86496e8b","type":"administrative","location":"00:12:15.6-00:12:20.1","speaker":"Whitaker, Bill","text":"Service members are now encouraged to report strange encounters.","quote":"Service members now are encouraged to report strange encounters."},{"id":"1e185248-b335-4913-ac63-3cf0d0bf179d","type":"opinion","location":"00:12:22.6-00:12:26.5","speaker":"Rubio, Marco","text":"Marco Rubio considers anything that enters an airspace that is not supposed to be there to be a threat.","quote":"Anything that enters an airspace that's not supposed to be there is a threat."},{"id":"34459453-c7ed-4820-9bb1-b257335d82cc","type":"administrative","location":"00:12:26.5-00:12:34.0","speaker":"Whitaker, Bill","text":"After receiving classified briefings on Unidentified Aerial Phenomena (UAP), Marco Rubio called for a detailed analysis.","quote":"After receiving classified briefings on UAPs, Senator Marco Rubio called for a detailed analysis."},{"id":"32003a5f-3e5b-4df3-ba87-ea7bcf9922d8","type":"administrative","location":"00:12:34.0-00:12:46.3","speaker":"Whitaker, Bill","text":"In 2020-12, while head of the United States Senate Select Committee on Intelligence, Marco Rubio asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by 2021-06.","quote":"This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month."},{"id":"f121a0c9-1ac9-46cd-9a8c-9499dc9465b9","type":"opinion","location":"00:12:56.2-00:13:00.8","speaker":"Rubio, Marco","text":"There is a stigma on Capitol Hill about the topic of Unidentified Aerial Phenomena (UAP).","quote":"You know, there's a stigma on Capitol Hill."},{"id":"2b9eb9e8-9212-4c60-86c2-c7dc4591e652","type":"opinion","location":"00:13:00.8-00:13:06.9","speaker":"Rubio, Marco","text":"Some of Marco Rubio's colleagues are very interested in the topic of Unidentified Aerial Phenomena (UAP) and some giggle when it is brought up.","quote":"I mean, some of my colleagues are very interested in this topic and some kind of, you know, giggle when you bring it up."},{"id":"0e5be5ed-9501-438b-9f34-c943a95619bd","type":"opinion","location":"00:13:06.9-00:13:12.2","speaker":"Rubio, Marco","text":"Marco Rubio believes the stigma should not prevent getting an answer to the fundamental question about Unidentified Aerial Phenomena (UAP).","quote":"But I don't think we can allow the stigma to keep us from having an answer to a very fundamental question."},{"id":"816bddcd-4cec-4a15-a77b-d5c6bb4855a4","type":"opinion","location":"00:13:12.2-00:13:17.3","speaker":"Rubio, Marco","text":"Marco Rubio wants the United States Government to take Unidentified Aerial Phenomena (UAP) seriously and have a process to take it seriously.","quote":"I want us to take it seriously and have a process to take it seriously."},{"id":"b2bfc5c3-be8e-4604-9fd5-0f7390afd9dd","type":"opinion","location":"00:13:17.3-00:13:25.9","speaker":"Rubio, Marco","text":"Marco Rubio wants a process to analyse the data every time it comes in, with a place where Unidentified Aerial Phenomena (UAP) sightings are catalogued and constantly analysed until answers are obtained.","quote":"I want us to have a process to analyze the data, every time it comes in, that there be a place where this is cataloged and constantly analyzed until we get some answers."},{"id":"882130cb-e51f-4b17-a0f6-6c38ae1dace2","type":"opinion","location":"00:13:25.9-00:13:28.3","speaker":"Rubio, Marco","text":"The answer to what Unidentified Aerial Phenomena (UAP) are may have a very simple answer or may not.","quote":"Maybe it has a very simple answer. Maybe it doesn't."},{"id":"ebc68d6b-811e-43d1-a25e-891f556bd64f","type":"opinion","location":"00:13:35.4-00:13:41.7","speaker":"Dietrich, Alex","text":"Alex Dietrich felt the vulnerability of not having anything to defend themselves during the 2004 USS Nimitz UAP encounter.","quote":"I felt the vulnerability of not having anything to defend ourselves."}],"nodes":[{"id":"e7a0a7ae-86e3-40ab-a5de-433f7c14c07b","type":"person","name":"Whitaker, Bill"},{"id":"d38f8c51-f233-4cc4-b40a-a17a913ed42b","type":"person","name":"Elizondo, Luis"},{"id":"cb485053-31f7-4282-ac25-07bb1755c97b","type":"person","name":"Reid, Harry"},{"id":"2a98fdfc-98c8-4923-bc50-2d7d0ad7e164","type":"person","name":"Graves, Ryan"},{"id":"cb3f3f31-af9a-4b0b-be68-0b8b0d38d7dc","type":"person","name":"Fravor, David"},{"id":"d51a72f3-2ef7-4ccf-8301-d056ce27455d","type":"person","name":"Dietrich, Alex"},{"id":"5735e068-6792-4294-a019-96b9c6f1060b","type":"p <script>
const LS_KEY = 'navy_pilots_ratings';

const RATING_LABELS = { 5: 'Excellent', 4: 'Good', 3: 'Average', 2: 'Poor', 1: 'Terrible' };

let selectedModels = new Set();
let view = 'claims';
let ratings = {};
let ratedTimer = null;

function loadRatings() {
  try { const s = localStorage.getItem(LS_KEY); if (s) ratings = JSON.parse(s); } catch(e) {}
  fetch('/api/ratings').then(function(r) { if (r.ok) return r.json() }).then(function(server) {
    if (server) { var changed = false; for (var k in server) { if (!ratings[k]) { ratings[k] = server[k]; changed = true } } if (changed) { localStorage.setItem(LS_KEY, JSON.stringify(ratings)); renderCards(); updateStats() } }
  }).catch(function(){})
}
function saveRatings() {
  localStorage.setItem(LS_KEY, JSON.stringify(ratings));
  fetch('/api/ratings', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(ratings) }).catch(function(){})
}

function setRating(modelId, claimId, value) {
  const key = modelId + ':' + claimId;
  if (value === null) delete ratings[key];
  else ratings[key] = value;
  saveRatings();
  renderCards();
}

function getRating(modelId, claimId) {
  return ratings[modelId + ':' + claimId] || null;
}

function tsToSecs(ts) {
  if (!ts) return Infinity;
  var p = ts.split('-')[0].split(':');
  if (p.length === 3) return parseInt(p[0])*3600 + parseInt(p[1])*60 + parseFloat(p[2]);
  if (p.length === 2) return parseInt(p[0])*60 + parseFloat(p[1]);
  return Infinity;
}

function fmtTs(ts) { return ts || ''; }

function seekVideo(ts) {
  if (!ts) return;
  var s = Math.floor(tsToSecs(ts));
  if (!isFinite(s)) return;
  var ifr = document.querySelector('#sidebar iframe');
  if (ifr) ifr.src = 'https://www.youtube.com/embed/' + YOUTUBE_ID + '?enablejsapi=1&rel=0&autoplay=1&start=' + s;
}

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderChips() {
  var c = document.getElementById('model-chips');
  c.innerHTML = MODELS.map(function(m) {
    var cls = selectedModels.has(m.id) ? ' active' : '';
    if (m.errata) cls += ' errata';
    return '<span class="chip' + cls + '" data-model="' + esc(m.id) + '" title="' + esc(m.errata || m.name) + '">' + esc(m.name) + '</span>';
  }).join('');
  c.querySelectorAll('.chip').forEach(function(el) {
    el.addEventListener('click', function() {
      var mid = el.dataset.model;
      if (selectedModels.has(mid)) selectedModels.delete(mid);
      else selectedModels.add(mid);
      renderChips();
      renderCards();
    });
  });
  updateStats();
}

function renderCards() {
  var container = document.getElementById('cards');
  var countEl = document.getElementById('filter-count');
  var sel = MODELS.filter(function(m) { return selectedModels.has(m.id); });

  if (sel.length === 0) {
    container.innerHTML = '<div class="no-claims">Select one or more models above to see their digests</div>';
    countEl.textContent = '0 items';
    return;
  }

  if (view === 'claims') {
    var claims = [];
    sel.forEach(function(m) {
      m.claims.forEach(function(c) {
        claims.push({ id: c.id, type: c.type, location: c.location, speaker: c.speaker,
                      text: c.text, quote: c.quote, modelId: m.id, modelName: m.name });
      });
    });
    claims.sort(function(a, b) { return tsToSecs(a.location) - tsToSecs(b.location); });

    if (claims.length === 0) {
      container.innerHTML = '<div class="no-claims">No claims in selected models</div>';
      countEl.textContent = '0 claims';
      return;
    }
    countEl.textContent = claims.length + ' claims';

    container.innerHTML = claims.map(function(c) {
      var r = getRating(c.modelId, c.id);
      var rc = r ? ' rated-' + r : '';
      var btns = [5,4,3,2,1].map(function(v) {
        return '<button class="rating-btn' + (r === v ? ' r' + v : '') + '" data-rating="' + v + '">' + v + '</button>';
      }).join('');
      var label = r ? RATING_LABELS[r] : 'Not rated';
      return '<div class="card' + rc + '" data-model="' + esc(c.modelId) + '" data-claim="' + esc(c.id) + '">'
        + '<div class="card-header">'
        + '<span class="model-tag">' + esc(c.modelName) + '</span>'
        + '<span class="claim-type">' + esc(c.type || '') + '</span>'
        + (c.location ? '<span class="ts-link" data-ts="' + esc(c.location) + '">' + fmtTs(c.location) + '</span>' : '')
        + (c.speaker ? '<span>' + esc(' — ' + c.speaker) + '</span>' : '')
        + '</div>'
        + '<div class="card-quote">' + esc(c.quote) + '</div>'
        + '<div class="card-text">' + esc(c.text) + '</div>'
        + '<div class="card-rating">' + btns + '<span class="rating-label">' + label + '</span></div>'
        + '</div>';
    }).join('');

    container.querySelectorAll('.rating-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var card = btn.closest('.card');
        var v = parseInt(btn.dataset.rating);
        var cur = getRating(card.dataset.model, card.dataset.claim);
        setRating(card.dataset.model, card.dataset.claim, cur === v ? null : v);
      });
    });
    container.querySelectorAll('.ts-link').forEach(function(el) {
      el.addEventListener('click', function() { seekVideo(el.dataset.ts); });
    });

  } else {
    var nodes = [];
    sel.forEach(function(m) {
      m.nodes.forEach(function(n) {
        nodes.push({ id: n.id, type: n.type, name: n.name, modelId: m.id, modelName: m.name });
      });
    });
    if (nodes.length === 0) {
      container.innerHTML = '<div class="no-claims">No nodes in selected models</div>';
      countEl.textContent = '0 nodes';
      return;
    }
    var grouped = {};
    nodes.forEach(function(n) {
      var k = n.type + '::' + n.name;
      if (!grouped[k]) grouped[k] = { type: n.type, name: n.name, models: [] };
      grouped[k].models.push(n.modelName);
    });
    var sorted = Object.values(grouped).sort(function(a, b) {
      if (a.type !== b.type) return a.type.localeCompare(b.type);
      return a.name.localeCompare(b.name);
    });
    countEl.textContent = sorted.length + ' unique nodes';
    container.innerHTML = sorted.map(function(g) {
      var tags = [];
      var seen = {};
      g.models.forEach(function(m) { if (!seen[m]) { seen[m] = true; tags.push('<span class="model-tag">' + esc(m) + '</span>'); } });
      return '<div class="card node-card"><div class="card-header"><span class="node-type">' + esc(g.type) + '</span> ' + tags.join(' ') + '</div><div class="card-text">' + esc(g.name) + '</div></div>';
    }).join('');
  }
}

function updateStats() {
  var total = 0, rated = 0;
  MODELS.forEach(function(m) {
    m.claims.forEach(function(c) { total++; if (getRating(m.id, c.id)) rated++; });
  });
  document.getElementById('stat-rated').textContent = rated + ' rated';
  document.getElementById('stat-total').textContent = total + ' total claims';
  document.getElementById('stat-models').textContent = MODELS.length + ' models';
}

function selectAll() {
  MODELS.forEach(function(m) { selectedModels.add(m.id); });
  renderChips(); renderCards();
}

function selectErrata() {
  MODELS.forEach(function(m) { if (m.errata) selectedModels.add(m.id); });
  renderChips(); renderCards();
}

function exportRatings() {
  var blob = new Blob([JSON.stringify(ratings, null, 2)], {type: 'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ratings-export-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function importRatingsClick() {
  document.getElementById('import-file').click();
}

function importRatings(file) {
  var reader = new FileReader();
  reader.onload = function() {
    try {
      var data = JSON.parse(reader.result);
      var merged = 0;
      for (var k in data) {
        if (!ratings[k]) { ratings[k] = data[k]; merged++; }
      }
      if (merged > 0) {
        saveRatings();
        renderCards();
        updateStats();
        alert('Imported ' + merged + ' new ratings.');
      } else {
        alert('No new ratings to import (all keys already known).');
      }
    } catch(e) { alert('Invalid ratings file: ' + e.message); }
  };
  reader.readAsText(file);
}

document.addEventListener('DOMContentLoaded', function() {
  loadRatings();
  if (MODELS.length > 0) selectedModels.add(MODELS[0].id);
  renderChips(); renderCards(); updateStats();

  document.querySelectorAll('#filter-type .btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('#filter-type .btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      view = btn.dataset.view;
      renderCards();
    });
  });

  document.getElementById('btn-clear').addEventListener('click', function() {
    selectedModels.clear(); renderChips(); renderCards();
  });
  document.getElementById('btn-all').addEventListener('click', selectAll);
  document.getElementById('btn-err').addEventListener('click', selectErrata);
  document.getElementById('btn-export').addEventListener('click', exportRatings);
  document.getElementById('btn-import').addEventListener('click', importRatingsClick);
  document.getElementById('import-file').addEventListener('change', function() {
    if (this.files.length) importRatings(this.files[0]);
  });
});
</script>

</body>
</html>
