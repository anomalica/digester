r","text":"David Fravor stated that he is not a 'UFO guy'.","quote":"I'm not a UFO guy."},{"id":"861024a1-af03-4ce4-8e5d-a4bd070c1cfb","type":"opinion","location":"00:09:45.8-00:09:56.5","speaker":"David Fravor","text":"David Fravor stated that something exists out there that was better than his aircraft, but he does not know who built it or has the technology.","quote":"There's definitely something that, I don't know who's building it, who's got the technology, who's got the brains, but there's something out there that was better than our airplane."},{"id":"6b5fe906-7f2c-4a28-8e52-da9a00168c3c","type":"observation","location":"00:09:58.7-00:10:04.2","speaker":"Bill Whitaker","text":"Nothing was said or done officially about the Nimitz encounter for five years until Luis Elizondo investigated it.","quote":"Nothing was said or done officially for five years until Lou Elizondo came across the story and investigated."},{"id":"f77e8c29-81b3-4321-b57d-078025885b8e","type":"opinion","location":"00:10:13.2-00:10:25.3","speaker":"Luis Elizondo","text":"Luis Elizondo found the Nimitz encounter compelling due to the training invested in pilots, the unexplained nature of the objects, and the backing by electro-optical and radar data.","quote":"We spend millions of dollars in training these pilots, and they are seeing something that they can't explain. Furthermore, that information's being backed up on electro-optical data, like gun camera footage, and by radar data. Now, to me, that's compelling."},{"id":"40affdcf-8465-4f86-92b2-cc09d7d0ca52","type":"observation","location":"00:10:27.7-00:10:39.5","speaker":"Bill Whitaker","text":"AATIP's funding was eliminated in 2012, but Elizondo and a handful of others kept the mission alive.","quote":"AATIP's funding was eliminated in 2012, but Elizondo says he and a handful of others kept the mission alive."},{"id":"62b29e21-2622-4e30-8ef4-0c128bf41c88","type":"observation","location":"00:10:39.5-00:10:48.8","speaker":"Bill Whitaker","text":"Luis Elizondo quit the Pentagon in 2017, but not before declassifying three Navy videos.","quote":"until finally, frustrated, he quit the Pentagon in 2017, but not before getting these three videos declassified."},{"id":"415bbcac-aa69-4117-a6d0-c4a0d024c0df","type":"observation","location":"00:10:57.5-00:11:04.3","speaker":"Bill Whitaker","text":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Bill Clinton and George W. Bush.","quote":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush, and had access to top-secret government programs."},{"id":"be960a7f-e185-4920-9aad-ffd657a59a53","type":"opinion","location":"00:11:08.4-00:11:11.7","speaker":"Christopher Mellon","text":"Christopher Mellon stated with high confidence that the observed UAP is not US technology.","quote":"So it's not us, that's one thing we know. ... I could say that with a very high degree of confidence, in part because of the positions I held in the department, and I know the process."},{"id":"ddcf3917-fe71-4db9-a552-ff58f410c7e2","type":"observation","location":"00:11:26.2-00:11:37.0","speaker":"Bill Whitaker","text":"In 2017, Christopher Mellon, as a private citizen, surreptitiously acquired the three declassified Navy videos and leaked them to The New York Times.","quote":"In 2017, as a private citizen, he surreptitiously acquired the three Navy videos Elizondo had declassified and leaked them to The New York Times."},{"id":"414c637a-ecaa-4a68-89b8-45cea2bbbe9d","type":"observation","location":"00:11:46.1-00:11:57.6","speaker":"Bill Whitaker","text":"Christopher Mellon joined forces with Luis Elizondo and they told their story to newspapers, the History Channel, and members of Congress.","quote":"He joined forces with now civilian Lou Elizondo, and they started to tell their story to anybody who would listen, to newspapers, the History Channel, to members of Congress."},{"id":"b32106a4-d614-4998-af58-e91b7e8ef074","type":"observation","location":"00:12:09.1-00:12:12.6","speaker":"Bill Whitaker","text":"In August 2020, the Pentagon resurrected AATIP under a new name: the UAP Task Force.","quote":"This past August, the Pentagon resurrected AATIP. It's now called the UAP Task Force."},{"id":"cbf47cfc-f4cc-454b-86c1-8bf3945713b7","type":"observation","location":"00:12:15.6-00:12:20.1","speaker":"Bill Whitaker","text":"Service members are now encouraged to report strange encounters.","quote":"Service members now are encouraged to report strange encounters."},{"id":"b378331f-d342-4aae-a177-da96628025ed","type":"observation","location":"00:12:26.5-00:12:34.0","speaker":"Bill Whitaker","text":"Marco Rubio called for a detailed analysis of UAP after receiving classified briefings.","quote":"After receiving classified briefings on UAPs, Senator Marco Rubio called for a detailed analysis."},{"id":"e41ac18a-a48e-41d1-a2b5-ad374f06da80","type":"observation","location":"00:12:34.0-00:12:46.3","speaker":"Bill Whitaker","text":"In December 2020, while still head of the Intelligence Committee, Marco Rubio asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by the following month.","quote":"This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month."},{"id":"4d36a04c-aaf1-4cbf-a686-58b13fb9671d","type":"opinion","location":"00:12:22.6-00:12:26.5","speaker":"Marco Rubio","text":"Marco Rubio stated that anything entering an airspace not supposed to be there is a threat.","quote":"Anything that enters an airspace that's not supposed to be there is a threat."},{"id":"b4b810ba-c206-48ad-86fa-215c8b25a8b6","type":"opinion","location":"00:13:14.1-00:13:25.9","speaker":"Marco Rubio","text":"Marco Rubio wants a process to take UAP seriously, analyse data, catalogue it, and constantly analyse until answers are found, regardless of whether the answer is simple or not.","quote":"I want us to take it seriously and have a process to take it seriously. I want us to have a process to analyze the data. every time it comes in, that there be a place where this is cataloged and constantly analyzed until we get some answers. Maybe it has a very simple answer. Maybe it doesn't."}],"nodes":[{"id":"a6a4b42a-42a7-48f6-b6e4-f03df0f390d0","type":"person","name":"Bill Whitaker"},{"id":"8f9aa48c-84a7-4be4-9914-7f185c0490c1","type":"person","name":"Luis Elizondo"},{"id":"91185593-4fa8-43d1-ac58-9fad245319d3","type":"person","name":"Ryan Graves"},{"id":"d6b702e7-dbcb-4338-846a-a06a1482f8aa","type":"person","name":"David Fravor"},{"id":"5183655b-6ab8-42f4-b44b-440a47978983","type":"person","name":"Alex Dietrich"},{"id":"c9a7c7f6-63c7-422f-acee-567acf35ba7a","type":"person","name":"Christopher Mellon"},{"id":"2ee637ce-576d-452b-9d81-71dd525ab7e0","type":"person","name":"Marco Rubio"},{"id":"b7e75a25-22ac-4c97-babf-a6f8a03ed3ee","type":"person","name":"Harry Reid"},{"id":"d85387c9-6ac1-4478-96fb-95677be59cd6","type":"organisation","name":"United States Navy"},{"id":"b9ae6d7e-56bc-4b40-8e64-7393f89ac4a5","type":"organisation","name":"United States Department of Defense (DoD)"},{"id":"cf8e6b3c-a060-4a17-a253-cbcfd2680cd9","type":"organisation","name":"United States Senate Select Committee on Intelligence"},{"id":"649c5ac1-065c-4cbe-9d49-3973abf2682e","type":"organisation","name":"United States Congress"},{"id":"9cdecfe3-d443-4e75-bd9d-bce1e27cbfe2","type":"organisation","name":"Office of the Director of National Intelligence (ODNI)"},{"id":"e28be700-d4e9-4e03-b800-8bb9a2726b30","type":"project","name":"Advanced Aerospace Threat Identification Program (AATIP)"},{"id":"1083d362-4eca-4f86-a37f-428a0ebcd152","type":"project","name":"UAP Task Force"},{"id":"24aad750-5bc4-482d-8611-3a43990d865d","type":"project","name":"Project Blue Book"},{"id":"3b4e352e-f789-4a78-b0bc-08771671f35e","type":"organisation","name":"Top Gun Naval Flight School"},{"id":"b68f5482-b79c-4f7a-8bde-6a618afbbdfd","type":"organisation","name":"The New York Times"},{"id":"8d892ce8-03a4-421f-8f33-a5b3c15d1199","type":"organisation","name":"60 Minutes"},{"id":"f65825b4-9cb0-47e9-b5af-4c68abd769ee","type":"organisation","name":"History Channel"},{"id":"ab50556e-c858-4adb-89aa-775ffb644090","type":"place","name":"USA, Virginia, Virginia Beach"},{"id":"f51916bd-6f98-4ef8-ae4d-0d31f630549e","type":"place","name":"USA, Florida, Jacksonville"},{"id":"e0c62d53-725a-46b8-b112-fa47ad421dec","type":"place","name":"USA, California, San Diego"},{"id":"1b4d7e8a-c7bd-4b60-bb14-cb5f59c214b1","type":"place","name":"USA, Atlantic coast (offshore)"},{"id":"15b8ef3c-0040-47db-a290-2c3da3687882","type":"place","name":"USA, Southern California (offshore)"},{"id":"9a3455de-1f0f-454e-b545-b48fa5073d54","type":"place","name":"USA, Nevada, Area 51"},{"id":"5240fee6-b108-411e-9b24-e2c526dfc604","type":"event","name":"2004 USS Nimitz UAP encounter"},{"id":"b8a4bb27-889c-42fe-a7ff-fb936b493a7b","type":"event","name":"2015 UAP incident off Atlantic coast"},{"id":"34579ae7-88a2-4bcd-a748-627196a00ab9","type":"object","name":"F/A-18 Hornet"},{"id":"14b36985-ef56-44c3-b3cd-5e6a6e642d0f","type":"object","name":"USS Nimitz (CVN-68)"},{"id":"d6721108-f6db-4c86-941a-446a33b922dc","type":"object","name":"USS Princeton (CG-59)"},{"id":"10e24334-094b-4c84-beed-c2f40ecc4646","type":"document","name":"Navy videos declassified 2017"},{"id":"983001f4-7122-4ea3-96f1-d78f350489c8","type":"topic","name":"Unidentified Aerial Phenomena (UAP)"},{"id":"312a30dc-5fd1-4db4-bba9-937e1f025d32","type":"topic","name":"Anomalous Aerial Vehicle (AAV)"},{"id":"c419d764-31cd-4de7-adda-79f274e6b8f4","type":"topic","name":"Unidentified Flying Object (UFO)"}]},{"id":"deepseek_deepseek-v4-pro","name":"deepseek / deepseek-v4-pro","errata":null,"claims":[{"id":"c95cd5ed-2228-412f-8aca-f01e62563bd5","type":"administrative","location":"00:00:07.6-00:00:09.1","speaker":"Whitaker, Bill","text":"The United States government has grudgingly acknowledged Unidentified Aerial Phenomena (UAP).","quote":"It's the story of the U.S. government's grudging acknowledgement of Unidentified Aerial Phenomena, UAP, more commonly known as UFOs."},{"id":"ab2c9703-2694-4ac7-adbe-3dff10d9b2b0","type":"administrative","location":"00:00:09.1-00:00:12.0","speaker":"Whitaker, Bill","text":"The Pentagon now admits there is something out there.","quote":"after decades of public denial the pentagon now admits there's something out there"},{"id":"28237261-b526-4054-a3eb-f7b1c436b984","type":"administrative","location":"00:00:12.0-00:00:13.5","speaker":"Whitaker, Bill","text":"The United States Senate wants to know what the UAP are.","quote":"and the u.s senate wants to know what it is"},{"id":"6fcef351-7471-4955-9b50-8c5a558ada03","type":"administrative","location":"00:00:12.0-00:00:14.9","speaker":"Whitaker, Bill","text":"The United States Senate Select Committee on Intelligence (SSCI) has ordered the Office of the Director of National Intelligence (ODNI) and the Office of the Secretary of Defense to deliver a report on the mysterious sightings by June 2021.","quote":"the intelligence committee has ordered the director of national intelligence and the secretary of defense to deliver a report on the mysterious sightings by next month"},{"id":"4c728cac-0ca7-4c30-91cc-46fa5090f37e","type":"testimony","location":"00:00:44.4-00:00:59.6","speaker":"Elizondo, Luis","text":"The United States government has officially confirmed for the record that Unidentified Aerial Phenomena (UAP) are real.","quote":"Bill Whitaker: So what you're telling me is that UFOs, unidentified flying objects, are real. Luis Elizondo: Bill, I think we're beyond that already. The government has already stated for the record that they're real. I'm not telling you that. The United States government is telling you that."},{"id":"b1c14690-cd02-41d8-9e55-17a7c9e48917","type":"administrative","location":"00:01:02.4-00:01:11.5","speaker":"Whitaker, Bill","text":"Luis Elizondo spent 20 years running military intelligence operations worldwide, including in Afghanistan, the Middle East, and Guantanamo.","quote":"Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo."},{"id":"269f05c3-5e8c-4e85-bf32-8165b55da001","type":"administrative","location":"00:01:11.5-00:01:15.6","speaker":"Whitaker, Bill","text":"Before 2008, Luis Elizondo had not given Unidentified Flying Objects (UFOs) a second thought.","quote":"He hadn't given UFOs a second thought until 2008."},{"id":"90c7b0df-cfa8-40a7-a87f-8b260f07bef1","type":"administrative","location":"00:01:15.6-00:01:21.5","speaker":"Whitaker, Bill","text":"In 2008, Luis Elizondo was asked to join the Advanced Aerospace Threat Identification Program (AATIP) at the Pentagon.","quote":"That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP."},{"id":"8ec1c93b-d708-4bed-8a7b-05f7b8649c59","type":"administrative","location":"00:01:24.1-00:01:34.3","speaker":"Elizondo, Luis","text":"The mission of the Advanced Aerospace Threat Identification Program (AATIP) was to collect and analyse information on Anomalous Aerial Vehicles (AAVs), also known as Unidentified Flying Objects (UFOs) or Unidentified Aerial Phenomena (UAPs).","quote":"The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs. We call them UAPs."},{"id":"ea2e1c7c-bd99-40b9-9b2c-764c2d4a2ce9","type":"administrative","location":"00:01:50.3-00:02:01.6","speaker":"Whitaker, Bill","text":"The Advanced Aerospace Threat Identification Program (AATIP) was part of a $22 million program sponsored by Harry Reid to investigate UFOs.","quote":"Buried away in the Pentagon, AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs."},{"id":"9e2e51bc-695b-4959-8342-cf6b529aefbb","type":"administrative","location":"00:02:01.6-00:02:10.8","speaker":"Whitaker, Bill","text":"In 2010, Luis Elizondo took over AATIP and focused on the national security implications of UAP documented by US service members.","quote":"When Elizondo took over in 2010, he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members."},{"id":"972d2cd0-d899-4066-8611-65be281a4ca2","type":"observation","location":"00:02:12.6-00:02:16.0","speaker":"Elizondo, Luis","text":"The UAP observed by AATIP demonstrated the capability to endure 600 to 700 G-forces.","quote":"Imagine a technology that can do 600 to 700 G-forces"},{"id":"85e67b76-6025-477a-ac66-a2a0b03faa4a","type":"measurement","location":"00:02:16.0-00:02:18.0","speaker":"Elizondo, Luis","text":"The UAP observed by AATIP demonstrated the capability to fly at approximately 21,000 kilometres per hour (13,000 miles per hour).","quote":"that can fly at 13,000 miles an hour"},{"id":"eab88a1b-c8be-4923-a866-176b87aaf666","type":"observation","location":"00:02:18.0-00:02:19.5","speaker":"Elizondo, Luis","text":"The UAP observed by AATIP demonstrated the capability to evade radar.","quote":"that can evade radar"},{"id":"832ff86b-a320-4ca3-952c-494674b64afb","type":"observation","location":"00:02:19.5-00:02:23.0","speaker":"Elizondo, Luis","text":"The UAP observed by AATIP demonstrated the capability to fly through air and water and possibly space.","quote":"and that can fly through air and water and possibly space"},{"id":"a7f51952-870e-42d0-817b-f2b3c8f9afba","type":"observation","location":"00:02:23.0-00:02:25.0","speaker":"Elizondo, Luis","text":"The UAP observed by AATIP had no obvious signs of propulsion.","quote":"no obvious signs of propulsion"},{"id":"245bd3f8-c119-4226-ae6b-8bce8976c810","type":"observation","location":"00:02:25.0-00:02:25.8","speaker":"Elizondo, Luis","text":"The UAP observed by AATIP had no wings.","quote":"no wings"},{"id":"08a4a06b-f311-4916-b34f-60345d9631ab","type":"observation","location":"00:02:25.8-00:02:27.0","speaker":"Elizondo, Luis","text":"The UAP observed by AATIP had no control surfaces.","quote":"no control surfaces"},{"id":"7ba4a37d-fb4e-4618-8543-96bcd8af4cb9","type":"observation","location":"00:02:27.0-00:02:30.0","speaker":"Elizondo, Luis","text":"The UAP observed by AATIP could defy the natural effects of Earth's gravity.","quote":"and yet still can defy the natural effects of Earth's gravity"},{"id":"c363c837-0555-491e-9854-2ac120295ec9","type":"administrative","location":"00:02:37.0-00:02:47.7","speaker":"Whitaker, Bill","text":"The Advanced Aerospace Threat Identification Program (AATIP) consisted of a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time.","quote":"AATIP was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time."},{"id":"5e599ded-8696-469c-bdf9-f5c3ada747cf","type":"observation","location":"00:02:57.7-00:03:02.1","speaker":"Whitaker, Bill","text":"A Navy aircrew off the US Atlantic coast in 2015 captured video of a fast-moving object they struggled to lock onto with their targeting system.","quote":"A Navy aircrew struggles to lock onto a fast-moving object off the U.S. Atlantic coast in 2015."},{"id":"d7f249df-75d3-4bb6-823e-6639cff60469","type":"administrative","location":"00:03:07.3-00:03:20.4","speaker":"Whitaker, Bill","text":"The Pentagon admits it does not know what the objects in the recently released UAP images are.","quote":"but the Pentagon admits it doesn't know what in the world this is, or this, or this."},{"id":"6f084dac-b181-45fe-8a02-c08995f7293b","type":"opinion","location":"00:03:20.4-00:03:37.4","speaker":"Elizondo, Luis","text":"Some UAP sightings have simple explanations, but others do not.","quote":"In some cases, there are simple explanations for what people are witnessing, but there are some that are not."},{"id":"2362147f-e6e6-4297-8a35-3303156bbf81","type":"administrative","location":"00:03:44.3-00:03:52.6","speaker":"Elizondo, Luis","text":"During its investigations, AATIP considered possible conventional explanations for UAP, such as a new type of cruise missile technology from China or a high-altitude reconnaissance balloon.","quote":"Is it some sort of new type of cruise missile technology that China has developed? Is it some sort of high-altitude balloon that's conducting reconnaissance?"},{"id":"429fb50d-3dc6-4fbd-bb49-e97cf2e4afc4","type":"opinion","location":"00:03:52.6-00:04:06.2","speaker":"Elizondo, Luis","text":"When all conventional explanations are exhausted and the object remains unexplained and present in US airspace, it becomes compelling and problematic.","quote":"Ultimately, when you have exhausted all those what-ifs and you're still left with the fact that this is in our airspace and it's real, that's when it becomes compelling and that's when it becomes problematic."},{"id":"5e1afa64-3992-44bd-b9de-da58a80ad46a","type":"opinion","location":"00:04:06.2-00:04:12.9","speaker":"Whitaker, Bill","text":"Ryan Graves considers whatever is out there a security risk.","quote":"Former Navy pilot Lieutenant Ryan Graves calls whatever is out there a security risk."},{"id":"aa84ffde-2309-429d-b3ad-d0f8573f272e","type":"observation","location":"00:04:12.9-00:04:29.7","speaker":"Whitaker, Bill","text":"In 2014, Ryan Graves's F/A-18 squadron began seeing UAP hovering over restricted airspace southeast of Virginia Beach after updating their jet's radar to use infrared targeting cameras.","quote":"He told us his F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar, making it possible to zero in with infrared targeting cameras."},{"id":"d1b2cc14-10d7-4301-bae0-93f4633ea4a4","type":"opinion","location":"00:04:29.7-00:04:37.1","speaker":"Graves, Ryan","text":"The dual radar-and-infrared detection of UAP is hard to spoof.","quote":"Bill Whitaker: So you're seeing it both with the radar and with the infrared, and that tells you that there is something out there. Ryan Graves: Pretty hard to spoof that."},{"id":"371e1763-0f76-42e1-95a1-5e784fbcb111","type":"observation","location":"00:04:38.6-00:04:48.2","speaker":"Whitaker, Bill","text":"In 2019, photographs taken in the same area southeast of Virginia Beach show objects that the Pentagon confirms it cannot identify.","quote":"These photographs were taken in 2019 in the same area. The Pentagon confirms these are images of objects it can't identify."},{"id":"dfa03448-5929-4c40-9955-6a669d7d53bd","type":"observation","location":"00:04:54.3-00:05:01.2","speaker":"Graves, Ryan","text":"UAP sightings occurred every day for at least a couple of years in the training areas off the Atlantic coast.","quote":"Bill Whitaker: All the time? Ryan Graves: Every day. Every day for at least a couple of years."},{"id":"0deaba68-4aed-4483-be69-b3c773a5146c","type":"observation","location":"00:05:04.3-00:05:07.0","speaker":"Graves, Ryan","text":"Ryan Graves observed no exhaust plume on the UAP seen in the 2015 Jacksonville video.","quote":"Bill Whitaker: including this one, off the coast of Jacksonville, Florida in 2015 ... Ryan Graves: I don't see an exhaust plume."},{"id":"eee0030b-05f2-4d83-81d7-0002c7745345","type":"opinion","location":"00:05:33.2-00:05:44.9","speaker":"Graves, Ryan","text":"Ryan Graves finds the object in the 2015 Jacksonville video difficult to explain, noting it exhibits rotation, high altitude, and propulsion, and he does not know what it is.","quote":"Bill Whitaker: What do you think when you see something like this? Ryan Graves: This is a difficult one to explain. You have rotation, you have high altitudes, you have propulsion, right? I don't know. I don't know what it is, frankly."},{"id":"31b7f4fe-5a3c-4f3c-a48d-42dedc244790","type":"hearsay","location":"00:05:44.9-00:05:56.0","speaker":"Whitaker, Bill","text":"Pilots in Ryan Graves's squadron speculate that the UAP are either secret US technology, an adversary spy vehicle, or something otherworldly.","quote":"He told us pilots speculate they are one of three things, secret U.S. technology, an adversary spy vehicle, or something otherworldly."},{"id":"79b8719f-ce95-4c39-be18-bd8d7876556c","type":"opinion","location":"00:05:56.0-00:06:00.5","speaker":"Graves, Ryan","text":"Ryan Graves considers it most probable that the UAP are a threat observation program.","quote":"I'd say, you know, the highest probability is it's a threat observation program."},{"id":"ba83bfbb-89a2-4c5d-a222-9d0e61265ec9","type":"opinion","location":"00:06:00.5-00:06:05.4","speaker":"Graves, Ryan","text":"Ryan Graves considers Russian or Chinese technology a possible explanation for the observed UAP.","quote":"Bill Whitaker: Could it be Russian or Chinese technology? Ryan Graves: I don't see why not."},{"id":"64a2dda5-4fde-44a2-be04-be3c30b6beca","type":"opinion","location":"00:06:05.4-00:06:08.8","speaker":"Graves, Ryan","text":"Ryan Graves is worried about the UAP.","quote":"Bill Whitaker: Are you alarmed? Ryan Graves: I am worried, frankly."},{"id":"b9c2e82c-0e23-4e9b-bab0-021920da5eb9","type":"opinion","location":"00:06:08.8-00:06:13.6","speaker":"Graves, Ryan","text":"If the objects were identified as tactical jets from another country, it would be a massive issue.","quote":"You know, if these were tactical jets from another country that were hanging out up there, it would be a massive issue."},{"id":"54ea692a-ba5c-4d12-9136-8181c3df2cb5","type":"opinion","location":"00:06:13.6-00:06:18.5","speaker":"Graves, Ryan","text":"The unusual appearance of the UAP leads to a reluctance to directly address the problem.","quote":"But because it looks slightly different, we're not willing to actually look at the problem in the face."},{"id":"643603f3-fed4-4e99-a07e-652de2da7541","type":"opinion","location":"00:06:18.5-00:06:23.4","speaker":"Graves, Ryan","text":"The UAP are out there watching US forces every day.","quote":"We're happy to just ignore the fact that these are out there watching us every day."},{"id":"ac56b357-aa29-422c-be42-763a4f505202","type":"opinion","location":"00:06:18.5-00:06:23.4","speaker":"Graves, Ryan","text":"There is a tendency to ignore the fact that UAP are watching US forces daily.","quote":"We're happy to just ignore the fact that these are out there watching us every day."},{"id":"6c93d1db-96f9-4b8a-894b-cee70378d070","type":"administrative","location":"00:06:23.4-00:06:30.3","speaker":"Whitaker, Bill","text":"The US government has publicly ignored UAP since closing Project Blue Book in 1969.","quote":"The government has ignored it, at least publicly, since closing its Project Blue Book investigation in 1969."},{"id":"6f77a4fb-2603-44fe-a41e-f712913e31fe","type":"observation","location":"00:06:30.3-00:06:40.8","speaker":"Whitaker, Bill","text":"The 2004 USS Nimitz UAP encounter off Southern California was documented by radar, camera, and four naval aviators.","quote":"But that began to change after an incident off Southern California in 2004, which was documented by radar, by camera, and four naval aviators."},{"id":"30502ca7-1668-4570-b161-e8cda1588e8f","type":"administrative","location":"00:06:40.8-00:06:48.0","speaker":"Whitaker, Bill","text":"David Fravor is a graduate of the United States Navy Fighter Weapons School (TOPGUN) and was commander of the F/A-18 squadron on the USS Nimitz.","quote":"David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz"},{"id":"2ef51595-bdc0-4702-b42f-28e22092caa5","type":"administrative","location":"00:06:48.0-00:06:53.0","speaker":"Whitaker, Bill","text":"Alex Dietrich was flying at David Fravor's wing during the 2004 USS Nimitz UAP encounter and had never spoken publicly about it before.","quote":"and flying at his wing, Lieutenant Alex Dietrich, who has never spoken publicly about the encounter."},{"id":"4d985f00-3f78-4086-9402-9fb0f4e19d6b","type":"opinion","location":"00:06:57.3-00:07:01.1","speaker":"Dietrich, Alex","text":"Alex Dietrich had never wanted to appear on national television.","quote":"I never wanted to be on national TV, no offense."},{"id":"f2b3e19d-a56a-4a7b-9cfa-c777f7af7460","type":"administrative","location":"00:07:01.1-00:07:14.4","speaker":"Dietrich, Alex","text":"Alex Dietrich agreed to speak about the encounter because she was in a government aircraft on duty, feels a responsibility to share what she can, and the information is unclassified.","quote":"Bill Whitaker: So why are you doing this? Alex Dietrich: Because I was in a government aircraft, because I was on the clock, and so I feel a responsibility to share what I can, and it is unclassified."},{"id":"73652818-968e-434a-a97a-efb195778a87","type":"administrative","location":"00:07:14.4-00:07:23.1","speaker":"Whitaker, Bill","text":"In November 2004, the USS Nimitz Carrier Strike Group was training approximately 160 kilometres (100 miles) southwest of San Diego.","quote":"It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego."},{"id":"51fcae53-d113-4e45-92a9-06bdb3420b2b","type":"measurement","location":"00:07:23.1-00:07:39.3","speaker":"Whitaker, Bill","text":"For a week prior to 2004-11-14, the radar on the USS Princeton detected multiple Anomalous Aerial Vehicles (AAVs) descending approximately 24,000 metres (80,000 feet) in less than a second.","quote":"For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 80,000 feet in less than a second."},{"id":"06ed80d9-5e5f-4fca-9f5b-7c5bf693d385","type":"administrative","location":"00:07:39.3-00:07:47.8","speaker":"Whitaker, Bill","text":"On 2004-11-14, David Fravor and Alex Dietrich, each with a weapons system officer in the backseat, were diverted to investigate the UAP.","quote":"On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate."},{"id":"8420ee5b-5b7d-4d46-928e-330702c0b75a","type":"observation","location":"00:07:47.8-00:07:55.9","speaker":"Whitaker, Bill","text":"David Fravor and Alex Dietrich found an area of roiling white water the size of a Boeing 737 in an otherwise calm blue sea.","quote":"They found an area of roiling white water the size of a 737 in an otherwise calm blue sea."},{"id":"ebc8977c-5c7a-4400-b8e9-c7789913a3bf","type":"observation","location":"00:08:06.3-00:08:12.3","speaker":"Fravor, David","text":"David Fravor saw a small white object, described as looking like a Tic Tac mint, moving above the whitewater area.","quote":"And we saw this little white tic-tac-looking object. And it's just kind of moving above the whitewater area."},{"id":"0d850ca5-ad94-4dd0-b44d-c248524b426e","type":"observation","location":"00:08:18.5-00:08:27.0","speaker":"Fravor, David","text":"The object turned abruptly and began mirroring David Fravor's movements, coming up as he descended.","quote":"The tic-tac's still pointing north-south. It goes and just turns abruptly and starts mirroring me. So as I'm coming down, it starts coming up."},{"id":"de098695-ab63-45c6-bc4e-22a9bc827b00","type":"opinion","location":"00:08:27.0-00:08:30.5","speaker":"Fravor, David","text":"The object was aware of the pilots' presence.","quote":"Bill Whitaker: So it's mimicking your moves. David Fravor: Yeah, it was aware we were there."},{"id":"df0455a2-3a88-4c75-9280-5e9b6c688084","type":"observation","location":"00:08:30.5-00:08:37.0","speaker":"Whitaker, Bill","text":"The object was about the size of an F/A-18, with no markings, no wings, and no exhaust plumes.","quote":"He said it was about the size of his F-18, with no markings, no wings, no exhaust plumes."},{"id":"2ddf70c6-015b-423e-98d5-7d5e5d7631f6","type":"observation","location":"00:08:37.0-00:08:44.8","speaker":"Fravor, David","text":"As David Fravor tried to get closer, the object climbed and then disappeared when it was directly in front of him.","quote":"David Fravor: I want to see how close I can get. So I go like this, and it's climbing still. And when it gets right in front of me, it just disappears."},{"id":"b38317c3-7441-4eb7-96fe-3085f8984acb","type":"observation","location":"00:08:44.8-00:08:49.4","speaker":"Fravor, David","text":"The object sped off and disappeared.","quote":"Bill Whitaker: Disappears? David Fravor: Disappears, like gone. It had sped off."},{"id":"4eb7733d-c243-429f-9689-680cb58cd61f","type":"opinion","location":"00:08:49.4-00:09:00.9","speaker":"Dietrich, Alex","text":"Alex Dietrich initially tried to rationalise the object as a helicopter or a drone.","quote":"Bill Whitaker: What are you thinking? Alex Dietrich: So your mind tries to make sense of it. I'm going to categorize this as maybe a helicopter or maybe a drone."},{"id":"1b4ee087-e47f-4b59-8f21-040a196351c7","type":"observation","location":"00:09:00.9-00:09:08.9","speaker":"Fravor, David","text":"All four aviators in the two aircraft watched the object for about five minutes.","quote":"Bill Whitaker: Did your back seaters see this too? Alex Dietrich: Yeah. David Fravor: Oh, yeah. There was four of us in the airplanes literally watching this thing for roughly about five minutes."},{"id":"a5d6421b-eb23-47e6-bf6a-e82d95133db5","type":"observation","location":"00:09:08.9-00:09:14.4","speaker":"Whitaker, Bill","text":"Seconds after the object disappeared, the USS Princeton reacquired it approximately 97 kilometres (60 miles) away.","quote":"Seconds later, the Princeton reacquired the target, 60 miles away."},{"id":"ee909ac2-aa0a-49c8-bd37-3cfe82c7eccf","type":"observation","location":"00:09:14.4-00:09:20.8","speaker":"Whitaker, Bill","text":"Another crew briefly locked onto the object with a targeting camera before it zipped off again.","quote":"Another crew managed to briefly lock onto it with a targeting camera before it zipped off again."},{"id":"7a87f105-7ea6-4dae-a443-d0ea5ecb134e","type":"opinion","location":"00:09:20.8-00:09:31.1","speaker":"Dietrich, Alex","text":"Alex Dietrich has privately remarked that she might not have reported the encounter if she had seen it alone because it sounds so crazy.","quote":"You know, I think that over beers, we've sort of said, hey, man, if I saw this solo, I don't know that I would have come back and said anything because it sounds so crazy when I say it."},{"id":"94d7afdb-ac0c-4331-877a-0738ae94befb","type":"opinion","location":"00:09:31.1-00:09:39.8","speaker":"Fravor, David","text":"David Fravor understands that reaction and acknowledges that some people have told him he sounds crazy when he talks about it, and he does not consider himself a UFO enthusiast.","quote":"Bill Whitaker: You understand that reaction? David Fravor: I do. I've had some people tell me, you know, when you say that, you can sound crazy. I'll be honest. I'm not a UFO guy."},{"id":"8a6b758f-e95e-479c-9220-0af605178ad1","type":"opinion","location":"00:09:39.8-00:09:56.5","speaker":"Fravor, David","text":"David Fravor believes there is definitely something out there that is superior to their F/A-18.","quote":"Bill Whitaker: But from what I hear you guys saying, there's something. David Fravor: Yes. There's definitely something that, I don't know who's building it, who's got the technology, who's got the brains, but there's something out there that was better than our airplane."},{"id":"57b9c327-fc94-49ec-8753-9a5cf397b9d5","type":"administrative","location":"00:09:56.5-00:10:13.2","speaker":"Whitaker, Bill","text":"After the 2004 encounter, nothing was said or done officially for five years until Luis Elizondo investigated.","quote":"Then, like the mysterious flying object, the Nimitz encounter disappeared. Nothing was said or done officially for five years until Lou Elizondo came across the story and investigated."},{"id":"00d97910-b49b-4c09-9ed4-7421bfbb7841","type":"opinion","location":"00:10:13.2-00:10:27.7","speaker":"Elizondo, Luis","text":"Luis Elizondo finds the combination of pilot testimony, electro-optical data, and radar data regarding UAP compelling.","quote":"We spend millions of dollars in training these pilots, and they are seeing something that they can't explain. Furthermore, that information's being backed up on electro-optical data, like gun camera footage, and by radar data. Now, to me, that's compelling."},{"id":"cc880bdc-0f65-4dbb-9216-826791583069","type":"administrative","location":"00:10:27.7-00:10:31.7","speaker":"Whitaker, Bill","text":"Inside the Pentagon, Luis Elizondo's findings were met with skepticism.","quote":"Inside the Pentagon, his findings were met with skepticism."},{"id":"f3cf4d5a-615d-44ab-9dc2-531c457ce57e","type":"administrative","location":"00:10:31.7-00:10:33.0","speaker":"Whitaker, Bill","text":"AATIP funding was eliminated in 2012.","quote":"AATIP's funding was eliminated in 2012"},{"id":"43c256dd-e2c9-40ce-bbae-efaa32163c25","type":"administrative","location":"00:10:33.0-00:10:39.5","speaker":"Whitaker, Bill","text":"Luis Elizondo and a handful of others kept the AATIP mission alive after funding ended.","quote":"but Elizondo says he and a handful of others kept the mission alive"},{"id":"970be2b5-8514-4102-8a0c-e9eb86779067","type":"administrative","location":"00:10:39.5-00:10:48.8","speaker":"Whitaker, Bill","text":"In 2017, Luis Elizondo quit the Pentagon, frustrated, but he had the three UAP videos declassified before leaving.","quote":"until finally, frustrated, he quit the Pentagon in 2017, but not before getting these three videos declassified."},{"id":"b7935d12-b857-4426-a087-79a83a9a6cd6","type":"administrative","location":"00:10:51.9-00:10:57.5","speaker":"Mellon, Christopher","text":"Christopher Mellon tried to help Luis Elizondo elevate the UAP issue within the Department of Defense to the Secretary of Defense.","quote":"I tried to help my colleague, Lou Elizondo, elevate the issue in the department and actually get it to the Secretary of Defense."},{"id":"20112162-77b7-4bb6-898b-f22523cd5069","type":"administrative","location":"00:10:57.5-00:11:04.3","speaker":"Whitaker, Bill","text":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence under President Bill Clinton and President George W. Bush.","quote":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush"},{"id":"ee678f91-702c-48fe-a92f-07ca5edb8369","type":"administrative","location":"00:11:04.3-00:11:08.4","speaker":"Whitaker, Bill","text":"Christopher Mellon had access to top-secret government programs.","quote":"and had access to top-secret government programs."},{"id":"b72072d0-023b-4df9-821e-d7aae27b6a0f","type":"opinion","location":"00:11:08.4-00:11:18.7","speaker":"Mellon, Christopher","text":"Christopher Mellon asserts with high confidence that the UAP are not US technology, based on his knowledge from his Department of Defense positions.","quote":"Christopher Mellon: So it's not us, that's one thing we know. ... Christopher Mellon: I could say that with a very high degree of confidence, in part because of the positions I held in the department, and I know the process."},{"id":"76d84939-63be-4fc6-a58e-247c14992027","type":"opinion","location":"00:11:37.0-00:11:46.1","speaker":"Mellon, Christopher","text":"Christopher Mellon considers it bizarre and unfortunate that he had to leak the videos to get the UAP issue on the national security agenda.","quote":"It's bizarre and unfortunate that someone like myself has to do something like that to get a national security issue like this on the agenda."},{"id":"435a75a3-8d65-4734-bf81-11c5a353739d","type":"opinion","location":"00:11:57.6-00:12:07.2","speaker":"Mellon, Christopher","text":"They believed that getting the public interested was necessary to generate Congressional interest and eventually get the Defense Department to investigate UAP.","quote":"We knew and understood that you had to go to the public, get the public interested to get Congress interested, to then circle back to the Defense Department and get them to start taking a look at it."},{"id":"fe2645d6-f02d-43e2-a559-c0381dadabac","type":"administrative","location":"00:12:07.2-00:12:15.6","speaker":"Whitaker, Bill","text":"In August 2020, the Pentagon established the UAP Task Force, resurrecting the investigation effort.","quote":"This past August, the Pentagon resurrected AATIP. It's now called the UAP Task Force."},{"id":"36934096-79ec-421e-b0a9-ca8a38081f7a","type":"administrative","location":"00:12:15.6-00:12:20.1","speaker":"Whitaker, Bill","text":"Service members are now encouraged to report UAP encounters.","quote":"Service members now are encouraged to report strange encounters."},{"id":"bf048424-b5f2-4ed5-a964-679a75dfa6c5","type":"administrative","location":"00:12:20.1-00:12:22.6","speaker":"Whitaker, Bill","text":"The US Senate wants answers about UAP.","quote":"And the Senate wants answers."},{"id":"4d5a2290-44b1-4475-b706-b9af0ba0ac07","type":"opinion","location":"00:12:22.6-00:12:26.5","speaker":"Rubio, Marco","text":"Marco Rubio stated that anything entering airspace without authorization is a threat.","quote":"Anything that enters an airspace that's not supposed to be there is a threat."},{"id":"bb202924-6b9f-4613-add1-1cfc8fa6e272","type":"administrative","location":"00:12:26.5-00:12:34.0","speaker":"Whitaker, Bill","text":"After receiving classified briefings on UAP, Marco Rubio called for a detailed analysis.","quote":"After receiving classified briefings on UAPs, Senator Marco Rubio called for a detailed analysis."},{"id":"b1aa23c6-f16b-4345-b243-febb58219761","type":"administrative","location":"00:12:34.0-00:12:46.3","speaker":"Whitaker, Bill","text":"In December 2020, while chair of the SSCI, Marco Rubio requested the ODNI and Pentagon provide an unclassified report to Congress by June 2021.","quote":"This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month."},{"id":"95e28f48-b3f7-4a19-916c-67474cb87a1c","type":"opinion","location":"00:12:46.3-00:12:59.0","speaker":"Rubio, Marco","text":"Marco Rubio believes we will find out if the process is different when the report comes.","quote":"Bill Whitaker: What makes you think that this time is going to be different? Marco Rubio: I mean, we're going to find out when we get that report."},{"id":"0a225bfa-7c60-4a89-8ff3-c83a9c596b92","type":"opinion","location":"00:12:59.0-00:13:00.8","speaker":"Rubio, Marco","text":"There is a stigma on Capitol Hill regarding UAP.","quote":"You know, there's a stigma on Capitol Hill."},{"id":"b7b6a1c6-542f-40f2-8ca7-0bab0c8e7f1a","type":"hearsay","location":"00:13:00.8-00:13:06.9","speaker":"Rubio, Marco","text":"Some members of Congress are very interested in UAP, while others giggle when the topic is raised.","quote":"I mean, some of my colleagues are very interested in this topic and some kind of, you know, giggle when you bring it up."},{"id":"0dae8e59-967a-4320-b6d6-0e6586dde828","type":"opinion","location":"00:13:06.9-00:13:12.2","speaker":"Rubio, Marco","text":"Marco Rubio thinks the stigma should not prevent answering the fundamental question about UAP.","quote":"But I don't think we can allow the stigma to keep us from having an answer to a very fundamental question."},{"id":"03521e59-9da5-4230-afce-8d1f9004df0a","type":"opinion","location":"00:13:12.2-00:13:34.0","speaker":"Rubio, Marco","text":"Marco Rubio wants a serious process to collect, catalogue, and constantly analyse UAP data until answers are found.","quote":"Bill Whitaker: What do you want us to do about this? Marco Rubio: I want us to take it seriously and have a process to take it seriously. I want us to have a process to analyze the data every time it comes in, that there be a place where this is cataloged and constantly analyzed until we get some answers. Maybe it has a very simple answer. Maybe it doesn't."}],"nodes":[{"id":"0a66b83a-f10f-42d7-8f7a-2dd6df6149be","type":"document","name":"60 Minutes episode: Navy pilots describe encounters with UFOs (2021-05-17)"},{"id":"7f549456-26db-4854-8828-336ea5f8b518","type":"project","name":"Advanced Aerospace Threat Identification Program (AATIP)"},{"id":"75bfc515-e743-41ac-81f0-ac745015babd","type":"topic","name":"Anomalous Aerial Vehicle (AAV)"},{"id":"2f3d2a95-16f5-4426-8a34-328640488b1d","type":"object","name":"Boeing 737"},{"id":"b1c6433b-b5bb-4bc1-8c54-a9790a38204d","type":"person","name":"Bush, George W."},{"id":"566dec35-f5dd-4b8f-82ae-de8d9ffba453","type":"organisation","name":"Carrier Strike Group 11 (CSG-11)"},{"id":"5408ccde-343f-4492-8055-9bf0636308e7","type":"person","name":"Clinton, Bill"},{"id":"4359458c-da5c-4e23-b736-1bf886a96da5","type":"place","name":"Cuba, Guantanamo Bay Naval Base (Guantanamo)"},{"id":"1cde3cb5-480d-4ad9-b8a1-c650a77ec7ca","type":"person","name":"Dietrich, Alex"},{"id":"8fba8292-48b0-494c-95ab-b70b702c071b","type":"person","name":"Elizondo, Luis"},{"id":"11b7bc37-0afd-4ce1-aea7-a4c3176863cc","type":"object","name":"F/A-18"},{"id":"65c763b8-1b3a-4bb8-bb76-e7a1364f0f82","type":"person","name":"Fravor, David"},{"id":"e9d21609-a432-4c23-a916-c118553a339f","type":"person","name":"Graves, Ryan"},{"id":"fc3534f5-8bd8-4f4c-81e5-2ce050aa2443","type":"organisation","name":"History Channel"},{"id":"5f31eb73-c119-4d24-a95d-941c00baed98","type":"person","name":"Mellon, Christopher"},{"id":"4463c48e-7739-47f0-bf07-a039e941a69f","type":"organisation","name":"Office of the Director of National Intelligence (ODNI)"},{"id":"3d67e6cb-9fec-46f3-a26b-73fec43608da","type":"organisation","name":"Office of the Secretary of Defense"},{"id":"80b9e3a9-7220-4482-8e72-293398636c58","type":"object","name":"Pentagon"},{"id":"b4775bda-1089-4493-bc84-012037ad1a3e","type":"project","name":"Project Blue Book"},{"id":"d11bad8f-44da-463c-9d22-fe54a1413785","type":"person","name":"Reid, Harry"},{"id":"ec0aabff-9c58-4e48-bfbb-b38b6e8adf27","type":"person","name":"Rubio, Marco"},{"id":"e3a9bfa8-18fe-4fcb-91ff-9d4570d30bcd","type":"organisation","name":"The New York Times"},{"id":"bffddc7f-977d-4f80-aa9b-81d7154a9a18","type":"project","name":"UAP Task Force"},{"id":"519c0901-22bc-4b5b-8bdd-760831246491","type":"topic","name":"Unidentified Aerial Phenomena (UAP)"},{"id":"409c8948-93fb-40fb-904c-f522b6a2fb36","type":"topic","name":"Unidentified Flying Object (UFO)"},{"id":"343d3839-47ce-44f7-864c-c8b221c50d89","type":"organisation","name":"United States Congress"},{"id":"396d6be2-cce3-4e29-a055-f22df98910c1","type":"organisation","name":"United States Department of Defense (DoD)"},{"id":"458f5357-2c7d-454e-b8ed-62ce1f7517db","type":"organisation","name":"United States Government"},{"id":"9f5731b4-6a96-4834-a24a-22e5b19615bb","type":"organisation","name":"United States Navy"},{"id":"7049e662-dab6-4776-b4a6-b371c69111a5","type":"organisation","name":"United States Navy Fighter Weapons School (TOPGUN)"},{"id":"96b127b9-b03d-4629-805d-f0dce29f1067","type":"organisation","name":"United States Senate Select Committee on Intelligence (SSCI)"},{"id":"8e07dd31-c113-4c62-b133-4a3a5259c090","type":"place","name":"USA, California, San Diego"},{"id":"89d4abf4-60db-4f8a-a1c7-eccde20312d8","type":"place","name":"USA, Florida, Jacksonville"},{"id":"831d63fe-bee8-4288-a9d1-283a1849f286","type":"place","name":"USA, Virginia, Virginia Beach"},{"id":"70842c74-7132-4492-a891-6d4869a88d41","type":"object","name":"USS Nimitz"},{"id":"24cca029-b656-43bb-a5e1-1a1f166f7455","type":"object","name":"USS Princeton"},{"id":"19a497d2-f994-49a5-9222-ca4738a7d56d","type":"person","name":"Whitaker, Bill"},{"id":"a0cf8dd0-8d83-4ef2-9bdd-0ea6db6a9ef5","type":"event","name":"2004 USS Nimitz UAP encounter"},{"id":"da7d8175-2fb4-4378-b453-398e93283199","type":"event","name":"2014 Virginia Beach UAP sightings"},{"id":"f904229f-026c-45c5-b1fc-2e7b4000d8df","type":"event","name":"2015 Jacksonville UAP encounter"},{"id":"e1a10ff8-e508-40ab-8191-80049bb40599","type":"organisation","name":"60 Minutes"}]},{"id":"google_gemini-3-flash-preview","name":"google / gemini-3-flash-preview","errata":null,"claims":[{"id":"c16b7328-d3d3-4110-981b-04ae4b53249d","type":"administrative","location":"00:00:14.9-00:00:20.0","speaker":"Bill Whitaker","text":"The United States Department of Defense has officially acknowledged the existence of Unidentified Aerial Phenomena (UAP).","quote":"the pentagon now admits there's something out there"},{"id":"87f357ce-4453-417f-bf3a-701d62af1f6e","type":"administrative","location":"00:00:23.0-00:00:35.0","speaker":"Bill Whitaker","text":"The United States Senate Select Committee on Intelligence ordered the Office of the Director of National Intelligence (ODNI) and the Secretary of Defence to deliver a report on Unidentified Aerial Phenomena sightings by June 2021.","quote":"the intelligence committee has ordered the director of national intelligence and the secretary of defense to deliver a report on the mysterious sightings by next month"},{"id":"a84edf06-ab7f-40f2-a0ec-19e9536d2c2d","type":"biographical","location":"00:01:02.4-00:01:11.5","speaker":"Bill Whitaker","text":"Luis Elizondo spent 20 years conducting military intelligence operations in Afghanistan, the Middle East, and Guantanamo.","quote":"Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo."},{"id":"9b36bc25-88a5-4d97-a204-22dbe9d69b1d","type":"biographical","location":"00:01:11.5-00:01:24.1","speaker":"Bill Whitaker","text":"Luis Elizondo joined the Advanced Aerospace Threat Identification Program (AATIP) at The Pentagon in 2008.","quote":"He hadn't given UFOs a second thought until 2008. That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP."},{"id":"c86ca50f-fd5a-40fd-b6d7-fb7e932b9b5b","type":"administrative","location":"00:01:24.1-00:01:34.3","speaker":"Luis Elizondo","text":"The mission of the Advanced Aerospace Threat Identification Program (AATIP) was to collect and analyse information regarding Anomalous Aerial Vehicles (AAV).","quote":"The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles"},{"id":"64c3b475-4c0c-43ae-9f33-4888e2c3ebfd","type":"administrative","location":"00:01:50.3-00:02:01.6","speaker":"Bill Whitaker","text":"Harry Reid sponsored the 22 million dollar Advanced Aerospace Threat Identification Program (AATIP) to investigate Unidentified Aerial Phenomena.","quote":"AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs."},{"id":"f6749442-8dd2-449c-8d04-e900fb6776c2","type":"biographical","location":"00:02:01.6-00:02:10.8","speaker":"Bill Whitaker","text":"Luis Elizondo took over leadership of the Advanced Aerospace Threat Identification Program (AATIP) in 2010.","quote":"When Elizondo took over in 2010, he focused on the national security implications"},{"id":"7388f709-9774-41ae-8f07-39f2b7c0437c","type":"measurement","location":"00:02:12.6-00:02:35.2","speaker":"Luis Elizondo","text":"Observed Unidentified Aerial Phenomena have demonstrated the capability to withstand 600 to 700 G-forces.","quote":"Imagine a technology that can do 600 to 700 G-forces... That's precisely what we're seeing."},{"id":"d71271fa-183c-4f79-8fac-8ce47ac88f7c","type":"measurement","location":"00:02:12.6-00:02:35.2","speaker":"Luis Elizondo","text":"Observed Unidentified Aerial Phenomena travel at speeds of approximately 21,000 kilometres per hour.","quote":"that can fly at 13,000 miles an hour... That's precisely what we're seeing."},{"id":"775af18e-57d0-4f03-90ec-434faaa876c8","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Luis Elizondo","text":"Observed Unidentified Aerial Phenomena can evade radar and move through air, water, and space.","quote":"that can evade radar, and that can fly through air and water and possibly space... That's precisely what we're seeing."},{"id":"3abf33c0-9355-42ce-ba78-97bc2ebc88a1","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Luis Elizondo","text":"Unidentified Aerial Phenomena observed by the Advanced Aerospace Threat Identification Program (AATIP) show no obvious wings, control surfaces, or signs of propulsion.","quote":"has no obvious signs of propulsion, no wings, no control surfaces... That's precisely what we're seeing."},{"id":"88b6ab21-ca33-4f01-8184-a24632865899","type":"observation","location":"00:02:57.7-00:03:07.3","speaker":"Bill Whitaker","text":"United States Navy aircrews recorded video of a fast-moving object off the United States Atlantic coast in 2015.","quote":"A Navy aircrew struggles to lock onto a fast-moving object off the U.S. Atlantic coast in 2015."},{"id":"fa387aff-cf86-49ca-b433-36e6ca9b923d","type":"observation","location":"00:04:12.9-00:04:29.7","speaker":"Bill Whitaker","text":"Ryan Graves and his F/A-18 squadron began observing Unidentified Aerial Phenomena in restricted airspace southeast of Virginia Beach in 2014.","quote":"his F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014"},{"id":"a8cfeb1c-386f-4c9b-9545-db9ddf942369","type":"testimony","location":"00:04:29.7-00:04:37.1","speaker":"Ryan Graves","text":"Ryan Graves states that dual detection via radar and infrared cameras makes Unidentified Aerial Phenomena sightings difficult to spoof.","quote":"Bill Whitaker: So you're seeing it both with the radar and with the infrared, and that tells you that there is something out there. Ryan Graves: Pretty hard to spoof that."},{"id":"573fe4a9-dd1c-4b5e-b51d-fa0a142ed3b6","type":"administrative","location":"00:04:38.6-00:04:48.2","speaker":"Bill Whitaker","text":"The Pentagon confirmed that images of objects taken off the Atlantic coast in 2019 are of Unidentified Aerial Phenomena it cannot identify.","quote":"These photographs were taken in 2019 in the same area. The Pentagon confirms these are images of objects it can't identify."},{"id":"55544d74-30a1-48ff-86c7-4badfd5ab62f","type":"observation","location":"00:04:48.2-00:05:01.2","speaker":"Ryan Graves","text":"United States Navy pilots training off the Atlantic coast observed Unidentified Aerial Phenomena daily for at least two years.","quote":"Bill Whitaker: Lieutenant Graves told us pilots training off the Atlantic coast see things like that all the time. Ryan Graves: Every day. Every day for at least a couple of years."},{"id":"5a796d95-ab31-4af8-a885-e64d084a55b0","type":"observation","location":"00:05:04.3-00:05:23.8","speaker":"Ryan Graves","text":"A United States Navy targeting camera captured an Unidentified Aerial Phenomena rotating while moving against wind speeds of approximately 220 kilometres per hour off the coast of Jacksonville, Florida in 2015.","quote":"off the coast of Jacksonville, Florida in 2015... They're all going against the wind. The wind's 120 knots far west. Look at that thing, dude."},{"id":"5b760ad4-0408-4d4c-992a-3cc9608730dd","type":"opinion","location":"00:06:00.5-00:06:04.1","speaker":"Ryan Graves","text":"Ryan Graves considers Russian or Chinese threat observation technology a possible explanation for the observed Unidentified Aerial Phenomena.","quote":"Bill Whitaker: Could it be Russian or Chinese technology? Ryan Graves: I don't see why not."},{"id":"f028d6e2-610b-413f-8161-0b0a68f650e1","type":"administrative","location":"00:06:23.4-00:06:30.3","speaker":"Bill Whitaker","text":"The United States government closed its Project Blue Book investigation in 1969.","quote":"The government has ignored it, at least publicly, since closing its Project Blue Book investigation in 1969."},{"id":"7a10fcfe-be30-4af6-9ae0-88b3b33dc2a9","type":"measurement","location":"00:07:23.1-00:07:39.3","speaker":"Bill Whitaker","text":"In November 2004, the USS Princeton detected multiple Anomalous Aerial Vehicles descending from 24,000 metres in less than one second.","quote":"the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 80,000 feet in less than a second."},{"id":"09a8dba1-ee00-48f9-8fc8-807737017142","type":"observation","location":"00:07:47.8-00:08:37.0","speaker":"David Fravor","text":"During the 2004 USS Nimitz UAP encounter, David Fravor and Alex Dietrich observed a white 'Tic Tac' shaped object, approximately the size of an F/A-18, hovering above roiling water.","quote":"we saw this little white tic-tac-looking object. And it's just kind of moving above the whitewater area... He said it was about the size of his F-18"},{"id":"399e2519-1685-47fb-bc71-ce71b42adb94","type":"observation","location":"00:08:18.5-00:08:48.0","speaker":"David Fravor","text":"During the 2004 encounter, the Anomalous Aerial Vehicle mimicked David Fravor's flight manoeuvres before accelerating and disappearing.","quote":"It goes and just turns abruptly and starts mirroring me... when it gets right in front of me, it just disappears... It had sped off."},{"id":"d6aba072-ee4a-4a21-a5b0-118991dfe86d","type":"measurement","location":"00:09:08.9-00:09:14.4","speaker":"Bill Whitaker","text":"The USS Princeton reacquired the Anomalous Aerial Vehicle on radar approximately 100 kilometres away from its original position seconds after it disappeared from David Fravor's sight.","quote":"Seconds later, the Princeton reacquired the target, 60 miles away."},{"id":"6115667b-600d-43bc-841f-8474386393a3","type":"administrative","location":"00:10:31.7-00:10:39.5","speaker":"Bill Whitaker","text":"Funding for the Advanced Aerospace Threat Identification Program (AATIP) was eliminated into 2012, though operations continued informally.","quote":"AATIP's funding was eliminated in 2012, but Elizondo says he and a handful of others kept the mission alive."},{"id":"c56f9645-903f-42c1-83e1-905cebde92fb","type":"biographical","location":"00:10:39.5-00:10:48.8","speaker":"Bill Whitaker","text":"Luis Elizondo resigned from The Pentagon in 2017 and subsequently had three United States Navy Unidentified Aerial Phenomena videos declassified.","quote":"he quit the Pentagon in 2017, but not before getting these three videos declassified."},{"id":"87c17d4c-5064-4410-98c1-9406714f0d8c","type":"administrative","location":"00:12:09.1-00:12:15.6","speaker":"Bill Whitaker","text":"The United States Department of Defense established the Unidentified Aerial Phenomena (UAP) Task Force in August 2020.","quote":"This past August, the Pentagon resurrected AATIP. It's now called the UAP Task Force."},{"id":"74e5e1bb-e141-4110-8cd2-8c7df16e95cd","type":"administrative","location":"00:12:34.0-00:12:46.3","speaker":"Bill Whitaker","text":"Marco Rubio requested that the Director of National Intelligence and the United States Department of Defense present an unclassified report on Unidentified Aerial Phenomena to Congress by June 2021.","quote":"he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month."}],"nodes":[{"id":"3cff1d64-d439-493b-8f5a-358207e181be","type":"person","name":"Whitaker, Bill"},{"id":"b866c956-ce01-4a9b-85f4-29fff3cb5d15","type":"person","name":"Elizondo, Luis"},{"id":"d42c025a-575e-4eaa-a753-63b8f6f30bcf","type":"person","name":"Reid, Harry"},{"id":"bdd07cc4-9dfc-4a2d-9e73-70af2dd41fd2","type":"person","name":"Graves, Ryan"},{"id":"b518fa7b-40a2-46ae-b063-b8e4f8c2a98b","type":"person","name":"Mellon, Christopher"},{"id":"648ca9c6-5dcb-414e-8955-58af31e1e62e","type":"person","name":"Fravor, David"},{"id":"691f686b-7049-4b1c-80bc-7b242b15b59e","type":"person","name":"Dietrich, Alex"},{"id":"1f8f95ed-05ff-427d-82c4-e26b60da37ce","type":"person","name":"Rubio, Marco"},{"id":"50a509c2-e123-4ced-88d9-905429a42663","type":"topic","name":"Unidentified Aerial Phenomena (UAP)"},{"id":"a088044d-d745-479a-96b2-21aa6076fd29","type":"topic","name":"Anomalous Aerial Vehicle (AAV)"},{"id":"9cb7fe1f-14cc-4229-aa41-6f53958cb3e0","type":"project","name":"Advanced Aerospace Threat Identification Program (AATIP)"},{"id":"0a0ed984-7133-4cde-afa3-24a43ffc6996","type":"project","name":"Project Blue Book"},{"id":"c010a1a9-3c1f-44e0-bc60-8d7324b9798f","type":"project","name":"Unidentified Aerial Phenomena (UAP) Task Force"},{"id":"c8713e75-e60f-4d4e-a67b-4cb643c52d69","type":"organisation","name":"United States Department of Defense (DoD)"},{"id":"fe3daa2d-37d7-49fc-a5a3-595de5aa20c4","type":"organisation","name":"The Pentagon"},{"id":"3fe97ea6-a2b0-462a-a973-0d42b595bea2","type":"organisation","name":"United States Navy"},{"id":"66e8182f-28a5-4ad2-ab3f-74b5fb2db34f","type":"organisation","name":"United States Senate Select Committee on Intelligence"},{"id":"866bb879-6a29-4fbf-a05d-7e5863df0295","type":"organisation","name":"Office of the Director of National Intelligence (ODNI)"},{"id":"59a11929-cec2-4db8-a55b-064e8e9d90a2","type":"organisation","name":"Top Gun Naval Flight School"},{"id":"7ba59793-787d-4c36-89ff-0d9f15fc5529","type":"organisation","name":"The New York Times"},{"id":"40c3d336-785a-4f36-b9bf-5dd595627c4b","type":"organisation","name":"History Channel"},{"id":"00d1afe2-e53a-4860-8e5a-250b15f18bc0","type":"document","name":"CBS 60 Minutes"},{"id":"dedc5415-5a29-465d-a278-a662686fdb0b","type":"event","name":"2004 USS Nimitz UAP encounter"},{"id":"9df7138c-780a-4529-b9c6-f7e47538cb75","type":"object","name":"F/A-18"},{"id":"30fdd22f-392a-44ca-a51e-4af46b15d781","type":"object","name":"USS Nimitz"},{"id":"c3e945e5-560e-4fc7-99a5-ca411432d90f","type":"object","name":"USS Princeton"},{"id":"9056cb61-9395-4737-bf32-e59c3853dcbb","type":"place","name":"USA, California, San Diego"},{"id":"7e62c79b-9b09-4d97-b78d-b1c4672e6be3","type":"place","name":"USA, Virginia, Virginia Beach"},{"id":"c686a94f-ce46-4c6c-b7e0-e94c202894d1","type":"place","name":"USA, Florida, Jacksonville"}]},{"id":"google_gemini-3.1-flash-lite","name":"google / gemini-3.1-flash-lite","errata":null,"claims":[{"id":"6b958431-b36e-4bc2-b55e-0b2d32248313","type":"observation","location":"00:00:09.1-00:00:14.9","speaker":null,"text":"The United States government has officially acknowledged the existence of Unidentified Aerial Phenomena.","quote":"the pentagon now admits there's something out there"},{"id":"b634b454-1673-4cd9-bcad-c8e983deb205","type":"administrative","location":"00:00:14.9-00:00:44.4","speaker":null,"text":"The United States Senate Select Committee on Intelligence has requested a report on Unidentified Aerial Phenomena from the Director of National Intelligence and the United States Department of Defense.","quote":"the u.s senate wants to know what it is the intelligence committee has ordered the director of national intelligence and the secretary of defense to deliver a report on the mysterious sightings by next month"},{"id":"dde6c76e-3d02-422d-b65f-4d53e04479b2","type":"observation","location":"00:01:02.4-00:01:11.5","speaker":null,"text":"Luis Elizondo spent 20 years working in military intelligence operations in Afghanistan, the Middle East, and Guantanamo.","quote":"Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo."},{"id":"12eae906-79f8-465a-9fd1-6f71c2742217","type":"observation","location":"00:01:11.5-00:01:24.1","speaker":null,"text":"Luis Elizondo was recruited to work for the Advanced Aerospace Threat Identification Program in 2008.","quote":"He hadn't given UFOs a second thought until 2008. That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP."},{"id":"4f57b9af-47ea-4fde-bdff-d31a1de210f5","type":"observation","location":"00:01:24.1-00:01:34.3","speaker":"Elizondo, Luis","text":"The mission of the Advanced Aerospace Threat Identification Program was to collect and analyse data regarding anomalous aerial vehicles.","quote":"The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs."},{"id":"2828c5b9-76d5-4127-bd2a-bcab4db9b211","type":"observation","location":"00:01:50.3-00:02:01.6","speaker":null,"text":"The Advanced Aerospace Threat Identification Program was a 22 million US dollar project sponsored by Harry Reid.","quote":"Buried away in the Pentagon, AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs."},{"id":"1f6662b5-fb3c-4f6c-bb36-065756c6631d","type":"observation","location":"00:02:01.6-00:02:10.8","speaker":null,"text":"Luis Elizondo led the Advanced Aerospace Threat Identification Program starting in 2010.","quote":"When Elizondo took over in 2010, he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members."},{"id":"0d799f1a-4087-472c-ad56-01002b8a640b","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Luis Elizondo describes anomalous aerial vehicles as capable of withstanding 600 to 700 G-forces.","quote":"Imagine a technology that can do 600 to 700 G-forces... That's precisely what we're seeing."},{"id":"91a47a12-65b7-4f72-986e-c33c5e9d0241","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Luis Elizondo describes anomalous aerial vehicles as capable of flying at approximately 21,000 kilometres per hour.","quote":"Imagine a technology... that can fly at 13,000 miles an hour... That's precisely what we're seeing."},{"id":"b5a4d968-71a5-4255-b528-0cd30d88520a","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Luis Elizondo describes anomalous aerial vehicles as capable of evading radar.","quote":"Imagine a technology... that can evade radar... That's precisely what we're seeing."},{"id":"a23aa39b-e510-416c-8514-2d19b99ce8f5","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Luis Elizondo describes anomalous aerial vehicles as capable of travelling through air, water, and possibly space.","quote":"Imagine a technology... that can fly through air and water and possibly space... That's precisely what we're seeing."},{"id":"36581878-8ad7-4db4-a99e-e9f98b809750","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Luis Elizondo states that anomalous aerial vehicles lack wings or obvious propulsion systems.","quote":"Imagine a technology... has no obvious signs of propulsion, no wings, no control surfaces... That's precisely what we're seeing."},{"id":"49ce90da-2838-4981-b033-1fa97f532532","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Luis Elizondo claims anomalous aerial vehicles are capable of defying gravity.","quote":"Imagine a technology... yet still can defy the natural effects of Earth's gravity. That's precisely what we're seeing."},{"id":"357c1b57-0913-42c5-9440-f3a0faa77140","type":"testimony","location":"00:04:06.2-00:04:29.7","speaker":"Graves, Ryan","text":"Ryan Graves reports his F/A-18 squadron observed Unidentified Aerial Phenomena hovering over restricted airspace southeast of Virginia Beach starting in 2014.","quote":"He told us his F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar"},{"id":"8e188010-5f69-4560-9881-1cde6d2b1326","type":"testimony","location":"00:04:29.7-00:04:37.1","speaker":"Graves, Ryan","text":"Ryan Graves confirms that Unidentified Aerial Phenomena are detected by both radar and infrared targeting cameras.","quote":"So you're seeing it both with the radar and with the infrared, and that tells you that there is something out there. Ryan Graves: Pretty hard to spoof that."},{"id":"53949c72-c75a-492e-a8ba-44d1424e320e","type":"testimony","location":"00:04:48.2-00:05:01.2","speaker":"Graves, Ryan","text":"Ryan Graves reports that pilots training off the Atlantic coast observe Unidentified Aerial Phenomena daily.","quote":"Lieutenant Graves told us pilots training off the Atlantic coast see things like that all the time. Ryan Graves: Every day. Every day for at least a couple of years."},{"id":"edd20516-2102-49d4-b2af-b8f51fdf7487","type":"observation","location":"00:05:02.5-00:05:04.3","speaker":"Graves, Ryan","text":"Ryan Graves states that observed Unidentified Aerial Phenomena do not display exhaust plumes.","quote":"You know, I don't see an exhaust plume."},{"id":"7960b798-b24e-457d-954e-2d8a3f3aad0f","type":"opinion","location":"00:05:44.9-00:05:56.0","speaker":"Graves, Ryan","text":"Ryan Graves identifies secret United States technology, an adversary spy vehicle, or something otherworldly as possible explanations for Unidentified Aerial Phenomena.","quote":"He told us pilots speculate they are one of three things, secret U.S. technology, an adversary spy vehicle, or something otherworldly. Ryan Graves: I'd say, you know, the highest probability is it's a threat observation program."},{"id":"bfd463ea-4cf1-479d-82b2-c7ae1e7fedaf","type":"opinion","location":"00:06:00.5-00:06:04.1","speaker":"Graves, Ryan","text":"Ryan Graves considers Russian or Chinese technology to be a possible explanation for observed Unidentified Aerial Phenomena.","quote":"Bill Whitaker: Could it be Russian or Chinese technology? Ryan Graves: I don't see why not."},{"id":"202d7893-e4b1-4658-80e3-0bb67da1a886","type":"administrative","location":"00:06:23.4-00:06:30.3","speaker":null,"text":"The United States Department of Defense officially closed Project Blue Book in 1969.","quote":"The government has ignored it, at least publicly, since closing its Project Blue Book investigation in 1969."},{"id":"56760af0-1a03-4c9e-aa89-57647834175d","type":"administrative","location":"00:06:40.8-00:06:57.3","speaker":null,"text":"David Fravor is a graduate of the Top Gun Naval Flight School and was the commander of an F/A-18 squadron on the USS Nimitz.","quote":"David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz"},{"id":"f1eb1e8a-8568-443c-a851-dda82f67eb92","type":"observation","location":"00:07:14.4-00:07:23.1","speaker":null,"text":"The USS Nimitz Carrier Strike Group was conducting training approximately 160 kilometres southwest of San Diego in November 2004.","quote":"It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego."},{"id":"42f21ffb-7f89-475a-a7f0-b43cd23cdf45","type":"observation","location":"00:07:23.1-00:07:39.3","speaker":null,"text":"The USS Princeton radar system detected multiple anomalous aerial vehicles descending 24,000 metres in less than one second, beginning approximately one week prior to 2004-11-14.","quote":"For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 80,000 feet in less than a second."},{"id":"e4cc6f13-0623-4f75-86c5-8683198f330e","type":"testimony","location":"00:08:17.9-00:08:30.5","speaker":"Fravor, David","text":"David Fravor witnessed a white object mirroring his aircraft movements near the surface of the sea on 2004-11-14.","quote":"He goes and just turns abruptly and starts mirroring me. So as I'm coming down, it starts coming up. Bill Whitaker: So it's mimicking your moves. David Fravor: Yeah, it was aware we were there."},{"id":"f22d403f-88f0-4855-aebb-415414520272","type":"administrative","location":"00:10:57.5-00:11:04.3","speaker":null,"text":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence under Presidents Clinton and George W. Bush.","quote":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush, and had access to top-secret government programs."},{"id":"45c9ef00-b1c1-472c-ac2d-3e53f6a3fd20","type":"opinion","location":"00:11:08.4-00:11:18.7","speaker":"Mellon, Christopher","text":"Christopher Mellon asserts that the unidentified aerial vehicles are not of United States origin.","quote":"Christopher Mellon: So it's not us, that's one thing we know... I could say that with a very high degree of confidence, in part because of the positions I held in the department, and I know the process."},{"id":"848a2f69-b79d-4e26-be97-9d9b89f354c3","type":"administrative","location":"00:11:18.7-00:11:37.0","speaker":null,"text":"In 2017, Christopher Mellon privately obtained three declassified United States Navy videos and leaked them to The New York Times.","quote":"In 2017, as a private citizen, he surreptitiously acquired the three Navy videos Elizondo had declassified and leaked them to The New York Times."},{"id":"c0ea0e64-7ed8-4236-9ed7-57f8213c61f7","type":"administrative","location":"00:12:07.2-00:12:15.6","speaker":null,"text":"The United States Department of Defense established the Unidentified Aerial Phenomena Task Force to replace the Advanced Aerospace Threat Identification Program.","quote":"This past August, the Pentagon resurrected AATIP. It's now called the UAP Task Force."}],"nodes":[{"id":"97adcfc8-74bb-4c5c-a46e-cdc3c953d187","type":"person","name":"Whitaker, Bill"},{"id":"1ac5ee89-abff-4eb1-9bf7-76f6c9c02c00","type":"person","name":"Elizondo, Luis"},{"id":"44e82873-70eb-45e4-871f-4a74c8f77b50","type":"person","name":"Reid, Harry"},{"id":"54dcb067-290a-4c7b-a688-2d3d8e0d7c53","type":"person","name":"Graves, Ryan"},{"id":"15814068-63ee-47c5-8ce3-938a26023d68","type":"person","name":"Fravor, David"},{"id":"fd473387-e3ea-4dab-a1aa-6eb92280d80d","type":"person","name":"Dietrich, Alex"},{"id":"a8778ca6-efb7-4ce7-bf8b-d57c0925cc6d","type":"person","name":"Mellon, Christopher"},{"id":"738b98a3-a181-4440-8963-17ae9c9c158a","type":"person","name":"Rubio, Marco"},{"id":"6cac4004-8e1d-4f76-a9d9-e548c59f9e91","type":"organisation","name":"United States Department of Defense (DoD)"},{"id":"04c2ec4a-93e4-421f-a6d1-27ae0b05bb23","type":"organisation","name":"United States Senate"},{"id":"328cf490-a0ea-4a07-b61b-aa090feaabc2","type":"organisation","name":"United States Senate Select Committee on Intelligence"},{"id":"f3db713b-c200-4998-8837-5d4a2ee05d3b","type":"organisation","name":"60 Minutes"},{"id":"f91b9d7b-d3fe-4a2a-a3d7-a11debe6a90b","type":"organisation","name":"United States Navy"},{"id":"e46ba269-1f3a-4612-b6c1-066b3bd4b868","type":"organisation","name":"Top Gun Naval Flight School"},{"id":"320b2c3a-5e79-4e88-9d81-20b0e19db11f","type":"organisation","name":"The New York Times"},{"id":"6597adcb-a60a-4791-93fe-b2884f8d5e73","type":"project","name":"Advanced Aerospace Threat Identification Program (AATIP)"},{"id":"63161b13-3803-4bb8-8096-0f9dc237aec6","type":"project","name":"Project Blue Book"},{"id":"a80c1539-b13e-4034-85dd-8a5c5a9fa317","type":"project","name":"Unidentified Aerial Phenomena Task Force (UAPTF)"},{"id":"c8b1867b-039c-47f8-8a82-87060e9a511a","type":"place","name":"USA, California, San Diego"},{"id":"e3c370ba-06d3-4f89-8bf6-2a5fd6fe74b3","type":"place","name":"USA, Virginia, Virginia Beach"},{"id":"accba1fe-0667-4d74-8fda-74f10c93522a","type":"place","name":"USA, Florida, Jacksonville"},{"id":"96b88421-bab5-49e7-8895-81c174948c2e","type":"event","name":"2004 USS Nimitz UAP encounter"},{"id":"b36641a8-6bd5-4725-95d9-bc1d01b0771e","type":"object","name":"F/A-18"},{"id":"ceb45865-8b6d-4157-b4c5-ad6538030784","type":"object","name":"USS Nimitz"},{"id":"8403090a-74c5-43e0-87af-c77063d791a6","type":"object","name":"USS Princeton"},{"id":"1dd754cd-12e1-4b6f-9ff2-2b4f3bf64b31","type":"topic","name":"Unidentified Aerial Phenomena (UAP)"}]},{"id":"google_gemini-3.1-pro-preview","name":"google / gemini-3.1-pro-preview","errata":null,"claims":[{"id":"99579422-08f6-4f3a-9e93-0079873f195d","type":"administrative","location":"00:00:07.6-00:00:14.9","speaker":"Whitaker, Bill","text":"The United States Department of Defense (DoD) officially acknowledges the existence of Unidentified Aerial Phenomena (UAP).","quote":"after decades of public denial the pentagon now admits there's something out there"},{"id":"0b33353d-a366-4435-b15a-28612b63037c","type":"administrative","location":"00:00:14.9-00:00:44.4","speaker":"Whitaker, Bill","text":"The United States Senate Select Committee on Intelligence (SSCI) ordered the Office of the Director of National Intelligence (ODNI) and the United States Department of Defense (DoD) to deliver a report on Unidentified Aerial Phenomena (UAP) by June 2021.","quote":"the intelligence committee has ordered the director of national intelligence and the secretary of defense to deliver a report on the mysterious sightings by next month"},{"id":"0a34a65d-4984-4c81-92f7-30d6017292e2","type":"administrative","location":"00:00:54.6-00:00:59.6","speaker":"Elizondo, Luis","text":"The United States government has officially confirmed for the public record that Unidentified Aerial Phenomena (UAP) are real.","quote":"The government has already stated for the record that they're real. I'm not telling you that. The United States government is telling you that."},{"id":"33450d54-2079-4cfb-8b99-f05dd6a162d6","type":"administrative","location":"00:01:02.4-00:01:11.5","speaker":"Whitaker, Bill","text":"Luis Elizondo spent 20 years managing military intelligence operations globally, including in Afghanistan.","quote":"Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan"},{"id":"153d5b43-302a-4412-94a8-61a892215883","type":"administrative","location":"00:01:02.4-00:01:11.5","speaker":"Whitaker, Bill","text":"Luis Elizondo spent 20 years managing military intelligence operations globally, including in the Middle East.","quote":"Luis Elizondo spent 20 years running military intelligence operations worldwide in... the Middle East"},{"id":"7b309072-7a76-4633-9236-7a6cafed4ad8","type":"administrative","location":"00:01:02.4-00:01:11.5","speaker":"Whitaker, Bill","text":"Luis Elizondo spent 20 years managing military intelligence operations globally, including in Cuba, Guantánamo Bay.","quote":"Luis Elizondo spent 20 years running military intelligence operations worldwide in... Guantanamo."},{"id":"abfca271-3421-454c-bc60-7474c2ec6d02","type":"administrative","location":"00:01:11.5-00:01:15.6","speaker":"Whitaker, Bill","text":"In 2008, Luis Elizondo was selected to join the Advanced Aerospace Threat Identification Program (AATIP) at the United States Department of Defense (DoD).","quote":"He hadn't given UFOs a second thought until 2008. That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP."},{"id":"5ea78a66-2f4f-4a0e-843a-f81b3c9c4baf","type":"administrative","location":"00:01:24.1-00:01:34.3","speaker":"Elizondo, Luis","text":"The objective of the Advanced Aerospace Threat Identification Program (AATIP) was to collect and analyse intelligence concerning Anomalous Aerial Vehicles (AAV).","quote":"The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles"},{"id":"350a41bf-5bb0-4eeb-85f8-972687207728","type":"administrative","location":"00:01:50.3-00:02:01.6","speaker":"Whitaker, Bill","text":"The Advanced Aerospace Threat Identification Program (AATIP) was established with a 22 million United States dollar budget to investigate Unidentified Flying Objects (UFO).","quote":"Buried away in the Pentagon, AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs."},{"id":"dc4cb865-5790-4cde-a64a-0d7498b23c23","type":"administrative","location":"00:01:50.3-00:02:01.6","speaker":"Whitaker, Bill","text":"Harry Reid sponsored the creation of the Advanced Aerospace Threat Identification Program (AATIP) within the United States Department of Defense (DoD).","quote":"AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs."},{"id":"9ffa7995-3808-4427-8407-981e8a374d7d","type":"administrative","location":"00:02:01.6-00:02:10.8","speaker":"Whitaker, Bill","text":"Luis Elizondo became the director of the Advanced Aerospace Threat Identification Program (AATIP) in 2010.","quote":"When Elizondo took over in 2010, he focused on the national security implications"},{"id":"e95a34f2-0d1c-4855-a8ee-8b02121d8e69","type":"administrative","location":"00:02:01.6-00:02:10.8","speaker":"Whitaker, Bill","text":"As director of the Advanced Aerospace Threat Identification Program (AATIP), Luis Elizondo focused on the national security implications of Unidentified Aerial Phenomena (UAP) encountered by United States military personnel.","quote":"he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members."},{"id":"f95812e3-b57f-4679-9169-e22b04b50ee2","type":"measurement","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Unidentified Aerial Phenomena (UAP) tracked by military sensors exhibit accelerations of 600 to 700 G-forces.","quote":"Imagine a technology that can do 600 to 700 G-forces... That's precisely what we're seeing."},{"id":"956415da-4394-4435-bcab-2b270740e534","type":"measurement","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Unidentified Aerial Phenomena (UAP) tracked by military sensors reach speeds of approximately 21,000 kilometres per hour.","quote":"that can fly at 13,000 miles an hour... That's precisely what we're seeing."},{"id":"48f0b936-df04-485f-95ff-ea5
