2a339ef","type":"observation","location":"00:08:30.5-00:09:08.9","speaker":"David Fravor","text":"David Fravor observed that the tic-tac-shaped object disappeared when it got directly in front of him during the 2004 USS Nimitz encounter.","quote":"And when it gets right in front of me, it just disappears."},{"id":"783d9a31-2be9-42ef-83eb-e296cbe7716a","type":"observation","location":"00:08:30.5-00:09:08.9","speaker":"David Fravor","text":"David Fravor described the disappearance of the tic-tac-shaped object as it suddenly vanishing during the 2004 USS Nimitz encounter.","quote":"Disappears, like gone. It had sped off."},{"id":"0b64dd20-0a89-4ed4-b18c-017fabe16a18","type":"observation","location":"00:08:30.5-00:09:08.9","speaker":"Alex Dietrich","text":"Alex Dietrich initially tried to categorize the tic-tac-shaped object as possibly a helicopter or drone during the 2004 USS Nimitz encounter.","quote":"So your mind tries to make sense of it. I'm going to categorize this as maybe a helicopter or maybe a drone."},{"id":"9eafa46c-3ed3-4338-9d44-ba3ebd655a73","type":"testimony","location":"00:08:30.5-00:09:08.9","speaker":"Alex Dietrich","text":"Alex Dietrich confirmed that her backseater also witnessed the tic-tac-shaped object during the 2004 USS Nimitz encounter.","quote":"Did your back seaters see this too? Yeah."},{"id":"b161bc4c-12d9-400f-8e2e-c92a3a2e1105","type":"testimony","location":"00:08:30.5-00:09:08.9","speaker":"David Fravor","text":"David Fravor confirmed that all four people in the two aircraft witnessed the tic-tac-shaped object for approximately five minutes during the 2004 USS Nimitz encounter.","quote":"Oh, yeah. There was four of us in the airplanes literally watching this thing for roughly about five minutes."},{"id":"113af711-1608-4103-9d8d-513f5861a769","type":"observation","location":"00:09:08.9-00:09:20.8","speaker":null,"text":"Seconds after the disappearance of the tic-tac-shaped object, the USS Princeton reacquired the target 60 miles away.","quote":"Seconds later, the Princeton reacquired the target, 60 miles away."},{"id":"040beca7-94f4-4133-a9b0-ef892087d4c8","type":"observation","location":"00:09:08.9-00:09:20.8","speaker":null,"text":"Another crew briefly locked onto the tic-tac-shaped object with a targeting camera before it disappeared again during the 2004 USS Nimitz encounter.","quote":"Another crew managed to briefly lock onto it with a targeting camera before it zipped off again."},{"id":"1ebb9bd3-d506-4c49-9eb4-78a2444c8601","type":"opinion","location":"00:09:20.8-00:09:45.5","speaker":"David Fravor","text":"David Fravor believes that if he had witnessed the tic-tac-shaped object alone, he might not have reported it because it sounds unbelievable.","quote":"You know, I think that over beers, we've sort of said, hey, man, if I saw this solo, I don't know that I would have come back and said anything because it sounds so crazy when I say it."},{"id":"2e2a7a50-4395-4d1d-b62f-aecc08db0327","type":"opinion","location":"00:09:20.8-00:09:45.5","speaker":"David Fravor","text":"David Fravor understands why people might be reluctant to report Unidentified Aerial Phenomena (UAP) sightings.","quote":"You understand that reaction?"},{"id":"d3bef25e-fe5b-4cae-ade9-da0010ed0f4f","type":"testimony","location":"00:09:20.8-00:09:45.5","speaker":"David Fravor","text":"David Fravor has been told that describing the tic-tac-shaped object makes him sound crazy.","quote":"I've had some people tell me, you know, when you say that, you can sound crazy."},{"id":"37844ec7-1ad6-4284-9413-75e045e36814","type":"opinion","location":"00:09:20.8-00:09:45.5","speaker":"David Fravor","text":"David Fravor does not consider himself a UFO enthusiast.","quote":"I'll be honest. I'm not a UFO guy."},{"id":"25f94849-7211-416a-96b5-2eb649318d0b","type":"opinion","location":"00:09:20.8-00:09:45.5","speaker":"David Fravor","text":"David Fravor acknowledges that there is something out there better than conventional aircraft.","quote":"But from what I hear you guys saying, there's something."},{"id":"2cbbed9c-71e6-4be7-80e8-d8d62f43cbd9","type":"opinion","location":"00:09:20.8-00:09:45.5","speaker":"David Fravor","text":"David Fravor is certain that there is technology superior to current human-built aircraft operating in Earth's airspace.","quote":"There's definitely something that, I don't know who's building it, who's got the technology, who's got the brains, but there's something out there that was better than our airplane."},{"id":"f1f11d49-cbb1-4482-a2e5-e76424dee809","type":"administrative","location":"00:09:56.5-00:10:13.2","speaker":null,"text":"The air crew filed reports about the 2004 USS Nimitz encounter.","quote":"The air crew filed reports."},{"id":"8731e9e0-e28f-4074-a14f-ef36477b271d","type":"administrative","location":"00:09:56.5-00:10:13.2","speaker":null,"text":"The Nimitz encounter received no official acknowledgment or action for five years after it occurred.","quote":"Then, like the mysterious flying object, the Nimitz encounter disappeared. Nothing was said or done officially for five years"},{"id":"f37da225-e7cb-4b88-801f-e10fdc4d6561","type":"administrative","location":"00:09:56.5-00:10:13.2","speaker":null,"text":"Luis Elizondo investigated the 2004 USS Nimitz encounter five years after it occurred.","quote":"until Lou Elizondo came across the story and investigated."},{"id":"c1ebd9a8-28da-453a-b172-e953d78ec3e7","type":"opinion","location":"00:10:13.2-00:10:48.8","speaker":"Luis Elizondo","text":"Luis Elizondo considers it compelling that pilots trained at great expense are witnessing phenomena they cannot explain.","quote":"We spend millions of dollars in training these pilots, and they are seeing something that they can't explain. Furthermore, that information's being backed up on electro-optical data, like gun camera footage, and by radar data. Now, to me, that's compelling."},{"id":"c48c4b0d-3504-46ce-a286-79338d14fe8b","type":"observation","location":"00:10:13.2-00:10:48.8","speaker":"Luis Elizondo","text":"The pilot reports of Unidentified Aerial Phenomena (UAP) are backed up by electro-optical data such as gun camera footage.","quote":"Furthermore, that information's being backed up on electro-optical data, like gun camera footage, and by radar data."},{"id":"0d71e5e4-ede0-4fe2-85da-25669be37e9a","type":"observation","location":"00:10:13.2-00:10:48.8","speaker":"Luis Elizondo","text":"The pilot reports of Unidentified Aerial Phenomena (UAP) are backed up by radar data.","quote":"Furthermore, that information's being backed up on electro-optical data, like gun camera footage, and by radar data."},{"id":"ecacb448-72f1-4058-a6d0-54167d2f2c07","type":"administrative","location":"00:10:13.2-00:10:48.8","speaker":null,"text":"Inside the Pentagon, Luis Elizondo's findings about Unidentified Aerial Phenomena (UAP) were met with skepticism.","quote":"Inside the Pentagon, his findings were met with skepticism."},{"id":"9face976-6c83-4c8c-a023-953e1d3758ba","type":"administrative","location":"00:10:13.2-00:10:48.8","speaker":null,"text":"The Advanced Aerospace Threat Identification Program (AATIP) lost its funding in 2012.","quote":"AATIP's funding was eliminated in 2012"},{"id":"b26b3d6d-75fb-4daf-88b5-32161b841c70","type":"administrative","location":"00:10:13.2-00:10:48.8","speaker":null,"text":"After AATIP lost its funding in 2012, Luis Elizondo and a small group continued the mission unofficially.","quote":"but Elizondo says he and a handful of others kept the mission alive."},{"id":"0188dfd5-7497-4242-93a7-bb324179917e","type":"administrative","location":"00:10:13.2-00:10:48.8","speaker":null,"text":"Luis Elizondo quit the Pentagon in 2017 after becoming frustrated with the lack of progress on Unidentified Aerial Phenomena (UAP).","quote":"until finally, frustrated, he quit the Pentagon in 2017"},{"id":"8fc2435e-3e10-42b3-9f54-9862b3391019","type":"administrative","location":"00:10:13.2-00:10:48.8","speaker":null,"text":"Before leaving the Pentagon in 2017, Luis Elizondo had three videos declassified.","quote":"but not before getting these three videos declassified."},{"id":"c5b5897c-8311-4db0-aa46-18178d3e063b","type":"administrative","location":"00:10:51.9-00:11:26.2","speaker":"Christopher Mellon","text":"Christopher Mellon attempted to help Luis Elizondo elevate the Unidentified Aerial Phenomena (UAP) issue within the Department of Defense.","quote":"I tried to help my colleague, Lou Elizondo, elevate the issue in the department and actually get it to the Secretary of Defense."},{"id":"67f07c63-ef39-4459-9c82-87b66f2223ea","type":"administrative","location":"00:10:51.9-00:11:26.2","speaker":null,"text":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence during the administrations of Presidents Clinton and George W. Bush.","quote":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush, and had access to top-secret government programs."},{"id":"64ea1caf-f98c-499a-853e-93de67958169","type":"administrative","location":"00:10:51.9-00:11:26.2","speaker":null,"text":"Christopher Mellon had access to top-secret government programs during his time at the Department of Defense.","quote":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush, and had access to top-secret government programs."},{"id":"0b0e1da6-2987-4ec9-95d2-d84263b100cc","type":"opinion","location":"00:10:51.9-00:11:26.2","speaker":"Christopher Mellon","text":"Christopher Mellon is confident that the observed Unidentified Aerial Phenomena (UAP) are not U.S. technology.","quote":"So it's not us, that's one thing we know."},{"id":"797c42c3-105b-4e57-a282-e78740e6d860","type":"opinion","location":"00:10:51.9-00:11:26.2","speaker":"Christopher Mellon","text":"Christopher Mellon is confident with a very high degree of confidence that the observed Unidentified Aerial Phenomena (UAP) are not U.S. technology.","quote":"I could say that with a very high degree of confidence, in part because of the positions I held in the department, and I know the process."},{"id":"fdc08099-7564-41ed-b714-0a7c0b87dfa0","type":"administrative","location":"00:10:51.9-00:11:26.2","speaker":"Christopher Mellon","text":"Christopher Mellon became concerned that nothing was being done about Unidentified Aerial Phenomena (UAP) sightings.","quote":"Mellon says he grew concerned nothing was being done about UAPs, so he decided to do something."},{"id":"87f1fcb9-07a3-4dc9-b40a-4e0ae1613f3e","type":"administrative","location":"00:10:51.9-00:11:26.2","speaker":null,"text":"In 2017, Christopher Mellon, as a private citizen, acquired the three Navy videos that Luis Elizondo had declassified.","quote":"In 2017, as a private citizen, he surreptitiously acquired the three Navy videos Elizondo had declassified and leaked them to The New York Times."},{"id":"a22189c5-d0e6-4a31-8360-5b26017ceac5","type":"administrative","location":"00:10:51.9-00:11:26.2","speaker":null,"text":"In 2017, Christopher Mellon leaked the three Navy videos to The New York Times.","quote":"In 2017, as a private citizen, he surreptitiously acquired the three Navy videos Elizondo had declassified and leaked them to The New York Times."},{"id":"bf27d2ac-5e4b-4bb3-b9f7-eb3e5c1821d9","type":"opinion","location":"00:11:37.0-00:12:20.1","speaker":"Christopher Mellon","text":"Christopher Mellon considers it bizarre and unfortunate that he had to leak videos to get a national security issue about Unidentified Aerial Phenomena (UAP) on the agenda.","quote":"It's bizarre and unfortunate that someone like myself has to do something like that to get a national security issue like this on the agenda."},{"id":"744cd203-bc23-4643-b20f-9f974249db7e","type":"administrative","location":"00:11:37.0-00:12:20.1","speaker":null,"text":"After leaving government service, Christopher Mellon joined forces with Luis Elizondo to raise awareness about Unidentified Aerial Phenomena (UAP).","quote":"He joined forces with now civilian Lou Elizondo, and they started to tell their story to anybody who would listen, to newspapers, the History Channel, to members of Congress."},{"id":"bc341fed-d978-4adc-8caa-9dfc587bea49","type":"administrative","location":"00:11:37.0-00:12:20.1","speaker":null,"text":"Christopher Mellon and Luis Elizond shared their story about Unidentified Aerial Phenomena (UAP) with newspapers, the History Channel, and members of Congress.","quote":"He joined forces with now civilian Lou Elizondo, and they started to tell their story to anybody who would listen, to newspapers, the History Channel, to members of Congress."},{"id":"52fb3c8c-b83e-4c1c-8bd3-54e9b069b59c","type":"opinion","location":"00:11:37.0-00:12:20.1","speaker":"Christopher Mellon","text":"Christopher Mellon believed it was necessary to raise public interest in Unidentified Aerial Phenomena (UAP) to generate Congressional interest and eventually prompt action from the Department of Defense.","quote":"We knew and understood that you had to go to the public, get the public interested to get Congress interested, to then circle back to the Defense Department and get them to start taking a look at it."},{"id":"58bb51f1-1055-4586-996d-940b904f3b13","type":"administrative","location":"00:11:37.0-00:12:20.1","speaker":null,"text":"In the previous August (likely 2020), the Pentagon resurrected the Advanced Aerospace Threat Identification Program (AATIP) as the Unidentified Aerial Phenomena Task Force.","quote":"This past August, the Pentagon resurrected AATIP. It's now called the UAP Task Force."},{"id":"934f942c-24b5-431f-8a51-5d29c24bff5c","type":"administrative","location":"00:11:37.0-00:12:20.1","speaker":null,"text":"Service members are now encouraged to report strange encounters with Unidentified Aerial Phenomena (UAP).","quote":"Service members now are encouraged to report strange encounters."},{"id":"281288e3-2031-400a-b605-ef8486c203da","type":"administrative","location":"00:11:37.0-00:12:20.1","speaker":null,"text":"The United States Senate is seeking answers about Unidentified Aerial Phenomena (UAP).","quote":"And the Senate wants answers."},{"id":"36620e7e-6e8d-44d1-a19e-dc84e7ac430e","type":"opinion","location":"00:12:22.6-00:13:28.3","speaker":"Marco Rubio","text":"Marco Rubio considers any object entering U.S. airspace without authorization to be a threat.","quote":"Anything that enters an airspace that's not supposed to be there is a threat."},{"id":"a9f6cc70-2208-428f-be36-30e798b0a593","type":"administrative","location":"00:12:22.6-00:13:28.3","speaker":null,"text":"After receiving classified briefings on Unidentified Aerial Phenomena (UAP), Senator Marco Rubio called for a detailed analysis.","quote":"After receiving classified briefings on UAPs, Senator Marco Rubio called for a detailed analysis."},{"id":"37631545-60b8-4abc-a395-54895d052149","type":"administrative","location":"00:12:22.6-00:13:28.3","speaker":null,"text":"In the previous December (likely 2020), while still head of the Intelligence Committee, Senator Marco Rubio asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report on Unidentified Aerial Phenomena (UAP) by the following month.","quote":"This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month."},{"id":"87e6404a-0d4b-4bf5-8143-1579c1f22f33","type":"opinion","location":"00:12:22.6-00:13:28.3","speaker":"Marco Rubio","text":"Marco Rubio considers the issue of Unidentified Aerial Phenomena (UAP) bizarre.","quote":"This is a bizarre issue."},{"id":"e9e0022e-e323-4a69-a3e5-d26d8ee9711f","type":"opinion","location":"00:12:22.6-00:13:28.3","speaker":"Marco Rubio","text":"Marco Rubio noted that the Pentagon and other military branches have historically dismissed Unidentified Aerial Phenomena (UAP).","quote":"The Pentagon and other branches of the military have a long history of sort of dismissing this."},{"id":"6684c586-e09d-4083-a144-11273b3cf19c","type":"opinion","location":"00:12:22.6-00:13:28.3","speaker":"Marco Rubio","text":"Marco Rubio believes that the upcoming report will determine whether this time is different from previous efforts to investigate Unidentified Aerial Phenomena (UAP).","quote":"What makes you think that this time is going to be different? I mean, we're going to find out when we get that report."},{"id":"a435e8db-9407-4804-8743-0ae4e21f8052","type":"opinion","location":"00:12:22.6-00:13:28.3","speaker":"Marco Rubio","text":"Marco Rubio acknowledges that there is a stigma on Capitol Hill regarding Unidentified Aerial Phenomena (UAP).","quote":"You know, there's a stigma on Capitol Hill."},{"id":"8db6c387-6029-4155-8faf-490e07cdb822","type":"testimony","location":"00:12:22.6-00:13:28.3","speaker":"Marco Rubio","text":"Marco Rubio reports that some of his colleagues giggle when the topic of Unidentified Aerial Phenomena (UAP) is brought up.","quote":"I mean, some of my colleagues are very interested in this topic and some kind of, you know, giggle when you bring it up."},{"id":"6f8545d2-2cb9-4141-ae13-76ef7017adec","type":"opinion","location":"00:12:22.6-00:13:28.3","speaker":"Marco Rubio","text":"Marco Rubio believes the stigma should not prevent finding answers about Unidentified Aerial Phenomena (UAP).","quote":"But I don't think we can allow the stigma to keep us from having an answer to a very fundamental question."},{"id":"2b25f3cd-1168-4219-bac0-906ff0a504e7","type":"opinion","location":"00:12:22.6-00:13:28.3","speaker":"Marco Rubio","text":"Marco Rubio wants a serious process for analyzing data on Unidentified Aerial Phenomena (UAP).","quote":"I want us to take it seriously and have a process to take it seriously. I want us to have a process to analyze the data. every time it comes in, that there be a place where this is cataloged and constantly analyzed until we get some answers."},{"id":"2ed30085-b30e-464a-9dec-d85c30e0395a","type":"opinion","location":"00:12:22.6-00:13:28.3","speaker":"Marco Rubio","text":"Marco Rubio believes that Unidentified Aerial Phenomena (UAP) may have a simple explanation or may not.","quote":"Maybe it has a very simple answer. Maybe it doesn't."},{"id":"90c78327-dab5-4dc8-9e80-e1b2cc2236a7","type":"testimony","location":"00:13:35.4-00:13:44.3","speaker":"Alex Dietrich","text":"Alex Dietrich expressed feeling vulnerable due to having no defense against the Unidentified Aerial Phenomena (UAP).","quote":"I felt the vulnerability of not having anything to defend ourselves."}],"nodes":[{"id":"b089396b-f360-4e4f-b81c-8ef04fef8e6f","type":"person","name":"Whitaker, Bill"},{"id":"ac91289a-de61-4293-b1d4-70041695f495","type":"person","name":"Elizondo, Luis"},{"id":"86bc28dd-520d-48e7-99e1-35b24dce7bf3","type":"person","name":"Reid, Harry"},{"id":"8cac9c3f-7a74-4e9d-8d3c-af99e3f3b6d1","type":"person","name":"Graves, Ryan"},{"id":"38251446-5e32-44b6-9c27-657e1bd6f535","type":"person","name":"Fravor, David"},{"id":"79d93c69-c803-4a96-bc96-9b8247492837","type":"person","name":"Dietrich, Alex"},{"id":"2d0dfe52-ea88-45bf-9684-8904ae99eb71","type":"person","name":"Mellon, Christopher"},{"id":"07e8eebe-2f90-4132-971d-1aad9c62f905","type":"person","name":"Rubio, Marco"},{"id":"29b3d048-d23f-4d8a-b8f5-0876163eb525","type":"organisation","name":"United States Navy"},{"id":"2ff892d4-4ff6-4887-9b26-d5e354ac263f","type":"organisation","name":"Pentagon"},{"id":"8e229ade-64e4-4d34-a52a-a8de2b2cef9a","type":"organisation","name":"United States Senate"},{"id":"02335ae9-7ddb-49f8-a4d3-a1d2040b47fe","type":"organisation","name":"United States Congress"},{"id":"60de576e-df6b-4128-ab0c-4bbffae83135","type":"organisation","name":"Department of Defense (DoD)"},{"id":"e0c41cd6-22bf-4b95-beb5-2a49c42aeaeb","type":"organisation","name":"Office of the Director of National Intelligence (ODNI)"},{"id":"235ffb16-4bbc-4d52-b411-73d4511a95ca","type":"organisation","name":"Naval Flight School (Top Gun)"},{"id":"a8933693-65db-4273-a360-9d584cc6ee19","type":"organisation","name":"The New York Times"},{"id":"0ea9e503-4b3f-424e-8108-37930c1272b6","type":"organisation","name":"History Channel"},{"id":"30230918-7ff5-438a-bf68-3d6b0955f766","type":"organisation","name":"United States Senate Select Committee on Intelligence"},{"id":"bde7edf1-a5a6-42db-b64b-a3798706d352","type":"organisation","name":"Unidentified Aerial Phenomena Task Force (UAP Task Force)"},{"id":"eacea804-865b-4e3d-bdf8-8b91d915abfe","type":"project","name":"Advanced Aerospace Threat Identification Program (AATIP)"},{"id":"9065e4b9-8de1-435b-abb0-413a5decdb04","type":"project","name":"Project Blue Book"},{"id":"7881ed8d-37a5-4c4f-b6e5-63abaf063811","type":"place","name":"USA, Virginia, Virginia Beach"},{"id":"1e22816d-9d6c-41fc-b2dc-1fa6a6869d9f","type":"place","name":"USA, Florida, Jacksonville"},{"id":"b4244575-21a6-4e3c-96fb-4e9add8536da","type":"place","name":"USA, California, San Diego"},{"id":"c93ad8fc-ed47-4085-93b1-08829a331fd9","type":"place","name":"USA, Atlantic Coast"},{"id":"b6388de1-f13e-4db4-9a5a-2a359ce25fdb","type":"place","name":"USA, Washington, Pentagon"},{"id":"eb1eaeee-f583-4641-8423-67d7899232f2","type":"event","name":"2004 USS Nimitz UAP encounter"},{"id":"21eb89c1-2ffd-499d-a1b3-c357291fbe01","type":"event","name":"2015 USS Princeton UAP encounter"},{"id":"f69275a7-36ce-4a79-8e74-636dbc376b52","type":"object","name":"F/A-18"},{"id":"f9f777be-e73e-45fa-968f-3662d442a346","type":"object","name":"USS Nimitz"},{"id":"8b8ed65c-6f00-4c3e-8340-0f52a7e81a1c","type":"object","name":"USS Princeton"},{"id":"085d9fb4-31bd-4c92-aa1f-11916d58c240","type":"organisation","name":"Carrier Strike Group 11 (CSG-11)"},{"id":"d6741a8b-770c-4d85-860e-7bd61a03d991","type":"object","name":"Navy targeting camera"},{"id":"79c691cf-5621-4765-8e11-13b7b142f0b9","type":"document","name":"UAP videos"},{"id":"3ff848a2-1074-417f-8b51-8e058271e3b3","type":"topic","name":"Unidentified Aerial Phenomena (UAP)"},{"id":"a896ef46-c91b-49d8-844a-612abf763168","type":"topic","name":"Anomalous Aerial Vehicle (AAV)"}]},{"id":"z-ai_glm-5.1","name":"z-ai / glm-5.1","errata":null,"claims":[{"id":"3ca6c436-9779-4894-87a7-5ed68af60fcc","type":"administrative","location":"00:00:07.6-00:00:14.9","speaker":null,"text":"The United States government has acknowledged Unidentified Aerial Phenomena (UAP) after decades of public denial.","quote":"the U.S. government's grudging acknowledgement of Unidentified Aerial Phenomena, UAP, more commonly known as ufos after decades of public denial"},{"id":"d361d3a6-36e9-4e7c-a6e1-fd297b302124","type":"administrative","location":"00:00:14.9-00:00:19.0","speaker":null,"text":"The Pentagon admits there is something out there that is unidentified.","quote":"the pentagon now admits there's something out there"},{"id":"67fac53a-66e6-4192-89ec-3089709b70ed","type":"administrative","location":"00:00:19.0-00:00:29.0","speaker":null,"text":"The United States Senate Select Committee on Intelligence ordered the Director of National Intelligence and the Secretary of Defense to deliver a report on UAP sightings.","quote":"the intelligence committee has ordered the director of national intelligence and the secretary of defense to deliver a report on the mysterious sightings by next month"},{"id":"52b98f8e-c747-4665-a479-d077203a05d6","type":"testimony","location":"00:00:54.6-00:00:59.6","speaker":"Elizondo, Luis","text":"The United States government has stated for the record that Unidentified Aerial Phenomena (UAP) are real.","quote":"The government has already stated for the record that they're real. I'm not telling you that. The United States government is telling you that."},{"id":"6573b1a9-7056-4c2d-9fc6-e2b2a89479c7","type":"biographical","location":"00:01:02.4-00:01:11.5","speaker":null,"text":"Luis Elizondo spent 20 years running military intelligence operations worldwide.","quote":"Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo."},{"id":"49eb191c-fdec-4e9c-89b3-659a255fb218","type":"biographical","location":"00:01:11.5-00:01:15.6","speaker":null,"text":"Luis Elizondo had not given Unidentified Flying Objects (UFO) serious consideration until 2008.","quote":"He hadn't given UFOs a second thought until 2008."},{"id":"1b95cd99-eded-43ce-ba30-5c8f86346b9b","type":"biographical","location":"00:01:15.6-00:01:24.1","speaker":null,"text":"In 2008, Luis Elizondo was asked to join the Advanced Aerospace Threat Identification Program (AATIP) at the Pentagon.","quote":"That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP."},{"id":"d03ce220-3ae5-4c45-946a-c65dfc1ccec7","type":"testimony","location":"00:01:24.1-00:01:34.3","speaker":"Elizondo, Luis","text":"The mission of the Advanced Aerospace Threat Identification Program (AATIP) was to collect and analyse information involving Anomalous Aerial Vehicles (AAV).","quote":"The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs."},{"id":"aab033b3-c878-4464-bdad-dcd98deac669","type":"testimony","location":"00:01:34.3-00:01:35.9","speaker":"Elizondo, Luis","text":"The Advanced Aerospace Threat Identification Program (AATIP) referred to Anomalous Aerial Vehicles (AAV) as Unidentified Aerial Phenomena (UAP).","quote":"We call them UAPs."},{"id":"b23f5257-e55f-4bde-b071-7a8ad370db90","type":"administrative","location":"00:01:50.3-00:02:01.6","speaker":null,"text":"The Advanced Aerospace Threat Identification Program (AATIP) was part of a $22 million programme sponsored by Harry Reid to investigate Unidentified Flying Objects (UFO).","quote":"Buried away in the Pentagon, AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs."},{"id":"36d18d6d-000e-4db2-910e-25912665779f","type":"biographical","location":"00:02:01.6-00:02:10.8","speaker":null,"text":"Luis Elizondo took over the Advanced Aerospace Threat Identification Program (AATIP) in 2010.","quote":"When Elizondo took over in 2010"},{"id":"4be7c6f5-f9de-4f5e-bc25-98e4dd56f85b","type":"testimony","location":"00:02:01.6-00:02:10.8","speaker":"Elizondo, Luis","text":"Upon taking over the Advanced Aerospace Threat Identification Program (AATIP), Luis Elizondo focused on the national security implications of Unidentified Aerial Phenomena (UAP) documented by US service members.","quote":"he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members."},{"id":"913b6a9a-30f4-45f7-a9de-6aa7d624cfe0","type":"testimony","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Unidentified Aerial Phenomena (UAP) can perform 600 to 700 G-forces.","quote":"Imagine a technology that can do 600 to 700 G-forces"},{"id":"9d90a063-be66-4049-8ba6-83cc39d9f37e","type":"testimony","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Unidentified Aerial Phenomena (UAP) can fly at approximately 21,000 kilometres per hour.","quote":"that can fly at 13,000 miles an hour"},{"id":"2a3db032-3ec9-4d82-8580-57b17e35fca7","type":"testimony","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Unidentified Aerial Phenomena (UAP) can evade radar.","quote":"that can evade radar"},{"id":"804e651a-8780-46b8-ab04-5ef225287187","type":"testimony","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Unidentified Aerial Phenomena (UAP) can fly through air, water, and possibly space.","quote":"that can fly through air and water and possibly space"},{"id":"cef9cdfc-3f3b-433c-8d60-042c3a41bde2","type":"testimony","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Unidentified Aerial Phenomena (UAP) have no obvious signs of propulsion.","quote":"has no obvious signs of propulsion"},{"id":"4e85a198-3b3a-4914-bd5f-e5dff1246e8a","type":"testimony","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Unidentified Aerial Phenomena (UAP) have no wings and no control surfaces.","quote":"no wings, no control surfaces"},{"id":"cb05dbf9-7e20-44cd-b314-3a42a9aa5634","type":"testimony","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Unidentified Aerial Phenomena (UAP) can defy the natural effects of Earth's gravity.","quote":"yet still can defy the natural effects of Earth's gravity"},{"id":"324c7838-1f84-4da8-9104-99c6e50a7543","type":"testimony","location":"00:02:37.0-00:02:47.7","speaker":null,"text":"The Advanced Aerospace Threat Identification Program (AATIP) was a loose-knit mix of scientists, electro-optical engineers, avionics experts, and intelligence experts, often working part-time.","quote":"Elizondo tells us AATIP was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time."},{"id":"aa51d57c-3561-42e4-b7c5-f0ee8a434fcb","type":"testimony","location":"00:02:47.7-00:02:57.7","speaker":null,"text":"The Advanced Aerospace Threat Identification Program (AATIP) combed through data, records, and analysed video footage of Unidentified Aerial Phenomena (UAP).","quote":"They combed through data and records and analyzed videos like this."},{"id":"97d9f841-f77e-4aa0-ac9d-a8e085acf41b","type":"observation","location":"00:02:57.7-00:03:07.3","speaker":null,"text":"During the 2015 Atlantic Coast UAP sightings, a United States Navy aircrew struggled to lock onto a fast-moving Unidentified Aerial Phenomenon (UAP) off the US Atlantic coast.","quote":"A Navy aircrew struggles to lock onto a fast-moving object off the U.S. Atlantic coast in 2015."},{"id":"624771e5-91cb-404d-9629-f887cb89b6d8","type":"administrative","location":"00:03:07.3-00:03:20.4","speaker":null,"text":"The Pentagon admits it cannot identify the objects shown in recently released UAP images.","quote":"the Pentagon admits it doesn't know what in the world this is, or this, or this."},{"id":"8eb95500-b3e6-40a3-b783-0964a50dcba1","type":"testimony","location":"00:03:30.4-00:03:38.6","speaker":"Elizondo, Luis","text":"Some Unidentified Aerial Phenomena (UAP) sightings have simple explanations, but some do not.","quote":"In some cases, there are simple explanations for what people are witnessing, but there are some that that are not."},{"id":"455dbe2f-e8cc-402b-9e82-fc2efb55cae4","type":"testimony","location":"00:03:38.6-00:03:52.6","speaker":"Elizondo, Luis","text":"The Advanced Aerospace Threat Identification Program (AATIP) conducted due diligence on Unidentified Aerial Phenomena (UAP) sightings, considering possibilities such as Chinese cruise missile technology and high-altitude reconnaissance balloons.","quote":"We're going through our due diligence. Is it some sort of new type of cruise missile technology that China has developed? Is it some sort of high-altitude balloon that's conducting reconnaissance?"},{"id":"005673db-3026-468f-8c73-cede88a66109","type":"opinion","location":"00:03:52.6-00:04:06.2","speaker":"Elizondo, Luis","text":"When all conventional explanations for Unidentified Aerial Phenomena (UAP) are exhausted and the phenomenon remains in US airspace, it becomes compelling and problematic.","quote":"Ultimately, when you have exhausted all those what-ifs and you're still left with the fact that this is in our airspace and it's real, that's when it becomes compelling and that's when it becomes problematic."},{"id":"1f73e635-4a3a-4348-94cc-60cd7d3d6174","type":"opinion","location":"00:04:06.2-00:04:12.9","speaker":"Graves, Ryan","text":"Ryan Graves considers Unidentified Aerial Phenomena (UAP) a security risk.","quote":"Former Navy pilot Lieutenant Ryan Graves calls whatever is out there a security risk."},{"id":"d4d58ec5-5bde-4ae2-a7ed-3bed63671385","type":"testimony","location":"00:04:12.9-00:04:29.7","speaker":"Graves, Ryan","text":"Ryan Graves's F/A-18 squadron began seeing Unidentified Aerial Phenomena (UAP) hovering over restricted airspace southeast of Virginia Beach in 2014 after updating their jet's radar, which made it possible to zero in with infrared targeting cameras.","quote":"He told us his F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar, making it possible to zero in with infrared targeting cameras."},{"id":"c2ea6854-9b3a-473e-a75f-ff8363e90de0","type":"opinion","location":"00:04:29.7-00:04:37.1","speaker":"Graves, Ryan","text":"The dual radar-and-infrared detection of Unidentified Aerial Phenomena (UAP) is hard to spoof.","quote":"Bill Whitaker: So you're seeing it both with the radar and with the infrared, and that tells you that there is something out there. Ryan Graves: Pretty hard to spoof that."},{"id":"fae56be8-8912-4796-a5d7-ac6ce1bcf0aa","type":"observation","location":"00:04:38.6-00:04:43.0","speaker":null,"text":"Photographs of Unidentified Aerial Phenomena (UAP) were taken in 2019 in the area southeast of Virginia Beach.","quote":"These photographs were taken in 2019 in the same area."},{"id":"e7a9d2a8-4aed-4a82-81da-606ef918b5ae","type":"administrative","location":"00:04:43.0-00:04:48.2","speaker":null,"text":"The Pentagon confirms that the 2019 images show objects it cannot identify.","quote":"The Pentagon confirms these are images of objects it can't identify."},{"id":"f36188b3-aff1-46c8-9ffb-2d42999708ee","type":"testimony","location":"00:04:48.2-00:05:02.5","speaker":"Graves, Ryan","text":"Pilots training off the Atlantic coast observed Unidentified Aerial Phenomena (UAP) every day for at least a couple of years.","quote":"Bill Whitaker: Every day for a couple of years? Ryan Graves: Mm-hmm."},{"id":"2cccc155-d2dd-4394-80d0-ef6f2e7d5e33","type":"observation","location":"00:05:01.2-00:05:02.5","speaker":"Graves, Ryan","text":"Ryan Graves observed no exhaust plume on the Unidentified Aerial Phenomena (UAP).","quote":"I don't see an exhaust plume."},{"id":"17e134c2-41f5-4ab2-9784-d3a9432f330c","type":"observation","location":"00:05:04.3-00:05:12.8","speaker":null,"text":"During the 2015 Atlantic Coast UAP sightings, members of Ryan Graves's squadron captured a Unidentified Aerial Phenomenon (UAP) on a targeting camera off the coast of Jacksonville, Florida.","quote":"including this one, off the coast of Jacksonville, Florida in 2015, captured on a targeting camera by members of Graves' squadron."},{"id":"1c47d762-3514-4b2e-b5bf-d05f8b46fabd","type":"observation","location":"00:05:12.8-00:05:17.1","speaker":null,"text":"During the 2015 Atlantic Coast UAP sightings, the observed Unidentified Aerial Phenomena (UAP) were rotating.","quote":"It's rotating."},{"id":"d3b6b376-775a-4271-9dfa-5fb08bfe17b7","type":"observation","location":"00:05:17.9-00:05:23.8","speaker":null,"text":"During the 2015 Atlantic Coast UAP sightings, multiple Unidentified Aerial Phenomena (UAP) were moving against the wind, which was approximately 220 kilometres per hour to the west.","quote":"They're all going against the wind. The wind's 120 knots far west."},{"id":"43758ec4-c51d-4497-829c-1aa38935b5be","type":"observation","location":"00:05:25.4-00:05:27.9","speaker":"Graves, Ryan","text":"Ryan Graves observed that the aircrew in the 2015 Atlantic Coast UAP sighting footage seemed amazed at what they were seeing, breaking character.","quote":"They seem to have broke character a bit, and were just kind of amazed at what they were seeing."},{"id":"1eacc647-15a8-4219-a296-9f8efe1d4141","type":"observation","location":"00:05:35.8-00:05:42.5","speaker":"Graves, Ryan","text":"The Unidentified Aerial Phenomena (UAP) observed off Jacksonville during the 2015 Atlantic Coast UAP sightings exhibited rotation, high altitudes, and propulsion.","quote":"You have rotation, you have high altitudes, you have propulsion, right?"},{"id":"428cef8a-dabd-404e-a8fe-d33030fdb9f7","type":"testimony","location":"00:05:42.5-00:05:42.8","speaker":"Graves, Ryan","text":"Ryan Graves does not know what the Unidentified Aerial Phenomena (UAP) are.","quote":"I don't know what it is, frankly."},{"id":"e56f21ee-8d43-4432-814d-555f8d5ca9f9","type":"testimony","location":"00:05:44.9-00:05:50.0","speaker":"Graves, Ryan","text":"Pilots speculate that Unidentified Aerial Phenomena (UAP) are one of three things: secret US technology, an adversary spy vehicle, or something otherworldly.","quote":"He told us pilots speculate they are one of three things, secret U.S. technology, an adversary spy vehicle, or something otherworldly."},{"id":"f58d8dae-ff13-4ecb-a4ba-b042a7d5e15d","type":"opinion","location":"00:05:56.0-00:06:00.5","speaker":"Graves, Ryan","text":"Ryan Graves considers the highest probability to be that Unidentified Aerial Phenomena (UAP) are a threat observation programme.","quote":"I'd say, you know, the highest probability is it's a threat observation program."},{"id":"a413a987-a41b-4d2e-af42-8192c40f01a7","type":"opinion","location":"00:06:00.5-00:06:04.1","speaker":"Graves, Ryan","text":"Ryan Graves considers Russian or Chinese technology a possible explanation for the observed Unidentified Aerial Phenomena (UAP).","quote":"Bill Whitaker: Could it be Russian or Chinese technology? Ryan Graves: I don't see why not."},{"id":"85a0fe8c-02d6-4e90-9772-f4175acaf800","type":"opinion","location":"00:06:05.4-00:06:07.0","speaker":"Graves, Ryan","text":"Ryan Graves is worried about Unidentified Aerial Phenomena (UAP).","quote":"I am worried, frankly."},{"id":"12692459-61c7-45ac-9470-1a3af39eea17","type":"opinion","location":"00:06:07.0-00:06:13.6","speaker":"Graves, Ryan","text":"Ryan Graves believes that if Unidentified Aerial Phenomena (UAP) were tactical jets from another country, it would be treated as a massive issue.","quote":"if these were tactical jets from another country that were hanging out up there, it would be a massive issue."},{"id":"1e65ad9f-1cfb-47ab-8455-f387ca8819ec","type":"opinion","location":"00:06:13.6-00:06:18.5","speaker":"Graves, Ryan","text":"Ryan Graves believes the military is ignoring the fact that Unidentified Aerial Phenomena (UAP) are watching them every day.","quote":"We're happy to just ignore the fact that these are out there watching us every day."},{"id":"a281f214-a095-45c5-81e5-ccabeea05ca7","type":"administrative","location":"00:06:23.4-00:06:30.3","speaker":null,"text":"The US government closed Project Blue Book in 1969.","quote":"The government has ignored it, at least publicly, since closing its Project Blue Book investigation in 1969."},{"id":"819450da-a1b2-4603-a495-5ef0f050aebf","type":"observation","location":"00:06:30.3-00:06:40.8","speaker":null,"text":"The 2004 USS Nimitz UAP encounter was documented by radar, camera, and four naval aviators.","quote":"that began to change after an incident off Southern California in 2004, which was documented by radar, by camera, and four naval aviators."},{"id":"c91a98d2-e47a-4493-b401-b96c69a18a90","type":"biographical","location":"00:06:40.8-00:06:57.3","speaker":null,"text":"David Fravor is a graduate of the Top Gun Naval Flight School.","quote":"David Fravor, a graduate of the Top Gun Naval Flight School"},{"id":"e85920ce-c8aa-49ce-8961-a7e2dfcfda79","type":"biographical","location":"00:06:40.8-00:06:57.3","speaker":null,"text":"David Fravor was commander of the F/A-18 squadron on the USS Nimitz.","quote":"commander of the F-18 squadron on the USS Nimitz"},{"id":"ff59bacd-a6f9-4f05-a0ef-4c98c7b7ecf2","type":"biographical","location":"00:06:40.8-00:06:57.3","speaker":null,"text":"Alex Dietrich had never spoken publicly about the 2004 USS Nimitz UAP encounter prior to this interview.","quote":"Lieutenant Alex Dietrich, who has never spoken publicly about the encounter."},{"id":"bbb65c80-bbb1-4d6a-b3d8-4c530a0229b1","type":"testimony","location":"00:06:57.3-00:07:01.1","speaker":"Dietrich, Alex","text":"Alex Dietrich never wanted to appear on national television.","quote":"I never wanted to be on national TV, no offense."},{"id":"f64e2be2-c251-4735-bdbf-fd42bff08f02","type":"testimony","location":"00:07:02.7-00:07:14.4","speaker":"Dietrich, Alex","text":"Alex Dietrich feels a responsibility to share her encounter because she was in a government aircraft on duty and the information is unclassified.","quote":"Because I was in a government aircraft, because I was on the clock, and so I feel a responsibility to share what I can, and it is unclassified."},{"id":"ca37e3ac-43de-4931-a727-1519a5a654e4","type":"observation","location":"00:07:14.4-00:07:23.1","speaker":null,"text":"In 2004-11, the USS Nimitz Carrier Strike Group was training approximately 160 kilometres southwest of San Diego.","quote":"It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego."},{"id":"f6741aee-3848-45be-82a1-2ea1c4504fee","type":"observation","location":"00:07:23.1-00:07:39.3","speaker":null,"text":"For a week before 2004-11-14, the advanced radar on the USS Princeton detected multiple Anomalous Aerial Vehicles (AAV) over the horizon, descending approximately 24,000 metres in less than a second.","quote":"For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 80,000 feet in less than a second."},{"id":"3121d251-54b2-417d-a763-4cf0015ce5cb","type":"observation","location":"00:07:39.3-00:07:47.8","speaker":null,"text":"On 2004-11-14, David Fravor and Alex Dietrich, each with a weapons system officer in the backseat, were diverted to investigate the Anomalous Aerial Vehicles (AAV) detected by the USS Princeton.","quote":"On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate."},{"id":"3d1f1523-bd3b-49c8-ab80-7f714a6c8a8f","type":"observation","location":"00:07:47.8-00:07:55.9","speaker":null,"text":"During the 2004 USS Nimitz UAP encounter, David Fravor and Alex Dietrich found an area of roiling white water the size of a Boeing 737 in an otherwise calm blue sea.","quote":"They found an area of roiling white water the size of a 737 in an otherwise calm blue sea."},{"id":"f7bc43fc-4da6-4e9c-8238-ba24484633af","type":"observation","location":"00:07:55.9-00:08:06.3","speaker":"Fravor, David","text":"During the 2004 USS Nimitz UAP encounter, David Fravor saw a white tic-tac-looking Unidentified Aerial Phenomenon (UAP) moving above the whitewater area.","quote":"we saw this little white tic-tac-looking object. And it's just kind of moving above the whitewater area."},{"id":"d8e8f30c-b919-4016-9573-380e4a294bb7","type":"observation","location":"00:08:12.3-00:08:17.0","speaker":null,"text":"During the 2004 USS Nimitz UAP encounter, Alex Dietrich circled above while David Fravor descended for a closer look at the UAP.","quote":"As Dietrich circled above, Fravor went in for a closer look."},{"id":"772a17d8-12cd-4c61-9a5c-f2c307a52243","type":"observation","location":"00:08:17.9-00:08:24.5","speaker":"Fravor, David","text":"During the 2004 USS Nimitz UAP encounter, the UAP turned abruptly and began mirroring David Fravor's movements as he spiralled down.","quote":"The tic-tac's still pointing north-south. It goes and just turns abruptly and starts mirroring me. So as I'm coming down, it starts coming up."},{"id":"8942d8e5-c8db-4bd2-ab73-7d57e274f582","type":"opinion","location":"00:08:27.0-00:08:28.9","speaker":"Fravor, David","text":"David Fravor believes the UAP during the 2004 USS Nimitz UAP encounter was aware of their presence.","quote":"Bill Whitaker: So it's mimicking your moves. David Fravor: Yeah, it was aware we were there."},{"id":"56c22a1b-acfb-45a0-96ce-a52864240dc6","type":"observation","location":"00:08:30.5-00:08:37.0","speaker":"Fravor, David","text":"During the 2004 USS Nimitz UAP encounter, the UAP was about the size of an F/A-18.","quote":"it was about the size of his F-18"},{"id":"83c6e7c0-a408-4738-a0b3-ce490393f672","type":"observation","location":"00:08:30.5-00:08:37.0","speaker":"Fravor, David","text":"During the 2004 USS Nimitz UAP encounter, the UAP had no markings.","quote":"with no markings"},{"id":"f5c11144-0e1b-47ec-9653-e35e08317300","type":"observation","location":"00:08:30.5-00:08:37.0","speaker":"Fravor, David","text":"During the 2004 USS Nimitz UAP encounter, the UAP had no wings.","quote":"no wings"},{"id":"2eb01134-3dc5-4fc0-8fd4-cf8fe1970c2b","type":"observation","location":"00:08:30.5-00:08:37.0","speaker":"Fravor, David","text":"During the 2004 USS Nimitz UAP encounter, the UAP had no exhaust plumes.","quote":"no exhaust plumes"},{"id":"4244ea4e-dda0-434e-bf75-788d9223f239","type":"observation","location":"00:08:37.0-00:08:47.8","speaker":"Fravor, David","text":"During the 2004 USS Nimitz UAP encounter, the UAP disappeared when it got right in front of David Fravor, having sped off.","quote":"And when it gets right in front of me, it just disappears. Disappears, like gone. It had sped off."},{"id":"1aa699a6-cb86-4ce7-ba4e-7cfecea9a3a3","type":"testimony","location":"00:08:50.9-00:08:58.3","speaker":"Dietrich, Alex","text":"Alex Dietrich initially tried to categorise the UAP from the 2004 USS Nimitz UAP encounter as a helicopter or a drone.","quote":"I'm going to categorize this as maybe a helicopter or maybe a drone."},{"id":"a2495a43-e5b5-483f-8f56-155cc255793b","type":"testimony","location":"00:09:00.9-00:09:04.2","speaker":"Dietrich, Alex","text":"The weapons system officers in the back seats of both aircraft also observed the UAP during the 2004 USS Nimitz UAP encounter.","quote":"Bill Whitaker: Did your back seaters see this too? Alex Dietrich: Yeah. David Fravor: Oh, yeah."},{"id":"3c661e3a-cda7-49e2-8383-4d8cd6eb49a2","type":"observation","location":"00:09:03.5-00:09:08.9","speaker":"Fravor, David","text":"Four naval aviators observed the UAP for roughly five minutes during the 2004 USS Nimitz UAP encounter.","quote":"There was four of us in the airplanes literally watching this thing for roughly about five minutes."},{"id":"ac93c5c7-daa6-4e54-8c33-da40470b4fb8","type":"observation","location":"00:09:08.9-00:09:14.4","speaker":null,"text":"Seconds after the UAP disappeared during the 2004 USS Nimitz UAP encounter, the USS Princeton reacquired the target approximately 95 kilometres away.","quote":"Seconds later, the Princeton reacquired the target, 60 miles away."},{"id":"7d60f71c-f88b-400e-b5db-f5b203e54a7f","type":"observation","location":"00:09:14.4-00:09:20.8","speaker":null,"text":"Another aircrew briefly locked onto the UAP with a targeting camera during the 2004 USS Nimitz UAP encounter before it sped off again.","quote":"Another crew managed to briefly lock onto it with a targeting camera before it zipped off again."},{"id":"6c55b3b3-0557-4b26-9849-2ec1b8a4b9e6","type":"testimony","location":"00:09:20.8-00:09:31.1","speaker":"Dietrich, Alex","text":"Alex Dietrich acknowledged that if she had seen the UAP solo during the 2004 USS Nimitz UAP encounter, she might not have reported it because it sounds crazy.","quote":"I think that over beers, we've sort of said, hey, man, if I saw this solo, I don't know that I would have come back and said anything because it sounds so crazy when I say it."},{"id":"7ddbce42-fcca-4f07-92bf-36c319339ebb","type":"testimony","location":"00:09:31.1-00:09:37.4","speaker":"Fravor, David","text":"David Fravor has been told he sounds crazy when describing the 2004 USS Nimitz UAP encounter.","quote":"I've had some people tell me, you know, when you say that, you can sound crazy."},{"id":"a673d1b9-0920-4498-9839-19eb651f70df","type":"testimony","location":"00:09:37.4-00:09:37.9","speaker":"Fravor, David","text":"David Fravor does not consider himself a Unidentified Flying Object (UFO) enthusiast.","quote":"I'm not a UFO guy."},{"id":"9bbb8756-b36f-4d09-84f6-114b1fb2b86b","type":"opinion","location":"00:09:39.8-00:09:45.8","speaker":"Fravor, David","text":"David Fravor believes there is something out there that was better than his aircraft during the 2004 USS Nimitz UAP encounter.","quote":"There's definitely something that, I don't know who's building it, who's got the technology, who's got the brains, but there's something out there that was better than our airplane."},{"id":"4571efcf-acf9-42e8-b89c-78049bf4fc3e","type":"administrative","location":"00:09:56.5-00:09:58.7","speaker":null,"text":"The aircrew filed reports about the 2004 USS Nimitz UAP encounter.","quote":"The air crew filed reports."},{"id":"60218929-7876-4adb-b63c-0093610895e2","type":"administrative","location":"00:09:58.7-00:10:13.2","speaker":null,"text":"Nothing was said or done officially about the 2004 USS Nimitz UAP encounter for five years until Luis Elizondo came across the story and investigated it.","quote":"Nothing was said or done officially for five years until Lou Elizondo came across the story and investigated."},{"id":"e9759fed-0b21-446e-b4a0-e5f923bd8ad2","type":"opinion","location":"00:10:13.2-00:10:25.3","speaker":"Elizondo, Luis","text":"Luis Elizondo considers it compelling that highly trained US pilots are seeing something they cannot explain, backed up by electro-optical data and radar data.","quote":"We spend millions of dollars in training these pilots, and they are seeing something that they can't explain. Furthermore, that information's being backed up on electro-optical data, like gun camera footage, and by radar data. Now, to me, that's compelling."},{"id":"61c1d4da-7f43-4791-b0c4-5c02b7d775af","type":"testimony","location":"00:10:27.7-00:10:31.7","speaker":"Elizondo, Luis","text":"Luis Elizondo's findings on Unidentified Aerial Phenomena (UAP) were met with scepticism inside the Pentagon.","quote":"Inside the Pentagon, his findings were met with skepticism."},{"id":"68e16d2c-1e70-43f8-bd52-f99fda3ac4b3","type":"administrative","location":"00:10:31.7-00:10:39.5","speaker":null,"text":"The Advanced Aerospace Threat Identification Program (AATIP)'s funding was eliminated in 2012.","quote":"AATIP's funding was eliminated in 2012"},{"id":"be2b7ca3-e216-4cb8-817e-07c3fee91f34","type":"testimony","location":"00:10:31.7-00:10:39.5","speaker":"Elizondo, Luis","text":"After the Advanced Aerospace Threat Identification Program (AATIP)'s funding was eliminated in 2012, Luis Elizondo and a handful of others kept the mission alive.","quote":"Elizondo says he and a handful of others kept the mission alive."},{"id":"69cb0976-2cf3-43f0-8e13-f84403348631","type":"biographical","location":"00:10:39.5-00:10:48.8","speaker":null,"text":"Luis Elizondo quit the Pentagon in 2017 out of frustration.","quote":"frustrated, he quit the Pentagon in 2017"},{"id":"fddbf5ca-6ad3-495e-8c63-31ce71d73240","type":"testimony","location":"00:10:39.5-00:10:48.8","speaker":"Elizondo, Luis","text":"Before quitting the Pentagon in 2017, Luis Elizondo got three Navy UAP videos declassified.","quote":"not before getting these three videos declassified."},{"id":"f7d3f0b0-f4d2-4356-8806-051654532821","type":"testimony","location":"00:10:51.9-00:10:57.5","speaker":"Mellon, Christopher","text":"Christopher Mellon tried to help Luis Elizondo elevate the Unidentified Aerial Phenomena (UAP) issue within the Department of Defense and get it to the Secretary of Defense.","quote":"I tried to help my colleague, Lou Elizondo, elevate the issue in the department and actually get it to the Secretary of Defense."},{"id":"5f03846f-bfc1-4759-a8a4-a7a3fc1da189","type":"biographical","location":"00:10:57.5-00:11:04.3","speaker":null,"text":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Bill Clinton and George W. Bush.","quote":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush."},{"id":"0ce986f4-2940-4171-bb2b-960138726d41","type":"biographical","location":"00:11:04.3-00:11:08.4","speaker":null,"text":"Christopher Mellon had access to top-secret government programmes.","quote":"had access to top-secret government programs."},{"id":"3a58ca3f-c2e8-4269-b490-3de275dc044d","type":"testimony","location":"00:11:08.4-00:11:18.7","speaker":"Mellon, Christopher","text":"Christopher Mellon states with a high degree of confidence that the Unidentified Aerial Phenomena (UAP) are not US technology.","quote":"So it's not us, that's one thing we know. I could say that with a very high degree of confidence, in part because of the positions I held in the department, and I know the process."},{"id":"bac96014-b896-4f69-ab95-ed8fd9838d92","type":"opinion","location":"00:11:18.7-00:11:26.2","speaker":"Mellon, Christopher","text":"Christopher Mellon grew concerned that nothing was being done about Unidentified Aerial Phenomena (UAP).","quote":"Mellon says he grew concerned nothing was being done about UAPs"},{"id":"66e5708e-a929-47cd-9c09-39d6dae548e4","type":"testimony","location":"00:11:26.2-00:11:37.0","speaker":"Mellon, Christopher","text":"In 2017, as a private citizen, Christopher Mellon acquired the three declassified Navy videos and leaked them to The New York Times.","quote":"In 2017, as a private citizen, he surreptitiously acquired the three Navy videos Elizondo had declassified and leaked them to The New York Times."},{"id":"f2207a64-b4f3-443d-b971-f6a747c6bf91","type":"opinion","location":"00:11:37.0-00:11:46.1","speaker":"Mellon, Christopher","text":"Christopher Mellon considers it bizarre and unfortunate that he had to leak videos to get the Unidentified Aerial Phenomena (UAP) issue on the national security agenda.","quote":"It's bizarre and unfortunate that someone like myself has to do something like that to get a national security issue like this on the agenda."},{"id":"8ad37498-4713-46ca-a448-b8a32f35652a","type":"infrastructure","location":"00:11:46.1-00:11:57.6","speaker":null,"text":"Christopher Mellon and Luis Elizondo told their story to newspapers, the History Channel, and members of Congress.","quote":"He joined forces with now civilian Lou Elizondo, and they started to tell their story to anybody who would listen, to newspapers, the History Channel, to members of Congress."},{"id":"5f95ad84-82aa-4c29-b948-ede35f407fd8","type":"testimony","location":"00:11:57.6-00:12:07.2","speaker":"Mellon, Christopher","text":"Christopher Mellon and Luis Elizondo understood they had to go to the public to get Congress interested, to then circle back to the Defense Department to get them to take the Unidentified Aerial Phenomena (UAP) issue seriously.","quote":"We knew and understood that you had to go to the public, get the public interested to get Congress interested, to then circle back to the Defense Department and get them to start taking a look at it."},{"id":"b6409100-c6a9-4518-b1b7-2ec92b44b699","type":"administrative","location":"00:12:07.2-00:12:15.6","speaker":null,"text":"In August 2020, the Pentagon resurrected the Advanced Aerospace Threat Identification Program (AATIP) as the Unidentified Aerial Phenomena Task Force (UAPTF).","quote":"This past August, the Pentagon resurrected AATIP. It's now called the UAP Task Force."},{"id":"655ebb62-b07c-49c6-9986-ac9b1319faa3","type":"administrative","location":"00:12:15.6-00:12:20.1","speaker":null,"text":"Service members are now encouraged to report Unidentified Aerial Phenomena (UAP) encounters.","quote":"Service members now are encouraged to report strange encounters."},{"id":"beb6ec81-6a79-449e-aea4-7e446cde5533","type":"opinion","location":"00:12:22.6-00:12:26.5","speaker":"Rubio, Marco","text":"Marco Rubio considers anything that enters US airspace that is not supposed to be there a threat.","quote":"Anything that enters an airspace that's not supposed to be there is a threat."},{"id":"752b6a08-afc1-4a67-b99d-0b3b70b60298","type":"testimony","location":"00:12:26.5-00:12:34.0","speaker":"Rubio, Marco","text":"After receiving classified briefings on Unidentified Aerial Phenomena (UAP), Marco Rubio called for a detailed analysis.","quote":"After receiving classified briefings on UAPs, Senator Marco Rubio called for a detailed analysis."},{"id":"4cdff245-a402-447d-8fd3-3265bf3fc74d","type":"administrative","location":"00:12:34.0-00:12:46.3","speaker":null,"text":"In December 2020, while head of the United States Senate Select Committee on Intelligence, Marco Rubio asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report on UAP.","quote":"This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month."},{"id":"efca86ff-44cf-4d83-a070-062586249ce1","type":"opinion","location":"00:12:46.3-00:12:54.5","speaker":null,"text":"The Pentagon and other branches of the military have a long history of dismissing Unidentified Aerial Phenomena (UAP).","quote":"The Pentagon and other branches of the military have a long history of sort of dismissing this."},{"id":"0dfb04c3-ee43-4420-a0f5-9ca9a1661405","type":"testimony","location":"00:12:59.0-00:13:06.9","speaker":"Rubio, Marco","text":"Marco Rubio says there is a stigma on Capitol Hill regarding Unidentified Aerial Phenomena (UAP), with some colleagues giggling when the topic is raised.","quote":"there's a stigma on Capitol Hill. I mean, some of my colleagues are very interested in this topic and some kind of, you know, giggle when you bring it up."},{"id":"46f8f6ec-0081-4de4-8d7a-869a5b98c892","type":"opinion","location":"00:13:06.9-00:13:12.2","speaker":"Rubio, Marco","text":"Marco Rubio believes the stigma around Unidentified Aerial Phenomena (UAP) should not prevent getting answers to fundamental questions.","quote":"I don't think we can allow the stigma to keep us from having an answer to a very fundamental question."},{"id":"012f124f-ea4a-4424-9e81-b7ff78d1f7ce","type":"opinion","location":"00:13:14.1-00:13:19.7","speaker":"Rubio, Marco","text":"Marco Rubio wants the government to take Unidentified Aerial Phenomena (UAP) seriously and establish a process to analyse the data every time it comes in.","quote":"I want us to take it seriously and have a process to take it seriously. I want us to have a process to analyze the data every time it comes in"},{"id":"e540728b-6af1-49eb-b2ee-2fb6a3d18453","type":"opinion","location":"00:13:19.7-00:13:25.9","speaker":"Rubio, Marco","text":"Marco Rubio wants Unidentified Aerial Phenomena (UAP) data to be catalogued and constantly analysed until answers are obtained.","quote":"that there be a place where this is cataloged and constantly analyzed until we get some answers."},{"id":"a2c2be80-936b-4c52-9872-112f32f3f38a","type":"testimony","location":"00:13:35.4-00:13:37.3","speaker":"Dietrich, Alex","text":"Alex Dietrich felt the vulnerability of not having anything to defend themselves during the 2004 USS Nimitz UAP encounter.","quote":"I felt the vulnerability of not having anything to defend ourselves."}],"nodes":[{"id":"ef2de58a-6eec-4320-b99d-ace26f28e844","type":"person","name":"Whitaker, Bill"},{"id":"1befeffc-b0d9-4df6-a320-e0ba8631c585","type":"person","name":"Elizondo, Luis"},{"id":"2126d91e-05be-4ab2-a5dc-8a9b17382052","type":"person","name":"Graves, Ryan"},{"id":"abbd367b-8f90-4d34-aa14-3b93615759c4","type":"person","name":"Fravor, David"},{"id":"eaa109ee-84e7-4693-8f42-a60ffa80e090","type":"person","name":"Dietrich, Alex"},{"id":"47ebff59-79bd-4061-809a-7310e948f6d1","type":"person","name":"Reid, Harry"},{"id":"ef2a4516-0a98-44bb-9ca6-bee058a909f8","type":"person","name":"Mellon, Christopher"},{"id":"b177264b-159a-4ec2-bb32-bc14b59ee254","type":"person","name":"Rubio, Marco"},{"id":"d170f073-1901-4a2c-a1eb-8b76102c4f5d","type":"person","name":"Clinton, Bill"},{"id":"696c635c-cdb0-43aa-a715-b8d92594b566","type":"person","name":"Bush, George W."},{"id":"3bdefccf-74a9-47b2-93d0-9a3f473a2bc5","type":"organisation","name":"United States Department of Defense (DoD)"},{"id":"8150dafd-98a3-47ff-a258-446bdd2335ff","type":"organisation","name":"United States Senate"},{"id":"e0622514-675d-4d9d-b995-69c918977b25","type":"organisation","name":"United States Senate Select Committee on Intelligence"},{"id":"a984f735-01fd-4c6f-b9e6-a7d8587f1db9","type":"organisation","name":"Office of the Director of National Intelligence (ODNI)"},{"id":"80597641-fc99-4281-ae58-1b741af661eb","type":"organisation","name":"History Channel"},{"id":"140fa48b-dcfc-4d57-94e9-a699b7a9473b","type":"organisation","name":"The New York Times"},{"id":"27bef22a-69f5-4c6d-8dd7-be0b8cc8277c","type":"organisation","name":"60 Minutes"},{"id":"c2ebf891-6067-4c6b-924c-da342ebb096b","type":"organisation","name":"United States Navy"},{"id":"47042bda-b0a9-4e38-8949-ba285383b998","type":"organisation","name":"Top Gun Naval Flight School"},{"id":"b845f419-7946-42ee-bccb-cb2990086a3a","type":"organisation","name":"USS Nimitz Carrier Strike Group"},{"id":"04a29b99-1945-4435-9bc0-65c7a6ec2b5c","type":"project","name":"Advanced Aerospace Threat Identification Program (AATIP)"},{"id":"84d7d91c-27eb-409c-ab84-b1bb2c72e951","type":"project","name":"Project Blue Book"},{"id":"0c1bfebb-eec9-4773-8076-60931426895d","type":"project","name":"Unidentified Aerial Phenomena Task Force (UAPTF)"},{"id":"cd1b2d38-cdcf-4ec7-b3a6-0e8b8d12d9c8","type":"place","name":"USA, Virginia, Virginia Beach"},{"id":"0d428f76-0d25-48a6-acf3-0093b6cad5a2","type":"place","name":"USA, Florida, Jacksonville"},{"id":"083f01bf-f447-43ad-8a20-e54f69c1549a","type":"place","name":"USA, California, San Diego"},{"id":"b657e790-a597-436c-8bbf-484d4893cbfe","type":"event","name":"2004 USS Nimitz UAP encounter"},{"id":"dcf949b5-0143-409d-b199-525dedf59db4","type":"event","name":"2015 Atlantic Coast UAP sightings"},{"id":"5cd43b09-3d1c-4bde-81e2-08b452e198fe","type":"object","name":"F/A-18"},{"id":"872abeb0-0603-429f-b2b1-61d771b66608","type":"object","name":"USS Nimitz"},{"id":"b80d12cd-611b-4ff6-8e51-63716167147a","type":"object","name":"USS Princeton"},{"id":"d8d90880-ee5b-4e77-8954-296a9901f2a3","type":"object","name":"Boeing 737"},{"id":"bf090713-3a80-4b65-a20f-3e5bb40bae79","type":"document","name":"Senate Unclassified Report on UAPs (2021)"},{"id":"0e9e9fcf-6e06-4d01-84a4-aae2372127ff","type":"document","name":"Declassified Navy UAP videos (2017)"},{"id":"9196f25d-2589-4857-a76c-dfaaf544a992","type":"topic","name":"Unidentified Aerial Phenomena (UAP)"},{"id":"89e98c72-a000-4784-bd67-b7bedebdba93","type":"topic","name":"Unidentified Flying Object (UFO)"},{"id":"7657b194-5f33-4154-a6ed-6a0563652d6a","type":"topic","name":"Anomalous Aerial Vehicle (AAV)"}]},{"id":"z-ai_glm-5.2","name":"z-ai / glm-5.2","errata":null,"claims":[{"id":"faf089c7-5552-4f11-936b-118fcc77d9c1","type":"administrative","location":"00:00:07.6-00:00:14.9","speaker":null,"text":"The United States government has grudgingly acknowledged Unidentified Aerial Phenomena (UAP) after decades of public denial.","quote":"the u.s. government's grudging acknowledgement of Unidentified Aerial Phenomena, UAP, more commonly known as ufos after decades of public denial the pentagon now admits there's something out there"},{"id":"ecd06c40-6b44-411c-aace-20286eadce3c","type":"administrative","location":"00:00:14.9-00:00:44.4","speaker":null,"text":"The Pentagon admits there is something out there related to Unidentified Aerial Phenomena (UAP).","quote":"the pentagon now admits there's something out there"},{"id":"cf37f90f-4906-482d-b733-626f06e02e01","type":"administrative","location":"00:00:14.9-00:00:44.4","speaker":null,"text":"The United States Senate Select Committee on Intelligence has ordered the Director of National Intelligence and the Secretary of Defense to deliver a report on mysterious UAP sightings.","quote":"the intelligence committee has ordered the director of national intelligence and the secretary of defense to deliver a report on the mysterious sightings by next month"},{"id":"58a0e743-5d39-43d8-8524-f8888f82500a","type":"testimony","location":"00:00:54.6-00:01:02.4","speaker":"Elizondo, Luis","text":"The United States government has stated for the record that Unidentified Aerial Phenomena (UAP) are real.","quote":"The government has already stated for the record that they're real. I'm not telling you that. The United States government is telling you that."},{"id":"cf84b515-ec1f-4982-a851-ef8f068a240f","type":"administrative","location":"00:01:02.4-00:01:11.5","speaker":"Whitaker, Bill","text":"Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo.","quote":"Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo."},{"id":"1dce0f76-39ac-4f16-94f7-1b07aec335d2","type":"administrative","location":"00:01:11.5-00:01:15.6","speaker":"Whitaker, Bill","text":"Luis Elizondo had not given UFOs a second thought until 2008.","quote":"He hadn't given UFOs a second thought until 2008."},{"id":"39cc71fa-081e-4961-bc59-438b5ce27805","type":"administrative","location":"00:01:15.6-00:01:24.1","speaker":"Whitaker, Bill","text":"In 2008, Luis Elizondo was asked to join the Advanced Aerospace Threat Identification Program (AATIP) at the Pentagon.","quote":"That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP."},{"id":"858b5824-c481-4607-a9c3-096c9a1f644f","type":"testimony","location":"00:01:24.1-00:01:34.3","speaker":"Elizondo, Luis","text":"The mission of the Advanced Aerospace Threat Identification Program (AATIP) was to collect and analyse information involving Anomalous Aerial Vehicles (AAV), also called UAPs or UFOs.","quote":"The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs. We call them UAPs."},{"id":"c370cce9-13a3-470e-925e-ef616a875e8b","type":"opinion","location":"00:01:40.0-00:01:48.4","speaker":"Elizondo, Luis","text":"Luis Elizondo asserts that the UAP phenomenon is real, and the question is what it is, its intentions, and its capabilities.","quote":"What I'm telling you is real. The question is, what is it? What are its intentions? What are its capabilities?"},{"id":"454e0725-8319-4f14-bafd-383c2add8626","type":"administrative","location":"00:01:50.3-00:02:01.6","speaker":"Whitaker, Bill","text":"The Advanced Aerospace Threat Identification Program (AATIP) was part of a 22 million dollar programme sponsored by then Senate Majority Leader Harry Reid to investigate UFOs.","quote":"AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs."},{"id":"f0957d84-b086-4ae8-8cf4-b2d809fcbaf0","type":"administrative","location":"00:02:01.6-00:02:10.8","speaker":"Whitaker, Bill","text":"Luis Elizondo took over the Advanced Aerospace Threat Identification Program (AATIP) in 2010.","quote":"When Elizondo took over in 2010"},{"id":"243661aa-9d5f-4ca9-bafb-34cb28cc38a0","type":"administrative","location":"00:02:01.6-00:02:10.8","speaker":"Whitaker, Bill","text":"Upon taking over AATIP in 2010, Luis Elizondo focused on the national security implications of Unidentified Aerial Phenomena (UAP) documented by United States service members.","quote":"he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members."},{"id":"6aacd3ca-f63d-4e6a-a847-522a007e9e72","type":"testimony","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Luis Elizondo describes UAP technology capable of performing 600 to 700 G-forces.","quote":"Imagine a technology that can do 600 to 700 G-forces"},{"id":"b9b7df03-2020-4c9c-8243-38f7a6604a2f","type":"testimony","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Luis Elizondo describes UAP technology capable of flying at approximately 21,000 kilometres per hour.","quote":"that can fly at 13,000 miles an hour"},{"id":"de8dbc64-1a44-40ec-b60f-a47f430fdf6e","type":"testimony","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Luis Elizondo describes UAP technology capable of evading radar.","quote":"that can evade radar"},{"id":"0569408d-df7a-4123-abc5-d19ae1f33bea","type":"testimony","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Luis Elizondo describes UAP technology capable of flying through air and water and possibly space.","quote":"that can fly through air and water and possibly space"},{"id":"6b5f64c6-5262-43bf-adc1-807bc782bc0b","type":"testimony","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Luis Elizondo describes UAP technology with no obvious signs of propulsion, no wings, and no control surfaces.","quote":"has no obvious signs of propulsion, no wings, no control surfaces"},{"id":"86c9f0e7-70ed-4bf1-891f-ac96f67cd662","type":"testimony","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Luis Elizondo describes UAP technology that can defy the natural effects of Earth's gravity.","quote":"and yet still can defy the natural effects of Earth's gravity"},{"id":"2886a85f-0b65-4443-b907-ac8451bb4e05","type":"testimony","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Luis Elizondo states that the described UAP capabilities are precisely what AATIP was seeing.","quote":"That's precisely what we're seeing."},{"id":"a8bf963b-6e3d-4031-9093-ab7b57b5b127","type":"testimony","location":"00:02:37.0-00:02:47.7","speaker":"Elizondo, Luis","text":"The Advanced Aerospace Threat Identification Program (AATIP) was a loose-knit mix of scientists, electro-optical engineers, avionics experts, and intelligence experts, often working part-time.","quote":"Elizondo tells us AATIP was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time."},{"id":"42a85f99-5a48-4be8-ba0e-4ca5b3f3fb0a","type":"testimony","location":"00:02:37.0-00:02:57.7","speaker":"Elizondo, Luis","text":"AATIP personnel combed through data and records and analysed videos of UAP.","quote":"They combed through data and records and analyzed videos like this."},{"id":"8d2d9fde-9ca0-4076-a2d9-2e37b33d9475","type":"observation","location":"00:02:57.7-00:03:07.3","speaker":"Whitaker, Bill","text":"A United States Navy aircrew struggled to lock onto a fast-moving object off the United States Atlantic coast in 2015.","quote":"A Navy aircrew struggles to lock onto a fast-moving object off the U.S. Atlantic coast in 2015."},{"id":"66314c17-6b8a-423c-a4f6-10f542b65aa6","type":"administrative","location":"00:03:07.3-00:03:20.4","speaker":"Whitaker, Bill","text":"The Pentagon admits it does not know what the objects depicted in recently released images are.","quote":"the Pentagon admits it doesn't know what in the world this is, or this, or this."},{"id":"067d9652-ec71-49f6-9f84-3227540b3afb","type":"testimony","location":"00:03:30.4-00:03:38.6","speaker":"Elizondo, Luis","text":"Luis Elizondo acknowledges that in some cases there are simple explanations for what people are witnessing, but some cases have no simple explanation.","quote":"In some cases, there are simple explanations for what people are witnessing, but there are some that that are not."},{"id":"bf9adb28-8d84-470d-b2d2-f1c3c2ff3397","type":"testimony","location":"00:03:38.6-00:03:52.6","speaker":"Elizondo, Luis","text":"Luis Elizondo states that AATIP went through due diligence to determine whether sightings could be new Chinese cruise missile technology or high-altitude reconnaissance balloons.","quote":"We're going through our due diligence. Is it some sort of new type of cruise missile technology that China has developed? Is it some sort of high-altitude balloon that's conducting reconnaissance?"},{"id":"a2e049fe-7b08-4d27-8542-e22eb53ed2c3","type":"opinion","location":"00:03:52.6-00:04:06.2","speaker":"Elizondo, Luis","text":"Luis Elizondo states that when all explanations are exhausted and an object remains in United States airspace and is real, it becomes compelling and problematic.","quote":"Ultimately, when you have exhausted all those what-ifs and you're still left with the fact that this is in our airspace and it's real, that's when it becomes compelling and that's when it becomes problematic."},{"id":"1c675570-4c8d-4598-a5fb-38696c451e47","type":"opinion","location":"00:04:06.2-00:04:12.9","speaker":"Whitaker, Bill","text":"Former United States Navy pilot Lieutenant Ryan Graves considers whatever is out there a security risk.","quote":"Former Navy pilot Lieutenant Ryan Graves calls whatever is out there a security risk."},{"id":"1aead97a-c810-452f-9c2d-bf5367a5302d","type":"testimony","location":"00:04:12.9-00:04:29.7","speaker":"Whitaker, Bill","text":"Ryan Graves's F/A-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar, making it possible to zero in with infrared targeting cameras.","quote":"He told us his F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar, making it possible to zero in with infrared targeting cameras."},{"id":"deb980be-e369-445c-9591-51d5a9ab1975","type":"testimony","location":"00:04:29.7-00:04:37.1","speaker":"Whitaker, Bill","text":"Ryan Graves's squadron detected UAPs both with radar and infrared, indicating there is something physically out there.","quote":"So you're seeing it both with the radar and with the infrared, and that tells you that there is something out there."},{"id":"421dec72-ba36-4230-bc11-23f38ef617c1","type":"opinion","location":"00:04:29.7-00:04:38.6","speaker":"Graves, Ryan","text":"Ryan Graves considers the dual radar-and-infrared detection of UAP hard to spoof.","quote":"Bill Whitaker: So you're seeing it both with the radar and with the infrared, and that tells you that there is something out there. Ryan Graves: Pretty hard to spoof that."},{"id":"32490f8c-b57d-4d41-823e-a887eda37e1f","type":"administrative","location":"00:04:38.6-00:04:48.2","speaker":"Whitaker, Bill","text":"Photographs of objects the Pentagon cannot identify were taken in 2019 in the same area as the Virginia Beach sightings.","quote":"These photographs were taken in 2019 in the same area. The Pentagon confirms these are images of objects it can't identify."},{"id":"50f8b8b6-687f-41a5-9c5d-49817b543cf1","type":"testimony","location":"00:04:48.2-00:05:02.5","speaker":"Graves, Ryan","text":"Ryan Graves states that pilots training off the Atlantic coast see UAPs every day for at least a couple of years.","quote":"Bill Whitaker: Lieutenant Graves told us pilots training off the Atlantic coast see things like that all the time. Ryan Graves: Every day. Every day for at least a couple of years."},{"id":"d6561d2d-ec69-42db-ac60-46e186e8a986","type":"observation","location":"00:05:01.2-00:05:04.3","speaker":"Graves, Ryan","text":"Ryan Graves observed no exhaust plume on the UAP.","quote":"You know, I don't see an exhaust plume."},{"id":"990238a6-bf08-4d0c-86e1-3341fd7cae94","type":"observation","location":"00:05:04.3-00:05:12.8","speaker":"Whitaker, Bill","text":"A UAP off the coast of Jacksonville, Florida in 2015 was captured on a targeting camera by members of Ryan Graves's squadron.","quote":"including this one, off the coast of Jacksonville, Florida in 2015, captured on a targeting camera by members of Graves' squadron."},{"id":"5b6929d2-d7d1-4eda-81c8-bfd6ce5c3a07","type":"observation","location":"00:05:12.8-00:05:25.4","speaker":null,"text":"During the 2015 Jacksonville UAP footage, crew members can be heard exclaiming about an object rotating and moving against the wind.","quote":"Look at that thing! It's rotating. My gosh! They're all going against the wind. The wind's 120 knots far west. Look at that thing, dude."},{"id":"61d8d705-43b5-4804-88fb-51ed5cbb6764","type":"measurement","location":"00:05:17.9-00:05:23.8","speaker":null,"text":"During the 2015 Jacksonville UAP footage, the wind was approximately 220 kilometres per hour to the west.","quote":"The wind's 120 knots far west."},{"id":"6d015550-d83d-4408-a55e-80502f1ed51a","type":"opinion","location":"00:05:25.4-00:05:33.2","speaker":"Graves, Ryan","text":"Ryan Graves observed that the aircrew broke character and were amazed at what they were seeing during the 2015 Jacksonville UAP footage.","quote":"They seem to have broke character a bit, and were just kind of amazed at what they were seeing."},{"id":"24dfaa1b-735d-4268-ac82-5582aa1bd3e1","type":"opinion","location":"00:05:33.2-00:05:44.9","speaker":"Graves, Ryan","text":"Ryan Graves considers the 2015 Jacksonville UAP footage difficult to explain because it shows rotation, high altitudes, and propulsion.","quote":"This is a difficult one to explain. You have rotation, you have high altitudes, you have propulsion, right? I don't know. I don't know what it is, frankly."},{"id":"1e5cd193-5bcc-4280-951f-ccb261472487","type":"opinion","location":"00:05:33.2-00:05:44.9","speaker":"Graves, Ryan","text":"Ryan Graves does not know what the UAP captured in the 2015 Jacksonville footage is.","quote":"I don't know. I don't know what it is, frankly."},{"id":"c9daeb80-2049-4700-a93a-768d567189bb","type":"testimony","location":"00:05:44.9-00:05:56.0","speaker":"Whitaker, Bill","text":"Pilots speculate that the UAPs are one of three things: secret United States technology, an adversary spy vehicle, or something otherworldly.","quote":"He told us pilots speculate they are one of three things, secret U.S. technology, an adversary spy vehicle, or something otherworldly."},{"id":"b70ff9fb-2896-44f5-890b-f091aff11e20","type":"opinion","location":"00:05:56.0-00:06:00.5","speaker":"Graves, Ryan","text":"Ryan Graves considers the highest probability to be that the UAPs represent a threat observation programme.","quote":"I'd say, you know, the highest probability is it's a threat observation program."},{"id":"7bbe7c8e-1c16-4d94-ae01-50510388d934","type":"opinion","location":"00:06:00.5-00:06:05.4","speaker":"Graves, Ryan","text":"Ryan Graves considers Russian or Chinese technology a possible explanation for the observed UAP.","quote":"Bill Whitaker: Could it be Russian or Chinese technology? Ryan Graves: I don't see why not."},{"id":"997a5dba-5c5f-4cf2-9b81-0cb0d857ccd9","type":"opinion","location":"00:06:05.4-00:06:08.8","speaker":"Graves, Ryan","text":"Ryan Graves is worried about the UAP situation.","quote":"Bill Whitaker: Are you alarmed? Ryan Graves: I am worried, frankly."},{"id":"814962a5-b45d-481b-8458-7c652df876da","type":"opinion","location":"00:06:08.8-00:06:18.5","speaker":"Graves, Ryan","text":"Ryan Graves states that if tactical jets from another country were hanging out in restricted airspace, it would be a massive issue, but because UAPs look slightly different, the problem is being ignored.","quote":"if these were tactical jets from another country that were hanging out up there, it would be a massive issue. But because it looks slightly different, we're not willing to actually look at the problem in the face."},{"id":"63eec0db-a459-4382-8ee6-6ea768a6c358","type":"opinion","location":"00:06:18.5-00:06:23.4","speaker":"Graves, Ryan","text":"Ryan Graves states that UAPs are out there watching United States personnel every day and the issue is being ignored.","quote":"We're happy to just ignore the fact that these are out there watching us every day."},{"id":"cc2db402-11d6-4297-95f2-6592a7abe7f2","type":"administrative","location":"00:06:23.4-00:06:30.3","speaker":"Whitaker, Bill","text":"The United States government closed its Project Blue Book investigation in 1969.","quote":"The gov
