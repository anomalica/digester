nistrative","location":"00:10:27.7-00:10:39.5","speaker":"Whitaker, Bill","text":"Funding for the Advanced Aerospace Threat Identification Program (AATIP) was terminated in 2012 due to scepticism from United States Department of Defense (DoD) officials.","quote":"Inside the Pentagon, his findings were met with skepticism. AATIP's funding was eliminated in 2012..."},{"id":"108c9c1c-4d6f-4430-8aef-d6131e23fd38","type":"administrative","location":"00:10:31.7-00:10:39.5","speaker":"Elizondo, Luis","text":"Despite the 2012 termination of the Advanced Aerospace Threat Identification Program (AATIP), Luis Elizondo and a small team continued the mission in secret until his resignation from the Department of Defense (DoD) in 2017.","quote":"...but Elizondo says he and a handful of others kept the mission alive until finally, frustrated, he quit the Pentagon in 2017..."},{"id":"901b3ecc-69db-47e7-a0b8-0594cf5c8c0d","type":"administrative","location":"00:10:39.5-00:10:48.8","speaker":"Whitaker, Bill","text":"Prior to leaving the Department of Defense (DoD) in 2017, Luis Elizondo successfully secured the declassification of three United States Navy videos showing Unidentified Aerial Phenomena (UAP).","quote":"...but not before getting these three videos declassified."},{"id":"d8af0f3b-f1f7-4bc2-9ee8-9360ed203d7e","type":"testimony","location":"00:10:51.9-00:11:00.0","speaker":"Mellon, Christopher","text":"Christopher Mellon attempted to elevate Unidentified Aerial Phenomena (UAP) findings from Luis Elizondo to senior leadership within the Department of Defense (DoD).","quote":"I tried to help my colleague, Lou Elizondo, elevate the issue in the department and actually get it to the Secretary of Defense."},{"id":"80f7b599-7f4c-444b-b4bb-76a884948227","type":"opinion","location":"00:11:11.7-00:11:18.7","speaker":"Mellon, Christopher","text":"Christopher Mellon possesses high confidence that observed Unidentified Aerial Phenomena (UAP) are not advanced United States technology based on his prior role as Deputy Assistant Secretary of Defense for Intelligence.","quote":"I could say that with a very high degree of confidence, in part because of the positions I held in the department, and I know the process."},{"id":"2af94b4f-2eb2-4230-bd64-d228ac7b6bfc","type":"administrative","location":"00:11:26.2-00:11:37.0","speaker":"Whitaker, Bill","text":"In 2017, Christopher Mellon acquired and transmitted three declassified United States Navy videos to The New York Times to force public acknowledgement of the national security issue surrounding Unidentified Aerial Phenomena (UAP).","quote":"In 2017, as a private citizen, he surreptitiously acquired the three Navy videos Elizondo had declassified and leaked them to The New York Times."},{"id":"621b5790-82c1-4908-a5ad-cd6c1d518b94","type":"opinion","location":"00:11:37.0-00:11:46.1","speaker":"Mellon, Christopher","text":"Christopher Mellon considers the leak of United States Navy Unidentified Aerial Phenomena (UAP) footage to be an unfortunate necessity to bypass institutional reluctance at the Department of Defense (DoD).","quote":"It's bizarre and unfortunate that someone like myself has to do something like that to get a national security issue like this on the agenda."},{"id":"de00b9c9-8a5a-4f49-8c56-fdcb29d3864c","type":"administrative","location":"00:11:46.1-00:12:07.2","speaker":"Whitaker, Bill","text":"Christopher Mellon and Luis Elizondo actively promoted awareness of Unidentified Aerial Phenomena (UAP) through media outlets and meetings with members of the United States Congress.","quote":"He joined forces with now civilian Lou Elizondo, and they started to tell their story to anybody who would listen, to newspapers, the History Channel, to members of Congress."},{"id":"dedd585e-74d6-40f7-9673-b63e9d36996c","type":"testimony","location":"00:12:07.2-00:12:22.6","speaker":"Mellon, Christopher","text":"Christopher Mellon and Luis Elizondo deliberately engaged the public to pressure the United States Congress, intending to compel the Department of Defense (DoD) to formally investigate Unidentified Aerial Phenomena (UAP).","quote":"We knew and understood that you had to go to the public, get the public interested to get Congress interested, to then circle back to the Defense Department and get them to start taking a look at it."},{"id":"6a3540be-7788-4196-aaba-da4103be569e","type":"administrative","location":"00:12:12.6-00:12:20.1","speaker":"Whitaker, Bill","text":"In August 2020, the Department of Defense (DoD) re-established the Advanced Aerospace Threat Identification Program (AATIP) under the new name Unidentified Aerial Phenomena (UAP) Task Force.","quote":"This past August, the Pentagon resurrected AATIP. It's now called the UAP Task Force."},{"id":"e0ea8ada-e995-4e3e-a85a-c24252fc93cc","type":"administrative","location":"00:12:15.6-00:12:22.6","speaker":"Whitaker, Bill","text":"Under the UAP Task Force guidelines, United States Navy service members are officially encouraged to report encounters with Unidentified Aerial Phenomena (UAP).","quote":"Service members now are encouraged to report strange encounters."},{"id":"0bdf5c0e-5b02-4221-be1a-a458a6dd6168","type":"opinion","location":"00:12:20.1-00:12:26.5","speaker":"Rubio, Marco","text":"Marco Rubio considers any object entering United States airspace without authorisation to be a direct national security threat.","quote":"Anything that enters an airspace that's not supposed to be there is a threat."},{"id":"f11f0dc9-1903-4d56-b54f-3075dc1018f2","type":"administrative","location":"00:12:26.5-00:12:46.3","speaker":"Whitaker, Bill","text":"In December 2020, Marco Rubio formally requested the Office of the Director of National Intelligence (ODNI) and the Department of Defense (DoD) to submit an unclassified report on Unidentified Aerial Phenomena (UAP) to the United States Congress.","quote":"This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month."},{"id":"ccaebaaf-3077-4095-8e1b-0301e35e2fc9","type":"opinion","location":"00:12:56.2-00:13:12.2","speaker":"Rubio, Marco","text":"Marco Rubio acknowledges a political stigma on Capitol Hill regarding Unidentified Aerial Phenomena (UAP) research, but insists institutionalised mockery must not prevent official analysis.","quote":"You know, there's a stigma on Capitol Hill. ... But I don't think we can allow the stigma to keep us from having an answer to a very fundamental question."},{"id":"4bd3ab0f-6d58-487b-a96c-6c6a1c2edd59","type":"opinion","location":"00:13:12.2-00:13:35.4","speaker":"Rubio, Marco","text":"Marco Rubio advocates for the establishment of a permanent, standardised process within the Department of Defense (DoD) to catalogue and continuously analyse Unidentified Aerial Phenomena (UAP) data.","quote":"I want us to take it seriously and have a process... I want us to have a process to analyze the data every time it comes in, that there be a place where this is cataloged and constantly analyzed until we get some answers."},{"id":"47c5e6e4-219f-4be6-bdbc-d3488256e05b","type":"testimony","location":"00:13:35.4-00:13:41.7","speaker":"Dietrich, Alex","text":"Alex Dietrich expressed feelings of defensive vulnerability during the 2004 USS Nimitz UAP encounter due to the lack of appropriate countermeasures.","quote":"I felt the vulnerability of not having anything to defend ourselves."}],"nodes":[{"id":"ef76c4a8-8408-4c78-b991-f64d516ee4cf","type":"person","name":"Whitaker, Bill"},{"id":"90aa2632-7e86-435a-b6fc-1ba93e405f00","type":"person","name":"Elizondo, Luis"},{"id":"ecf84c19-55a3-4815-9e7e-9de2d6a711a3","type":"person","name":"Reid, Harry"},{"id":"83a88586-b919-482f-b4b0-a5180c0d112b","type":"person","name":"Graves, Ryan"},{"id":"1c07f81d-5f31-488b-baf7-00bc7e65a41a","type":"person","name":"Fravor, David"},{"id":"751b8a94-d08d-4351-b33b-37335b38a6c7","type":"person","name":"Dietrich, Alex"},{"id":"c4a3c993-91e6-4d01-afeb-cf07d00c2390","type":"person","name":"Mellon, Christopher"},{"id":"4d95b54f-8d59-41cc-9890-83a553df272e","type":"person","name":"Rubio, Marco"},{"id":"e599b170-d621-42d8-8ad9-f2a0cc721197","type":"organisation","name":"60 Minutes"},{"id":"3c598bc0-ddcd-4ed2-990d-c6ef8797f80b","type":"organisation","name":"United States Navy"},{"id":"df24244b-54b1-4076-989c-3cda80962420","type":"organisation","name":"Department of Defense (DoD)"},{"id":"37cf9589-a961-4903-a5dc-426c249d57dd","type":"organisation","name":"United States Senate"},{"id":"61df19ca-de62-401f-ba55-aa81e45ede95","type":"organisation","name":"United States Senate Select Committee on Intelligence"},{"id":"afc0bdc0-2253-47c2-9b74-ed7cbfbe016c","type":"organisation","name":"Office of the Director of National Intelligence (ODNI)"},{"id":"2723680d-89fa-47c1-a7e5-b5593561dc29","type":"organisation","name":"The New York Times"},{"id":"b110b9e9-1be0-43ba-afc1-4b7fab6ab196","type":"organisation","name":"History Channel"},{"id":"8e880cab-04c1-4074-a711-2fac162ba99e","type":"organisation","name":"United States Congress"},{"id":"aefcc0fa-5785-4566-9d78-e639b8853af6","type":"organisation","name":"Top Gun Naval Flight School"},{"id":"b7e0aa4c-1252-46d8-ae35-8988815877f8","type":"project","name":"Advanced Aerospace Threat Identification Program (AATIP)"},{"id":"8f4bc659-b8f4-40a8-a323-c9b0a1013089","type":"project","name":"Project Blue Book"},{"id":"e2db15ab-4c3a-47d5-a8f4-0d201fab0fde","type":"project","name":"UAP Task Force"},{"id":"e9d15dbb-6e48-478b-8d20-eea02d05bc18","type":"place","name":"USA, Virginia, Virginia Beach"},{"id":"e77c6009-e11d-4dba-be32-5ce948a69296","type":"place","name":"USA, Florida, Jacksonville"},{"id":"14b8868b-8c80-4f85-a420-0c85f6de2b92","type":"place","name":"USA, California, San Diego"},{"id":"72d4462c-26d8-48e4-a1e3-a1275ce71176","type":"place","name":"Cuba, Guantanamo Bay Naval Base"},{"id":"dee69415-0857-4bea-b972-c109d20702d2","type":"event","name":"2004 USS Nimitz UAP encounter"},{"id":"beb3cb22-6ea0-4336-a458-1be6825a376f","type":"object","name":"F/A-18"},{"id":"eaab530d-69e0-402c-b2fd-39f72342c343","type":"object","name":"USS Nimitz"},{"id":"0b98be79-09f5-4084-b166-17c7539a87a0","type":"object","name":"USS Princeton"},{"id":"e6e9f9d2-bd16-411c-a053-da3d30625307","type":"document","name":"60 Minutes: Navy pilots describe encounters with UFOs"},{"id":"494e24b7-fe1e-4ac0-80e9-bd8499b50bcb","type":"topic","name":"Unidentified Aerial Phenomena (UAP)"},{"id":"0a5b8655-9526-4e6b-92f0-78f5e902de37","type":"topic","name":"Unidentified Flying Object (UFO)"},{"id":"456e13be-7e17-44d4-96b3-bc36a6d337dd","type":"topic","name":"Anomalous Aerial Vehicle (AAV)"}]},{"id":"x-ai_grok-4.20","name":"x-ai / grok-4.20","errata":null,"claims":[{"id":"db552efe-999d-467e-8615-5f334946a1b5","type":"administrative","location":"00:00:07.6-00:00:44.4","speaker":"Whitaker, Bill","text":"During 60 Minutes (CBS) 2021-05-17 Navy pilots describe encounters with UFOs, Bill Whitaker introduces the topic of the United States government's acknowledgement of Unidentified Aerial Phenomena (UAP).","quote":"It's the story of the U.S. government's grudging acknowledgement of Unidentified Aerial Phenomena, UAP, more commonly known as ufos after decades of public denial the pentagon now admits there's something out there and the u.s senate wants to know what it is"},{"id":"1d115037-be55-47ce-a747-da456a53073f","type":"administrative","location":"00:00:07.6-00:00:44.4","speaker":"Whitaker, Bill","text":"The United States Senate Select Committee on Intelligence ordered the Office of the Director of National Intelligence (ODNI) and the secretary of defense to deliver a report on Unidentified Aerial Phenomena (UAP) by June 2021.","quote":"the intelligence committee has ordered the director of national intelligence and the secretary of defense to deliver a report on the mysterious sightings by next month"},{"id":"3e3c7f5d-f565-4e34-9de0-ad87d394b7e6","type":"opinion","location":"00:00:44.4-00:01:02.4","speaker":"Elizondo, Luis","text":"In 60 Minutes (CBS) 2021-05-17 Navy pilots describe encounters with UFOs, Luis Elizondo states that the United States government has stated for the record that Unidentified Aerial Phenomena (UAP) are real.","quote":"Luis Elizondo: Bill, I think we're beyond that already. The government has already stated for the record that they're real. I'm not telling you that. The United States government is telling you that."},{"id":"44acfdae-98a3-4de7-bdae-b7bd49308c13","type":"administrative","location":"00:01:02.4-00:01:11.5","speaker":"Whitaker, Bill","text":"Luis Elizondo spent 20 years running military intelligence operations worldwide including in Afghanistan, the Middle East, and Guantanamo.","quote":"Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo."},{"id":"874fdb9b-b423-4610-9399-b8c1b806ac4a","type":"administrative","location":"00:01:02.4-00:01:24.1","speaker":"Whitaker, Bill","text":"Luis Elizondo joined the Advanced Aerospace Threat Identification Program (AATIP) at The Pentagon in 2008.","quote":"He hadn't given UFOs a second thought until 2008. That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP."},{"id":"35e37c3a-78a8-4859-a0bf-0e84b4e826f0","type":"administrative","location":"00:01:24.1-00:01:35.9","speaker":"Elizondo, Luis","text":"The mission of the Advanced Aerospace Threat Identification Program (AATIP) was to collect and analyse information involving Anomalous Aerial Vehicle (AAV).","quote":"The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs. We call them UAPs."},{"id":"90c5695f-03dc-4484-bd19-e4243c2b3fea","type":"administrative","location":"00:01:35.9-00:02:01.6","speaker":"Whitaker, Bill","text":"The Advanced Aerospace Threat Identification Program (AATIP) was part of a 22 million United States dollar programme sponsored by Harry Reid to investigate Unidentified Flying Object (UFO).","quote":"Buried away in the Pentagon, AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs."},{"id":"706f13fb-23c1-41e4-811d-27c6fc8957d0","type":"administrative","location":"00:01:50.3-00:02:12.6","speaker":"Whitaker, Bill","text":"Luis Elizondo took over the Advanced Aerospace Threat Identification Program (AATIP) in 2010 and focused on the national security implications of Unidentified Aerial Phenomena (UAP) documented by United States service members.","quote":"When Elizondo took over in 2010, he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members."},{"id":"242c204d-d359-46d3-a78d-6b1c21b6ce7b","type":"measurement","location":"00:02:12.6-00:02:37.0","speaker":"Elizondo, Luis","text":"Luis Elizondo states that Unidentified Aerial Phenomena (UAP) demonstrate technology capable of 600 to 700 G-forces.","quote":"Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity. That's precisely what we're seeing."},{"id":"8c4ea7ba-b20f-4012-8473-eca86c28bfff","type":"measurement","location":"00:02:12.6-00:02:37.0","speaker":"Elizondo, Luis","text":"Luis Elizondo states that Unidentified Aerial Phenomena (UAP) can fly at approximately 21,000 kilometres per hour.","quote":"Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity. That's precisely what we're seeing."},{"id":"a71b0eef-5cb3-44e1-9413-2bc8ead2bf70","type":"measurement","location":"00:02:12.6-00:02:37.0","speaker":"Elizondo, Luis","text":"Luis Elizondo states that Unidentified Aerial Phenomena (UAP) can evade radar.","quote":"Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity. That's precisely what we're seeing."},{"id":"e8ab3146-b8b3-49dd-b9e7-68296e5937fd","type":"measurement","location":"00:02:12.6-00:02:37.0","speaker":"Elizondo, Luis","text":"Luis Elizondo states that Unidentified Aerial Phenomena (UAP) can fly through air and water and possibly space.","quote":"Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity. That's precisely what we're seeing."},{"id":"77503c31-372d-4504-a182-8139774653a3","type":"measurement","location":"00:02:12.6-00:02:37.0","speaker":"Elizondo, Luis","text":"Luis Elizondo states that Unidentified Aerial Phenomena (UAP) have no obvious signs of propulsion, no wings, and no control surfaces.","quote":"Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity. That's precisely what we're seeing."},{"id":"a0303bbe-af56-415b-afe2-a9845af6e5dd","type":"measurement","location":"00:02:12.6-00:02:37.0","speaker":"Elizondo, Luis","text":"Luis Elizondo states that Unidentified Aerial Phenomena (UAP) can defy the natural effects of Earth's gravity.","quote":"Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity. That's precisely what we're seeing."},{"id":"a2ac8e39-8003-4ec8-8cf7-2ed5c9e12817","type":"administrative","location":"00:02:37.0-00:02:47.7","speaker":"Whitaker, Bill","text":"The Advanced Aerospace Threat Identification Program (AATIP) was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time.","quote":"Elizondo tells us AATIP was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time."},{"id":"2d4327f6-1473-4785-965f-2fc9bb295334","type":"observation","location":"00:02:47.7-00:03:07.3","speaker":"Whitaker, Bill","text":"The Advanced Aerospace Threat Identification Program (AATIP) analysed videos of a fast-moving object off the United States Atlantic coast in 2015.","quote":"They combed through data and records and analyzed videos like this. A Navy aircrew struggles to lock onto a fast-moving object off the U.S. Atlantic coast in 2015."},{"id":"eac39a55-480e-49bf-b8ad-0c68389152ca","type":"administrative","location":"00:03:07.3-00:03:20.4","speaker":"Whitaker, Bill","text":"The Pentagon admits it does not know the identity of certain objects shown in recently released images of Unidentified Aerial Phenomena (UAP).","quote":"Recently released images may not convince UFO skeptics, but the Pentagon admits it doesn't know what in the world this is, or this, or this."},{"id":"6a3e8f5f-31c4-4f54-affb-afb1ac3d9425","type":"opinion","location":"00:03:22.3-00:03:38.6","speaker":"Elizondo, Luis","text":"In some cases there are simple explanations for what people are witnessing with respect to Unidentified Aerial Phenomena (UAP), but there are some cases that are not.","quote":"In some cases, there are simple explanations for what people are witnessing, but there are some that that are not."},{"id":"dbe1445d-905e-4b36-811b-4de39a030ad0","type":"administrative","location":"00:03:30.4-00:04:06.2","speaker":"Elizondo, Luis","text":"The Advanced Aerospace Threat Identification Program (AATIP) performed due diligence before concluding that some sightings are Unidentified Aerial Phenomena (UAP) in United States airspace.","quote":"We're not just simply jumping to a conclusion that's saying, oh, that's a UAP out there. We're going through our due diligence. Is it some sort of new type of cruise missile technology that China has developed? Is it some sort of high-altitude balloon that's conducting reconnaissance? Ultimately, when you have exhausted all those what-ifs and you're still left with the fact that this is in our airspace and it's real, that's when it becomes compelling and that's when it becomes problematic."},{"id":"85a590d4-f4f2-43d7-b091-8c455271c087","type":"opinion","location":"00:04:06.2-00:04:12.9","speaker":"Whitaker, Bill","text":"Ryan Graves calls Unidentified Aerial Phenomena (UAP) a security risk.","quote":"Former Navy pilot Lieutenant Ryan Graves calls whatever is out there a security risk."},{"id":"44abcc23-9ef4-4358-8b73-d7ae95335bb0","type":"observation","location":"00:04:06.2-00:04:29.7","speaker":"Whitaker, Bill","text":"Ryan Graves' F/A-18 squadron began seeing Unidentified Aerial Phenomena (UAP) hovering over restricted airspace southeast of Virginia Beach in 2014 after updating their jet's radar.","quote":"He told us his F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar, making it possible to zero in with infrared targeting cameras."},{"id":"9afffd8c-7eca-4533-bff3-e8a8673ade5e","type":"opinion","location":"00:04:29.7-00:04:38.6","speaker":"Graves, Ryan","text":"Ryan Graves states that dual radar and infrared detection of Unidentified Aerial Phenomena (UAP) is hard to spoof.","quote":"Bill Whitaker: So you're seeing it both with the radar and with the infrared, and that tells you that there is something out there. Ryan Graves: Pretty hard to spoof that."},{"id":"d8bf65e0-ac77-42ad-8e39-59d33c639e36","type":"observation","location":"00:04:38.6-00:04:43.0","speaker":"Whitaker, Bill","text":"Photographs of Unidentified Aerial Phenomena (UAP) were taken in 2019 in the area southeast of Virginia Beach.","quote":"These photographs were taken in 2019 in the same area."},{"id":"c9c3cfaf-c7d3-4fe7-ad67-1ddc83eb1b17","type":"administrative","location":"00:04:38.6-00:04:48.2","speaker":"Whitaker, Bill","text":"The Pentagon confirms that 2019 photographs show objects it cannot identify.","quote":"The Pentagon confirms these are images of objects it can't identify."},{"id":"d071188f-443e-4c72-80fa-088e63fdcddc","type":"observation","location":"00:04:48.2-00:05:02.5","speaker":"Graves, Ryan","text":"Ryan Graves states that pilots training off the Atlantic coast see Unidentified Aerial Phenomena (UAP) every day for at least a couple of years.","quote":"Lieutenant Graves told us pilots training off the Atlantic coast see things like that all the time. Ryan Graves: Every day. Every day for at least a couple of years."},{"id":"3dcc1335-cf31-4ab1-a225-2069160820d2","type":"observation","location":"00:05:02.5-00:05:04.3","speaker":"Graves, Ryan","text":"Ryan Graves observed no exhaust plume on the Unidentified Aerial Phenomena (UAP) off the Atlantic coast.","quote":"You know, I don't see an exhaust plume."},{"id":"4e1e8758-a3df-454c-8179-8388eee84bc5","type":"observation","location":"00:05:04.3-00:05:25.4","speaker":"Graves, Ryan","text":"In 2015, members of Ryan Graves' squadron captured video of a rotating Unidentified Aerial Phenomena (UAP) off the coast of Jacksonville, Florida using a targeting camera.","quote":"including this one, off the coast of Jacksonville, Florida in 2015, captured on a targeting camera by members of Graves' squadron. [external footage] Look at that thing! It's rotating. My gosh! They're all going against the wind. The wind's 120 knots far west. Look at that thing, dude."},{"id":"6a266464-c46a-4857-bf26-a0a9523f934f","type":"measurement","location":"00:05:21.6-00:05:23.8","speaker":null,"text":"The wind speed during the 2015 Jacksonville Unidentified Aerial Phenomena (UAP) encounter was 120 knots, or approximately 220 kilometres per hour.","quote":"The wind's 120 knots far west."},{"id":"38815b60-5b85-4469-8087-e34be8833077","type":"opinion","location":"00:05:25.4-00:05:33.2","speaker":"Graves, Ryan","text":"Ryan Graves states that the voices of the aircrew in the 2015 Jacksonville video convey surprise at the Unidentified Aerial Phenomena (UAP).","quote":"You certainly can. They seem to have broke character a bit, and were just kind of amazed at what they were seeing."},{"id":"404d8c04-83e8-449c-9d17-60344d368c66","type":"opinion","location":"00:05:33.2-00:05:44.9","speaker":"Graves, Ryan","text":"Ryan Graves considers the 2015 Jacksonville Unidentified Aerial Phenomena (UAP) video difficult to explain due to its rotation, high altitude, and apparent propulsion.","quote":"This is a difficult one to explain. You have rotation, you have high altitudes, you have propulsion, right? I don't know. I don't know what it is, frankly."},{"id":"fb975068-9c6f-4968-b1b8-84ad5d39c688","type":"opinion","location":"00:05:44.9-00:05:56.0","speaker":"Whitaker, Bill","text":"Ryan Graves states that pilots speculate the Unidentified Aerial Phenomena (UAP) are secret United States technology, an adversary spy vehicle, or something otherworldly.","quote":"He told us pilots speculate they are one of three things, secret U.S. technology, an adversary spy vehicle, or something otherworldly."},{"id":"4b30493d-8e8b-4b29-8001-ac2285f3e57e","type":"opinion","location":"00:05:56.0-00:06:05.4","speaker":"Graves, Ryan","text":"Ryan Graves considers a threat observation programme the highest probability explanation for the observed Unidentified Aerial Phenomena (UAP).","quote":"I'd say, you know, the highest probability is it's a threat observation program."},{"id":"afe9286a-49b9-4666-a6d3-a1d3ffca9efd","type":"opinion","location":"00:06:00.5-00:06:06.4","speaker":"Graves, Ryan","text":"Ryan Graves considers Russian or Chinese technology a possible explanation for the observed Unidentified Aerial Phenomena (UAP).","quote":"Bill Whitaker: Could it be Russian or Chinese technology? Ryan Graves: I don't see why not."},{"id":"d73e2111-dca5-4787-8445-e75b58c8fb2f","type":"opinion","location":"00:06:05.4-00:06:18.5","speaker":"Graves, Ryan","text":"Ryan Graves is worried about the observed Unidentified Aerial Phenomena (UAP).","quote":"Are you alarmed? Ryan Graves: I am worried, frankly."},{"id":"eb21f9c8-4957-4c9c-a7d3-24341fa90deb","type":"opinion","location":"00:06:05.4-00:06:23.4","speaker":"Graves, Ryan","text":"Ryan Graves states that if the observed Unidentified Aerial Phenomena (UAP) were tactical jets from another country it would be a massive issue but because they look slightly different the problem is being ignored.","quote":"You know, if these were tactical jets from another country that were hanging out up there, it would be a massive issue. But because it looks slightly different, we're not willing to actually look at the problem in the face. We're happy to just ignore the fact that these are out there watching us every day."},{"id":"1f9043ed-b4c0-4fcb-99da-218188bb278a","type":"administrative","location":"00:06:23.4-00:06:30.3","speaker":"Whitaker, Bill","text":"The United States government closed its Project Blue Book investigation in 1969.","quote":"The government has ignored it, at least publicly, since closing its Project Blue Book investigation in 1969."},{"id":"3b91465b-091d-43bc-8927-182165659b02","type":"observation","location":"00:06:23.4-00:06:40.8","speaker":"Whitaker, Bill","text":"An incident involving Unidentified Aerial Phenomena (UAP) off Southern California in 2004 was documented by radar, camera, and four naval aviators.","quote":"But that began to change after an incident off Southern California in 2004, which was documented by radar, by camera, and four naval aviators."},{"id":"5dce7982-0753-4a0a-847f-3e0326b46fb9","type":"administrative","location":"00:06:30.3-00:06:57.3","speaker":"Whitaker, Bill","text":"David Fravor is a graduate of the Top Gun Naval Flight School and was commander of the F/A-18 squadron on the USS Nimitz.","quote":"We spoke to two of them, David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz, and flying at his wing, Lieutenant Alex Dietrich, who has never spoken publicly about the encounter."},{"id":"836f3b1f-6770-4c17-8f67-f333abee2836","type":"administrative","location":"00:06:30.3-00:06:57.3","speaker":"Whitaker, Bill","text":"Alex Dietrich had never spoken publicly about the 2004 USS Nimitz UAP encounter before appearing on 60 Minutes (CBS) 2021-05-17 Navy pilots describe encounters with UFOs.","quote":"and flying at his wing, Lieutenant Alex Dietrich, who has never spoken publicly about the encounter."},{"id":"2c07705c-8015-4624-a18d-53afe0e9d4c9","type":"opinion","location":"00:06:57.3-00:07:01.1","speaker":"Dietrich, Alex","text":"Alex Dietrich states she never wanted to be on national television.","quote":"Alex Dietrich: I never wanted to be on national TV, no offense."},{"id":"9b978ac7-0513-4426-b65f-e83520b3c7a1","type":"opinion","location":"00:07:02.7-00:07:14.4","speaker":"Dietrich, Alex","text":"Alex Dietrich decided to appear publicly because she was in a government aircraft, on the clock, the information is unclassified, and she feels a responsibility to share what she can about the 2004 USS Nimitz UAP encounter.","quote":"Because I was in a government aircraft, because I was on the clock, and so I feel a responsibility to share what I can, and it is unclassified."},{"id":"0a693f32-6460-4850-934f-2a6c061d2d82","type":"observation","location":"00:07:14.4-00:07:23.1","speaker":"Whitaker, Bill","text":"The 2004 USS Nimitz UAP encounter occurred in November 2004 while the USS Nimitz Carrier Strike Group was training approximately 160 kilometres southwest of San Diego.","quote":"It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego."},{"id":"aec97a30-bd6f-4077-80e9-7ed0ed4f5a87","type":"observation","location":"00:07:14.4-00:07:39.3","speaker":"Whitaker, Bill","text":"For a week prior to 2004-11-14, the advanced radar on the USS Princeton detected multiple Anomalous Aerial Vehicle (AAV) over the horizon descending approximately 24,000 metres in less than a second.","quote":"For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 80,000 feet in less than a second."},{"id":"77f2dd59-06f3-48a9-b490-596c84e16c6a","type":"observation","location":"00:07:23.1-00:07:47.8","speaker":"Whitaker, Bill","text":"On 2004-11-14, David Fravor and Alex Dietrich, each with a weapons system officer, were diverted to investigate the Anomalous Aerial Vehicle (AAV).","quote":"On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate."},{"id":"5201a684-635d-4972-a52c-b73ab92d33fa","type":"observation","location":"00:07:39.3-00:07:55.9","speaker":"Whitaker, Bill","text":"During the 2004 USS Nimitz UAP encounter, David Fravor and Alex Dietrich observed an area of roiling white water the size of a Boeing 737 in an otherwise calm blue sea.","quote":"They found an area of roiling white water the size of a 737 in an otherwise calm blue sea."},{"id":"741f0d33-ccdb-49f1-81ee-da3ff9877ba7","type":"observation","location":"00:07:55.9-00:08:12.3","speaker":"Fravor, David","text":"During the 2004 USS Nimitz UAP encounter, David Fravor and Alex Dietrich observed a small white tic-tac-looking object moving above the white water area.","quote":"David Fravor: So as we're looking at this, her backseater says, hey, Skipper, do you? And about that got out, I said, dude, do you see that thing down there? And we saw this little white tic-tac-looking object. And it's just kind of moving above the whitewater area."},{"id":"a317025d-0951-4cde-83be-84f88f49b676","type":"observation","location":"00:08:12.3-00:08:20.2","speaker":"Fravor, David","text":"During the 2004 USS Nimitz UAP encounter, as Alex Dietrich circled above, David Fravor spiralled down for a closer look at the object.","quote":"As Dietrich circled above, Fravor went in for a closer look. Sort of spiraling down? David Fravor: Yep. The tic-tac's still pointing north-south."},{"id":"8dff41ec-4be7-497d-bb0a-048818377d51","type":"observation","location":"00:08:20.2-00:08:27.0","speaker":"Fravor, David","text":"During the 2004 USS Nimitz UAP encounter, the Tic Tac object turned abruptly and began mirroring David Fravor's movements.","quote":"It goes and just turns abruptly and starts mirroring me. So as I'm coming down, it starts coming up."},{"id":"753ae681-748f-4ea0-9b39-de86ec01c4c9","type":"observation","location":"00:08:27.0-00:08:30.5","speaker":"Fravor, David","text":"During the 2004 USS Nimitz UAP encounter, the Tic Tac object was aware of the presence of David Fravor and Alex Dietrich's aircraft.","quote":"So it's mimicking your moves. David Fravor: Yeah, it was aware we were there."},{"id":"4910ceaa-3225-4a40-9158-5f5aa1aa41fd","type":"observation","location":"00:08:30.5-00:08:37.0","speaker":"Whitaker, Bill","text":"During the 2004 USS Nimitz UAP encounter, the Tic Tac object was about the size of an F/A-18, with no markings, no wings, and no exhaust plumes.","quote":"He said it was about the size of his F-18, with no markings, no wings, no exhaust plumes."},{"id":"5c617a1e-21a1-49fd-b39f-ad69339dc1df","type":"observation","location":"00:08:37.0-00:08:49.4","speaker":"Fravor, David","text":"During the 2004 USS Nimitz UAP encounter, the Tic Tac object disappeared after climbing in front of David Fravor's aircraft.","quote":"I want to see how close I can get. So I go like this, and it's climbing still. And when it gets right in front of me, it just disappears. Bill Whitaker: Disappears? David Fravor: Disappears, like gone. It had sped off."},{"id":"29c62cf5-a0b3-4b5c-be08-ff551d31b564","type":"opinion","location":"00:08:49.4-00:09:00.9","speaker":"Dietrich, Alex","text":"During the 2004 USS Nimitz UAP encounter, Alex Dietrich initially categorised the object as maybe a helicopter or maybe a drone.","quote":"So your mind tries to make sense of it. I'm going to categorize this as maybe a helicopter or maybe a drone. And when it disappeared, I mean, it was just..."},{"id":"ef71c47f-0992-4110-b7d0-36c8632de095","type":"observation","location":"00:08:58.3-00:09:08.9","speaker":"Fravor, David","text":"During the 2004 USS Nimitz UAP encounter, the back seaters in both aircraft also observed the Tic Tac object.","quote":"Did your back seaters see this too? Alex Dietrich: Yeah. David Fravor: Oh, yeah. There was four of us in the airplanes literally watching this thing for roughly about five minutes."},{"id":"e261f8ae-3de8-43cd-bb17-681bd859b762","type":"observation","location":"00:09:00.9-00:09:08.9","speaker":"Fravor, David","text":"During the 2004 USS Nimitz UAP encounter, four naval aviators watched the Tic Tac object for roughly five minutes.","quote":"There was four of us in the airplanes literally watching this thing for roughly about five minutes."},{"id":"3f865179-ff19-46a8-afd3-f7e690bbddce","type":"observation","location":"00:09:08.9-00:09:14.4","speaker":"Whitaker, Bill","text":"Seconds after disappearing from view during the 2004 USS Nimitz UAP encounter, the USS Princeton reacquired the target approximately 97 kilometres away.","quote":"Seconds later, the Princeton reacquired the target, 60 miles away."},{"id":"3dcc1778-5372-48de-a70a-c34ca37187b7","type":"observation","location":"00:09:14.4-00:09:20.8","speaker":"Whitaker, Bill","text":"During the 2004 USS Nimitz UAP encounter, another crew briefly locked onto the object with a targeting camera before it zipped off again.","quote":"Another crew managed to briefly lock onto it with a targeting camera before it zipped off again."},{"id":"c0f638a9-8ec5-4fc9-ab5d-3ea161584a2f","type":"opinion","location":"00:09:20.8-00:09:31.1","speaker":"Dietrich, Alex","text":"Alex Dietrich states that over beers the aircrew have said that if she had seen the object solo she might not have reported it because it sounds crazy.","quote":"You know, I think that over beers, we've sort of said, hey, man, if I saw this solo, I don't know that I would have come back and said anything because it sounds so crazy when I say it."},{"id":"79b4a47a-d2c6-4f06-8d29-e577b8949f19","type":"opinion","location":"00:09:31.1-00:09:39.8","speaker":"Fravor, David","text":"David Fravor understands the reluctance to report sightings that sound crazy and states that he is not a UFO guy.","quote":"You understand that reaction? David Fravor: I do. I've had some people tell me, you know, when you say that, you can sound crazy. I'll be honest. I'm not a UFO guy."},{"id":"01e9f1f8-c6b6-4113-a494-5b79b700e662","type":"opinion","location":"00:09:39.8-00:09:56.5","speaker":"Fravor, David","text":"David Fravor states there is definitely something out there that was better than our airplane during the 2004 USS Nimitz UAP encounter.","quote":"But from what I hear you guys saying, there's something. David Fravor: Yes. There's definitely something that, I don't know who's building it, who's got the technology, who's got the brains, but there's something out there that was better than our airplane."},{"id":"ed712c87-29b4-4274-9441-7b30a3fc3857","type":"administrative","location":"00:09:56.5-00:10:04.2","speaker":"Whitaker, Bill","text":"The air crew filed reports after the 2004 USS Nimitz UAP encounter.","quote":"The air crew filed reports."},{"id":"9968eaa0-417e-4d93-a0e6-587a8e04a6f2","type":"administrative","location":"00:09:56.5-00:10:13.2","speaker":"Whitaker, Bill","text":"After the 2004 USS Nimitz UAP encounter, nothing was said or done officially for five years until Luis Elizondo came across the story and investigated.","quote":"Then, like the mysterious flying object, the Nimitz encounter disappeared. Nothing was said or done officially for five years until Lou Elizondo came across the story and investigated."},{"id":"8a94ee10-cd59-4194-ad6c-c68e03d5dbe2","type":"opinion","location":"00:10:04.2-00:10:27.7","speaker":"Elizondo, Luis","text":"Luis Elizondo states that the United States spends millions of dollars training pilots who are seeing something they cannot explain, backed up by electro-optical data and radar data.","quote":"We spend millions of dollars in training these pilots, and they are seeing something that they can't explain. Furthermore, that information's being backed up on electro-optical data, like gun camera footage, and by radar data. Now, to me, that's compelling."},{"id":"de899b29-1078-4e83-b5e4-db1d02995eed","type":"administrative","location":"00:10:27.7-00:10:31.7","speaker":"Whitaker, Bill","text":"Inside The Pentagon, Luis Elizondo's findings on Unidentified Aerial Phenomena (UAP) were met with skepticism.","quote":"Inside the Pentagon, his findings were met with skepticism."},{"id":"c9c59a2a-767f-446b-b89c-fde34ffcbeb6","type":"administrative","location":"00:10:27.7-00:10:39.5","speaker":"Whitaker, Bill","text":"Advanced Aerospace Threat Identification Program (AATIP) funding was eliminated in 2012.","quote":"AATIP's funding was eliminated in 2012, but Elizondo says he and a handful of others kept the mission alive."},{"id":"4b43700c-c953-47ac-b251-b7815559897c","type":"administrative","location":"00:10:31.7-00:10:39.5","speaker":"Whitaker, Bill","text":"Luis Elizondo and a handful of others kept the Advanced Aerospace Threat Identification Program (AATIP) mission alive after its funding was eliminated in 2012.","quote":"but Elizondo says he and a handful of others kept the mission alive."},{"id":"64260dbe-2b30-4782-a379-7a247c4e4232","type":"administrative","location":"00:10:31.7-00:10:48.8","speaker":"Whitaker, Bill","text":"Luis Elizondo quit The Pentagon in 2017 but not before getting three videos declassified.","quote":"until finally, frustrated, he quit the Pentagon in 2017, but not before getting these three videos declassified."},{"id":"1f286b33-8ead-4f8d-bc66-1d966518edc3","type":"administrative","location":"00:10:51.9-00:11:08.4","speaker":"Whitaker, Bill","text":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush and had access to top-secret government programmes.","quote":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush, and had access to top-secret government programs."},{"id":"36607e4f-e934-4ae8-bb6f-e6bc574cbd6b","type":"opinion","location":"00:11:08.4-00:11:18.7","speaker":"Mellon, Christopher","text":"Christopher Mellon states with high degree of confidence that the observed Unidentified Aerial Phenomena (UAP) are not United States technology.","quote":"So it's not us, that's one thing we know. Bill Whitaker: We know that? Christopher Mellon: I could say that with a very high degree of confidence, in part because of the positions I held in the department, and I know the process."},{"id":"10b98658-0dbf-4a66-8555-740d5ecb221f","type":"opinion","location":"00:11:26.2-00:11:46.1","speaker":"Mellon, Christopher","text":"Christopher Mellon states it is bizarre and unfortunate that someone like himself had to leak the Navy videos to get a national security issue like Unidentified Aerial Phenomena (UAP) on the agenda.","quote":"It's bizarre and unfortunate that someone like myself has to do something like that to get a national security issue like this on the agenda."},{"id":"b89e1857-1f0b-4204-abc7-447ef25a6028","type":"opinion","location":"00:11:57.6-00:12:07.2","speaker":"Mellon, Christopher","text":"Christopher Mellon states that the strategy was to go to the public to get them interested, to get Congress interested, to then get the Defense Department to take a look at Unidentified Aerial Phenomena (UAP).","quote":"We knew and understood that you had to go to the public, get the public interested to get Congress interested, to then circle back to the Defense Department and get them to start taking a look at it."},{"id":"4b2224b9-4617-4c32-93a0-6d17f8cbe890","type":"administrative","location":"00:12:07.2-00:12:15.6","speaker":"Whitaker, Bill","text":"In August 2020, The Pentagon resurrected the Advanced Aerospace Threat Identification Program (AATIP) as the UAP Task Force.","quote":"This past August, the Pentagon resurrected AATIP. It's now called the UAP Task Force."},{"id":"3a5bb74f-8661-4989-9a0f-8d912cea7192","type":"administrative","location":"00:12:07.2-00:12:20.1","speaker":"Whitaker, Bill","text":"Service members are now encouraged to report strange encounters with Unidentified Aerial Phenomena (UAP).","quote":"Service members now are encouraged to report strange encounters."},{"id":"950e2ebb-aae0-425a-9c95-237e77c33abb","type":"administrative","location":"00:12:26.5-00:12:46.3","speaker":"Whitaker, Bill","text":"Marco Rubio, while head of the United States Senate Select Committee on Intelligence, asked the Director of National Intelligence and The Pentagon to present an unclassified report on Unidentified Aerial Phenomena (UAP) to Congress by June 2021.","quote":"This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month."},{"id":"310ab905-d660-40cd-aa10-45994316f461","type":"opinion","location":"00:12:20.1-00:12:26.5","speaker":"Rubio, Marco","text":"Marco Rubio states that anything that enters airspace that is not supposed to be there is a threat.","quote":"Anything that enters an airspace that's not supposed to be there is a threat."},{"id":"779c87a1-331e-462a-b7e7-bbcd4a41cee0","type":"administrative","location":"00:12:26.5-00:12:34.0","speaker":"Whitaker, Bill","text":"After receiving classified briefings on Unidentified Aerial Phenomena (UAP), Marco Rubio called for a detailed analysis.","quote":"After receiving classified briefings on UAPs, Senator Marco Rubio called for a detailed analysis."},{"id":"92eef014-4ad2-426e-bc3e-7ef9ff052756","type":"opinion","location":"00:12:46.3-00:12:56.2","speaker":"Rubio, Marco","text":"Marco Rubio states that the Pentagon and other branches of the military have a long history of dismissing Unidentified Aerial Phenomena (UAP).","quote":"The Pentagon and other branches of the military have a long history of sort of dismissing this."},{"id":"7e1955b3-e345-4327-83f1-1400cf7fe827","type":"opinion","location":"00:12:56.2-00:13:12.2","speaker":"Rubio, Marco","text":"Marco Rubio states there is a stigma on Capitol Hill about Unidentified Aerial Phenomena (UAP) but that it should not prevent having an answer to the fundamental question.","quote":"You know, there's a stigma on Capitol Hill. I mean, some of my colleagues are very interested in this topic and some kind of, you know, giggle when you bring it up. But I don't think we can allow the stigma to keep us from having an answer to a very fundamental question."},{"id":"3c9d696d-5bd6-4aff-bb0b-01716239705b","type":"opinion","location":"00:13:12.2-00:13:35.4","speaker":"Rubio, Marco","text":"Marco Rubio wants a process to take Unidentified Aerial Phenomena (UAP) seriously, analyse incoming data, catalog it, and constantly analyse it until answers are obtained.","quote":"I want us to take it seriously and have a process to take it seriously. I want us to have a process to analyze the data every time it comes in, that there be a place where this is cataloged and constantly analyzed until we get some answers. Maybe it has a very simple answer. Maybe it doesn't."},{"id":"11f48a80-a0f4-4205-bbcb-95690b0f2fa4","type":"opinion","location":"00:13:35.4-00:13:41.7","speaker":"Dietrich, Alex","text":"During the 2004 USS Nimitz UAP encounter, Alex Dietrich felt the vulnerability of not having anything to defend the aircraft with.","quote":"I felt the vulnerability of not having anything to defend ourselves."}],"nodes":[{"id":"180bbbda-b2aa-41ff-a7f8-56053c30b5be","type":"document","name":"60 Minutes (CBS) 2021-05-17 Navy pilots describe encounters with UFOs"},{"id":"b59a6499-54d6-47b2-8cd3-1cd594961b5d","type":"person","name":"Whitaker, Bill"},{"id":"328a0d58-40a1-4985-8482-c9aed03b43cc","type":"person","name":"Elizondo, Luis"},{"id":"5c393e53-8003-49b8-84a5-602298128e29","type":"person","name":"Graves, Ryan"},{"id":"f1bdc5e0-8014-46d8-822f-a154a732fd07","type":"person","name":"Fravor, David"},{"id":"3d5bc475-bac5-47ea-94ed-dec41d44872c","type":"person","name":"Dietrich, Alex"},{"id":"7332ca0b-96a6-4612-8892-624ffce759c9","type":"person","name":"Mellon, Christopher"},{"id":"3e7bae17-06f2-453b-9678-20a4bc781f10","type":"person","name":"Rubio, Marco"},{"id":"6c20a8a7-9e47-4c71-85ef-7fa555e8d4c3","type":"person","name":"Reid, Harry"},{"id":"3bc48163-6eb2-4808-b2b8-7fc0bbdc9298","type":"organisation","name":"United States Navy"},{"id":"674a023f-ffd6-4ca1-b874-f5a5a25180f4","type":"organisation","name":"United States Senate Select Committee on Intelligence"},{"id":"af21e071-80ab-448b-a47e-cc302fb4c565","type":"organisation","name":"Office of the Director of National Intelligence (ODNI)"},{"id":"fa0e9535-586b-412f-853c-5bfe53d1b427","type":"organisation","name":"The Pentagon"},{"id":"28734a3e-ce70-411b-86c9-ea611b744ee7","type":"organisation","name":"The New York Times"},{"id":"285e020b-372a-436e-adf9-a083a893fc1b","type":"organisation","name":"History Channel"},{"id":"c52e1208-8b2b-46fa-ae07-0513a71ab773","type":"organisation","name":"United States Congress"},{"id":"538456c2-1c65-4d5a-bd43-7a7558bee1df","type":"project","name":"Advanced Aerospace Threat Identification Program (AATIP)"},{"id":"916d1e95-72f7-4ad6-adac-e5e162ad3928","type":"project","name":"UAP Task Force"},{"id":"6877732f-673c-4e0f-830c-e2ff4a768053","type":"project","name":"Project Blue Book"},{"id":"6532bd4c-df6d-4581-a4cb-40ba885ca466","type":"place","name":"USA, Virginia, Virginia Beach"},{"id":"d157a054-0868-48e5-af4e-4933c12ec230","type":"place","name":"USA, Florida, Jacksonville"},{"id":"c18e1f19-062c-48f5-95fb-5e00a533690c","type":"place","name":"USA, California, San Diego"},{"id":"3de76380-95d5-4732-83bb-e30ee437c97f","type":"event","name":"2004 USS Nimitz UAP encounter"},{"id":"8dcc1fa0-f9c2-427e-80dd-23c7f0c0dd9d","type":"event","name":"2015 East Coast UAP encounters"},{"id":"376d7392-6451-44f2-95d0-8f717fb6f5d5","type":"object","name":"USS Nimitz"},{"id":"fdbb2ab9-f828-4cdb-a95a-d1e1b8211af6","type":"object","name":"USS Princeton"},{"id":"5d6721dd-818b-4433-bf27-a1f9095fac3c","type":"object","name":"F/A-18"},{"id":"8a3708eb-428f-4615-84d9-48ba2458a852","type":"topic","name":"Unidentified Aerial Phenomena (UAP)"},{"id":"ba6a34d4-46a1-4bde-83a0-5fce84ae29c9","type":"topic","name":"Unidentified Flying Object (UFO)"},{"id":"0b24de68-5ccc-49ae-bce4-733d5363988d","type":"topic","name":"Anomalous Aerial Vehicle (AAV)"}]},{"id":"x-ai_grok-4.3","name":"x-ai / grok-4.3","errata":null,"claims":[{"id":"87d241b0-3ca0-4e28-9423-567bea03bf56","type":"administrative","location":"00:00:09.1-00:00:14.9","speaker":null,"text":"The United States government has officially acknowledged the existence of Unidentified Aerial Phenomena (UAP).","quote":"after decades of public denial the pentagon now admits there's something out there"},{"id":"9a05adb1-cc15-4650-a677-a0102b267e3d","type":"administrative","location":"00:00:14.9-00:00:44.4","speaker":null,"text":"The United States Senate Select Committee on Intelligence ordered the Office of the Director of National Intelligence (ODNI) and the Department of Defense (DoD) to deliver a report on Unidentified Aerial Phenomena (UAP) sightings.","quote":"the u.s senate wants to know what it is the intelligence committee has ordered the director of national intelligence and the secretary of defense to deliver a report on the mysterious sightings by next month"},{"id":"311a7da8-b9e7-44ca-8ce8-f5e99940918f","type":"administrative","location":"00:01:02.4-00:01:11.5","speaker":null,"text":"Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo.","quote":"Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo."},{"id":"979a32c5-2419-41e9-b6f5-f6f12f5a0cd7","type":"administrative","location":"00:01:11.5-00:01:15.6","speaker":null,"text":"Luis Elizondo joined the Advanced Aerospace Threat Identification Program (AATIP) at the Pentagon in 2008.","quote":"That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP."},{"id":"dc7547be-b1df-494a-a1c9-885be01557d6","type":"administrative","location":"00:01:24.1-00:01:34.3","speaker":"Elizondo, Luis","text":"The mission of the Advanced Aerospace Threat Identification Program (AATIP) was to collect and analyse information involving anomalous aerial vehicles.","quote":"The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles"},{"id":"8f2e5c3d-61cf-4d4b-981a-bf5a72085640","type":"administrative","location":"00:01:50.3-00:02:01.6","speaker":null,"text":"The Advanced Aerospace Threat Identification Program (AATIP) was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate Unidentified Flying Objects (UFOs).","quote":"Buried away in the Pentagon, AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs."},{"id":"24307afb-ac8c-48e3-b4c2-019fd0bd16d1","type":"administrative","location":"00:02:01.6-00:02:10.8","speaker":null,"text":"Luis Elizondo took over the Advanced Aerospace Threat Identification Program (AATIP) in 2010.","quote":"When Elizondo took over in 2010"},{"id":"6c5dd090-6993-4f0a-bedd-dba71e372b85","type":"measurement","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Unidentified Aerial Phenomena (UAP) documented by United States service members are capable of 600 to 700 G-forces.","quote":"Imagine a technology that can do 600 to 700 G-forces"},{"id":"eb84ca7b-368f-42f9-b825-eb398042069c","type":"measurement","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Unidentified Aerial Phenomena (UAP) documented by United States service members are capable of flying at approximately 21,000 kilometres per hour.","quote":"that can fly at 13,000 miles an hour"},{"id":"a3663184-624c-4613-94f4-379abaf1f4f1","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Unidentified Aerial Phenomena (UAP) documented by United States service members can evade radar.","quote":"that can evade radar"},{"id":"c14a7256-0f39-4e93-afd9-a316bba9ad3c","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Unidentified Aerial Phenomena (UAP) documented by United States service members can fly through air and water and possibly space.","quote":"that can fly through air and water and possibly space"},{"id":"fb2183ca-4214-40b9-8d47-43e801c1f9a4","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Eli "00:00:44.4-00:00:54.6","speaker":null,"text":"The United States government has officially confirmed for the record that Unidentified Flying Objects (UFOs) are real.","quote":"So what you're telling me is that UFOs, unidentified flying objects, are real."},{"id":"77b8da99-9fe3-4476-a844-b6bcd88b3c47","type":"administrative","location":"00:00:54.6-00:01:02.4","speaker":null,"text":"The United States government has officially confirmed for the record that Unidentified Aerial Phenomena (UAP) are real.","quote":"Bill, I think we're beyond that already. The government has already stated for the record that they're real. I'm not telling you that. The United States government is telling you that."},{"id":"9fee61f9-cae3-4a0e-a58e-14b869e2d815","type":"administrative","location":"00:01:02.4-00:01:15.6","speaker":null,"text":"Luis Elizondo spent 20 years running military intelligence operations worldwide.","quote":"Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo."},{"id":"5eaf4e6d-0ae9-46a7-82b2-21c73b8c17dd","type":"administrative","location":"00:01:02.4-00:01:15.6","speaker":null,"text":"In 2008, Luis Elizondo was asked to join the Advanced Aerospace Threat Identification Program (AATIP) at the Pentagon.","quote":"He hadn't given UFOs a second thought until 2008. That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP."},{"id":"cca1ecc9-0366-47af-84d6-90212d820115","type":"administrative","location":"00:01:24.1-00:01:35.9","speaker":null,"text":"The mission of the Advanced Aerospace Threat Identification Program (AATIP) was to collect and analyze information involving anomalous aerial vehicles.","quote":"The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs. We call them UAPs."},{"id":"2459ec08-8f3a-4983-8742-10d943411fbf","type":"opinion","location":"00:01:40.0-00:01:48.4","speaker":"Luis Elizondo","text":"The reality of Unidentified Aerial Phenomena (UAP) is not in question according to Luis Elizondo.","quote":"Look, Bill, I'm not telling you that it doesn't sound wacky. What I'm telling you is real. The question is, what is it? What are its intentions? What are its capabilities?"},{"id":"f6f7d47e-c742-4d2f-8cbb-d9b62147b1b8","type":"administrative","location":"00:01:50.3-00:02:10.8","speaker":null,"text":"The Advanced Aerospace Threat Identification Program (AATIP) was part of a $22 million program sponsored by Harry Reid to investigate Unidentified Flying Objects (UFOs).","quote":"Buried away in the Pentagon, AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs."},{"id":"581a0559-8a28-497b-96d5-512b650e0310","type":"administrative","location":"00:01:50.3-00:02:10.8","speaker":null,"text":"In 2010, Luis Elizondo took over leadership of the Advanced Aerospace Threat Identification Program (AATIP).","quote":"When Elizondo took over in 2010, he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members."},{"id":"586a29d9-c25b-4649-84b6-dbb4b6e82b59","type":"administrative","location":"00:01:50.3-00:02:10.8","speaker":null,"text":"Luis Elizondo focused on the national security implications of Unidentified Aerial Phenomena (UAP) documented by U.S. service members.","quote":"When Elizondo took over in 2010, he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members."},{"id":"c723c57a-a7ef-41df-8cfe-0a0f1a587340","type":"measurement","location":"00:02:12.6-00:02:35.2","speaker":"Luis Elizondo","text":"The observed Unidentified Aerial Phenomena (UAP) can withstand 600 to 700 G-forces.","quote":"Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity."},{"id":"9602edd8-22dd-46db-a5e0-7b492204b2a4","type":"measurement","location":"00:02:12.6-00:02:35.2","speaker":"Luis Elizondo","text":"The observed Unidentified Aerial Phenomena (UAP) can fly at approximately 21,000 kilometres per hour.","quote":"Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity."},{"id":"7b3f2d53-121b-47f3-b1f1-fafc11bafa57","type":"measurement","location":"00:02:12.6-00:02:35.2","speaker":"Luis Elizondo","text":"The observed Unidentified Aerial Phenomena (UAP) can evade radar detection.","quote":"Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity."},{"id":"5ebf0282-7e98-444a-9d8a-e1a41686a78e","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Luis Elizondo","text":"The observed Unidentified Aerial Phenomena (UAP) can fly through air and water and possibly space.","quote":"Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity."},{"id":"c8841ae0-eebd-482b-92fb-8c96294e4040","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Luis Elizondo","text":"The observed Unidentified Aerial Phenomena (UAP) have no obvious signs of propulsion.","quote":"Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity."},{"id":"d0e22caa-21a2-4415-a263-72f22a541665","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Luis Elizondo","text":"The observed Unidentified Aerial Phenomena (UAP) have no wings or control surfaces.","quote":"Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity."},{"id":"bb6de43e-0284-4f43-93e5-cbb48161bc8e","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Luis Elizondo","text":"The observed Unidentified Aerial Phenomena (UAP) can defy the natural effects of Earth's gravity.","quote":"Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity."},{"id":"5ffd7f20-284e-45c2-997d-bdc611c6933e","type":"administrative","location":"00:02:37.0-00:02:47.7","speaker":null,"text":"The Advanced Aerospace Threat Identification Program (AATIP) was composed of scientists, electro-optical engineers, avionics experts, and intelligence experts, often working part-time.","quote":"Elizondo tells us AATIP was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time."},{"id":"e81343c3-dd8c-417f-8e47-847a6101f848","type":"observation","location":"00:02:47.7-00:03:20.4","speaker":null,"text":"In 2015, a Navy aircrew struggled to lock onto a fast-moving object off the U.S. Atlantic coast.","quote":"A Navy aircrew struggles to lock onto a fast-moving object off the U.S. Atlantic coast in 2015."},{"id":"40e5304d-d5b7-4c20-b91a-3d507f0579f9","type":"administrative","location":"00:02:47.7-00:03:20.4","speaker":null,"text":"The Pentagon has admitted it cannot identify several objects shown in recently released images.","quote":"Recently released images may not convince UFO skeptics, but the Pentagon admits it doesn't know what in the world this is, or this, or this."},{"id":"b6cd0257-9fac-4706-850c-5fba639d866e","type":"opinion","location":"00:03:30.4-00:03:52.6","speaker":"Luis Elizondo","text":"Some witnessed phenomena have simple explanations according to Luis Elizondo.","quote":"In some cases, there are simple explanations for what people are witnessing, but there are some that are not."},{"id":"ab4c51b7-1c57-4ee0-8791-f98bb8599077","type":"administrative","location":"00:03:30.4-00:03:52.6","speaker":"Luis Elizondo","text":"The Advanced Aerospace Threat Identification Program (AATIP) conducts thorough investigations before identifying something as a Unidentified Aerial Phenomenon (UAP).","quote":"We're not just simply jumping to a conclusion that's saying, oh, that's a UAP out there. We're going through our due diligence."},{"id":"caa68aea-3d23-4fb8-b378-079a9aac8cb5","type":"opinion","location":"00:03:30.4-00:03:52.6","speaker":"Luis Elizondo","text":"Luis Elizondo considers new Chinese cruise missile technology a possible explanation for observed Unidentified Aerial Phenomena (UAP).","quote":"Is it some sort of new type of cruise missile technology that China has developed?"},{"id":"bd587a34-fcc2-4751-ad6d-60c57844a5c5","type":"opinion","location":"00:03:30.4-00:03:52.6","speaker":"Luis Elizondo","text":"Luis Elizondo considers high-altitude reconnaissance balloons a possible explanation for observed Unidentified Aerial Phenomena (UAP).","quote":"Is it some sort of high-altitude balloon that's conducting reconnaissance?"},{"id":"6b98a0fc-b3eb-4b65-81fb-3997b97cd2fc","type":"opinion","location":"00:03:30.4-00:03:52.6","speaker":"Luis Elizondo","text":"When all other explanations are exhausted and an object remains unexplained in U.S. airspace, it becomes a compelling and problematic Unidentified Aerial Phenomenon (UAP).","quote":"Ultimately, when you have exhausted all those what-ifs and you're still left with the fact that this is in our airspace and it's real, that's when it becomes compelling and that's when it becomes problematic."},{"id":"97e7c5c1-2dbc-4e8e-942f-011095f6ef80","type":"opinion","location":"00:04:06.2-00:04:38.6","speaker":"Ryan Graves","text":"Ryan Graves considers Unidentified Aerial Phenomena (UAP) a security risk.","quote":"Former Navy pilot Lieutenant Ryan Graves calls whatever is out there a security risk."},{"id":"5a5564bb-6883-4bdc-a8f0-549d4840b8b1","type":"observation","location":"00:04:06.2-00:04:38.6","speaker":null,"text":"In 2014, Ryan Graves' F-18 squadron began seeing Unidentified Aerial Phenomena (UAP) hovering over restricted airspace southeast of Virginia Beach.","quote":"He told us his F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar, making it possible to zero in with infrared targeting cameras."},{"id":"c0c92aed-2862-435a-99db-dd45e4ed9a76","type":"administrative","location":"00:04:06.2-00:04:38.6","speaker":null,"text":"An updated radar system on the F-18 made it possible to detect objects with infrared targeting cameras.","quote":"He told us his F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar, making it possible to zero in with infrared targeting cameras."},{"id":"9b86ab96-d22d-4e76-a3dc-a14db378858e","type":"observation","location":"00:04:06.2-00:04:38.6","speaker":null,"text":"The dual radar-and-infrared detection of Unidentified Aerial Phenomena (UAP) is hard to spoof.","quote":"So you're seeing it both with the radar and with the infrared, and that tells you that there is something out there."},{"id":"e5316e10-2c15-46eb-80ce-01f1788f917a","type":"administrative","location":"00:04:38.6-00:04:56.6","speaker":null,"text":"Photographs of Unidentified Aerial Phenomena (UAP) were taken in 2019 in the same area as previous sightings.","quote":"These photographs were taken in 2019 in the same area."},{"id":"d8552589-68c7-430b-9c27-dc6396dd5b43","type":"administrative","location":"00:04:38.6-00:04:56.6","speaker":null,"text":"The Pentagon has confirmed that certain photographs show objects it cannot identify.","quote":"The Pentagon confirms these are images of objects it can't identify."},{"id":"69d42178-3f06-4c4e-afff-dec00bcb79f4","type":"testimony","location":"00:04:38.6-00:04:56.6","speaker":"Ryan Graves","text":"According to Ryan Graves, pilots training off the Atlantic coast see Unidentified Aerial Phenomena (UAP) every day.","quote":"Lieutenant Graves told us pilots training off the Atlantic coast see things like that all the time."},{"id":"fd0cf357-fad0-4c4c-9359-6cf8b0b4b3d5","type":"testimony","location":"00:04:38.6-00:04:56.6","speaker":"Ryan Graves","text":"According to Ryan Graves, pilots training off the Atlantic coast see Unidentified Aerial Phenomena (UAP) every day for at least a couple of years.","quote":"Every day. Every day for at least a couple of years."},{"id":"72a8c944-106e-4775-a2c7-6476bf4f48ba","type":"observation","location":"00:05:01.2-00:05:04.3","speaker":"Ryan Graves","text":"Ryan Graves observed no exhaust plume on the Unidentified Aerial Phenomena (UAP).","quote":"Mm-hmm. You know, I don't see an exhaust plume."},{"id":"eed64c5b-caaa-42ae-a947-4b6695ddcbdd","type":"observation","location":"00:05:04.3-00:05:27.9","speaker":null,"text":"In 2015, an Unidentified Aerial Phenomenon (UAP) was captured on a targeting camera off the coast of Jacksonville, Florida.","quote":"including this one, off the coast of Jacksonville, Florida in 2015, captured on a targeting camera by members of Graves' squadron."},{"id":"dc097e94-2485-474a-8e3a-d749af955fcc","type":"testimony","location":"00:05:04.3-00:05:27.9","speaker":"Ryan Graves","text":"Ryan Graves observed surprise and amazement in the voices of naval aviators who witnessed the Unidentified Aerial Phenomena (UAP).","quote":"You certainly can. They seem to have broke character a bit, and were just kind of amazed at what they were seeing."},{"id":"991fa2fc-0237-45dc-a08a-892d6f7b24af","type":"opinion","location":"00:05:35.8-00:05:42.5","speaker":"Ryan Graves","text":"Ryan Graves finds the observed Unidentified Aerial Phenomena (UAP) difficult to explain.","quote":"This is a difficult one to explain."},{"id":"1ad8ff02-0552-473b-bc30-2ba96891f013","type":"observation","location":"00:05:35.8-00:05:42.5","speaker":"Ryan Graves","text":"The observed Unidentified Aerial Phenomena (UAP) exhibit rotation, high altitude flight, and propulsion capabilities.","quote":"You have rotation, you have high altitudes, you have propulsion, right?"},{"id":"3c0edee7-8106-4436-ada8-1a1a92c68fcc","type":"opinion","location":"00:05:56.0-00:06:07.0","speaker":"Ryan Graves","text":"Ryan Graves considers a threat observation program the most probable explanation for the observed Unidentified Aerial Phenomena (UAP).","quote":"I'd say, you know, the highest probability is it's a threat observation program."},{"id":"02731288-5184-488a-8a29-ad9db6a5da9d","type":"opinion","location":"00:05:56.0-00:06:07.0","speaker":"Ryan Graves","text":"Ryan Graves considers Russian or Chinese technology a possible explanation for the observed Unidentified Aerial Phenomena (UAP).","quote":"I don't see why not."},{"id":"9f9f32eb-0c6c-45f4-9178-fb868887894b","type":"opinion","location":"00:05:56.0-00:06:07.0","speaker":"Ryan Graves","text":"Ryan Graves is worried about the Unidentified Aerial Phenomena (UAP) observed off the Atlantic coast.","quote":"I am worried, frankly."},{"id":"4c711736-a623-4532-be6d-ea568b4ede5e","type":"opinion","location":"00:05:56.0-00:06:07.0","speaker":"Ryan Graves","text":"Ryan Graves believes that if the observed Unidentified Aerial Phenomena (UAP) were tactical jets from another country, it would be a massive security issue.","quote":"You know, if these were tactical jets from another country that were hanging out up there, it would be a massive issue."},{"id":"69dec189-3599-46f9-89cd-37cb062a17f8","type":"opinion","location":"00:05:56.0-00:06:07.0","speaker":"Ryan Graves","text":"Ryan Graves believes that authorities are unwilling to acknowledge the problem of Unidentified Aerial Phenomena (UAP) because they appear different from conventional aircraft.","quote":"But because it looks slightly different, we're not willing to actually look at the problem in the face."},{"id":"ac53321c-39ce-460a-a0ae-5ad4fc3f20c5","type":"opinion","location":"00:05:56.0-00:06:07.0","speaker":"Ryan Graves","text":"Ryan Graves believes authorities are ignoring the fact that Unidentified Aerial Phenomena (UAP) are observing U.S. airspace daily.","quote":"We're happy to just ignore the fact that these are out there watching us every day."},{"id":"837792bb-7408-4426-b6f2-ca71c045bde1","type":"administrative","location":"00:06:23.4-00:06:40.8","speaker":null,"text":"The U.S. government has publicly ignored Unidentified Aerial Phenomena (UAP) since closing its Project Blue Book investigation in 1969.","quote":"The government has ignored it, at least publicly, since closing its Project Blue Book investigation in 1969."},{"id":"8431cda5-44af-4683-a16b-b850fb4857f1","type":"observation","location":"00:06:23.4-00:06:40.8","speaker":null,"text":"In 2004, an incident involving Unidentified Aerial Phenomena (UAP) occurred off Southern California.","quote":"But that began to change after an incident off Southern California in 2004, which was documented by radar, by camera, and four naval aviators."},{"id":"549793ba-428f-442e-ab53-959c08fea0e7","type":"observation","location":"00:06:23.4-00:06:40.8","speaker":null,"text":"The 2004 incident off Southern California was documented by radar, camera, and four naval aviators.","quote":"But that began to change after an incident off Southern California in 2004, which was documented by radar, by camera, and four naval aviators."},{"id":"be881daf-520c-4a81-ad54-6a5910dda72a","type":"administrative","location":"00:06:23.4-00:06:40.8","speaker":null,"text":"David Fravor is a graduate of the Top Gun Naval Flight School.","quote":"We spoke to two of them, David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz, and flying at his wing, Lieutenant Alex Dietrich, who has never spoken publicly about the encounter."},{"id":"9f93f1d2-c513-435f-9c78-cd0494bc182e","type":"administrative","location":"00:06:23.4-00:06:40.8","speaker":null,"text":"David Fravor was commander of the F-18 squadron on the USS Nimitz.","quote":"We spoke to two of them, David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz, and flying at his wing, Lieutenant Alex Dietrich, who has never spoken publicly about the encounter."},{"id":"e4db337b-c3f1-4c1f-833b-d5eac55a2a3f","type":"administrative","location":"00:06:23.4-00:06:40.8","speaker":null,"text":"Alex Dietrich was a lieutenant flying as wingman to David Fravor.","quote":"We spoke to two of them, David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz, and flying at his wing, Lieutenant Alex Dietrich, who has never spoken publicly about the encounter."},{"id":"e3b63b8e-e16f-4a3b-9eae-4294f71a0692","type":"administrative","location":"00:06:23.4-00:06:40.8","speaker":null,"text":"Prior to this interview, Alex Dietrich had never spoken publicly about the 2004 encounter.","quote":"We spoke to two of them, David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz, and flying at his wing, Lieutenant Alex Dietrich, who has never spoken publicly about the encounter."},{"id":"5f598b31-402b-4ddf-b8fb-dedb15f06945","type":"testimony","location":"00:06:57.3-00:07:14.4","speaker":"Alex Dietrich","text":"Alex Dietrich did not previously want to appear on national television.","quote":"I never wanted to be on national TV, no offense."},{"id":"6f2a4b36-0473-4291-8b07-c19fdea1d6d9","type":"testimony","location":"00:06:57.3-00:07:14.4","speaker":"Alex Dietrich","text":"Alex Dietrich feels a responsibility to share information about the encounter because she was in a government aircraft during the incident.","quote":"Because I was in a government aircraft, because I was on the clock, and so I feel a responsibility to share what I can, and it is unclassified."},{"id":"84340701-9bfe-4844-9ade-215ac3f45e6c","type":"observation","location":"00:07:14.4-00:07:47.8","speaker":null,"text":"In November 2004, the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego.","quote":"It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego."},{"id":"0948e9f9-eda0-48c7-a60c-23ad35074307","type":"observation","location":"00:07:14.4-00:07:47.8","speaker":null,"text":"For a week in November 2004, the advanced radar on the USS Princeton detected multiple anomalous aerial vehicles over the horizon.","quote":"For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 80,000 feet in less than a second."},{"id":"d8403749-6fd8-42f6-b840-3d077e84ecb9","type":"measurement","location":"00:07:14.4-00:07:47.8","speaker":null,"text":"The anomalous aerial vehicles detected by the USS Princeton descended approximately 24,000 metres in less than a second.","quote":"For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 80,000 feet in less than a second."},{"id":"93d96992-c52d-436f-a735-8074562d109f","type":"observation","location":"00:07:14.4-00:07:47.8","speaker":null,"text":"On November 14, 2004, David Fravor and Alex Dietrich, each with a weapons system officer in the backseat, were diverted to investigate the anomalous aerial vehicles.","quote":"On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate."},{"id":"805992e5-7f08-4547-a13b-fd7ebb6042d7","type":"observation","location":"00:07:14.4-00:07:47.8","speaker":null,"text":"Fravor and Dietrich found an area of roiling white water the size of a 737 in an otherwise calm blue sea.","quote":"They found an area of roiling white water the size of a 737 in an otherwise calm blue sea."},{"id":"bf4d9256-d2e8-4109-907b-f24eddc56754","type":"observation","location":"00:07:55.9-00:08:18.5","speaker":"David Fravor","text":"David Fravor observed a small white tic-tac-shaped object above the whitewater area during the 2004 USS Nimitz encounter.","quote":"So as we're looking at this, her backseater says, hey, Skipper, do you? And about that got out, I said, dude, do you see that thing down there? And we saw this little white tic-tac-looking object. And it's just kind of moving above the whitewater area."},{"id":"60bbdf3e-e81f-4cfb-8660-55956ed02c25","type":"observation","location":"00:07:55.9-00:08:18.5","speaker":"David Fravor","text":"David Fravor described the tic-tac-shaped object as pointing north-south during the 2004 USS Nimitz encounter.","quote":"The tic-tac's still pointing north-south."},{"id":"83f366a2-a9ec-4558-96f6-5648fbe437f0","type":"observation","location":"00:07:55.9-00:08:18.5","speaker":"David Fravor","text":"David Fravor observed that the tic-tac-shaped object abruptly turned and began mirroring his movements during the 2004 USS Nimitz encounter.","quote":"It goes and just turns abruptly and starts mirroring me. So as I'm coming down, it starts coming up."},{"id":"c4bb1cf8-7ad4-40a7-8882-4d90f16552d9","type":"observation","location":"00:07:55.9-00:08:18.5","speaker":"David Fravor","text":"David Fravor concluded that the tic-tac-shaped object was aware of his presence during the 2004 USS Nimitz encounter.","quote":"Yeah, it was aware we were there."},{"id":"0d87790c-266c-41df-86ee-d3a41a881123","type":"observation","location":"00:08:30.5-00:09:08.9","speaker":"David Fravor","text":"David Fravor described the tic-tac-shaped object as being about the size of his F-18 during the 2004 USS Nimitz encounter.","quote":"He said it was about the size of his F-18, with no markings, no wings, no exhaust plumes."},{"id":"305d7113-40a5-4822-8765-3d3e07eeb45f","type":"observation","location":"00:08:30.5-00:09:08.9","speaker":"David Fravor","text":"David Fravor observed that the tic-tac-shaped object had no markings, wings, or exhaust plumes during the 2004 USS Nimitz encounter.","quote":"He said it was about the size of his F-18, with no markings, no wings, no exhaust plumes."},{"id":"c796bc7c-3f8e-4e62-a9fe-d57351766b4a","type":"observation","location":"00:08:30.5-00:09:08.9","speaker":"David Fravor","text":"David Fravor attempted to get closer to the tic-tac-shaped object during the 2004 USS Nimitz encounter.","quote":"I want to see how close I can get."},{"id":"5950b75f-b3ae-497e-a5df-37d042d947e8","type":"observation","location":"00:08:30.5-00:09:08.9","speaker":"David Fravor","text":"David Fravor observed that the tic-tac-shaped object was still climbing as he approached during the 2004 USS Nimitz encounter.","quote":"So I go like this, and it's climbing still."},{"id":"147f4c95-7901-4c2e-a2e7-fec29
