<script>
var MODELS = [{"id":"anthropic_claude-haiku-4.5","name":"anthropic / claude-haiku-4.5","errata":null,"claims":[{"id":"64a08d45-fb35-4676-ab48-2a419a67a5b8","type":"administrative","location":"00:00:14.9","speaker":null,"text":"The United States Department of Defense has officially acknowledged the existence of Unidentified Aerial Phenomena (UAP).","quote":"the pentagon now admits there's something out there"},{"id":"c499f7e2-ede0-4872-84a1-979b29ad30e6","type":"administrative","location":"00:00:19.0-00:00:39.0","speaker":null,"text":"The US Senate Select Committee on Intelligence has ordered the Office of the Director of National Intelligence and the Secretary of Defense to deliver a report on unidentified aerial phenomena sightings.","quote":"the u.s senate wants to know what it is the intelligence committee has ordered the director of national intelligence and the secretary of defense to deliver a report on the mysterious sightings by next month"},{"id":"62bf0844-7964-4e95-8e51-f8b91b8ffa84","type":"administrative","location":"00:00:56.3","speaker":"Luis Elizondo","text":"The United States government has officially stated for the record that Unidentified Flying Objects (UFO) are real.","quote":"The government has already stated for the record that they're real."},{"id":"8797bad3-ab58-4823-8651-fe867d11345b","type":"administrative","location":"00:01:02.4-00:01:15.6","speaker":null,"text":"Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo Bay before joining the Advanced Aerospace Threat Identification Program (AATIP) in 2008.","quote":"Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo. He hadn't given UFOs a second thought until 2008. That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP."},{"id":"4cb96ab9-e392-4777-bc05-afe694212400","type":"administrative","location":"00:01:24.1-00:01:34.3","speaker":"Luis Elizondo","text":"The Advanced Aerospace Threat Identification Program (AATIP) was tasked with collecting and analysing information involving Anomalous Aerial Vehicles (AAV), also called Unidentified Aerial Phenomena (UAP).","quote":"The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs. We call them UAPs."},{"id":"c25f5d75-7cf6-453a-9ed3-1060780020b8","type":"administrative","location":"00:01:50.3-00:02:01.6","speaker":null,"text":"The Advanced Aerospace Threat Identification Program (AATIP) was part of a USD 22 million programme sponsored by then Senate Majority Leader Harry Reid to investigate UFOs.","quote":"AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs."},{"id":"6b5a4783-e4bf-49a6-856a-33c82889bb68","type":"administrative","location":"00:02:01.6-00:02:10.8","speaker":null,"text":"When Luis Elizondo took over the Advanced Aerospace Threat Identification Program (AATIP) in 2010, he focused on the national security implications of Unidentified Aerial Phenomena (UAP) documented by United States service members.","quote":"When Elizondo took over in 2010, he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members."},{"id":"4cc32d38-22f8-4b32-82fe-5b11626ccf7e","type":"observation","location":"00:02:12.6","speaker":"Luis Elizondo","text":"A technology observed in Unidentified Aerial Phenomena can perform 600 to 700 G-forces.","quote":"Imagine a technology that can do 600 to 700 G-forces"},{"id":"f26c83f5-9f1b-43be-b606-e93c2fa39713","type":"observation","location":"00:02:12.6","speaker":"Luis Elizondo","text":"A technology observed in Unidentified Aerial Phenomena can fly at approximately 21,000 kilometres per hour.","quote":"that can fly at 13,000 miles an hour"},{"id":"ca4cbcac-af2d-40dd-a332-5d2462fcf14f","type":"observation","location":"00:02:12.6","speaker":"Luis Elizondo","text":"A technology observed in Unidentified Aerial Phenomena can evade radar.","quote":"that can evade radar"},{"id":"f36776c2-1d29-427a-849b-9e4805538d01","type":"observation","location":"00:02:12.6","speaker":"Luis Elizondo","text":"A technology observed in Unidentified Aerial Phenomena can fly through air and water and possibly space.","quote":"that can fly through air and water and possibly space"},{"id":"820c8e0c-75f2-4de3-b745-de853437a00a","type":"observation","location":"00:02:12.6","speaker":"Luis Elizondo","text":"A technology observed in Unidentified Aerial Phenomena exhibits no obvious signs of propulsion.","quote":"has no obvious signs of propulsion"},{"id":"086cd873-f742-4783-bac2-d36941af7678","type":"observation","location":"00:02:12.6","speaker":"Luis Elizondo","text":"A technology observed in Unidentified Aerial Phenomena has no wings.","quote":"no wings"},{"id":"3e2a3106-dcfa-4e47-a439-c298196f3445","type":"observation","location":"00:02:12.6","speaker":"Luis Elizondo","text":"A technology observed in Unidentified Aerial Phenomena has no control surfaces.","quote":"no control surfaces"},{"id":"c1a154a0-f399-438d-aa21-a4905a2c336f","type":"observation","location":"00:02:12.6","speaker":"Luis Elizondo","text":"A technology observed in Unidentified Aerial Phenomena can defy the natural effects of Earth's gravity.","quote":"can defy the natural effects of Earth's gravity"},{"id":"9ef2f140-5a9a-4602-b072-89310bbe646c","type":"administrative","location":"00:02:37.0-00:02:47.7","speaker":null,"text":"The Advanced Aerospace Threat Identification Program (AATIP) was a loose-knit mix of scientists, electro-optical engineers, avionics specialists, and intelligence experts, often working part-time.","quote":"AATIP was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time."},{"id":"88548d9c-9ce5-41ef-9e01-2891c7a81f7f","type":"observation","location":"00:02:57.7-00:03:02.1","speaker":null,"text":"A Navy aircrew was unable to lock onto a fast-moving object off the Atlantic coast in 2015.","quote":"A Navy aircrew struggles to lock onto a fast-moving object off the U.S. Atlantic coast in 2015."},{"id":"1be9a762-fa39-4558-8ed1-c524d81715a0","type":"administrative","location":"00:03:07.3-00:03:20.4","speaker":null,"text":"The Pentagon admits it cannot identify certain objects recorded in Navy videos.","quote":"the Pentagon admits it doesn't know what in the world this is, or this, or this."},{"id":"b9459169-2d9e-4ec2-89d9-c04017792632","type":"opinion","location":"00:03:30.4-00:03:38.6","speaker":"Luis Elizondo","text":"In some cases, there are simple explanations for what people are witnessing as Unidentified Aerial Phenomena, but in other cases there are not.","quote":"In some cases, there are simple explanations for what people are witnessing, but there are some that that are not."},{"id":"3e7cde89-7855-492b-a98f-39e11ee89e57","type":"opinion","location":"00:03:44.3-00:03:48.2","speaker":"Luis Elizondo","text":"Potential explanations being investigated for Unidentified Aerial Phenomena include new types of cruise missile technology developed by China.","quote":"Is it some sort of new type of cruise missile technology that China has developed?"},{"id":"0e33861b-7120-40cc-80c6-f953eb5e9d90","type":"opinion","location":"00:03:48.2-00:03:52.6","speaker":"Luis Elizondo","text":"Potential explanations being investigated for Unidentified Aerial Phenomena include high-altitude balloons conducting reconnaissance.","quote":"Is it some sort of high-altitude balloon that's conducting reconnaissance?"},{"id":"d7243d94-dd41-4ef7-a4ed-d173ccb55214","type":"opinion","location":"00:04:06.2-00:04:12.9","speaker":null,"text":"Former Navy pilot Lieutenant Ryan Graves considers Unidentified Aerial Phenomena a security risk.","quote":"Former Navy pilot Lieutenant Ryan Graves calls whatever is out there a security risk."},{"id":"2e784cd0-e92e-43ff-9e0a-77c33202a565","type":"testimony","location":"00:04:12.9-00:04:29.7","speaker":"Ryan Graves","text":"Ryan Graves' F-18 squadron began observing Unidentified Aerial Phenomena hovering over restricted airspace southeast of Virginia Beach in 2014.","quote":"He told us his F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014"},{"id":"2af08d8c-298a-46d2-a5de-fe1f1476b6c7","type":"observation","location":"00:04:20.5-00:04:37.1","speaker":null,"text":"When the F-18 squadron updated their jet's radar, they were able to detect Unidentified Aerial Phenomena using infrared targeting cameras in addition to radar.","quote":"when they updated their jet's radar, making it possible to zero in with infrared targeting cameras. So you're seeing it both with the radar and with the infrared, and that tells you that there is something out there."},{"id":"fe736d5e-cb86-4bd8-9d05-1df97a7a60fa","type":"opinion","location":"00:04:37.1","speaker":"Ryan Graves","text":"The dual radar-and-infrared detection of Unidentified Aerial Phenomena is difficult to spoof.","quote":"Pretty hard to spoof that."},{"id":"0ce4e3c5-3494-4c2a-96cc-e2f071413fe9","type":"administrative","location":"00:04:38.6-00:04:48.2","speaker":null,"text":"Photographs of Unidentified Aerial Phenomena objects were captured in 2019 in the same area off Virginia Beach where the F-18 squadron had been observing them since 2014.","quote":"These photographs were taken in 2019 in the same area. The Pentagon confirms these are images of objects it can't identify."},{"id":"e6e38fa3-6588-49d0-804c-0b3b271e9381","type":"testimony","location":"00:04:48.2-00:04:56.6","speaker":"Ryan Graves","text":"Pilots training off the Atlantic coast observing Unidentified Aerial Phenomena have been seeing such objects every day for at least a couple of years.","quote":"Lieutenant Graves told us pilots training off the Atlantic coast see things like that all the time. Every day. Every day for at least a couple of years."},{"id":"cc1387ce-aecb-44f9-85a8-73e3e410f727","type":"observation","location":"00:05:02.5","speaker":"Ryan Graves","text":"Ryan Graves observed no exhaust plume on the Unidentified Aerial Phenomena he encountered.","quote":"I don't see an exhaust plume."},{"id":"9780e76d-81f6-4c2f-ab0b-43495500bed1","type":"observation","location":"00:05:04.3-00:05:12.8","speaker":null,"text":"A Unidentified Aerial Phenomena object was captured on a targeting camera off the coast of Jacksonville, Florida in 2015 by members of Ryan Graves' squadron.","quote":"including this one, off the coast of Jacksonville, Florida in 2015, captured on a targeting camera by members of Graves' squadron."},{"id":"7332a96b-cb89-4379-af5e-656c721b2db4","type":"observation","location":"00:05:12.8-00:05:15.1","speaker":null,"text":"The Unidentified Aerial Phenomena object observed off Jacksonville, Florida in 2015 was rotating.","quote":"Look at that thing! It's rotating."},{"id":"2b4b8e1e-03e6-4813-a6f7-7fb12ebcd48d","type":"observation","location":"00:05:17.1-00:05:23.8","speaker":null,"text":"The Unidentified Aerial Phenomena object observed off Jacksonville, Florida in 2015 was moving against the wind, with the wind speed at approximately 220 kilometres per hour from the far west.","quote":"They're all going against the wind. The wind's 120 knots far west."},{"id":"bc252179-4a96-4915-ac93-e0d027ea001c","type":"observation","location":"00:05:35.8-00:05:42.8","speaker":"Ryan Graves","text":"Ryan Graves observed that the naval aircrew captured footage showing a rotating object at high altitude with what appeared to be propulsion, which he found difficult to explain.","quote":"You have rotation, you have high altitudes, you have propulsion, right? I don't know. I don't know what it is, frankly."},{"id":"39fd41fe-1bdc-4cf3-81eb-665801e2f3d2","type":"opinion","location":"00:05:44.9-00:05:56.0","speaker":"Ryan Graves","text":"Naval pilots speculate that Unidentified Aerial Phenomena are one of three things: secret United States technology, an adversary spy vehicle, or something otherworldly.","quote":"He told us pilots speculate they are one of three things, secret U.S. technology, an adversary spy vehicle, or something otherworldly."},{"id":"9ade4dc5-2265-4355-92ae-c968e73de9ed","type":"opinion","location":"00:05:56.0","speaker":"Ryan Graves","text":"Ryan Graves considers the highest probability explanation for the observed Unidentified Aerial Phenomena to be a threat observation programme.","quote":"I'd say, you know, the highest probability is it's a threat observation program."},{"id":"54e51fec-f4ab-4d4a-9b32-aca848062f40","type":"opinion","location":"00:06:00.5-00:06:04.1","speaker":"Ryan Graves","text":"Ryan Graves considers Russian or Chinese technology a possible explanation for the observed Unidentified Aerial Phenomena.","quote":"Bill Whitaker: Could it be Russian or Chinese technology? Ryan Graves: I don't see why not."},{"id":"4b3ce0e2-e140-4f45-ae2b-63df6423d268","type":"opinion","location":"00:06:07.0","speaker":"Ryan Graves","text":"Ryan Graves is worried about the Unidentified Aerial Phenomena observed by his squadron.","quote":"I am worried, frankly."},{"id":"7604330e-21d8-4659-844f-cef80105479d","type":"opinion","location":"00:06:08.8-00:06:18.5","speaker":"Ryan Graves","text":"Ryan Graves believes that if tactical jets from another country were hovering in United States airspace, it would be treated as a massive issue, but the Unidentified Aerial Phenomena are being ignored because they look slightly different.","quote":"You know, if these were tactical jets from another country that were hanging out up there, it would be a massive issue. But because it looks slightly different, we're not willing to actually look at the problem in the face. We're happy to just ignore the fact that these are out there watching us every day."},{"id":"66852014-502c-47e3-addf-1519c7e3a165","type":"administrative","location":"00:06:23.4-00:06:40.8","speaker":null,"text":"The United States government publicly ignored Unidentified Aerial Phenomena from the closing of Project Blue Book in 1969 until at least the 2004 USS Nimitz Carrier Strike Group encounter.","quote":"The government has ignored it, at least publicly, since closing its Project Blue Book investigation in 1969. But that began to change after an incident off Southern California in 2004"},{"id":"3d4c64c9-1549-470f-a10f-6a7da0f745df","type":"administrative","location":"00:06:36.0-00:06:40.8","speaker":null,"text":"The 2004 USS Nimitz Carrier Strike Group encounter was documented by radar, by camera, and by four naval aviators.","quote":"which was documented by radar, by camera, and four naval aviators."},{"id":"51f83369-08fa-4a67-9b70-4b9633db248c","type":"administrative","location":"00:06:40.8","speaker":null,"text":"David Fravor is a graduate of the Top Gun Naval Flight School and was commander of the F-18 squadron on the USS Nimitz.","quote":"David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz"},{"id":"73bf8a77-6f53-4808-8d60-5fab99c7bbfa","type":"administrative","location":"00:06:40.8","speaker":null,"text":"Alex Dietrich was flying at David Fravor's wing during the 2004 USS Nimitz Carrier Strike Group encounter and had not previously spoken publicly about it.","quote":"and flying at his wing, Lieutenant Alex Dietrich, who has never spoken publicly about the encounter."},{"id":"1e7770a9-fd87-4fba-951e-925a72290404","type":"opinion","location":"00:07:02.7-00:07:14.4","speaker":"Alex Dietrich","text":"Alex Dietrich states she was in a government aircraft and on the clock during the 2004 USS Nimitz encounter, and feels a responsibility to share what happened, which is unclassified.","quote":"Because I was in a government aircraft, because I was on the clock, and so I feel a responsibility to share what I can, and it is unclassified."},{"id":"8b8c561e-45d8-4a94-a12b-2c0530a7cec1","type":"administrative","location":"00:07:14.4-00:07:23.1","speaker":null,"text":"The 2004 USS Nimitz Carrier Strike Group was training approximately 160 kilometres southwest of San Diego in November 2004.","quote":"It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego."},{"id":"ed78c90a-23a2-4f87-bc51-86b91fbec8ad","type":"observation","location":"00:07:23.1-00:07:39.3","speaker":null,"text":"For a week prior to the 2004 USS Nimitz encounter, the advanced radar on the USS Princeton had detected multiple Anomalous Aerial Vehicles (AAV) over the horizon, descending approximately 24,000 metres in less than a second.","quote":"For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 80,000 feet in less than a second."},{"id":"0b6d8e9c-8b65-420e-a06a-3637863053c7","type":"observation","location":"00:07:39.3-00:07:47.8","speaker":null,"text":"On 2004-11-14, David Fravor and Alex Dietrich, each with a weapons system officer in the backseat, were diverted to investigate the Anomalous Aerial Vehicle detected by the USS Princeton.","quote":"On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate."},{"id":"3f469f0e-196d-4ebc-a478-2d64810fd2b8","type":"observation","location":"00:07:47.8","speaker":null,"text":"During the 2004 USS Nimitz Carrier Strike Group encounter, David Fravor and Alex Dietrich found an area of roiling white water approximately the size of a Boeing 737 in an otherwise calm blue sea.","quote":"They found an area of roiling white water the size of a 737 in an otherwise calm blue sea."},{"id":"2ec87f8e-c2a5-4c99-aac9-7c53a8f8687d","type":"observation","location":"00:08:06.3-00:08:09.7","speaker":"David Fravor","text":"During the 2004 USS Nimitz encounter, David Fravor observed a small white tic-tac-like object moving above a white-water area.","quote":"And we saw this little white tic-tac-looking object. And it's just kind of moving above the whitewater area."},{"id":"bb059895-e1c2-478c-88c3-aa5894ae07b2","type":"observation","location":"00:08:18.5-00:08:24.5","speaker":"David Fravor","text":"As David Fravor spiralled down during the 2004 encounter, the tic-tac object pointed north-south, then turned abruptly and began mirroring his moves by ascending as he descended.","quote":"The tic-tac's still pointing north-south. It goes and just turns abruptly and starts mirroring me. So as I'm coming down, it starts coming up."},{"id":"7dd8ca8f-9b2c-426e-8615-47d2754803aa","type":"observation","location":"00:08:28.9","speaker":"David Fravor","text":"David Fravor observed that the tic-tac object was aware of his presence and mimicked his moves during the 2004 encounter.","quote":"Yeah, it was aware we were there."},{"id":"d4233763-fe0f-4178-ac08-47767813d238","type":"observation","location":"00:08:30.5","speaker":"David Fravor","text":"The object observed during the 2004 USS Nimitz encounter was about the size of David Fravor's F-18, with no markings, no wings, and no exhaust plumes.","quote":"He said it was about the size of his F-18, with no markings, no wings, no exhaust plumes."},{"id":"305cf37e-2cdd-42b2-9363-587325dc014f","type":"observation","location":"00:08:40.9","speaker":"David Fravor","text":"David Fravor attempted to get closer to the tic-tac object during the 2004 encounter and observed that when it got right in front of him, it disappeared.","quote":"When it gets right in front of me, it just disappears."},{"id":"c0879813-9c93-4ed3-b8d0-946b7f96ab0c","type":"observation","location":"00:08:47.8","speaker":"David Fravor","text":"David Fravor observed that the tic-tac object had sped off during the 2004 encounter.","quote":"It had sped off."},{"id":"5a0e31f7-977d-4d44-8c10-82f7b3444797","type":"opinion","location":"00:08:52.0-00:08:58.3","speaker":"Alex Dietrich","text":"Alex Dietrich tried to make sense of the object by categorising it as possibly a helicopter or drone before it disappeared during the 2004 encounter.","quote":"I'm going to categorize this as maybe a helicopter or maybe a drone. And when it disappeared, I mean, it was just..."},{"id":"5ab6bfc8-6529-49ea-bc78-3237a9c035dd","type":"observation","location":"00:09:00.9-00:09:03.3","speaker":"Alex Dietrich","text":"The weapons system officers (backseat crew) in David Fravor's and Alex Dietrich's F-18 aircraft also observed the tic-tac object during the 2004 encounter.","quote":"Did your back seaters see this too? Yeah."},{"id":"17d5b209-5ffb-47e3-8907-3f57e63236cd","type":"observation","location":"00:09:03.5-00:09:08.9","speaker":"David Fravor","text":"There were four people in two F-18 aircraft watching the tic-tac object for approximately five minutes during the 2004 USS Nimitz encounter.","quote":"There was four of us in the airplanes literally watching this thing for roughly about five minutes."},{"id":"5bbe46fd-0f31-40cc-8f3c-68c86999954e","type":"observation","location":"00:09:08.9-00:09:14.4","speaker":null,"text":"Seconds after the tic-tac object disappeared during the 2004 encounter, the USS Princeton reacquired the target approximately 96 kilometres away.","quote":"Seconds later, the Princeton reacquired the target, 60 miles away."},{"id":"68eaa902-9b04-40bc-84ab-688444236f75","type":"observation","location":"00:09:14.4","speaker":null,"text":"Another crew managed to briefly lock onto the tic-tac object with a targeting camera before it zipped off again during the 2004 encounter.","quote":"Another crew managed to briefly lock onto it with a targeting camera before it zipped off again."},{"id":"b3bcebfd-d6e2-4796-8b90-f5076892efa2","type":"opinion","location":"00:09:20.8-00:09:31.1","speaker":"Alex Dietrich","text":"Alex Dietrich states that if she had witnessed the 2004 encounter alone, she would not have reported it because it sounds so crazy.","quote":"You know, I think that over beers, we've sort of said, hey, man, if I saw this solo, I don't know that I would have come back and said anything because it sounds so crazy when I say it."},{"id":"fac05f53-1bee-4fc8-b6ef-b024fc4f63a3","type":"opinion","location":"00:09:34.0-00:09:37.4","speaker":"David Fravor","text":"David Fravor has been told by some people that describing the 2004 encounter can make him sound crazy.","quote":"I've had some people tell me, you know, when you say that, you can sound crazy."},{"id":"97506653-3117-4c52-9450-c8b84876f4da","type":"opinion","location":"00:09:37.9-00:09:56.5","speaker":"David Fravor","text":"David Fravor states he is not a UFO person but confirms there is something that was observed during the 2004 encounter that was better than his aeroplane.","quote":"I'll be honest. I'm not a UFO guy. But from what I hear you guys saying, there's something. Yes. There's definitely something that, I don't know who's building it, who's got the technology, who's got the brains, but there's something out there that was better than our airplane."},{"id":"03da377f-229c-4548-af3a-ac8c3dcc7910","type":"administrative","location":"00:09:56.5-00:09:58.7","speaker":null,"text":"The air crew of the 2004 USS Nimitz encounter filed reports about the incident.","quote":"The air crew filed reports."},{"id":"ea656716-0923-45ba-b140-46300f6bbb47","type":"administrative","location":"00:09:58.7-00:10:04.2","speaker":null,"text":"The 2004 USS Nimitz encounter disappeared from public view after the air crew filed reports, and nothing was said or done officially for five years until Luis Elizondo investigated it.","quote":"Then, like the mysterious flying object, the Nimitz encounter disappeared. Nothing was said or done officially for five years until Lou Elizondo came across the story and investigated."},{"id":"c372fedd-ccb6-4ce9-89fa-7d9b257c10ac","type":"opinion","location":"00:10:13.2-00:10:25.3","speaker":"Luis Elizondo","text":"Luis Elizondo considers it compelling that highly trained military pilots are observing Unidentified Aerial Phenomena that they cannot explain, and this information is corroborated by electro-optical data such as gun camera footage and by radar data.","quote":"We spend millions of dollars in training these pilots, and they are seeing something that they can't explain. Furthermore, that information's being backed up on electro-optical data, like gun camera footage, and by radar data. Now, to me, that's compelling."},{"id":"075d94f0-bc72-4c86-9c45-3f83da14f093","type":"administrative","location":"00:10:27.7-00:10:31.7","speaker":null,"text":"Inside the Pentagon, the findings of the Advanced Aerospace Threat Identification Program (AATIP) regarding Unidentified Aerial Phenomena were met with skepticism.","quote":"Inside the Pentagon, his findings were met with skepticism."},{"id":"b21cacc7-63a1-4f75-a28c-07b487f60578","type":"administrative","location":"00:10:31.7-00:10:39.5","speaker":null,"text":"The funding for the Advanced Aerospace Threat Identification Program (AATIP) was eliminated in 2012.","quote":"AATIP's funding was eliminated in 2012"},{"id":"c42dca9a-f1ed-4376-8b10-9a6b2e229e81","type":"administrative","location":"00:10:31.7-00:10:39.5","speaker":"Luis Elizondo","text":"Luis Elizondo and a handful of others kept the Advanced Aerospace Threat Identification Program (AATIP) mission alive after its funding was eliminated in 2012.","quote":"but Elizondo says he and a handful of others kept the mission alive."},{"id":"323916e4-5eb2-4ee2-b813-5144112ad916","type":"administrative","location":"00:10:39.5-00:10:48.8","speaker":null,"text":"Luis Elizondo quit the Pentagon in 2017 but not before getting three declassified Unidentified Aerial Phenomena videos released.","quote":"until finally, frustrated, he quit the Pentagon in 2017, but not before getting these three videos declassified."},{"id":"f9427230-c35f-4a30-8bd5-cce1b816410b","type":"administrative","location":"00:10:57.5-00:11:04.3","speaker":null,"text":"Christopher Mellon served as Deputy Assistant Secretary of Defence for Intelligence for Presidents Clinton and George W. Bush.","quote":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush"},{"id":"0d9a04c3-41cc-4a34-887e-cf18f02b9a1e","type":"administrative","location":"00:11:04.3","speaker":null,"text":"Christopher Mellon had access to top-secret government programmes while serving as Deputy Assistant Secretary of Defence for Intelligence.","quote":"and had access to top-secret government programs."},{"id":"aab79c53-a5a2-426c-8f9c-9017f62ddbe8","type":"opinion","location":"00:11:08.4-00:11:18.7","speaker":"Christopher Mellon","text":"Christopher Mellon states with a very high degree of confidence that Unidentified Aerial Phenomena are not United States technology, based on his knowledge of positions he held in the Department of Defence and his understanding of the process for developing advanced US technology.","quote":"Christopher Mellon: So it's not us, that's one thing we know. Bill Whitaker: We know that? Christopher Mellon: I could say that with a very high degree of confidence, in part because of the positions I held in the department, and I know the process."},{"id":"89661073-093b-4e95-adee-6cb7d5457da5","type":"opinion","location":"00:11:18.7-00:11:26.2","speaker":null,"text":"Christopher Mellon grew concerned that nothing was being done about Unidentified Aerial Phenomena.","quote":"Mellon says he grew concerned nothing was being done about UAPs"},{"id":"ed971717-f8c0-45e8-9299-878da958a9b3","type":"opinion","location":"00:11:37.0-00:11:46.1","speaker":"Christopher Mellon","text":"Christopher Mellon considers it bizarre and unfortunate that someone like himself has to leak classified information to get a national security issue like Unidentified Aerial Phenomena on the agenda.","quote":"It's bizarre and unfortunate that someone like myself has to do something like that to get a national security issue like this on the agenda."},{"id":"ef4ab544-27df-4beb-9825-c357b6ad7b46","type":"opinion","location":"00:11:57.6","speaker":"Christopher Mellon","text":"Christopher Mellon and Luis Elizondo understood they had to go to the public to get the public interested, then to get Congress interested, and then to circle back to the Department of Defence to get them to start taking a look at Unidentified Aerial Phenomena.","quote":"We knew and understood that you had to go to the public, get the public interested to get Congress interested, to then circle back to the Defense Department and get them to start taking a look at it."},{"id":"bc8c257c-ceaf-4ddf-9e64-b968fed8603b","type":"administrative","location":"00:12:07.2-00:12:15.6","speaker":null,"text":"In August 2020, the Pentagon resurrected the Advanced Aerospace Threat Identification Program (AATIP) under a new name, the Unidentified Aerial Phenomena (UAP) Task Force.","quote":"This past August, the Pentagon resurrected AATIP. It's now called the UAP Task Force."},{"id":"15c82a38-6dba-411c-8914-88fe4ed1b442","type":"administrative","location":"00:12:15.6-00:12:20.1","speaker":null,"text":"Military service members are now encouraged to report Unidentified Aerial Phenomena encounters.","quote":"Service members now are encouraged to report strange encounters."},{"id":"25ecd1fc-54d6-46cd-8aea-ee89dc66a72d","type":"administrative","location":"00:12:20.1","speaker":null,"text":"The US Senate wants answers regarding Unidentified Aerial Phenomena.","quote":"And the Senate wants answers."},{"id":"cfacd3b6-4fcc-416d-9b26-a3a46e403d00","type":"opinion","location":"00:12:22.6","speaker":"Marco Rubio","text":"Senator Marco Rubio states that anything that enters United States airspace that is not supposed to be there is a threat.","quote":"Anything that enters an airspace that's not supposed to be there is a threat."},{"id":"fad8ba79-4854-4bdf-a263-7ad008926f7f","type":"administrative","location":"00:12:26.5-00:12:34.0","speaker":null,"text":"After receiving classified briefings on Unidentified Aerial Phenomena, Senator Marco Rubio called for a detailed analysis.","quote":"After receiving classified briefings on UAPs, Senator Marco Rubio called for a detailed analysis."},{"id":"341ec928-6866-46b2-865e-7f9912864444","type":"administrative","location":"00:12:34.0-00:12:46.3","speaker":null,"text":"In December 2020, while he was still head of the Intelligence Committee, Senator Marco Rubio asked the Office of the Director of National Intelligence and the Pentagon to present Congress an unclassified report on Unidentified Aerial Phenomena by the following month.","quote":"This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month."},{"id":"7cae4e73-a4a5-477c-bc30-0a4ee34ec137","type":"opinion","location":"00:12:59.0-00:13:06.9","speaker":"Marco Rubio","text":"Senator Marco Rubio states there is a stigma on Capitol Hill regarding Unidentified Aerial Phenomena, with some colleagues very interested in the topic and others giggling when it is brought up.","quote":"You know, there's a stigma on Capitol Hill. I mean, some of my colleagues are very interested in this topic and some kind of, you know, giggle when you bring it up."},{"id":"39c571bc-5025-4b20-ac4c-73b62712a144","type":"opinion","location":"00:13:00.8-00:13:06.9","speaker":"Marco Rubio","text":"Senator Marco Rubio states that the stigma regarding Unidentified Aerial Phenomena cannot be allowed to keep people from finding an answer to the fundamental question of what they are.","quote":"But I don't think we can allow the stigma to keep us from having an answer to a very fundamental question."},{"id":"abc9a28f-1ad8-4209-852d-f8a0c2f74262","type":"opinion","location":"00:13:14.1-00:13:17.3","speaker":"Marco Rubio","text":"Senator Marco Rubio wants the United States government to take Unidentified Aerial Phenomena seriously and to have a process to take it seriously.","quote":"I want us to take it seriously and have a process to take it seriously."},{"id":"6b93bda6-26c6-419c-86da-1d6352c412fd","type":"opinion","location":"00:13:17.3-00:13:25.9","speaker":"Marco Rubio","text":"Senator Marco Rubio wants the United States government to have a process to analyse data on Unidentified Aerial Phenomena every time it comes in, with a place where this is catalogued and constantly analysed until answers are obtained.","quote":"I want us to have a process to analyze the data. every time it comes in, that there be a place where this is cataloged and constantly analyzed until we get some answers."},{"id":"8e624cda-7da1-4ef4-9e41-6cfa2e97f6a4","type":"opinion","location":"00:13:25.9-00:13:28.3","speaker":"Marco Rubio","text":"Senator Marco Rubio acknowledges that there may be either a simple answer or no simple answer regarding Unidentified Aerial Phenomena.","quote":"Maybe it has a very simple answer. Maybe it doesn't."},{"id":"20ad7fbc-f10c-4f31-a0f4-418576b26a4b","type":"opinion","location":"00:13:37.3","speaker":"Alex Dietrich","text":"Alex Dietrich felt vulnerable and lacked confidence in her ability to defend herself after witnessing what appeared to be an advanced aerial object during the 2004 USS Nimitz encounter.","quote":"I felt the vulnerability of not having anything to defend ourselves."}],"nodes":[{"id":"428bb770-fb62-41e8-8dfd-6fcaeffa7676","type":"person","name":"Bill Whitaker"},{"id":"1773991b-4c5e-4a2e-8336-7f09bb59fed2","type":"person","name":"Luis Elizondo"},{"id":"3b286183-be86-412c-a4a7-d540025e9663","type":"person","name":"Ryan Graves"},{"id":"685a1ed8-5055-41df-8355-da8dbd039cae","type":"person","name":"David Fravor"},{"id":"c0a8774e-6e6d-43bb-a788-2a7fd5f3e4c2","type":"person","name":"Alex Dietrich"},{"id":"aad74fc7-c12d-4e0f-9c95-78a3bae6dd99","type":"person","name":"Christopher Mellon"},{"id":"9ab8fc0c-2651-475f-845c-bd8d5d4c4d5c","type":"person","name":"Marco Rubio"},{"id":"1af7d5c8-beb2-453a-9bcd-5a9975ac9e29","type":"person","name":"Harry Reid"},{"id":"fa95d813-9fd6-4664-90cc-b830f465dac4","type":"organisation","name":"United States Navy"},{"id":"80d1e44e-b4be-47a9-89f3-78608962c9ad","type":"organisation","name":"United States Department of Defense (DoD)"},{"id":"ccff346f-d5fb-4faa-9c2b-8fb7bf9284bd","type":"organisation","name":"United States Congress"},{"id":"a83b8fd3-62ab-4634-b3c4-f13be650f7bd","type":"organisation","name":"US Senate Select Committee on Intelligence"},{"id":"dd61a29e-cbeb-4f49-81bb-94407d831dce","type":"organisation","name":"Office of the Director of National Intelligence (ODNI)"},{"id":"fd124bb0-d780-4417-a42e-f87e3b7161e9","type":"organisation","name":"The New York Times"},{"id":"aa932516-31c8-4705-ae68-da806b23f932","type":"organisation","name":"History Channel"},{"id":"eec9e3c6-f1f3-4f9a-ac55-c9ecf7273df4","type":"organisation","name":"Top Gun Naval Flight School"},{"id":"5eb10c47-0522-4602-b0dc-4769d8fa98bd","type":"organisation","name":"Naval Air Systems Command (NAVAIR)"},{"id":"dbd8ec97-e0cd-4de6-96c2-5b051cfe24df","type":"organisation","name":"Strike Fighter Squadron 41 (VFA-41)"},{"id":"f4bfe3fd-cfc7-49d4-a97b-d88a27466c77","type":"project","name":"Advanced Aerospace Threat Identification Program (AATIP)"},{"id":"fae7cded-7921-485a-b7fe-bea53428edd1","type":"project","name":"Project Blue Book"},{"id":"886e7262-bc0e-4814-baca-2f76ccd1bbb2","type":"project","name":"Unidentified Aerial Phenomena (UAP) Task Force"},{"id":"9eedf5f7-ce72-4516-885e-cbdb65ce5557","type":"place","name":"USA, California, San Diego"},{"id":"50612772-f99e-4317-b41e-3e3ca2ad2559","type":"place","name":"USA, Virginia, Virginia Beach"},{"id":"41528c78-995f-4780-9820-fce8963ebf1f","type":"place","name":"USA, Florida, Jacksonville"},{"id":"7006ef9c-f7ee-4615-b3a9-19ee1d2b925c","type":"place","name":"USA, Nevada, Area 51"},{"id":"0a2f9321-ca23-4491-8a5e-ddd823f12ee9","type":"place","name":"USA, California, Southern California"},{"id":"e46d2a29-bbed-45cd-bf83-cb55938bfade","type":"place","name":"Afghanistan"},{"id":"984efffb-856f-401c-b9aa-bcb5d82503d3","type":"place","name":"Middle East"},{"id":"bc7d8880-f4ca-4dd6-b081-4c86eceaba97","type":"place","name":"Cuba, Guantanamo Bay"},{"id":"3e16c7ca-304f-4774-9fc2-027cf8b1f98d","type":"place","name":"Atlantic Ocean"},{"id":"dc81af84-3804-4502-bab3-8feff5bfa68d","type":"event","name":"2004 USS Nimitz Carrier Strike Group UAP Encounter"},{"id":"46d77980-d543-4c6b-8aba-5e834332acdb","type":"event","name":"2015 Naval Aircrew UAP Sighting off Virginia Beach"},{"id":"450c3ae7-420d-4aa7-a8f2-da45c36c42da","type":"event","name":"2015 UAP Sighting off Jacksonville, Florida"},{"id":"9d47ae13-7d2e-4c09-ad37-c040f9d59a29","type":"event","name":"2014-2015 F-18 Squadron UAP Sightings Southeast of Virginia Beach"},{"id":"a0683cd3-8433-40a5-a868-7cda67ccc7a2","type":"event","name":"2017 New York Times UAP Video Leak"},{"id":"bb2cb54b-8add-4193-ae0e-caa179da3c9e","type":"object","name":"USS Nimitz"},{"id":"8bb50e84-679d-4898-9667-692dd2341803","type":"object","name":"USS Princeton"},{"id":"37595401-953e-4ba4-9d29-78563fdd0694","type":"object","name":"F/A-18 Super Hornet"},{"id":"3862db93-719f-4c03-8c29-33b50ae67157","type":"object","name":"Boeing 737"},{"id":"527f18fb-660b-4bef-a63f-6dfcc4895395","type":"document","name":"Navy UAP Targeting Camera Footage 2015"},{"id":"05b7827a-f6fb-425c-b5b4-08cb8fcd1ebf","type":"document","name":"Navy UAP Targeting Camera Footage 2019"},{"id":"7a133e42-2870-49e5-9a28-aa5b22ba8872","type":"document","name":"Declassified Navy UAP Videos (AATIP)"},{"id":"04a4f13c-35d5-43d0-b1a1-8317c537fb80","type":"document","name":"60 Minutes Interview on Navy UAP Encounters (2021-05-17)"},{"id":"9ae52f1b-86aa-41f7-8d03-b654fa49716a","type":"topic","name":"Unidentified Aerial Phenomena (UAP)"},{"id":"3db1d289-6094-43f0-948d-125a728d485d","type":"topic","name":"Unidentified Flying Object (UFO)"},{"id":"763bfdf3-9a5f-4c4c-a228-1d57b47ef377","type":"topic","name":"Anomalous Aerial Vehicle (AAV)"},{"id":"d8d14f1a-7f23-4e59-9bb9-4281c1707d96","type":"topic","name":"Advanced Propulsion Systems"},{"id":"5f3b0ff4-913f-49fc-90d6-345c7cfa029a","type":"topic","name":"Radar Tracking and Targeting"},{"id":"739f4ef6-8851-40a3-906c-ef9368a35260","type":"topic","name":"Military Aviation Encounters with Unknown Objects"},{"id":"7faaefee-9e31-403e-b0ed-51968a0f6290","type":"topic","name":"National Security Implications of UAP"},{"id":"d9528a49-4c3a-48ca-a009-0641d0e272a7","type":"organisation","name":"Carrier Strike Group 11 (CSG-11)"},{"id":"56c564ea-7611-4bf2-8b21-9c7dc9dd9f6b","type":"organisation","name":"Pentagon"},{"id":"51e2e5d4-e703-401f-b827-5b17da0d3132","type":"organisation","name":"Defense Intelligence Agency (DIA)"},{"id":"86d2e7aa-f1f9-425f-afd0-79147a8e3d7b","type":"organisation","name":"Federal Aviation Administration (FAA)"}]},{"id":"anthropic_claude-opus-4.8","name":"anthropic / claude-opus-4.8","errata":null,"claims":[{"id":"91a41714-6c7f-4006-9962-990cde81c3b3","type":"testimony","location":"00:00:07.6-00:00:23.0","speaker":"Whitaker, Bill","text":"The United States government has grudgingly acknowledged Unidentified Aerial Phenomena (UAP), more commonly known as UFOs, after decades of public denial.","quote":"It's the story of the U.S. government's grudging acknowledgement of Unidentified Aerial Phenomena, UAP, more commonly known as ufos after decades of public denial the pentagon now admits there's something out there"},{"id":"631d3bc4-72b1-44aa-9a14-9be3b6d07bba","type":"testimony","location":"00:00:23.0-00:00:44.4","speaker":"Whitaker, Bill","text":"The United States Senate Select Committee on Intelligence ordered the Director of National Intelligence and the Secretary of Defense to deliver a report on the UAP sightings.","quote":"the u.s senate wants to know what it is the intelligence committee has ordered the director of national intelligence and the secretary of defense to deliver a report on the mysterious sightings by next month"},{"id":"d2063444-c352-4944-81ed-3394d8961e13","type":"testimony","location":"00:00:54.6-00:00:59.6","speaker":"Elizondo, Luis","text":"The United States government has officially stated for the record that Unidentified Flying Objects (UFOs) are real.","quote":"The government has already stated for the record that they're real. I'm not telling you that. The United States government is telling you that."},{"id":"4288886d-0c7a-45a5-a2fa-63b00deb202c","type":"testimony","location":"00:01:02.4-00:01:11.5","speaker":"Whitaker, Bill","text":"Luis Elizondo spent 20 years running military intelligence operations worldwide, in Afghanistan, the Middle East, and Guantanamo.","quote":"Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo."},{"id":"cfbb2b17-830b-428e-9dae-a172f2c1ac3d","type":"testimony","location":"00:01:11.5-00:01:24.1","speaker":"Whitaker, Bill","text":"Luis Elizondo had not given UFOs a second thought until 2008, when he was asked to join the Advanced Aerospace Threat Identification Program (AATIP) at the Pentagon.","quote":"He hadn't given UFOs a second thought until 2008. That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP."},{"id":"b4950931-8199-4c3e-afb7-6fed4841c075","type":"testimony","location":"00:01:24.1-00:01:34.3","speaker":"Elizondo, Luis","text":"The mission of the Advanced Aerospace Threat Identification Program (AATIP) was to collect and analyse information involving anomalous aerial vehicles, which in the vernacular are called UFOs.","quote":"The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs. We call them UAPs."},{"id":"b7d68053-0b30-434d-ba8c-e218c6837e4d","type":"testimony","location":"00:01:50.3-00:02:01.6","speaker":"Whitaker, Bill","text":"The Advanced Aerospace Threat Identification Program (AATIP) was part of a 22-million-dollar programme sponsored by then Senate Majority Leader Harry Reid to investigate UFOs.","quote":"Buried away in the Pentagon, AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs."},{"id":"4e0f39a4-9aec-43b2-87b9-2022b4387705","type":"testimony","location":"00:01:54.0-00:02:10.8","speaker":"Whitaker, Bill","text":"When Luis Elizondo took over the Advanced Aerospace Threat Identification Program (AATIP) in 2010, he focused on the national security implications of Unidentified Aerial Phenomena documented by US service members.","quote":"When Elizondo took over in 2010, he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members."},{"id":"53a85acb-9c7f-4566-ab01-c816cb3113bf","type":"testimony","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Luis Elizondo described UAP as a technology that can pull 600 to 700 G-forces.","quote":"Imagine a technology that can do 600 to 700 G-forces"},{"id":"977f3aed-e2ec-4835-8a93-194a80a10b83","type":"testimony","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Luis Elizondo described UAP as a technology that can fly at approximately 21,000 kilometres per hour.","quote":"that can fly at 13,000 miles an hour"},{"id":"21f3141e-4be7-4c9f-874e-6de583bfca30","type":"testimony","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Luis Elizondo described UAP as a technology that can evade radar.","quote":"that can evade radar"},{"id":"9f3f26fa-0761-4b84-9b6e-8e984149c893","type":"testimony","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Luis Elizondo described UAP as a technology that can fly through air and water and possibly space.","quote":"that can fly through air and water and possibly space"},{"id":"72dd7330-1316-4044-8844-a6a75c2042b8","type":"testimony","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Luis Elizondo described UAP as having no obvious signs of propulsion, no wings, and no control surfaces.","quote":"has no obvious signs of propulsion, no wings, no control surfaces"},{"id":"75b34775-e0b5-4844-9e7a-49bf33a13120","type":"testimony","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Luis Elizondo described UAP as a technology that can defy the natural effects of Earth's gravity, and stated that is precisely what is being seen.","quote":"and yet still can defy the natural effects of Earth's gravity. That's precisely what we're seeing."},{"id":"56eaae54-8db0-4ba0-9d71-a7c238583eb7","type":"testimony","location":"00:02:37.0-00:02:47.7","speaker":"Elizondo, Luis","text":"The Advanced Aerospace Threat Identification Program (AATIP) was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time.","quote":"Elizondo tells us AATIP was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time."},{"id":"9ab3f409-6584-4d00-842f-b6ff705c3427","type":"testimony","location":"00:02:57.7-00:03:02.1","speaker":"Whitaker, Bill","text":"A Navy aircrew struggled to lock onto a fast-moving object off the US Atlantic coast in 2015.","quote":"A Navy aircrew struggles to lock onto a fast-moving object off the U.S. Atlantic coast in 2015."},{"id":"f2ba827c-ed09-4964-a993-3025c9a85764","type":"testimony","location":"00:03:07.3-00:03:20.4","speaker":"Whitaker, Bill","text":"The Pentagon admits it does not know what the objects in recently released UAP images are.","quote":"the Pentagon admits it doesn't know what in the world this is, or this, or this."},{"id":"5081a283-a967-4fcd-bab0-3551e48e879f","type":"opinion","location":"00:03:30.4-00:03:38.6","speaker":"Elizondo, Luis","text":"In some cases there are simple explanations for what people are witnessing, but there are some UAP cases that have no simple explanation.","quote":"In some cases, there are simple explanations for what people are witnessing, but there are some that that are not."},{"id":"34517ce6-7eb5-417d-8e6f-a7eb296c0d08","type":"opinion","location":"00:03:42.7-00:04:00.0","speaker":"Elizondo, Luis","text":"When all alternative explanations such as new Chinese cruise missile technology or a high-altitude reconnaissance balloon have been exhausted and the object remains real and in US airspace, the UAP problem becomes compelling and problematic.","quote":"Is it some sort of new type of cruise missile technology that China has developed? Is it some sort of high-altitude balloon that's conducting reconnaissance? Ultimately, when you have exhausted all those what-ifs and you're still left with the fact that this is in our airspace and it's real, that's when it becomes compelling and that's when it becomes problematic."},{"id":"78c5b8c3-f8c5-4c4a-b490-da4bd0c7ce64","type":"opinion","location":"00:04:06.2-00:04:12.9","speaker":"Whitaker, Bill","text":"Former Navy pilot Lieutenant Ryan Graves considers whatever UAP are out there a security risk.","quote":"Former Navy pilot Lieutenant Ryan Graves calls whatever is out there a security risk."},{"id":"69cbc95f-af12-46ac-8b0f-6a3ec02b832d","type":"testimony","location":"00:04:06.2-00:04:29.7","speaker":"Graves, Ryan","text":"Ryan Graves's F/A-18 squadron began seeing UAP hovering over restricted airspace southeast of Virginia Beach in 2014, after they updated their jet's radar making it possible to zero in with infrared targeting cameras.","quote":"He told us his F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar, making it possible to zero in with infrared targeting cameras."},{"id":"c699b757-de62-4dd1-9f21-8d64f6ebc760","type":"opinion","location":"00:04:29.7-00:04:37.1","speaker":"Graves, Ryan","text":"The dual detection of UAP by both radar and infrared is hard to spoof.","quote":"Bill Whitaker: So you're seeing it both with the radar and with the infrared, and that tells you that there is something out there. Ryan Graves: Pretty hard to spoof that."},{"id":"df8cf097-3c69-4ba9-a0b1-54f1213e31c5","type":"testimony","location":"00:04:38.6-00:04:48.2","speaker":"Whitaker, Bill","text":"Photographs of objects were taken in 2019 in the same area southeast of Virginia Beach, and the Pentagon confirms these are images of objects it cannot identify.","quote":"These photographs were taken in 2019 in the same area. The Pentagon confirms these are images of objects it can't identify."},{"id":"74741843-e809-47dd-8497-09aba3a97af0","type":"testimony","location":"00:04:48.2-00:04:56.6","speaker":"Graves, Ryan","text":"Pilots training off the Atlantic coast saw UAP every day for at least a couple of years.","quote":"Bill Whitaker: Lieutenant Graves told us pilots training off the Atlantic coast see things like that all the time. Ryan Graves: Every day. Every day for at least a couple of years."},{"id":"dc764e0d-84b8-4a3b-b432-6419973012e2","type":"observation","location":"00:05:01.2-00:05:02.5","speaker":"Graves, Ryan","text":"Ryan Graves observed no exhaust plume on the UAP.","quote":"You know, I don't see an exhaust plume."},{"id":"83ba7af3-faf8-4dfa-8925-fb878a655fc5","type":"testimony","location":"00:05:04.3-00:05:12.8","speaker":"Whitaker, Bill","text":"A UAP was captured on a targeting camera off the coast of Jacksonville, Florida in 2015 by members of Ryan Graves's squadron.","quote":"including this one, off the coast of Jacksonville, Florida in 2015, captured on a targeting camera by members of Graves' squadron."},{"id":"edcc9eaa-e7aa-4113-8000-dbce425c9a0c","type":"observation","location":"00:05:12.8-00:05:23.8","speaker":null,"text":"In the Jacksonville UAP footage the objects were rotating and going against a wind of approximately 220 kilometres per hour.","quote":"It's rotating. My gosh! They're all going against the wind. The wind's 120 knots far west."},{"id":"6f3b3532-bfea-4417-9c04-ea368acfc390","type":"observation","location":"00:05:35.8-00:05:42.8","speaker":"Graves, Ryan","text":"The UAP off Jacksonville displayed rotation, high altitudes, and propulsion, and Ryan Graves does not know what it is.","quote":"This is a difficult one to explain. You have rotation, you have high altitudes, you have propulsion, right? I don't know. I don't know what it is, frankly."},{"id":"fdb37958-7988-464c-978b-95d9a8df33f2","type":"opinion","location":"00:05:44.9-00:05:50.0","speaker":"Whitaker, Bill","text":"Pilots speculate the UAP are one of three things: secret US technology, an adversary spy vehicle, or something otherworldly.","quote":"He told us pilots speculate they are one of three things, secret U.S. technology, an adversary spy vehicle, or something otherworldly."},{"id":"fd118f6d-640b-4113-ae73-3ba1a42b3d34","type":"opinion","location":"00:05:56.0-00:06:00.5","speaker":"Graves, Ryan","text":"Ryan Graves considers the highest probability for the UAP to be a threat observation program.","quote":"I'd say, you know, the highest probability is it's a threat observation program."},{"id":"c92c17e2-aea5-4fdc-94cd-b263adad3402","type":"opinion","location":"00:06:00.5-00:06:04.1","speaker":"Graves, Ryan","text":"Ryan Graves considers Russian or Chinese technology a possible explanation for the observed UAP.","quote":"Bill Whitaker: Could it be Russian or Chinese technology? Ryan Graves: I don't see why not."},{"id":"84e74a63-b1db-47af-bd31-a8870f8d2db4","type":"opinion","location":"00:06:05.4-00:06:23.4","speaker":"Graves, Ryan","text":"Ryan Graves is worried about the UAP, considering that if tactical jets from another country were present it would be a massive issue, but because the objects look slightly different the problem is being ignored.","quote":"I am worried, frankly. You know, if these were tactical jets from another country that were hanging out up there, it would be a massive issue. But because it looks slightly different, we're not willing to actually look at the problem in the face. We're happy to just ignore the fact that these are out there watching us every day."},{"id":"f5257ddb-0e07-4628-8307-8761e5e3f249","type":"testimony","location":"00:06:23.4-00:06:30.3","speaker":"Whitaker, Bill","text":"The US government has ignored UAP publicly since closing its Project Blue Book investigation in 1969.","quote":"The government has ignored it, at least publicly, since closing its Project Blue Book investigation in 1969."},{"id":"c044a440-f655-416f-94b2-fec22c8e59ac","type":"testimony","location":"00:06:30.3-00:06:40.8","speaker":"Whitaker, Bill","text":"The official attitude began to change after an incident off Southern California in 2004, which was documented by radar, by camera, and by four naval aviators.","quote":"But that began to change after an incident off Southern California in 2004, which was documented by radar, by camera, and four naval aviators."},{"id":"80e362a9-00c3-495e-b105-45810ca6ef3b","type":"testimony","location":"00:06:33.0-00:06:40.8","speaker":"Whitaker, Bill","text":"David Fravor is a graduate of the Top Gun Naval Flight School and was commander of the F/A-18 squadron on the USS Nimitz.","quote":"David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz"},{"id":"edaed378-5657-4555-86dd-057c7237770d","type":"testimony","location":"00:06:40.8-00:06:57.3","speaker":"Whitaker, Bill","text":"Lieutenant Alex Dietrich was flying at David Fravor's wing during the 2004 USS Nimitz encounter and had never spoken publicly about the encounter before.","quote":"and flying at his wing, Lieutenant Alex Dietrich, who has never spoken publicly about the encounter."},{"id":"e97af039-a5a0-4f7f-80e4-a6bf896e219d","type":"testimony","location":"00:07:02.7-00:07:14.4","speaker":"Dietrich, Alex","text":"Alex Dietrich felt a responsibility to share what she could about the 2004 USS Nimitz encounter because she was in a government aircraft and on the clock, and the information is unclassified.","quote":"Because I was in a government aircraft, because I was on the clock, and so I feel a responsibility to share what I can, and it is unclassified."},{"id":"d4d81dc0-d71b-400d-9326-d8876febf35d","type":"testimony","location":"00:07:14.4-00:07:23.1","speaker":"Whitaker, Bill","text":"In November 2004 the USS Nimitz Carrier Strike Group was training about 160 kilometres southwest of San Diego.","quote":"It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego."},{"id":"fc93bda2-8c7c-433f-90c4-15ab5a4fa246","type":"testimony","location":"00:07:23.1-00:07:39.3","speaker":"Whitaker, Bill","text":"For a week before the 2004 encounter, the advanced new radar on the USS Princeton had detected what operators called multiple anomalous aerial vehicles over the horizon, descending approximately 24,000 metres in less than a second.","quote":"For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 80,000 feet in less than a second."},{"id":"2064eb8d-ac9f-4a1e-a3a7-ecb276c9aa34","type":"testimony","location":"00:07:39.3-00:07:47.8","speaker":"Whitaker, Bill","text":"On 2004-11-14, David Fravor and Alex Dietrich, each with a weapons system officer in the backseat, were diverted to investigate the anomalous aerial vehicles.","quote":"On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate."},{"id":"f20dffda-6162-4e87-817e-bb0933810b0f","type":"observation","location":"00:07:47.8-00:07:55.9","speaker":"Whitaker, Bill","text":"During the 2004 USS Nimitz encounter, the aviators found an area of roiling white water the size of a Boeing 737 in an otherwise calm blue sea.","quote":"They found an area of roiling white water the size of a 737 in an otherwise calm blue sea."},{"id":"defbc6e0-7045-4f77-b0a2-84f6b6901649","type":"observation","location":"00:07:55.9-00:08:12.3","speaker":"Fravor, David","text":"During the 2004 USS Nimitz encounter, David Fravor and his crew saw a little white object resembling a Tic Tac moving above the white-water area.","quote":"And we saw this little white tic-tac-looking object. And it's just kind of moving above the whitewater area."},{"id":"d12d8bb2-72e9-493d-bb07-07a63aa71149","type":"observation","location":"00:08:17.9-00:08:28.9","speaker":"Fravor, David","text":"During the 2004 USS Nimitz encounter, as David Fravor descended toward the object it turned abruptly and began mirroring his movements, coming up as he came down, and he believed it was aware they were there.","quote":"The tic-tac's still pointing north-south. It goes and just turns abruptly and starts mirroring me. So as I'm coming down, it starts coming up. ... Yeah, it was aware we were there."},{"id":"bdcb632d-8970-4752-be7a-1019554be6ce","type":"observation","location":"00:08:30.5-00:08:37.0","speaker":"Fravor, David","text":"David Fravor estimated the object in the 2004 USS Nimitz encounter was about the size of his F/A-18, with no markings, no wings, and no exhaust plumes.","quote":"He said it was about the size of his F-18, with no markings, no wings, no exhaust plumes."},{"id":"94e44628-84d3-44f1-86a0-33ab7ffd0c71","type":"observation","location":"00:08:37.0-00:08:47.8","speaker":"Fravor, David","text":"During the 2004 USS Nimitz encounter, when David Fravor tried to close in, the object climbed and then, when it got right in front of him, disappeared and sped off.","quote":"So I go like this, and it's climbing still. And when it gets right in front of me, it just disappears. ... Disappears, like gone. It had sped off."},{"id":"5c0121b7-b38e-4b88-a0d4-8e64ad55b48a","type":"observation","location":"00:08:50.9-00:09:00.9","speaker":"Dietrich, Alex","text":"Alex Dietrich tried to make sense of the 2004 USS Nimitz object by categorising it as maybe a helicopter or a drone, until it disappeared.","quote":"So your mind tries to make sense of it. I'm going to categorize this as maybe a helicopter or maybe a drone. And when it disappeared, I mean, it was just..."},{"id":"4b4b418f-e077-4783-992e-7d96d17fdfa5","type":"observation","location":"00:09:00.9-00:09:08.9","speaker":"Fravor, David","text":"Four people in the airplanes, including the backseaters, watched the object during the 2004 USS Nimitz encounter for roughly about five minutes.","quote":"There was four of us in the airplanes literally watching this thing for roughly about five minutes."},{"id":"3597c741-4680-4f3c-ac23-b71e0617e68e","type":"testimony","location":"00:09:08.9-00:09:20.8","speaker":"Whitaker, Bill","text":"Seconds after the object disappeared, the USS Princeton reacquired the target approximately 97 kilometres away, and another crew managed to briefly lock onto it with a targeting camera before it zipped off again.","quote":"Seconds later, the Princeton reacquired the target, 60 miles away. Another crew managed to briefly lock onto it with a targeting camera before it zipped off again."},{"id":"1c88319e-2bd5-4ed3-ac46-94952c66c234","type":"opinion","location":"00:09:45.5-00:09:56.5","speaker":"Fravor, David","text":"David Fravor believes there is definitely something out there that was better than his airplane, although he does not know who built it or who has the technology.","quote":"There's definitely something that, I don't know who's building it, who's got the technology, who's got the brains, but there's something out there that was better than our airplane."},{"id":"d8c80f82-b764-40e8-abee-bb1c6fe6311e","type":"testimony","location":"00:09:56.5-00:10:13.2","speaker":"Whitaker, Bill","text":"After the 2004 USS Nimitz aircrew filed reports, nothing was said or done officially for five years until Luis Elizondo came across the story and investigated.","quote":"The air crew filed reports. Then, like the mysterious flying object, the Nimitz encounter disappeared. Nothing was said or done officially for five years until Lou Elizondo came across the story and investigated."},{"id":"88068b7c-b4e6-4032-a7bf-38e152596f79","type":"opinion","location":"00:10:13.2-00:10:27.7","speaker":"Elizondo, Luis","text":"Trained pilots are seeing something they cannot explain, and that information is backed up by electro-optical data such as gun camera footage and by radar data, which Luis Elizondo considers compelling.","quote":"We spend millions of dollars in training these pilots, and they are seeing something that they can't explain. Furthermore, that information's being backed up on electro-optical data, like gun camera footage, and by radar data. Now, to me, that's compelling."},{"id":"b23f8312-b4eb-4db7-a991-6b5fea30c576","type":"testimony","location":"00:10:27.7-00:10:31.7","speaker":"Whitaker, Bill","text":"Inside the Pentagon, Luis Elizondo's findings were met with scepticism.","quote":"Inside the Pentagon, his findings were met with skepticism."},{"id":"aab5ba1f-0f03-4a32-9ed5-6705e50e1e09","type":"testimony","location":"00:10:31.7-00:10:39.5","speaker":"Elizondo, Luis","text":"The Advanced Aerospace Threat Identification Program (AATIP)'s funding was eliminated in 2012, but Luis Elizondo and a handful of others kept the mission alive.","quote":"AATIP's funding was eliminated in 2012, but Elizondo says he and a handful of others kept the mission alive."},{"id":"0a18f509-81d3-430c-86d8-03b9ff4c5944","type":"testimony","location":"00:10:39.5-00:10:48.8","speaker":"Whitaker, Bill","text":"Luis Elizondo quit the Pentagon in 2017, frustrated, but not before getting three videos declassified.","quote":"until finally, frustrated, he quit the Pentagon in 2017, but not before getting these three videos declassified."},{"id":"dba87b60-c937-485e-b605-05204a608a3d","type":"testimony","location":"00:10:51.9-00:10:57.5","speaker":"Mellon, Christopher","text":"Christopher Mellon tried to help his colleague Luis Elizondo elevate the UAP issue within the Department of Defense and get it to the Secretary of Defense.","quote":"I tried to help my colleague, Lou Elizondo, elevate the issue in the department and actually get it to the Secretary of Defense."},{"id":"5b24f629-6441-470e-bf77-fe21646aed27","type":"testimony","location":"00:10:57.5-00:11:08.4","speaker":"Whitaker, Bill","text":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Bill Clinton and George W. Bush, and had access to top-secret government programmes.","quote":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush, and had access to top-secret government programs."},{"id":"14e5d51d-853a-4d9d-9b67-d782514a6376","type":"opinion","location":"00:11:08.4-00:11:18.7","speaker":"Mellon, Christopher","text":"The UAP are not US technology, which Christopher Mellon says he can state with a very high degree of confidence in part because of the positions he held in the department.","quote":"So it's not us, that's one thing we know. ... I could say that with a very high degree of confidence, in part because of the positions I held in the department, and I know the process."},{"id":"66947bc2-4345-4d28-8868-db36696132c4","type":"testimony","location":"00:11:18.7-00:11:26.2","speaker":"Whitaker, Bill","text":"Christopher Mellon grew concerned that nothing was being done about UAP, so he decided to do something.","quote":"Mellon says he grew concerned nothing was being done about UAPs, so he decided to do something."},{"id":"7a25ca03-217e-4b04-ad9c-3486c73dfd31","type":"testimony","location":"00:11:57.6-00:12:07.2","speaker":"Mellon, Christopher","text":"Christopher Mellon and Luis Elizondo understood that they had to engage the public to get the public interested, in order to get Congress interested, and then circle back to the Defense Department to get them to start taking a look at the UAP issue.","quote":"We knew and understood that you had to go to the public, get the public interested to get Congress interested, to then circle back to the Defense Department and get them to start taking a look at it."},{"id":"c0d607dd-0dca-4520-a37b-3d14be690eff","type":"testimony","location":"00:12:09.1-00:12:15.6","speaker":"Whitaker, Bill","text":"In August 2020 the Pentagon resurrected the Advanced Aerospace Threat Identification Program (AATIP), now called the UAP Task Force.","quote":"This past August, the Pentagon resurrected AATIP. It's now called the UAP Task Force."},{"id":"a61a53cd-f63d-47e6-99e2-9f3247752458","type":"testimony","location":"00:12:15.6-00:12:20.1","speaker":"Whitaker, Bill","text":"US service members are now encouraged to report strange encounters.","quote":"Service members now are encouraged to report strange encounters."},{"id":"7f2f2288-bbf1-40df-9fd1-3e4469501673","type":"opinion","location":"00:12:22.6-00:12:26.5","speaker":"Rubio, Marco","text":"Anything that enters an airspace that is not supposed to be there is a threat.","quote":"Anything that enters an airspace that's not supposed to be there is a threat."},{"id":"18c4b80b-fbfc-4739-a35a-ba6e57e436a3","type":"testimony","location":"00:12:26.5-00:12:34.0","speaker":"Whitaker, Bill","text":"After receiving classified briefings on UAP, Senator Marco Rubio called for a detailed analysis.","quote":"After receiving classified briefings on UAPs, Senator Marco Rubio called for a detailed analysis."},{"id":"255e972c-b6c9-40d3-9182-af5b32dfcb84","type":"testimony","location":"00:12:34.0-00:12:46.3","speaker":"Whitaker, Bill","text":"In December 2020, while still head of the Intelligence Committee, Marco Rubio asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report on UAP.","quote":"This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month."},{"id":"196282e5-84b7-4c3a-acec-dddb174fd1a8","type":"opinion","location":"00:12:59.0-00:13:06.9","speaker":"Rubio, Marco","text":"There is a stigma on Capitol Hill around the UAP topic, with some members very interested and some giggling when it is brought up, but Marco Rubio does not think the stigma should keep them from having an answer to a fundamental question.","quote":"You know, there's a stigma on Capitol Hill. I mean, some of my colleagues are very interested in this topic and some kind of, you know, giggle when you bring it up. But I don't think we can allow the stigma to keep us from having an answer to a very fundamental question."},{"id":"52ae795a-a936-4a48-b44c-c57a31143561","type":"opinion","location":"00:13:14.1-00:13:28.3","speaker":"Rubio, Marco","text":"Marco Rubio wants a process to take UAP seriously and to analyse the data every time it comes in, with a place where it is catalogued and constantly analysed until answers are reached.","quote":"I want us to take it seriously and have a process to take it seriously. I want us to have a process to analyze the data. every time it comes in, that there be a place where this is cataloged and constantly analyzed until we get some answers."},{"id":"39450a0d-883b-4123-87ba-83c3f054de3c","type":"testimony","location":"00:13:37.3-00:13:41.7","speaker":"Dietrich, Alex","text":"During the 2004 USS Nimitz encounter, Alex Dietrich felt the vulnerability of not having anything to defend themselves.","quote":"I felt the vulnerability of not having anything to defend ourselves."}],"nodes":[{"id":"02fa2754-cc6b-4d88-bc6e-651dc3a00517","type":"topic","name":"Unidentified Aerial Phenomena (UAP)"},{"id":"0aff1a47-6bf9-4011-90b9-7c1f0db34165","type":"topic","name":"anomalous aerial vehicle (AAV)"},{"id":"b8dce914-38c8-40ac-9f2e-77cca3311f36","type":"person","name":"Whitaker, Bill"},{"id":"3c9fa2de-337e-4fb5-9be4-86efc67a29f1","type":"person","name":"Elizondo, Luis"},{"id":"a272891a-eb56-40ad-bff9-c57abb5ce40f","type":"person","name":"Graves, Ryan"},{"id":"be36107c-e9c4-4b1a-8225-9c25d24beaaf","type":"person","name":"Fravor, David"},{"id":"4c723cfd-b86c-4f63-a24f-702772a531e5","type":"person","name":"Dietrich, Alex"},{"id":"ef251b94-544e-478a-9144-3f4aa16b8cff","type":"person","name":"Mellon, Christopher"},{"id":"2e279bf2-4974-4b41-b3f9-bcd14947590d","type":"person","name":"Rubio, Marco"},{"id":"a155cf90-8821-4923-b183-8d20e7c640a4","type":"person","name":"Reid, Harry"},{"id":"213e4a2f-a55a-4aa4-a876-57051ada3c17","type":"person","name":"Clinton, Bill"},{"id":"9494ced4-e55a-48ed-8e6a-a0c23ffab369","type":"person","name":"Bush, George W."},{"id":"3ea4c4b8-9dfb-40e8-9f52-63f4fe3c30c3","type":"project","name":"Advanced Aerospace Threat Identification Program (AATIP)"},{"id":"87020f5a-909e-465f-8422-e26f7230a277","type":"project","name":"Project Blue Book"},{"id":"6ca048f0-0096-4f0e-8bff-540679c9f1e6","type":"project","name":"UAP Task Force"},{"id":"d65a5ced-39a3-44d0-877a-a9195f47e6d8","type":"organisation","name":"United States Department of Defense (DoD)"},{"id":"a880ac3e-6310-4aa3-b695-df2f3bcefe63","type":"organisation","name":"United States Navy"},{"id":"c4d8d479-2fb5-4f07-bdf5-7fb1a3fa1bd1","type":"organisation","name":"United States Congress"},{"id":"31802dfa-f989-402f-b084-e4468742fcb1","type":"organisation","name":"United States Senate Select Committee on Intelligence"},{"id":"895518fb-696f-4ea5-8209-e76fdd066c6b","type":"organisation","name":"Office of the Director of National Intelligence (ODNI)"},{"id":"8cabe619-b1e7-4292-9d67-991718d66443","type":"organisation","name":"Top Gun Naval Flight School"},{"id":"ecee81f9-ad4e-4a39-84d2-e8d3304c54ec","type":"organisation","name":"The New York Times"},{"id":"0d341cbb-c490-4e21-8f88-234340404802","type":"organisation","name":"History Channel"},{"id":"e9643197-c641-489f-afd4-521785a7f6cd","type":"organisation","name":"60 Minutes"},{"id":"35c74a3f-3538-4f3e-9222-d64bb7e9b410","type":"object","name":"USS Nimitz"},{"id":"bc0cec07-b92e-41f0-bff4-b32944e0b8fe","type":"object","name":"USS Princeton"},{"id":"28ba70e6-bc06-4671-88da-dbcd39894f59","type":"object","name":"F/A-18"},{"id":"d73cc434-7081-4873-9c52-27211397d024","type":"event","name":"2004 USS Nimitz UAP encounter"},{"id":"5e404b2f-f54a-464d-8e32-3780d1cf0fa8","type":"event","name":"2015 USS Theodore Roosevelt East Coast UAP sightings"},{"id":"02566dae-c9e2-4335-b7cc-79e68b2fc275","type":"place","name":"USA, California, San Diego"},{"id":"62ccb3e0-6eb1-4a28-a3c6-2231f4737cc8","type":"place","name":"USA, Virginia, Virginia Beach"},{"id":"be6db76d-072a-4d6a-8ff4-694334b25e3d","type":"place","name":"USA, Florida, Jacksonville"},{"id":"614e870a-2440-4e58-8007-efbfb514fb31","type":"place","name":"USA, District of Columbia, Pentagon"},{"id":"df61cc98-8ce4-4701-86ec-a27f19a17d49","type":"document","name":"Three declassified US Navy UAP videos"}]},{"id":"anthropic_claude-sonnet-4.6","name":"anthropic / claude-sonnet-4.6","errata":null,"claims":[{"id":"a1fce519-44e4-49e7-8c88-1eedeaadc377","type":"testimony","location":"00:00:56.3-00:00:59.6","speaker":"Elizondo, Luis","text":"The US government has officially stated for the record that Unidentified Aerial Phenomena (UAP) are real.","quote":"The government has already stated for the record that they're real. I'm not telling you that. The United States government is telling you that."},{"id":"161d6154-06a7-4f0d-89a7-38e129f64b53","type":"administrative","location":"00:01:02.4-00:01:11.5","speaker":null,"text":"Luis Elizondo spent 20 years running military intelligence operations worldwide, including in Afghanistan, the Middle East, and Guantanamo.","quote":"Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo."},{"id":"1cdb1534-e1ec-4319-b006-c095804a22b8","type":"administrative","location":"00:01:11.5-00:01:15.6","speaker":null,"text":"Luis Elizondo had not given UFOs a second thought until 2008.","quote":"He hadn't given UFOs a second thought until 2008."},{"id":"ba802684-8fd5-43ef-be58-af2bcbf40f26","type":"administrative","location":"00:01:15.6-00:01:24.1","speaker":null,"text":"In 2008, Luis Elizondo was asked to join the Advanced Aerospace Threat Identification Program (AATIP) at the Pentagon.","quote":"That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP."},{"id":"44a85edd-55d9-4de7-b509-a6ae2ba9b204","type":"testimony","location":"00:01:24.1-00:01:34.3","speaker":"Elizondo, Luis","text":"The mission of the Advanced Aerospace Threat Identification Program (AATIP) was to collect and analyse information involving anomalous aerial vehicles (AAV), commonly referred to as UFOs.","quote":"The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs. We call them UAPs."},{"id":"37ac6891-9f87-41f1-9416-7f4c43ba5ef0","type":"administrative","location":"00:01:50.3-00:02:01.6","speaker":null,"text":"The Advanced Aerospace Threat Identification Program (AATIP) was part of a $22 million programme sponsored by then Senate Majority Leader Harry Reid to investigate UFOs.","quote":"Buried away in the Pentagon, AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs."},{"id":"7c433ca7-c275-4c76-92d4-5b07a798dda7","type":"administrative","location":"00:01:50.3-00:02:10.8","speaker":null,"text":"Luis Elizondo took over as head of the Advanced Aerospace Threat Identification Program (AATIP) in 2010.","quote":"When Elizondo took over in 2010, he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members."},{"id":"b3e28927-3470-4c5d-8aad-01ba0fddae11","type":"administrative","location":"00:02:01.6-00:02:10.8","speaker":null,"text":"From 2010 onwards, Luis Elizondo focused the Advanced Aerospace Threat Identification Program (AATIP) on the national security implications of Unidentified Aerial Phenomena (UAP) documented by US service members.","quote":"When Elizondo took over in 2010, he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members."},{"id":"09aafd42-f977-4e1a-9532-494e0196aacf","type":"testimony","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"UAP observed and documented by the Advanced Aerospace Threat Identification Program (AATIP) appeared capable of withstanding 600 to 700 G-forces.","quote":"Imagine a technology that can do 600 to 700 G-forces"},{"id":"b3fff43f-ca3f-446e-87f0-9b6b9a37f0a5","type":"testimony","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"UAP observed and documented by the Advanced Aerospace Threat Identification Program (AATIP) appeared capable of flying at approximately 21,000 kilometres per hour.","quote":"that can fly at 13,000 miles an hour"},{"id":"edca399a-25b6-4c24-8b81-6fa8c19ae1ac","type":"testimony","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"UAP observed and documented by the Advanced Aerospace Threat Identification Program (AATIP) appeared capable of evading radar.","quote":"that can evade radar"},{"id":"408d928e-f542-47d6-95a8-c6826b80d22f","type":"testimony","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"UAP observed and documented by the Advanced Aerospace Threat Identification Program (AATIP) appeared capable of flying through air, water, and possibly space.","quote":"that can fly through air and water and possibly space"},{"id":"ffcb023b-cbe2-4ba6-880c-254c2d44b14a","type":"testimony","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"UAP observed and documented by the Advanced Aerospace Threat Identification Program (AATIP) showed no obvious signs of propulsion.","quote":"has no obvious signs of propulsion"},{"id":"4d566ce9-7ddb-461a-9804-20b11c816d2f","type":"testimony","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"UAP observed and documented by the Advanced Aerospace Threat Identification Program (AATIP) had no wings.","quote":"no wings"},{"id":"f8696f08-10e4-4f5e-8047-9ee9530efb48","type":"testimony","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"UAP observed and documented by the Advanced Aerospace Threat Identification Program (AATIP) had no control surfaces.","quote":"no control surfaces"},{"id":"78281d7f-f52b-4bfd-9b30-d1a52bff1ba3","type":"testimony","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"UAP observed and documented by the Advanced Aerospace Threat Identification Program (AATIP) appeared to defy the natural effects of Earth's gravity.","quote":"and yet still can defy the natural effects of Earth's gravity"},{"id":"68a9b7f8-8e02-4568-8fe8-960411bfd2f3","type":"testimony","location":"00:02:37.0-00:02:47.7","speaker":"Elizondo, Luis","text":"The Advanced Aerospace Threat Identification Program (AATIP) was composed of a loose-knit mix of scientists, electro-optical engineers, avionics experts, and intelligence experts, often working part-time.","quote":"Elizondo tells us AATIP was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time."},{"id":"118c5a50-b9b7-4270-9ab6-afc09c7c3085","type":"administrative","location":"00:02:47.7-00:03:07.3","speaker":null,"text":"The Advanced Aerospace Threat Identification Program (AATIP) analysed declassified United States Navy gun camera videos, including footage of a fast-moving UAP off the US Atlantic coast recorded in 2015.","quote":"They combed through data and records and analyzed videos like this. A Navy aircrew struggles to lock onto a fast-moving object off
