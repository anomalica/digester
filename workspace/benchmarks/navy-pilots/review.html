the U.S. Atlantic coast in 2015."},{"id":"73e405c2-c8c0-4f61-86b7-8e770776a4e8","type":"administrative","location":"00:03:07.3-00:03:20.4","speaker":null,"text":"The United States Department of Defense (DoD) admitted it cannot identify the objects shown in recently released UAP gun camera videos.","quote":"the Pentagon admits it doesn't know what in the world this is, or this, or this."},{"id":"c4bfe80b-1c54-4e36-b956-f8ae5d70323b","type":"opinion","location":"00:03:30.4-00:03:44.3","speaker":"Elizondo, Luis","text":"Luis Elizondo acknowledges that in some cases there are simple explanations for UAP sightings, such as refracted light, weather balloons, rockets, or Venus, but that some sightings remain unexplained after due diligence.","quote":"In some cases, there are simple explanations for what people are witnessing, but there are some that that are not. We're not just simply jumping to a conclusion that's saying, oh, that's a UAP out there. We're going through our due diligence."},{"id":"cb6956bf-5f9e-4662-9c4f-7c14206672a4","type":"opinion","location":"00:03:44.3-00:03:52.6","speaker":"Elizondo, Luis","text":"Luis Elizondo considers it possible that some observed UAP could be a new type of cruise missile technology developed by China.","quote":"Is it some sort of new type of cruise missile technology that China has developed?"},{"id":"bee792f9-c2c0-4d9e-9b24-97b0e2c07bc1","type":"opinion","location":"00:03:48.2-00:03:52.6","speaker":"Elizondo, Luis","text":"Luis Elizondo considers it possible that some observed UAP could be a high-altitude balloon conducting reconnaissance.","quote":"Is it some sort of high-altitude balloon that's conducting reconnaissance?"},{"id":"74d0fcbd-4f1a-448e-8311-f27a52021ec9","type":"administrative","location":"00:04:06.2-00:04:12.9","speaker":null,"text":"Ryan Graves holds the rank of Lieutenant and is a former United States Navy pilot.","quote":"Former Navy pilot Lieutenant Ryan Graves calls whatever is out there a security risk."},{"id":"58291ff9-e005-4dd0-94a8-e18278dcfeb0","type":"opinion","location":"00:04:06.2-00:04:12.9","speaker":"Graves, Ryan","text":"Ryan Graves considers UAP observed in restricted airspace a security risk.","quote":"Former Navy pilot Lieutenant Ryan Graves calls whatever is out there a security risk."},{"id":"9848d40d-23e1-4466-a5bf-641c7ea0360b","type":"testimony","location":"00:04:12.9-00:04:29.7","speaker":"Graves, Ryan","text":"Ryan Graves' F/A-18 squadron began seeing UAP hovering over restricted airspace south-east of Virginia Beach in 2014, after the squadron updated their jets' radar systems.","quote":"He told us his F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar, making it possible to zero in with infrared targeting cameras."},{"id":"1c56a6d8-9adb-4581-883e-8c7fe9ca3aaf","type":"testimony","location":"00:04:12.9-00:04:29.7","speaker":"Graves, Ryan","text":"The updated radar on Ryan Graves' F/A-18 jets made it possible to lock onto UAP with infrared targeting cameras, allowing simultaneous radar and infrared detection.","quote":"when they updated their jet's radar, making it possible to zero in with infrared targeting cameras."},{"id":"bbfd351d-7c98-4a44-b925-6c24b88d15b2","type":"opinion","location":"00:04:29.7-00:04:37.1","speaker":"Graves, Ryan","text":"Ryan Graves considered the simultaneous radar and infrared detection of UAP difficult to spoof.","quote":"Bill Whitaker: So you're seeing it both with the radar and with the infrared, and that tells you that there is something out there. Ryan Graves: Pretty hard to spoof that."},{"id":"286355e3-4640-49c5-85b7-a29d6097968a","type":"administrative","location":"00:04:38.6-00:04:48.2","speaker":null,"text":"Photographs of UAP in restricted airspace south-east of Virginia Beach were taken in 2019, and the United States Pentagon confirmed these are images of objects it cannot identify.","quote":"These photographs were taken in 2019 in the same area. The Pentagon confirms these are images of objects it can't identify."},{"id":"8fcb9a8e-c373-4899-8b35-e3c7f4035b3c","type":"testimony","location":"00:04:48.2-00:04:56.6","speaker":"Graves, Ryan","text":"Ryan Graves reported that United States Navy pilots training off the Atlantic coast saw UAP every day for at least a couple of years.","quote":"Lieutenant Graves told us pilots training off the Atlantic coast see things like that all the time. Ryan Graves: Every day. Every day for at least a couple of years."},{"id":"2870e195-00e9-42dc-b959-a3abdd795975","type":"observation","location":"00:05:02.5-00:05:04.3","speaker":"Graves, Ryan","text":"Ryan Graves observed no exhaust plume on the UAP seen off the Atlantic coast.","quote":"You know, I don't see an exhaust plume."},{"id":"fb318b1b-ae35-4a47-a45f-6260a36661ed","type":"observation","location":"00:05:04.3-00:05:12.8","speaker":null,"text":"A UAP off the coast of Jacksonville, Florida was captured in 2015 on a targeting camera by members of Ryan Graves' squadron.","quote":"including this one, off the coast of Jacksonville, Florida in 2015, captured on a targeting camera by members of Graves' squadron."},{"id":"558f771a-3d89-4de1-86d3-2acc69aa3099","type":"observation","location":"00:05:12.8-00:05:23.8","speaker":null,"text":"During the 2015 UAP targeting camera footage off Jacksonville, Florida, the UAP was observed rotating, moving against a wind of approximately 220 kilometres per hour from the west, and appearing to have propulsion.","quote":"It's rotating. The wind's 120 knots far west. Look at that thing, dude."},{"id":"7abc09ef-cbc7-4d6b-a740-45c424404300","type":"observation","location":"00:05:35.8-00:05:42.8","speaker":"Graves, Ryan","text":"Ryan Graves observed the UAP in the 2015 Atlantic coast footage to exhibit rotation, operation at high altitudes, and apparent propulsion, and was unable to explain what it was.","quote":"You have rotation, you have high altitudes, you have propulsion, right? I don't know. I don't know what it is, frankly."},{"id":"14445f17-29cd-499a-8e15-64cbfcc19089","type":"opinion","location":"00:05:44.9-00:05:56.0","speaker":"Graves, Ryan","text":"United States Navy pilots speculated that observed UAP are one of three things: secret US technology, an adversary spy vehicle, or something otherworldly.","quote":"He told us pilots speculate they are one of three things, secret U.S. technology, an adversary spy vehicle, or something otherworldly."},{"id":"08fb516c-80e3-4e6a-be06-1b455454d098","type":"opinion","location":"00:05:56.0-00:06:00.5","speaker":"Graves, Ryan","text":"Ryan Graves considers the highest probability explanation for the observed UAP to be a threat observation programme.","quote":"I'd say, you know, the highest probability is it's a threat observation program."},{"id":"dfe3114d-c8ce-4611-ae0b-0e0d50ee930e","type":"opinion","location":"00:06:00.5-00:06:04.1","speaker":"Graves, Ryan","text":"Ryan Graves considers Russian or Chinese technology a possible explanation for the observed UAP.","quote":"Bill Whitaker: Could it be Russian or Chinese technology? Ryan Graves: I don't see why not."},{"id":"fd9c9019-3204-4527-868e-8b24cf03e190","type":"opinion","location":"00:06:07.0-00:06:18.5","speaker":"Graves, Ryan","text":"Ryan Graves is worried about the UAP observed in US airspace, believing that if these were tactical aircraft from another country it would be considered a massive security issue, but the unusual appearance of the UAP leads people to ignore the problem.","quote":"I am worried, frankly. You know, if these were tactical jets from another country that were hanging out up there, it would be a massive issue. But because it looks slightly different, we're not willing to actually look at the problem in the face. We're happy to just ignore the fact that these are out there watching us every day."},{"id":"91524b18-b24b-4695-95cd-df2317efb0ea","type":"administrative","location":"00:06:23.4-00:06:30.3","speaker":null,"text":"The US government had publicly ignored the UAP issue since closing Project Blue Book in 1969.","quote":"The government has ignored it, at least publicly, since closing its Project Blue Book investigation in 1969."},{"id":"89be0631-3c78-4112-a0fc-4378ed74de02","type":"administrative","location":"00:06:30.3-00:06:40.8","speaker":null,"text":"The 2004 USS Nimitz UAP Encounter off Southern California was documented by radar, by camera, and four naval aviators.","quote":"But that began to change after an incident off Southern California in 2004, which was documented by radar, by camera, and four naval aviators."},{"id":"eb56ecd2-2f94-4d6c-84f0-15b304aef6d7","type":"administrative","location":"00:06:40.8-00:06:57.3","speaker":null,"text":"David Fravor is a graduate of the Top Gun Naval Flight School.","quote":"David Fravor, a graduate of the Top Gun Naval Flight School"},{"id":"feedb46e-40c2-4a63-a9ee-2b8163967e76","type":"administrative","location":"00:06:40.8-00:06:57.3","speaker":null,"text":"During the 2004 USS Nimitz UAP Encounter, David Fravor was the commander of the F/A-18 squadron on the USS Nimitz.","quote":"David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz"},{"id":"e7da3a77-cf34-468d-aa5f-2af322aa867d","type":"administrative","location":"00:06:40.8-00:06:57.3","speaker":null,"text":"Alex Dietrich was flying on David Fravor's wing during the 2004 USS Nimitz UAP Encounter.","quote":"and flying at his wing, Lieutenant Alex Dietrich"},{"id":"b72aaa1d-abf2-4e4e-9b9c-e19c20478654","type":"administrative","location":"00:06:40.8-00:06:57.3","speaker":null,"text":"Alex Dietrich had never spoken publicly about the 2004 USS Nimitz UAP Encounter prior to the 60 Minutes interview in 2021.","quote":"Lieutenant Alex Dietrich, who has never spoken publicly about the encounter."},{"id":"11e738f4-8dab-4a58-9796-c03bf53dfe5a","type":"testimony","location":"00:07:02.7-00:07:14.4","speaker":"Dietrich, Alex","text":"Alex Dietrich agreed to speak publicly about the 2004 USS Nimitz UAP Encounter because she was in a government aircraft, was on duty, felt a responsibility to share what she could, and the information is unclassified.","quote":"Because I was in a government aircraft, because I was on the clock, and so I feel a responsibility to share what I can, and it is unclassified."},{"id":"ff3eed41-a0cc-4204-96bc-868f9e1843c7","type":"administrative","location":"00:07:14.4-00:07:23.1","speaker":null,"text":"In November 2004, the USS Nimitz Carrier Strike Group was training approximately 160 kilometres south-west of San Diego.","quote":"It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego."},{"id":"5c5444d9-7709-4eb4-b424-1f9d5c04062f","type":"observation","location":"00:07:23.1-00:07:39.3","speaker":null,"text":"For a week before 2004-11-14, the advanced radar on the USS Princeton detected multiple anomalous aerial vehicles (AAV) over the horizon descending approximately 24,000 metres in less than a second.","quote":"For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 80,000 feet in less than a second."},{"id":"e19fef35-c282-4121-b304-47b49cb906ba","type":"observation","location":"00:07:39.3-00:07:47.8","speaker":null,"text":"On 2004-11-14, David Fravor and Alex Dietrich, each with a weapons system officer in the back seat, were diverted from their training mission to investigate UAP contacts.","quote":"On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate."},{"id":"62c39556-481b-4aca-a914-4f98a6ac21d5","type":"observation","location":"00:07:47.8-00:07:55.9","speaker":null,"text":"During the 2004 USS Nimitz UAP Encounter, David Fravor and Alex Dietrich found an area of churning white water approximately the size of a Boeing 737 in an otherwise calm sea.","quote":"They found an area of roiling white water the size of a 737 in an otherwise calm blue sea."},{"id":"362fa7ec-c034-4d18-8938-445a17a3e8f2","type":"observation","location":"00:08:06.3-00:08:12.3","speaker":"Fravor, David","text":"During the 2004 USS Nimitz UAP Encounter, David Fravor observed a small white object resembling a Tic Tac shape moving above the area of white water.","quote":"And we saw this little white tic-tac-looking object. And it's just kind of moving above the whitewater area."},{"id":"a363e36a-756d-4209-bd49-5e625d026728","type":"observation","location":"00:08:18.5-00:08:24.5","speaker":"Fravor, David","text":"During the 2004 USS Nimitz UAP Encounter, the anomalous aerial vehicle (AAV) abruptly turned and began mirroring David Fravor's aircraft as he spiralled down towards it, ascending as he descended.","quote":"The tic-tac's still pointing north-south. It goes and just turns abruptly and starts mirroring me. So as I'm coming down, it starts coming up."},{"id":"9d9170bd-3db8-4b94-9722-03be129700fa","type":"opinion","location":"00:08:27.0-00:08:30.5","speaker":"Fravor, David","text":"David Fravor concluded that the anomalous aerial vehicle (AAV) observed during the 2004 USS Nimitz UAP Encounter was aware of the presence of the aircraft.","quote":"Bill Whitaker: So it's mimicking your moves. David Fravor: Yeah, it was aware we were there."},{"id":"f5675788-e8c6-41d3-a396-f5997fb244b1","type":"observation","location":"00:08:30.5-00:08:37.0","speaker":"Fravor, David","text":"The anomalous aerial vehicle (AAV) observed during the 2004 USS Nimitz UAP Encounter was approximately the size of an F/A-18.","quote":"He said it was about the size of his F-18"},{"id":"4e0769eb-67bc-42fc-ba93-6a28289de3d7","type":"observation","location":"00:08:30.5-00:08:37.0","speaker":"Fravor, David","text":"The anomalous aerial vehicle (AAV) observed during the 2004 USS Nimitz UAP Encounter had no markings.","quote":"with no markings"},{"id":"c077e62e-a501-4be0-b47a-243847970eee","type":"observation","location":"00:08:30.5-00:08:37.0","speaker":"Fravor, David","text":"The anomalous aerial vehicle (AAV) observed during the 2004 USS Nimitz UAP Encounter had no wings.","quote":"no wings"},{"id":"76593e24-5e16-411b-ae5f-0d004c62ff67","type":"observation","location":"00:08:30.5-00:08:37.0","speaker":"Fravor, David","text":"The anomalous aerial vehicle (AAV) observed during the 2004 USS Nimitz UAP Encounter had no exhaust plumes.","quote":"no exhaust plumes"},{"id":"db7bef0f-48fe-4251-8967-7d5bcd530da1","type":"observation","location":"00:08:37.0-00:08:47.8","speaker":"Fravor, David","text":"During the 2004 USS Nimitz UAP Encounter, as David Fravor closed in on the anomalous aerial vehicle (AAV), it disappeared instantaneously from directly in front of him.","quote":"I want to see how close I can get. So I go like this, and it's climbing still. And when it gets right in front of me, it just disappears."},{"id":"0c485ce4-b8e7-4e9a-98ac-7456e35f6ca7","type":"observation","location":"00:08:50.9-00:09:00.9","speaker":"Dietrich, Alex","text":"Alex Dietrich initially tried to categorise the anomalous aerial vehicle (AAV) observed during the 2004 USS Nimitz UAP Encounter as a helicopter or a drone, but was unable to explain its disappearance.","quote":"So your mind tries to make sense of it. I'm going to categorize this as maybe a helicopter or maybe a drone. And when it disappeared, I mean, it was just..."},{"id":"bc97f4e7-65b1-4aca-a423-773fd430531a","type":"observation","location":"00:09:03.5-00:09:08.9","speaker":"Fravor, David","text":"During the 2004 USS Nimitz UAP Encounter, all four aircrew in the two F/A-18s watched the anomalous aerial vehicle (AAV) for approximately five minutes.","quote":"There was four of us in the airplanes literally watching this thing for roughly about five minutes."},{"id":"b967e4ee-8424-4013-a6d2-8b410dc3a98d","type":"observation","location":"00:09:08.9-00:09:14.4","speaker":null,"text":"After the anomalous aerial vehicle (AAV) disappeared during the 2004 USS Nimitz UAP Encounter, the USS Princeton reacquired the target approximately 97 kilometres away within seconds.","quote":"Seconds later, the Princeton reacquired the target, 60 miles away."},{"id":"3bb6a51d-c31e-4a9b-926b-99af5e0449aa","type":"observation","location":"00:09:14.4-00:09:20.8","speaker":null,"text":"After the 2004 USS Nimitz UAP Encounter, another aircrew briefly locked onto the anomalous aerial vehicle (AAV) with a targeting camera before it departed again.","quote":"Another crew managed to briefly lock onto it with a targeting camera before it zipped off again."},{"id":"7f6049dc-265c-478f-9bcc-425020f017d7","type":"opinion","location":"00:09:20.8-00:09:31.1","speaker":"Dietrich, Alex","text":"Alex Dietrich reflected that if she had seen the anomalous aerial vehicle (AAV) during the 2004 USS Nimitz UAP Encounter alone, without her colleagues, she might not have reported it because it sounds so incredible.","quote":"I think that over beers, we've sort of said, hey, man, if I saw this solo, I don't know that I would have come back and said anything because it sounds so crazy when I say it."},{"id":"ec3a7865-0e5b-4fd8-90c8-b71940dac663","type":"opinion","location":"00:09:37.4-00:09:39.8","speaker":"Fravor, David","text":"David Fravor does not consider himself a UFO enthusiast.","quote":"I'll be honest. I'm not a UFO guy."},{"id":"00a667ae-b09c-41f7-8e48-ce31ddacb57c","type":"opinion","location":"00:09:45.5-00:09:56.5","speaker":"Fravor, David","text":"David Fravor believes that whatever was encountered during the 2004 USS Nimitz UAP Encounter was better than the F/A-18 in terms of technology, though he does not know who built it.","quote":"There's definitely something that, I don't know who's building it, who's got the technology, who's got the brains, but there's something out there that was better than our airplane."},{"id":"70b50d90-5382-4c80-92d6-e9dac8d80a13","type":"administrative","location":"00:09:56.5-00:10:13.2","speaker":null,"text":"After the 2004 USS Nimitz UAP Encounter, the air crew filed reports, but no official action was taken for five years.","quote":"The air crew filed reports. Then, like the mysterious flying object, the Nimitz encounter disappeared. Nothing was said or done officially for five years until Lou Elizondo came across the story and investigated."},{"id":"c9cfbde2-3392-4bda-b50d-2c1996b79ea3","type":"administrative","location":"00:10:04.2-00:10:13.2","speaker":null,"text":"Luis Elizondo investigated the 2004 USS Nimitz UAP Encounter approximately five years after it occurred.","quote":"Nothing was said or done officially for five years until Lou Elizondo came across the story and investigated."},{"id":"5e6b805e-5a01-45df-9d0d-191c28e7ca76","type":"opinion","location":"00:10:13.2-00:10:27.7","speaker":"Elizondo, Luis","text":"Luis Elizondo argued that the millions of dollars spent training Navy pilots, combined with the pilots' sightings supported by electro-optical gun camera footage and radar data, made the UAP evidence compelling.","quote":"We spend millions of dollars in training these pilots, and they are seeing something that they can't explain. Furthermore, that information's being backed up on electro-optical data, like gun camera footage, and by radar data. Now, to me, that's compelling."},{"id":"58a928fe-5e24-4546-83dc-803f71784367","type":"administrative","location":"00:10:27.7-00:10:39.5","speaker":null,"text":"The Advanced Aerospace Threat Identification Program (AATIP) had its funding eliminated in 2012.","quote":"AATIP's funding was eliminated in 2012"},{"id":"08bd7501-5873-4e1d-a034-66a259ac5b17","type":"testimony","location":"00:10:31.7-00:10:39.5","speaker":"Elizondo, Luis","text":"Despite the elimination of the Advanced Aerospace Threat Identification Program (AATIP)'s funding in 2012, Luis Elizondo and a small group of others kept the mission alive until he quit the Pentagon in 2017.","quote":"but Elizondo says he and a handful of others kept the mission alive. until finally, frustrated, he quit the Pentagon in 2017"},{"id":"aca276e1-47d4-4a80-8390-5837d58975a9","type":"administrative","location":"00:10:39.5-00:10:48.8","speaker":null,"text":"Before leaving the Pentagon in 2017, Luis Elizondo was responsible for getting three UAP Navy gun camera videos declassified.","quote":"he quit the Pentagon in 2017, but not before getting these three videos declassified."},{"id":"0e18f7c0-0929-454c-9527-d005e69c2ced","type":"administrative","location":"00:10:57.5-00:11:08.4","speaker":null,"text":"Christopher Mellon served as Deputy Assistant Secretary of Defence for Intelligence under Presidents Clinton and George W. Bush.","quote":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush"},{"id":"520a58e4-f3cb-4f15-afff-f94d49529bde","type":"administrative","location":"00:10:57.5-00:11:08.4","speaker":null,"text":"Christopher Mellon had access to top-secret government programmes during his time as Deputy Assistant Secretary of Defence for Intelligence.","quote":"and had access to top-secret government programs."},{"id":"7af24418-f04a-4def-af1e-bdc163b7fa96","type":"testimony","location":"00:10:51.9-00:10:57.5","speaker":"Mellon, Christopher","text":"Christopher Mellon attempted to help Luis Elizondo elevate the UAP issue within the Department of Defence and get it to the Secretary of Defence.","quote":"I tried to help my colleague, Lou Elizondo, elevate the issue in the department and actually get it to the Secretary of Defense."},{"id":"dab547e0-ee49-427e-a213-6fdade5dea19","type":"opinion","location":"00:11:08.4-00:11:18.7","speaker":"Mellon, Christopher","text":"Christopher Mellon stated with a high degree of confidence that the observed UAP are not US technology, based in part on the positions he held in the Department of Defence and his knowledge of its processes.","quote":"So it's not us, that's one thing we know. I could say that with a very high degree of confidence, in part because of the positions I held in the department, and I know the process."},{"id":"08627e12-53de-4aa2-828e-16e1904971c5","type":"opinion","location":"00:11:37.0-00:11:46.1","speaker":"Mellon, Christopher","text":"Christopher Mellon considers it bizarre and unfortunate that, as a private citizen, he had to leak UAP information to get a national security issue onto the official agenda.","quote":"It's bizarre and unfortunate that someone like myself has to do something like that to get a national security issue like this on the agenda."},{"id":"fe4a2022-e22a-45e3-9b9b-731f4cdab887","type":"opinion","location":"00:11:57.6-00:12:07.2","speaker":"Mellon, Christopher","text":"Christopher Mellon's strategy was to engage the public in UAP issues in order to generate Congressional interest, which would then pressure the Department of Defence to take the matter seriously.","quote":"We knew and understood that you had to go to the public, get the public interested to get Congress interested, to then circle back to the Defense Department and get them to start taking a look at it."},{"id":"1ffdde7d-71e7-4e80-a8ef-500ec8b089d1","type":"administrative","location":"00:12:09.1-00:12:15.6","speaker":null,"text":"In August 2020, the United States Pentagon resurrected the Advanced Aerospace Threat Identification Program (AATIP) under the new name of the Unidentified Aerial Phenomena Task Force (UAP Task Force).","quote":"This past August, the Pentagon resurrected AATIP. It's now called the UAP Task Force."},{"id":"eb10c29b-9286-43ac-891c-a5b781b20afc","type":"administrative","location":"00:12:15.6-00:12:20.1","speaker":null,"text":"Following the establishment of the Unidentified Aerial Phenomena Task Force (UAP Task Force), US service members are now encouraged to report strange UAP encounters.","quote":"Service members now are encouraged to report strange encounters."},{"id":"413412a0-1bd5-4b12-9d19-1b6070f999f0","type":"opinion","location":"00:12:22.6-00:12:26.5","speaker":"Rubio, Marco","text":"Marco Rubio considers any object entering airspace where it is not supposed to be a threat.","quote":"Anything that enters an airspace that's not supposed to be there is a threat."},{"id":"06e093ed-434d-40c6-8fa0-3f799bbf4976","type":"administrative","location":"00:12:26.5-00:12:34.0","speaker":null,"text":"After receiving classified briefings on UAP, Senator Marco Rubio called for a detailed analysis of the UAP issue.","quote":"After receiving classified briefings on UAPs, Senator Marco Rubio called for a detailed analysis."},{"id":"8e2edae3-4920-4d40-9be4-dd4ec61cb7ff","type":"administrative","location":"00:12:34.0-00:12:46.3","speaker":null,"text":"In December 2020, while Marco Rubio was still head of the US Senate Select Committee on Intelligence, he asked the Director of National Intelligence and the Pentagon to present the United States Congress with an unclassified UAP report by June 2021.","quote":"This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month."},{"id":"a225de30-fe04-4328-815a-a2ffbbc29a91","type":"opinion","location":"00:12:59.0-00:13:12.2","speaker":"Rubio, Marco","text":"Marco Rubio believes that a stigma exists on Capitol Hill regarding UAP, with some Congressional colleagues giggling when the topic is raised, but that this stigma should not prevent finding answers.","quote":"You know, there's a stigma on Capitol Hill. I mean, some of my colleagues are very interested in this topic and some kind of, you know, giggle when you bring it up. But I don't think we can allow the stigma to keep us from having an answer to a very fundamental question."},{"id":"7a4b6ad3-8514-4fea-9386-a77b6ebbcd70","type":"opinion","location":"00:13:14.1-00:13:25.9","speaker":"Rubio, Marco","text":"Marco Rubio wants UAP reports to be taken seriously, with a permanent process to catalogue and continuously analyse incoming data until answers are found.","quote":"I want us to take it seriously and have a process to take it seriously. I want us to have a process to analyze the data. every time it comes in, that there be a place where this is cataloged and constantly analyzed until we get some answers."},{"id":"1e740687-d50c-4ac7-beb7-f20be265083b","type":"observation","location":"00:13:37.3-00:13:41.7","speaker":"Dietrich, Alex","text":"Alex Dietrich felt vulnerable about having nothing to defend herself during the 2004 USS Nimitz UAP Encounter.","quote":"I felt the vulnerability of not having anything to defend ourselves."},{"id":"7a4f6f40-35f8-40f2-865b-fbc802b9cc6f","type":"administrative","location":"00:00:09.1-00:00:44.4","speaker":null,"text":"The US Senate Select Committee on Intelligence ordered the Office of the Director of National Intelligence (ODNI) and the Secretary of Defence to deliver a report on UAP sightings.","quote":"the intelligence committee has ordered the director of national intelligence and the secretary of defense to deliver a report on the mysterious sightings by next month"}],"nodes":[{"id":"cb7a2828-ea72-4596-8be0-26e7b4fe255d","type":"topic","name":"Unidentified Aerial Phenomena (UAP)"},{"id":"8968fbf2-23cc-461f-879b-0db15620d846","type":"topic","name":"Unidentified Flying Object (UFO)"},{"id":"83614686-97cc-4a59-9504-51932fc7c50d","type":"topic","name":"anomalous aerial vehicle (AAV)"},{"id":"744e7f3e-ae24-4551-b68d-6ae04f006628","type":"person","name":"Whitaker, Bill"},{"id":"21f18043-4b2c-497f-b023-565b7d8f04fb","type":"person","name":"Elizondo, Luis"},{"id":"98e32feb-56f4-4422-bacd-b88dcb395ff6","type":"person","name":"Graves, Ryan"},{"id":"00da255f-6adb-43f1-8c97-d36cd558430b","type":"person","name":"Fravor, David"},{"id":"08c1c20a-ebac-448c-9566-c04ea6d4b886","type":"person","name":"Dietrich, Alex"},{"id":"4608e9b6-ab55-41eb-ba25-9f82be676e85","type":"person","name":"Mellon, Christopher"},{"id":"dc1358a8-5544-4277-8b4a-aa1ea08cba8b","type":"person","name":"Rubio, Marco"},{"id":"82f958c5-520a-48af-955c-575ad27f65bb","type":"person","name":"Reid, Harry"},{"id":"6d206a54-31da-4016-9f0f-81c98d37b317","type":"project","name":"Advanced Aerospace Threat Identification Program (AATIP)"},{"id":"ff411e36-dc56-4e47-a7a4-0dc61fe03c11","type":"project","name":"Unidentified Aerial Phenomena Task Force (UAP Task Force)"},{"id":"22e66762-49f4-4077-83a9-c392ffbde17d","type":"project","name":"Project Blue Book"},{"id":"20be9613-f261-48e7-a811-f4ae77dd7d70","type":"organisation","name":"United States Navy"},{"id":"7ac990d4-b6de-4c33-bd76-8a8b91032e69","type":"organisation","name":"United States Department of Defense (DoD)"},{"id":"65963e5e-dba7-4256-9663-dc0f2de48fff","type":"organisation","name":"United States Senate"},{"id":"7deff83f-e504-4429-8660-a85729032bfb","type":"organisation","name":"US Senate Select Committee on Intelligence"},{"id":"ac6a4c41-f6c0-4a3b-8390-470a28ace96a","type":"organisation","name":"Office of the Director of National Intelligence (ODNI)"},{"id":"a024c90d-fc6a-40aa-812d-bd003a754f62","type":"organisation","name":"United States Pentagon"},{"id":"ac283922-4c84-4840-9c20-5700f1569520","type":"organisation","name":"Top Gun Naval Flight School"},{"id":"9e1dc0a8-e8c1-41b2-aad7-0408fe54fd59","type":"organisation","name":"60 Minutes"},{"id":"fdbef171-80a5-4fa7-9fd9-9b8d0ad6e4d4","type":"organisation","name":"The New York Times"},{"id":"b3453ff4-f01e-418c-a5df-54030cf50db0","type":"organisation","name":"History Channel"},{"id":"fa7dafcf-284c-43a4-8c9e-a1f797d2d4ab","type":"organisation","name":"United States Congress"},{"id":"b4f0f2f1-7ca7-404c-a30a-38c37951e0c9","type":"object","name":"USS Nimitz"},{"id":"45477163-5615-4869-be26-da167e903ce1","type":"object","name":"USS Princeton"},{"id":"028ff90f-5fce-4d59-aae6-b9d568c2a2cb","type":"object","name":"F/A-18"},{"id":"3e57df7d-7e3e-450e-a23e-96a8741e0371","type":"event","name":"2004 USS Nimitz UAP Encounter"},{"id":"9bb50433-67d3-4b8a-9143-dccb8b847a30","type":"event","name":"2015 Atlantic Coast UAP Sightings"},{"id":"32d371d2-88c1-4a2e-8333-2735ccd8bfcc","type":"event","name":"2019 Atlantic Coast UAP Photographs"},{"id":"1ef04ae6-6752-470d-ac58-a1cff15ff262","type":"document","name":"Navy pilots describe encounters with UFOs (60 Minutes, 2021-05-17)"},{"id":"031d597f-06f6-4c3b-be53-15e7306d4533","type":"document","name":"UAP Navy Gun Camera Videos (declassified)"},{"id":"e6fffa0a-3e55-47d9-a204-fd4a758989d6","type":"document","name":"ODNI-DoD UAP Report to Congress 2021"},{"id":"3c427f22-b591-4191-bad9-07929785f976","type":"place","name":"USA, California, San Diego"},{"id":"fdaabb5b-ce96-4eb4-b536-7b9e6d44d323","type":"place","name":"USA, Virginia, Virginia Beach"},{"id":"05b73098-c670-4cda-b3bb-38a3db09e20b","type":"place","name":"USA, Florida, Jacksonville"},{"id":"bdf0c4f0-55f1-403d-90f2-bc65a4380027","type":"place","name":"USA, Washington DC, Pentagon"},{"id":"831fb127-be4d-43fb-9b2e-f4a223dba2e0","type":"place","name":"USA, Cuba, Guantanamo"}]},{"id":"deepseek_deepseek-v3.2","name":"deepseek / deepseek-v3.2","errata":null,"claims":[{"id":"d3d03d2a-26c3-4f0c-9c94-e67dbd994ca0","type":"biographical","location":"00:01:02.4-00:01:11.5","speaker":"Whitaker, Bill","text":"Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Cuba, Guantanamo Bay.","quote":"Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo."},{"id":"4e5fe7b4-5bac-44c3-bdc4-a0078e0e8300","type":"biographical","location":"00:01:11.5-00:01:24.1","speaker":"Whitaker, Bill","text":"Luis Elizondo was asked to join the Advanced Aerospace Threat Identification Program (AATIP) at the Pentagon in 2008.","quote":"He hadn't given UFOs a second thought until 2008. That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP."},{"id":"ff0a5ae4-a4c1-4fd8-9e1e-e0dfea826240","type":"administrative","location":"00:01:24.1-00:01:35.9","speaker":"Elizondo, Luis","text":"The mission of the Advanced Aerospace Threat Identification Program (AATIP) was to collect and analyse information involving anomalous aerial vehicles (AAV).","quote":"The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs. We call them UAPs."},{"id":"3f793cfd-14a0-4f17-aeaa-51c8fab815ac","type":"administrative","location":"00:01:50.3-00:02:01.6","speaker":"Whitaker, Bill","text":"The Advanced Aerospace Threat Identification Program (AATIP) was part of a $22 million programme sponsored by then Senate Majority Leader Harry Reid to investigate UFOs.","quote":"Buried away in the Pentagon, AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs."},{"id":"7e8c69b8-f7ae-440b-86a5-b94c21d9f596","type":"administrative","location":"00:02:01.6-00:02:10.8","speaker":"Whitaker, Bill","text":"When Luis Elizondo took over the Advanced Aerospace Threat Identification Program (AATIP) in 2010, he focused on the national security implications of Unidentified Aerial Phenomena (UAP) documented by U.S. service members.","quote":"When Elizondo took over in 2010, he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members."},{"id":"2ee2b78e-541b-40d2-a0cb-9e8c449d5a48","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Some Unidentified Aerial Phenomena (UAP) are observed to be capable of 600 to 700 G-forces.","quote":"Imagine a technology that can do 600 to 700 G-forces"},{"id":"604f868e-78f4-4b48-90b4-a50c8ae52d9a","type":"measurement","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Some Unidentified Aerial Phenomena (UAP) are observed to fly at approximately 21,000 kilometres per hour.","quote":"that can fly at 13,000 miles an hour"},{"id":"35521a24-fd20-43b0-976a-a62005a51a3b","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Some Unidentified Aerial Phenomena (UAP) are observed to evade radar.","quote":"that can evade radar"},{"id":"00e7968e-f5cf-49e2-9910-ed2ed661fcd8","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Some Unidentified Aerial Phenomena (UAP) are observed to fly through air and water and possibly space.","quote":"and that can fly through air and water and possibly space"},{"id":"e2d14e2e-6517-460d-a0f7-833a33a61ee7","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Some Unidentified Aerial Phenomena (UAP) exhibit no obvious signs of propulsion, no wings, and no control surfaces.","quote":"and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces"},{"id":"9aa8f934-e571-4fa1-a13f-1b45cfe57ac6","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Elizondo, Luis","text":"Some Unidentified Aerial Phenomena (UAP) appear to defy the natural effects of Earth's gravity.","quote":"and yet still can defy the natural effects of Earth's gravity."},{"id":"89ecb9f0-951f-4830-845b-197531b41aed","type":"administrative","location":"00:02:37.0-00:02:47.7","speaker":"Whitaker, Bill","text":"The Advanced Aerospace Threat Identification Program (AATIP) was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time.","quote":"Elizondo tells us AATIP was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time."},{"id":"af330fc3-0b99-4096-8a4c-a483a53d376f","type":"observation","location":"00:02:57.7-00:03:02.1","speaker":"Whitaker, Bill","text":"A Navy aircrew struggled to lock onto a fast-moving object off the U.S. Atlantic coast in 2015.","quote":"A Navy aircrew struggles to lock onto a fast-moving object off the U.S. Atlantic coast in 2015."},{"id":"8e1937d8-3904-4120-8af2-0a7a863354d9","type":"opinion","location":"00:03:30.4-00:03:38.6","speaker":"Elizondo, Luis","text":"Luis Elizondo considers that while some witnessed phenomena have simple explanations, others do not.","quote":"In some cases, there are simple explanations for what people are witnessing, but there are some that that are not."},{"id":"17563d59-4233-4232-b184-5a91cb26f7a3","type":"opinion","location":"00:04:06.2-00:04:12.9","speaker":"Whitaker, Bill","text":"Former Navy pilot Lieutenant Ryan Graves calls Unidentified Aerial Phenomena (UAP) a security risk.","quote":"Former Navy pilot Lieutenant Ryan Graves calls whatever is out there a security risk."},{"id":"4811011c-91ce-4f86-8b82-2a71672d9238","type":"observation","location":"00:04:12.9-00:04:29.7","speaker":"Graves, Ryan","text":"Ryan Graves's F-18 squadron began seeing Unidentified Aerial Phenomena (UAP) hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar.","quote":"He told us his F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar, making it possible to zero in with infrared targeting cameras."},{"id":"5c7b242a-39fc-4df0-996f-238b9cd731fb","type":"opinion","location":"00:04:29.7-00:04:38.6","speaker":"Graves, Ryan","text":"The dual radar-and-infrared detection of Unidentified Aerial Phenomena (UAP) is hard to spoof.","quote":"Bill Whitaker: So you're seeing it both with the radar and with the infrared, and that tells you that there is something out there. Ryan Graves: Pretty hard to spoof that."},{"id":"91052b86-44ad-43de-9ec9-f7dfc8c7cd4a","type":"observation","location":"00:04:38.6-00:04:43.0","speaker":"Whitaker, Bill","text":"Photographs of unidentified objects were taken in the area southeast of Virginia Beach in 2019.","quote":"These photographs were taken in 2019 in the same area."},{"id":"a82ef77b-c580-41ae-b203-7dc346d77be6","type":"administrative","location":"00:04:43.0-00:04:48.2","speaker":"Whitaker, Bill","text":"The United States Department of Defense (DoD) confirms the 2019 images are of objects it cannot identify.","quote":"The Pentagon confirms these are images of objects it can't identify."},{"id":"1131a6a6-520b-41ed-98cb-cf2e9606be8b","type":"observation","location":"00:04:48.2-00:04:58.7","speaker":"Graves, Ryan","text":"Ryan Graves states that pilots training off the Atlantic coast see Unidentified Aerial Phenomena (UAP) every day.","quote":"Bill Whitaker: Lieutenant Graves told us pilots training off the Atlantic coast see things like that all the time. Ryan Graves: Every day. Every day for at least a couple of years."},{"id":"6d48e9a6-0c21-489f-a591-707807e86bda","type":"observation","location":"00:05:02.5-00:05:04.3","speaker":"Graves, Ryan","text":"Ryan Graves observes no exhaust plume on the Unidentified Aerial Phenomena (UAP).","quote":"You know, I don't see an exhaust plume."},{"id":"05131575-0e53-4a78-9fbd-3143af3c8c63","type":"observation","location":"00:05:04.3-00:05:12.8","speaker":"Whitaker, Bill","text":"A UAP off the coast of Jacksonville, Florida, was captured on a targeting camera by members of Ryan Graves's squadron in 2015.","quote":"including this one, off the coast of Jacksonville, Florida in 2015, captured on a targeting camera by members of Graves' squadron."},{"id":"27e390b8-457a-44f2-857f-3e4272ddf715","type":"opinion","location":"00:05:25.4-00:05:33.2","speaker":"Graves, Ryan","text":"Ryan Graves was amazed at what the pilots were seeing in the 2015 video.","quote":"Ryan Graves: You certainly can. They seem to have broke character a bit, and were just kind of amazed at what they were seeing."},{"id":"6bf9d268-c915-48fc-bd8b-037a291c9e91","type":"opinion","location":"00:05:33.2-00:05:44.9","speaker":"Graves, Ryan","text":"Ryan Graves finds a UAP with rotation, high altitudes, and propulsion difficult to explain.","quote":"Ryan Graves: This is a difficult one to explain. You have rotation, you have high altitudes, you have propulsion, right? I don't know. I don't know what it is, frankly."},{"id":"1b58a4a7-3327-4d15-b95e-b98ec279502a","type":"opinion","location":"00:05:44.9-00:05:56.0","speaker":"Whitaker, Bill","text":"Ryan Graves states that pilots speculate Unidentified Aerial Phenomena (UAP) are one of three things: secret U.S. technology, an adversary spy vehicle, or something otherworldly.","quote":"He told us pilots speculate they are one of three things, secret U.S. technology, an adversary spy vehicle, or something otherworldly."},{"id":"4f0b187b-53a8-42a9-9fc1-1cff428850e9","type":"opinion","location":"00:05:56.0-00:06:00.5","speaker":"Graves, Ryan","text":"Ryan Graves considers the highest probability for UAP is that it is a threat observation programme.","quote":"Ryan Graves: I'd say, you know, the highest probability is it's a threat observation program."},{"id":"484f3cd3-2713-4ddf-926c-6958163c5e17","type":"opinion","location":"00:06:00.5-00:06:05.4","speaker":"Graves, Ryan","text":"Ryan Graves considers Russian or Chinese technology a possible explanation for the observed Unidentified Aerial Phenomena (UAP).","quote":"Bill Whitaker: Could it be Russian or Chinese technology? Ryan Graves: I don't see why not."},{"id":"0250684f-79a8-435a-8f83-07d5d4445d7f","type":"opinion","location":"00:06:05.4-00:06:08.8","speaker":"Graves, Ryan","text":"Ryan Graves is worried about Unidentified Aerial Phenomena (UAP).","quote":"Ryan Graves: I am worried, frankly."},{"id":"f7e5a879-530b-4078-a703-e94b4a7d0caf","type":"administrative","location":"00:06:23.4-00:06:30.3","speaker":"Whitaker, Bill","text":"The United States government publicly ignored Unidentified Aerial Phenomena (UAP) investigations since closing its Project Blue Book investigation in 1969.","quote":"The government has ignored it, at least publicly, since closing its Project Blue Book investigation in 1969."},{"id":"57a77fc1-b09b-4308-b687-3cf354920760","type":"administrative","location":"00:06:30.3-00:06:40.8","speaker":"Whitaker, Bill","text":"A change in the government's approach to Unidentified Aerial Phenomena (UAP) began after an incident off Southern California in 2004, which was documented by radar, camera, and four naval aviators.","quote":"But that began to change after an incident off Southern California in 2004, which was documented by radar, by camera, and four naval aviators."},{"id":"d0a793cc-ed0c-454f-b047-01129ff53879","type":"biographical","location":"00:06:40.8-00:06:57.3","speaker":"Whitaker, Bill","text":"David Fravor was a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz during the 2004 USS Nimitz UAP encounter.","quote":"David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz"},{"id":"2798f4d9-77a9-4b47-81f8-74989d205fe1","type":"biographical","location":"00:06:40.8-00:06:57.3","speaker":"Whitaker, Bill","text":"Lieutenant Alex Dietrich was flying at David Fravor's wing during the 2004 USS Nimitz UAP encounter and had never spoken publicly about it before.","quote":"and flying at his wing, Lieutenant Alex Dietrich, who has never spoken publicly about the encounter."},{"id":"28998f31-d3fb-4160-96d4-5edb0e724eae","type":"testimony","location":"00:07:02.7-00:07:14.4","speaker":"Dietrich, Alex","text":"Alex Dietrich feels a responsibility to share the details of the 2004 USS Nimitz UAP encounter because she was in a government aircraft, on the clock, and the information is unclassified.","quote":"Alex Dietrich: Because I was in a government aircraft, because I was on the clock, and so I feel a responsibility to share what I can, and it is unclassified."},{"id":"c7e91316-f452-4c5f-9c39-520ec606f4c2","type":"administrative","location":"00:07:14.4-00:07:23.1","speaker":"Whitaker, Bill","text":"In November 2004, the USS Nimitz Carrier Strike Group was training about 160 kilometres southwest of San Diego.","quote":"It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego."},{"id":"b0ac0e06-7b51-49cb-973c-69d57dec7328","type":"observation","location":"00:07:23.1-00:07:39.3","speaker":"Whitaker, Bill","text":"For a week, the advanced new radar on the USS Princeton detected multiple anomalous aerial vehicles (AAV) over the horizon, descending approximately 24,000 metres in less than a second.","quote":"For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 80,000 feet in less than a second."},{"id":"7fecc5dd-1086-4ce3-81a5-4ba32a11520e","type":"administrative","location":"00:07:39.3-00:07:47.8","speaker":"Whitaker, Bill","text":"On 2004-11-14, David Fravor and Alex Dietrich, each with a weapons system officer, were diverted to investigate anomalous contacts.","quote":"On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate."},{"id":"dfea053f-705d-471e-9646-be0dac78e967","type":"observation","location":"00:07:47.8-00:07:55.9","speaker":"Whitaker, Bill","text":"David Fravor and Alex Dietrich found an area of roiling white water the size of a 737 in an otherwise calm blue sea.","quote":"They found an area of roiling white water the size of a 737 in an otherwise calm blue sea."},{"id":"cbe2126a-dc1b-4966-9c59-563f870a27eb","type":"observation","location":"00:08:06.3-00:08:12.3","speaker":"Fravor, David","text":"David Fravor observed a small white Tic Tac-shaped object moving above the whitewater area.","quote":"David Fravor: And we saw this little white tic-tac-looking object. And it's just kind of moving above the whitewater area."},{"id":"3ab0e326-737e-4bff-9136-c3d45386c191","type":"observation","location":"00:08:18.5-00:08:28.9","speaker":"Fravor, David","text":"David Fravor states the Tic Tac-shaped object turned abruptly and started mirroring his descent.","quote":"David Fravor: The tic-tac's still pointing north-south. It goes and just turns abruptly and starts mirroring me. So as I'm coming down, it starts coming up."},{"id":"fd2d4090-4fcb-4672-b8ca-f1c68d7e8281","type":"opinion","location":"00:08:28.9-00:08:30.5","speaker":"Fravor, David","text":"David Fravor believes the Tic Tac-shaped object was aware they were there.","quote":"David Fravor: Yeah, it was aware we were there."},{"id":"5b56e9cc-95d5-4916-b89c-2916954f9e97","type":"observation","location":"00:08:30.5-00:08:37.0","speaker":"Whitaker, Bill","text":"David Fravor described the Tic Tac-shaped object as about the size of his F-18, with no markings, no wings, and no exhaust plumes.","quote":"He said it was about the size of his F-18, with no markings, no wings, no exhaust plumes."},{"id":"47b4fd92-7e9d-43f0-a166-e6227976d77a","type":"observation","location":"00:08:37.0-00:08:44.8","speaker":"Fravor, David","text":"David Fravor observed the Tic Tac-shaped object disappear instantly in front of him.","quote":"David Fravor: I want to see how close I can get. So I go like this, and it's climbing still. And when it gets right in front of me, it just disappears."},{"id":"c9d22658-76b7-4d5d-a104-12c5e772cb82","type":"testimony","location":"00:08:50.9-00:08:58.3","speaker":"Dietrich, Alex","text":"Alex Dietrich tried to make sense of the object by initially categorising it as maybe a helicopter or a drone.","quote":"Alex Dietrich: So your mind tries to make sense of it. I'm going to categorize this as maybe a helicopter or maybe a drone."},{"id":"219c4de6-fdf5-4fdf-9199-bc8e2ad85e4c","type":"testimony","location":"00:09:03.3-00:09:08.9","speaker":"Fravor, David","text":"Four people in the two aeroplanes watched the Tic Tac-shaped object for roughly about five minutes.","quote":"David Fravor: Oh, yeah. There was four of us in the airplanes literally watching this thing for roughly about five minutes."},{"id":"03fa6845-7fb5-49a2-9f43-c8622654f99e","type":"observation","location":"00:09:08.9-00:09:14.4","speaker":"Whitaker, Bill","text":"Seconds after the object disappeared, the USS Princeton reacquired the target approximately 100 kilometres away.","quote":"Seconds later, the Princeton reacquired the target, 60 miles away."},{"id":"a7efcbab-c08c-46dc-82fe-684d72bbf160","type":"observation","location":"00:09:14.4-00:09:20.8","speaker":"Whitaker, Bill","text":"Another crew managed to briefly lock onto the Tic Tac-shaped object with a targeting camera before it zipped off again.","quote":"Another crew managed to briefly lock onto it with a targeting camera before it zipped off again."},{"id":"ae28e5c8-fd29-4b54-a81a-5ab3b2557399","type":"testimony","location":"00:09:20.8-00:09:31.1","speaker":"Dietrich, Alex","text":"Alex Dietrich and David Fravor have said that if they had seen the object solo, they might not have reported it because it sounds so crazy.","quote":"Alex Dietrich: You know, I think that over beers, we've sort of said, hey, man, if I saw this solo, I don't know that I would have come back and said anything because it sounds so crazy when I say it."},{"id":"45171a63-796e-49a4-b653-111e06b2bee9","type":"opinion","location":"00:09:45.5-00:09:56.5","speaker":"Fravor, David","text":"David Fravor says there is definitely something out there that was better than their aeroplane.","quote":"David Fravor: Yes. There's definitely something that, I don't know who's building it, who's got the technology, who's got the brains, but there's something out there that was better than our airplane."},{"id":"911c9c4e-03ff-433a-a981-ea178b097510","type":"administrative","location":"00:09:56.5-00:09:58.7","speaker":"Whitaker, Bill","text":"The air crew filed reports after the 2004 USS Nimitz UAP encounter.","quote":"The air crew filed reports."},{"id":"d372cb42-0528-4a88-a523-2e7021a80d25","type":"administrative","location":"00:09:58.7-00:10:13.2","speaker":"Whitaker, Bill","text":"Nothing was said or done officially about the 2004 USS Nimitz UAP encounter for five years until Luis Elizondo came across the story and investigated.","quote":"Nothing was said or done officially for five years until Lou Elizondo came across the story and investigated."},{"id":"c8919f8b-0306-42dc-9025-85c838c54657","type":"opinion","location":"00:10:13.2-00:10:27.7","speaker":"Elizondo, Luis","text":"Luis Elizondo finds it compelling that pilots are seeing something they cannot explain, with that information being backed up by electro-optical data and radar data.","quote":"Luis Elizondo: We spend millions of dollars in training these pilots, and they are seeing something that they can't explain. Furthermore, that information's being backed up on electro-optical data, like gun camera footage, and by radar data. Now, to me, that's compelling."},{"id":"75486463-6be8-47de-b423-e919eee014ce","type":"administrative","location":"00:10:27.7-00:10:31.7","speaker":"Whitaker, Bill","text":"Inside the Pentagon, Luis Elizondo's findings on Unidentified Aerial Phenomena (UAP) were met with scepticism.","quote":"Inside the Pentagon, his findings were met with skepticism."},{"id":"015aae92-9084-4d05-a201-e705dd2ace31","type":"administrative","location":"00:10:31.7-00:10:39.5","speaker":"Whitaker, Bill","text":"Funding for the Advanced Aerospace Threat Identification Program (AATIP) was eliminated in 2012.","quote":"AATIP's funding was eliminated in 2012"},{"id":"96e602a9-7c42-4f96-8941-0b2157bebe01","type":"administrative","location":"00:10:31.7-00:10:39.5","speaker":"Elizondo, Luis","text":"Luis Elizondo and a handful of others kept the AATIP mission alive after its funding was eliminated.","quote":"but Elizondo says he and a handful of others kept the mission alive."},{"id":"eb2778ee-cdff-4257-82eb-cb05b8e0ee39","type":"biographical","location":"00:10:39.5-00:10:48.8","speaker":"Whitaker, Bill","text":"Luis Elizondo quit the Pentagon in 2017, but not before getting three videos declassified.","quote":"until finally, frustrated, he quit the Pentagon in 2017, but not before getting these three videos declassified."},{"id":"5588f439-2cd2-4492-9dd1-f3ea10d3ee64","type":"biographical","location":"00:10:57.5-00:11:04.3","speaker":"Whitaker, Bill","text":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush.","quote":"Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush"},{"id":"cb1722bf-b709-4532-9ae5-cd86f560c38f","type":"opinion","location":"00:11:08.4-00:11:18.7","speaker":"Mellon, Christopher","text":"Christopher Mellon states with a very high degree of confidence that the observed UAP are not US technology, based on his former positions and knowledge of the process.","quote":"Christopher Mellon: So it's not us, that's one thing we know. ... I could say that with a very high degree of confidence, in part because of the positions I held in the department, and I know the process."},{"id":"6adbde09-aa1a-44b5-bf11-110e1cf935b4","type":"administrative","location":"00:11:26.2-00:11:37.0","speaker":"Whitaker, Bill","text":"In 2017, Christopher Mellon, as a private citizen, surreptitiously acquired three declassified Navy videos from Luis Elizondo and leaked them to The New York Times.","quote":"In 2017, as a private citizen, he surreptitiously acquired the three Navy videos Elizondo had declassified and leaked them to The New York Times."},{"id":"5959f95b-5cdf-48dd-a73b-7ba512d3965a","type":"opinion","location":"00:11:37.0-00:11:46.1","speaker":"Mellon, Christopher","text":"Christopher Mellon considers it bizarre and unfortunate that he had to leak the videos to get a national security issue like UAP on the agenda.","quote":"Christopher Mellon: It's bizarre and unfortunate that someone like myself has to do something like that to get a national security issue like this on the agenda."},{"id":"ec6f491d-4149-4773-9903-0fd15fc6be63","type":"administrative","location":"00:12:07.2-00:12:15.6","speaker":"Whitaker, Bill","text":"In August 2020, the Pentagon resurrected the Advanced Aerospace Threat Identification Program (AATIP) and renamed it the UAP Task Force.","quote":"This past August, the Pentagon resurrected AATIP. It's now called the UAP Task Force."},{"id":"68a48805-c328-45b6-b731-130a4e791438","type":"administrative","location":"00:12:15.6-00:12:20.1","speaker":"Whitaker, Bill","text":"Service members are now encouraged to report strange encounters with Unidentified Aerial Phenomena (UAP).","quote":"Service members now are encouraged to report strange encounters."},{"id":"3163bea8-6ff9-40b5-a29f-c8c874dd3ad6","type":"opinion","location":"00:12:22.6-00:12:26.5","speaker":"Rubio, Marco","text":"Senator Marco Rubio states that anything that enters an airspace that is not supposed to be there is a threat.","quote":"Marco Rubio: Anything that enters an airspace that's not supposed to be there is a threat."},{"id":"bd81f9c3-9782-4f6e-93c2-d7955bb7dba5","type":"administrative","location":"00:12:26.5-00:12:34.0","speaker":"Whitaker, Bill","text":"After receiving classified briefings on UAPs, Senator Marco Rubio called for a detailed analysis.","quote":"After receiving classified briefings on UAPs, Senator Marco Rubio called for a detailed analysis."},{"id":"581158ef-1c24-4f2d-88c2-d176ae97a2c3","type":"administrative","location":"00:12:34.0-00:12:46.3","speaker":"Whitaker, Bill","text":"In December 2020, while he was still head of the Intelligence Committee, Senator Marco Rubio asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report on UAP by June 2021.","quote":"This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month."},{"id":"0f05f697-cfbb-4777-a942-7c7c5cad3c80","type":"opinion","location":"00:13:14.1-00:13:25.9","speaker":"Rubio, Marco","text":"Senator Marco Rubio wants the US to take Unidentified Aerial Phenomena (UAP) seriously and have a process to analyse the data whenever it comes in.","quote":"Marco Rubio: I want us to take it seriously and have a process to take it seriously. I want us to have a process to analyze the data every time it comes in, that there be a place where this is cataloged and constantly analyzed until we get some answers."}],"nodes":[{"id":"070aa7e5-1bd3-4d0b-bffc-d04ea0c597b1","type":"person","name":"Whitaker, Bill"},{"id":"2a024eb8-7027-486f-a972-2d7a04e8e78d","type":"person","name":"Elizondo, Luis"},{"id":"3b474db0-5ce8-4305-9764-ee4794001b15","type":"person","name":"Graves, Ryan"},{"id":"199e41d4-9a7a-42cd-b4c6-240f7abe23df","type":"person","name":"Fravor, David"},{"id":"892c5f78-610a-42f6-94c2-7a0888c46a71","type":"person","name":"Dietrich, Alex"},{"id":"0244f739-28d9-4513-a819-fc3f507c8278","type":"person","name":"Mellon, Christopher"},{"id":"deee9c97-3b06-42b0-a5ea-c1836c0ca99b","type":"person","name":"Reid, Harry"},{"id":"9db45747-9c68-4d24-a18b-40d9035e7808","type":"person","name":"Rubio, Marco"},{"id":"33a94caf-8c7d-41ab-a111-9b3acabc3d63","type":"organisation","name":"United States Department of Defense (DoD)"},{"id":"4d8953ab-df33-4cdf-83c9-919208b6e43b","type":"organisation","name":"United States Navy"},{"id":"1bea7c55-69c1-4882-80fd-cd0751583f11","type":"organisation","name":"United States Senate"},{"id":"9caba1da-1f6d-447e-8657-8332c6db6b85","type":"organisation","name":"United States Senate Select Committee on Intelligence"},{"id":"074b3895-2043-4619-be81-67b8fe822f40","type":"organisation","name":"Office of the Director of National Intelligence (ODNI)"},{"id":"f05691de-7b3f-466c-9d44-d49ade2f2218","type":"organisation","name":"60 Minutes"},{"id":"ae6cad37-5e86-4b71-b653-a2c4d2e31d52","type":"organisation","name":"The New York Times"},{"id":"1f820870-fb08-4b64-a9ce-ee35391b1c24","type":"organisation","name":"History Channel"},{"id":"9343931a-3709-4858-add8-35a18947c63c","type":"organisation","name":"Top Gun Naval Flight School"},{"id":"fa663929-9899-4c28-bb4a-a6b08728c781","type":"project","name":"Advanced Aerospace Threat Identification Program (AATIP)"},{"id":"7d3cce3f-fff5-46ba-9ff2-d31bf98e38e1","type":"project","name":"Project Blue Book"},{"id":"267b4fb8-d07e-4bbd-b065-43f8853dcd7b","type":"project","name":"UAP Task Force"},{"id":"0d7a7be5-8327-45c8-88ef-4e970b6d3716","type":"place","name":"USA, California, San Diego"},{"id":"addb1538-bdaa-46fa-a8c0-178b97015bb9","type":"place","name":"USA, Atlantic Ocean"},{"id":"fc17f39f-34a7-4444-b342-4a3eb0a88b5e","type":"place","name":"USA, Virginia, Virginia Beach"},{"id":"4fff1979-1b2d-423a-875c-2dae286bbdc5","type":"place","name":"USA, Florida, Jacksonville"},{"id":"733ba7f2-f077-4c34-8701-0e4e2b73eb29","type":"place","name":"Cuba, Guantanamo Bay"},{"id":"05007966-d937-4a79-acf7-8588011b134c","type":"place","name":"Afghanistan"},{"id":"823d617d-790f-438d-b823-d7113df1802c","type":"place","name":"Middle East"},{"id":"c71fce31-0b85-4446-8f02-bbb63e4fd65a","type":"event","name":"2004 USS Nimitz UAP encounter"},{"id":"0f37afa6-14b0-4bba-84e0-208ea42f7dd8","type":"object","name":"F/A-18"},{"id":"ac306d76-c9ab-4154-a227-37d33f840919","type":"object","name":"USS Nimitz"},{"id":"72d6816d-dc4f-4707-9afc-598154f2b900","type":"object","name":"USS Princeton"},{"id":"20040e0d-9efc-4a35-ba75-b31408245598","type":"topic","name":"Unidentified Aerial Phenomena (UAP)"},{"id":"f53d2e5d-fb9f-4860-8306-fbfbfd81a90d","type":"topic","name":"Anomalous Aerial Vehicle (AAV)"},{"id":"bc8acfd5-c7d0-44c4-b086-dd73a7ba4a50","type":"topic","name":"Unidentified Flying Object (UFO)"}]},{"id":"deepseek_deepseek-v4-flash","name":"deepseek / deepseek-v4-flash","errata":null,"claims":[{"id":"e7852e32-3d07-446c-b860-d32ec4aaa766","type":"observation","location":"00:00:14.9-00:00:44.4","speaker":"Bill Whitaker","text":"The US government has officially acknowledged the reality of Unidentified Aerial Phenomena (UAP).","quote":"the pentagon now admits there's something out there and the u.s senate wants to know what it is the intelligence committee has ordered the director of national intelligence and the secretary of defense to deliver a report on the mysterious sightings by next month"},{"id":"e3192811-7716-43ba-b24d-a7f68517651d","type":"observation","location":"00:00:14.9-00:00:44.4","speaker":"Bill Whitaker","text":"The US Senate Select Committee on Intelligence has ordered the Director of National Intelligence and the Secretary of Defense to deliver a report on UAP sightings by 2021-06.","quote":"the intelligence committee has ordered the director of national intelligence and the secretary of defense to deliver a report on the mysterious sightings by next month"},{"id":"d6d949d4-0936-4dcb-a47f-46c4a5f5c531","type":"observation","location":"00:00:54.6-00:00:59.6","speaker":"Luis Elizondo","text":"Luis Elizondo states that the US government has already officially confirmed the reality of UAP.","quote":"The government has already stated for the record that they're real."},{"id":"d3985ba4-0b3e-4e8d-a0bf-88f0abad8f72","type":"observation","location":"00:01:02.4-00:01:11.5","speaker":"Bill Whitaker","text":"Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo.","quote":"Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo."},{"id":"ed187063-22c8-4d10-badc-1400e5b9d44a","type":"observation","location":"00:01:11.5-00:01:15.6","speaker":"Bill Whitaker","text":"Luis Elizondo joined the Advanced Aerospace Threat Identification Program (AATIP) in 2008.","quote":"He hadn't given UFOs a second thought until 2008. That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP."},{"id":"203b1f08-7fa8-48a7-b820-78e72a05e76a","type":"observation","location":"00:01:24.1-00:01:34.3","speaker":"Luis Elizondo","text":"The mission of AATIP was to collect and analyse information involving anomalous aerial vehicles, referred to as UAP.","quote":"The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs."},{"id":"2bf1a9c1-b176-4a3e-89aa-2b8de36f8231","type":"observation","location":"00:01:50.3-00:02:01.6","speaker":"Bill Whitaker","text":"AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs.","quote":"Buried away in the Pentagon, AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs."},{"id":"65894ac8-88aa-4c5a-a429-1b4eb9a21bed","type":"observation","location":"00:02:01.6-00:02:10.8","speaker":"Bill Whitaker","text":"Luis Elizondo took over AATIP in 2010.","quote":"When Elizondo took over in 2010"},{"id":"5b7c2c0f-7de3-4d69-a852-7a17fa067d95","type":"observation","location":"00:02:01.6-00:02:10.8","speaker":"Bill Whitaker","text":"Elizondo focused on the national security implications of UAP documented by US service members.","quote":"he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members."},{"id":"d1d51400-a1fb-4956-b01f-7b8a070e032c","type":"measurement","location":"00:02:12.6-00:02:35.2","speaker":"Luis Elizondo","text":"Luis Elizondo described a technology that can perform 600 to 700 G-forces.","quote":"Imagine a technology that can do 600 to 700 G-forces"},{"id":"27349c2f-3bc6-4a22-b208-489a72a34d07","type":"measurement","location":"00:02:12.6-00:02:35.2","speaker":"Luis Elizondo","text":"Luis Elizondo described a technology that can fly at approximately 21,000 kilometres per hour.","quote":"that can fly at 13,000 miles an hour"},{"id":"e77243b5-5e18-4fea-ae6c-36ade6436394","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Luis Elizondo","text":"Luis Elizondo described a technology that can evade radar.","quote":"that can evade radar"},{"id":"8b3dc4e1-bff7-46aa-92ca-a37e9fe0177d","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Luis Elizondo","text":"Luis Elizondo described a technology that can fly through air, water, and possibly space.","quote":"that can fly through air and water and possibly space"},{"id":"eb54705b-3d7c-4928-8414-475eda44035e","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Luis Elizondo","text":"Luis Elizondo described a technology with no obvious signs of propulsion, no wings, and no control surfaces.","quote":"has no obvious signs of propulsion, no wings, no control surfaces"},{"id":"7d1ece33-acdf-4aa7-8a49-aebdbe4c4847","type":"observation","location":"00:02:12.6-00:02:35.2","speaker":"Luis Elizondo","text":"Luis Elizondo described a technology that can defy the natural effects of Earth's gravity.","quote":"still can defy the natural effects of Earth's gravity."},{"id":"e9e43946-92ac-45dc-b283-eabfd7ddc127","type":"observation","location":"00:02:37.0-00:02:47.7","speaker":"Bill Whitaker","text":"AATIP was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time.","quote":"Elizondo tells us AATIP was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time."},{"id":"8f39d393-01f4-4e5b-adf5-3adbffe81a18","type":"observation","location":"00:02:57.7-00:03:07.3","speaker":"Bill Whitaker","text":"A Navy aircrew struggled to lock onto a fast-moving object off the US Atlantic coast in 2015.","quote":"A Navy aircrew struggles to lock onto a fast-moving object off the U.S. Atlantic coast in 2015."},{"id":"8ba03cac-3a93-4d4c-9523-ae9d3ac531d2","type":"observation","location":"00:03:07.3-00:03:20.4","speaker":"Bill Whitaker","text":"The Pentagon admits it cannot identify certain objects recorded in declassified Navy footage.","quote":"Recently released images may not convince UFO skeptics, but the Pentagon admits it doesn't know what in the world this is, or this, or this."},{"id":"79745300-18b3-413c-82e4-4d1ad64109ee","type":"opinion","location":"00:03:30.4-00:03:44.3","speaker":"Luis Elizondo","text":"Luis Elizondo stated that some UAP sightings have simple explanations, but others do not.","quote":"In some cases, there are simple explanations for what people are witnessing, but there are some that that are not."},{"id":"43cf21a3-a688-4172-81ac-8c663226fc55","type":"observation","location":"00:03:42.7-00:03:52.6","speaker":"Luis Elizondo","text":"Luis Elizondo stated that AATIP conducted due diligence, considering possibilities such as new Chinese cruise missile technology or high-altitude reconnaissance balloons.","quote":"Is it some sort of new type of cruise missile technology that China has developed? Is it some sort of high-altitude balloon that's conducting reconnaissance?"},{"id":"e34c9290-429f-4034-9bac-2adef90f13af","type":"opinion","location":"00:03:42.7-00:03:52.6","speaker":"Luis Elizondo","text":"Luis Elizondo stated that the presence of a UAP in US airspace becomes compelling and problematic after exhausting conventional explanations.","quote":"Ultimately, when you have exhausted all those what-ifs and you're still left with the fact that this is in our airspace and it's real, that's when it becomes compelling and that's when it becomes problematic."},{"id":"d516c22b-e5cb-4b2c-a466-3a3bc66a64a1","type":"opinion","location":"00:04:06.2-00:04:12.9","speaker":"Bill Whitaker","text":"Former Navy pilot Lieutenant Ryan Graves calls UAP a security risk.","quote":"Former Navy pilot Lieutenant Ryan Graves calls whatever is out there a security risk."},{"id":"b4ff9b06-78ed-45dc-b25b-e32808f35f82","type":"observation","location":"00:04:12.9-00:04:29.7","speaker":"Bill Whitaker","text":"Ryan Graves' F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014 after updating their jet's radar.","quote":"He told us his F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar, making it possible to zero in with infrared targeting cameras."},{"id":"c4973f1a-3418-4491-8ba4-919ea47c60b1","type":"observation","location":"00:04:29.7-00:04:37.1","speaker":"Ryan Graves","text":"Ryan Graves observed the UAPs using both radar and infrared targeting cameras.","quote":"So you're seeing it both with the radar and with the infrared, and that tells you that there is something out there."},{"id":"12ee9aa7-f6ea-4d13-a209-239ee64b31f1","type":"opinion","location":"00:04:37.1-00:04:38.6","speaker":"Ryan Graves","text":"Ryan Graves considers the dual radar-and-infrared detection of UAPs hard to spoof.","quote":"Pretty hard to spoof that."},{"id":"b39c7cfc-383e-45c3-ab2d-62ec0eee7c3b","type":"observation","location":"00:04:38.6-00:04:43.0","speaker":"Bill Whitaker","text":"Photographs taken in 2019 in the same area off Virginia Beach show objects the Pentagon cannot identify.","quote":"These photographs were taken in 2019 in the same area. The Pentagon confirms these are images of objects it can't identify."},{"id":"fb19a235-b19e-4db7-bb97-629986d2e6d8","type":"observation","location":"00:04:48.2-00:05:01.2","speaker":"Ryan Graves","text":"Ryan Graves stated that pilots training off the Atlantic coast saw UAPs daily for at least a couple of years.","quote":"Lieutenant Graves told us pilots training off the Atlantic coast see things like that all the time. ... Every day. Every day for at least a couple of years."},{"id":"aa7958bc-1a61-4487-96ce-f1868a2c10f0","type":"observation","location":"00:05:02.5-00:05:04.3","speaker":"Ryan Graves","text":"Ryan Graves observed no exhaust plume on the UAP.","quote":"I don't see an exhaust plume."},{"id":"a018de80-2fa4-4c5a-b0d9-6ac2ac37344b","type":"observation","location":"00:05:04.3-00:05:12.8","speaker":"Bill Whitaker","text":"A UAP off the coast of Jacksonville, Florida in 2015 was captured on a targeting camera by members of Graves' squadron.","quote":"including this one, off the coast of Jacksonville, Florida in 2015, captured on a targeting camera by members of Graves' squadron."},{"id":"21d557ae-b991-4333-83c9-6966ea270d2b","type":"observation","location":"00:05:12.8-00:05:23.8","speaker":"Bill Whitaker","text":"The UAP off Jacksonville was rotating and moving against a 120-knot wind (approximately 220 kilometres per hour).","quote":"Look at that thing! It's rotating. ... They're all going against the wind. The wind's 120 knots far west."},{"id":"93df0a6c-71cb-4d01-a437-ac6a1dd60582","type":"observation","location":"00:05:27.3-00:05:32.2","speaker":"Ryan Graves","text":"Ryan Graves stated that the pilots showed surprise and amazement at the UAP.","quote":"They seem to have broke character a bit, and were just kind of amazed at what they were seeing."},{"id":"2f92381c-0121-4245-81e6-4d603ba8c4b2","type":"opinion","location":"00:05:35.8-00:05:42.8","speaker":"Ryan Graves","text":"Ryan Graves finds the UAP off Jacksonville difficult to explain, noting its rotation, high altitude, and propulsion.","quote":"This is a difficult one to explain. You have rotation, you have high altitudes, you have propulsion, right? I don't know what it is, frankly."},{"id":"ce619894-3bc9-4a81-8626-454c81452f78","type":"observation","location":"00:05:44.9-00:05:50.0","speaker":"Bill Whitaker","text":"Pilots speculate UAP could be secret US technology, an adversary spy vehicle, or something otherworldly.","quote":"He told us pilots speculate they are one of three things, secret U.S. technology, an adversary spy vehicle, or something otherworldly."},{"id":"e9172946-9fa3-43bb-9e17-23ec32362b0f","type":"opinion","location":"00:05:56.0-00:06:00.5","speaker":"Ryan Graves","text":"Ryan Graves considers the highest probability for the UAP is a threat observation programme.","quote":"I'd say, you know, the highest probability is it's a threat observation program."},{"id":"5f3c08cd-855a-4501-bada-b824f4bfe1c0","type":"opinion","location":"00:06:00.5-00:06:04.1","speaker":"Ryan Graves","text":"Ryan Graves considers Russian or Chinese technology a possible explanation for the observed UAP.","quote":"Bill Whitaker: Could it be Russian or Chinese technology? Ryan Graves: I don't see why not."},{"id":"ebd5ff91-1db6-45cc-9f8a-13c7674c6ced","type":"opinion","location":"00:06:05.4-00:06:18.5","speaker":"Ryan Graves","text":"Ryan Graves is worried about the UAP, stating that if they were tactical jets from another country, it would be a massive issue.","quote":"I am worried, frankly. ... if these were tactical jets from another country that were hanging out up there, it would be a massive issue. But because it looks slightly different, we're not willing to actually look at the problem in the face. We're happy to just ignore the fact that these are out there watching us every day."},{"id":"51f6f828-2c81-4e9b-9668-26602bd6094e","type":"observation","location":"00:06:23.4-00:06:30.3","speaker":"Bill Whitaker","text":"The US government ignored UFOs publicly since closing Project Blue Book in 1969.","quote":"The government has ignored it, at least publicly, since closing its Project Blue Book investigation in 1969."},{"id":"352b25d8-8b50-45fa-9ed0-e87aacd73cc3","type":"observation","location":"00:06:30.3-00:06:40.8","speaker":"Bill Whitaker","text":"The 2004 USS Nimitz UAP encounter was documented by radar, camera, and four naval aviators.","quote":"But that began to change after an incident off Southern California in 2004, which was documented by radar, by camera, and four naval aviators."},{"id":"1ca8f25e-c486-4385-99be-3877a1bc30dd","type":"observation","location":"00:06:40.8-00:06:57.3","speaker":"Bill Whitaker","text":"David Fravor is a graduate of the Top Gun Naval Flight School and was commander of the F-18 squadron on the USS Nimitz.","quote":"David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz"},{"id":"917e2d5b-0441-4681-ac11-1606249abc0f","type":"observation","location":"00:06:40.8-00:06:57.3","speaker":"Bill Whitaker","text":"Alex Dietrich flew at Fravor's wing during the 2004 encounter and had not spoken publicly about it before.","quote":"and flying at his wing, Lieutenant Alex Dietrich, who has never spoken publicly about the encounter."},{"id":"53dd88c0-a021-4dbd-a7b8-411e0689a86c","type":"opinion","location":"00:07:02.7-00:07:14.4","speaker":"Alex Dietrich","text":"Alex Dietrich agreed to speak publicly because she was in a government aircraft, on the clock, and the information is unclassified.","quote":"Because I was in a government aircraft, because I was on the clock, and so I feel a responsibility to share what I can, and it is unclassified."},{"id":"f6f7a083-86c7-458c-8960-263f0963db3d","type":"observation","location":"00:07:14.4-00:07:23.1","speaker":"Bill Whitaker","text":"In November 2004, the USS Nimitz Carrier Strike Group was training approximately 160 kilometres southwest of San Diego.","quote":"It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego."},{"id":"67ff02dc-0c61-4967-a3b1-c7045269d85e","type":"observation","location":"00:07:23.1-00:07:39.3","speaker":"Bill Whitaker","text":"The USS Princeton's advanced new radar detected multiple anomalous aerial vehicles over the horizon, descending approximately 24,000 metres in less than a second.","quote":"For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 80,000 feet in less than a second."},{"id":"edb66263-b181-4180-be80-a5d8355206ef","type":"observation","location":"00:07:39.3-00:07:47.8","speaker":"Bill Whitaker","text":"On 2004-11-14, David Fravor and Alex Dietrich, each with a weapons system officer in the backseat, were diverted to investigate the UAP.","quote":"On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate."},{"id":"31f19de7-bf18-4bec-8c2f-b587212f6d26","type":"observation","location":"00:07:47.8-00:07:55.9","speaker":"Bill Whitaker","text":"The pilots found an area of roiling white water the size of a Boeing 737 in an otherwise calm blue sea.","quote":"They found an area of roiling white water the size of a 737 in an otherwise calm blue sea."},{"id":"95438ded-6e8b-4c84-b56a-51f32858f1e3","type":"observation","location":"00:08:02.4-00:08:09.7","speaker":"David Fravor","text":"David Fravor observed a small white tic-tac-looking object moving above the whitewater area.","quote":"We saw this little white tic-tac-looking object. And it's just kind of moving above the whitewater area."},{"id":"3fbf019f-4b5b-4f0d-bd80-665480be0e01","type":"observation","location":"00:08:18.5-00:08:24.5","speaker":"David Fravor","text":"David Fravor observed the Anomalous Aerial Vehicle (AAV) pointing north-south and mirroring his movement as he descended.","quote":"The tic-tac's still pointing north-south. It goes and just turns abruptly and starts mirroring me. So as I'm coming down, it starts coming up."},{"id":"769421cb-d3e6-4db4-8c3d-bf365e2adc6c","type":"opinion","location":"00:08:28.9-00:08:30.5","speaker":"David Fravor","text":"David Fravor stated that the AAV was aware of his presence.","quote":"Yeah, it was aware we were there."},{"id":"c67a8731-1d3f-4f3d-8782-c76bd021bbb1","type":"observation","location":"00:08:30.5-00:08:37.0","speaker":"David Fravor","text":"David Fravor stated that the AAV was about the size of his F-18, with no markings, no wings, and no exhaust plumes.","quote":"He said it was about the size of his F-18, with no markings, no wings, no exhaust plumes."},{"id":"140a308a-cf06-424b-ac43-4fc8e76e9239","type":"observation","location":"00:08:39.0-00:08:47.8","speaker":"David Fravor","text":"David Fravor observed the AAV disappear suddenly after climbing and getting right in front of his aircraft.","quote":"So I go like this, and it's climbing still. And when it gets right in front of me, it just disappears. ... Disappears, like gone. It had sped off."},{"id":"597f217f-9153-4f5a-a482-17fc09525090","type":"observation","location":"00:08:50.9-00:08:58.3","speaker":"Alex Dietrich","text":"Alex Dietrich initially categorised the AAV as possibly a helicopter or a drone, but was unable to explain its disappearance.","quote":"Your mind tries to make sense of it. I'm going to categorize this as maybe a helicopter or maybe a drone. And when it disappeared, I mean, it was just..."},{"id":"6dd691b5-06fd-4636-8b68-dfc32e45f5db","type":"observation","location":"00:09:03.5-00:09:04.2","speaker":"David Fravor","text":"Both David Fravor and Alex Dietrich, along with their backseaters, observed the AAV for roughly five minutes.","quote":"There was four of us in the airplanes literally watching this thing for roughly about five minutes."},{"id":"e43f9c65-66f6-4207-ab5a-b783dd0757b4","type":"observation","location":"00:09:08.9-00:09:14.4","speaker":"Bill Whitaker","text":"Seconds after the AAV disappeared, the Princeton reacquired the target approximately 97 kilometres away.","quote":"Seconds later, the Princeton reacquired the target, 60 miles away."},{"id":"3f18df1a-7ede-4868-bb86-7109fdc0623d","type":"observation","location":"00:09:14.4-00:09:18.0","speaker":"Bill Whitaker","text":"Another crew briefly locked onto the AAV with a targeting camera before it zipped off again.","quote":"Another crew managed to briefly lock onto it with a targeting camera before it zipped off again."},{"id":"8f6127b5-8ca3-482e-8994-00feac09958d","type":"opinion","location":"00:09:37.4-00:09:39.8","speaker":"David Fravo
