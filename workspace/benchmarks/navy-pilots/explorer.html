AP Encounter 2004, Fravor and Dietrich found an area of roiling white water approximately the size of a Boeing 737 in an otherwise calm blue sea.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "They found an area of roiling white water the size of a 737 in an otherwise calm blue sea.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "USA, California, San Diego (offshore)", "type": "place"}]}, {"loc": "00:07:55.9-00:08:12.3", "bk": 472, "text": "David Fravor described the Tic Tac UAP Object observed during the Nimitz UAP Encounter 2004 as a small white object shaped like a tic tac, moving above the area of white water.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Fravor, David", "quote": "And we saw this little white tic-tac-looking object. And it's just kind of moving above the whitewater area.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Tic Tac UAP Object (Nimitz 2004)", "type": "object"}, {"name": "USA, California, San Diego (offshore)", "type": "place"}]}, {"loc": "00:08:17.9-00:08:27.0", "bk": 496, "text": "David Fravor described the Tic Tac UAP Object as initially oriented north-south, then abruptly turning and mirroring his aircraft's movements as he spiralled down towards it.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Fravor, David", "quote": "The tic-tac's still pointing north-south. It goes and just turns abruptly and starts mirroring me. So as I'm coming down, it starts coming up.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Tic Tac UAP Object (Nimitz 2004)", "type": "object"}]}, {"loc": "00:08:27.0-00:08:30.5", "bk": 504, "text": "David Fravor assessed that the Tic Tac UAP Object was aware of his aircraft's presence during the Nimitz UAP Encounter 2004.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Fravor, David", "quote": "Bill Whitaker: So it's mimicking your moves. David Fravor: Yeah, it was aware we were there.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Tic Tac UAP Object (Nimitz 2004)", "type": "object"}]}, {"loc": "00:08:30.5-00:08:37.0", "bk": 508, "text": "The Tic Tac UAP Object observed during the Nimitz UAP Encounter 2004 was approximately the size of an F-18 aircraft, with no markings, no wings, and no exhaust plumes.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Whitaker, Bill", "quote": "He said it was about the size of his F-18, with no markings, no wings, no exhaust plumes.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Tic Tac UAP Object (Nimitz 2004)", "type": "object"}]}, {"loc": "00:08:37.0-00:08:47.8", "bk": 516, "text": "David Fravor described the Tic Tac UAP Object as climbing and then instantly disappearing when he attempted to close on it during the Nimitz UAP Encounter 2004.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Fravor, David", "quote": "I want to see how close I can get. So I go like this, and it's climbing still. And when it gets right in front of me, it just disappears.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Tic Tac UAP Object (Nimitz 2004)", "type": "object"}]}, {"loc": "00:08:50.9-00:09:03.3", "bk": 528, "text": "Alex Dietrich recalled that when the Tic Tac UAP Object disappeared, her mind initially tried to categorise it as a helicopter or a drone.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Dietrich, Alex", "quote": "So your mind tries to make sense of it. I'm going to categorize this as maybe a helicopter or maybe a drone. And when it disappeared, I mean, it was just...", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Tic Tac UAP Object (Nimitz 2004)", "type": "object"}]}, {"loc": "00:09:03.5-00:09:08.9", "bk": 540, "text": "During the Nimitz UAP Encounter 2004, all four aircrew members in the two aircraft observed the Tic Tac UAP Object for approximately five minutes.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Fravor, David", "quote": "There was four of us in the airplanes literally watching this thing for roughly about five minutes.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Tic Tac UAP Object (Nimitz 2004)", "type": "object"}]}, {"loc": "00:09:08.9-00:09:14.4", "bk": 548, "text": "Seconds after the Tic Tac UAP Object disappeared from Fravor and Dietrich's view, the USS Princeton reacquired it on radar approximately 97 kilometres away.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Seconds later, the Princeton reacquired the target, 60 miles away.", "refs": [{"name": "USS Princeton", "type": "object"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Tic Tac UAP Object (Nimitz 2004)", "type": "object"}]}, {"loc": "00:09:14.4-00:09:20.8", "bk": 552, "text": "After the Tic Tac UAP Object reappeared on radar during the Nimitz UAP Encounter 2004, another Navy crew briefly locked onto it with a targeting camera before it departed again.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Another crew managed to briefly lock onto it with a targeting camera before it zipped off again.", "refs": [{"name": "US Navy", "type": "organisation"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Tic Tac UAP Object (Nimitz 2004)", "type": "object"}, {"name": "AATIP UAP Video Footage (Three Declassified Navy Videos)", "type": "document"}]}, {"loc": "00:09:20.8-00:09:31.1", "bk": 560, "text": "Alex Dietrich reflected that had she seen the Tic Tac UAP Object alone, she might not have reported it because it sounds so incredible.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Dietrich, Alex", "quote": "I think that over beers, we've sort of said, hey, man, if I saw this solo, I don't know that I would have come back and said anything because it sounds so crazy when I say it.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Tic Tac UAP Object (Nimitz 2004)", "type": "object"}]}, {"loc": "00:09:37.4-00:09:56.5", "bk": 576, "text": "David Fravor identified himself as not a UFO believer but confirmed that something was present during the Nimitz UAP Encounter 2004 that was superior to his F-18 aircraft.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Fravor, David", "quote": "I'll be honest. I'm not a UFO guy. Bill Whitaker: But from what I hear you guys saying, there's something. David Fravor: Yes. There's definitely something that, I don't know who's building it, who's got the technology, who's got the brains, but there's something out there that was better than our airplane.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Tic Tac UAP Object (Nimitz 2004)", "type": "object"}]}, {"loc": "00:09:56.5-00:10:13.2", "bk": 596, "text": "After the Nimitz UAP Encounter 2004, the aircrew filed reports, but no official action was taken for five years.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "The air crew filed reports. Then, like the mysterious flying object, the Nimitz encounter disappeared. Nothing was said or done officially for five years", "refs": [{"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "USS Nimitz", "type": "object"}, {"name": "US Navy", "type": "organisation"}]}, {"loc": "00:10:04.2-00:10:13.2", "bk": 604, "text": "Luis Elizondo came across the story of the Nimitz UAP Encounter 2004 approximately five years after it occurred and investigated it through the Advanced Aerospace Threat Identification Program (AATIP).", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "until Lou Elizondo came across the story and investigated.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:10:13.2-00:10:27.7", "bk": 612, "text": "Luis Elizondo argued that pilot UAP sightings are compelling because they are corroborated by electro-optical data such as gun camera footage and by radar data.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Elizondo, Luis", "quote": "We spend millions of dollars in training these pilots, and they are seeing something that they can't explain. Furthermore, that information's being backed up on electro-optical data, like gun camera footage, and by radar data. Now, to me, that's compelling.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}]}, {"loc": "00:10:31.7-00:10:39.5", "bk": 628, "text": "AATIP's funding was eliminated in 2012, but Luis Elizondo stated that he and a handful of others kept the programme active.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "AATIP's funding was eliminated in 2012, but Elizondo says he and a handful of others kept the mission alive.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:10:39.5-00:10:48.8", "bk": 636, "text": "Luis Elizondo quit the Pentagon in 2017, frustrated by internal scepticism, but before departing obtained declassification of three UAP videos.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "until finally, frustrated, he quit the Pentagon in 2017, but not before getting these three videos declassified.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "US Department of Defense (DoD)", "type": "organisation"}, {"name": "AATIP UAP Video Footage (Three Declassified Navy Videos)", "type": "document"}]}, {"loc": "00:10:51.9-00:10:57.5", "bk": 648, "text": "Christopher Mellon tried to help Luis Elizondo elevate the UAP issue within the Department of Defense and get it to the Secretary of Defense.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Mellon, Christopher", "quote": "I tried to help my colleague, Lou Elizondo, elevate the issue in the department and actually get it to the Secretary of Defense.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Elizondo, Luis", "type": "person"}, {"name": "US Department of Defense (DoD)", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:10:57.5-00:11:08.4", "bk": 656, "text": "Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence under Presidents Clinton and George W. Bush, with access to top-secret government programmes.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush, and had access to top-secret government programs.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "US Department of Defense (DoD)", "type": "organisation"}]}, {"loc": "00:11:08.4-00:11:18.7", "bk": 668, "text": "Christopher Mellon expressed high confidence that observed UAP do not belong to the United States, based on his former positions in the Department of Defense and his knowledge of its processes.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Mellon, Christopher", "quote": "So it's not us, that's one thing we know. Bill Whitaker: We know that? Christopher Mellon: I could say that with a very high degree of confidence, in part because of the positions I held in the department, and I know the process.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "US Department of Defense (DoD)", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:11:26.2-00:11:37.0", "bk": 684, "text": "In 2017, Christopher Mellon, acting as a private citizen, surreptitiously acquired the three declassified US Navy UAP videos and leaked them to The New York Times.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Whitaker, Bill", "quote": "In 2017, as a private citizen, he surreptitiously acquired the three Navy videos Elizondo had declassified and leaked them to The New York Times.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Elizondo, Luis", "type": "person"}, {"name": "The New York Times", "type": "organisation"}, {"name": "AATIP UAP Video Footage (Three Declassified Navy Videos)", "type": "document"}, {"name": "UAP Video Leak to The New York Times 2017", "type": "event"}, {"name": "US Navy", "type": "organisation"}]}, {"loc": "00:11:37.0-00:11:46.1", "bk": 696, "text": "Christopher Mellon expressed that it was bizarre and unfortunate that he had to leak information as a private citizen to get a national security issue about UAP onto the agenda.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Mellon, Christopher", "quote": "It's bizarre and unfortunate that someone like myself has to do something like that to get a national security issue like this on the agenda.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "UAP Video Leak to The New York Times 2017", "type": "event"}]}, {"loc": "00:11:57.6-00:12:07.2", "bk": 716, "text": "Christopher Mellon explained that the strategy for addressing UAP was to go to the public first to generate public interest, then Congressional interest, and then pressure the Department of Defense to investigate.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Mellon, Christopher", "quote": "We knew and understood that you had to go to the public, get the public interested to get Congress interested, to then circle back to the Defense Department and get them to start taking a look at it.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Elizondo, Luis", "type": "person"}, {"name": "US Department of Defense (DoD)", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:12:09.1-00:12:15.6", "bk": 728, "text": "In August 2020, the Pentagon re-established the Advanced Aerospace Threat Identification Program (AATIP) under the new name UAP Task Force.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "This past August, the Pentagon resurrected AATIP. It's now called the UAP Task Force.", "refs": [{"name": "US Department of Defense (DoD)", "type": "organisation"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "UAP Task Force", "type": "project"}]}, {"loc": "00:12:15.6-00:12:20.1", "bk": 732, "text": "Following the establishment of the UAP Task Force, US service members are now encouraged to report strange UAP encounters.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Service members now are encouraged to report strange encounters.", "refs": [{"name": "UAP Task Force", "type": "project"}, {"name": "US Department of Defense (DoD)", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:12:22.6-00:12:26.5", "bk": 740, "text": "Marco Rubio stated that anything entering airspace where it is not supposed to be constitutes a threat.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Rubio, Marco", "quote": "Anything that enters an airspace that's not supposed to be there is a threat.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:12:26.5-00:12:34.0", "bk": 744, "text": "After receiving classified briefings on UAP, Senator Marco Rubio called for a detailed analysis of the phenomenon.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "After receiving classified briefings on UAPs, Senator Marco Rubio called for a detailed analysis.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "US Senate Intelligence Committee", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:12:34.0-00:12:46.3", "bk": 752, "text": "While serving as head of the Senate Intelligence Committee in December 2020, Marco Rubio asked the Director of National Intelligence and the Pentagon to present Congress with an unclassified UAP report by June 2021.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "US Senate Intelligence Committee", "type": "organisation"}, {"name": "Office of the Director of National Intelligence", "type": "organisation"}, {"name": "US Department of Defense (DoD)", "type": "organisation"}, {"name": "UAP Report to Congress by Director of National Intelligence and Secretary of Defense 2021", "type": "document"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:12:59.0-00:13:12.2", "bk": 776, "text": "Marco Rubio noted there is a stigma on Capitol Hill about UAP, with some colleagues giggling when the topic is raised, but argued this stigma should not prevent seeking answers.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Rubio, Marco", "quote": "You know, there's a stigma on Capitol Hill. I mean, some of my colleagues are very interested in this topic and some kind of, you know, giggle when you bring it up. But I don't think we can allow the stigma to keep us from having an answer to a very fundamental question.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "US Senate Intelligence Committee", "type": "organisation"}]}, {"loc": "00:13:14.1-00:13:28.3", "bk": 792, "text": "Marco Rubio called for a systematic process to analyse UAP data as it comes in, catalogue the sightings, and continue analysis until answers are found.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Rubio, Marco", "quote": "I want us to take it seriously and have a process to take it seriously. I want us to have a process to analyze the data. every time it comes in, that there be a place where this is cataloged and constantly analyzed until we get some answers.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "UAP Task Force", "type": "project"}]}, {"loc": "00:13:37.3-00:13:41.7", "bk": 816, "text": "Alex Dietrich stated that during the Nimitz UAP Encounter 2004 she felt vulnerable due to having nothing to defend herself with.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Dietrich, Alex", "quote": "I felt the vulnerability of not having anything to defend ourselves.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}]}], "nodes_by_type": {"person": ["Whitaker, Bill", "Elizondo, Luis", "Graves, Ryan", "Fravor, David", "Dietrich, Alex", "Mellon, Christopher", "Rubio, Marco", "Reid, Harry"], "project": ["Advanced Aerospace Threat Identification Program (AATIP)", "UAP Task Force", "Project Blue Book"], "organisation": ["US Department of Defense (DoD)", "US Navy", "US Senate Intelligence Committee", "Office of the Director of National Intelligence", "The New York Times", "History Channel", "60 Minutes", "Top Gun Naval Flight School"], "object": ["USS Nimitz", "USS Princeton", "Tic Tac UAP Object (Nimitz 2004)"], "document": ["Navy pilots describe encounters with UFOs", "AATIP UAP Video Footage (Three Declassified Navy Videos)", "UAP Report to Congress by Director of National Intelligence and Secretary of Defense 2021"], "event": ["Nimitz UAP Encounter 2004", "UAP Sightings off Atlantic Coast 2014-2019", "UAP Video Leak to The New York Times 2017"], "place": ["USA, California, San Diego (offshore)", "USA, Virginia, Virginia Beach (restricted airspace southeast)", "USA, Florida, Jacksonville (offshore)"], "topic": ["Unidentified Aerial Phenomena (UAP)", "Anomalous Aerial Vehicle (AAV)"]}, "n_claims": 76, "n_nodes": 33, "label": "3: orientation-grounded"}, {"claims": [{"loc": "00:00:56.3-00:00:59.6", "bk": 56, "text": "The US government has officially stated for the record that Unidentified Aerial Phenomena (UAP) are real.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "The government has already stated for the record that they're real. I'm not telling you that. The United States government is telling you that.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "United States Department of Defense (DoD)", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:01:02.4-00:01:06.0", "bk": 60, "text": "Luis Elizondo spent 20 years running military intelligence operations worldwide.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo.", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:01:02.4-00:01:06.0", "bk": 60, "text": "Luis Elizondo ran military intelligence operations in Afghanistan, the Middle East, and Guantanamo Bay.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Cuba, Guantanamo Bay", "type": "place"}]}, {"loc": "00:01:11.5-00:01:15.6", "bk": 68, "text": "Luis Elizondo had not given UFOs serious consideration until 2008.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "He hadn't given UFOs a second thought until 2008.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:01:15.6-00:01:23.0", "bk": 72, "text": "In 2008, Luis Elizondo was asked to join the Advanced Aerospace Threat Identification Program (AATIP) at the Pentagon.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "USA, Virginia, Pentagon", "type": "place"}]}, {"loc": "00:01:24.1-00:01:34.3", "bk": 84, "text": "The mission of the Advanced Aerospace Threat Identification Program (AATIP) was to collect and analyse information involving Anomalous Aerial Vehicles (AAV), commonly referred to as UAP or UFOs.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs. We call them UAPs.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:01:50.3-00:02:01.6", "bk": 108, "text": "The Advanced Aerospace Threat Identification Program (AATIP) was part of a programme costing approximately 22 million US dollars.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "Buried away in the Pentagon, AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Reid, Harry", "type": "person"}, {"name": "USA, Virginia, Pentagon", "type": "place"}]}, {"loc": "00:01:50.3-00:02:01.6", "bk": 108, "text": "The Advanced Aerospace Threat Identification Program (AATIP) was sponsored by then Senate Majority Leader Harry Reid.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Reid, Harry", "type": "person"}]}, {"loc": "00:02:01.6-00:02:12.6", "bk": 120, "text": "Luis Elizondo took over leadership of the Advanced Aerospace Threat Identification Program (AATIP) in 2010.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "When Elizondo took over in 2010, he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:02:01.6-00:02:12.6", "bk": 120, "text": "After taking over AATIP in 2010, Luis Elizondo focused on the national security implications of Unidentified Aerial Phenomena (UAP) documented by US service members.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "When Elizondo took over in 2010, he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "The UAP observed and documented during AATIP investigations were assessed to be capable of enduring 600 to 700 G-forces.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "Imagine a technology that can do 600 to 700 G-forces", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "The UAP observed and documented during AATIP investigations were assessed to be capable of flying at approximately 21,000 kilometres per hour.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "that can fly at 13,000 miles an hour", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "The UAP observed and documented during AATIP investigations were assessed to be capable of evading radar.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "that can evade radar", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "The UAP observed and documented during AATIP investigations were assessed to be capable of travelling through air, water, and possibly space.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "that can fly through air and water and possibly space", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "The UAP observed and documented during AATIP investigations showed no obvious signs of propulsion.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "has no obvious signs of propulsion", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "The UAP observed and documented during AATIP investigations had no visible wings.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "no wings", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "The UAP observed and documented during AATIP investigations had no visible control surfaces.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "no control surfaces", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "The UAP observed and documented during AATIP investigations appeared to defy the natural effects of Earth's gravity.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "and yet still can defy the natural effects of Earth's gravity. That's precisely what we're seeing.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:02:37.0-00:02:47.7", "bk": 156, "text": "The Advanced Aerospace Threat Identification Program (AATIP) was composed of a loose-knit mix of scientists, electro-optical engineers, avionics experts, and intelligence experts, many working part-time.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Elizondo tells us AATIP was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:02:47.7-00:03:07.3", "bk": 164, "text": "The Advanced Aerospace Threat Identification Program (AATIP) combed through data and records and analysed UAP videos, including footage of a Navy aircrew struggling to lock onto a fast-moving object off the US Atlantic coast in 2015.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "They combed through data and records and analyzed videos like this. A Navy aircrew struggles to lock onto a fast-moving object off the U.S. Atlantic coast in 2015.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "United States Navy", "type": "organisation"}, {"name": "2015 Atlantic Coast UAP Sightings", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:03:07.3-00:03:20.4", "bk": 184, "text": "The United States Department of Defense (DoD) admits it cannot identify the objects shown in recently released UAP imagery.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "Recently released images may not convince UFO skeptics, but the Pentagon admits it doesn't know what in the world this is, or this, or this.", "refs": [{"name": "United States Department of Defense (DoD)", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:03:30.4-00:04:06.2", "bk": 208, "text": "Luis Elizondo considers that, while some UAP sightings have simple explanations, others do not, and these unexplained cases become problematic when they are confirmed to be present in US airspace.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Elizondo, Luis", "quote": "In some cases, there are simple explanations for what people are witnessing, but there are some that that are not. We're not just simply jumping to a conclusion that's saying, oh, that's a UAP out there. We're going through our due diligence. Is it some sort of new type of cruise missile technology that China has developed? Is it some sort of high-altitude balloon that's conducting reconnaissance? Ultimately, when you have exhausted all those what-ifs and you're still left with the fact that this is in our airspace and it's real, that's when it becomes compelling and that's when it becomes problematic.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:06.2-00:04:12.9", "bk": 244, "text": "Ryan Graves holds the rank of Lieutenant and is a former US Navy pilot.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "Former Navy pilot Lieutenant Ryan Graves calls whatever is out there a security risk.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "United States Navy", "type": "organisation"}]}, {"loc": "00:04:06.2-00:04:12.9", "bk": 244, "text": "Ryan Graves considers the UAP observed over restricted airspace a security risk.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "Former Navy pilot Lieutenant Ryan Graves calls whatever is out there a security risk.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "2014-2019 US East Coast UAP Sightings", "type": "event"}]}, {"loc": "00:04:12.9-00:04:29.7", "bk": 252, "text": "Ryan Graves' F/A-18 squadron began observing UAP hovering over restricted airspace south-east of Virginia Beach in 2014, after the squadron updated their aircraft's radar.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Whitaker, Bill", "quote": "He told us his F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar, making it possible to zero in with infrared targeting cameras.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "F/A-18", "type": "object"}, {"name": "USA, Virginia, Virginia Beach", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "2014-2019 US East Coast UAP Sightings", "type": "event"}]}, {"loc": "00:04:12.9-00:04:29.7", "bk": 252, "text": "The radar upgrade to Ryan Graves' F/A-18 squadron's aircraft made it possible to lock onto UAP targets with infrared targeting cameras.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Whitaker, Bill", "quote": "when they updated their jet's radar, making it possible to zero in with infrared targeting cameras.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "F/A-18", "type": "object"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:29.7-00:04:38.6", "bk": 268, "text": "Ryan Graves considers the simultaneous radar and infrared detection of UAP hard to spoof, indicating a real physical object.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "Bill Whitaker: So you're seeing it both with the radar and with the infrared, and that tells you that there is something out there. Ryan Graves: Pretty hard to spoof that.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "2014-2019 US East Coast UAP Sightings", "type": "event"}]}, {"loc": "00:04:38.6-00:04:43.0", "bk": 276, "text": "Photographs of UAP were taken in 2019 in the restricted airspace south-east of Virginia Beach.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "These photographs were taken in 2019 in the same area.", "refs": [{"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "USA, Virginia, Virginia Beach", "type": "place"}, {"name": "2014-2019 US East Coast UAP Sightings", "type": "event"}]}, {"loc": "00:04:43.0-00:04:48.2", "bk": 280, "text": "The United States Department of Defense (DoD) confirms that the photographs taken in 2019 off Virginia Beach are images of objects it cannot identify.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "The Pentagon confirms these are images of objects it can't identify.", "refs": [{"name": "United States Department of Defense (DoD)", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "USA, Virginia, Virginia Beach", "type": "place"}]}, {"loc": "00:04:48.2-00:04:57.0", "bk": 288, "text": "Ryan Graves observed UAP in the restricted airspace south-east of Virginia Beach on a daily basis for at least a couple of years.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Graves, Ryan", "quote": "Lieutenant Graves told us pilots training off the Atlantic coast see things like that all the time. [Bill Whitaker:] Every day? [Ryan Graves:] Every day. Every day for at least a couple of years.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "USA, Virginia, Virginia Beach", "type": "place"}, {"name": "2014-2019 US East Coast UAP Sightings", "type": "event"}]}, {"loc": "00:05:02.5-00:05:04.3", "bk": 300, "text": "Ryan Graves observed no exhaust plume on the UAP seen off the US Atlantic coast.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Graves, Ryan", "quote": "You know, I don't see an exhaust plume.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "2014-2019 US East Coast UAP Sightings", "type": "event"}]}, {"loc": "00:05:04.3-00:05:12.8", "bk": 304, "text": "In 2015, a UAP was captured on a targeting camera by members of Ryan Graves' squadron off the coast of Jacksonville, Florida.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "including this one, off the coast of Jacksonville, Florida in 2015, captured on a targeting camera by members of Graves' squadron.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "USA, Florida, Jacksonville", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "2015 Atlantic Coast UAP Sightings", "type": "event"}]}, {"loc": "00:05:12.8-00:05:21.6", "bk": 312, "text": "In external footage from 2015 off Jacksonville, Florida, the observed UAP appeared to be rotating.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "", "quote": "It's rotating.", "refs": [{"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "USA, Florida, Jacksonville", "type": "place"}, {"name": "2015 Atlantic Coast UAP Sightings", "type": "event"}]}, {"loc": "00:05:17.9-00:05:23.8", "bk": 316, "text": "In external footage from 2015 off Jacksonville, Florida, the observed UAP appeared to be moving against a wind of approximately 220 kilometres per hour from the west.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "", "quote": "They're all going against the wind. The wind's 120 knots far west.", "refs": [{"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "USA, Florida, Jacksonville", "type": "place"}, {"name": "2015 Atlantic Coast UAP Sightings", "type": "event"}]}, {"loc": "00:05:37.8-00:05:43.0", "bk": 336, "text": "Ryan Graves observed that the UAP captured on targeting camera in 2015 off Jacksonville exhibited rotation, operated at high altitude, and appeared to have propulsion.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Graves, Ryan", "quote": "You have rotation, you have high altitudes, you have propulsion, right? I don't know. I don't know what it is, frankly.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "USA, Florida, Jacksonville", "type": "place"}, {"name": "2015 Atlantic Coast UAP Sightings", "type": "event"}]}, {"loc": "00:05:42.5-00:05:44.9", "bk": 340, "text": "Ryan Graves was unable to identify the UAP observed by his squadron off the US Atlantic coast.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Graves, Ryan", "quote": "I don't know. I don't know what it is, frankly.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "2014-2019 US East Coast UAP Sightings", "type": "event"}]}, {"loc": "00:05:44.9-00:05:56.0", "bk": 344, "text": "Pilots in Ryan Graves' squadron speculated the UAP were one of three things: secret US technology, an adversary spy vehicle, or something otherworldly.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Whitaker, Bill", "quote": "He told us pilots speculate they are one of three things, secret U.S. technology, an adversary spy vehicle, or something otherworldly.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "United States Navy", "type": "organisation"}]}, {"loc": "00:05:56.0-00:06:00.5", "bk": 356, "text": "Ryan Graves considers the most likely explanation for the observed UAP to be a threat observation programme.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "I'd say, you know, the highest probability is it's a threat observation program.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:06:00.5-00:06:05.4", "bk": 360, "text": "Ryan Graves considers Russian or Chinese technology a possible explanation for the observed UAP.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "Bill Whitaker: Could it be Russian or Chinese technology? Ryan Graves: I don't see why not.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:06:07.0-00:06:23.4", "bk": 364, "text": "Ryan Graves is worried about the UAP observed in US restricted airspace, reasoning that if they were tactical jets from another country the situation would be regarded as a massive national security issue.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "I am worried, frankly. You know, if these were tactical jets from another country that were hanging out up there, it would be a massive issue. But because it looks slightly different, we're not willing to actually look at the problem in the face. We're happy to just ignore the fact that these are out there watching us every day.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "2014-2019 US East Coast UAP Sightings", "type": "event"}]}, {"loc": "00:06:23.4-00:06:30.3", "bk": 380, "text": "The US government publicly ignored the UAP issue after closing the Project Blue Book investigation in 1969.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "The government has ignored it, at least publicly, since closing its Project Blue Book investigation in 1969.", "refs": [{"name": "Project Blue Book", "type": "project"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "United States Department of Defense (DoD)", "type": "organisation"}]}, {"loc": "00:06:30.3-00:06:40.8", "bk": 388, "text": "The US government's public stance on UAP began to change after the 2004 USS Nimitz UAP Encounter off Southern California.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "But that began to change after an incident off Southern California in 2004, which was documented by radar, by camera, and four naval aviators.", "refs": [{"name": "2004 USS Nimitz UAP Encounter", "type": "event"}, {"name": "USA, California, San Diego", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:06:30.3-00:06:40.8", "bk": 388, "text": "The 2004 USS Nimitz UAP Encounter was documented by radar, by camera, and four naval aviators.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "an incident off Southern California in 2004, which was documented by radar, by camera, and four naval aviators.", "refs": [{"name": "2004 USS Nimitz UAP Encounter", "type": "event"}, {"name": "USS Nimitz", "type": "object"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "United States Navy", "type": "organisation"}]}, {"loc": "00:06:40.8-00:06:57.3", "bk": 400, "text": "David Fravor is a graduate of the Top Gun Naval Flight School.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Top Gun Naval Flight School", "type": "organisation"}]}, {"loc": "00:06:40.8-00:06:57.3", "bk": 400, "text": "David Fravor was commander of the F/A-18 squadron on the USS Nimitz at the time of the 2004 USS Nimitz UAP Encounter.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "F/A-18", "type": "object"}, {"name": "USS Nimitz", "type": "object"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}, {"name": "Top Gun Naval Flight School", "type": "organisation"}]}, {"loc": "00:06:40.8-00:06:57.3", "bk": 400, "text": "Alex Dietrich flew as wingman to David Fravor during the 2004 USS Nimitz UAP Encounter.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "and flying at his wing, Lieutenant Alex Dietrich, who has never spoken publicly about the encounter.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Fravor, David", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}, {"name": "USS Nimitz", "type": "object"}]}, {"loc": "00:06:40.8-00:06:57.3", "bk": 400, "text": "Prior to appearing on 60 Minutes in 2021, Alex Dietrich had never spoken publicly about the 2004 USS Nimitz UAP Encounter.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "Lieutenant Alex Dietrich, who has never spoken publicly about the encounter.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}, {"name": "60 Minutes", "type": "organisation"}]}, {"loc": "00:07:02.7-00:07:14.4", "bk": 420, "text": "Alex Dietrich chose to speak publicly about the 2004 USS Nimitz UAP Encounter because she was flying a government aircraft on duty, and the information is unclassified.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Dietrich, Alex", "quote": "Because I was in a government aircraft, because I was on the clock, and so I feel a responsibility to share what I can, and it is unclassified.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}, {"name": "F/A-18", "type": "object"}]}, {"loc": "00:07:14.4-00:07:23.1", "bk": 432, "text": "In 2004-11-14, the USS Nimitz Carrier Strike Group was training approximately 160 kilometres south-west of San Diego.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego.", "refs": [{"name": "USS Nimitz Carrier Strike Group", "type": "organisation"}, {"name": "USS Nimitz", "type": "object"}, {"name": "USA, California, San Diego", "type": "place"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}]}, {"loc": "00:07:23.1-00:07:39.3", "bk": 440, "text": "For a week before 2004-11-14, the advanced radar on the USS Princeton had detected multiple Anomalous Aerial Vehicles (AAV) over the horizon, observed descending approximately 24,000 metres in less than a second.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 80,000 feet in less than a second.", "refs": [{"name": "USS Princeton", "type": "object"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}, {"name": "USS Nimitz Carrier Strike Group", "type": "organisation"}]}, {"loc": "00:07:39.3-00:07:47.8", "bk": 456, "text": "On 2004-11-14, David Fravor and Alex Dietrich, each with a weapons system officer in the back seat, were diverted from training to investigate the UAP contacts.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}, {"name": "F/A-18", "type": "object"}]}, {"loc": "00:07:47.8-00:07:55.9", "bk": 464, "text": "During the 2004 USS Nimitz UAP Encounter, the pilots found an area of disturbed white water approximately the size of a Boeing 737 in an otherwise calm sea.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "They found an area of roiling white water the size of a 737 in an otherwise calm blue sea.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}]}, {"loc": "00:07:55.9-00:08:12.3", "bk": 472, "text": "During the 2004 USS Nimitz UAP Encounter, David Fravor observed a small white UAP moving above an area of disturbed white water.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "And we saw this little white tic-tac-looking object. And it's just kind of moving above the whitewater area.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:08:12.3-00:08:17.9", "bk": 492, "text": "During the 2004 USS Nimitz UAP Encounter, Alex Dietrich circled above whilst David Fravor descended for a closer look at the UAP.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "As Dietrich circled above, Fravor went in for a closer look.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Fravor, David", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}, {"name": "F/A-18", "type": "object"}]}, {"loc": "00:08:18.5-00:08:27.0", "bk": 496, "text": "During the 2004 USS Nimitz UAP Encounter, the UAP was observed oriented north\u2013south and then turned abruptly to mirror David Fravor's aircraft as he descended towards it.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "The tic-tac's still pointing north-south. It goes and just turns abruptly and starts mirroring me. So as I'm coming down, it starts coming up.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:08:27.0-00:08:30.5", "bk": 504, "text": "David Fravor assessed that the UAP during the 2004 USS Nimitz UAP Encounter appeared to be aware of the presence of his aircraft.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Fravor, David", "quote": "Yeah, it was aware we were there.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:08:30.5-00:08:37.0", "bk": 508, "text": "The UAP observed during the 2004 USS Nimitz UAP Encounter was approximately the same size as an F/A-18 aircraft.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "He said it was about the size of his F-18", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "F/A-18", "type": "object"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:08:30.5-00:08:37.0", "bk": 508, "text": "The UAP observed during the 2004 USS Nimitz UAP Encounter had no markings.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "with no markings, no wings, no exhaust plumes.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:08:30.5-00:08:37.0", "bk": 508, "text": "The UAP observed during the 2004 USS Nimitz UAP Encounter had no wings.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "with no markings, no wings, no exhaust plumes.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:08:30.5-00:08:37.0", "bk": 508, "text": "The UAP observed during the 2004 USS Nimitz UAP Encounter had no exhaust plumes.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "with no markings, no wings, no exhaust plumes.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:08:37.0-00:08:48.4", "bk": 516, "text": "During the 2004 USS Nimitz UAP Encounter, as David Fravor attempted to close on the UAP, it accelerated and disappeared from view.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "I want to see how close I can get. So I go like this, and it's climbing still. And when it gets right in front of me, it just disappears.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:08:50.9-00:09:03.3", "bk": 528, "text": "Alex Dietrich initially attempted to categorise the UAP during the 2004 USS Nimitz UAP Encounter as a helicopter or a drone.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Dietrich, Alex", "quote": "I'm going to categorize this as maybe a helicopter or maybe a drone. And when it disappeared, I mean, it was just...", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:09:03.5-00:09:08.9", "bk": 540, "text": "All four occupants of the two F/A-18 aircraft observed the UAP during the 2004 USS Nimitz UAP Encounter for approximately five minutes.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "There was four of us in the airplanes literally watching this thing for roughly about five minutes.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}, {"name": "F/A-18", "type": "object"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:09:08.9-00:09:14.4", "bk": 548, "text": "Seconds after the UAP disappeared from David Fravor's view, the USS Princeton reacquired the target approximately 100 kilometres away.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Seconds later, the Princeton reacquired the target, 60 miles away.", "refs": [{"name": "USS Princeton", "type": "object"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:09:14.4-00:09:20.8", "bk": 552, "text": "After the 2004 USS Nimitz UAP Encounter, another aircrew briefly locked onto the UAP with a targeting camera before it departed again.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "Another crew managed to briefly lock onto it with a targeting camera before it zipped off again.", "refs": [{"name": "2004 USS Nimitz UAP Encounter", "type": "event"}, {"name": "Nimitz UAP FLIR Targeting Camera Footage", "type": "document"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:09:20.8-00:09:31.1", "bk": 560, "text": "Alex Dietrich reflected that, had she witnessed the UAP during the 2004 USS Nimitz UAP Encounter alone, she may not have reported it because it sounds so implausible.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Dietrich, Alex", "quote": "hey, man, if I saw this solo, I don't know that I would have come back and said anything because it sounds so crazy when I say it.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:09:37.4-00:09:56.5", "bk": 576, "text": "David Fravor does not consider himself a UFO enthusiast, but asserts that something he encountered during the 2004 USS Nimitz UAP Encounter was more capable than his F/A-18.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Fravor, David", "quote": "I'll be honest. I'm not a UFO guy. [Bill Whitaker: But from what I hear you guys saying, there's something.] Yes. There's definitely something that, I don't know who's building it, who's got the technology, who's got the brains, but there's something out there that was better than our airplane.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "F/A-18", "type": "object"}]}, {"loc": "00:09:56.5-00:10:13.2", "bk": 596, "text": "After the 2004 USS Nimitz UAP Encounter, the aircrew filed reports, but no official action was taken for five years.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "The air crew filed reports. Then, like the mysterious flying object, the Nimitz encounter disappeared. Nothing was said or done officially for five years", "refs": [{"name": "2004 USS Nimitz UAP Encounter", "type": "event"}, {"name": "USS Nimitz", "type": "object"}, {"name": "United States Navy", "type": "organisation"}]}, {"loc": "00:10:04.2-00:10:13.2", "bk": 604, "text": "Luis Elizondo came across the account of the 2004 USS Nimitz UAP Encounter approximately five years after the event and investigated it as part of AATIP.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "until Lou Elizondo came across the story and investigated.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:10:13.2-00:10:27.7", "bk": 612, "text": "Luis Elizondo considers the UAP pilot sightings compelling because they are corroborated by electro-optical gun camera footage and radar data.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Elizondo, Luis", "quote": "We spend millions of dollars in training these pilots, and they are seeing something that they can't explain. Furthermore, that information's being backed up on electro-optical data, like gun camera footage, and by radar data. Now, to me, that's compelling.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "United States Navy", "type": "organisation"}]}, {"loc": "00:10:27.7-00:10:31.7", "bk": 624, "text": "Inside the Pentagon, Luis Elizondo's AATIP findings were met with scepticism.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "Inside the Pentagon, his findings were met with skepticism.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "USA, Virginia, Pentagon", "type": "place"}, {"name": "United States Department of Defense (DoD)", "type": "organisation"}]}, {"loc": "00:10:31.7-00:10:39.5", "bk": 628, "text": "The funding for the Advanced Aerospace Threat Identification Program (AATIP) was eliminated in 2012.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "AATIP's funding was eliminated in 2012", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:10:31.7-00:10:39.5", "bk": 628, "text": "After AATIP's funding was eliminated in 2012, Luis Elizondo and a small number of others kept the programme's mission active.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "but Elizondo says he and a handful of others kept the mission alive.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:10:39.5-00:10:48.8", "bk": 636, "text": "Luis Elizondo resigned from the Pentagon in 2017, frustrated by the lack of action on UAP.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "until finally, frustrated, he quit the Pentagon in 2017", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "USA, Virginia, Pentagon", "type": "place"}, {"name": "United States Department of Defense (DoD)", "type": "organisation"}]}, {"loc": "00:10:39.5-00:10:48.8", "bk": 636, "text": "Before resigning from the Pentagon in 2017, Luis Elizondo secured the declassification of three UAP videos.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "but not before getting these three videos declassified.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Nimitz UAP FLIR Targeting Camera Footage", "type": "document"}, {"name": "USA, Virginia, Pentagon", "type": "place"}, {"name": "United States Department of Defense (DoD)", "type": "organisation"}]}, {"loc": "00:10:51.9-00:10:57.5", "bk": 648, "text": "Christopher Mellon attempted to help Luis Elizondo elevate the UAP issue within the Department of Defense and get it to the Secretary of Defense.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Mellon, Christopher", "quote": "I tried to help my colleague, Lou Elizondo, elevate the issue in the department and actually get it to the Secretary of Defense.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Elizondo, Luis", "type": "person"}, {"name": "United States Department of Defense (DoD)", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:10:57.5-00:11:08.4", "bk": 656, "text": "Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence under Presidents Clinton and George W. Bush.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "United States Department of Defense (DoD)", "type": "organisation"}]}, {"loc": "00:10:57.5-00:11:08.4", "bk": 656, "text": "Christopher Mellon had access to top-secret US government programmes during his time as Deputy Assistant Secretary of Defense for Intelligence.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "and had access to top-secret government programs.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "United States Department of Defense (DoD)", "type": "organisation"}]}, {"loc": "00:11:08.4-00:11:18.7", "bk": 668, "text": "Christopher Mellon assesses with a high degree of confidence that the observed UAP are not US technology, based on the positions he held within the Department of Defense and his knowledge of its processes.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Mellon, Christopher", "quote": "So it's not us, that's one thing we know. [Bill Whitaker: We know that?] I could say that with a very high degree of confidence, in part because of the positions I held in the department, and I know the process.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "United States Department of Defense (DoD)", "type": "organisation"}]}, {"loc": "00:11:18.7-00:11:26.2", "bk": 676, "text": "Christopher Mellon grew concerned that nothing was being done about UAP within the government.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "Mellon says he grew concerned nothing was being done about UAPs", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "United States Department of Defense (DoD)", "type": "organisation"}]}, {"loc": "00:11:26.2-00:11:37.0", "bk": 684, "text": "In 2017, acting as a private citizen, Christopher Mellon surreptitiously acquired the three declassified US Navy UAP videos and leaked them to The New York Times.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "In 2017, as a private citizen, he surreptitiously acquired the three Navy videos Elizondo had declassified and leaked them to The New York Times.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Elizondo, Luis", "type": "person"}, {"name": "The New York Times", "type": "organisation"}, {"name": "Nimitz UAP FLIR Targeting Camera Footage", "type": "document"}, {"name": "United States Navy", "type": "organisation"}]}, {"loc": "00:11:37.0-00:11:46.1", "bk": 696, "text": "Christopher Mellon considers it bizarre and unfortunate that a private individual had to leak classified-adjacent information to get a national security issue such as UAP onto the public agenda.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Mellon, Christopher", "quote": "It's bizarre and unfortunate that someone like myself has to do something like that to get a national security issue like this on the agenda.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "The New York Times", "type": "organisation"}]}, {"loc": "00:11:57.6-00:12:07.2", "bk": 716, "text": "Christopher Mellon and Luis Elizondo's strategy was to engage the public first, in order to prompt Congress to take interest in UAP and in turn pressure the Department of Defense to investigate.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Mellon, Christopher", "quote": "We knew and understood that you had to go to the public, get the public interested to get Congress interested, to then circle back to the Defense Department and get them to start taking a look at it.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Elizondo, Luis", "type": "person"}, {"name": "United States Congress", "type": "organisation"}, {"name": "United States Department of Defense (DoD)", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:12:07.2-00:12:15.6", "bk": 724, "text": "In August 2020, the Pentagon relaunched the Advanced Aerospace Threat Identification Program (AATIP) under the new name UAP Task Force.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "This past August, the Pentagon resurrected AATIP. It's now called the UAP Task Force.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "UAP Task Force", "type": "project"}, {"name": "USA, Virginia, Pentagon", "type": "place"}, {"name": "United States Department of Defense (DoD)", "type": "organisation"}]}, {"loc": "00:12:15.6-00:12:20.1", "bk": 732, "text": "Following the establishment of the UAP Task Force, US service members are now encouraged to report strange aerial encounters.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "Service members now are encouraged to report strange encounters.", "refs": [{"name": "UAP Task Force", "type": "project"}, {"name": "United States Department of Defense (DoD)", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:12:22.6-00:12:26.5", "bk": 740, "text": "Marco Rubio considers any object that enters airspace where it is not supposed to be a threat.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Rubio, Marco", "quote": "Anything that enters an airspace that's not supposed to be there is a threat.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:12:26.5-00:12:34.0", "bk": 744, "text": "Marco Rubio received classified briefings on Unidentified Aerial Phenomena (UAP).", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "After receiving classified briefings on UAPs, Senator Marco Rubio called for a detailed analysis.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "US Senate Select Committee on Intelligence", "type": "organisation"}]}, {"loc": "00:12:26.5-00:12:34.0", "bk": 744, "text": "Marco Rubio called for a detailed analysis of UAP after receiving classified briefings on the subject.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "After receiving classified briefings on UAPs, Senator Marco Rubio called for a detailed analysis.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "US Senate Select Committee on Intelligence", "type": "organisation"}]}, {"loc": "00:12:34.0-00:12:46.3", "bk": 752, "text": "While still head of the Senate Intelligence Committee in December 2020, Marco Rubio asked the Director of National Intelligence and the Pentagon to present Congress with an unclassified UAP report by June 2021.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "US Senate Select Committee on Intelligence", "type": "organisation"}, {"name": "Office of the Director of National Intelligence (ODNI)", "type": "organisation"}, {"name": "United States Department of Defense (DoD)", "type": "organisation"}, {"name": "United States Congress", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:12:59.0-00:13:06.9", "bk": 776, "text": "Marco Rubio acknowledges there is a stigma on Capitol Hill around the UAP issue, with some colleagues being interested and others dismissive.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Rubio, Marco", "quote": "You know, there's a stigma on Capitol Hill. I mean, some of my colleagues are very interested in this topic and some kind of, you know, giggle when you bring it up.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "United States Senate", "type": "organisation"}]}, {"loc": "00:13:06.9-00:13:12.2", "bk": 784, "text": "Marco Rubio believes the stigma around UAP on Capitol Hill should not prevent a fundamental question about UAP from being answered.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Rubio, Marco", "quote": "But I don't think we can allow the stigma to keep us from having an answer to a very fundamental question.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "United States Senate", "type": "organisation"}]}, {"loc": "00:13:14.1-00:13:28.3", "bk": 792, "text": "Marco Rubio wants UAP sightings to be taken seriously, with a cataloguing and analysis process established so that incoming data is systematically reviewed until answers are obtained.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Rubio, Marco", "quote": "I want us to take it seriously and have a process to take it seriously. I want us to have a process to analyze the data. every time it comes in, that there be a place where this is cataloged and constantly analyzed until we get some answers.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "UAP Task Force", "type": "project"}]}, {"loc": "00:13:37.3-00:13:41.7", "bk": 816, "text": "Alex Dietrich felt vulnerable during the 2004 USS Nimitz UAP Encounter due to having nothing to defend herself with.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Dietrich, Alex", "quote": "I felt the vulnerability of not having anything to defend ourselves.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}, {"name": "F/A-18", "type": "object"}]}, {"loc": "00:00:14.9-00:00:44.4", "bk": 12, "text": "The US Senate Intelligence Committee ordered the Director of National Intelligence and the Secretary of Defense to deliver a report on UAP sightings within the following month.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "the u.s senate wants to know what it is the intelligence committee has ordered the director of national intelligence and the secretary of defense to deliver a report on the mysterious sightings by next month", "refs": [{"name": "US Senate Select Committee on Intelligence", "type": "organisation"}, {"name": "Office of the Director of National Intelligence (ODNI)", "type": "organisation"}, {"name": "United States Department of Defense (DoD)", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}], "nodes_by_type": {"person": ["Whitaker, Bill", "Elizondo, Luis", "Graves, Ryan", "Fravor, David", "Dietrich, Alex", "Mellon, Christopher", "Rubio, Marco", "Reid, Harry"], "organisation": ["United States Navy", "United States Department of Defense (DoD)", "United States Senate", "US Senate Select Committee on Intelligence", "Office of the Director of National Intelligence (ODNI)", "60 Minutes", "The New York Times", "History Channel", "United States Congress", "Top Gun Naval Flight School", "USS Nimitz Carrier Strike Group"], "project": ["Advanced Aerospace Threat Identification Program (AATIP)", "UAP Task Force", "Project Blue Book"], "place": ["USA, California, San Diego", "USA, Virginia, Virginia Beach", "USA, Florida, Jacksonville", "USA, Virginia, Pentagon", "Cuba, Guantanamo Bay"], "event": ["2004 USS Nimitz UAP Encounter", "2015 Atlantic Coast UAP Sightings", "2014-2019 US East Coast UAP Sightings"], "object": ["USS Nimitz", "USS Princeton", "F/A-18"], "document": ["Nimitz UAP FLIR Targeting Camera Footage", "Navy pilots describe encounters with UFOs (60 Minutes, 2021)"], "topic": ["Unidentified Aerial Phenomena (UAP)", "Anomalous Aerial Vehicle (AAV)"]}, "n_claims": 94, "n_nodes": 37, "label": "4: assertion+node sweep (FINAL)"}]};const SRC={"0": [{"sec": 1, "spk": "Bill Whitaker", "text": "We have tackled many strange stories on 60 Minutes, but perhaps none like this."}], "4": [{"sec": 7, "spk": "Bill Whitaker", "text": "It's the story of the U.S."}], "8": [{"sec": 9, "spk": "Bill Whitaker", "text": "government's grudging acknowledgement of Unidentified Aerial Phenomena, UAP,"}], "12": [{"sec": 14, "spk": "Bill Whitaker", "text": "more commonly known as ufos after decades of public denial the pentagon now admits there's something out there and the u.s senate wants to know what it is the intelligence committee has ordered the director of national intelligence and the secretary of defense to deliver a report on the mysterious sightings by next month the story will continue in a moment"}], "44": [{"sec": 44, "spk": "Bill Whitaker", "text": "So what you're telling me is that UFOs, unidentified flying objects, are real."}], "52": [{"sec": 54, "spk": "Luis Elizondo", "text": "Bill, I think we're beyond that already."}], "56": [{"sec": 56, "spk": "Luis Elizondo", "text": "The government has already stated for the record that they're real."}, {"sec": 58, "spk": "Luis Elizondo", "text": "I'm not telling you that."}, {"sec": 59, "spk": "Luis Elizondo", "text": "The United States government is telling you that."}], "60": [{"sec": 62, "spk": "Bill Whitaker", "text": "Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo."}], "68": [{"sec": 71, "spk": "Bill Whitaker", "text
