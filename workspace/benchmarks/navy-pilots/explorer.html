</div><div class="wrap"><div id="claimsView"></div><div id="nodesView" class="hidden"></div></div><script>const DATA={"haiku": [{"claims": [{"loc": "00:01:02.4-00:01:11.5", "bk": 60, "text": "Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Bill Whitaker", "quote": "Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo.", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:01:09.1-00:01:15.6", "bk": 68, "text": "Luis Elizondo had not considered Unidentified Aerial Phenomena (UAP) until 2008.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Bill Whitaker", "quote": "He hadn't given UFOs a second thought until 2008.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:01:15.6-00:01:21.5", "bk": 72, "text": "In 2008, Luis Elizondo was asked to join the Advanced Aerospace Threat Identification Program (AATIP) at the Pentagon.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Bill Whitaker", "quote": "That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "USA, District of Columbia, The Pentagon", "type": "place"}]}, {"loc": "00:01:24.1-00:01:34.3", "bk": 84, "text": "The mission of the Advanced Aerospace Threat Identification Program (AATIP) was to collect and analyze information on anomalous aerial vehicles, also called Unidentified Aerial Phenomena (UAP).", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Luis Elizondo", "quote": "The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs. We call them UAPs.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:00:54.6-00:00:59.6", "bk": 52, "text": "The United States government has stated for the record that Unidentified Aerial Phenomena (UAP) are real.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Luis Elizondo", "quote": "The government has already stated for the record that they're real.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "United States Department of Defense", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:01:50.3-00:02:01.6", "bk": 108, "text": "The Advanced Aerospace Threat Identification Program (AATIP) was part of a 22 million dollar program sponsored by Senator Harry Reid to investigate Unidentified Flying Objects (UFO).", "att": "second_hand", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "Buried away in the Pentagon, AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Reid, Harry", "type": "person"}]}, {"loc": "00:02:01.6-00:02:10.8", "bk": 120, "text": "In 2010, Luis Elizondo took over AATIP and focused on the national security implications of Unidentified Aerial Phenomena (UAP) documented by U.S. service members.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Bill Whitaker", "quote": "When Elizondo took over in 2010, he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "During Advanced Aerospace Threat Identification Program (AATIP) observations, objects demonstrated acceleration capabilities of 600 to 700 G-forces.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Luis Elizondo", "quote": "Imagine a technology that can do 600 to 700 G-forces", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "During Advanced Aerospace Threat Identification Program (AATIP) observations, objects were capable of flight at approximately 21,000 kilometres per hour.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Luis Elizondo", "quote": "that can fly at 13,000 miles an hour", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "During Advanced Aerospace Threat Identification Program (AATIP) observations, objects could evade radar detection.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Luis Elizondo", "quote": "that can evade radar", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "During Advanced Aerospace Threat Identification Program (AATIP) observations, objects could traverse air, water, and possibly space.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Luis Elizondo", "quote": "that can fly through air and water and possibly space", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "During Advanced Aerospace Threat Identification Program (AATIP) observations, objects showed no visible propulsion systems, wings, or control surfaces.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Luis Elizondo", "quote": "has no obvious signs of propulsion, no wings, no control surfaces", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "During Advanced Aerospace Threat Identification Program (AATIP) observations, objects appeared to defy Earth's gravitational effects.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Luis Elizondo", "quote": "yet still can defy the natural effects of Earth's gravity", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:02:37.0-00:02:47.7", "bk": 156, "text": "The Advanced Aerospace Threat Identification Program (AATIP) was composed of scientists, electro-optical engineers, avionics specialists, and intelligence experts, often working part-time.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Luis Elizondo", "quote": "Elizondo tells us AATIP was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:02:47.7-00:03:02.1", "bk": 164, "text": "A Navy aircrew struggled to lock onto a fast-moving Unidentified Aerial Phenomena (UAP) object off the Atlantic coast in 2015.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "", "quote": "A Navy aircrew struggles to lock onto a fast-moving object off the U.S. Atlantic coast in 2015.", "refs": [{"name": "United States Navy", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:03:07.3-00:03:20.4", "bk": 184, "text": "The Pentagon acknowledges it cannot identify several observed Unidentified Aerial Phenomena (UAP) objects.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "the Pentagon admits it doesn't know what in the world this is, or this, or this.", "refs": [{"name": "United States Department of Defense", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:03:30.4-00:03:38.6", "bk": 208, "text": "Some Unidentified Aerial Phenomena (UAP) observations have simple explanations such as refracted light, weather balloons, or rocket launches, while others do not.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Luis Elizondo", "quote": "In some cases, there are simple explanations for what people are witnessing, but there are some that are not.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:03:42.7-00:03:48.2", "bk": 220, "text": "The Advanced Aerospace Threat Identification Program (AATIP) investigated whether observed Unidentified Aerial Phenomena (UAP) might be new cruise missile technology developed by China.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Luis Elizondo", "quote": "Is it some sort of new type of cruise missile technology that China has developed?", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:03:48.2-00:03:52.6", "bk": 228, "text": "The Advanced Aerospace Threat Identification Program (AATIP) investigated whether observed Unidentified Aerial Phenomena (UAP) might be high-altitude reconnaissance balloons.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Luis Elizondo", "quote": "Is it some sort of high-altitude balloon that's conducting reconnaissance?", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:03:48.2-00:03:52.6", "bk": 228, "text": "After exhausting alternative explanations, confirmed Unidentified Aerial Phenomena (UAP) observations represent objects in national airspace of unknown origin, becoming a national security concern.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Luis Elizondo", "quote": "Ultimately, when you have exhausted all those what-ifs and you're still left with the fact that this is in our airspace and it's real, that's when it becomes compelling and that's when it becomes problematic.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:06.2-00:04:12.9", "bk": 244, "text": "Former Navy pilot Lieutenant Ryan Graves considers Unidentified Aerial Phenomena (UAP) a security risk.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Bill Whitaker", "quote": "Former Navy pilot Lieutenant Ryan Graves calls whatever is out there a security risk.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "United States Navy", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:12.9-00:04:29.7", "bk": 252, "text": "In 2014, Ryan Graves' F-18 fighter squadron began observing Unidentified Aerial Phenomena (UAP) hovering over restricted airspace southeast of Virginia Beach.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Ryan Graves", "quote": "His F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "USA, Virginia, Virginia Beach", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Virginia Beach Airspace UAP Sightings (2014-2016)", "type": "event"}]}, {"loc": "00:04:12.9-00:04:29.7", "bk": 252, "text": "After updating their jet radar systems, Ryan Graves' squadron was able to detect Unidentified Aerial Phenomena (UAP) with both radar and infrared targeting cameras.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Ryan Graves", "quote": "when they updated their jet's radar, making it possible to zero in with infrared targeting cameras", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:29.7-00:04:37.1", "bk": 268, "text": "Simultaneous detection of Unidentified Aerial Phenomena (UAP) on both radar and infrared targeting cameras confirms the physical reality of the objects.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Ryan Graves", "quote": "So you're seeing it both with the radar and with the infrared, and that tells you that there is something out there.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:38.6-00:04:43.0", "bk": 276, "text": "Photographs of Unidentified Aerial Phenomena (UAP) were taken in 2019 in the Virginia Beach area.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "These photographs were taken in 2019 in the same area.", "refs": [{"name": "USA, Virginia, Virginia Beach", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:43.0-00:04:48.2", "bk": 280, "text": "The Pentagon confirmed it cannot identify Unidentified Aerial Phenomena (UAP) objects photographed in Virginia Beach in 2019.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "The Pentagon confirms these are images of objects it can't identify.", "refs": [{"name": "United States Department of Defense", "type": "organisation"}, {"name": "USA, Virginia, Virginia Beach", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:48.2-00:04:56.6", "bk": 288, "text": "Navy pilots training off the Atlantic coast observe Unidentified Aerial Phenomena (UAP) daily for extended periods, spanning at least a couple of years.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Ryan Graves", "quote": "pilots training off the Atlantic coast see things like that all the time... Every day. Every day for at least a couple of years.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "United States Navy", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:55.3-00:05:04.3", "bk": 292, "text": "A Unidentified Aerial Phenomena (UAP) object observed off Jacksonville, Florida in 2015 showed no visible exhaust plume.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Ryan Graves", "quote": "You know, I don't see an exhaust plume.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "USA, Florida, Jacksonville", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:05:04.3-00:05:12.8", "bk": 304, "text": "In 2015, members of Ryan Graves' F-18 squadron captured a targeting camera image of a rotating Unidentified Aerial Phenomena (UAP) object off Jacksonville, Florida.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Ryan Graves", "quote": "off the coast of Jacksonville, Florida in 2015, captured on a targeting camera by members of Graves' squadron", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "USA, Florida, Jacksonville", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:05:35.8-00:05:42.8", "bk": 332, "text": "Unidentified Aerial Phenomena (UAP) objects observed off Jacksonville, Florida in 2015 exhibited rotation at high altitude with apparent propulsion.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Ryan Graves", "quote": "You have rotation, you have high altitudes, you have propulsion, right? I don't know. I don't know what it is, frankly.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "USA, Florida, Jacksonville", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:05:44.9-00:05:50.0", "bk": 344, "text": "Navy pilots speculate Unidentified Aerial Phenomena (UAP) are either secret U.S. military technology, an adversary spy vehicle, or non-terrestrial in origin.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Ryan Graves", "quote": "pilots speculate they are one of three things, secret U.S. technology, an adversary spy vehicle, or something otherworldly.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "United States Navy", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:05:56.0-00:06:00.5", "bk": 356, "text": "Ryan Graves assesses the highest probability is that observed Unidentified Aerial Phenomena (UAP) represent a secret surveillance program.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Ryan Graves", "quote": "I'd say, you know, the highest probability is it's a threat observation program.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:06:00.5-00:06:04.1", "bk": 360, "text": "Ryan Graves considers Russian or Chinese technology as a possible explanation for observed Unidentified Aerial Phenomena (UAP).", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Ryan Graves", "quote": "Could it be Russian or Chinese technology? I don't see why not.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:06:04.1-00:06:18.5", "bk": 364, "text": "Ryan Graves is concerned about Unidentified Aerial Phenomena (UAP) observations, viewing them as potential threats comparable to foreign military aircraft.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Ryan Graves", "quote": "I am worried, frankly... if these were tactical jets from another country that were hanging out up there, it would be a massive issue.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:06:23.4-00:06:30.3", "bk": 380, "text": "Project Blue Book investigation of Unidentified Flying Objects (UFO) was closed in 1969.", "att": "second_hand", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "The government has ignored it, at least publicly, since closing its Project Blue Book investigation in 1969.", "refs": [{"name": "Project Blue Book", "type": "project"}]}, {"loc": "00:06:30.3-00:06:40.8", "bk": 388, "text": "A significant Unidentified Aerial Phenomena (UAP) incident occurred off Southern California in 2004, documented by radar, camera, and eyewitness accounts from four naval aviators.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "But that began to change after an incident off Southern California in 2004, which was documented by radar, by camera, and four naval aviators.", "refs": [{"name": "USA, California, San Diego", "type": "place"}, {"name": "Nimitz Carrier Strike Group UAP Encounter (2004)", "type": "event"}, {"name": "United States Navy", "type": "organisation"}]}, {"loc": "00:06:40.8-00:06:43.0", "bk": 400, "text": "David Fravor is a graduate of the Top Gun Naval Flight School and commanded an F-18 fighter squadron on the USS Nimitz.", "att": "second_hand", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Top Gun Naval Flight School", "type": "organisation"}, {"name": "USS Nimitz", "type": "object"}]}, {"loc": "00:06:40.8-00:06:43.0", "bk": 400, "text": "Alex Dietrich was flying as David Fravor's wingman during the 2004 Unidentified Aerial Phenomena (UAP) encounter.", "att": "second_hand", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "and flying at his wing, Lieutenant Alex Dietrich", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Fravor, David", "type": "person"}, {"name": "Nimitz Carrier Strike Group UAP Encounter (2004)", "type": "event"}]}, {"loc": "00:06:40.8-00:06:43.0", "bk": 400, "text": "Alex Dietrich has never previously spoken publicly about the 2004 Unidentified Aerial Phenomena (UAP) encounter.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Bill Whitaker", "quote": "Lieutenant Alex Dietrich, who has never spoken publicly about the encounter.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz Carrier Strike Group UAP Encounter (2004)", "type": "event"}]}, {"loc": "00:07:14.4-00:07:23.1", "bk": 432, "text": "In November 2004, the USS Nimitz Carrier Strike Group was conducting training operations approximately 160 kilometres southwest of San Diego.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego.", "refs": [{"name": "USS Nimitz Carrier Strike Group", "type": "organisation"}, {"name": "USA, California, San Diego", "type": "place"}]}, {"loc": "00:07:23.1-00:07:39.3", "bk": 440, "text": "The USS Princeton, equipped with advanced radar, detected multiple anomalous aerial vehicles over the horizon, descending approximately 24,000 metres in less than one second.", "att": "first_hand", "type": "measurement", "cat": "domain", "spk": "", "quote": "the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 80,000 feet in less than a second.", "refs": [{"name": "USS Princeton", "type": "object"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:07:39.3-00:07:47.8", "bk": 456, "text": "On 2004-11-14, David Fravor and Alex Dietrich, each accompanied by a weapons system officer, were diverted to investigate anomalous aerial vehicle observations.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz Carrier Strike Group UAP Encounter (2004)", "type": "event"}]}, {"loc": "00:07:47.8-00:07:55.9", "bk": 464, "text": "Upon arrival at the investigation location, David Fravor and Alex Dietrich observed an area of roiling white water approximately the size of a Boeing 737 in otherwise calm blue sea.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "David Fravor", "quote": "They found an area of roiling white water the size of a 737 in an otherwise calm blue sea.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz Carrier Strike Group UAP Encounter (2004)", "type": "event"}]}, {"loc": "00:07:55.9-00:08:09.7", "bk": 472, "text": "David Fravor observed a small white, tic-tac-shaped object moving above the whitewater area.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "David Fravor", "quote": "I said, dude, do you see that thing down there? And we saw this little white tic-tac-looking object. And it's just kind of moving above the whitewater area.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Unknown Aerial Craft (2004 Nimitz Encounter)", "type": "object"}, {"name": "Nimitz Carrier Strike Group UAP Encounter (2004)", "type": "event"}]}, {"loc": "00:08:17.0-00:08:28.9", "bk": 496, "text": "As David Fravor descended toward the object during the 2004 encounter, the tic-tac-shaped craft abruptly changed orientation and began mirroring his aircraft's movements.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "David Fravor", "quote": "So as I'm coming down, it starts coming up... it was aware we were there.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Unknown Aerial Craft (2004 Nimitz Encounter)", "type": "object"}]}, {"loc": "00:08:30.5-00:08:37.0", "bk": 508, "text": "The observed object during the 2004 encounter was approximately the size of David Fravor's F-18 fighter jet, with no visible markings, wings, or exhaust plumes.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "David Fravor", "quote": "He said it was about the size of his F-18, with no markings, no wings, no exhaust plumes.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Unknown Aerial Craft (2004 Nimitz Encounter)", "type": "object"}]}, {"loc": "00:08:37.0-00:08:47.8", "bk": 516, "text": "During the 2004 encounter, the tic-tac-shaped object accelerated and disappeared from David Fravor's view when it came directly in front of his aircraft.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "David Fravor", "quote": "when it gets right in front of me, it just disappears... It had sped off.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Unknown Aerial Craft (2004 Nimitz Encounter)", "type": "object"}]}, {"loc": "00:08:50.9-00:08:58.3", "bk": 528, "text": "Alex Dietrich attempted to categorize the 2004 encounter object as either a helicopter or drone.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Alex Dietrich", "quote": "I'm going to categorize this as maybe a helicopter or maybe a drone.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Unknown Aerial Craft (2004 Nimitz Encounter)", "type": "object"}]}, {"loc": "00:09:03.5-00:09:08.9", "bk": 540, "text": "The weapons system officers in both aircraft witnessed the 2004 Unidentified Aerial Phenomena (UAP) encounter.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "David Fravor", "quote": "Yeah... Oh, yeah. There was four of us in the airplanes literally watching this thing", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz Carrier Strike Group UAP Encounter (2004)", "type": "event"}]}, {"loc": "00:09:03.5-00:09:08.9", "bk": 540, "text": "The four aircrew members observed the 2004 encounter object for approximately five minutes.", "att": "first_hand", "type": "measurement", "cat": "domain", "spk": "David Fravor", "quote": "There was four of us in the airplanes literally watching this thing for roughly about five minutes.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz Carrier Strike Group UAP Encounter (2004)", "type": "event"}]}, {"loc": "00:09:08.9-00:09:14.4", "bk": 548, "text": "Seconds after losing visual contact, the USS Princeton reacquired the object's radar signal at a distance of approximately 97 kilometres.", "att": "second_hand", "type": "measurement", "cat": "domain", "spk": "Bill Whitaker", "quote": "Seconds later, the Princeton reacquired the target, 60 miles away.", "refs": [{"name": "USS Princeton", "type": "object"}, {"name": "Nimitz Carrier Strike Group UAP Encounter (2004)", "type": "event"}]}, {"loc": "00:09:14.4-00:09:18.0", "bk": 552, "text": "Another aircrew successfully locked onto the 2004 encounter object with a targeting camera before it rapidly departed.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "Another crew managed to briefly lock onto it with a targeting camera before it zipped off again.", "refs": [{"name": "Nimitz Carrier Strike Group UAP Encounter (2004)", "type": "event"}, {"name": "Unknown Aerial Craft (2004 Nimitz Encounter)", "type": "object"}]}, {"loc": "00:09:20.8-00:09:31.1", "bk": 560, "text": "The aircrew involved in the 2004 encounter would not have reported the incident publicly if it had occurred to them individually.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Alex Dietrich", "quote": "if I saw this solo, I don't know that I would have come back and said anything because it sounds so crazy when I say it.", "refs": [{"name": "Dietrich, Alex", "type": "person"}]}, {"loc": "00:09:33.1-00:09:37.4", "bk": 572, "text": "David Fravor acknowledges that publicly reporting unusual aerial observations can damage one's credibility.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "David Fravor", "quote": "I've had some people tell me, you know, when you say that, you can sound crazy.", "refs": [{"name": "Fravor, David", "type": "person"}]}, {"loc": "00:09:37.9-00:09:45.5", "bk": 576, "text": "David Fravor does not identify as a UFO enthusiast but believes there exists technology superior to current U.S. military aircraft.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "David Fravor", "quote": "I'll be honest. I'm not a UFO guy... there's something out there that was better than our airplane.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz Carrier Strike Group UAP Encounter (2004)", "type": "event"}]}, {"loc": "00:09:56.5-00:10:04.2", "bk": 596, "text": "The 2004 Nimitz encounter reports were filed by the aircrew but subsequently ignored officially for five years until Luis Elizondo investigated.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "The air crew filed reports. Then, like the mysterious flying object, the Nimitz encounter disappeared. Nothing was said or done officially for five years until Lou Elizondo came across the story and investigated.", "refs": [{"name": "Nimitz Carrier Strike Group UAP Encounter (2004)", "type": "event"}, {"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:10:13.2-00:10:25.3", "bk": 612, "text": "Luis Elizondo investigated the 2004 Nimitz encounter and found the aircrew's observations, corroborated by electro-optical camera footage and radar data, compelling.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Luis Elizondo", "quote": "We spend millions of dollars in training these pilots, and they are seeing something that they can't explain. Furthermore, that information's being backed up on electro-optical data, like gun camera footage, and by radar data. Now, to me, that's compelling.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Nimitz Carrier Strike Group UAP Encounter (2004)", "type": "event"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:10:27.7-00:10:31.7", "bk": 624, "text": "The Advanced Aerospace Threat Identification Program (AATIP) encountered skepticism regarding its findings within the Pentagon.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "Inside the Pentagon, his findings were met with skepticism.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "USA, District of Columbia, The Pentagon", "type": "place"}]}, {"loc": "00:10:31.7-00:10:39.5", "bk": 628, "text": "The Advanced Aerospace Threat Identification Program (AATIP) funding was eliminated in 2012.", "att": "second_hand", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "AATIP's funding was eliminated in 2012", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:10:31.7-00:10:39.5", "bk": 628, "text": "After AATIP's funding was eliminated in 2012, Luis Elizondo and a small group of colleagues continued the Unidentified Aerial Phenomena (UAP) investigation.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Luis Elizondo", "quote": "but Elizondo says he and a handful of others kept the mission alive.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:10:39.5-00:10:48.8", "bk": 636, "text": "Luis Elizondo departed his position at the Pentagon in 2017.", "att": "second_hand", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "he quit the Pentagon in 2017", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "USA, District of Columbia, The Pentagon", "type": "place"}]}, {"loc": "00:10:39.5-00:10:48.8", "bk": 636, "text": "Before departing the Pentagon in 2017, Luis Elizondo secured the declassification of three Navy Unidentified Aerial Phenomena (UAP) videos.", "att": "second_hand", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "but not before getting these three videos declassified.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Three Navy UAP Videos (Declassified 2017)", "type": "document"}, {"name": "United States Navy", "type": "organisation"}]}, {"loc": "00:10:57.5-00:11:04.3", "bk": 656, "text": "Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence under Presidents Clinton and George W. Bush.", "att": "second_hand", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "United States Department of Defense", "type": "organisation"}]}, {"loc": "00:10:57.5-00:11:04.3", "bk": 656, "text": "Christopher Mellon had access to top-secret government programmes during his service as Deputy Assistant Secretary of Defense for Intelligence.", "att": "second_hand", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "and had access to top-secret government programs.", "refs": [{"name": "Mellon, Christopher", "type": "person"}]}, {"loc": "00:11:08.4-00:11:18.7", "bk": 668, "text": "Christopher Mellon expresses high confidence that observed Unidentified Aerial Phenomena (UAP) are not of United States origin, based on his prior access to classified defence programmes.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Christopher Mellon", "quote": "So it's not us, that's one thing we know... I could say that with a very high degree of confidence, in part because of the positions I held in the department", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:11:26.2-00:11:26.2", "bk": 684, "text": "Christopher Mellon decided to leak the declassified Navy videos to media because he was concerned Unidentified Aerial Phenomena (UAP) was being neglected as a national security issue.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Christopher Mellon", "quote": "Mellon says he grew concerned nothing was being done about UAPs, so he decided to do something.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:11:37.0-00:11:46.1", "bk": 696, "text": "Christopher Mellon views the necessity of leaking classified information as evidence that official channels were inadequately addressing Unidentified Aerial Phenomena (UAP) national security concerns.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Christopher Mellon", "quote": "It's bizarre and unfortunate that someone like myself has to do something like that to get a national security issue like this on the agenda.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:11:57.6-00:12:07.2", "bk": 716, "text": "Luis Elizondo and Christopher Mellon believed public interest was necessary to trigger Congressional and Defense Department action on Unidentified Aerial Phenomena (UAP).", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Christopher Mellon", "quote": "We knew and understood that you had to go to the public, get the public interested to get Congress interested, to then circle back to the Defense Department and get them to start taking a look at it.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Mellon, Christopher", "type": "person"}, {"name": "United States Congress", "type": "organisation"}, {"name": "United States Department of Defense", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:12:07.2-00:12:15.6", "bk": 724, "text": "In August 2020, the Pentagon resurrected the Advanced Aerospace Threat Identification Program (AATIP), rebranding it as the Unidentified Aerial Phenomena Task Force (UAP Task Force).", "att": "second_hand", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "This past August, the Pentagon resurrected AATIP. It's now called the UAP Task Force.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Unidentified Aerial Phenomena Task Force (UAP Task Force)", "type": "project"}, {"name": "USA, District of Columbia, The Pentagon", "type": "place"}]}, {"loc": "00:12:12.6-00:12:20.1", "bk": 732, "text": "The Unidentified Aerial Phenomena Task Force (UAP Task Force) encourages military service members to report observations of unusual aerial phenomena.", "att": "second_hand", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "Service members now are encouraged to report strange encounters.", "refs": [{"name": "Unidentified Aerial Phenomena Task Force (UAP Task Force)", "type": "project"}, {"name": "United States Navy", "type": "organisation"}]}, {"loc": "00:12:20.1-00:12:23.4", "bk": 740, "text": "The United States Senate is seeking answers regarding Unidentified Aerial Phenomena (UAP).", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "And the Senate wants answers.", "refs": [{"name": "United States Senate", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:12:22.6-00:12:26.5", "bk": 740, "text": "Senator Marco Rubio asserts that any unidentified object entering restricted airspace constitutes a national security threat.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Marco Rubio", "quote": "Anything that enters an airspace that's not supposed to be there is a threat.", "refs": [{"name": "Rubio, Marco", "type": "person"}]}, {"loc": "00:12:26.5-00:12:34.0", "bk": 744, "text": "After receiving classified briefings on Unidentified Aerial Phenomena (UAP), Senator Marco Rubio called for detailed analysis.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "After receiving classified briefings on UAPs, Senator Marco Rubio called for a detailed analysis.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:12:34.0-00:12:46.3", "bk": 752, "text": "In December 2020, Senator Marco Rubio, as head of the Senate Select Committee on Intelligence, requested that the Director of National Intelligence and the Pentagon present Congress an unclassified Unidentified Aerial Phenomena (UAP) report by the following month.", "att": "second_hand", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Senate Select Committee on Intelligence", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:12:56.2-00:13:06.9", "bk": 776, "text": "Senator Marco Rubio acknowledges there is social stigma on Capitol Hill regarding Unidentified Aerial Phenomena (UAP) discourse.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Marco Rubio", "quote": "You know, there's a stigma on Capitol Hill... some kind of, you know, giggle when you bring it up.", "refs": [{"name": "Rubio, Marco", "type": "person"}]}, {"loc": "00:12:56.2-00:13:19.7", "bk": 776, "text": "Senator Marco Rubio advocates for systematic analysis of Unidentified Aerial Phenomena (UAP) data rather than allowing social stigma to prevent inquiry.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Marco Rubio", "quote": "I don't think we can allow the stigma to keep us from having an answer to a very fundamental question... I want us to take it seriously and have a process to take it seriously. I want us to have a process to analyze the data.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:13:25.9-00:13:28.3", "bk": 804, "text": "Senator Marco Rubio states that the explanation for Unidentified Aerial Phenomena (UAP) may either be simple or extraordinary.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Marco Rubio", "quote": "Maybe it has a very simple answer. Maybe it doesn't.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:13:35.4-00:13:41.7", "bk": 812, "text": "Alex Dietrich felt vulnerable about the lack of defensive capabilities against Unidentified Aerial Phenomena (UAP) during the 2004 encounter.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Alex Dietrich", "quote": "I felt the vulnerability of not having anything to defend ourselves.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz Carrier Strike Group UAP Encounter (2004)", "type": "event"}]}], "nodes_by_type": {"person": ["Whitaker, Bill", "Elizondo, Luis", "Graves, Ryan", "Fravor, David", "Dietrich, Alex", "Mellon, Christopher", "Reid, Harry", "Rubio, Marco"], "organisation": ["United States Navy", "United States Department of Defense", "United States Senate", "Senate Select Committee on Intelligence", "United States Congress", "60 Minutes", "The New York Times", "The History Channel", "USS Nimitz Carrier Strike Group", "Top Gun Naval Flight School"], "project": ["Advanced Aerospace Threat Identification Program (AATIP)", "Project Blue Book", "Unidentified Aerial Phenomena Task Force (UAP Task Force)"], "place": ["USA, Virginia, Virginia Beach", "USA, Florida, Jacksonville", "USA, California, San Diego", "USA, District of Columbia, The Pentagon"], "event": ["Nimitz Carrier Strike Group UAP Encounter (2004)", "Virginia Beach Airspace UAP Sightings (2014-2016)", "Navy UAP Video Leak to The New York Times (2017)"], "object": ["USS Nimitz", "USS Princeton", "Unknown Aerial Craft (2004 Nimitz Encounter)"], "document": ["60 Minutes: Navy Pilots Describe Encounters with UFOs (May 17, 2021)", "Three Navy UAP Videos (Declassified 2017)"], "topic": ["Unidentified Aerial Phenomena (UAP)"]}, "n_claims": 78, "n_nodes": 34, "label": "baseline"}, {"claims": [{"loc": "00:00:01.8-00:00:14.9", "bk": 0, "text": "During Navy pilots describe encounters with UFOs, 60 Minutes tackled the story of the U.S. government's grudging acknowledgement of Unidentified Aerial Phenomena (UAP), more commonly known as Unidentified Flying Objects (UFOs), after decades of public denial.", "att": "", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "We have tackled many strange stories on 60 Minutes, but perhaps none like this. It's the story of the U.S. government's grudging acknowledgement of Unidentified Aerial Phenomena, UAP, more commonly known as ufos after decades of public denial", "refs": [{"name": "60 Minutes", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:00:14.0-00:00:18.0", "bk": 12, "text": "The U.S. Pentagon now admits there is something unidentified in existence.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "the pentagon now admits there's something out there", "refs": [{"name": "U.S. Pentagon", "type": "organisation"}]}, {"loc": "00:00:14.9-00:00:33.0", "bk": 12, "text": "The U.S. Senate Intelligence Committee has ordered the Director of National Intelligence and Secretary of Defense to deliver a report on mysterious sightings.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "the u.s senate wants to know what it is the intelligence committee has ordered the director of national intelligence and the secretary of defense to deliver a report on the mysterious sightings by next month", "refs": [{"name": "U.S. Senate Intelligence Committee", "type": "organisation"}, {"name": "Director of National Intelligence", "type": "organisation"}, {"name": "Secretary of Defense", "type": "organisation"}]}, {"loc": "00:00:56.3-00:00:59.6", "bk": 56, "text": "Luis Elizondo states that the U.S. government has already stated for the record that Unidentified Flying Objects (UFOs) are real.", "att": "", "type": "testimony", "cat": "domain", "spk": "Luis Elizondo", "quote": "The government has already stated for the record that they're real. I'm not telling you that. The United States government is telling you that.", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:01:02.4-00:01:11.5", "bk": 60, "text": "Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo.", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:01:11.5-00:01:15.6", "bk": 68, "text": "Luis Elizondo had not given Unidentified Flying Objects (UFOs) a second thought until 2008.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "He hadn't given UFOs a second thought until 2008.", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:01:11.5-00:01:24.1", "bk": 68, "text": "In 2008, Luis Elizondo was asked to join the Advanced Aerospace Threat Identification Program (AATIP) at the Pentagon.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "U.S. Pentagon", "type": "organisation"}]}, {"loc": "00:01:24.1-00:01:34.3", "bk": 84, "text": "The mission of the Advanced Aerospace Threat Identification Program (AATIP) was to collect and analyze information involving anomalous aerial vehicles, referred to in vernacular as Unidentified Flying Objects (UFOs), called Unidentified Aerial Phenomena (UAPs) formally.", "att": "", "type": "testimony", "cat": "domain", "spk": "Luis Elizondo", "quote": "The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs. We call them UAPs.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:01:50.3-00:02:01.6", "bk": 108, "text": "The Advanced Aerospace Threat Identification Program (AATIP) was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate Unidentified Flying Objects (UFOs).", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "Buried away in the Pentagon, AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "U.S. Pentagon", "type": "organisation"}, {"name": "Reid, Harry", "type": "person"}]}, {"loc": "00:02:01.6-00:02:10.8", "bk": 120, "text": "When Luis Elizondo took over the Advanced Aerospace Threat Identification Program (AATIP) in 2010, he focused on the national security implications of Unidentified Aerial Phenomena (UAP) documented by U.S. service members.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "When Elizondo took over in 2010, he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "Luis Elizondo describes observed technology capable of performing 600 to 700 G-forces, flying at 13,000 miles per hour, evading radar, flying through air and water and possibly space, with no obvious signs of propulsion, no wings, no control surfaces, and still defying the natural effects of Earth's gravity.", "att": "", "type": "opinion", "cat": "domain", "spk": "Luis Elizondo", "quote": "Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity. That's precisely what we're seeing.", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:02:37.0-00:02:47.7", "bk": 156, "text": "The Advanced Aerospace Threat Identification Program (AATIP) was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time.", "att": "", "type": "testimony", "cat": "domain", "spk": "Luis Elizondo", "quote": "Elizondo tells us AATIP was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:02:57.7-00:03:02.1", "bk": 176, "text": "A Navy aircrew struggled to lock onto a fast-moving object off the U.S. Atlantic coast in 2015.", "att": "", "type": "observation", "cat": "domain", "spk": "", "quote": "A Navy aircrew struggles to lock onto a fast-moving object off the U.S. Atlantic coast in 2015.", "refs": []}, {"loc": "00:03:07.3-00:03:20.4", "bk": 184, "text": "The Pentagon admits it does not know what the unidentified objects shown in video footage are.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "the Pentagon admits it doesn't know what in the world this is, or this, or this.", "refs": [{"name": "U.S. Pentagon", "type": "organisation"}]}, {"loc": "00:03:30.4-00:03:38.6", "bk": 208, "text": "Luis Elizondo states that in some cases there are simple explanations for what people are witnessing, but there are some that are not.", "att": "", "type": "opinion", "cat": "domain", "spk": "Luis Elizondo", "quote": "In some cases, there are simple explanations for what people are witnessing, but there are some that are not.", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:03:44.3-00:03:48.2", "bk": 224, "text": "Luis Elizondo states that the Advanced Aerospace Threat Identification Program (AATIP) considered whether objects could be a new type of cruise missile technology developed by China.", "att": "", "type": "testimony", "cat": "domain", "spk": "Luis Elizondo", "quote": "Is it some sort of new type of cruise missile technology that China has developed?", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:03:48.2-00:03:52.6", "bk": 228, "text": "Luis Elizondo states that the Advanced Aerospace Threat Identification Program (AATIP) considered whether objects could be a high-altitude balloon conducting reconnaissance.", "att": "", "type": "testimony", "cat": "domain", "spk": "Luis Elizondo", "quote": "Is it some sort of high-altitude balloon that's conducting reconnaissance?", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:03:52.6-00:04:06.2", "bk": 232, "text": "Luis Elizondo states that when all conventional explanations have been exhausted and an object is still in U.S. airspace and proven real, it becomes compelling and problematic.", "att": "", "type": "opinion", "cat": "domain", "spk": "Luis Elizondo", "quote": "Ultimately, when you have exhausted all those what-ifs and you're still left with the fact that this is in our airspace and it's real, that's when it becomes compelling and that's when it becomes problematic.", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:04:06.2-00:04:12.9", "bk": 244, "text": "Former Navy pilot Lieutenant Ryan Graves calls the unidentified aerial phenomena a security risk.", "att": "", "type": "testimony", "cat": "domain", "spk": "Bill Whitaker", "quote": "Former Navy pilot Lieutenant Ryan Graves calls whatever is out there a security risk.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:04:12.9-00:04:29.7", "bk": 252, "text": "Ryan Graves' F-18 squadron began seeing Unidentified Aerial Phenomena (UAP) hovering over restricted airspace southeast of USA, Virginia, Virginia Beach in 2014 when they updated their jet's radar, making it possible to zero in with infrared targeting cameras.", "att": "", "type": "testimony", "cat": "domain", "spk": "Ryan Graves", "quote": "He told us his F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar, making it possible to zero in with infrared targeting cameras.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Strike Fighter Squadron with F-18 aircraft off Virginia Beach", "type": "organisation"}, {"name": "USA, Virginia, Virginia Beach", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:37.1", "bk": 276, "text": "Ryan Graves states that objects detected by both radar and infrared targeting cameras are difficult to spoof.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Ryan Graves", "quote": "Pretty hard to spoof that.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:04:38.6-00:04:43.0", "bk": 276, "text": "Photographs of unidentified objects were taken in 2019 in the area southeast of USA, Virginia, Virginia Beach.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "These photographs were taken in 2019 in the same area.", "refs": [{"name": "USA, Virginia, Virginia Beach", "type": "place"}]}, {"loc": "00:04:43.0-00:04:48.2", "bk": 280, "text": "The U.S. Pentagon confirms that photographs taken in 2019 near USA, Virginia, Virginia Beach are images of objects it cannot identify.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "The Pentagon confirms these are images of objects it can't identify.", "refs": [{"name": "U.S. Pentagon", "type": "organisation"}]}, {"loc": "00:04:48.2-00:04:55.3", "bk": 288, "text": "Ryan Graves states that pilots training off the Atlantic coast see unidentified objects every day.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Ryan Graves", "quote": "Lieutenant Graves told us pilots training off the Atlantic coast see things like that all the time.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:04:55.3-00:04:56.6", "bk": 292, "text": "Ryan Graves states that pilots have seen unidentified objects every day for at least a couple of years.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Ryan Graves", "quote": "Every day. Every day for at least a couple of years.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:05:01.2-00:05:02.5", "bk": 300, "text": "Ryan Graves states that the observed objects have no exhaust plume.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Ryan Graves", "quote": "You know, I don't see an exhaust plume.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:05:04.3-00:05:12.8", "bk": 304, "text": "An unidentified object was captured on a targeting camera off the coast of USA, Florida, Jacksonville in 2015 by members of Ryan Graves' squadron.", "att": "", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "including this one, off the coast of Jacksonville, Florida in 2015, captured on a targeting camera by members of Graves' squadron.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "USA, Florida, Jacksonville", "type": "place"}]}, {"loc": "00:05:12.8-00:05:23.8", "bk": 312, "text": "In footage captured off USA, Florida, Jacksonville in 2015, the unidentified object is observed rotating and moving against the wind.", "att": "", "type": "observation", "cat": "domain", "spk": "", "quote": "Look at that thing! It's rotating. My gosh! They're all going against the wind. The wind's 120 knots far west. Look at that thing, dude.", "refs": [{"name": "USA, Florida, Jacksonville", "type": "place"}]}, {"loc": "00:05:27.3-00:05:27.9", "bk": 324, "text": "Ryan Graves states that in the captured footage off USA, Florida, Jacksonville in 2015, the pilots seem amazed at what they were seeing and broke character.", "att": "", "type": "observation", "cat": "domain", "spk": "Ryan Graves", "quote": "They seem to have broke character a bit, and were just kind of amazed at what they were seeing.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "USA, Florida, Jacksonville", "type": "place"}]}, {"loc": "00:05:35.8-00:05:42.8", "bk": 332, "text": "Ryan Graves states that the unidentified object captured off USA, Florida, Jacksonville in 2015 exhibits rotation, high altitude, and propulsion, making it difficult to explain.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Ryan Graves", "quote": "This is a difficult one to explain. You have rotation, you have high altitudes, you have propulsion, right? I don't know. I don't know what it is, frankly.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:04:44.9-00:05:50.0", "bk": 284, "text": "Ryan Graves states that pilots speculate the unidentified objects are one of three things: secret U.S. technology, an adversary spy vehicle, or something otherworldly.", "att": "", "type": "testimony", "cat": "domain", "spk": "Ryan Graves", "quote": "He told us pilots speculate they are one of three things, secret U.S. technology, an adversary spy vehicle, or something otherworldly.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:05:56.0", "bk": 356, "text": "Ryan Graves states that the highest probability is that the unidentified objects are a threat observation program.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Ryan Graves", "quote": "I'd say, you know, the highest probability is it's a threat observation program.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:06:00.5-00:06:04.1", "bk": 360, "text": "Ryan Graves states that the unidentified objects could be Russian or Chinese technology.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Ryan Graves", "quote": "Could it be Russian or Chinese technology? I don't see why not.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:06:05.4-00:06:08.8", "bk": 364, "text": "Ryan Graves states that he is worried about the unidentified objects.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Ryan Graves", "quote": "Are you alarmed? I am worried, frankly.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:06:08.8-00:06:18.5", "bk": 368, "text": "Ryan Graves states that if the unidentified objects were tactical jets from another country, it would be a massive issue, but because they look different, the problem is being ignored.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Ryan Graves", "quote": "You know, if these were tactical jets from another country that were hanging out up there, it would be a massive issue. But because it looks slightly different, we're not willing to actually look at the problem in the face.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:06:18.5", "bk": 376, "text": "Ryan Graves states that the unidentified objects are out there watching every day.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Ryan Graves", "quote": "We're happy to just ignore the fact that these are out there watching us every day.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:06:23.4-00:06:30.3", "bk": 380, "text": "The U.S. government ignored Unidentified Flying Objects (UFOs) publicly since closing its Project Blue Book investigation in 1969.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "The government has ignored it, at least publicly, since closing its Project Blue Book investigation in 1969.", "refs": [{"name": "Project Blue Book", "type": "project"}]}, {"loc": "00:06:30.3-00:06:40.8", "bk": 388, "text": "An Unidentified Aerial Phenomena (UAP) incident occurred off Southern California in 2004, documented by radar, by camera, and four naval aviators.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "But that began to change after an incident off Southern California in 2004, which was documented by radar, by camera, and four naval aviators.", "refs": [{"name": "USA, California, San Diego", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:06:35.4-00:06:40.8", "bk": 392, "text": "David Fravor is a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Top Gun Naval Flight School", "type": "organisation"}, {"name": "USS Nimitz", "type": "object"}]}, {"loc": "00:06:40.8-00:06:57.3", "bk": 400, "text": "Alex Dietrich is a Lieutenant who has never spoken publicly about the Nimitz UAP encounter before the 60 Minutes interview.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "and flying at his wing, Lieutenant Alex Dietrich, who has never spoken publicly about the encounter.", "refs": [{"name": "Dietrich, Alex", "type": "person"}]}, {"loc": "00:07:02.7-00:07:14.4", "bk": 420, "text": "Alex Dietrich states that she agreed to appear on the 60 Minutes interview because she was in a government aircraft, was on the clock, and feels a responsibility to share what she can about the encounter, which is unclassified.", "att": "", "type": "opinion", "cat": "domain", "spk": "Alex Dietrich", "quote": "Because I was in a government aircraft, because I was on the clock, and so I feel a responsibility to share what I can, and it is unclassified.", "refs": [{"name": "Dietrich, Alex", "type": "person"}]}, {"loc": "00:07:14.4-00:07:23.1", "bk": 432, "text": "It was 2004-11-01 (November 2004), and the USS Nimitz Carrier Strike Group was training approximately 160 kilometres (about 100 miles) southwest of USA, California, San Diego.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego.", "refs": [{"name": "USS Nimitz", "type": "object"}, {"name": "Carrier Strike Group 11 (CSG-11)", "type": "organisation"}, {"name": "USA, California, San Diego", "type": "place"}]}, {"loc": "00:07:23.1-00:07:39.3", "bk": 440, "text": "For a week, the advanced new radar on the USS Princeton detected what operators called multiple anomalous aerial vehicles over the horizon, descending approximately 24,000 metres in less than a second.", "att": "", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 80,000 feet in less than a second.", "refs": [{"name": "USS Princeton", "type": "object"}]}, {"loc": "00:07:39.3-00:07:47.8", "bk": 456, "text": "On 2004-11-14, David Fravor and Alex Dietrich, each with a weapons system officer in the backseat, were diverted to investigate the anomalous aerial vehicles detected by USS Princeton radar.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}]}, {"loc": "00:07:47.8-00:07:55.9", "bk": 464, "text": "During the Nimitz UAP encounter, November 2004, David Fravor and Alex Dietrich found an area of roiling white water the size of a 737 in an otherwise calm blue sea.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "They found an area of roiling white water the size of a 737 in an otherwise calm blue sea.", "refs": [{"name": "Nimitz UAP encounter, November 2004", "type": "event"}, {"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}]}, {"loc": "00:07:55.9-00:08:09.7", "bk": 472, "text": "During the Nimitz UAP encounter, November 2004, David Fravor observed a small white tic-tac-looking object moving above the whitewater area.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "David Fravor", "quote": "And we saw this little white tic-tac-looking object. And it's just kind of moving above the whitewater area.", "refs": [{"name": "Nimitz UAP encounter, November 2004", "type": "event"}, {"name": "Fravor, David", "type": "person"}]}, {"loc": "00:08:12.3-00:08:24.5", "bk": 492, "text": "During the Nimitz UAP encounter, November 2004, as David Fravor spiralled down, the tic-tac object began pointing north-south, then turned abruptly and started mirroring his movements.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "David Fravor", "quote": "The tic-tac's still pointing north-south. It goes and just turns abruptly and starts mirroring me. So as I'm coming down, it starts coming up.", "refs": [{"name": "Nimitz UAP encounter, November 2004", "type": "event"}, {"name": "Fravor, David", "type": "person"}]}, {"loc": "00:08:24.5-00:08:28.9", "bk": 504, "text": "During the Nimitz UAP encounter, November 2004, David Fravor states that the tic-tac object was aware of their presence because it mimicked his moves.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "David Fravor", "quote": "Yeah, it was aware we were there.", "refs": [{"name": "Nimitz UAP encounter, November 2004", "type": "event"}, {"name": "Fravor, David", "type": "person"}]}, {"loc": "00:08:27.0-00:08:30.5", "bk": 504, "text": "During the Nimitz UAP encounter, November 2004, David Fravor describes the tic-tac object as approximately the size of his F-18, with no markings, no wings, no exhaust plumes.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "David Fravor", "quote": "He said it was about the size of his F-18, with no markings, no wings, no exhaust plumes.", "refs": [{"name": "Nimitz UAP encounter, November 2004", "type": "event"}, {"name": "Fravor, David", "type": "person"}]}, {"loc": "00:08:37.0-00:08:40.9", "bk": 516, "text": "During the Nimitz UAP encounter, November 2004, as David Fravor moved closer, the tic-tac object climbed and when it got right in front of him, it disappeared.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "David Fravor", "quote": "So I go like this, and it's climbing still. And when it gets right in front of me, it just disappears.", "refs": [{"name": "Nimitz UAP encounter, November 2004", "type": "event"}, {"name": "Fravor, David", "type": "person"}]}, {"loc": "00:08:45.4-00:08:47.8", "bk": 524, "text": "During the Nimitz UAP encounter, November 2004, David Fravor states that the tic-tac object disappeared and had sped off.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "David Fravor", "quote": "Disappears, like gone. It had sped off.", "refs": [{"name": "Nimitz UAP encounter, November 2004", "type": "event"}, {"name": "Fravor, David", "type": "person"}]}, {"loc": "00:08:50.9-00:08:58.3", "bk": 528, "text": "During the Nimitz UAP encounter, November 2004, Alex Dietrich states that when the object disappeared, she tried to make sense of it by categorizing it as maybe a helicopter or drone.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Alex Dietrich", "quote": "So your mind tries to make sense of it. I'm going to categorize this as maybe a helicopter or maybe a drone. And when it disappeared, I mean, it was just...", "refs": [{"name": "Nimitz UAP encounter, November 2004", "type": "event"}, {"name": "Dietrich, Alex", "type": "person"}]}, {"loc": "00:09:00.9-00:09:08.9", "bk": 540, "text": "During the Nimitz UAP encounter, November 2004, the weapons system officers in the backseat of both aircraft also witnessed the tic-tac object.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "David Fravor", "quote": "Did your back seaters see this too? Yeah. Oh, yeah. There was four of us in the airplanes literally watching this thing for roughly about five minutes.", "refs": [{"name": "Nimitz UAP encounter, November 2004", "type": "event"}, {"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}]}, {"loc": "00:09:08.9-00:09:14.4", "bk": 548, "text": "During the Nimitz UAP encounter, November 2004, seconds after the object disappeared, the USS Princeton reacquired the target 96 kilometres (60 miles) away.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "Seconds later, the Princeton reacquired the target, 60 miles away.", "refs": [{"name": "Nimitz UAP encounter, November 2004", "type": "event"}, {"name": "USS Princeton", "type": "object"}]}, {"loc": "00:09:14.4-00:09:20.8", "bk": 552, "text": "During the Nimitz UAP encounter, November 2004, another crew managed to briefly lock onto the tic-tac object with a targeting camera before it zipped off again.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "Another crew managed to briefly lock onto it with a targeting camera before it zipped off again.", "refs": [{"name": "Nimitz UAP encounter, November 2004", "type": "event"}]}, {"loc": "00:09:20.8-00:09:31.1", "bk": 560, "text": "Alex Dietrich states that over drinks with other pilots, they've acknowledged that if any of them had seen this encounter solo, they would not have come back and said anything because it sounds so crazy.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Alex Dietrich", "quote": "You know, I think that over beers, we've sort of said, hey, man, if I saw this solo, I don't know that I would have come back and said anything because it sounds so crazy when I say it.", "refs": [{"name": "Dietrich, Alex", "type": "person"}]}, {"loc": "00:09:33.1-00:09:37.4", "bk": 572, "text": "David Fravor states that some people have told him that talking about the encounter can sound crazy.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "David Fravor", "quote": "I've had some people tell me, you know, when you say that, you can sound crazy.", "refs": [{"name": "Fravor, David", "type": "person"}]}, {"loc": "00:09:37.9-00:09:39.8", "bk": 576, "text": "David Fravor states that he is not a UFO guy.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "David Fravor", "quote": "I'll be honest. I'm not a UFO guy.", "refs": [{"name": "Fravor, David", "type": "person"}]}, {"loc": "00:09:45.5-00:09:56.5", "bk": 584, "text": "David Fravor states that there is something out there that was better than their airplane, though he does not know who is building it or has the technology.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "David Fravor", "quote": "Yes. There's definitely something that, I don't know who's building it, who's got the technology, who's got the brains, but there's something out there that was better than our airplane.", "refs": [{"name": "Fravor, David", "type": "person"}]}, {"loc": "00:09:56.5-00:09:58.7", "bk": 596, "text": "The air crew from the Nimitz UAP encounter, November 2004, filed reports about their observations.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "The air crew filed reports.", "refs": [{"name": "Nimitz UAP encounter, November 2004", "type": "event"}]}, {"loc": "00:09:58.7-00:10:04.2", "bk": 596, "text": "After the Nimitz UAP encounter, November 2004, the encounter disappeared from official acknowledgement for five years until Luis Elizondo came across the story and investigated.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "Then, like the mysterious flying object, the Nimitz encounter disappeared. Nothing was said or done officially for five years until Lou Elizondo came across the story and investigated.", "refs": [{"name": "Nimitz UAP encounter, November 2004", "type": "event"}, {"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:10:13.2-00:10:19.1", "bk": 612, "text": "Luis Elizondo states that the U.S. military spends millions of dollars training pilots, and they are seeing something that they cannot explain.", "att": "", "type": "opinion", "cat": "domain", "spk": "Luis Elizondo", "quote": "We spend millions of dollars in training these pilots, and they are seeing something that they can't explain.", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:10:19.1-00:10:25.3", "bk": 616, "text": "Luis Elizondo states that the pilots' observations are backed up by electro-optical data, such as gun camera footage, and by radar data, which he finds compelling.", "att": "", "type": "opinion", "cat": "domain", "spk": "Luis Elizondo", "quote": "Furthermore, that information's being backed up on electro-optical data, like gun camera footage, and by radar data. Now, to me, that's compelling.", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:10:27.7-00:10:31.7", "bk": 624, "text": "Inside the U.S. Pentagon, Luis Elizondo's findings were met with skepticism.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "Inside the Pentagon, his findings were met with skepticism.", "refs": [{"name": "U.S. Pentagon", "type": "organisation"}, {"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:10:31.7-00:10:39.5", "bk": 628, "text": "The Advanced Aerospace Threat Identification Program (AATIP) funding was eliminated in 2012.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "AATIP's funding was eliminated in 2012", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:10:31.7-00:10:39.5", "bk": 628, "text": "Luis Elizondo states that after Advanced Aerospace Threat Identification Program (AATIP) funding was eliminated in 2012, he and a handful of others kept the mission alive.", "att": "", "type": "testimony", "cat": "domain", "spk": "Luis Elizondo", "quote": "but Elizondo says he and a handful of others kept the mission alive.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:10:39.5-00:10:48.8", "bk": 636, "text": "Luis Elizondo quit the U.S. Pentagon in 2017, but not before getting three videos declassified.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "until finally, frustrated, he quit the Pentagon in 2017, but not before getting these three videos declassified.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "U.S. Pentagon", "type": "organisation"}]}, {"loc": "00:10:51.9-00:10:57.5", "bk": 648, "text": "Christopher Mellon tried to help Luis Elizondo elevate the Unidentified Aerial Phenomena (UAP) issue in the U.S. Department of Defense and get it to the Secretary of Defense.", "att": "", "type": "testimony", "cat": "domain", "spk": "Christopher Mellon", "quote": "I tried to help my colleague, Lou Elizondo, elevate the issue in the department and actually get it to the Secretary of Defense.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Elizondo, Luis", "type": "person"}, {"name": "Secretary of Defense", "type": "organisation"}]}, {"loc": "00:10:57.5-00:11:04.3", "bk": 656, "text": "Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush, and had access to top-secret government programs.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush, and had access to top-secret government programs.", "refs": [{"name": "Mellon, Christopher", "type": "person"}]}, {"loc": "00:11:08.4-00:11:18.7", "bk": 668, "text": "Christopher Mellon states that, based on the positions he held and his knowledge of the process, he can say with very high confidence that Unidentified Aerial Phenomena (UAP) are not United States technology.", "att": "", "type": "testimony", "cat": "domain", "spk": "Christopher Mellon", "quote": "So it's not us, that's one thing we know. I could say that with a very high degree of confidence, in part because of the positions I held in the department, and I know the process.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:11:18.7-00:11:26.2", "bk": 676, "text"
