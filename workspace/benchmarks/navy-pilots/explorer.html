": "He hadn't given UFOs a second thought until 2008."}], "72": [{"sec": 75, "spk": "Bill Whitaker", "text": "That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP."}], "84": [{"sec": 84, "spk": "Luis Elizondo", "text": "The mission of AATIP was quite simple."}, {"sec": 85, "spk": "Luis Elizondo", "text": "It was to collect and analyze information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs."}], "92": [{"sec": 94, "spk": "Luis Elizondo", "text": "We call them UAPs."}, {"sec": 95, "spk": "Bill Whitaker", "text": "You know how this sounds."}], "96": [{"sec": 97, "spk": "Bill Whitaker", "text": "It sounds nutty, wacky."}], "100": [{"sec": 100, "spk": "Luis Elizondo", "text": "Look, Bill, I'm not telling you that it doesn't sound wacky."}], "104": [{"sec": 104, "spk": "Luis Elizondo", "text": "What I'm telling you is real."}, {"sec": 105, "spk": "Luis Elizondo", "text": "The question is, what is it?"}, {"sec": 107, "spk": "Luis Elizondo", "text": "What are its intentions?"}], "108": [{"sec": 108, "spk": "Luis Elizondo", "text": "What are its capabilities?"}, {"sec": 110, "spk": "Bill Whitaker", "text": "Buried away in the Pentagon, AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs."}], "120": [{"sec": 121, "spk": "Bill Whitaker", "text": "When Elizondo took over in 2010, he focused on the national security implications of unidentified aerial phenomena documented by U.S."}], "128": [{"sec": 130, "spk": "Bill Whitaker", "text": "service members."}], "132": [{"sec": 132, "spk": "Luis Elizondo", "text": "Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity."}], "152": [{"sec": 155, "spk": "Luis Elizondo", "text": "That's precisely what we're seeing."}], "156": [{"sec": 157, "spk": "Bill Whitaker", "text": "Elizondo tells us AATIP was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time."}], "164": [{"sec": 167, "spk": "Bill Whitaker", "text": "They combed through data and records and analyzed videos like this."}], "176": [{"sec": 177, "spk": "Bill Whitaker", "text": "A Navy aircrew struggles to lock onto a fast-moving object off the U.S."}], "180": [{"sec": 182, "spk": "Bill Whitaker", "text": "Atlantic coast in 2015."}], "184": [{"sec": 187, "spk": "Bill Whitaker", "text": "Recently released images may not convince UFO skeptics, but the Pentagon admits it doesn't know what in the world this is, or this, or this."}], "200": [{"sec": 200, "spk": "Bill Whitaker", "text": "So what do you say to the skeptics?"}, {"sec": 202, "spk": "Bill Whitaker", "text": "It's refracted light, weather balloons, a rocket being launched, Venus."}], "208": [{"sec": 210, "spk": "Luis Elizondo", "text": "In some cases, there are simple explanations for what people are witnessing, but there are some that"}], "216": [{"sec": 217, "spk": "Luis Elizondo", "text": "that are not."}, {"sec": 218, "spk": "Luis Elizondo", "text": "We're not just simply jumping to a conclusion that's saying, oh, that's a UAP out there."}], "220": [{"sec": 222, "spk": "Luis Elizondo", "text": "We're going through our due diligence."}], "224": [{"sec": 224, "spk": "Luis Elizondo", "text": "Is it some sort of new type of cruise missile technology that China has developed?"}], "228": [{"sec": 228, "spk": "Luis Elizondo", "text": "Is it some sort of high-altitude balloon that's conducting reconnaissance?"}], "232": [{"sec": 232, "spk": "Luis Elizondo", "text": "Ultimately, when you have exhausted all those what-ifs and you're still left with the fact that this is in our airspace and it's real, that's when it becomes compelling and that's when it becomes problematic."}], "244": [{"sec": 246, "spk": "Bill Whitaker", "text": "Former Navy pilot Lieutenant Ryan Graves calls whatever is out there a security risk."}], "252": [{"sec": 252, "spk": "Bill Whitaker", "text": "He told us his F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar, making it possible to zero in with infrared targeting cameras."}], "268": [{"sec": 269, "spk": "Bill Whitaker", "text": "So you're seeing it both with the radar and with the infrared, and that tells you that there is something out there."}], "276": [{"sec": 277, "spk": "Ryan Graves", "text": "Pretty hard to spoof that."}, {"sec": 278, "spk": "Bill Whitaker", "text": "These photographs were taken in 2019 in the same area."}], "280": [{"sec": 283, "spk": "Bill Whitaker", "text": "The Pentagon confirms these are images of objects it can't identify."}], "288": [{"sec": 288, "spk": "Bill Whitaker", "text": "Lieutenant Graves told us pilots training off the Atlantic coast see things like that all the time."}], "292": [{"sec": 295, "spk": "Ryan Graves", "text": "Every day."}], "296": [{"sec": 296, "spk": "Ryan Graves", "text": "Every day for at least a couple of years."}, {"sec": 298, "spk": "Bill Whitaker", "text": "Wait a minute."}, {"sec": 299, "spk": "Bill Whitaker", "text": "Every day for a couple of years?"}], "300": [{"sec": 301, "spk": "Ryan Graves", "text": "Mm-hmm."}, {"sec": 302, "spk": "Ryan Graves", "text": "You know, I don't see an exhaust plume."}], "304": [{"sec": 304, "spk": "Bill Whitaker", "text": "including this one, off the coast of Jacksonville, Florida in 2015, captured on a targeting camera by members of Graves' squadron."}], "312": [{"sec": 312, "spk": "[external footage]", "text": "Look at that thing!"}, {"sec": 315, "spk": "[external footage]", "text": "It's rotating."}], "316": [{"sec": 317, "spk": "[external footage]", "text": "My gosh!"}, {"sec": 317, "spk": "[external footage]", "text": "They're all going against the wind."}], "320": [{"sec": 321, "spk": "[external footage]", "text": "The wind's 120 knots far west."}, {"sec": 323, "spk": "[external footage]", "text": "Look at that thing, dude."}], "324": [{"sec": 325, "spk": "Bill Whitaker", "text": "You can sort of hear the surprise in their voices."}, {"sec": 327, "spk": "Ryan Graves", "text": "You certainly can."}, {"sec": 327, "spk": "Ryan Graves", "text": "They seem to have broke character a bit, and were just kind of amazed at what they were seeing."}], "332": [{"sec": 333, "spk": "Bill Whitaker", "text": "What do you think when you see something like this?"}, {"sec": 335, "spk": "Ryan Graves", "text": "This is a difficult one to explain."}], "336": [{"sec": 337, "spk": "Ryan Graves", "text": "You have rotation, you have high altitudes, you have propulsion, right?"}], "340": [{"sec": 342, "spk": "Ryan Graves", "text": "I don't know."}, {"sec": 342, "spk": "Ryan Graves", "text": "I don't know what it is, frankly."}], "344": [{"sec": 344, "spk": "Bill Whitaker", "text": "He told us pilots speculate they are one of three things, secret U.S."}], "348": [{"sec": 350, "spk": "Bill Whitaker", "text": "technology, an adversary spy vehicle, or something otherworldly."}], "356": [{"sec": 356, "spk": "Ryan Graves", "text": "I'd say, you know, the highest probability is it's a threat observation program."}], "360": [{"sec": 360, "spk": "Bill Whitaker", "text": "Could it be Russian or Chinese technology?"}], "364": [{"sec": 364, "spk": "Ryan Graves", "text": "I don't see why not."}, {"sec": 365, "spk": "Bill Whitaker", "text": "Are you alarmed?"}, {"sec": 367, "spk": "Ryan Graves", "text": "I am worried, frankly."}], "368": [{"sec": 368, "spk": "Ryan Graves", "text": "You know, if these were tactical jets from another country that were hanging out up there, it would be a massive issue."}], "372": [{"sec": 373, "spk": "Ryan Graves", "text": "But because it looks slightly different, we're not willing to actually look at the problem in the face."}], "376": [{"sec": 378, "spk": "Ryan Graves", "text": "We're happy to just ignore the fact that these are out there watching us every day."}], "380": [{"sec": 383, "spk": "Bill Whitaker", "text": "The government has ignored it, at least publicly, since closing its Project Blue Book investigation in 1969."}], "388": [{"sec": 390, "spk": "Bill Whitaker", "text": "But that began to change after an incident off Southern California in 2004, which was documented by radar, by camera, and four naval aviators."}], "400": [{"sec": 400, "spk": "Bill Whitaker", "text": "We spoke to two of them, David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz, and flying at his wing, Lieutenant Alex Dietrich, who has never spoken publicly about the encounter."}], "416": [{"sec": 417, "spk": "Alex Dietrich", "text": "I never wanted to be on national TV, no offense."}], "420": [{"sec": 421, "spk": "Bill Whitaker", "text": "So why are you doing this?"}, {"sec": 422, "spk": "Alex Dietrich", "text": "Because I was in a government aircraft, because I was on the clock, and so I feel a responsibility to share what I can, and it is unclassified."}], "432": [{"sec": 434, "spk": "Bill Whitaker", "text": "It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego."}], "440": [{"sec": 443, "spk": "Bill Whitaker", "text": "For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 80,000 feet in less than a second."}], "456": [{"sec": 459, "spk": "Bill Whitaker", "text": "On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate."}], "464": [{"sec": 467, "spk": "Bill Whitaker", "text": "They found an area of roiling white water the size of a 737 in an otherwise calm blue sea."}], "472": [{"sec": 475, "spk": "David Fravor", "text": "So as we're looking at this, her backseater says, hey, Skipper, do you?"}], "480": [{"sec": 482, "spk": "David Fravor", "text": "And about that got out, I said, dude, do you see that thing down there?"}], "484": [{"sec": 486, "spk": "David Fravor", "text": "And we saw this little white tic-tac-looking object."}], "488": [{"sec": 489, "spk": "David Fravor", "text": "And it's just kind of moving above the whitewater area."}], "492": [{"sec": 492, "spk": "Bill Whitaker", "text": "As Dietrich circled above, Fravor went in for a closer look."}], "496": [{"sec": 497, "spk": "Bill Whitaker", "text": "Sort of spiraling down?"}, {"sec": 497, "spk": "David Fravor", "text": "Yep."}, {"sec": 498, "spk": "David Fravor", "text": "The tic-tac's still pointing north-south."}], "500": [{"sec": 500, "spk": "David Fravor", "text": "It goes and just turns abruptly and starts mirroring me."}], "504": [{"sec": 504, "spk": "David Fravor", "text": "So as I'm coming down, it starts coming up."}, {"sec": 507, "spk": "Bill Whitaker", "text": "So it's mimicking your moves."}], "508": [{"sec": 508, "spk": "David Fravor", "text": "Yeah, it was aware we were there."}, {"sec": 510, "spk": "Bill Whitaker", "text": "He said it was about the size of his F-18, with no markings, no wings, no exhaust plumes."}], "516": [{"sec": 517, "spk": "David Fravor", "text": "I want to see how close I can get."}, {"sec": 519, "spk": "David Fravor", "text": "So I go like this, and it's climbing still."}], "520": [{"sec": 520, "spk": "David Fravor", "text": "And when it gets right in front of me, it just disappears."}], "524": [{"sec": 524, "spk": "Bill Whitaker", "text": "Disappears?"}, {"sec": 525, "spk": "David Fravor", "text": "Disappears, like gone."}, {"sec": 527, "spk": "David Fravor", "text": "It had sped off."}], "528": [{"sec": 529, "spk": "Bill Whitaker", "text": "What are you thinking?"}, {"sec": 530, "spk": "Alex Dietrich", "text": "So your mind tries to make sense of it."}], "532": [{"sec": 533, "spk": "Alex Dietrich", "text": "I'm going to categorize this as maybe a helicopter or maybe a drone."}], "536": [{"sec": 538, "spk": "Alex Dietrich", "text": "And when it disappeared, I mean, it was just..."}], "540": [{"sec": 540, "spk": "Bill Whitaker", "text": "Did your back seaters see this too?"}, {"sec": 543, "spk": "Alex Dietrich", "text": "Yeah."}, {"sec": 543, "spk": "David Fravor", "text": "Oh, yeah."}], "544": [{"sec": 544, "spk": "David Fravor", "text": "There was four of us in the airplanes literally watching this thing for roughly about five minutes."}], "548": [{"sec": 548, "spk": "Bill Whitaker", "text": "Seconds later, the Princeton reacquired the target, 60 miles away."}], "552": [{"sec": 554, "spk": "Bill Whitaker", "text": "Another crew managed to briefly lock onto it with a targeting camera before it zipped off again."}], "560": [{"sec": 560, "spk": "Alex Dietrich", "text": "You know, I think that over beers, we've sort of said, hey, man, if I saw this solo, I don't know that I would have come back and said anything because it sounds so crazy when I say it."}], "568": [{"sec": 571, "spk": "Bill Whitaker", "text": "You understand that reaction?"}], "572": [{"sec": 573, "spk": "David Fravor", "text": "I do."}, {"sec": 574, "spk": "David Fravor", "text": "I've had some people tell me, you know, when you say that, you can sound crazy."}], "576": [{"sec": 577, "spk": "David Fravor", "text": "I'll be honest."}, {"sec": 577, "spk": "David Fravor", "text": "I'm not a UFO guy."}, {"sec": 579, "spk": "Bill Whitaker", "text": "But from what I hear you guys saying, there's something."}], "584": [{"sec": 585, "spk": "David Fravor", "text": "Yes."}, {"sec": 585, "spk": "David Fravor", "text": "There's definitely something that, I don't know who's building it, who's got the technology, who's got the brains, but there's something out there that was better than our airplane."}], "596": [{"sec": 596, "spk": "Bill Whitaker", "text": "The air crew filed reports."}, {"sec": 598, "spk": "Bill Whitaker", "text": "Then, like the mysterious flying object, the Nimitz encounter disappeared."}], "604": [{"sec": 604, "spk": "Bill Whitaker", "text": "Nothing was said or done officially for five years until Lou Elizondo came across the story and investigated."}], "612": [{"sec": 613, "spk": "Luis Elizondo", "text": "We spend millions of dollars in training these pilots, and they are seeing something that they can't explain."}], "616": [{"sec": 619, "spk": "Luis Elizondo", "text": "Furthermore, that information's being backed up on electro-optical data, like gun camera footage, and by radar data."}], "624": [{"sec": 625, "spk": "Luis Elizondo", "text": "Now, to me, that's compelling."}, {"sec": 627, "spk": "Bill Whitaker", "text": "Inside the Pentagon, his findings were met with skepticism."}], "628": [{"sec": 631, "spk": "Bill Whitaker", "text": "AATIP's funding was eliminated in 2012, but Elizondo says he and a handful of others kept the mission alive."}], "636": [{"sec": 639, "spk": "Bill Whitaker", "text": "until finally, frustrated, he quit the Pentagon in 2017, but not before getting these three videos declassified."}], "648": [{"sec": 648, "spk": "Bill Whitaker", "text": "And then things took a stranger turn."}, {"sec": 651, "spk": "Christopher Mellon", "text": "I tried to help my colleague, Lou Elizondo, elevate the issue in the department and actually get it to the Secretary of Defense."}], "656": [{"sec": 657, "spk": "Bill Whitaker", "text": "Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W."}], "664": [{"sec": 664, "spk": "Bill Whitaker", "text": "Bush, and had access to top-secret government programs."}], "668": [{"sec": 668, "spk": "Christopher Mellon", "text": "So it's not us, that's one thing we know."}, {"sec": 671, "spk": "Christopher Mellon", "text": "I could say that with a very high degree of confidence, in part because of the positions I held in the department, and I know the process."}], "676": [{"sec": 678, "spk": "Bill Whitaker", "text": "Mellon says he grew concerned nothing was being done about UAPs, so he decided to do something."}], "684": [{"sec": 686, "spk": "Bill Whitaker", "text": "In 2017, as a private citizen, he surreptitiously acquired the three Navy videos Elizondo had declassified and leaked them to The New York Times."}], "696": [{"sec": 697, "spk": "Christopher Mellon", "text": "It's bizarre and unfortunate that someone like myself has to do something like that to get a national security issue like this on the agenda."}], "704": [{"sec": 706, "spk": "Bill Whitaker", "text": "He joined forces with now civilian Lou Elizondo, and they started to tell their story to anybody who would listen, to newspapers, the History Channel, to members of Congress."}], "716": [{"sec": 717, "spk": "Christopher Mellon", "text": "We knew and understood that you had to go to the public, get the public interested to get Congress interested, to then circle back to the Defense Department and get them to start taking a look at it."}], "724": [{"sec": 727, "spk": "Bill Whitaker", "text": "And now it is."}], "728": [{"sec": 729, "spk": "Bill Whitaker", "text": "This past August, the Pentagon resurrected AATIP."}], "732": [{"sec": 732, "spk": "Bill Whitaker", "text": "It's now called the UAP Task Force."}, {"sec": 735, "spk": "Bill Whitaker", "text": "Service members now are encouraged to report strange encounters."}], "740": [{"sec": 740, "spk": "Bill Whitaker", "text": "And the Senate wants answers."}, {"sec": 742, "spk": "Marco Rubio", "text": "Anything that enters an airspace that's not supposed to be there is a threat."}], "744": [{"sec": 746, "spk": "Bill Whitaker", "text": "After receiving classified briefings on UAPs, Senator Marco Rubio called for a detailed analysis."}], "752": [{"sec": 754, "spk": "Bill Whitaker", "text": "This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month."}], "764": [{"sec": 766, "spk": "Bill Whitaker", "text": "This is a bizarre issue."}, {"sec": 767, "spk": "Bill Whitaker", "text": "The Pentagon and other branches of the military have a long history of sort of dismissing this."}], "772": [{"sec": 774, "spk": "Bill Whitaker", "text": "What makes you think that this time is going to be different?"}], "776": [{"sec": 776, "spk": "Marco Rubio", "text": "I mean, we're going to find out when we get that report."}, {"sec": 779, "spk": "Marco Rubio", "text": "You know, there's a stigma on Capitol Hill."}], "780": [{"sec": 780, "spk": "Marco Rubio", "text": "I mean, some of my colleagues are very interested in this topic and some kind of, you know, giggle when you bring it up."}], "784": [{"sec": 786, "spk": "Marco Rubio", "text": "But I don't think we can allow the stigma to keep us from having an answer to a very fundamental question."}], "792": [{"sec": 792, "spk": "Bill Whitaker", "text": "What do you want us to do about this?"}, {"sec": 794, "spk": "Marco Rubio", "text": "I want us to take it seriously and have a process to take it seriously."}], "796": [{"sec": 797, "spk": "Marco Rubio", "text": "I want us to have a process to analyze the data."}, {"sec": 799, "spk": "Marco Rubio", "text": "every time it comes in, that there be a place where this is cataloged and constantly analyzed until we get some answers."}], "804": [{"sec": 805, "spk": "Marco Rubio", "text": "Maybe it has a very simple answer."}], "808": [{"sec": 808, "spk": "Marco Rubio", "text": "Maybe it doesn't."}], "812": [{"sec": 815, "spk": "[narrator]", "text": "For more on the Nimitz encounter..."}], "816": [{"sec": 817, "spk": "Alex Dietrich", "text": "I felt the vulnerability of not having anything to defend ourselves."}], "820": [{"sec": 821, "spk": "[irrelevant]", "text": "Go to 60MinutesOvertime.com."}], "824": [{"sec": 824, "spk": "[irrelevant]", "text": "Sponsored by Kologuard."}]};
let model='haiku';
let sel=new Set();
function finalIdx(){return DATA[model].length-1;}
function defaultSel(){return new Set([0, finalIdx()]);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function highlightImp(t){return esc(t).replace(/(\d[\d,\.]*\s*(?:miles per hour|mph|miles?|feet|foot|knots?))/ig,'<mark class="imp">$1</mark>');}
function setModel(m){model=m;sel=defaultSel();renderIterBoxes();render();}
function setView(v){
  document.getElementById('claimsView').classList.toggle('hidden',v!=='claims');
  document.getElementById('nodesView').classList.toggle('hidden',v!=='nodes');
  document.getElementById('vClaims').classList.toggle('on',v==='claims');
  document.getElementById('vNodes').classList.toggle('on',v==='nodes');
}
function renderIterBoxes(){
  const box=document.getElementById('iterboxes');
  box.innerHTML=DATA[model].map((it,i)=>
    `<label><input type="checkbox" ${sel.has(i)?'checked':''} onchange="toggleIter(${i})">${esc(it.label)}</label>`).join(' ');
}
function toggleIter(i){ if(sel.has(i))sel.delete(i); else sel.add(i); render(); }
function attClass(a){return a?('att-'+a.split('_')[0]):'att-none';}
function chip(cls,txt){return `<span class="chip ${cls}">${esc(txt)}</span>`;}
function renderClaim(c){
  let chips=`<span class="chip ${attClass(c.att)}">${esc(c.att||'no attest')}</span>`;
  chips+=chip('ctype',c.type);
  if(c.cat==='infrastructure')chips+=chip('ctype','infra');
  if(c.spk)chips+=chip('spk','🗣 '+c.spk);
  for(const r of c.refs)chips+=chip('r-'+(r.type||'x'),r.name);
  let q=c.quote?`<div class="q">&ldquo;${esc(c.quote.slice(0,180))}&rdquo;</div>`:'';
  return `<div class="claim"><div class="t">${highlightImp(c.text)}</div><div class="chips">${chips}</div>${q}</div>`;
}
function render(){
  const iters=[...sel].sort((a,b)=>a-b);
  // summary
  const tot=iters.map(i=>DATA[model][i]).reduce((a,it)=>a+it.n_claims,0);
  document.getElementById('summary').textContent=
    `${model}: ${DATA[model].length} iterations, showing ${iters.length} (${iters.map(i=>DATA[model][i].n_claims).join(' / ')} claims)`;
  // claims by bucket
  const buckets=new Set();
  for(const i of iters)for(const c of DATA[model][i].claims)buckets.add(c.bk);
  const order=[...buckets].filter(b=>b>=0).sort((a,b)=>a-b);
  if([...buckets].includes(-1))order.push(-1);
  let html='';
  for(const bktick of order){
    const srcs=SRC[bktick]||[];
    let srcline = srcs.length
      ? srcs.map(s=>`<div class="src"><span class="spk">[${s.sec!=null?fmtSec(s.sec):'?'}] ${esc(s.spk||'')}:</span> ${esc(s.text)}</div>`).join('')
      : `<div class="src"><span class="spk">${bktick<0?'(no timestamp)':'['+fmtSec(bktick)+']'}</span></div>`;
    let cols='';
    for(const i of iters){
      const cl=DATA[model][i].claims.filter(c=>c.bk===bktick);
      const inner = cl.length? cl.map(renderClaim).join('') : '<span class="empty">&mdash;</span>';
      cols+=`<div class="col"><h5>${esc(DATA[model][i].label)}</h5>${inner}</div>`;
    }
    html+=`<div class="moment">${srcline}<div class="cols">${cols}</div></div>`;
  }
  document.getElementById('claimsView').innerHTML=html||'<p>Select at least one iteration.</p>';
  // nodes
  const TYPES=['person','place','event','organisation','project','object','topic','document'];
  let nh='<div class="nodepanel">';
  for(const i of iters){
    const it=DATA[model][i];
    nh+=`<div class="nodecol"><h4>${esc(it.label)} <span style="color:#999;font-weight:400">(${it.n_nodes} nodes)</span></h4>`;
    for(const t of TYPES){
      const ns=it.nodes_by_type[t]||[];
      if(!ns.length)continue;
      nh+=`<div class="ntype">${t} (${ns.length})</div><div class="chips">`+
        ns.map(n=>`<span class="chip r-${t}">${esc(n)}</span>`).join('')+`</div>`;
    }
    nh+='</div>';
  }
  nh+='</div>';
  document.getElementById('nodesView').innerHTML=nh;
}
function fmtSec(sec){const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`;}
sel=defaultSel();renderIterBoxes();render();
</script></body></html>
