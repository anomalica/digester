 "Nimitz UAP encounter, 2004-11-14", "type": "event"}]}, {"loc": "00:08:12.3-00:08:28.9", "bk": 492, "text": "During the 2004-11-14 encounter, as David Fravor approached the unidentified object in a descent, the object turned abruptly and began to mirror his aircraft's manoeuvres, moving upward as he moved downward.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "David Fravor", "quote": "David Fravor: Sort of spiraling down? Yep. The tic-tac's still pointing north-south. It goes and just turns abruptly and starts mirroring me. So as I'm coming down, it starts coming up. Bill Whitaker: So it's mimicking your moves. David Fravor: Yeah, it was aware we were there.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP encounter, 2004-11-14", "type": "event"}]}, {"loc": "00:08:27.0-00:08:30.5", "bk": 504, "text": "The unidentified object observed during the 2004-11-14 encounter was approximately the size of an F-18 fighter jet, had no markings, no wings, and no exhaust plumes.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "He said it was about the size of his F-18, with no markings, no wings, no exhaust plumes.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP encounter, 2004-11-14", "type": "event"}]}, {"loc": "00:08:37.0-00:08:47.8", "bk": 516, "text": "During the 2004-11-14 encounter, when David Fravor attempted to approach the unidentified object, it climbed away and rapidly disappeared.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "David Fravor", "quote": "David Fravor: I want to see how close I can get. So I go like this, and it's climbing still. And when it gets right in front of me, it just disappears. Bill Whitaker: Disappears? David Fravor: Disappears, like gone. It had sped off.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP encounter, 2004-11-14", "type": "event"}]}, {"loc": "00:08:49.4-00:09:00.9", "bk": 528, "text": "Alex Dietrich initially hypothesised the unidentified object was a helicopter or drone when she witnessed it during the 2004-11-14 encounter.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Alex Dietrich", "quote": "Alex Dietrich: So your mind tries to make sense of it. I'm going to categorize this as maybe a helicopter or maybe a drone. And when it disappeared, I mean, it was just...", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP encounter, 2004-11-14", "type": "event"}]}, {"loc": "00:09:00.9-00:09:03.5", "bk": 540, "text": "The weapons system officers in both aircraft observed the unidentified object during the 2004-11-14 encounter.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Alex Dietrich, David Fravor", "quote": "Bill Whitaker: Did your back seaters see this too? Alex Dietrich: Yeah. David Fravor: Oh, yeah.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP encounter, 2004-11-14", "type": "event"}]}, {"loc": "00:09:03.5-00:09:08.9", "bk": 540, "text": "During the 2004-11-14 encounter, four personnel (two pilots and two weapons system officers) observed the unidentified object for approximately five minutes.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "David Fravor", "quote": "There was four of us in the airplanes literally watching this thing for roughly about five minutes.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP encounter, 2004-11-14", "type": "event"}]}, {"loc": "00:09:08.9-00:09:14.4", "bk": 548, "text": "Seconds after the unidentified object disappeared from visual contact during the 2004-11-14 encounter, the USS Princeton radar re-acquired the target approximately 96 kilometres away.", "att": "", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "Seconds later, the Princeton reacquired the target, 60 miles away.", "refs": [{"name": "USS Princeton", "type": "object"}, {"name": "Nimitz UAP encounter, 2004-11-14", "type": "event"}]}, {"loc": "00:09:14.4-00:09:20.8", "bk": 552, "text": "A second crew briefly locked onto the unidentified object with a targeting camera during the 2004-11-14 encounter before it departed rapidly.", "att": "", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "Another crew managed to briefly lock onto it with a targeting camera before it zipped off again.", "refs": [{"name": "Nimitz UAP encounter, 2004-11-14", "type": "event"}]}, {"loc": "00:09:20.8-00:09:31.1", "bk": 560, "text": "Alex Dietrich states that pilots would not have reported the 2004-11-14 encounter if they had witnessed it alone, as the account sounds implausible.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Alex Dietrich", "quote": "You know, I think that over beers, we've sort of said, hey, man, if I saw this solo, I don't know that I would have come back and said anything because it sounds so crazy when I say it.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP encounter, 2004-11-14", "type": "event"}]}, {"loc": "00:09:33.1-00:09:37.4", "bk": 572, "text": "David Fravor states that people have suggested his account sounds crazy.", "att": "", "type": "testimony", "cat": "domain", "spk": "David Fravor", "quote": "I've had some people tell me, you know, when you say that, you can sound crazy.", "refs": [{"name": "Fravor, David", "type": "person"}]}, {"loc": "00:09:37.9-00:09:39.8", "bk": 576, "text": "David Fravor states he is not a UFO enthusiast.", "att": "", "type": "testimony", "cat": "domain", "spk": "David Fravor", "quote": "I'll be honest. I'm not a UFO guy.", "refs": [{"name": "Fravor, David", "type": "person"}]}, {"loc": "00:09:39.8-00:09:56.5", "bk": 576, "text": "David Fravor states there exists something unidentified that was technologically superior to his aircraft.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "David Fravor", "quote": "Yes. There's definitely something that, I don't know who's building it, who's got the technology, who's got the brains, but there's something out there that was better than our airplane.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP encounter, 2004-11-14", "type": "event"}]}, {"loc": "00:09:56.5-00:09:58.7", "bk": 596, "text": "The aircrew involved in the 2004-11-14 encounter filed reports documenting their observations.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "The air crew filed reports.", "refs": [{"name": "Nimitz UAP encounter, 2004-11-14", "type": "event"}]}, {"loc": "00:09:58.7-00:10:04.2", "bk": 596, "text": "The 2004-11-14 encounter off Southern California and the unidentified object disappeared from public knowledge for five years until Luis Elizondo investigated.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "Then, like the mysterious flying object, the Nimitz encounter disappeared. Nothing was said or done officially for five years until Lou Elizondo came across the story and investigated.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Nimitz UAP encounter, 2004-11-14", "type": "event"}]}, {"loc": "00:10:13.2-00:10:27.7", "bk": 612, "text": "Luis Elizondo states that United States military pilots are observing unidentified objects that they cannot explain, and that this information is corroborated by electro-optical data such as gun camera footage and radar data, which he considers compelling.", "att": "", "type": "opinion", "cat": "domain", "spk": "Luis Elizondo", "quote": "We spend millions of dollars in training these pilots, and they are seeing something that they can't explain. Furthermore, that information's being backed up on electro-optical data, like gun camera footage, and by radar data. Now, to me, that's compelling.", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:10:27.7-00:10:31.7", "bk": 624, "text": "Personnel within the Pentagon reacted with scepticism to the findings of the Advanced Aerospace Threat Identification Program (AATIP).", "att": "", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "Inside the Pentagon, his findings were met with skepticism.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:10:31.7-00:10:39.5", "bk": 628, "text": "The funding for the Advanced Aerospace Threat Identification Program (AATIP) was eliminated in 2012.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "AATIP's funding was eliminated in 2012", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:10:39.5-00:10:48.8", "bk": 636, "text": "Luis Elizondo states he and a handful of others continued the Advanced Aerospace Threat Identification Program (AATIP) mission after its official funding was eliminated.", "att": "", "type": "testimony", "cat": "domain", "spk": "Luis Elizondo", "quote": "but Elizondo says he and a handful of others kept the mission alive.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:10:39.5-00:10:48.8", "bk": 636, "text": "Luis Elizondo quit the Pentagon in 2017, but successfully obtained declassification of three Navy videos documenting unidentified aerial phenomena.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "until finally, frustrated, he quit the Pentagon in 2017, but not before getting these three videos declassified.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Pentagon declassified Navy UAP videos", "type": "document"}]}, {"loc": "00:10:57.5-00:11:04.3", "bk": 656, "text": "Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Bill Clinton and George W. Bush, and had access to top-secret government programmes.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush, and had access to top-secret government programs.", "refs": [{"name": "Mellon, Christopher", "type": "person"}]}, {"loc": "00:10:51.9-00:10:57.5", "bk": 648, "text": "Christopher Mellon attempted to help Luis Elizondo elevate the Unidentified Aerial Phenomena (UAP) issue within the Department of Defense and bring it to the attention of the Secretary of Defense.", "att": "", "type": "testimony", "cat": "domain", "spk": "Christopher Mellon", "quote": "I tried to help my colleague, Lou Elizondo, elevate the issue in the department and actually get it to the Secretary of Defense.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:11:08.4-00:11:18.7", "bk": 668, "text": "Christopher Mellon states with high confidence that observed Unidentified Aerial Phenomena (UAP) are not of United States origin, based on his positions held within the Department of Defense and his knowledge of classified programmes.", "att": "", "type": "opinion", "cat": "domain", "spk": "Christopher Mellon", "quote": "Christopher Mellon: So it's not us, that's one thing we know. Bill Whitaker: We know that? Christopher Mellon: I could say that with a very high degree of confidence, in part because of the positions I held in the department, and I know the process.", "refs": [{"name": "Mellon, Christopher", "type": "person"}]}, {"loc": "00:11:18.7-00:11:26.2", "bk": 676, "text": "Christopher Mellon became concerned that no action was being taken regarding Unidentified Aerial Phenomena (UAP) within the Department of Defense.", "att": "", "type": "testimony", "cat": "domain", "spk": "Bill Whitaker", "quote": "Mellon says he grew concerned nothing was being done about UAPs", "refs": [{"name": "Mellon, Christopher", "type": "person"}]}, {"loc": "00:11:37.0-00:11:46.1", "bk": 696, "text": "Christopher Mellon expresses frustration that, as a private citizen, he felt compelled to leak classified information to bring national security attention to the Unidentified Aerial Phenomena (UAP) issue.", "att": "", "type": "opinion", "cat": "domain", "spk": "Christopher Mellon", "quote": "It's bizarre and unfortunate that someone like myself has to do something like that to get a national security issue like this on the agenda.", "refs": [{"name": "Mellon, Christopher", "type": "person"}]}, {"loc": "00:11:57.6-00:12:07.2", "bk": 716, "text": "Christopher Mellon and Luis Elizondo pursued public engagement and congressional interest as a strategy to compel the Department of Defense to address Unidentified Aerial Phenomena (UAP).", "att": "", "type": "testimony", "cat": "domain", "spk": "Christopher Mellon", "quote": "We knew and understood that you had to go to the public, get the public interested to get Congress interested, to then circle back to the Defense Department and get them to start taking a look at it.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:12:07.2-00:12:15.6", "bk": 724, "text": "In August (year not specified in context but preceding May 2021 publication), the Pentagon resurrected the Advanced Aerospace Threat Identification Program (AATIP) under a new name: the UAP Task Force.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "This past August, the Pentagon resurrected AATIP. It's now called the UAP Task Force.", "refs": [{"name": "United States Department of Defense", "type": "organisation"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "UAP Task Force", "type": "project"}]}, {"loc": "00:12:12.6-00:12:20.1", "bk": 732, "text": "United States service members are now encouraged to report encounters with Unidentified Aerial Phenomena (UAP).", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "Service members now are encouraged to report strange encounters.", "refs": [{"name": "UAP Task Force", "type": "project"}]}, {"loc": "00:12:15.6-00:12:20.1", "bk": 732, "text": "The United States Senate has requested answers regarding Unidentified Aerial Phenomena (UAP).", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "And the Senate wants answers.", "refs": [{"name": "United States Senate Intelligence Committee", "type": "organisation"}]}, {"loc": "00:12:22.6-00:12:26.5", "bk": 740, "text": "Senator Marco Rubio states that any object entering United States airspace without authorisation constitutes a threat.", "att": "", "type": "opinion", "cat": "domain", "spk": "Marco Rubio", "quote": "Anything that enters an airspace that's not supposed to be there is a threat.", "refs": [{"name": "Rubio, Marco", "type": "person"}]}, {"loc": "00:12:26.5-00:12:46.3", "bk": 744, "text": "Senator Marco Rubio, while head of the Senate Intelligence Committee in December (year preceding May 2021 publication, i.e. December 2020), requested the Director of National Intelligence and the Pentagon present Congress an unclassified report on Unidentified Aerial Phenomena (UAP) by the following month.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Director of National Intelligence", "type": "organisation"}, {"name": "United States Department of Defense", "type": "organisation"}]}, {"loc": "00:12:46.3-00:12:47.9", "bk": 764, "text": "Senator Marco Rubio characterises the Unidentified Aerial Phenomena (UAP) issue as unusual.", "att": "", "type": "opinion", "cat": "domain", "spk": "Bill Whitaker", "quote": "This is a bizarre issue.", "refs": [{"name": "Rubio, Marco", "type": "person"}]}, {"loc": "00:12:47.9-00:12:54.5", "bk": 764, "text": "The Pentagon and other United States military branches have historically dismissed Unidentified Aerial Phenomena (UAP).", "att": "", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "The Pentagon and other branches of the military have a long history of sort of dismissing this.", "refs": [{"name": "United States Department of Defense", "type": "organisation"}]}, {"loc": "00:12:56.2-00:13:06.9", "bk": 776, "text": "Senator Marco Rubio states there exists a stigma on Capitol Hill regarding Unidentified Aerial Phenomena (UAP), with some members of Congress showing interest while others respond with dismissal.", "att": "", "type": "observation", "cat": "domain", "spk": "Marco Rubio", "quote": "You know, there's a stigma on Capitol Hill. I mean, some of my colleagues are very interested in this topic and some kind of, you know, giggle when you bring it up.", "refs": [{"name": "Rubio, Marco", "type": "person"}]}, {"loc": "00:13:00.8-00:13:12.2", "bk": 780, "text": "Senator Marco Rubio advocates that stigma should not prevent serious investigation of Unidentified Aerial Phenomena (UAP).", "att": "", "type": "opinion", "cat": "domain", "spk": "Marco Rubio", "quote": "But I don't think we can allow the stigma to keep us from having an answer to a very fundamental question.", "refs": [{"name": "Rubio, Marco", "type": "person"}]}, {"loc": "00:13:14.1-00:13:25.9", "bk": 792, "text": "Senator Marco Rubio advocates treating Unidentified Aerial Phenomena (UAP) seriously and establishing a systematic process for analysing incoming data.", "att": "", "type": "opinion", "cat": "domain", "spk": "Marco Rubio", "quote": "I want us to take it seriously and have a process to take it seriously. I want us to have a process to analyze the data. every time it comes in, that there be a place where this is cataloged and constantly analyzed until we get some answers.", "refs": [{"name": "Rubio, Marco", "type": "person"}]}, {"loc": "00:13:25.9-00:13:28.3", "bk": 804, "text": "Senator Marco Rubio states that the explanation for Unidentified Aerial Phenomena (UAP) might be straightforward or complex.", "att": "", "type": "opinion", "cat": "domain", "spk": "Marco Rubio", "quote": "Maybe it has a very simple answer. Maybe it doesn't.", "refs": [{"name": "Rubio, Marco", "type": "person"}]}, {"loc": "00:13:37.3-00:13:41.7", "bk": 816, "text": "Lieutenant Alex Dietrich experienced a sense of vulnerability regarding the inability to defend against the observed unidentified aerial phenomena.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Alex Dietrich", "quote": "I felt the vulnerability of not having anything to defend ourselves.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP encounter, 2004-11-14", "type": "event"}]}, {"loc": "00:00:01.8", "bk": 0, "text": "Bill Whitaker is a correspondent for 60 Minutes.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "We have tackled many strange stories on 60 Minutes, but perhaps none like this.", "refs": [{"name": "60 Minutes", "type": "organisation"}, {"name": "Whitaker, Bill", "type": "person"}]}, {"loc": "00:00:44.4-00:00:59.6", "bk": 44, "text": "Luis Elizondo stated that the United States government has publicly stated that Unidentified Aerial Phenomena (UAP) are real.", "att": "", "type": "testimony", "cat": "domain", "spk": "Luis Elizondo", "quote": "Bill Whitaker: So what you're telling me is that UFOs, unidentified flying objects, are real. Luis Elizondo: Bill, I think we're beyond that already. The government has already stated for the record that they're real. I'm not telling you that. The United States government is telling you that.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "United States Department of Defense", "type": "organisation"}]}, {"loc": "00:01:50.3-00:02:01.6", "bk": 108, "text": "The Advanced Aerospace Threat Identification Program (AATIP) was part of a USD 22 million programme sponsored by then Senate Majority Leader Harry Reid to investigate Unidentified Aerial Phenomena (UAP).", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "Buried away in the Pentagon, AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Reid, Harry", "type": "person"}]}, {"loc": "00:04:29.7-00:04:37.1", "bk": 268, "text": "Ryan Graves stated that the dual radar-and-infrared detection capability is difficult to spoof.", "att": "", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "Bill Whitaker: So you're seeing it both with the radar and with the infrared, and that tells you that there is something out there. Ryan Graves: Pretty hard to spoof that.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:08:30.5", "bk": 508, "text": "During the Nimitz UAP encounter on 2004-11-14, the unidentified object was approximately the same size as an F-18 fighter jet.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "He said it was about the size of his F-18, with no markings, no wings, no exhaust plumes.", "refs": [{"name": "Nimitz UAP encounter, 2004-11-14", "type": "event"}, {"name": "Fravor, David", "type": "person"}]}, {"loc": "00:08:20.2-00:08:28.9", "bk": 500, "text": "David Fravor stated that the object observed during the Nimitz UAP encounter appeared to be aware of the presence of his aircraft.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "David Fravor: So as I'm coming down, it starts coming up. Bill Whitaker: So it's mimicking your moves. David Fravor: Yeah, it was aware we were there.", "refs": [{"name": "Nimitz UAP encounter, 2004-11-14", "type": "event"}, {"name": "Fravor, David", "type": "person"}]}, {"loc": "00:04:48.2-00:05:02.5", "bk": 288, "text": "Ryan Graves stated that pilots observe unidentified aerial phenomena on a daily basis off the Atlantic coast.", "att": "", "type": "testimony", "cat": "domain", "spk": "Graves, Ryan", "quote": "Lieutenant Graves told us pilots training off the Atlantic coast see things like that all the time. Ryan Graves: Every day. Every day for at least a couple of years.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "2015 Atlantic coast UAP sightings", "type": "event"}]}, {"loc": "00:05:01.2-00:05:02.5", "bk": 300, "text": "Ryan Graves stated he does not observe an exhaust plume from the unidentified aerial phenomena.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Graves, Ryan", "quote": "You know, I don't see an exhaust plume.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:05:56.0", "bk": 356, "text": "Ryan Graves assessed the highest probability explanation for the observed unidentified aerial phenomena is that they constitute a threat observation programme.", "att": "", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "Ryan Graves: I'd say, you know, the highest probability is it's a threat observation program.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:06:07.0-00:06:18.5", "bk": 364, "text": "Ryan Graves expressed concern that unusual characteristics of the observed unidentified aerial phenomena cause government and military officials to avoid addressing them seriously.", "att": "", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "If these were tactical jets from another country that were hanging out up there, it would be a massive issue. But because it looks slightly different, we're not willing to actually look at the problem in the face. We're happy to just ignore the fact that these are out there watching us every day.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:07:02.7-00:07:14.4", "bk": 420, "text": "Alex Dietrich stated she was speaking publicly about the 2004 Nimitz encounter because she was operating a government aircraft on government time and feels a responsibility to share her unclassified account.", "att": "", "type": "testimony", "cat": "domain", "spk": "Dietrich, Alex", "quote": "Alex Dietrich: Because I was in a government aircraft, because I was on the clock, and so I feel a responsibility to share what I can, and it is unclassified.", "refs": [{"name": "Dietrich, Alex", "type": "person"}]}, {"loc": "00:07:47.8", "bk": 464, "text": "During the Nimitz UAP encounter on 2004-11-14, David Fravor and Alex Dietrich discovered an area of roiling white water approximately the size of a Boeing 737 in an otherwise calm ocean.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "They found an area of roiling white water the size of a 737 in an otherwise calm blue sea.", "refs": [{"name": "Nimitz UAP encounter, 2004-11-14", "type": "event"}, {"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}]}, {"loc": "00:08:02.4-00:08:09.7", "bk": 480, "text": "David Fravor and his weapons system officer observed a small white object resembling a Tic Tac located above the roiling white water during the Nimitz UAP encounter on 2004-11-14.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "And we saw this little white tic-tac-looking object. And it's just kind of moving above the whitewater area.", "refs": [{"name": "Nimitz UAP encounter, 2004-11-14", "type": "event"}, {"name": "Fravor, David", "type": "person"}]}, {"loc": "00:08:18.5-00:08:24.5", "bk": 496, "text": "During the Nimitz UAP encounter on 2004-11-14, as David Fravor approached the unidentified object in a descent, the object turned abruptly and began to mirror his aircraft's manoeuvres, moving upward as he moved downward.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "The tic-tac's still pointing north-south. It goes and just turns abruptly and starts mirroring me. So as I'm coming down, it starts coming up.", "refs": [{"name": "Nimitz UAP encounter, 2004-11-14", "type": "event"}, {"name": "Fravor, David", "type": "person"}]}, {"loc": "00:08:37.0-00:08:47.8", "bk": 516, "text": "During the Nimitz UAP encounter on 2004-11-14, when David Fravor attempted to approach the unidentified object, it climbed away and rapidly disappeared.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "I want to see how close I can get. So I go like this, and it's climbing still. And when it gets right in front of me, it just disappears.", "refs": [{"name": "Nimitz UAP encounter, 2004-11-14", "type": "event"}, {"name": "Fravor, David", "type": "person"}]}, {"loc": "00:08:50.9-00:08:58.3", "bk": 528, "text": "Alex Dietrich initially hypothesised the unidentified object during the Nimitz UAP encounter on 2004-11-14 was a helicopter or drone.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Dietrich, Alex", "quote": "I'm going to categorize this as maybe a helicopter or maybe a drone.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP encounter, 2004-11-14", "type": "event"}]}, {"loc": "00:09:00.9-00:09:04.2", "bk": 540, "text": "The weapons system officers in both aircraft observed the unidentified object during the Nimitz UAP encounter on 2004-11-14.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Dietrich, Alex", "quote": "Did your back seaters see this too? Yeah. Oh, yeah.", "refs": [{"name": "Nimitz UAP encounter, 2004-11-14", "type": "event"}]}, {"loc": "00:09:03.5-00:09:08.9", "bk": 540, "text": "During the Nimitz UAP encounter on 2004-11-14, four personnel (two pilots and two weapons system officers) observed the unidentified object for approximately five minutes.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "There was four of us in the airplanes literally watching this thing for roughly about five minutes.", "refs": [{"name": "Nimitz UAP encounter, 2004-11-14", "type": "event"}, {"name": "Fravor, David", "type": "person"}]}, {"loc": "00:09:08.9-00:09:14.4", "bk": 548, "text": "Seconds after the unidentified object disappeared from visual contact during the Nimitz UAP encounter on 2004-11-14, the USS Princeton radar re-acquired the target approximately 96 kilometres away.", "att": "", "type": "measurement", "cat": "domain", "spk": "Bill Whitaker", "quote": "Seconds later, the Princeton reacquired the target, 60 miles away.", "refs": [{"name": "USS Princeton", "type": "object"}, {"name": "Nimitz UAP encounter, 2004-11-14", "type": "event"}]}, {"loc": "00:09:08.9-00:09:14.4", "bk": 548, "text": "A second crew briefly locked onto the unidentified object with a targeting camera during the Nimitz UAP encounter on 2004-11-14 before it departed rapidly.", "att": "", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "Another crew managed to briefly lock onto it with a targeting camera before it zipped off again.", "refs": [{"name": "Nimitz UAP encounter, 2004-11-14", "type": "event"}]}, {"loc": "00:09:20.8-00:09:31.1", "bk": 560, "text": "Alex Dietrich stated that pilots would not have reported the Nimitz UAP encounter on 2004-11-14 if they had witnessed it alone, as the account sounds implausible.", "att": "", "type": "testimony", "cat": "domain", "spk": "Dietrich, Alex", "quote": "I think that over beers, we've sort of said, hey, man, if I saw this solo, I don't know that I would have come back and said anything because it sounds so crazy when I say it.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP encounter, 2004-11-14", "type": "event"}]}, {"loc": "00:09:37.9", "bk": 576, "text": "David Fravor stated he is not a Unidentified Flying Object (UFO) enthusiast.", "att": "", "type": "testimony", "cat": "domain", "spk": "Fravor, David", "quote": "I'll be honest. I'm not a UFO guy.", "refs": [{"name": "Fravor, David", "type": "person"}]}, {"loc": "00:09:45.5-00:09:56.5", "bk": 584, "text": "David Fravor stated that there exists something unidentified that was technologically superior to his aircraft.", "att": "", "type": "testimony", "cat": "domain", "spk": "Fravor, David", "quote": "There's definitely something that, I don't know who's building it, who's got the technology, who's got the brains, but there's something out there that was better than our airplane.", "refs": [{"name": "Fravor, David", "type": "person"}]}, {"loc": "00:09:56.5-00:09:58.7", "bk": 596, "text": "The aircrew involved in the Nimitz UAP encounter on 2004-11-14 filed reports documenting their observations.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "The air crew filed reports.", "refs": [{"name": "Nimitz UAP encounter, 2004-11-14", "type": "event"}]}, {"loc": "00:09:58.7-00:10:04.2", "bk": 596, "text": "The Nimitz UAP encounter on 2004-11-14 disappeared from public knowledge for five years until Luis Elizondo investigated.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "Then, like the mysterious flying object, the Nimitz encounter disappeared. Nothing was said or done officially for five years until Lou Elizondo came across the story and investigated.", "refs": [{"name": "Nimitz UAP encounter, 2004-11-14", "type": "event"}, {"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:10:13.2-00:10:25.3", "bk": 612, "text": "Luis Elizondo stated that United States military pilots are observing unidentified objects that they cannot explain, and that this information is corroborated by electro-optical data such as gun camera footage and radar data, which he considers compelling.", "att": "", "type": "opinion", "cat": "domain", "spk": "Elizondo, Luis", "quote": "We spend millions of dollars in training these pilots, and they are seeing something that they can't explain. Furthermore, that information's being backed up on electro-optical data, like gun camera footage, and by radar data. Now, to me, that's compelling.", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:10:31.7-00:10:39.5", "bk": 628, "text": "Luis Elizondo states that he and a handful of others continued the Advanced Aerospace Threat Identification Program (AATIP) mission after its official funding was eliminated.", "att": "", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "but Elizondo says he and a handful of others kept the mission alive.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:10:57.5-00:11:04.3", "bk": 656, "text": "Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Bill Clinton and George W. Bush.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush, and had access to top-secret government programs.", "refs": [{"name": "Mellon, Christopher", "type": "person"}]}, {"loc": "00:11:37.0", "bk": 696, "text": "Christopher Mellon states he felt compelled as a private citizen to leak classified information to bring national security attention to the Unidentified Aerial Phenomena (UAP) issue.", "att": "", "type": "opinion", "cat": "domain", "spk": "Mellon, Christopher", "quote": "It's bizarre and unfortunate that someone like myself has to do something like that to get a national security issue like this on the agenda.", "refs": [{"name": "Mellon, Christopher", "type": "person"}]}, {"loc": "00:12:07.2-00:12:15.6", "bk": 724, "text": "In August (prior to May 2021 publication), the Pentagon resurrected the Advanced Aerospace Threat Identification Program (AATIP) under a new name: the Unidentified Aerial Phenomena (UAP) Task Force.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "This past August, the Pentagon resurrected AATIP. It's now called the UAP Task Force.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "UAP Task Force", "type": "project"}, {"name": "United States Department of Defense", "type": "organisation"}]}, {"loc": "00:12:26.5-00:12:46.3", "bk": 744, "text": "In December (2020), while head of the Senate Intelligence Committee, Senator Marco Rubio requested the Director of National Intelligence and the Pentagon present Congress an unclassified report on Unidentified Aerial Phenomena (UAP) by the following month.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "United States Senate Intelligence Committee", "type": "organisation"}, {"name": "Director of National Intelligence", "type": "organisation"}, {"name": "United States Department of Defense", "type": "organisation"}]}, {"loc": "00:12:46.3", "bk": 764, "text": "Senator Marco Rubio characterises the Unidentified Aerial Phenomena (UAP) issue as a bizarre matter.", "att": "", "type": "opinion", "cat": "domain", "spk": "Rubio, Marco", "quote": "This is a bizarre issue.", "refs": [{"name": "Rubio, Marco", "type": "person"}]}, {"loc": "00:13:37.3", "bk": 816, "text": "Alex Dietrich experienced a sense of vulnerability regarding the inability to defend against the observed unidentified aerial phenomena during the Nimitz UAP encounter on 2004-11-14.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Dietrich, Alex", "quote": "I felt the vulnerability of not having anything to defend ourselves.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP encounter, 2004-11-14", "type": "event"}]}, {"loc": "00:06:40.8", "bk": 400, "text": "David Fravor is a graduate of the Top Gun Naval Flight School.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz", "refs": [{"name": "Fravor, David", "type": "person"}]}, {"loc": "00:06:40.8", "bk": 400, "text": "David Fravor was commander of an F-18 squadron aboard the USS Nimitz.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "USS Nimitz", "type": "object"}]}, {"loc": "00:06:40.8", "bk": 400, "text": "Alex Dietrich is a lieutenant who was a pilot flying at David Fravor's wing during the 2004 encounter off Southern California.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "and flying at his wing, Lieutenant Alex Dietrich, who has never spoken publicly about the encounter.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP encounter, 2004-11-14", "type": "event"}]}, {"loc": "00:05:04.3-00:05:23.8", "bk": 304, "text": "Footage captured by members of Ryan Graves' squadron shows an unidentified object rotating while moving against a wind with a speed of approximately 220 kilometres per hour off the coast of Jacksonville, Florida in 2015.", "att": "", "type": "observation", "cat": "domain", "spk": "", "quote": "including this one, off the coast of Jacksonville, Florida in 2015, captured on a targeting camera by members of Graves' squadron. Look at that thing! It's rotating. My gosh! They're all going against the wind. The wind's 120 knots far west.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "USA, Florida, Jacksonville (vicinity)", "type": "place"}]}, {"loc": "00:05:25.4", "bk": 324, "text": "Voices in footage captured by Ryan Graves' squadron express surprise at the observed unidentified object.", "att": "", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "You can sort of hear the surprise in their voices.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:05:27.3-00:05:33.2", "bk": 324, "text": "Ryan Graves states that pilots in the footage became amazed at the observed unidentified object and momentarily lost their usual professional demeanour.", "att": "", "type": "observation", "cat": "domain", "spk": "Graves, Ryan", "quote": "You certainly can. They seem to have broke character a bit, and were just kind of amazed at what they were seeing.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:05:35.8-00:05:42.8", "bk": 332, "text": "Ryan Graves characterises the observed unidentified object off Jacksonville, Florida in 2015 as difficult to explain due to its rotation, altitude, and apparent propulsion.", "att": "", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "This is a difficult one to explain. You have rotation, you have high altitudes, you have propulsion, right? I don't know. I don't know what it is, frankly.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "USA, Florida, Jacksonville (vicinity)", "type": "place"}]}, {"loc": "00:06:05.4-00:06:08.8", "bk": 364, "text": "Ryan Graves expresses concern about the observed unidentified aerial phenomena.", "att": "", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "Are you alarmed? Ryan Graves: I am worried, frankly.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}], "nodes_by_type": {"organisation": ["60 Minutes", "United States Department of Defense", "United States Senate Intelligence Committee", "Director of National Intelligence", "USS Nimitz Carrier Strike Group", "The New York Times", "History Channel"], "person": ["Whitaker, Bill", "Elizondo, Luis", "Graves, Ryan", "Fravor, David", "Dietrich, Alex", "Mellon, Christopher", "Reid, Harry", "Rubio, Marco"], "project": ["Advanced Aerospace Threat Identification Program (AATIP)", "Project Blue Book", "UAP Task Force"], "object": ["USS Nimitz", "USS Princeton"], "place": ["USA, California, San Diego (vicinity)", "USA, Virginia, Virginia Beach (vicinity)", "USA, Florida, Jacksonville (vicinity)"], "event": ["Nimitz UAP encounter, 2004-11-14", "2015 Atlantic coast UAP sightings"], "document": ["Pentagon declassified Navy UAP videos"]}, "n_claims": 132, "n_nodes": 26, "label": "3: orientation-grounded"}, {"claims": [{"loc": "00:00:07.6-00:00:12.6", "bk": 4, "text": "Unidentified Aerial Phenomena (UAP), more commonly known as Unidentified Flying Objects (UFOs), have been subject to public denial by the US government for decades.", "att": "", "type": "observation", "cat": "domain", "spk": "", "quote": "It's the story of the U.S. government's grudging acknowledgement of Unidentified Aerial Phenomena, UAP, more commonly known as ufos after decades of public denial", "refs": [{"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Unidentified Flying Object (UFO)", "type": "topic"}]}, {"loc": "00:00:14.2-00:00:17.6", "bk": 12, "text": "The United States Department of Defense (DoD) has officially acknowledged the existence of Unidentified Aerial Phenomena (UAP).", "att": "", "type": "observation", "cat": "domain", "spk": "", "quote": "the pentagon now admits there's something out there", "refs": [{"name": "United States Department of Defense (DoD)", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:00:17.6-00:00:29.6", "bk": 16, "text": "The US Senate Select Committee on Intelligence has ordered the Director of National Intelligence and the Secretary of Defense to deliver a report on mysterious UAP sightings.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "the u.s senate wants to know what it is the intelligence committee has ordered the director of national intelligence and the secretary of defense to deliver a report on the mysterious sightings by next month", "refs": [{"name": "US Senate Select Committee on Intelligence", "type": "organisation"}, {"name": "Office of the Director of National Intelligence (ODNI)", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:00:54.6-00:00:59.6", "bk": 52, "text": "The United States government has officially confirmed that Unidentified Flying Objects (UFOs) are real.", "att": "", "type": "observation", "cat": "domain", "spk": "Elizondo, Luis", "quote": "The government has already stated for the record that they're real.", "refs": [{"name": "Unidentified Flying Object (UFO)", "type": "topic"}]}, {"loc": "00:01:02.4-00:01:11.5", "bk": 60, "text": "Luis Elizondo spent 20 years running military intelligence operations in Afghanistan, the Middle East, and Guantanamo.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo.", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:01:11.5-00:01:24.1", "bk": 68, "text": "Luis Elizondo was asked to join the Advanced Aerospace Threat Identification Program (AATIP) at the Pentagon in 2008.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "He hadn't given UFOs a second thought until 2008. That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:01:24.1-00:01:34.3", "bk": 84, "text": "The Advanced Aerospace Threat Identification Program (AATIP) had a mission to collect and analyse information involving Anomalous Aerial Vehicles (AAV), also called Unidentified Aerial Phenomena (UAP).", "att": "", "type": "observation", "cat": "domain", "spk": "Elizondo, Luis", "quote": "The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs. We call them UAPs.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:01:50.3-00:02:01.6", "bk": 108, "text": "The Advanced Aerospace Threat Identification Program (AATIP) was part of a $22 million programme sponsored by Harry Reid, who was then United States Senate Majority Leader, to investigate Unidentified Flying Objects (UFOs).", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "Buried away in the Pentagon, AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Reid, Harry", "type": "person"}, {"name": "Unidentified Flying Object (UFO)", "type": "topic"}]}, {"loc": "00:02:01.6-00:02:10.8", "bk": 120, "text": "Luis Elizondo took over leadership of the Advanced Aerospace Threat Identification Program (AATIP) in 2010 and focused on the national security implications of Unidentified Aerial Phenomena (UAP) documented by US service members.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "When Elizondo took over in 2010, he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "United States Navy", "type": "organisation"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "Luis Elizondo characterises the technology associated with observed Anomalous Aerial Vehicles (AAV) as capable of performing 600 to 700 G-force manoeuvres, flying at approximately 21,000 kilometres per hour, evading radar, flying through air and water and possibly space, having no obvious signs of propulsion, no wings, no control surfaces, and defying the natural effects of Earth's gravity.", "att": "", "type": "measurement", "cat": "domain", "spk": "Elizondo, Luis", "quote": "Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity. That's precisely what we're seeing.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:02:37.0-00:02:47.7", "bk": 156, "text": "The Advanced Aerospace Threat Identification Program (AATIP) team was a loose-knit mix of scientists, electro-optical engineers, avionics specialists, and intelligence experts, often working part-time.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "Elizondo tells us AATIP was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:02:57.7-00:03:02.1", "bk": 176, "text": "Navy aircrew captured video footage of a fast-moving object off the United States Atlantic coast in 2015, which the aircrew struggled to lock onto.", "att": "", "type": "observation", "cat": "domain", "spk": "", "quote": "A Navy aircrew struggles to lock onto a fast-moving object off the U.S. Atlantic coast in 2015.", "refs": [{"name": "United States Navy", "type": "organisation"}]}, {"loc": "00:03:07.3-00:03:20.4", "bk": 184, "text": "The United States Department of Defense (DoD) has admitted it cannot identify certain objects captured in video footage.", "att": "", "type": "observation", "cat": "domain", "spk": "", "quote": "the Pentagon admits it doesn't know what in the world this is, or this, or this.", "refs": [{"name": "United States Department of Defense (DoD)", "type": "organisation"}]}, {"loc": "00:03:30.4-00:03:38.6", "bk": 208, "text": "Luis Elizondo acknowledges that there are simple explanations for some observed phenomena, but states there are some cases with no simple explanation.", "att": "", "type": "opinion", "cat": "domain", "spk": "Elizondo, Luis", "quote": "In some cases, there are simple explanations for what people are witnessing, but there are some that that are not.", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:03:42.7-00:03:52.6", "bk": 220, "text": "The Advanced Aerospace Threat Identification Program (AATIP) conducted due diligence in investigating Unidentified Aerial Phenomena (UAP), including considering whether they could be new cruise missile technology developed by China or high-altitude balloons conducting reconnaissance.", "att": "", "type": "observation", "cat": "domain", "spk": "Elizondo, Luis", "quote": "We're not just simply jumping to a conclusion that's saying, oh, that's a UAP out there. We're going through our due diligence. Is it some sort of new type of cruise missile technology that China has developed? Is it some sort of high-altitude balloon that's conducting reconnaissance?", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:03:52.6-00:04:06.2", "bk": 232, "text": "Luis Elizondo characterises a Unidentified Aerial Phenomena (UAP) situation as becoming compelling and problematic when all conventional explanations have been exhausted and the object remains unexplained in restricted airspace.", "att": "", "type": "opinion", "cat": "domain", "spk": "Elizondo, Luis", "quote": "Ultimately, when you have exhausted all those what-ifs and you're still left with the fact that this is in our airspace and it's real, that's when it becomes compelling and that's when it becomes problematic.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:06.2-00:04:12.9", "bk": 244, "text": "Former United States Navy pilot Lieutenant Ryan Graves considers Unidentified Aerial Phenomena (UAP) a security risk.", "att": "", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "Former Navy pilot Lieutenant Ryan Graves calls whatever is out there a security risk.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "United States Navy", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:12.9-00:04:29.7", "bk": 252, "text": "Ryan Graves's F/A-18 squadron began observing Unidentified Aerial Phenomena (UAP) hovering over restricted airspace southeast of Virginia Beach in 2014 after their jet's radar was updated to enable infrared targeting camera lock-on capability.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Graves, Ryan", "quote": "He told us his F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar, making it possible to zero in with infrared targeting cameras.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "F/A-18 Super Hornet", "type": "object"}, {"name": "USA, Virginia, Virginia Beach", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:29.7-00:04:37.1", "bk": 268, "text": "The dual radar and infrared detection of Unidentified Aerial Phenomena (UAP) is difficult to spoof.", "att": "", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "So you're seeing it both with the radar and with the infrared, and that tells you that there is something out there. Ryan Graves: Pretty hard to spoof that.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:38.6-00:04:48.2", "bk": 276, "text": "Photographs of unidentified objects were taken in 2019 in the airspace southeast of Virginia Beach, and the United States Department of Defense (DoD) has confirmed these are images of objects it cannot identify.", "att": "", "type": "observation", "cat": "domain", "spk": "", "quote": "These photographs were taken in 2019 in the same area. The Pentagon confirms these are images of objects it can't identify.", "refs": [{"name": "United States Department of Defense (DoD)", "type": "organisation"}, {"name": "USA, Virginia, Virginia Beach", "type": "place"}]}, {"loc": "00:04:48.2-00:04:56.6", "bk": 288, "text": "Ryan Graves reports that pilots training off the Atlantic coast observe Unidentified Aerial Phenomena (UAP) every day.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Graves, Ryan", "quote": "Lieutenant Graves told us pilots training off the Atlantic coast see things like that all the time. Ryan Graves: Every day. Every day for at least a couple of years.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:05:01.2-00:05:02.5", "bk": 300, "text": "Ryan Graves observed no exhaust plume on the Unidentified Aerial Phenomena (UAP) observed off the Atlantic coast.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Graves, Ryan", "quote": "You know, I don't see an exhaust plume.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:58.7-00:05:04.3", "bk": 296, "text": "A targeting camera operated by members of Ryan Graves's squadron captured video footage of an unidentified object off the coast of Jacksonville, Florida in 2015.", "att": "", "type": "observation", "cat": "domain", "spk": "", "quote": "including this one, off the coast of Jacksonville, Florida in 2015, captured on a targeting camera by members of Graves' squadron.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "USA, Florida, Jacksonville", "type": "place"}, {"name": "Targeting camera footage, Jacksonville, Florida", "type": "event"}]}, {"loc": "00:05:12.8-00:05:21.6", "bk": 312, "text": "In video footage captured by Navy personnel, aircrew members expressed surprise at observing an object rotating whilst other objects appeared to be moving against the wind, with one recording indicating wind conditions of approximately 220 kilometres per hour from the far west.", "att": "", "type": "observation", "cat": "domain", "spk": "", "quote": "Look at that thing! It's rotating. My gosh! They're all going against the wind. The wind's 120 knots far west. Look at that thing, dude.", "refs": [{"name": "United States Navy", "type": "organisation"}]}, {"loc": "00:05:27.3-00:05:27.9", "bk": 324, "text": "Ryan Graves observes that aircrew expressed amazement at what they were observing in the video footage.", "att": "", "type": "observation", "cat": "domain", "spk": "Graves, Ryan", "quote": "You certainly can. They seem to have broke character a bit, and were just kind of amazed at what they were seeing.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:05:35.8-00:05:42.8", "bk": 332, "text": "Ryan Graves characterises the object observed in the targeting camera footage as difficult to explain, noting it exhibits rotation, high altitude flight capability, and propulsion.", "att": "", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "This is a difficult one to explain. You have rotation, you have high altitudes, you have propulsion, right? I don't know. I don't know what it is, frankly.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:05:44.9-00:05:50.0", "bk": 344, "text": "Navy pilots speculate that Unidentified Aerial Phenomena (UAP) are one of three things: secret United States technology, an adversary spy vehicle, or something otherworldly.", "att": "", "type": "opinion", "cat": "domain", "spk": "", "quote": "He told us pilots speculate they are one of three things, secret U.S. technology, an adversary spy vehicle, or something otherworldly.", "refs": [{"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:05:56.0", "bk": 356, "text": "Ryan Graves considers a threat observation programme to be the highest probability explanation for the observed Unidentified Aerial Phenomena (UAP).", "att": "", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "I'd say, you know, the highest probability is it's a threat observation program.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:06:00.5-00:06:04.1", "bk": 360, "text": "Ryan Graves considers Russian or Chinese technology a possible explanation for the observed Unidentified Aerial Phenomena (UAP).", "att": "", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "Could it be Russian or Chinese technology? Ryan Graves: I don't see why not.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:06:05.4-00:06:18.5", "bk": 364, "text": "Ryan Graves is worried about the Unidentified Aerial Phenomena (UAP) observed off the Atlantic coast, stating that if these were tactical jets from another country, it would be regarded as a massive issue, but because they appear unusual, the problem is being ignored rather than addressed directly.", "att": "", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "Are you alarmed? Ryan Graves: I am worried, frankly. You know, if these were tactical jets from another country that were hanging out up there, it would be a massive issue. But because it looks slightly different, we're not willing to actually look at the problem in the face. We're happy to just ignore the fact that these are out there watching us every day.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:06:23.4-00:06:30.3", "bk": 380, "text": "The United States government closed Project Blue Book, its investigation into Unidentified Flying Objects (UFOs), in 1969.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "The government has ignored it, at least publicly, since closing its Project Blue Book investigation in 1969.", "refs": [{"name": "Project Blue Book", "type": "project"}, {"name": "Unidentified Flying Object (UFO)", "type": "topic"}]}, {"loc": "00:06:30.3-00:06:40.8", "bk": 388, "text": "An incident involving Unidentified Aerial Phenomena (UAP) occurred off Southern California in 2004, documented by radar, camera, and four naval aviators.", "att": "", "type": "observation", "cat": "domain", "spk": "", "quote": "But that began to change after an incident off Southern California in 2004, which was documented by radar, by camera, and four naval aviators.", "refs": [{"name": "USA, California, San Diego", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "USS Nimitz Carrier Strike Group UAP encounter", "type": "event"}]}, {"loc": "00:06:40.8-00:06:48.8", "bk": 400, "text": "David Fravor is a graduate of Top Gun Naval Flight School and was commander of an F/A-18 squadron on the USS Nimitz.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Top Gun Naval Flight School", "type": "organisation"}, {"name": "USS Nimitz", "type": "object"}]}, {"loc": "00:06:40.8-00:06:57.3", "bk": 400, "text": "Lieutenant Alex Dietrich was flying at David Fravor's wing position during the USS Nimitz Carrier Strike Group encounter in November 2004.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "and flying at his wing, Lieutenant Alex Dietrich, who has never spoken publicly about the encounter.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Fravor, David", "type": "person"}, {"name": "USS Nimitz Carrier Strike Group UAP encounter", "type": "event"}]}, {"loc": "00:06:40.8-00:06:57.3", "bk": 400, "text": "Alex Dietrich had never previously spoken publicly about the USS Nimitz Carrier Strike Group encounter prior to appearing on 60 Minutes.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "Lieutenant Alex Dietrich, who has never spoken publicly about the encounter.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "USS Nimitz Carrier Strike Group UAP encounter", "type": "event"}]}, {"loc": "00:07:02.7-00:07:14.4", "bk": 420, "text": "Alex Dietrich chose to participate in this public discussion because she was operating a government aircraft, was on duty, and feels a responsibility to share unclassified information about the encounter.", "att": "", "type": "opinion", "cat": "domain", "spk": "Dietrich, Alex", "quote": "Because I was in a government aircraft, because I was on the clock, and so I feel a responsibility to share what I can, and it is unclassified.", "refs": [{"name": "Dietrich, Alex", "type": "person"}]}, {"loc": "00:07:14.4-00:07:23.1", "bk": 432, "text": "In November 2004, the USS Nimitz Carrier Strike Group was training approximately 160 kilometres southwest of San Diego, California.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego.", "refs": [{"name": "USS Nimitz Carrier Strike Group UAP encounter", "type": "event"}, {"name": "USA, California, San Diego", "type": "place"}]}, {"loc": "00:07:23.1-00:07:39.3", "bk": 440, "text": "The USS Princeton, equipped with advanced new radar, detected what operators called multiple anomalous aerial vehicles over the horizon for a week, descending approximately 24,000 metres in less than one second.", "att": "", "type": "measurement", "cat": "domain", "spk": "", "quote": "For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 80,000 feet in less than a second.", "refs": [{"name": "USS Princeton", "type": "object"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:07:39.3-00:07:47.8", "bk": 456, "text": "On 2004-11-14, David Fravor and Alex Dietrich, each with a weapons system officer in the backseat, were diverted to investigate anomalous aerial contacts detected by USS Princeton radar.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "USS Nimitz Carrier Strike Group UAP encounter", "type": "event"}]}, {"loc": "00:07:47.8-00:07:55.9", "bk": 464, "text": "During the USS Nimitz Carrier Strike Group UAP encounter, David Fravor and Alex Dietrich found an area of roiling white water approximately the size of a 737 aircraft in an otherwise calm blue sea.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "", "quote": "They found an area of roiling white water the size of a 737 in an otherwise calm blue sea.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "USS Nimitz Carrier Strike Group UAP encounter", "type": "event"}]}, {"loc": "00:07:55.9-00:08:09.7", "bk": 472, "text": "During the USS Nimitz Carrier Strike Group UAP encounter, David Fravor and Alex Dietrich observed a small white tic-tac-shaped object moving above an area of roiling white water.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "So as we're looking at this, her backseater says, hey, Skipper, do you? And about that got out, I said, dude, do you see that thing down there? And we saw this little white tic-tac-looking object. And it's just kind of moving above the whitewater area.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "USS Nimitz Carrier Strike Group UAP encounter", "type": "event"}]}, {"loc": "00:08:12.3-00:08:24.5", "bk": 492, "text": "During the USS Nimitz Carrier Strike Group UAP encounter, as David Fravor spiralled down towards the unidentified craft, the tic-tac object turned abruptly and began mirroring his manoeuvres, climbing as he descended.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "Sort of spiraling down? David Fravor: Yep. The tic-tac's still pointing north-south. It goes and just turns abruptly and starts mirroring me. So as I'm coming down, it starts coming up.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "USS Nimitz Carrier Strike Group UAP encounter", "type": "event"}]}, {"loc": "00:08:27.0-00:08:28.9", "bk": 504, "text": "David Fravor observed that the unidentified tic-tac object was aware of his presence during the USS Nimitz Carrier Strike Group encounter.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "So it's mimicking your moves. David Fravor: Yeah, it was aware we were there.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "USS Nimitz Carrier Strike Group UAP encounter", "type": "event"}]}, {"loc": "00:08:30.5-00:08:37.0", "bk": 508, "text": "The unidentified tic-tac object observed during the USS Nimitz Carrier Strike Group encounter was approximately the size of an F/A-18 fighter jet, with no visible markings, wings, or exhaust plumes.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "", "quote": "He said it was about the size of his F-18, with no markings, no wings, no exhaust plumes.", "refs": [{"name": "F/A-18 Super Hornet", "type": "object"}, {"name": "USS Nimitz Carrier Strike Group UAP encounter", "type": "event"}]}, {"loc": "00:08:37.0-00:08:47.8", "bk": 516, "text": "During the USS Nimitz Carrier Strike Group encounter, David Fravor attempted to get closer to the tic-tac object, but when it came right in front of him, it suddenly disappeared at high speed.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "I want to see how close I can get. So I go like this, and it's climbing still. And when it gets right in front of me, it just disappears. David Fravor: Disappears, like gone. It had sped off.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "USS Nimitz Carrier Strike Group UAP encounter", "type": "event"}]}, {"loc": "00:08:49.4-00:09:00.9", "bk": 528, "text": "During the USS Nimitz Carrier Strike Group encounter, Alex Dietrich initially categorised the unidentified object as possibly a helicopter or drone, but when it disappeared she struggled to make sense of the observation.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Dietrich, Alex", "quote": "So your mind tries to make sense of it. I'm going to categorize this as maybe a helicopter or maybe a drone. And when it disappeared, I mean, it was just...", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "USS Nimitz Carrier Strike Group UAP encounter", "type": "event"}]}, {"loc": "00:09:00.9-00:09:08.9", "bk": 540, "text": "During the USS Nimitz Carrier Strike Group encounter, the weapons system officers in both aircraft observed the tic-tac object along with David Fravor and Alex Dietrich.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "Did your back seaters see this too? Alex Dietrich: Yeah. David Fravor: Oh, yeah. There was four of us in the airplanes literally watching this thing for roughly about five minutes.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "USS Nimitz Carrier Strike Group UAP encounter", "type": "event"}]}, {"loc": "00:09:08.9-00:09:14.4", "bk": 548, "text": "During the USS Nimitz Carrier Strike Group encounter, the USS Princeton reacquired the radar target approximately 100 kilometres away seconds after David Fravor observed the tic-tac object disappear.", "att": "", "type": "measurement", "cat": "domain", "spk": "", "quote": "Seconds later, the Princeton reacquired the target, 60 miles away.", "refs": [{"name": "USS Princeton", "type": "object"}, {"name": "USS Nimitz Carrier Strike Group UAP encounter", "type": "event"}]}, {"loc": "00:09:14.4-00:09:20.8", "bk": 552, "text": "During the USS Nimitz Carrier Strike Group encounter, another aircraft briefly locked onto the unidentified object with a targeting camera before it moved away rapidly.", "att": "", "type": "observation", "cat": "domain", "spk": "", "quote": "Another crew managed to briefly lock onto it with a targeting camera before it zipped off again.", "refs": [{"name": "USS Nimitz Carrier Strike Group UAP encounter", "type": "event"}]}, {"loc": "00:09:20.8-00:09:31.1", "bk": 560, "text": "Alex Dietrich indicates that had she witnessed the USS Nimitz Carrier Strike Group encounter alone, she would likely not have reported it due to how extraordinary the account sounds.", "att": "", "type": "opinion", "cat": "domain", "spk": "Dietrich, Alex", "quote": "You know, I think that over beers, we've sort of said, hey, man, if I saw this solo, I don't know that I would have come back and said anything because it sounds so crazy when I say it.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "USS Nimitz Carrier Strike Group UAP encounter", "type": "event"}]}, {"loc": "00:09:31.1-00:09:37.9", "bk": 568, "text": "David Fravor acknowledges that people have told him his account of the USS Nimitz Carrier Strike Group encounter can sound unbelievable.", "att": "", "type": "opinion", "cat": "domain", "spk": "Fravor, David", "quote": "I do. I've had some people tell me, you know, when you say that, you can sound crazy.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "USS Nimitz Carrier Strike Group UAP encounter", "type": "event"}]}, {"loc": "00:09:37.9-00:09:39.8", "bk": 576, "text": "David Fravor states he is not a believer in Unidentified Flying Objects (UFOs) in general.", "att": "", "type": "opinion", "cat": "domain", "spk": "Fravor, David", "quote": "I'll be honest. I'm not a UFO guy.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Unidentified Flying Object (UFO)", "type": "topic"}]}, {"loc": "00:09:45.5-00:09:56.5", "bk": 584, "text": "David Fravor is certain that something real was observed during the USS Nimitz Carrier Strike Group encounter that exceeded the capabilities of their aircraft, though he cannot identify its origin or technology.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "Yes. There's definitely something that, I don't know who's building it, who's got the technology, who's got the brains, but there's something out there that was better than our airplane.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "USS Nimitz Carrier Strike Group UAP encounter", "type": "event"}]}, {"loc": "00:09:56.5-00:09:58.7", "bk": 596, "text": "The aircrew involved in the USS Nimitz Carrier Strike Group encounter filed official reports about their observations.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "The air crew filed reports.", "refs": [{"name": "USS Nimitz Carrier Strike Group UAP encounter", "type": "event"}]}, {"loc": "00:09:58.7-00:10:04.2", "bk": 596, "text": "The USS Nimitz Carrier Strike Group UAP encounter was not officially addressed or discussed for five years following the initial incident.", "att": "", "type": "observation", "cat": "domain", "spk": "", "quote": "Then, like the mysterious flying object, the Nimitz encounter disappeared. Nothing was said or done officially for five years", "refs": [{"name": "USS Nimitz Carrier Strike Group UAP encounter", "type": "event"}]}, {"loc": "00:10:04.2-00:10:13.2", "bk": 604, "text": "Luis Elizondo discovered and investigated the USS Nimitz Carrier Strike Group encounter story, which had previously been overlooked.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "until Lou Elizondo came across the story and investigated.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "USS Nimitz Carrier Strike Group UAP encounter", "type": "event"}]}, {"loc": "00:10:13.2-00:10:27.7", "bk": 612, "text": "Luis Elizondo characterises the USS Nimitz encounter as compelling because trained, expensive pilots observed something they could not explain, and their observations were corroborated by electro-optical data including gun camera footage and radar data.", "att": "", "type": "opinion", "cat": "domain", "spk": "Elizondo, Luis", "quote": "We spend millions of dollars in training these pilots, and they are seeing something that they can't explain. Furthermore, that information's being backed up on electro-optical data, like gun camera footage, and by radar data. Now, to me, that's compelling.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "USS Nimitz Carrier Strike Group UAP encounter", "type": "event"}]}, {"loc": "00:10:27.7-00:10:31.7", "bk": 624, "text": "Inside the United States Department of Defense (DoD), the findings of the Advanced Aerospace Threat Identification Program (AATIP) regarding the USS Nimitz encounter were met with scepticism.", "att": "", "type": "observation", "cat": "domain", "spk": "", "quote": "Inside the Pentagon, his findings were met with skepticism.", "refs": [{"name": "United States Department of Defense (DoD)", "type": "organisation"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:10:31.7-00:10:39.5", "bk": 628, "text": "The Advanced Aerospace Threat Identification Program (AATIP) funding was eliminated in 2012.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "AATIP's funding was eliminated in 2012", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:10:39.5-00:10:48.8", "bk": 636, "text": "Luis Elizondo and a small group of colleagues continued the Advanced Aerospace Threat Identification Program (AATIP) mission even after official funding was eliminated in 2012.", "att": "", "type": "observation", "cat": "domain", "spk": "", "quote": "but Elizondo says he and a handful of others kept the mission alive.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:10:39.5-00:10:48.8", "bk": 636, "text": "Luis Elizondo quit the United States Department of Defense (DoD) in 2017, but prior to his resignation he succeeded in getting three Unidentified Aerial Phenomena (UAP) videos declassified.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "until finally, frustrated, he quit the Pentagon in 2017, but not before getting these three videos declassified.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "United States Department of Defense (DoD)", "type": "organisation"}, {"name": "Navy UAP declassified video trilogy", "type": "document"}]}, {"loc": "00:10:57.5-00:11:04.3", "bk": 656, "text": "Christopher Mellon served as Deputy Assistant Secretary of Defence for Intelligence for Presidents Bill Clinton and George W. Bush, and had access to top-secret government programmes.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush, and had access to top-secret government programs.", "refs": [{"name": "Mellon, Christopher", "type": "person"}]}, {"loc": "00:11:08.4-00:11:18.7", "bk": 668, "text": "Christopher Mellon expresses high confidence that Unidentified Aerial Phenomena (UAP) are not of United States origin, based in part on his previous positions in the United States Department of Defense (DoD) and his knowledge of government processes.", "att": "", "type": "opinion", "cat": "domain", "spk": "Mellon, Christopher", "quote": "So it's not us, that's one thing we know. Christopher Mellon: I could say that with a very high degree of confidence, in part because of the positions I held in the department, and I know the process.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:11:37.0-00:11:46.1", "bk": 696, "text": "Christopher Mellon characterises the need for a private citizen to publicise a national security issue regarding Unidentified Aerial Phenomena (UAP) as bizarre and unfortunate.", "att": "", "type": "opinion", "cat": "domain", "spk": "Mellon, Christopher", "quote": "It's bizarre and unfortunate that someone like myself has to do something like that to get a national security issue like this on the agenda.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:11:57.6-00:12:07.2", "bk": 716, "text": "Christopher Mellon and Luis Elizondo pursued a public engagement strategy, understanding that gaining public interest would lead to Congressional interest and then lead the United States Department of Defense (DoD) to address Unidentified Aerial Phenomena (UAP) as a national security issue.", "att": "", "type": "opinion", "cat": "domain", "spk": "Mellon, Christopher", "quote": "We knew and understood that you had to go to the public, get the public interested to get Congress interested, to then circle back to the Defense Department and get them to start taking a look at it.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Elizondo, Luis", "type": "person"}, {"name": "United States Department of Defense (DoD)", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:12:07.2-00:12:15.6", "bk": 724, "text": "In August (date year not specified but context indicates 2020), the United States Department of Defense (DoD) resurrected the Advanced Aerospace Threat Identification Program (AATIP) under a new name, the Unidentified Aerial Phenomena (UAP) Task Force.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "This past August, the Pentago
