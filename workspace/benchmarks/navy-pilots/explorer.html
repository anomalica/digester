bio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "UAP Task Force", "type": "organisation"}]}, {"loc": "00:13:37.3", "bk": 816, "text": "Alex Dietrich stated that during the Nimitz UAP Encounter 2004 she felt the vulnerability of not having anything to defend herself.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Dietrich, Alex", "quote": "I felt the vulnerability of not having anything to defend ourselves.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}]}], "nodes_by_type": {"person": ["Whitaker, Bill", "Elizondo, Luis", "Graves, Ryan", "Fravor, David", "Dietrich, Alex", "Mellon, Christopher", "Rubio, Marco", "Reid, Harry"], "project": ["Advanced Aerospace Threat Identification Program (AATIP)", "Project Blue Book"], "organisation": ["UAP Task Force", "US Pentagon", "US Navy", "US Senate Intelligence Committee", "Office of the Director of National Intelligence (ODNI)", "The New York Times", "History Channel", "60 Minutes", "USS Nimitz Carrier Strike Group", "Top Gun Naval Flight School"], "object": ["USS Nimitz", "USS Princeton", "Infrared Targeting Camera", "F/A-18 Super Hornet"], "event": ["Nimitz UAP Encounter 2004", "UAP Sightings off Atlantic Coast 2014-2015"], "document": ["Navy pilots describe encounters with UFOs (60 Minutes, 2021)", "UAP Navy Videos Declassified (2017)", "UAP Atlantic Coast Targeting Camera Footage 2015", "Unclassified UAP Report to Congress 2021", "UAP Photographs off Atlantic Coast 2019"], "place": ["USA, California, San Diego (offshore)", "USA, Virginia, Virginia Beach (restricted airspace)", "USA, Florida, Jacksonville (offshore)"], "topic": ["Unidentified Aerial Phenomena (UAP)", "Anomalous Aerial Vehicle (AAV)", "UAP Stigma in Government and Military"]}, "n_claims": 83, "n_nodes": 37, "label": "1: attestation+Q&A"}, {"claims": [{"loc": "00:00:07.6", "bk": 4, "text": "The US government has made a grudging acknowledgement of Unidentified Aerial Phenomena (UAP), commonly known as UFOs, after decades of public denial.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "It's the story of the U.S. government's grudging acknowledgement of Unidentified Aerial Phenomena, UAP, more commonly known as ufos after decades of public denial", "refs": [{"name": "Whitaker, Bill", "type": "person"}, {"name": "US Department of Defense (DoD)", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Navy pilots describe encounters with UFOs (60 Minutes, 2021)", "type": "document"}]}, {"loc": "00:00:14.9", "bk": 12, "text": "The Pentagon admitted there is something unidentified in US airspace.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "the pentagon now admits there's something out there", "refs": [{"name": "Pentagon", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Navy pilots describe encounters with UFOs (60 Minutes, 2021)", "type": "document"}]}, {"loc": "00:00:14.9", "bk": 12, "text": "The US Senate Intelligence Committee ordered the Director of National Intelligence and the Secretary of Defense to deliver a report on mysterious UAP sightings by June 2021.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "the u.s senate wants to know what it is the intelligence committee has ordered the director of national intelligence and the secretary of defense to deliver a report on the mysterious sightings by next month", "refs": [{"name": "US Senate Select Committee on Intelligence", "type": "organisation"}, {"name": "Office of the Director of National Intelligence", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "UAP Report to Congress (2021)", "type": "document"}, {"name": "Navy pilots describe encounters with UFOs (60 Minutes, 2021)", "type": "document"}]}, {"loc": "00:00:54.6", "bk": 52, "text": "Luis Elizondo stated that the US government has officially confirmed for the record that UAPs are real.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "The government has already stated for the record that they're real. I'm not telling you that. The United States government is telling you that.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "US Department of Defense (DoD)", "type": "organisation"}]}, {"loc": "00:01:02.4", "bk": 60, "text": "Luis Elizondo spent 20 years running military intelligence operations worldwide, including in Afghanistan, the Middle East, and Guantanamo.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo.", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:01:11.5", "bk": 68, "text": "Luis Elizondo had not given UFOs any serious consideration until 2008.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "He hadn't given UFOs a second thought until 2008.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:01:15.6", "bk": 72, "text": "In 2008, Luis Elizondo was asked to join the Advanced Aerospace Threat Identification Program (AATIP), a programme based at the Pentagon.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Pentagon", "type": "place"}]}, {"loc": "00:01:24.1", "bk": 84, "text": "The mission of the Advanced Aerospace Threat Identification Program (AATIP) was to collect and analyse information involving anomalous aerial vehicles (UAP).", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs. We call them UAPs.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:01:50.3", "bk": 108, "text": "The Advanced Aerospace Threat Identification Program (AATIP) was part of a US$22 million programme sponsored by then Senate Majority Leader Harry Reid to investigate UFOs.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Buried away in the Pentagon, AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Pentagon", "type": "place"}, {"name": "Reid, Harry", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:02:01.6", "bk": 120, "text": "Luis Elizondo took over the Advanced Aerospace Threat Identification Program (AATIP) in 2010, focusing on the national security implications of UAP documented by US service members.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "When Elizondo took over in 2010, he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:02:12.6", "bk": 132, "text": "Luis Elizondo described UAP observed by AATIP as capable of enduring 600 to 700 G-forces.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "Imagine a technology that can do 600 to 700 G-forces", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:02:12.6", "bk": 132, "text": "Luis Elizondo described UAP observed by AATIP as capable of flying at approximately 21,000 km/h (13,000 miles per hour).", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "that can fly at 13,000 miles an hour", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:02:12.6", "bk": 132, "text": "Luis Elizondo described UAP observed by AATIP as capable of evading radar.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "that can evade radar", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:02:12.6", "bk": 132, "text": "Luis Elizondo described UAP observed by AATIP as capable of travelling through air, water, and possibly space.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "that can fly through air and water and possibly space", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:02:12.6", "bk": 132, "text": "Luis Elizondo described UAP observed by AATIP as having no obvious signs of propulsion, no wings, and no control surfaces.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "has no obvious signs of propulsion, no wings, no control surfaces", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:02:12.6", "bk": 132, "text": "Luis Elizondo described UAP observed by AATIP as capable of defying the natural effects of Earth's gravity.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "and yet still can defy the natural effects of Earth's gravity", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:02:37.0", "bk": 156, "text": "The Advanced Aerospace Threat Identification Program (AATIP) was a loose-knit mix of scientists, electro-optical engineers, avionics experts, and intelligence experts, often working part-time.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Elizondo tells us AATIP was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:02:57.7", "bk": 176, "text": "A US Navy aircrew filmed a fast-moving UAP off the US Atlantic coast in 2015 using a targeting camera.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "A Navy aircrew struggles to lock onto a fast-moving object off the U.S. Atlantic coast in 2015.", "refs": [{"name": "US Navy", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "UAP Sighting off Jacksonville Florida 2015", "type": "event"}]}, {"loc": "00:03:07.3", "bk": 184, "text": "The Pentagon admitted it cannot identify the UAP objects shown in recently released video footage.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "the Pentagon admits it doesn't know what in the world this is, or this, or this.", "refs": [{"name": "Pentagon", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "US Navy UAP Videos Declassification", "type": "event"}]}, {"loc": "00:03:30.4", "bk": 208, "text": "Luis Elizondo acknowledged that in some cases there are simple explanations for UAP sightings, but that some cases remain unexplained after thorough investigation.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "In some cases, there are simple explanations for what people are witnessing, but there are some that are not. We're not just simply jumping to a conclusion that's saying, oh, that's a UAP out there. We're going through our due diligence.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:03:44.3", "bk": 224, "text": "Luis Elizondo stated that among the explanations considered for UAP are new types of cruise missile technology developed by China, and high-altitude reconnaissance balloons.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "Is it some sort of new type of cruise missile technology that China has developed? Is it some sort of high-altitude balloon that's conducting reconnaissance?", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:03:52.6", "bk": 232, "text": "Luis Elizondo stated that when all conventional explanations are exhausted and UAP remain present in US airspace, the phenomenon becomes both compelling and problematic.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Elizondo, Luis", "quote": "Ultimately, when you have exhausted all those what-ifs and you're still left with the fact that this is in our airspace and it's real, that's when it becomes compelling and that's when it becomes problematic.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:06.2", "bk": 244, "text": "Ryan Graves holds the rank of Lieutenant and is a former US Navy pilot.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Former Navy pilot Lieutenant Ryan Graves", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "US Navy", "type": "organisation"}]}, {"loc": "00:04:06.2", "bk": 244, "text": "Ryan Graves considers UAP observed near restricted airspace a security risk.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "Former Navy pilot Lieutenant Ryan Graves calls whatever is out there a security risk.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "UAP Sightings off Virginia Beach 2014-2019", "type": "event"}]}, {"loc": "00:04:12.9", "bk": 252, "text": "Ryan Graves' F/A-18 Hornet squadron began seeing UAPs hovering over restricted airspace south-east of Virginia Beach from 2014, following an upgrade to their aircraft's radar that also enabled infrared targeting.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Whitaker, Bill", "quote": "He told us his F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar, making it possible to zero in with infrared targeting cameras.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "US Navy", "type": "organisation"}, {"name": "USA, Virginia, Virginia Beach", "type": "place"}, {"name": "UAP Sightings off Virginia Beach 2014-2019", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:37.1", "bk": 276, "text": "Ryan Graves stated that the dual radar and infrared detection of UAPs off Virginia Beach makes it very difficult to dismiss the sightings as spoofed signals.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "Pretty hard to spoof that.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "UAP Sightings off Virginia Beach 2014-2019", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:38.6", "bk": 276, "text": "Photographs of UAPs south-east of Virginia Beach were taken in 2019, and the Pentagon confirmed these are images of objects it cannot identify.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "These photographs were taken in 2019 in the same area. The Pentagon confirms these are images of objects it can't identify.", "refs": [{"name": "Pentagon", "type": "place"}, {"name": "USA, Virginia, Virginia Beach", "type": "place"}, {"name": "UAP Sightings off Virginia Beach 2014-2019", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:55.3", "bk": 292, "text": "Ryan Graves stated that US Navy pilots training off the Atlantic coast observed UAPs every day for at least a couple of years.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Graves, Ryan", "quote": "Every day. Every day for at least a couple of years.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "US Navy", "type": "organisation"}, {"name": "UAP Sightings off Virginia Beach 2014-2019", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:05:02.5", "bk": 300, "text": "Ryan Graves noted that the UAP observed by his squadron showed no exhaust plume.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Graves, Ryan", "quote": "You know, I don't see an exhaust plume.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "UAP Sightings off Virginia Beach 2014-2019", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:05:04.3", "bk": 304, "text": "In 2015, a UAP was captured on a targeting camera off the coast of Jacksonville, Florida by members of Ryan Graves' F/A-18 Hornet squadron.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "including this one, off the coast of Jacksonville, Florida in 2015, captured on a targeting camera by members of Graves' squadron.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "US Navy", "type": "organisation"}, {"name": "USA, Florida, Jacksonville", "type": "place"}, {"name": "UAP Sighting off Jacksonville Florida 2015", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:05:15.1", "bk": 312, "text": "During the 2015 UAP sighting off Jacksonville, Florida, the UAP was observed to be rotating.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "", "quote": "It's rotating.", "refs": [{"name": "UAP Sighting off Jacksonville Florida 2015", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "USA, Florida, Jacksonville", "type": "place"}]}, {"loc": "00:05:17.9", "bk": 316, "text": "During the 2015 UAP sighting off Jacksonville, Florida, the UAP appeared to be moving against the wind, which was recorded as approximately 120 knots (approximately 220 km/h) from the west.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "", "quote": "They're all going against the wind. The wind's 120 knots far west.", "refs": [{"name": "UAP Sighting off Jacksonville Florida 2015", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "USA, Florida, Jacksonville", "type": "place"}]}, {"loc": "00:05:27.3", "bk": 324, "text": "Ryan Graves confirmed that the pilots who filmed the 2015 UAP off Jacksonville appeared genuinely amazed at what they were seeing, having broken from their usual composed demeanour.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Graves, Ryan", "quote": "They seem to have broke character a bit, and were just kind of amazed at what they were seeing.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "UAP Sighting off Jacksonville Florida 2015", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:05:35.8", "bk": 332, "text": "Ryan Graves characterised the 2015 UAP off Jacksonville as exhibiting rotation, high altitude, and apparent propulsion, and stated he could not identify what it was.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Graves, Ryan", "quote": "You have rotation, you have high altitudes, you have propulsion, right? I don't know. I don't know what it is, frankly.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "UAP Sighting off Jacksonville Florida 2015", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:05:44.9", "bk": 344, "text": "Ryan Graves stated that US Navy pilots speculate UAPs are one of three things: secret US technology, an adversary spy vehicle, or something otherworldly.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Whitaker, Bill", "quote": "He told us pilots speculate they are one of three things, secret U.S. technology, an adversary spy vehicle, or something otherworldly.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "US Navy", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:05:56.0", "bk": 356, "text": "Ryan Graves assessed the highest probability explanation for the observed UAPs to be a threat observation programme.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "I'd say, you know, the highest probability is it's a threat observation program.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:06:04.1", "bk": 364, "text": "Ryan Graves stated he did not rule out the possibility that the observed UAPs represent Russian or Chinese technology.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "I don't see why not.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:06:07.0", "bk": 364, "text": "Ryan Graves stated he is worried about the UAP phenomenon, noting that if similarly performing vehicles belonged to another country's military they would constitute a massive security issue, but that the unusual appearance of UAPs leads to the problem being ignored.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "I am worried, frankly. You know, if these were tactical jets from another country that were hanging out up there, it would be a massive issue. But because it looks slightly different, we're not willing to actually look at the problem in the face. We're happy to just ignore the fact that these are out there watching us every day.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "UAP Sightings off Virginia Beach 2014-2019", "type": "event"}]}, {"loc": "00:06:23.4", "bk": 380, "text": "The US government publicly ignored the UAP phenomenon after closing Project Blue Book in 1969.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "The government has ignored it, at least publicly, since closing its Project Blue Book investigation in 1969.", "refs": [{"name": "Project Blue Book", "type": "project"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "US Department of Defense (DoD)", "type": "organisation"}]}, {"loc": "00:06:30.3", "bk": 388, "text": "The Nimitz UAP Encounter 2004 off Southern California was documented by radar, camera, and four naval aviators.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "But that began to change after an incident off Southern California in 2004, which was documented by radar, by camera, and four naval aviators.", "refs": [{"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "USA, California, San Diego", "type": "place"}, {"name": "US Navy", "type": "organisation"}, {"name": "USS Nimitz (CVN-68)", "type": "object"}]}, {"loc": "00:06:40.8", "bk": 400, "text": "David Fravor is a graduate of the Top Gun Naval Flight School.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "David Fravor, a graduate of the Top Gun Naval Flight School", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Top Gun Naval Flight School", "type": "organisation"}]}, {"loc": "00:06:40.8", "bk": 400, "text": "David Fravor served as commander of the F/A-18 Hornet squadron aboard the USS Nimitz (CVN-68) at the time of the 2004 UAP encounter.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "commander of the F-18 squadron on the USS Nimitz", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "USS Nimitz (CVN-68)", "type": "object"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}]}, {"loc": "00:06:40.8", "bk": 400, "text": "Alex Dietrich flew as wingman to David Fravor during the 2004 Nimitz UAP encounter.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "flying at his wing, Lieutenant Alex Dietrich", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "USS Nimitz (CVN-68)", "type": "object"}]}, {"loc": "00:06:40.8", "bk": 400, "text": "Alex Dietrich had never spoken publicly about the 2004 Nimitz UAP encounter prior to appearing on 60 Minutes in 2021.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Lieutenant Alex Dietrich, who has never spoken publicly about the encounter.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "60 Minutes", "type": "organisation"}, {"name": "Navy pilots describe encounters with UFOs (60 Minutes, 2021)", "type": "document"}]}, {"loc": "00:07:02.7", "bk": 420, "text": "Alex Dietrich stated she decided to speak publicly about the 2004 Nimitz UAP encounter because she was in a government aircraft, on duty, feels a responsibility to share what she can, and the information is unclassified.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Dietrich, Alex", "quote": "Because I was in a government aircraft, because I was on the clock, and so I feel a responsibility to share what I can, and it is unclassified.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "US Navy", "type": "organisation"}]}, {"loc": "00:07:14.4", "bk": 432, "text": "In November 2004, the USS Nimitz Carrier Strike Group was training approximately 160 kilometres (100 miles) south-west of San Diego.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego.", "refs": [{"name": "USS Nimitz Carrier Strike Group", "type": "organisation"}, {"name": "USS Nimitz (CVN-68)", "type": "object"}, {"name": "USA, California, San Diego", "type": "place"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}]}, {"loc": "00:07:23.1", "bk": 440, "text": "For a week prior to 2004-11-14, the advanced radar on the USS Princeton (CG-59) had detected multiple anomalous aerial vehicles (AAV) over the horizon.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon", "refs": [{"name": "USS Princeton (CG-59)", "type": "object"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}]}, {"loc": "00:07:23.1", "bk": 440, "text": "The USS Princeton (CG-59) radar operators observed the anomalous aerial vehicles (AAV) descending approximately 24,000 metres (80,000 feet) in less than a second.", "att": "", "type": "measurement", "cat": "domain", "spk": "Whitaker, Bill", "quote": "descending 80,000 feet in less than a second", "refs": [{"name": "USS Princeton (CG-59)", "type": "object"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}]}, {"loc": "00:07:39.3", "bk": 456, "text": "On 2004-11-14, David Fravor and Alex Dietrich, each with a weapons systems officer in the back seat, were diverted from training to investigate the anomalous aerial vehicle contacts.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "USS Nimitz (CVN-68)", "type": "object"}]}, {"loc": "00:07:47.8", "bk": 464, "text": "During the 2004 Nimitz UAP encounter, the pilots found an area of churning white water approximately the size of a Boeing 737 in an otherwise calm blue sea.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "They found an area of roiling white water the size of a 737 in an otherwise calm blue sea.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}]}, {"loc": "00:07:55.9", "bk": 472, "text": "During the 2004 Nimitz UAP encounter, David Fravor observed a small white object, described as tic-tac-shaped, moving above the area of disturbed white water.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "we saw this little white tic-tac-looking object. And it's just kind of moving above the whitewater area.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:08:12.3", "bk": 492, "text": "During the 2004 Nimitz UAP encounter, Alex Dietrich circled above while David Fravor descended in a spiral to get a closer look at the UAP.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "As Dietrich circled above, Fravor went in for a closer look.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}]}, {"loc": "00:08:18.5", "bk": 496, "text": "During the 2004 Nimitz UAP encounter, the UAP was initially oriented north\u2013south, then turned abruptly and began mirroring David Fravor's aircraft movements, ascending as he descended.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "The tic-tac's still pointing north-south. It goes and just turns abruptly and starts mirroring me. So as I'm coming down, it starts coming up.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:08:28.9", "bk": 508, "text": "David Fravor stated that the UAP during the 2004 Nimitz encounter appeared to be aware of the presence of his aircraft.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Fravor, David", "quote": "Yeah, it was aware we were there.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:08:30.5", "bk": 508, "text": "The UAP observed during the 2004 Nimitz encounter was approximately the same size as David Fravor's F/A-18 Hornet, with no markings, no wings, and no exhaust plumes.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Whitaker, Bill", "quote": "He said it was about the size of his F-18, with no markings, no wings, no exhaust plumes.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:08:37.0", "bk": 516, "text": "During the 2004 Nimitz UAP encounter, David Fravor attempted to close with the UAP, which then disappeared instantaneously from his field of view.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "I want to see how close I can get. So I go like this, and it's climbing still. And when it gets right in front of me, it just disappears.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:08:50.9", "bk": 528, "text": "Alex Dietrich stated that her mind initially tried to categorise the UAP during the 2004 Nimitz encounter as a helicopter or a drone, but was unable to explain its disappearance.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Dietrich, Alex", "quote": "I'm going to categorize this as maybe a helicopter or maybe a drone. And when it disappeared, I mean, it was just...", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:09:03.5", "bk": 540, "text": "All four aircrew members \u2014 two pilots and two weapons systems officers \u2014 in the two aircraft observed the UAP during the 2004 Nimitz encounter for approximately five minutes.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Fravor, David", "quote": "There was four of us in the airplanes literally watching this thing for roughly about five minutes.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:09:08.9", "bk": 548, "text": "Seconds after the UAP disappeared from the pilots' view during the 2004 Nimitz UAP encounter, the USS Princeton (CG-59) reacquired the target approximately 97 kilometres (60 miles) away.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Seconds later, the Princeton reacquired the target, 60 miles away.", "refs": [{"name": "USS Princeton (CG-59)", "type": "object"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:09:14.4", "bk": 552, "text": "After the USS Princeton (CG-59) reacquired the UAP during the 2004 Nimitz encounter, another US Navy crew briefly locked onto it with a targeting camera before it accelerated away again.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Another crew managed to briefly lock onto it with a targeting camera before it zipped off again.", "refs": [{"name": "USS Princeton (CG-59)", "type": "object"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}, {"name": "US Navy", "type": "organisation"}]}, {"loc": "00:09:20.8", "bk": 560, "text": "Alex Dietrich stated that, in informal discussions, she and fellow pilots acknowledged they might not have reported the 2004 Nimitz UAP encounter had they each seen it alone, because the account sounds implausible.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Dietrich, Alex", "quote": "I think that over beers, we've sort of said, hey, man, if I saw this solo, I don't know that I would have come back and said anything because it sounds so crazy when I say it.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}]}, {"loc": "00:09:37.9", "bk": 576, "text": "David Fravor stated he is not a person who habitually believes in UFOs.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Fravor, David", "quote": "I'll be honest. I'm not a UFO guy.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:09:45.5", "bk": 584, "text": "David Fravor stated that what he encountered during the 2004 Nimitz UAP incident was a real object he could not identify, and that it outperformed his aircraft.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Fravor, David", "quote": "There's definitely something that, I don't know who's building it, who's got the technology, who's got the brains, but there's something out there that was better than our airplane.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:09:56.5", "bk": 596, "text": "The aircrew of the USS Nimitz (CVN-68) filed official reports following the 2004 Nimitz UAP encounter.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "The air crew filed reports.", "refs": [{"name": "USS Nimitz (CVN-68)", "type": "object"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "US Navy", "type": "organisation"}]}, {"loc": "00:09:58.7", "bk": 596, "text": "No official action was taken regarding the 2004 Nimitz UAP encounter for five years after it occurred, until Luis Elizondo came across the case and investigated it.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Then, like the mysterious flying object, the Nimitz encounter disappeared. Nothing was said or done officially for five years until Lou Elizondo came across the story and investigated.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:10:13.2", "bk": 612, "text": "Luis Elizondo stated that pilot reports of UAPs are compelling because the sightings are corroborated by electro-optical data such as gun camera footage and by radar data.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Elizondo, Luis", "quote": "We spend millions of dollars in training these pilots, and they are seeing something that they can't explain. Furthermore, that information's being backed up on electro-optical data, like gun camera footage, and by radar data. Now, to me, that's compelling.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "US Navy", "type": "organisation"}]}, {"loc": "00:10:31.7", "bk": 628, "text": "The Advanced Aerospace Threat Identification Program (AATIP) had its funding eliminated in 2012.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "AATIP's funding was eliminated in 2012", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:10:35.5", "bk": 632, "text": "After AATIP's funding was eliminated in 2012, Luis Elizondo and a small group of colleagues kept the programme's mission active.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Elizondo says he and a handful of others kept the mission alive.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:10:39.5", "bk": 636, "text": "Luis Elizondo resigned from the Pentagon in 2017, frustrated by the response to his UAP findings.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "until finally, frustrated, he quit the Pentagon in 2017", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Pentagon", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:10:39.5", "bk": 636, "text": "Before resigning from the Pentagon in 2017, Luis Elizondo arranged for three UAP videos to be declassified.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "but not before getting these three videos declassified", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Pentagon", "type": "place"}, {"name": "US Navy UAP Videos Declassification", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:10:57.5", "bk": 656, "text": "Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence under Presidents Clinton and George W. Bush.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "US Department of Defense (DoD)", "type": "organisation"}]}, {"loc": "00:11:04.3", "bk": 664, "text": "Christopher Mellon had access to top-secret US government programmes during his tenure as Deputy Assistant Secretary of Defense for Intelligence.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "and had access to top-secret government programs.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "US Department of Defense (DoD)", "type": "organisation"}]}, {"loc": "00:11:08.4", "bk": 668, "text": "Christopher Mellon stated, with a very high degree of confidence, that the observed UAPs are not US technology, based on the positions he held in the Department of Defense and his knowledge of the process.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Mellon, Christopher", "quote": "So it's not us, that's one thing we know... I could say that with a very high degree of confidence, in part because of the positions I held in the department, and I know the process.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "US Department of Defense (DoD)", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:11:26.2", "bk": 684, "text": "In 2017, Christopher Mellon, acting as a private citizen, surreptitiously acquired three declassified US Navy UAP videos and leaked them to The New York Times.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Whitaker, Bill", "quote": "In 2017, as a private citizen, he surreptitiously acquired the three Navy videos Elizondo had declassified and leaked them to The New York Times.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Elizondo, Luis", "type": "person"}, {"name": "US Navy", "type": "organisation"}, {"name": "The New York Times", "type": "organisation"}, {"name": "US Navy UAP Videos Declassification", "type": "event"}]}, {"loc": "00:11:37.0", "bk": 696, "text": "Christopher Mellon stated it was bizarre and unfortunate that a person in his position had to leak information to the press to place a national security issue onto the agenda.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Mellon, Christopher", "quote": "It's bizarre and unfortunate that someone like myself has to do something like that to get a national security issue like this on the agenda.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "The New York Times", "type": "organisation"}, {"name": "US Navy UAP Videos Declassification", "type": "event"}]}, {"loc": "00:11:57.6", "bk": 716, "text": "Christopher Mellon stated that he and Luis Elizondo understood they needed to generate public interest in UAPs in order to prompt Congressional interest, which would in turn compel the Department of Defense to begin taking the issue seriously.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Mellon, Christopher", "quote": "We knew and understood that you had to go to the public, get the public interested to get Congress interested, to then circle back to the Defense Department and get them to start taking a look at it.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Elizondo, Luis", "type": "person"}, {"name": "US Department of Defense (DoD)", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:12:09.1", "bk": 728, "text": "The Pentagon re-established the UAP investigation effort, renaming it the Unidentified Aerial Phenomena (UAP) Task Force, in August 2020.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "This past August, the Pentagon resurrected AATIP. It's now called the UAP Task Force.", "refs": [{"name": "Pentagon", "type": "place"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Unidentified Aerial Phenomena (UAP) Task Force", "type": "project"}, {"name": "US Department of Defense (DoD)", "type": "organisation"}]}, {"loc": "00:12:15.6", "bk": 732, "text": "Following the establishment of the Unidentified Aerial Phenomena (UAP) Task Force, US service members are now encouraged to report strange aerial encounters.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Service members now are encouraged to report strange encounters.", "refs": [{"name": "Unidentified Aerial Phenomena (UAP) Task Force", "type": "project"}, {"name": "US Department of Defense (DoD)", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:12:22.6", "bk": 740, "text": "Marco Rubio stated that any object entering airspace where it is not supposed to be constitutes a threat.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Rubio, Marco", "quote": "Anything that enters an airspace that's not supposed to be there is a threat.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:12:26.5", "bk": 744, "text": "Marco Rubio received classified briefings on UAPs.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "After receiving classified briefings on UAPs, Senator Marco Rubio called for a detailed analysis.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "US Senate Select Committee on Intelligence", "type": "organisation"}]}, {"loc": "00:12:34.0", "bk": 752, "text": "While serving as head of the Senate Intelligence Committee, Marco Rubio asked the Director of National Intelligence and the Pentagon to present Congress with an unclassified report on UAPs by June 2021.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "US Senate Select Committee on Intelligence", "type": "organisation"}, {"name": "Office of the Director of National Intelligence", "type": "organisation"}, {"name": "Pentagon", "type": "place"}, {"name": "UAP Report to Congress (2021)", "type": "document"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:12:59.0", "bk": 776, "text": "Marco Rubio stated there is a stigma on Capitol Hill about UAPs, with some colleagues being interested while others ridicule the topic, but that the stigma should not prevent obtaining answers to fundamental questions.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Rubio, Marco", "quote": "there's a stigma on Capitol Hill. I mean, some of my colleagues are very interested in this topic and some kind of, you know, giggle when you bring it up. But I don't think we can allow the stigma to keep us from having an answer to a very fundamental question.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "US Senate Select Committee on Intelligence", "type": "organisation"}]}, {"loc": "00:13:14.1", "bk": 792, "text": "Marco Rubio called for a systematic process to analyse UAP data every time it comes in, to catalogue it continuously until answers are found.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Rubio, Marco", "quote": "I want us to take it seriously and have a process to take it seriously. I want us to have a process to analyze the data. every time it comes in, that there be a place where this is cataloged and constantly analyzed until we get some answers.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "UAP Report to Congress (2021)", "type": "document"}]}, {"loc": "00:13:37.3", "bk": 816, "text": "Alex Dietrich stated she felt vulnerable during the 2004 Nimitz UAP encounter because she had nothing with which to defend herself.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Dietrich, Alex", "quote": "I felt the vulnerability of not having anything to defend ourselves.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}]}], "nodes_by_type": {"person": ["Whitaker, Bill", "Elizondo, Luis", "Graves, Ryan", "Fravor, David", "Dietrich, Alex", "Mellon, Christopher", "Rubio, Marco", "Reid, Harry"], "project": ["Advanced Aerospace Threat Identification Program (AATIP)", "Unidentified Aerial Phenomena (UAP) Task Force", "Project Blue Book"], "organisation": ["US Department of Defense (DoD)", "US Navy", "US Senate Select Committee on Intelligence", "Office of the Director of National Intelligence", "60 Minutes", "The New York Times", "History Channel", "Top Gun Naval Flight School", "USS Nimitz Carrier Strike Group"], "place": ["Pentagon", "USA, Virginia, Virginia Beach", "USA, California, San Diego", "USA, Florida, Jacksonville"], "object": ["USS Nimitz (CVN-68)", "USS Princeton (CG-59)"], "event": ["Nimitz UAP Encounter 2004", "UAP Sightings off Virginia Beach 2014-2019", "UAP Sighting off Jacksonville Florida 2015", "US Navy UAP Videos Declassification"], "document": ["Navy pilots describe encounters with UFOs (60 Minutes, 2021)", "UAP Report to Congress (2021)"], "topic": ["Unidentified Aerial Phenomena (UAP)", "Anomalous Aerial Vehicle (AAV)"]}, "n_claims": 84, "n_nodes": 34, "label": "2: units/durability/British"}, {"claims": [{"loc": "00:00:07.6-00:00:14.9", "bk": 4, "text": "The 60 Minutes episode 'Navy pilots describe encounters with UFOs' covers the US government's acknowledgement of Unidentified Aerial Phenomena (UAP), more commonly known as UFOs.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "It's the story of the U.S. government's grudging acknowledgement of Unidentified Aerial Phenomena, UAP, more commonly known as ufos", "refs": [{"name": "Navy pilots describe encounters with UFOs", "type": "document"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "60 Minutes", "type": "organisation"}]}, {"loc": "00:00:14.9-00:00:22.0", "bk": 12, "text": "After decades of public denial, the Pentagon admitted there is something unidentified in US airspace.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "after decades of public denial the pentagon now admits there's something out there", "refs": [{"name": "US Department of Defense (DoD)", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:00:22.0-00:00:44.4", "bk": 20, "text": "The US Senate Intelligence Committee ordered the Director of National Intelligence and the Secretary of Defense to deliver a report on mysterious UAP sightings by June 2021.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "the u.s senate wants to know what it is the intelligence committee has ordered the director of national intelligence and the secretary of defense to deliver a report on the mysterious sightings by next month", "refs": [{"name": "US Senate Intelligence Committee", "type": "organisation"}, {"name": "Office of the Director of National Intelligence", "type": "organisation"}, {"name": "UAP Report to Congress by Director of National Intelligence and Secretary of Defense 2021", "type": "document"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:00:54.6-00:01:01.0", "bk": 52, "text": "Luis Elizondo stated that the US government has officially confirmed for the record that UAP are real.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "The government has already stated for the record that they're real. I'm not telling you that. The United States government is telling you that.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:01:02.4-00:01:11.5", "bk": 60, "text": "Luis Elizondo spent 20 years running military intelligence operations worldwide, including in Afghanistan, the Middle East, and Guantanamo.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo.", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:01:11.5-00:01:23.0", "bk": 68, "text": "Luis Elizondo had not given UFOs serious consideration until 2008, when he was asked to join the Advanced Aerospace Threat Identification Program (AATIP) at the Pentagon.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "He hadn't given UFOs a second thought until 2008. That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:01:24.1-00:01:34.3", "bk": 84, "text": "The mission of the Advanced Aerospace Threat Identification Program (AATIP) was to collect and analyse information involving Anomalous Aerial Vehicles (AAV), commonly referred to as UFOs or UAP.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs. We call them UAPs.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:01:50.3-00:02:01.6", "bk": 108, "text": "The Advanced Aerospace Threat Identification Program (AATIP) was part of a US$22 million programme sponsored by then Senate Majority Leader Harry Reid to investigate UFOs.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Buried away in the Pentagon, AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Reid, Harry", "type": "person"}]}, {"loc": "00:02:01.6-00:02:12.6", "bk": 120, "text": "Luis Elizondo took over the Advanced Aerospace Threat Identification Program (AATIP) in 2010, focusing on the national security implications of UAP documented by US service members.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "When Elizondo took over in 2010, he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "Luis Elizondo described observed UAP as capable of withstanding 600 to 700 G-forces.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "Imagine a technology that can do 600 to 700 G-forces", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "Luis Elizondo described observed UAP as capable of flying at approximately 21,000 kilometres per hour.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "that can fly at 13,000 miles an hour", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "Luis Elizondo described observed UAP as capable of evading radar.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "that can evade radar", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "Luis Elizondo described observed UAP as capable of travelling through air, water, and possibly space.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "that can fly through air and water and possibly space", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "Luis Elizondo described observed UAP as having no obvious signs of propulsion, no wings, and no control surfaces.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "has no obvious signs of propulsion, no wings, no control surfaces", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "Luis Elizondo described observed UAP as capable of defying the natural effects of Earth's gravity.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "and yet still can defy the natural effects of Earth's gravity", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:02:37.0-00:02:47.7", "bk": 156, "text": "The Advanced Aerospace Threat Identification Program (AATIP) was described as a loose-knit mix of scientists, electro-optical engineers, avionics experts, and intelligence experts, often working part-time.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Elizondo tells us AATIP was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:02:47.7-00:03:07.3", "bk": 164, "text": "The Advanced Aerospace Threat Identification Program (AATIP) combed through data and records and analysed UAP videos, including footage of a Navy aircrew struggling to lock onto a fast-moving object off the US Atlantic coast in 2015.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "They combed through data and records and analyzed videos like this. A Navy aircrew struggles to lock onto a fast-moving object off the U.S. Atlantic coast in 2015.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "US Navy", "type": "organisation"}, {"name": "UAP Sightings off Atlantic Coast 2014-2019", "type": "event"}, {"name": "AATIP UAP Video Footage (Three Declassified Navy Videos)", "type": "document"}]}, {"loc": "00:03:07.3-00:03:22.3", "bk": 184, "text": "The Pentagon admitted it could not identify the UAP objects shown in recently released video imagery.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "the Pentagon admits it doesn't know what in the world this is, or this, or this.", "refs": [{"name": "US Department of Defense (DoD)", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "AATIP UAP Video Footage (Three Declassified Navy Videos)", "type": "document"}]}, {"loc": "00:03:30.4-00:03:38.6", "bk": 208, "text": "Luis Elizondo acknowledged that some UAP sightings have simple explanations such as refracted light, weather balloons, rocket launches, or Venus, but that some do not.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "In some cases, there are simple explanations for what people are witnessing, but there are some that that are not.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:03:44.3-00:03:52.6", "bk": 224, "text": "Luis Elizondo stated that AATIP investigators considered whether UAP could be a new type of cruise missile technology developed by China, or a high-altitude balloon conducting reconnaissance.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "Is it some sort of new type of cruise missile technology that China has developed? Is it some sort of high-altitude balloon that's conducting reconnaissance?", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:03:52.6-00:04:06.2", "bk": 232, "text": "Luis Elizondo expressed the view that when all alternative explanations are exhausted and UAP are confirmed to be in US airspace, the situation becomes compelling and problematic.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Elizondo, Luis", "quote": "Ultimately, when you have exhausted all those what-ifs and you're still left with the fact that this is in our airspace and it's real, that's when it becomes compelling and that's when it becomes problematic.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:06.2-00:04:12.9", "bk": 244, "text": "Ryan Graves holds the rank of Lieutenant and previously served as a US Navy F-18 pilot.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Former Navy pilot Lieutenant Ryan Graves", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "US Navy", "type": "organisation"}]}, {"loc": "00:04:06.2-00:04:12.9", "bk": 244, "text": "Ryan Graves considers UAP observed in US airspace a security risk.", "att": "", "type": "opinion", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Former Navy pilot Lieutenant Ryan Graves calls whatever is out there a security risk.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:12.9-00:04:29.7", "bk": 252, "text": "Ryan Graves' F-18 squadron began seeing UAP hovering over restricted airspace southeast of Virginia Beach in 2014, following an upgrade to their aircraft's radar that enabled infrared targeting camera acquisition.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Whitaker, Bill", "quote": "He told us his F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar, making it possible to zero in with infrared targeting cameras.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "US Navy", "type": "organisation"}, {"name": "UAP Sightings off Atlantic Coast 2014-2019", "type": "event"}, {"name": "USA, Virginia, Virginia Beach (restricted airspace southeast)", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:29.7-00:04:38.6", "bk": 268, "text": "Ryan Graves stated that UAP observed off Virginia Beach were simultaneously detected on radar and infrared, making it very difficult to dismiss the contacts as spurious.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Graves, Ryan", "quote": "Bill Whitaker: So you're seeing it both with the radar and with the infrared, and that tells you that there is something out there. Ryan Graves: Pretty hard to spoof that.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "UAP Sightings off Atlantic Coast 2014-2019", "type": "event"}, {"name": "USA, Virginia, Virginia Beach (restricted airspace southeast)", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:38.6-00:04:48.2", "bk": 276, "text": "Photographs of UAP in restricted airspace southeast of Virginia Beach were taken in 2019, and the Pentagon confirmed these images show objects it cannot identify.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "These photographs were taken in 2019 in the same area. The Pentagon confirms these are images of objects it can't identify.", "refs": [{"name": "UAP Sightings off Atlantic Coast 2014-2019", "type": "event"}, {"name": "USA, Virginia, Virginia Beach (restricted airspace southeast)", "type": "place"}, {"name": "US Department of Defense (DoD)", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:48.2-00:05:02.5", "bk": 288, "text": "Ryan Graves stated that US Navy pilots training off the Atlantic coast observed UAP every day for at least a couple of years.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Graves, Ryan", "quote": "Bill Whitaker: Lieutenant Graves told us pilots training off the Atlantic coast see things like that all the time. Ryan Graves: Every day. Every day for at least a couple of years.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "US Navy", "type": "organisation"}, {"name": "UAP Sightings off Atlantic Coast 2014-2019", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:05:02.5-00:05:04.3", "bk": 300, "text": "Ryan Graves noted that he observed no exhaust plume on the UAP seen off the Atlantic coast.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Graves, Ryan", "quote": "You know, I don't see an exhaust plume.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "UAP Sightings off Atlantic Coast 2014-2019", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:05:04.3-00:05:12.8", "bk": 304, "text": "In 2015, a UAP was captured on a targeting camera by members of Ryan Graves' squadron off the coast of Jacksonville, Florida.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "including this one, off the coast of Jacksonville, Florida in 2015, captured on a targeting camera by members of Graves' squadron.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "US Navy", "type": "organisation"}, {"name": "USA, Florida, Jacksonville (offshore)", "type": "place"}, {"name": "UAP Sightings off Atlantic Coast 2014-2019", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "AATIP UAP Video Footage (Three Declassified Navy Videos)", "type": "document"}]}, {"loc": "00:05:12.8-00:05:23.8", "bk": 312, "text": "In the targeting camera footage captured off Jacksonville, Florida in 2015, the UAP is observed rotating and moving against a wind of approximately 220 kilometres per hour from the west.", "att": "", "type": "observation", "cat": "domain", "spk": "", "quote": "It's rotating. They're all going against the wind. The wind's 120 knots far west.", "refs": [{"name": "USA, Florida, Jacksonville (offshore)", "type": "place"}, {"name": "UAP Sightings off Atlantic Coast 2014-2019", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:05:35.8-00:05:43.0", "bk": 332, "text": "Ryan Graves noted that the UAP observed in the 2015 Jacksonville footage exhibited rotation, high altitude operation, and apparent propulsion, and stated he could not identify what it was.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Graves, Ryan", "quote": "You have rotation, you have high altitudes, you have propulsion, right? I don't know. I don't know what it is, frankly.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "USA, Florida, Jacksonville (offshore)", "type": "place"}, {"name": "UAP Sightings off Atlantic Coast 2014-2019", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:05:44.9-00:05:56.0", "bk": 344, "text": "Ryan Graves stated that pilots speculate the observed UAP are one of three things: secret US technology, an adversary spy vehicle, or something otherworldly.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Whitaker, Bill", "quote": "He told us pilots speculate they are one of three things, secret U.S. technology, an adversary spy vehicle, or something otherworldly.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:05:56.0-00:06:00.5", "bk": 356, "text": "Ryan Graves expressed the opinion that the highest probability explanation for the observed UAP is that they are a threat observation programme.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "I'd say, you know, the highest probability is it's a threat observation program.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:06:00.5-00:06:05.4", "bk": 360, "text": "Ryan Graves did not rule out Russian or Chinese technology as a possible explanation for the observed UAP.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "Bill Whitaker: Could it be Russian or Chinese technology? Ryan Graves: I don't see why not.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:06:07.0-00:06:23.4", "bk": 364, "text": "Ryan Graves expressed worry that if UAP were tactical jets from another country operating in US airspace, it would be considered a massive security issue, but because they look different, the problem is being ignored.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "I am worried, frankly. You know, if these were tactical jets from another country that were hanging out up there, it would be a massive issue. But because it looks slightly different, we're not willing to actually look at the problem in the face. We're happy to just ignore the fact that these are out there watching us every day.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:06:23.4-00:06:30.3", "bk": 380, "text": "The US government publicly ignored UAP after closing its Project Blue Book investigation in 1969.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "The government has ignored it, at least publicly, since closing its Project Blue Book investigation in 1969.", "refs": [{"name": "Project Blue Book", "type": "project"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:06:30.3-00:06:40.8", "bk": 388, "text": "The Nimitz UAP Encounter 2004 off Southern California was documented by radar, camera, and four naval aviators.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "But that began to change after an incident off Southern California in 2004, which was documented by radar, by camera, and four naval aviators.", "refs": [{"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "USA, California, San Diego (offshore)", "type": "place"}, {"name": "US Navy", "type": "organisation"}]}, {"loc": "00:06:40.8-00:06:57.3", "bk": 400, "text": "David Fravor is a graduate of Top Gun Naval Flight School and served as commander of the F-18 squadron on the USS Nimitz.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Top Gun Naval Flight School", "type": "organisation"}, {"name": "USS Nimitz", "type": "object"}, {"name": "US Navy", "type": "organisation"}]}, {"loc": "00:06:40.8-00:06:57.3", "bk": 400, "text": "Alex Dietrich flew as wingman to David Fravor during the Nimitz UAP Encounter 2004.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "and flying at his wing, Lieutenant Alex Dietrich", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "US Navy", "type": "organisation"}]}, {"loc": "00:06:40.8-00:06:57.3", "bk": 400, "text": "Alex Dietrich held the rank of Lieutenant in the US Navy at the time of the Nimitz UAP Encounter 2004.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Lieutenant Alex Dietrich", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "US Navy", "type": "organisation"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}]}, {"loc": "00:06:40.8-00:06:57.3", "bk": 400, "text": "Alex Dietrich had never spoken publicly about the Nimitz UAP Encounter 2004 prior to the 60 Minutes interview on 2021-05-17.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Lieutenant Alex Dietrich, who has never spoken publicly about the encounter.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "60 Minutes", "type": "organisation"}]}, {"loc": "00:07:02.7-00:07:14.4", "bk": 420, "text": "Alex Dietrich chose to speak publicly about the Nimitz UAP Encounter 2004 because she was in a government aircraft, was on duty, and feels a responsibility to share what is unclassified information.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Dietrich, Alex", "quote": "Because I was in a government aircraft, because I was on the clock, and so I feel a responsibility to share what I can, and it is unclassified.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}]}, {"loc": "00:07:14.4-00:07:23.1", "bk": 432, "text": "In November 2004, the USS Nimitz Carrier Strike Group was training approximately 160 kilometres southwest of San Diego.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego.", "refs": [{"name": "USS Nimitz", "type": "object"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "USA, California, San Diego (offshore)", "type": "place"}]}, {"loc": "00:07:23.1-00:07:39.3", "bk": 440, "text": "For a week prior to 2004-11-14, the advanced radar on the USS Princeton detected multiple Anomalous Aerial Vehicles (AAV) over the horizon, descending approximately 24,000 metres in under one second.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 80,000 feet in less than a second.", "refs": [{"name": "USS Princeton", "type": "object"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}, {"name": "Tic Tac UAP Object (Nimitz 2004)", "type": "object"}]}, {"loc": "00:07:39.3-00:07:47.8", "bk": 456, "text": "On 2004-11-14, David Fravor and Alex Dietrich, each accompanied by a weapons system officer in the rear seat, were diverted from training to investigate the UAP contacts reported by USS Princeton.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "USS Princeton", "type": "object"}, {"name": "US Navy", "type": "organisation"}]}, {"loc": "00:07:47.8-00:07:55.9", "bk": 464, "text": "During the Nimitz U
