: "Christopher Mellon says he grew concerned that nothing was being done about Unidentified Aerial Phenomena (UAP), so he decided to do something.", "att": "", "type": "testimony", "cat": "domain", "spk": "Christopher Mellon", "quote": "Mellon says he grew concerned nothing was being done about UAPs, so he decided to do something.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:11:37.0-00:11:46.1", "bk": 696, "text": "Christopher Mellon states that it is bizarre and unfortunate that someone like himself has to leak information to get a national security issue like Unidentified Aerial Phenomena (UAP) on the agenda.", "att": "", "type": "opinion", "cat": "domain", "spk": "Christopher Mellon", "quote": "It's bizarre and unfortunate that someone like myself has to do something like that to get a national security issue like this on the agenda.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:11:57.6-00:12:07.2", "bk": 716, "text": "Christopher Mellon and Luis Elizondo understood that they had to go to the public to get the public interested, to get Congress interested, and then circle back to the U.S. Department of Defense to get them to start taking a look at Unidentified Aerial Phenomena (UAP).", "att": "", "type": "opinion", "cat": "domain", "spk": "Christopher Mellon", "quote": "We knew and understood that you had to go to the public, get the public interested to get Congress interested, to then circle back to the Defense Department and get them to start taking a look at it.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:12:07.2-00:12:15.6", "bk": 724, "text": "In August (of the previous year, 2020), the U.S. Pentagon resurrected the Advanced Aerospace Threat Identification Program (AATIP), now called the UAP Task Force.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "This past August, the Pentagon resurrected AATIP. It's now called the UAP Task Force.", "refs": [{"name": "U.S. Pentagon", "type": "organisation"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "UAP Task Force", "type": "project"}]}, {"loc": "00:12:15.6-00:12:20.1", "bk": 732, "text": "Service members are now encouraged to report strange encounters within the UAP Task Force.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "Service members now are encouraged to report strange encounters.", "refs": [{"name": "UAP Task Force", "type": "project"}]}, {"loc": "00:12:20.1", "bk": 740, "text": "The U.S. Senate wants answers about Unidentified Aerial Phenomena (UAP).", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "And the Senate wants answers.", "refs": [{"name": "U.S. Senate Intelligence Committee", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:12:22.6", "bk": 740, "text": "Senator Marco Rubio states that anything that enters an airspace that is not supposed to be there is a threat.", "att": "", "type": "opinion", "cat": "domain", "spk": "Marco Rubio", "quote": "Anything that enters an airspace that's not supposed to be there is a threat.", "refs": [{"name": "Rubio, Marco", "type": "person"}]}, {"loc": "00:12:26.5-00:12:34.0", "bk": 744, "text": "After receiving classified briefings on Unidentified Aerial Phenomena (UAP), Senator Marco Rubio called for a detailed analysis.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "After receiving classified briefings on UAPs, Senator Marco Rubio called for a detailed analysis.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:12:34.0-00:12:46.3", "bk": 752, "text": "In December (of the previous year, 2020), while he was still head of the Intelligence Committee, Senator Marco Rubio asked the Director of National Intelligence and the U.S. Pentagon to present Congress an unclassified report on Unidentified Aerial Phenomena (UAP) by the following month.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Director of National Intelligence", "type": "organisation"}, {"name": "U.S. Pentagon", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:12:59.0-00:13:06.9", "bk": 776, "text": "Senator Marco Rubio states that there is a stigma on Capitol Hill regarding Unidentified Aerial Phenomena (UAP), with some colleagues very interested and others giggling when the topic is brought up.", "att": "", "type": "opinion", "cat": "domain", "spk": "Marco Rubio", "quote": "You know, there's a stigma on Capitol Hill. I mean, some of my colleagues are very interested in this topic and some kind of, you know, giggle when you bring it up.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:13:06.9-00:13:12.2", "bk": 784, "text": "Senator Marco Rubio states that the stigma should not keep the government from getting an answer to the fundamental question about Unidentified Aerial Phenomena (UAP).", "att": "", "type": "opinion", "cat": "domain", "spk": "Marco Rubio", "quote": "But I don't think we can allow the stigma to keep us from having an answer to a very fundamental question.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:13:14.1-00:13:25.9", "bk": 792, "text": "Senator Marco Rubio wants the government to take Unidentified Aerial Phenomena (UAP) seriously and have a process to analyze the data every time it comes in, with cataloging and constant analysis until answers are obtained.", "att": "", "type": "opinion", "cat": "domain", "spk": "Marco Rubio", "quote": "I want us to take it seriously and have a process to take it seriously. I want us to have a process to analyze the data. every time it comes in, that there be a place where this is cataloged and constantly analyzed until we get some answers.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:13:25.9-00:13:28.3", "bk": 804, "text": "Senator Marco Rubio states that the answer to Unidentified Aerial Phenomena (UAP) may be very simple or it may not be.", "att": "", "type": "opinion", "cat": "domain", "spk": "Marco Rubio", "quote": "Maybe it has a very simple answer. Maybe it doesn't.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:13:37.3", "bk": 816, "text": "Alex Dietrich states that she felt the vulnerability of not having anything to defend themselves against during the Nimitz UAP encounter.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Alex Dietrich", "quote": "I felt the vulnerability of not having anything to defend ourselves.", "refs": [{"name": "Dietrich, Alex", "type": "person"}]}], "nodes_by_type": {"organisation": ["60 Minutes", "U.S. Pentagon", "Director of National Intelligence", "Secretary of Defense", "U.S. Senate Intelligence Committee", "Strike Fighter Squadron with F-18 aircraft off Virginia Beach", "Top Gun Naval Flight School", "Carrier Strike Group 11 (CSG-11)", "The New York Times", "History Channel"], "person": ["Whitaker, Bill", "Elizondo, Luis", "Graves, Ryan", "Fravor, David", "Dietrich, Alex", "Mellon, Christopher", "Rubio, Marco", "Reid, Harry"], "project": ["Advanced Aerospace Threat Identification Program (AATIP)", "Project Blue Book", "UAP Task Force"], "topic": ["Unidentified Aerial Phenomena (UAP)"], "place": ["USA, Virginia, Virginia Beach", "USA, Florida, Jacksonville", "USA, California, San Diego"], "object": ["USS Nimitz", "USS Princeton"], "event": ["Nimitz UAP encounter, November 2004"], "document": ["Navy pilots describe encounters with UFOs (60 Minutes video)"]}, "n_claims": 84, "n_nodes": 29, "label": "1: attestation+Q&A"}, {"claims": [{"loc": "00:00:09.1\u201300:00:14.9", "bk": 8, "text": "The episode tackles the story of the United States government's acknowledgement of Unidentified Aerial Phenomena (UAP), more commonly known as UFOs, after decades of public denial.", "att": "", "type": "observation", "cat": "domain", "spk": "", "quote": "It's the story of the U.S. government's grudging acknowledgement of Unidentified Aerial Phenomena, UAP, more commonly known as ufos after decades of public denial", "refs": [{"name": "Pentagon", "type": "organisation"}]}, {"loc": "00:00:14.4", "bk": 12, "text": "The Pentagon admits there is something out there related to unidentified aerial phenomena.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "the pentagon now admits there's something out there", "refs": [{"name": "Pentagon", "type": "organisation"}]}, {"loc": "00:00:16.3\u201300:00:32.2", "bk": 16, "text": "The United States Senate Intelligence Committee has ordered the Director of National Intelligence and the Secretary of Defense to deliver a report on mysterious UAP sightings by the following month.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "the u.s senate wants to know what it is the intelligence committee has ordered the director of national intelligence and the secretary of defense to deliver a report on the mysterious sightings by next month", "refs": [{"name": "US Senate Intelligence Committee", "type": "organisation"}, {"name": "Director of National Intelligence", "type": "organisation"}, {"name": "Secretary of Defense", "type": "organisation"}]}, {"loc": "00:00:54.6\u201300:00:59.6", "bk": 52, "text": "Luis Elizondo stated that the United States government has already confirmed for the record that unidentified flying objects are real.", "att": "", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "The government has already stated for the record that they're real. I'm not telling you that. The United States government is telling you that.", "refs": []}, {"loc": "00:01:02.4\u201300:01:11.5", "bk": 60, "text": "Luis Elizondo spent 20 years running military intelligence operations in Afghanistan, the Middle East, and Guantanamo Bay.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo.", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:01:11.5\u201300:01:25.6", "bk": 68, "text": "Luis Elizondo had not given UFOs consideration until 2008, when he was asked to join the Advanced Aerospace Threat Identification Program (AATIP) at the Pentagon.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "He hadn't given UFOs a second thought until 2008. That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Pentagon", "type": "organisation"}]}, {"loc": "00:01:24.1\u201300:01:34.3", "bk": 84, "text": "The mission of the Advanced Aerospace Threat Identification Program (AATIP) was to collect and analyse information involving anomalous aerial vehicles, commonly referred to as unidentified flying objects (UFOs) or unidentified aerial phenomena (UAP).", "att": "", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs. We call them UAPs.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:01:50.3\u201300:02:01.6", "bk": 108, "text": "The Advanced Aerospace Threat Identification Program (AATIP) was buried within the Pentagon and was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "Buried away in the Pentagon, AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Pentagon", "type": "organisation"}, {"name": "Reid, Harry", "type": "person"}]}, {"loc": "00:02:01.6\u201300:02:10.8", "bk": 120, "text": "Luis Elizondo took over the Advanced Aerospace Threat Identification Program (AATIP) in 2010 and focused on the national security implications of unidentified aerial phenomena documented by United States service members.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "When Elizondo took over in 2010, he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:02:12.6\u201300:02:35.2", "bk": 132, "text": "A hypothetical technology could perform 600\u2013700 G-forces, fly at approximately 21,000 km/h, evade radar, fly through air and water and possibly space, exhibit no obvious signs of propulsion, lack wings and control surfaces, and defy the natural effects of Earth's gravity.", "att": "", "type": "measurement", "cat": "domain", "spk": "Elizondo, Luis", "quote": "Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity.", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:02:35.2", "bk": 152, "text": "Luis Elizondo stated that what he has described is precisely what is being observed.", "att": "", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "That's precisely what we're seeing.", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:02:37.0\u201300:02:47.7", "bk": 156, "text": "The Advanced Aerospace Threat Identification Program (AATIP) was a loose-knit mix of scientists, electro-optical engineers, avionics specialists, and intelligence experts, often working part-time.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "Elizondo tells us AATIP was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:02:47.7\u201300:02:57.7", "bk": 164, "text": "The Advanced Aerospace Threat Identification Program (AATIP) personnel combed through data and records and analysed videos of naval aviation incidents.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "They combed through data and records and analyzed videos like this.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:02:57.7\u201300:03:02.1", "bk": 176, "text": "A Navy aircrew captured footage of a struggle to lock onto a fast-moving object off the United States Atlantic coast in 2015.", "att": "", "type": "observation", "cat": "domain", "spk": "", "quote": "A Navy aircrew struggles to lock onto a fast-moving object off the U.S. Atlantic coast in 2015.", "refs": [{"name": "Atlantic coast F-18 radar and infrared footage, 2015\u20132019", "type": "document"}]}, {"loc": "00:03:07.3\u201300:03:20.4", "bk": 184, "text": "The Pentagon admits it does not know what certain unidentified objects are.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "the Pentagon admits it doesn't know what in the world this is, or this, or this.", "refs": [{"name": "Pentagon", "type": "organisation"}]}, {"loc": "00:03:30.4\u201300:03:38.6", "bk": 208, "text": "Luis Elizondo acknowledged that in some cases there are simple explanations for what people witness, but there are some that are not.", "att": "", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "In some cases, there are simple explanations for what people are witnessing, but there are some that are not.", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:03:38.6\u201300:03:52.6", "bk": 216, "text": "Luis Elizondo stated that the Advanced Aerospace Threat Identification Program (AATIP) personnel conducted due diligence before concluding something was a Unidentified Aerial Phenomena (UAP), considering explanations such as new cruise missile technology developed by China or high-altitude balloons conducting reconnaissance.", "att": "", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "We're not just simply jumping to a conclusion that's saying, oh, that's a UAP out there. We're going through our due diligence. Is it some sort of new type of cruise missile technology that China has developed? Is it some sort of high-altitude balloon that's conducting reconnaissance?", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:03:52.6\u201300:04:06.2", "bk": 232, "text": "Luis Elizondo stated that when all alternative explanations are exhausted and an object remains in restricted airspace and is real, the situation becomes compelling and problematic.", "att": "", "type": "opinion", "cat": "domain", "spk": "Elizondo, Luis", "quote": "Ultimately, when you have exhausted all those what-ifs and you're still left with the fact that this is in our airspace and it's real, that's when it becomes compelling and that's when it becomes problematic.", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:04:06.2\u201300:04:12.9", "bk": 244, "text": "Former Navy pilot Lieutenant Ryan Graves calls whatever is in the airspace a security risk.", "att": "", "type": "testimony", "cat": "domain", "spk": "", "quote": "Former Navy pilot Lieutenant Ryan Graves calls whatever is out there a security risk.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:04:12.9\u201300:04:29.7", "bk": 252, "text": "Lieutenant Ryan Graves' F-18 squadron began observing unidentified aerial phenomena (UAP) hovering over restricted airspace southeast of Virginia Beach in 2014 when their jet's radar was updated, enabling them to use infrared targeting cameras.", "att": "", "type": "testimony", "cat": "domain", "spk": "", "quote": "He told us his F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar, making it possible to zero in with infrared targeting cameras.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "USA, Virginia, Virginia Beach (vicinity)", "type": "place"}, {"name": "Virginia Beach radar sightings, 2014\u20132016", "type": "event"}]}, {"loc": "00:04:37.1", "bk": 276, "text": "Ryan Graves stated that dual radar and infrared detection is difficult to spoof.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "Pretty hard to spoof that.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:04:38.6\u201300:04:43.0", "bk": 276, "text": "Photographs of unidentified objects were taken in 2019 in the same area southeast of Virginia Beach.", "att": "", "type": "observation", "cat": "domain", "spk": "", "quote": "These photographs were taken in 2019 in the same area.", "refs": [{"name": "USA, Virginia, Virginia Beach (vicinity)", "type": "place"}]}, {"loc": "00:04:43.0\u201300:04:48.2", "bk": 280, "text": "The Pentagon confirmed that the 2019 photographs are images of objects it cannot identify.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "The Pentagon confirms these are images of objects it can't identify.", "refs": [{"name": "Pentagon", "type": "organisation"}]}, {"loc": "00:04:55.3\u201300:04:56.6", "bk": 292, "text": "Lieutenant Ryan Graves stated that pilots training off the Atlantic coast see unidentified objects every day for at least a couple of years.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Graves, Ryan", "quote": "Every day. Every day for at least a couple of years.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:05:01.2\u201300:05:02.5", "bk": 300, "text": "Ryan Graves stated that he does not see an exhaust plume from the observed objects.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Graves, Ryan", "quote": "You know, I don't see an exhaust plume.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:05:04.3\u201300:05:12.8", "bk": 304, "text": "Footage was captured off the coast of Jacksonville, Florida in 2015 on a targeting camera by members of Lieutenant Ryan Graves' squadron.", "att": "", "type": "observation", "cat": "domain", "spk": "", "quote": "including this one, off the coast of Jacksonville, Florida in 2015, captured on a targeting camera by members of Graves' squadron.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "USA, Florida, Jacksonville (vicinity)", "type": "place"}, {"name": "Jacksonville targeting camera footage, 2015", "type": "document"}]}, {"loc": "00:05:21.6\u201300:05:23.8", "bk": 320, "text": "In the Jacksonville targeting camera footage from 2015, the wind speed recorded was 120 knots (approximately 220 km/h) from the far west.", "att": "", "type": "measurement", "cat": "domain", "spk": "", "quote": "The wind's 120 knots far west.", "refs": [{"name": "Jacksonville targeting camera footage, 2015", "type": "document"}]}, {"loc": "00:05:15.1", "bk": 312, "text": "In the Jacksonville targeting camera footage from 2015, the observed object appears to be rotating.", "att": "", "type": "observation", "cat": "domain", "spk": "", "quote": "It's rotating.", "refs": [{"name": "Jacksonville targeting camera footage, 2015", "type": "document"}]}, {"loc": "00:05:17.9", "bk": 316, "text": "The external footage from Jacksonville in 2015 shows the observed objects moving against the wind.", "att": "", "type": "observation", "cat": "domain", "spk": "", "quote": "They're all going against the wind.", "refs": [{"name": "Jacksonville targeting camera footage, 2015", "type": "document"}]}, {"loc": "00:05:25.4\u201300:05:33.2", "bk": 324, "text": "Ryan Graves observed that the pilots in the Jacksonville footage sound surprised and amazed at what they are seeing, having broken character.", "att": "", "type": "observation", "cat": "domain", "spk": "Graves, Ryan", "quote": "You certainly can. They seem to have broke character a bit, and were just kind of amazed at what they were seeing.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:05:35.8\u201300:05:42.8", "bk": 332, "text": "When viewing the Jacksonville footage, Ryan Graves expressed uncertainty, citing the object's rotation, high altitude, and propulsion characteristics as difficult to explain.", "att": "", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "This is a difficult one to explain. You have rotation, you have high altitudes, you have propulsion, right? I don't know. I don't know what it is, frankly.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:05:44.9\u201300:05:56.0", "bk": 344, "text": "Lieutenant Ryan Graves stated that pilots speculate the observed objects are one of three things: secret United States technology, an adversary spy vehicle, or something otherworldly.", "att": "", "type": "testimony", "cat": "domain", "spk": "", "quote": "He told us pilots speculate they are one of three things, secret U.S. technology, an adversary spy vehicle, or something otherworldly.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:05:56.0", "bk": 356, "text": "Ryan Graves expressed the opinion that the highest probability explanation for the observed unidentified aerial phenomena is that it is a threat observation programme.", "att": "", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "I'd say, you know, the highest probability is it's a threat observation program.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:06:04.1", "bk": 364, "text": "When asked if the observed objects could be Russian or Chinese technology, Ryan Graves responded that he does not see why it could not be.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "I don't see why not.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:06:07.0\u201300:06:18.5", "bk": 364, "text": "Ryan Graves expressed worry about the observed unidentified aerial phenomena, stating that if they were tactical jets from another country, it would be a massive security issue, and that the current approach is to ignore the problem.", "att": "", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "I am worried, frankly. You know, if these were tactical jets from another country that were hanging out up there, it would be a massive issue. But because it looks slightly different, we're not willing to actually look at the problem in the face. We're happy to just ignore the fact that these are out there watching us every day.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:06:23.4\u201300:06:40.8", "bk": 380, "text": "The United States government ignored unidentified aerial phenomena publicly from the closure of Project Blue Book in 1969 until an incident off Southern California in 2004.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "The government has ignored it, at least publicly, since closing its Project Blue Book investigation in 1969. But that began to change after an incident off Southern California in 2004", "refs": [{"name": "Project Blue Book", "type": "project"}, {"name": "USA, California, Southern California (off coast)", "type": "place"}]}, {"loc": "00:06:30.3\u201300:06:40.8", "bk": 388, "text": "An incident off Southern California in 2004 was documented by radar, by camera, and witnessed by four naval aviators.", "att": "", "type": "observation", "cat": "domain", "spk": "", "quote": "after an incident off Southern California in 2004, which was documented by radar, by camera, and four naval aviators.", "refs": [{"name": "USA, California, Southern California (off coast)", "type": "place"}, {"name": "Nimitz Carrier Strike Group encounter, November 2004", "type": "event"}]}, {"loc": "00:06:40.8\u201300:06:51.3", "bk": 400, "text": "David Fravor is a graduate of the Top Gun Naval Flight School and was commander of the F-18 squadron on the USS Nimitz.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Top Gun Naval Flight School", "type": "organisation"}, {"name": "USS Nimitz", "type": "object"}]}, {"loc": "00:06:40.8\u201300:06:57.3", "bk": 400, "text": "Lieutenant Alex Dietrich flew at David Fravor's wing during the 2004 encounter and had never spoken publicly about the incident before this interview.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "and flying at his wing, Lieutenant Alex Dietrich, who has never spoken publicly about the encounter.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Fravor, David", "type": "person"}]}, {"loc": "00:06:57.3\u201300:07:14.4", "bk": 416, "text": "Alex Dietrich stated she never wanted to be on national television, but felt a responsibility to share her experience because she was in a government aircraft, was on the clock, and the information is unclassified.", "att": "", "type": "testimony", "cat": "domain", "spk": "Dietrich, Alex", "quote": "I never wanted to be on national TV, no offense. ... Because I was in a government aircraft, because I was on the clock, and so I feel a responsibility to share what I can, and it is unclassified.", "refs": [{"name": "Dietrich, Alex", "type": "person"}]}, {"loc": "00:07:14.4\u201300:07:23.1", "bk": 432, "text": "In November 2004, the USS Nimitz Carrier Strike Group was training approximately 100 miles southwest of San Diego.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego.", "refs": [{"name": "Nimitz Carrier Strike Group encounter, November 2004", "type": "event"}, {"name": "USA, California, San Diego (vicinity)", "type": "place"}, {"name": "USS Nimitz", "type": "object"}]}, {"loc": "00:07:23.1\u201300:07:39.3", "bk": 440, "text": "For a week before 2004-11-14, the advanced new radar on the USS Princeton detected what operators called multiple anomalous aerial vehicles over the horizon, descending approximately 24,000 metres in less than a second.", "att": "", "type": "observation", "cat": "domain", "spk": "", "quote": "For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 80,000 feet in less than a second.", "refs": [{"name": "USS Princeton", "type": "object"}, {"name": "Nimitz Carrier Strike Group encounter, November 2004", "type": "event"}]}, {"loc": "00:07:39.3\u201300:07:47.8", "bk": 456, "text": "On 2004-11-14, David Fravor and Alex Dietrich, each with a weapons system officer in the back seat, were diverted to investigate the anomalous aerial vehicles detected by the USS Princeton radar.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "USS Princeton", "type": "object"}, {"name": "Nimitz Carrier Strike Group encounter, November 2004", "type": "event"}]}, {"loc": "00:07:47.8", "bk": 464, "text": "During the Nimitz Carrier Strike Group encounter in November 2004, David Fravor and Alex Dietrich found an area of roiling white water the size of a Boeing 737 in an otherwise calm blue sea.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "", "quote": "They found an area of roiling white water the size of a 737 in an otherwise calm blue sea.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz Carrier Strike Group encounter, November 2004", "type": "event"}]}, {"loc": "00:07:55.9\u201300:08:09.7", "bk": 472, "text": "David Fravor observed a small white tic-tac-shaped object moving above the white water area during the 2004 Nimitz encounter.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "And we saw this little white tic-tac-looking object. And it's just kind of moving above the whitewater area.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz Carrier Strike Group encounter, November 2004", "type": "event"}]}, {"loc": "00:08:12.3\u201300:08:24.5", "bk": 492, "text": "As David Fravor descended towards the object during the 2004 Nimitz encounter, the tic-tac-shaped object turned abruptly and began mirroring his aircraft's movements, descending when he descended and ascending when he ascended.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "Sort of spiraling down? Yep. The tic-tac's still pointing north-south. It goes and just turns abruptly and starts mirroring me. So as I'm coming down, it starts coming up.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz Carrier Strike Group encounter, November 2004", "type": "event"}]}, {"loc": "00:08:30.5\u201300:08:37.0", "bk": 508, "text": "The tic-tac-shaped object observed by David Fravor during the 2004 Nimitz encounter was approximately the size of his F-18, with no markings, no wings, and no exhaust plumes.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "", "quote": "He said it was about the size of his F-18, with no markings, no wings, no exhaust plumes.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz Carrier Strike Group encounter, November 2004", "type": "event"}]}, {"loc": "00:08:37.0\u201300:08:47.8", "bk": 516, "text": "When David Fravor attempted to move closer to the object during the 2004 Nimitz encounter, it climbed and then disappeared from view.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "I want to see how close I can get. So I go like this, and it's climbing still. And when it gets right in front of me, it just disappears. ... It had sped off.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz Carrier Strike Group encounter, November 2004", "type": "event"}]}, {"loc": "00:08:49.4\u201300:09:00.9", "bk": 528, "text": "Alex Dietrich initially attempted to categorise the object observed during the 2004 Nimitz encounter as a helicopter or drone before it disappeared.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Dietrich, Alex", "quote": "So your mind tries to make sense of it. I'm going to categorize this as maybe a helicopter or maybe a drone. And when it disappeared, I mean, it was just...", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz Carrier Strike Group encounter, November 2004", "type": "event"}]}, {"loc": "00:09:00.9\u201300:09:08.9", "bk": 540, "text": "Both the back-seat weapons system officers from the F-18s piloted by David Fravor and Alex Dietrich witnessed the tic-tac object during the 2004 Nimitz encounter.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Dietrich, Alex", "quote": "Yeah. Oh, yeah. There was four of us in the airplanes literally watching this thing for roughly about five minutes.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Fravor, David", "type": "person"}, {"name": "Nimitz Carrier Strike Group encounter, November 2004", "type": "event"}]}, {"loc": "00:09:03.5\u201300:09:08.9", "bk": 540, "text": "Four United States naval aviators in two F-18 aircraft watched the tic-tac object for approximately five minutes during the 2004 Nimitz encounter.", "att": "", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "There was four of us in the airplanes literally watching this thing for roughly about five minutes.", "refs": [{"name": "Nimitz Carrier Strike Group encounter, November 2004", "type": "event"}]}, {"loc": "00:09:08.9\u201300:09:14.4", "bk": 548, "text": "Seconds after the tic-tac object disappeared, the USS Princeton radar reacquired the target approximately 96 kilometres away during the 2004 Nimitz encounter.", "att": "", "type": "observation", "cat": "domain", "spk": "", "quote": "Seconds later, the Princeton reacquired the target, 60 miles away.", "refs": [{"name": "USS Princeton", "type": "object"}, {"name": "Nimitz Carrier Strike Group encounter, November 2004", "type": "event"}]}, {"loc": "00:09:14.4", "bk": 552, "text": "Another F-18 crew briefly locked onto the tic-tac object with a targeting camera before it departed again during the 2004 Nimitz encounter.", "att": "", "type": "observation", "cat": "domain", "spk": "", "quote": "Another crew managed to briefly lock onto it with a targeting camera before it zipped off again.", "refs": [{"name": "Nimitz Carrier Strike Group encounter, November 2004", "type": "event"}]}, {"loc": "00:09:20.8\u201300:09:31.1", "bk": 560, "text": "Alex Dietrich stated that she and her fellow pilots would likely have not reported the encounter if they had witnessed it alone because it sounds crazy.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Dietrich, Alex", "quote": "You know, I think that over beers, we've sort of said, hey, man, if I saw this solo, I don't know that I would have come back and said anything because it sounds so crazy when I say it.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz Carrier Strike Group encounter, November 2004", "type": "event"}]}, {"loc": "00:09:31.1\u201300:09:37.9", "bk": 568, "text": "David Fravor stated that he has been told by some people that describing the 2004 Nimitz encounter makes him sound crazy.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Fravor, David", "quote": "I've had some people tell me, you know, when you say that, you can sound crazy. I'll be honest.", "refs": [{"name": "Fravor, David", "type": "person"}]}, {"loc": "00:09:37.9\u201300:09:39.8", "bk": 576, "text": "David Fravor stated that he is not a UFO enthusiast.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Fravor, David", "quote": "I'll be honest. I'm not a UFO guy.", "refs": [{"name": "Fravor, David", "type": "person"}]}, {"loc": "00:09:45.5\u201300:09:56.5", "bk": 584, "text": "David Fravor stated that there is definitely something that was encountered during the 2004 Nimitz incident that has capabilities exceeding those of the F-18 aircraft, though he does not know who built it, possesses the technology, or has the knowledge to construct it.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Fravor, David", "quote": "Yes. There's definitely something that, I don't know who's building it, who's got the technology, who's got the brains, but there's something out there that was better than our airplane.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz Carrier Strike Group encounter, November 2004", "type": "event"}]}, {"loc": "00:09:56.5\u201300:09:58.7", "bk": 596, "text": "The aircrew from the 2004 Nimitz encounter filed official reports.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "The air crew filed reports.", "refs": [{"name": "Nimitz Carrier Strike Group encounter, November 2004", "type": "event"}]}, {"loc": "00:09:58.7\u201300:10:04.2", "bk": 596, "text": "After the aircrew filed reports, the Nimitz encounter incident disappeared from official channels for five years until Luis Elizondo came across the story and investigated it.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "Then, like the mysterious flying object, the Nimitz encounter disappeared. Nothing was said or done officially for five years until Lou Elizondo came across the story and investigated.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Nimitz Carrier Strike Group encounter, November 2004", "type": "event"}]}, {"loc": "00:10:13.2\u201300:10:19.1", "bk": 612, "text": "Luis Elizondo stated that the United States military spends millions of dollars training pilots, and those pilots are witnessing phenomena they cannot explain.", "att": "", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "We spend millions of dollars in training these pilots, and they are seeing something that they can't explain.", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:10:19.1\u201300:10:27.7", "bk": 616, "text": "Luis Elizondo stated that the information from pilot observations is backed up by electro-optical data, such as gun camera footage, and by radar data, which he considers compelling.", "att": "", "type": "opinion", "cat": "domain", "spk": "Elizondo, Luis", "quote": "Furthermore, that information's being backed up on electro-optical data, like gun camera footage, and by radar data. Now, to me, that's compelling.", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:10:27.7\u201300:10:31.7", "bk": 624, "text": "Inside the Pentagon, Luis Elizondo's findings on unidentified aerial phenomena were met with scepticism.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "Inside the Pentagon, his findings were met with skepticism.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Pentagon", "type": "organisation"}]}, {"loc": "00:10:31.7\u201300:10:39.5", "bk": 628, "text": "The Advanced Aerospace Threat Identification Program (AATIP) funding was eliminated in 2012.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "AATIP's funding was eliminated in 2012", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:10:31.7\u201300:10:39.5", "bk": 628, "text": "Luis Elizondo stated that, despite the elimination of Advanced Aerospace Threat Identification Program (AATIP) funding, he and a handful of others kept the programme's mission alive.", "att": "", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "but Elizondo says he and a handful of others kept the mission alive.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:10:39.5\u201300:10:48.8", "bk": 636, "text": "Luis Elizondo quit the Pentagon in 2017, but not before obtaining declassification of three videos.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "until finally, frustrated, he quit the Pentagon in 2017, but not before getting these three videos declassified.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Pentagon", "type": "organisation"}, {"name": "Declassified Navy UAP videos (AATIP)", "type": "document"}]}, {"loc": "00:10:57.5\u201300:11:04.3", "bk": 656, "text": "Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush, and had access to top-secret government programmes.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush, and had access to top-secret government programs.", "refs": [{"name": "Mellon, Christopher", "type": "person"}]}, {"loc": "00:10:51.9\u201300:10:57.5", "bk": 648, "text": "Christopher Mellon stated he attempted to help his colleague Luis Elizondo elevate the Unidentified Aerial Phenomena (UAP) issue within the Department of Defense and get it to the Secretary of Defense.", "att": "", "type": "testimony", "cat": "domain", "spk": "Mellon, Christopher", "quote": "I tried to help my colleague, Lou Elizondo, elevate the issue in the department and actually get it to the Secretary of Defense.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Elizondo, Luis", "type": "person"}, {"name": "Secretary of Defense", "type": "organisation"}]}, {"loc": "00:11:08.4\u201300:11:18.7", "bk": 668, "text": "Christopher Mellon stated that the unidentified aerial phenomena are not of United States origin, based on his knowledge of classified programmes and the decision-making process.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Mellon, Christopher", "quote": "So it's not us, that's one thing we know. ... I could say that with a very high degree of confidence, in part because of the positions I held in the department, and I know the process.", "refs": [{"name": "Mellon, Christopher", "type": "person"}]}, {"loc": "00:11:18.7\u201300:11:26.2", "bk": 676, "text": "Christopher Mellon grew concerned that nothing was being done about Unidentified Aerial Phenomena (UAP) within the Pentagon, prompting him to take action.", "att": "", "type": "testimony", "cat": "domain", "spk": "Mellon, Christopher", "quote": "Mellon says he grew concerned nothing was being done about UAPs, so he decided to do something.", "refs": [{"name": "Mellon, Christopher", "type": "person"}]}, {"loc": "00:11:26.2\u201300:11:37.0", "bk": 684, "text": "In 2017, Christopher Mellon, as a private citizen, secretly obtained the three Navy Unidentified Aerial Phenomena videos that Luis Elizondo had declassified and leaked them to The New York Times.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "In 2017, as a private citizen, he surreptitiously acquired the three Navy videos Elizondo had declassified and leaked them to The New York Times.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Elizondo, Luis", "type": "person"}, {"name": "Declassified Navy UAP videos (AATIP)", "type": "document"}, {"name": "The New York Times", "type": "organisation"}]}, {"loc": "00:11:37.0\u201300:11:46.1", "bk": 696, "text": "Christopher Mellon stated that it is bizarre and unfortunate that someone like himself had to leak classified information to get the Unidentified Aerial Phenomena (UAP) issue on the national security agenda.", "att": "", "type": "opinion", "cat": "domain", "spk": "Mellon, Christopher", "quote": "It's bizarre and unfortunate that someone like myself has to do something like that to get a national security issue like this on the agenda.", "refs": [{"name": "Mellon, Christopher", "type": "person"}]}, {"loc": "00:11:57.6\u201300:12:07.2", "bk": 716, "text": "Christopher Mellon stated that to get the Pentagon to address Unidentified Aerial Phenomena (UAP), the public and Congress needed to be engaged first, and then Congress could apply pressure on the Department of Defense.", "att": "", "type": "opinion", "cat": "domain", "spk": "Mellon, Christopher", "quote": "We knew and understood that you had to go to the public, get the public interested to get Congress interested, to then circle back to the Defense Department and get them to start taking a look at it.", "refs": [{"name": "Mellon, Christopher", "type": "person"}]}, {"loc": "00:12:09.1\u201300:12:15.6", "bk": 728, "text": "In August (of 2020), the Pentagon resurrected the Advanced Aerospace Threat Identification Program (AATIP), rebranding it as the Unidentified Aerial Phenomena (UAP) Task Force.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "This past August, the Pentagon resurrected AATIP. It's now called the UAP Task Force.", "refs": [{"name": "Pentagon", "type": "organisation"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "UAP Task Force", "type": "project"}]}, {"loc": "00:12:15.6\u201300:12:20.1", "bk": 732, "text": "Service members are now encouraged to report strange Unidentified Aerial Phenomena (UAP) encounters to the United States military.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "Service members now are encouraged to report strange encounters.", "refs": [{"name": "UAP Task Force", "type": "project"}]}, {"loc": "00:12:20.1\u201300:12:22.6", "bk": 740, "text": "The United States Senate wants answers about Unidentified Aerial Phenomena (UAP).", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "And the Senate wants answers.", "refs": [{"name": "US Senate Intelligence Committee", "type": "organisation"}]}, {"loc": "00:12:22.6\u201300:12:26.5", "bk": 740, "text": "Senator Marco Rubio stated that anything that enters restricted airspace that is not supposed to be there is a security threat.", "att": "", "type": "opinion", "cat": "domain", "spk": "Rubio, Marco", "quote": "Anything that enters an airspace that's not supposed to be there is a threat.", "refs": [{"name": "Rubio, Marco", "type": "person"}]}, {"loc": "00:12:26.5\u201300:12:34.0", "bk": 744, "text": "After receiving classified briefings on Unidentified Aerial Phenomena (UAP), Senator Marco Rubio called for a detailed analysis.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "After receiving classified briefings on UAPs, Senator Marco Rubio called for a detailed analysis.", "refs": [{"name": "Rubio, Marco", "type": "person"}]}, {"loc": "00:12:34.0\u201300:12:46.3", "bk": 752, "text": "In December (of 2020), whilst he was still head of the Senate Intelligence Committee, Senator Marco Rubio asked the Director of National Intelligence and the Pentagon to present Congress with an unclassified report on Unidentified Aerial Phenomena (UAP) by the following month.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "US Senate Intelligence Committee", "type": "organisation"}, {"name": "Director of National Intelligence", "type": "organisation"}, {"name": "Pentagon", "type": "organisation"}]}, {"loc": "00:12:56.2\u201300:13:06.9", "bk": 776, "text": "Senator Marco Rubio acknowledged that there is a stigma on Capitol Hill regarding Unidentified Aerial Phenomena (UAP), with some colleagues interested in the topic and others dismissing it.", "att": "", "type": "testimony", "cat": "domain", "spk": "Rubio, Marco", "quote": "You know, there's a stigma on Capitol Hill. I mean, some of my colleagues are very interested in this topic and some kind of, you know, giggle when you bring it up.", "refs": [{"name": "Rubio, Marco", "type": "person"}]}, {"loc": "00:13:00.8\u201300:13:12.2", "bk": 780, "text": "Senator Marco Rubio stated that the stigma surrounding Unidentified Aerial Phenomena (UAP) on Capitol Hill should not prevent a proper investigation into the fundamental question of what these phenomena are.", "att": "", "type": "opinion", "cat": "domain", "spk": "Rubio, Marco", "quote": "But I don't think we can allow the stigma to keep us from having an answer to a very fundamental question.", "refs": [{"name": "Rubio, Marco", "type": "person"}]}, {"loc": "00:13:14.1\u201300:13:25.9", "bk": 792, "text": "Senator Marco Rubio stated that he wants the United States government to take Unidentified Aerial Phenomena (UAP) seriously and establish a process to analyse the data whenever it is received.", "att": "", "type": "opinion", "cat": "domain", "spk": "Rubio, Marco", "quote": "I want us to take it seriously and have a process to take it seriously. I want us to have a process to analyze the data. every time it comes in, that there be a place where this is cataloged and constantly analyzed until we get some answers.", "refs": [{"name": "Rubio, Marco", "type": "person"}]}, {"loc": "00:13:25.9\u201300:13:28.3", "bk": 804, "text": "Senator Marco Rubio stated that the answer to the Unidentified Aerial Phenomena (UAP) question might be simple or complex.", "att": "", "type": "opinion", "cat": "domain", "spk": "Rubio, Marco", "quote": "Maybe it has a very simple answer. Maybe it doesn't.", "refs": [{"name": "Rubio, Marco", "type": "person"}]}, {"loc": "00:13:35.4\u201300:13:37.3", "bk": 812, "text": "Alex Dietrich stated that she felt vulnerable about not having a defence against the observed unidentified aerial phenomena.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Dietrich, Alex", "quote": "I felt the vulnerability of not having anything to defend ourselves.", "refs": [{"name": "Dietrich, Alex", "type": "person"}]}], "nodes_by_type": {"organisation": ["60 Minutes (TV series)", "Pentagon", "The New York Times", "Director of National Intelligence", "Secretary of Defense", "US Senate Intelligence Committee", "History Channel", "US House of Representatives", "Top Gun Naval Flight School"], "person": ["Whitaker, Bill", "Elizondo, Luis", "Graves, Ryan", "Fravor, David", "Dietrich, Alex", "Mellon, Christopher", "Reid, Harry", "Rubio, Marco"], "project": ["Advanced Aerospace Threat Identification Program (AATIP)", "Project Blue Book", "UAP Task Force"], "object": ["USS Nimitz", "USS Princeton"], "place": ["USA, Virginia, Virginia Beach (vicinity)", "USA, California, Southern California (off coast)", "USA, Florida, Jacksonville (vicinity)", "USA, California, San Diego (vicinity)"], "event": ["Nimitz Carrier Strike Group encounter, November 2004", "Virginia Beach radar sightings, 2014\u20132016"], "document": ["Jacksonville targeting camera footage, 2015", "Atlantic coast F-18 radar and infrared footage, 2015\u20132019", "Declassified Navy UAP videos (AATIP)"]}, "n_claims": 83, "n_nodes": 31, "label": "2: units/durability/British"}, {"claims": [{"loc": "00:00:01.8-00:00:07.6", "bk": 0, "text": "60 Minutes has tackled many strange stories.", "att": "", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "We have tackled many strange stories on 60 Minutes, but perhaps none like this.", "refs": [{"name": "60 Minutes", "type": "organisation"}]}, {"loc": "00:00:07.6-00:00:30.0", "bk": 4, "text": "The United States government has publicly acknowledged the reality of Unidentified Aerial Phenomena (UAP).", "att": "", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "It's the story of the U.S. government's grudging acknowledgement of Unidentified Aerial Phenomena, UAP, more commonly known as ufos after decades of public denial the pentagon now admits there's something out there", "refs": [{"name": "United States Department of Defense", "type": "organisation"}]}, {"loc": "00:00:14.9-00:00:42.3", "bk": 12, "text": "The United States Senate Intelligence Committee has ordered the Director of National Intelligence and the Secretary of Defense to deliver a report on UAP sightings by the following month.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "the u.s senate wants to know what it is the intelligence committee has ordered the director of national intelligence and the secretary of defense to deliver a report on the mysterious sightings by next month", "refs": [{"name": "United States Senate Intelligence Committee", "type": "organisation"}, {"name": "Director of National Intelligence", "type": "organisation"}, {"name": "United States Department of Defense", "type": "organisation"}]}, {"loc": "00:00:44.4-00:00:59.6", "bk": 44, "text": "Luis Elizondo states that the United States government has publicly stated that UAP are real.", "att": "", "type": "testimony", "cat": "domain", "spk": "Luis Elizondo", "quote": "Bill Whitaker: So what you're telling me is that UFOs, unidentified flying objects, are real. Luis Elizondo: Bill, I think we're beyond that already. The government has already stated for the record that they're real. I'm not telling you that. The United States government is telling you that.", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:01:02.4-00:01:11.5", "bk": 60, "text": "Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo.", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:01:11.5-00:01:24.1", "bk": 68, "text": "Luis Elizondo was asked to join the Advanced Aerospace Threat Identification Program (AATIP) at the Pentagon in 2008.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "He hadn't given UFOs a second thought until 2008. That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "United States Department of Defense", "type": "organisation"}]}, {"loc": "00:01:24.1-00:01:34.3", "bk": 84, "text": "The mission of the Advanced Aerospace Threat Identification Program (AATIP) was to collect and analyse information involving anomalous aerial vehicles, also termed Unidentified Aerial Phenomena (UAP).", "att": "", "type": "administrative", "cat": "domain", "spk": "Luis Elizondo", "quote": "The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs. We call them UAPs.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:01:50.3-00:02:01.6", "bk": 108, "text": "The Advanced Aerospace Threat Identification Program (AATIP) was part of a USD 22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UAP.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "Buried away in the Pentagon, AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Reid, Harry", "type": "person"}]}, {"loc": "00:02:01.6-00:02:10.8", "bk": 120, "text": "When Luis Elizondo took over the Advanced Aerospace Threat Identification Program (AATIP) in 2010, he focused on the national security implications of Unidentified Aerial Phenomena (UAP) documented by United States service members.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "When Elizondo took over in 2010, he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "Observed UAP exhibit the capability to perform manoeuvres with accelerations of 600\u2013700 G-forces.", "att": "", "type": "measurement", "cat": "domain", "spk": "Luis Elizondo", "quote": "Imagine a technology that can do 600 to 700 G-forces", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "Observed UAP exhibit the capability to fly at approximately 21,000 kilometres per hour.", "att": "", "type": "measurement", "cat": "domain", "spk": "Luis Elizondo", "quote": "that can fly at 13,000 miles an hour", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "Observed UAP exhibit the capability to evade radar.", "att": "", "type": "measurement", "cat": "domain", "spk": "Luis Elizondo", "quote": "that can evade radar", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "Observed UAP exhibit the capability to fly through air and water, and possibly space.", "att": "", "type": "measurement", "cat": "domain", "spk": "Luis Elizondo", "quote": "and that can fly through air and water and possibly space", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "Observed UAP show no obvious signs of propulsion.", "att": "", "type": "observation", "cat": "domain", "spk": "Luis Elizondo", "quote": "and oh, by the way, has no obvious signs of propulsion", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "Observed UAP have no wings or control surfaces.", "att": "", "type": "observation", "cat": "domain", "spk": "Luis Elizondo", "quote": "no wings, no control surfaces", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "Observed UAP appear to defy the natural effects of Earth's gravity.", "att": "", "type": "observation", "cat": "domain", "spk": "Luis Elizondo", "quote": "and yet still can defy the natural effects of Earth's gravity", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:02:37.0-00:02:47.7", "bk": 156, "text": "The Advanced Aerospace Threat Identification Program (AATIP) was a loose-knit mix of scientists, electro-optical engineers, avionics specialists, and intelligence experts, often working part-time.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "Elizondo tells us AATIP was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:02:37.0-00:02:57.7", "bk": 156, "text": "Personnel of the Advanced Aerospace Threat Identification Program (AATIP) analysed videos of UAP encounters.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "They combed through data and records and analyzed videos like this.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:02:57.7-00:03:07.3", "bk": 176, "text": "A United States Navy aircrew struggled to lock onto a fast-moving object observed off the Atlantic coast in 2015.", "att": "", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "A Navy aircrew struggles to lock onto a fast-moving object off the U.S. Atlantic coast in 2015.", "refs": [{"name": "2015 Atlantic coast UAP sightings", "type": "event"}]}, {"loc": "00:03:07.3-00:03:20.4", "bk": 184, "text": "The Pentagon admits it does not know what was recorded in recently released imagery of unidentified objects.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "Recently released images may not convince UFO skeptics, but the Pentagon admits it doesn't know what in the world this is, or this, or this.", "refs": [{"name": "United States Department of Defense", "type": "organisation"}]}, {"loc": "00:03:20.4-00:03:38.6", "bk": 200, "text": "Luis Elizondo states that some alleged UAP sightings have simple explanations such as refracted light, weather balloons, rocket launches, or the planet Venus.", "att": "", "type": "opinion", "cat": "domain", "spk": "Luis Elizondo", "quote": "Bill Whitaker: So what do you say to the skeptics? It's refracted light, weather balloons, a rocket being launched, Venus. Luis Elizondo: In some cases, there are simple explanations for what people are witnessing, but there are some that that are not.", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:03:38.6-00:03:52.6", "bk": 216, "text": "Luis Elizondo states that personnel of the Advanced Aerospace Threat Identification Program (AATIP) conduct due diligence when investigating potential UAP reports, considering alternative explanations such as cruise missile technology or high-altitude reconnaissance balloons before reaching conclusions.", "att": "", "type": "testimony", "cat": "domain", "spk": "Luis Elizondo", "quote": "We're not just simply jumping to a conclusion that's saying, oh, that's a UAP out there. We're going through our due diligence. Is it some sort of new type of cruise missile technology that China has developed? Is it some sort of high-altitude balloon that's conducting reconnaissance?", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:03:48.2-00:03:52.6", "bk": 228, "text": "Luis Elizondo considers an alleged UAP to become compelling and problematic when alternative explanations have been exhausted, it is confirmed to exist in United States airspace, and it is verified as real.", "att": "", "type": "opinion", "cat": "domain", "spk": "Luis Elizondo", "quote": "Ultimately, when you have exhausted all those what-ifs and you're still left with the fact that this is in our airspace and it's real, that's when it becomes compelling and that's when it becomes problematic.", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:04:06.2-00:04:12.9", "bk": 244, "text": "Former United States Navy pilot Lieutenant Ryan Graves characterises unidentified aerial phenomena as a security risk.", "att": "", "type": "opinion", "cat": "domain", "spk": "Bill Whitaker", "quote": "Former Navy pilot Lieutenant Ryan Graves calls whatever is out there a security risk.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:04:06.2-00:04:29.7", "bk": 244, "text": "Lieutenant Ryan Graves's F-18 fighter squadron began observing Unidentified Aerial Phenomena (UAP) hovering over restricted airspace southeast of Virginia Beach starting in 2014.", "att": "", "type": "testimony", "cat": "domain", "spk": "Bill Whitaker", "quote": "He told us his F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "USA, Virginia, Virginia Beach (vicinity)", "type": "place"}]}, {"loc": "00:04:06.2-00:04:29.7", "bk": 244, "text": "The ability to update the F-18's radar and use infrared targeting cameras allowed pilots to detect and lock onto UAP objects.", "att": "", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "when they updated their jet's radar, making it possible to zero in with infrared targeting cameras", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:04:29.7-00:04:37.1", "bk": 268, "text": "Detection of objects on both radar and infrared targeting cameras indicates the presence of a material object.", "att": "", "type": "opinion", "cat": "domain", "spk": "Ryan Graves", "quote": "Bill Whitaker: So you're seeing it both with the radar and with the infrared, and that tells you that there is something out there. Ryan Graves: Pretty hard to spoof that.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:04:38.6-00:04:43.0", "bk": 276, "text": "Photographs of unidentified objects were captured in the vicinity of Virginia Beach in 2019.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "These photographs were taken in 2019 in the same area.", "refs": [{"name": "USA, Virginia, Virginia Beach (vicinity)", "type": "place"}]}, {"loc": "00:04:43.0-00:04:48.2", "bk": 280, "text": "The Pentagon confirms that the photographed objects cannot be identified.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "The Pentagon confirms these are images of objects it can't identify.", "refs": [{"name": "United States Department of Defense", "type": "organisation"}]}, {"loc": "00:04:48.2-00:04:56.6", "bk": 288, "text": "Lieutenant Ryan Graves states that pilots training off the Atlantic coast observe unidentified aerial phenomena on a daily basis.", "att": "", "type": "testimony", "cat": "domain", "spk": "Ryan Graves", "quote": "Bill Whitaker: These photographs were taken in 2019 in the same area. The Pentagon confirms these are images of objects it can't identify. Lieutenant Graves told us pilots training off the Atlantic coast see things like that all the time. Ryan Graves: Every day. Every day for at least a couple of years.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:04:55.3-00:05:02.5", "bk": 292, "text": "Lieutenant Ryan Graves states that pilots have observed unidentified aerial phenomena every day for at least a couple of years off the Atlantic coast.", "att": "", "type": "testimony", "cat": "domain", "spk": "Ryan Graves", "quote": "Every day for at least a couple of years.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:05:01.2-00:05:04.3", "bk": 300, "text": "Lieutenant Ryan Graves observed an unidentified object without visible exhaust plume.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Ryan Graves", "quote": "You know, I don't see an exhaust plume.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:05:04.3-00:05:12.8", "bk": 304, "text": "A targeting camera operated by members of Lieutenant Ryan Graves' squadron captured footage of an unidentified object off the coast of Jacksonville, Florida in 2015.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "including this one, off the coast of Jacksonville, Florida in 2015, captured on a targeting camera by members of Graves' squadron.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "USA, Florida, Jacksonville (vicinity)", "type": "place"}]}, {"loc": "00:05:12.8-00:05:23.8", "bk": 312, "text": "Footage captured by members of Lieutenant Ryan Graves' squadron shows an unidentified object rotating while moving against a wind with a speed of approximately 220 kilometres per hour.", "att": "", "type": "observation", "cat": "domain", "spk": "[external footage]", "quote": "The wind's 120 knots far west.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:05:25.4-00:05:27.3", "bk": 324, "text": "Voices in footage captured by Lieutenant Ryan Graves' squadron express surprise at the observed unidentified object.", "att": "", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "You can sort of hear the surprise in their voices.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:05:27.3-00:05:33.2", "bk": 324, "text": "Lieutenant Ryan Graves states that the pilots in the footage became amazed at the observed unidentified object and momentarily lost their usual professional demeanour.", "att": "", "type": "opinion", "cat": "domain", "spk": "Ryan Graves", "quote": "They seem to have broke character a bit, and were just kind of amazed at what they were seeing.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:05:33.2-00:05:42.8", "bk": 332, "text": "Lieutenant Ryan Graves characterises the observed unidentified object as difficult to explain due to its rotation, altitude, and apparent propulsion.", "att": "", "type": "opinion", "cat": "domain", "spk": "Ryan Graves", "quote": "Bill Whitaker: What do you think when you see something like this? Ryan Graves: This is a difficult one to explain. You have rotation, you have high altitudes, you have propulsion, right? I don't know. I don't know what it is, frankly.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:05:44.9-00:05:56.0", "bk": 344, "text": "Lieutenant Ryan Graves states that pilots speculate the observed unidentified aerial phenomena are one of three possibilities: secret United States technology, an adversary spy vehicle, or something otherworldly.", "att": "", "type": "testimony", "cat": "domain", "spk": "Bill Whitaker", "quote": "He told us pilots speculate they are one of three things, secret U.S. technology, an adversary spy vehicle, or something otherworldly.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:05:56.0-00:06:00.5", "bk": 356, "text": "Lieutenant Ryan Graves assesses that the highest probability is the observed unidentified aerial phenomena constitute a threat observation programme.", "att": "", "type": "opinion", "cat": "domain", "spk": "Ryan Graves", "quote": "I'd say, you know, the highest probability is it's a threat observation program.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:06:00.5-00:06:04.1", "bk": 360, "text": "Lieutenant Ryan Graves considers Russian or Chinese technology a possible explanation for the observed unidentified aerial phenomena.", "att": "", "type": "opinion", "cat": "domain", "spk": "Ryan Graves", "quote": "Bill Whitaker: Could it be Russian or Chinese technology? Ryan Graves: I don't see why not.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:06:05.4-00:06:08.8", "bk": 364, "text": "Lieutenant Ryan Graves expresses concern about the observed unidentified aerial phenomena.", "att": "", "type": "opinion", "cat": "domain", "spk": "Ryan Graves", "quote": "Bill Whitaker: Are you alarmed? Ryan Graves: I am worried, frankly.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:06:08.8-00:06:13.6", "bk": 368, "text": "Lieutenant Ryan Graves states that if the observed unidentified aerial phenomena were tactical jets from another country, it would constitute a massive security issue.", "att": "", "type": "opinion", "cat": "domain", "spk": "Ryan Graves", "quote": "You know, if these were tactical jets from another country that were hanging out up there, it would be a massive issue.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:06:13.6-00:06:23.4", "bk": 372, "text": "Lieutenant Ryan Graves expresses concern that the unusual characteristics of the observed unidentified aerial phenomena cause government and military officials to avoid addressing them seriously.", "att": "", "type": "opinion", "cat": "domain", "spk": "Ryan Graves", "quote": "But because it looks slightly different, we're not willing to actually look at the problem in the face. We're happy to just ignore the fact that these are out there watching us every day.", "refs": [{"name": "Graves, Ryan", "type": "person"}]}, {"loc": "00:06:23.4-00:06:30.3", "bk": 380, "text": "The United States government publicly closed Project Blue Book, its investigation into unidentified flying objects, in 1969.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "The government has ignored it, at least publicly, since closing its Project Blue Book investigation in 1969.", "refs": [{"name": "Project Blue Book", "type": "project"}]}, {"loc": "00:06:30.3-00:06:40.8", "bk": 388, "text": "An encounter with an unidentified aerial phenomenon occurred off Southern California in 2004, documented by radar, camera, and four naval aviators.", "att": "", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "But that began to change after an incident off Southern California in 2004, which was documented by radar, by camera, and four naval aviators.", "refs": [{"name": "Nimitz UAP encounter, 2004-11-14", "type": "event"}, {"name": "USA, California, San Diego (vicinity)", "type": "place"}]}, {"loc": "00:06:30.3-00:06:47.3", "bk": 388, "text": "David Fravor is a graduate of the Top Gun Naval Flight School and was commander of an F-18 squadron aboard the USS Nimitz.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "We spoke to two of them, David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "USS Nimitz", "type": "object"}]}, {"loc": "00:06:40.8-00:06:54.7", "bk": 400, "text": "Lieutenant Alex Dietrich was a pilot flying at David Fravor's wing and participated in the 2004 encounter off Southern California.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "and flying at his wing, Lieutenant Alex Dietrich, who has never spoken publicly about the encounter.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Fravor, David", "type": "person"}]}, {"loc": "00:06:40.8-00:06:54.7", "bk": 400, "text": "Lieutenant Alex Dietrich had never spoken publicly about her participation in the 2004 Nimitz encounter prior to this interview.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "and flying at his wing, Lieutenant Alex Dietrich, who has never spoken publicly about the encounter.", "refs": [{"name": "Dietrich, Alex", "type": "person"}]}, {"loc": "00:06:57.3-00:07:14.4", "bk": 416, "text": "Lieutenant Alex Dietrich states she is speaking publicly about the 2004 encounter because she was operating a government aircraft on government time and feels a responsibility to share her unclassified account.", "att": "", "type": "testimony", "cat": "domain", "spk": "Alex Dietrich", "quote": "Alex Dietrich: I never wanted to be on national TV, no offense. Bill Whitaker: So why are you doing this? Alex Dietrich: Because I was in a government aircraft, because I was on the clock, and so I feel a responsibility to share what I can, and it is unclassified.", "refs": [{"name": "Dietrich, Alex", "type": "person"}]}, {"loc": "00:07:14.4-00:07:23.1", "bk": 432, "text": "In November 2004, the USS Nimitz Carrier Strike Group was conducting training exercises approximately 160 kilometres southwest of San Diego.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego.", "refs": [{"name": "USS Nimitz Carrier Strike Group", "type": "organisation"}, {"name": "USA, California, San Diego (vicinity)", "type": "place"}]}, {"loc": "00:07:23.1-00:07:39.3", "bk": 440, "text": "For a week prior to 2004-11-14, the advanced radar aboard the USS Princeton detected what operators termed multiple anomalous aerial vehicles, which the radar tracked descending from an altitude of approximately 24,000 metres in less than one second.", "att": "", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 80,000 feet in less than a second.", "refs": [{"name": "USS Princeton", "type": "object"}]}, {"loc": "00:07:39.3-00:07:47.8", "bk": 456, "text": "On 2004-11-14, David Fravor and Alex Dietrich, each with a weapons system officer in the rear seat, were diverted to investigate anomalous aerial vehicles detected by USS Princeton radar.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP encounter, 2004-11-14", "type": "event"}]}, {"loc": "00:07:47.8-00:07:55.9", "bk": 464, "text": "During the 2004-11-14 encounter, David Fravor and Alex Dietrich discovered an area of roiling white water approximately the size of a Boeing 737 in an otherwise calm ocean.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "They found an area of roiling white water the size of a 737 in an otherwise calm blue sea.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP encounter, 2004-11-14", "type": "event"}]}, {"loc": "00:08:06.3-00:08:09.7", "bk": 484, "text": "David Fravor and his weapons system officer observed a small white object resembling a Tic Tac located above the roiling white water during the 2004-11-14 encounter.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "David Fravor", "quote": "And we saw this little white tic-tac-looking object. And it's just kind of moving above the whitewater area.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name":
