n resurrected AATIP. It's now called the UAP Task Force.", "refs": [{"name": "United States Department of Defense (DoD)", "type": "organisation"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "UAP Task Force", "type": "project"}]}, {"loc": "00:12:15.6-00:12:20.1", "bk": 732, "text": "United States military service members are now encouraged to report encounters with Unidentified Aerial Phenomena (UAP).", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "Service members now are encouraged to report strange encounters.", "refs": [{"name": "United States Navy", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:12:20.1-00:12:22.6", "bk": 740, "text": "The United States Senate has requested answers regarding Unidentified Aerial Phenomena (UAP).", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "And the Senate wants answers.", "refs": [{"name": "United States Senate", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:12:22.6-00:12:26.5", "bk": 740, "text": "Senator Marco Rubio characterises any object entering restricted airspace without authorisation as a threat.", "att": "", "type": "opinion", "cat": "domain", "spk": "Rubio, Marco", "quote": "Anything that enters an airspace that's not supposed to be there is a threat.", "refs": [{"name": "Rubio, Marco", "type": "person"}]}, {"loc": "00:12:26.5-00:12:34.0", "bk": 744, "text": "After receiving classified briefings on Unidentified Aerial Phenomena (UAP), Senator Marco Rubio called for a detailed analysis of the issue.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "After receiving classified briefings on UAPs, Senator Marco Rubio called for a detailed analysis.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:12:34.0-00:12:46.3", "bk": 752, "text": "In December 2020, whilst serving as head of the US Senate Select Committee on Intelligence, Senator Marco Rubio asked the Office of the Director of National Intelligence (ODNI) and the United States Department of Defense (DoD) to present Congress with an unclassified report on Unidentified Aerial Phenomena (UAP) by the following month.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "US Senate Select Committee on Intelligence", "type": "organisation"}, {"name": "Office of the Director of National Intelligence (ODNI)", "type": "organisation"}, {"name": "United States Department of Defense (DoD)", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:12:46.3-00:13:06.9", "bk": 764, "text": "Senator Marco Rubio observes that the issue of Unidentified Aerial Phenomena (UAP) is unusual and that the Pentagon and military branches have historically dismissed the topic, noting that there is a stigma regarding the issue on Capitol Hill with some colleagues showing scepticism.", "att": "", "type": "opinion", "cat": "domain", "spk": "Rubio, Marco", "quote": "This is a bizarre issue. The Pentagon and other branches of the military have a long history of sort of dismissing this. What makes you think that this time is going to be different?... You know, there's a stigma on Capitol Hill. I mean, some of my colleagues are very interested in this topic and some kind of, you know, giggle when you bring it up.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:13:00.8-00:13:12.2", "bk": 780, "text": "Senator Marco Rubio argues that the historical stigma surrounding Unidentified Aerial Phenomena (UAP) should not prevent serious investigation and analysis of fundamental questions about the phenomenon.", "att": "", "type": "opinion", "cat": "domain", "spk": "Rubio, Marco", "quote": "But I don't think we can allow the stigma to keep us from having an answer to a very fundamental question.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:13:12.2-00:13:25.9", "bk": 792, "text": "Senator Marco Rubio calls for the United States to take Unidentified Aerial Phenomena (UAP) seriously and establish a systematic process to analyse incoming data continuously until answers are found.", "att": "", "type": "opinion", "cat": "domain", "spk": "Rubio, Marco", "quote": "I want us to take it seriously and have a process to take it seriously. I want us to have a process to analyze the data. every time it comes in, that there be a place where this is cataloged and constantly analyzed until we get some answers.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:13:25.9-00:13:28.3", "bk": 804, "text": "Senator Marco Rubio acknowledges uncertainty about whether the explanation for Unidentified Aerial Phenomena (UAP) will be simple or complex.", "att": "", "type": "opinion", "cat": "domain", "spk": "Rubio, Marco", "quote": "Maybe it has a very simple answer. Maybe it doesn't.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:13:35.4-00:13:37.3", "bk": 812, "text": "Alex Dietrich expresses a sense of vulnerability regarding the lack of defensive capabilities against the observed Unidentified Aerial Phenomena (UAP) during the USS Nimitz Carrier Strike Group encounter.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Dietrich, Alex", "quote": "I felt the vulnerability of not having anything to defend ourselves.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "USS Nimitz Carrier Strike Group UAP encounter", "type": "event"}]}, {"loc": "00:00:09.1-00:00:14.9", "bk": 8, "text": "The Pentagon has admitted the existence of something unidentified in the skies following decades of public denial.", "att": "", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "It's the story of the U.S. government's grudging acknowledgement of Unidentified Aerial Phenomena, UAP, more commonly known as ufos after decades of public denial the pentagon now admits there's something out there", "refs": [{"name": "United States Department of Defense (DoD)", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:01:50.3-00:02:01.6", "bk": 108, "text": "Advanced Aerospace Threat Identification Program (AATIP) was a $22 million programme and was sponsored by then United States Senate Majority Leader Harry Reid.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "Buried away in the Pentagon, AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Reid, Harry", "type": "person"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "Unidentified Aerial Phenomena (UAP) technology is characterised as being capable of performing 600 to 700 G-force manoeuvres, flying at approximately 21,000 kilometres per hour, evading radar, flying through air and water and possibly space, having no obvious signs of propulsion, no wings, no control surfaces, and defying the natural effects of Earth's gravity.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Luis Elizondo", "quote": "Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:05:21.6", "bk": 320, "text": "The wind conditions off the coast of Jacksonville, Florida in 2015 were approximately 220 kilometres per hour from the far west.", "att": "", "type": "measurement", "cat": "domain", "spk": "", "quote": "The wind's 120 knots far west.", "refs": [{"name": "USA, Florida, Jacksonville", "type": "place"}, {"name": "Targeting camera footage, Jacksonville, Florida", "type": "event"}]}, {"loc": "00:06:40.8", "bk": 400, "text": "David Fravor is a commander of an F/A-18 squadron on the USS Nimitz.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "USS Nimitz", "type": "object"}, {"name": "F/A-18 Super Hornet", "type": "object"}, {"name": "Top Gun Naval Flight School", "type": "organisation"}]}, {"loc": "00:07:14.4-00:07:23.1", "bk": 432, "text": "In 2004, the USS Nimitz Carrier Strike Group was conducting training approximately 160 kilometres southwest of San Diego, California.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego.", "refs": [{"name": "USS Nimitz Carrier Strike Group UAP encounter", "type": "event"}, {"name": "USA, California, San Diego", "type": "place"}, {"name": "USS Nimitz", "type": "object"}]}, {"loc": "00:07:23.1-00:07:39.3", "bk": 440, "text": "During the USS Nimitz Carrier Strike Group encounter, the USS Princeton's advanced new radar detected what operators called multiple anomalous aerial vehicles over the horizon, descending approximately 24,000 metres in less than one second.", "att": "", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 80,000 feet in less than a second.", "refs": [{"name": "USS Nimitz Carrier Strike Group UAP encounter", "type": "event"}, {"name": "USS Princeton", "type": "object"}, {"name": "Radar contact event, USS Princeton, November 2004", "type": "event"}]}, {"loc": "00:07:39.3-00:07:47.8", "bk": 456, "text": "The aircrew consisting of David Fravor and Alex Dietrich, each with a weapons system officer in the backseat, were diverted to investigate anomalous aerial contacts on 2004-11-14.", "att": "", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "USS Nimitz Carrier Strike Group UAP encounter", "type": "event"}]}, {"loc": "00:07:47.8", "bk": 464, "text": "During the USS Nimitz Carrier Strike Group encounter, David Fravor and Alex Dietrich found an area of roiling white water approximately the size of a 737 aircraft in an otherwise calm blue sea.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "They found an area of roiling white water the size of a 737 in an otherwise calm blue sea.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "USS Nimitz Carrier Strike Group UAP encounter", "type": "event"}]}, {"loc": "00:07:55.9-00:08:09.7", "bk": 472, "text": "During the USS Nimitz Carrier Strike Group encounter, David Fravor and Alex Dietrich observed a small white tic-tac-shaped object moving above an area of roiling white water.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "David Fravor", "quote": "And we saw this little white tic-tac-looking object. And it's just kind of moving above the whitewater area.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "USS Nimitz Carrier Strike Group UAP encounter", "type": "event"}]}, {"loc": "00:08:17.9-00:08:24.5", "bk": 496, "text": "During the USS Nimitz Carrier Strike Group encounter, as David Fravor spiralled down towards the unidentified object, it turned abruptly and began mirroring his manoeuvres, climbing as he descended.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "David Fravor", "quote": "So as I'm coming down, it starts coming up. It goes and just turns abruptly and starts mirroring me.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "USS Nimitz Carrier Strike Group UAP encounter", "type": "event"}]}, {"loc": "00:09:03.5-00:09:04.2", "bk": 540, "text": "During the USS Nimitz Carrier Strike Group encounter, the weapons system officers in both aircraft observed the tic-tac object along with David Fravor and Alex Dietrich, with four aircrew members literally watching the object for roughly five minutes.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "David Fravor", "quote": "There was four of us in the airplanes literally watching this thing for roughly about five minutes.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "USS Nimitz Carrier Strike Group UAP encounter", "type": "event"}]}, {"loc": "00:09:08.9-00:09:14.4", "bk": 548, "text": "Seconds after David Fravor observed the tic-tac object disappear during the USS Nimitz Carrier Strike Group encounter, the USS Princeton reacquired the radar target approximately 96 kilometres away.", "att": "", "type": "observation", "cat": "domain", "spk": "Bill Whitaker", "quote": "Seconds later, the Princeton reacquired the target, 60 miles away.", "refs": [{"name": "USS Nimitz Carrier Strike Group UAP encounter", "type": "event"}, {"name": "USS Princeton", "type": "object"}]}, {"loc": "00:09:58.7-00:10:04.2", "bk": 596, "text": "The USS Nimitz Carrier Strike Group Unidentified Aerial Phenomena (UAP) encounter was not officially addressed or discussed for five years following the initial incident.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "Then, like the mysterious flying object, the Nimitz encounter disappeared. Nothing was said or done officially for five years until Lou Elizondo came across the story and investigated.", "refs": [{"name": "USS Nimitz Carrier Strike Group UAP encounter", "type": "event"}]}, {"loc": "00:10:13.2-00:10:25.3", "bk": 612, "text": "Luis Elizondo characterises the USS Nimitz encounter as compelling because trained, expensive pilots observed something they could not explain, and their observations were corroborated by forward-looking infrared (FLIR) camera footage (gun camera footage) and radar data.", "att": "", "type": "opinion", "cat": "domain", "spk": "Luis Elizondo", "quote": "We spend millions of dollars in training these pilots, and they are seeing something that they can't explain. Furthermore, that information's being backed up on electro-optical data, like gun camera footage, and by radar data. Now, to me, that's compelling.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "USS Nimitz Carrier Strike Group UAP encounter", "type": "event"}]}, {"loc": "00:10:57.5-00:11:04.3", "bk": 656, "text": "Christopher Mellon served as Deputy Assistant Secretary of Defence for Intelligence for United States Presidents Bill Clinton and George W. Bush, and had access to top-secret government programmes.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush, and had access to top-secret government programs.", "refs": [{"name": "Mellon, Christopher", "type": "person"}]}, {"loc": "00:12:07.2-00:12:15.6", "bk": 724, "text": "In August 2020 (or the previous August from the 2021 publication date), the United States Department of Defense (DoD) resurrected the Advanced Aerospace Threat Identification Program (AATIP) under a new name, the Unidentified Aerial Phenomena (UAP) Task Force.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "This past August, the Pentagon resurrected AATIP. It's now called the UAP Task Force.", "refs": [{"name": "United States Department of Defense (DoD)", "type": "organisation"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "UAP Task Force", "type": "project"}]}, {"loc": "00:12:34.0-00:12:46.3", "bk": 752, "text": "In December 2020, whilst serving as head of the United States Senate Select Committee on Intelligence, Senator Marco Rubio asked the Office of the Director of National Intelligence (ODNI) and the United States Department of Defense (DoD) to present Congress with an unclassified report on Unidentified Aerial Phenomena (UAP) by the following month.", "att": "", "type": "administrative", "cat": "domain", "spk": "Bill Whitaker", "quote": "This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "US Senate Select Committee on Intelligence", "type": "organisation"}, {"name": "Office of the Director of National Intelligence (ODNI)", "type": "organisation"}, {"name": "United States Department of Defense (DoD)", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}], "nodes_by_type": {"person": ["Elizondo, Luis", "Graves, Ryan", "Fravor, David", "Dietrich, Alex", "Mellon, Christopher", "Rubio, Marco", "Whitaker, Bill", "Reid, Harry"], "organisation": ["United States Navy", "United States Department of Defense (DoD)", "United States Senate", "US Senate Select Committee on Intelligence", "Office of the Director of National Intelligence (ODNI)", "Naval Air Systems Command (NAVAIR)", "Top Gun Naval Flight School", "The New York Times"], "project": ["Advanced Aerospace Threat Identification Program (AATIP)", "UAP Task Force", "Project Blue Book"], "event": ["USS Nimitz Carrier Strike Group UAP encounter", "Radar contact event, USS Princeton, November 2004", "F/A-18 squadron radar encounters, Virginia Beach area", "Targeting camera footage, Jacksonville, Florida"], "place": ["USA, California, San Diego", "USA, Virginia, Virginia Beach", "USA, Florida, Jacksonville", "USA, Nevada, Area 51"], "object": ["USS Nimitz", "USS Princeton", "F/A-18 Super Hornet"], "document": ["Navy UAP declassified video trilogy", "60 Minutes segment: Navy pilots describe encounters with UFOs", "Pentagon classified briefing on UAPs (December 2020 / January 2021)", "Director of National Intelligence report on UAPs"], "topic": ["Unidentified Aerial Phenomena (UAP)", "Anomalous Aerial Vehicle (AAV)", "Unidentified Flying Object (UFO)"]}, "n_claims": 94, "n_nodes": 37, "label": "4: assertion+node sweep"}, {"claims": [{"loc": "00:00:56.3-00:00:59.6", "bk": 56, "text": "The United States government has officially confirmed that Unidentified Aerial Phenomena (UAP) are real.", "att": "", "type": "administrative", "cat": "domain", "spk": "Elizondo, Luis", "quote": "The government has already stated for the record that they're real.", "refs": [{"name": "United States Department of Defense", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:01:02.4-00:01:11.5", "bk": 60, "text": "Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo Bay.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Afghanistan", "type": "place"}, {"name": "Middle East", "type": "place"}, {"name": "USA, Georgia, Guantanamo Bay", "type": "place"}]}, {"loc": "00:01:11.5-00:01:15.6", "bk": 68, "text": "Luis Elizondo joined the Advanced Aerospace Threat Identification Program (AATIP) in 2008.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "He hadn't given UFOs a second thought until 2008. That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:01:24.1-00:01:34.3", "bk": 84, "text": "The mission of the Advanced Aerospace Threat Identification Program (AATIP) was to collect and analyse information involving Anomalous Aerial Vehicles (AAV), also known as Unidentified Aerial Phenomena (UAP).", "att": "", "type": "administrative", "cat": "domain", "spk": "Elizondo, Luis", "quote": "The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs. We call them UAPs.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:01:50.3-00:02:01.6", "bk": 108, "text": "The Advanced Aerospace Threat Identification Program (AATIP) was part of a $22 million programme sponsored by then Senate Majority Leader Harry Reid to investigate UFOs.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "Buried away in the Pentagon, AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Reid, Harry", "type": "person"}]}, {"loc": "00:02:01.6-00:02:10.8", "bk": 120, "text": "Luis Elizondo took over the Advanced Aerospace Threat Identification Program (AATIP) in 2010.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "When Elizondo took over in 2010, he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "Hypothetical Anomalous Aerial Vehicle (AAV) technology can achieve 600 to 700 G-forces.", "att": "", "type": "measurement", "cat": "domain", "spk": "Elizondo, Luis", "quote": "Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity.", "refs": [{"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "Hypothetical Anomalous Aerial Vehicle (AAV) technology can fly at approximately 21,000 kilometres per hour.", "att": "", "type": "measurement", "cat": "domain", "spk": "Elizondo, Luis", "quote": "Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity.", "refs": [{"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "Hypothetical Anomalous Aerial Vehicle (AAV) technology can evade radar.", "att": "", "type": "observation", "cat": "domain", "spk": "Elizondo, Luis", "quote": "Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity.", "refs": [{"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "Hypothetical Anomalous Aerial Vehicle (AAV) technology can fly through air and water and possibly space.", "att": "", "type": "observation", "cat": "domain", "spk": "Elizondo, Luis", "quote": "Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity.", "refs": [{"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "Hypothetical Anomalous Aerial Vehicle (AAV) technology exhibits no obvious signs of propulsion.", "att": "", "type": "observation", "cat": "domain", "spk": "Elizondo, Luis", "quote": "Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity.", "refs": [{"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "Hypothetical Anomalous Aerial Vehicle (AAV) technology has no wings or control surfaces.", "att": "", "type": "observation", "cat": "domain", "spk": "Elizondo, Luis", "quote": "Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity.", "refs": [{"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:02:12.6-00:02:35.2", "bk": 132, "text": "Hypothetical Anomalous Aerial Vehicle (AAV) technology can defy the natural effects of Earth's gravity.", "att": "", "type": "observation", "cat": "domain", "spk": "Elizondo, Luis", "quote": "Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can deify the natural effects of Earth's gravity.", "refs": [{"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:02:37.0-00:02:47.7", "bk": 156, "text": "The Advanced Aerospace Threat Identification Program (AATIP) was a mix of scientists, electro-optical engineers, avionics specialists, and intelligence experts, often working part-time.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "Elizondo tells us AATIP was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:02:57.7-00:03:07.3", "bk": 176, "text": "A Navy aircrew captured video footage of a fast-moving object off the Atlantic coast in 2015 that the Pentagon cannot identify.", "att": "", "type": "observation", "cat": "domain", "spk": "", "quote": "A Navy aircrew struggles to lock onto a fast-moving object off the U.S. Atlantic coast in 2015.", "refs": [{"name": "United States Navy", "type": "organisation"}, {"name": "Atlantic Ocean", "type": "place"}, {"name": "Naval video footage from 2015 off Atlantic coast", "type": "document"}]}, {"loc": "00:03:07.3-00:03:20.4", "bk": 184, "text": "The Pentagon admits it does not know the identity of multiple Unidentified Aerial Phenomena (UAP) objects that have been documented.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "Recently released images may not convince UFO skeptics, but the Pentagon admits it doesn't know what in the world this is, or this, or this.", "refs": [{"name": "United States Department of Defense", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:03:22.3-00:03:38.6", "bk": 200, "text": "Some cases of reported Unidentified Aerial Phenomena (UAP) have simple explanations such as refracted light, weather balloons, rocket launches, or the planet Venus.", "att": "", "type": "observation", "cat": "domain", "spk": "Elizondo, Luis", "quote": "It's refracted light, weather balloons, a rocket being launched, Venus.", "refs": [{"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:03:30.4-00:03:38.6", "bk": 208, "text": "Some Unidentified Aerial Phenomena (UAP) sightings cannot be explained as simple refracted light, weather balloons, rocket launches, or the planet Venus.", "att": "", "type": "observation", "cat": "domain", "spk": "Elizondo, Luis", "quote": "In some cases, there are simple explanations for what people are witnessing, but there are some that that are not.", "refs": [{"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:03:44.3-00:03:48.2", "bk": 224, "text": "Luis Elizondo considered the possibility that observed Unidentified Aerial Phenomena (UAP) could be new types of cruise missile technology developed by China.", "att": "", "type": "opinion", "cat": "domain", "spk": "Elizondo, Luis", "quote": "Is it some sort of new type of cruise missile technology that China has developed?", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:03:48.2-00:03:52.6", "bk": 228, "text": "Luis Elizondo considered the possibility that observed Unidentified Aerial Phenomena (UAP) could be high-altitude balloons conducting reconnaissance.", "att": "", "type": "opinion", "cat": "domain", "spk": "Elizondo, Luis", "quote": "Is it some sort of high-altitude balloon that's conducting reconnaissance?", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:06.2-00:04:12.9", "bk": 244, "text": "Ryan Graves is a former United States Navy pilot who holds the rank of Lieutenant.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "Former Navy pilot Lieutenant Ryan Graves calls whatever is out there a security risk.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "United States Navy", "type": "organisation"}]}, {"loc": "00:04:06.2-00:04:12.9", "bk": 244, "text": "Ryan Graves considers unidentified aerial phenomena a security risk.", "att": "", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "Former Navy pilot Lieutenant Ryan Graves calls whatever is out there a security risk.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:12.9-00:04:29.7", "bk": 252, "text": "Ryan Graves' F/A-18 squadron began observing Unidentified Aerial Phenomena (UAP) hovering over restricted airspace southeast of Virginia Beach in 2014.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Graves, Ryan", "quote": "He told us his F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar, making it possible to zero in with infrared targeting cameras.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "F/A-18", "type": "object"}, {"name": "USA, Virginia, Virginia Beach", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:12.9-00:04:29.7", "bk": 252, "text": "When Ryan Graves' squadron updated their F/A-18 jet's radar, it became possible to detect Unidentified Aerial Phenomena (UAP) using infrared targeting cameras.", "att": "", "type": "observation", "cat": "domain", "spk": "Graves, Ryan", "quote": "when they updated their jet's radar, making it possible to zero in with infrared targeting cameras.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "F/A-18", "type": "object"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:29.7", "bk": 268, "text": "Ryan Graves' squadron observed Unidentified Aerial Phenomena (UAP) using both radar and infrared targeting camera detection.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Graves, Ryan", "quote": "So you're seeing it both with the radar and with the infrared, and that tells you that there is something out there.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:37.1", "bk": 276, "text": "The dual radar-and-infrared detection of Unidentified Aerial Phenomena (UAP) is difficult to spoof.", "att": "", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "Pretty hard to spoof that.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:38.6-00:04:48.2", "bk": 276, "text": "Images of Unidentified Aerial Phenomena (UAP) objects were captured in 2019 off the Atlantic coast in the same area where Ryan Graves' squadron had reported earlier sightings.", "att": "", "type": "observation", "cat": "domain", "spk": "", "quote": "These photographs were taken in 2019 in the same area. The Pentagon confirms these are images of objects it can't identify.", "refs": [{"name": "Atlantic Ocean", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Naval video footage from 2019 off Atlantic coast", "type": "document"}]}, {"loc": "00:04:43.0-00:04:48.2", "bk": 280, "text": "The Pentagon confirms it cannot identify images of Unidentified Aerial Phenomena (UAP) objects captured in 2019 off the Atlantic coast.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "The Pentagon confirms these are images of objects it can't identify.", "refs": [{"name": "United States Department of Defense", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:48.2-00:04:56.6", "bk": 288, "text": "Pilots training off the Atlantic coast observe Unidentified Aerial Phenomena (UAP) every day.", "att": "", "type": "observation", "cat": "domain", "spk": "Graves, Ryan", "quote": "Lieutenant Graves told us pilots training off the Atlantic coast see things like that all the time.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Atlantic Ocean", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:55.3-00:05:01.2", "bk": 292, "text": "Pilots training off the Atlantic coast have been observing Unidentified Aerial Phenomena (UAP) every day for at least a couple of years.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Graves, Ryan", "quote": "Every day. Every day for at least a couple of years.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Atlantic Ocean", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:05:01.2-00:05:02.5", "bk": 300, "text": "Ryan Graves observed no exhaust plume on Unidentified Aerial Phenomena (UAP) observed off the Atlantic coast.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Graves, Ryan", "quote": "You know, I don't see an exhaust plume.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Atlantic Ocean", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:05:04.3-00:05:12.8", "bk": 304, "text": "Members of Ryan Graves' squadron captured targeting-camera footage of a Unidentified Aerial Phenomena (UAP) off the coast of Jacksonville, Florida in 2015.", "att": "", "type": "observation", "cat": "domain", "spk": "", "quote": "including this one, off the coast of Jacksonville, Florida in 2015, captured on a targeting camera by members of Graves' squadron.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "USA, Florida, Jacksonville", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Naval targeting camera footage from Jacksonville, Florida 2015", "type": "document"}]}, {"loc": "00:05:35.8-00:05:42.5", "bk": 332, "text": "A Unidentified Aerial Phenomena (UAP) observed off Jacksonville, Florida in 2015 exhibited rotation.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Graves, Ryan", "quote": "You have rotation, you have high altitudes, you have propulsion, right?", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "USA, Florida, Jacksonville", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:05:35.8-00:05:42.5", "bk": 332, "text": "A Unidentified Aerial Phenomena (UAP) observed off Jacksonville, Florida in 2015 operated at high altitudes.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Graves, Ryan", "quote": "You have rotation, you have high altitudes, you have propulsion, right?", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "USA, Florida, Jacksonville", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:05:35.8-00:05:42.5", "bk": 332, "text": "A Unidentified Aerial Phenomena (UAP) observed off Jacksonville, Florida in 2015 exhibited signs of propulsion.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Graves, Ryan", "quote": "You have rotation, you have high altitudes, you have propulsion, right?", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "USA, Florida, Jacksonville", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:05:56.0", "bk": 356, "text": "Ryan Graves considers a threat-observation programme the highest-probability explanation for observed Unidentified Aerial Phenomena (UAP).", "att": "", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "I'd say, you know, the highest probability is it's a threat observation program.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:06:00.5-00:06:04.1", "bk": 360, "text": "Ryan Graves considers Russian or Chinese technology a possible explanation for observed Unidentified Aerial Phenomena (UAP).", "att": "", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "Bill Whitaker: Could it be Russian or Chinese technology? Ryan Graves: I don't see why not.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:06:07.0-00:06:08.8", "bk": 364, "text": "Ryan Graves is worried about the implications of Unidentified Aerial Phenomena (UAP) observed off the Atlantic coast.", "att": "", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "I am worried, frankly.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Atlantic Ocean", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:06:08.8-00:06:13.6", "bk": 368, "text": "If Unidentified Aerial Phenomena (UAP) observed off the Atlantic coast were tactical jets from another country, it would be considered a massive security issue.", "att": "", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "You know, if these were tactical jets from another country that were hanging out up there, it would be a massive issue.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Atlantic Ocean", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:06:13.6-00:06:18.5", "bk": 372, "text": "Ryan Graves considers it problematic that Unidentified Aerial Phenomena (UAP) are disregarded simply because they look different from conventional aircraft.", "att": "", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "But because it looks slightly different, we're not willing to actually look at the problem in the face.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:06:18.5", "bk": 376, "text": "Ryan Graves observes that Unidentified Aerial Phenomena (UAP) are watching on a daily basis.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Graves, Ryan", "quote": "We're happy to just ignore the fact that these are out there watching us every day.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:06:23.4-00:06:30.3", "bk": 380, "text": "The United States government closed its Project Blue Book investigation in 1969.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "The government has ignored it, at least publicly, since closing its Project Blue Book investigation in 1969.", "refs": [{"name": "United States Department of Defense", "type": "organisation"}, {"name": "Project Blue Book", "type": "project"}]}, {"loc": "00:06:23.4-00:06:40.8", "bk": 380, "text": "An incident involving Unidentified Aerial Phenomena (UAP) occurred off Southern California in 2004, documented by radar, camera, and four naval aviators.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "But that began to change after an incident off Southern California in 2004, which was documented by radar, by camera, and four naval aviators.", "refs": [{"name": "USA, California, Southern California", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}]}, {"loc": "00:06:40.8", "bk": 400, "text": "David Fravor is a graduate of the Top Gun Naval Flight School.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "We spoke to two of them, David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz, and flying at his wing, Lieutenant Alex Dietrich, who has never spoken publicly about the encounter.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Top Gun Naval Flight School", "type": "organisation"}]}, {"loc": "00:06:40.8", "bk": 400, "text": "David Fravor was commander of the F/A-18 squadron on the USS Nimitz during the 2004 encounter.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "We spoke to two of them, David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz, and flying at his wing, Lieutenant Alex Dietrich, who has never spoken publicly about the encounter.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "F/A-18", "type": "object"}, {"name": "USS Nimitz", "type": "object"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}]}, {"loc": "00:06:40.8", "bk": 400, "text": "Alex Dietrich holds the rank of Lieutenant in the United States Navy.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "We spoke to two of them, David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz, and flying at his wing, Lieutenant Alex Dietrich, who has never spoken publicly about the encounter.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "United States Navy", "type": "organisation"}]}, {"loc": "00:06:40.8", "bk": 400, "text": "Alex Dietrich had never spoken publicly about the 2004 USS Nimitz encounter before her interview.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "We spoke to two of them, David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz, and flying at his wing, Lieutenant Alex Dietrich, who has never spoken publicly about the encounter.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}]}, {"loc": "00:07:02.7-00:07:14.4", "bk": 420, "text": "Alex Dietrich participated in a government aircraft operation during the 2004 USS Nimitz encounter.", "att": "", "type": "testimony", "cat": "domain", "spk": "Dietrich, Alex", "quote": "Because I was in a government aircraft, because I was on the clock, and so I feel a responsibility to share what I can, and it is unclassified.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}]}, {"loc": "00:07:14.4-00:07:23.1", "bk": 432, "text": "During the 2004 USS Nimitz encounter, the USS Nimitz Carrier Strike Group was training approximately 160 kilometres southwest of San Diego in November 2004.", "att": "", "type": "observation", "cat": "domain", "spk": "", "quote": "It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego.", "refs": [{"name": "USS Nimitz", "type": "object"}, {"name": "Carrier Strike Group 11 (CSG-11)", "type": "organisation"}, {"name": "USA, California, San Diego", "type": "place"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}]}, {"loc": "00:07:23.1-00:07:39.3", "bk": 440, "text": "During the 2004 USS Nimitz encounter, the advanced radar on the USS Princeton detected multiple anomalous aerial vehicles over the horizon for a week.", "att": "", "type": "observation", "cat": "domain", "spk": "", "quote": "For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 80,000 feet in less than a second.", "refs": [{"name": "USS Princeton", "type": "object"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}]}, {"loc": "00:07:23.1-00:07:39.3", "bk": 440, "text": "During the 2004 USS Nimitz encounter, the USS Princeton radar detected anomalous aerial vehicles descending approximately 24,000 metres in less than one second.", "att": "", "type": "measurement", "cat": "domain", "spk": "", "quote": "For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 80,000 feet in less than a second.", "refs": [{"name": "USS Princeton", "type": "object"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}]}, {"loc": "00:07:39.3-00:07:47.8", "bk": 456, "text": "On 2004-11-14, David Fravor and Alex Dietrich, each with a weapons-system officer in the rear seat, were diverted to investigate anomalous aerial vehicles detected by the USS Princeton.", "att": "", "type": "observation", "cat": "domain", "spk": "", "quote": "On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}]}, {"loc": "00:07:47.8", "bk": 464, "text": "During the 2004 USS Nimitz encounter, David Fravor and Alex Dietrich found an area of roiling white water approximately the size of a Boeing 737 in otherwise calm ocean.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "", "quote": "They found an area of roiling white water the size of a 737 in an otherwise calm blue sea.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}]}, {"loc": "00:07:55.9-00:08:09.7", "bk": 472, "text": "During the 2004 USS Nimitz encounter, David Fravor observed a small white object resembling a Tic Tac sweet moving above the area of roiling white water.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "And we saw this little white tic-tac-looking object. And it's just kind of moving above the whitewater area.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}]}, {"loc": "00:08:17.9-00:08:20.2", "bk": 496, "text": "During the 2004 USS Nimitz encounter, the observed object was initially oriented north-south.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "The tic-tac's still pointing north-south.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}]}, {"loc": "00:08:20.2-00:08:24.5", "bk": 500, "text": "During the 2004 USS Nimitz encounter, the observed object turned abruptly and began mirroring David Fravor's aircraft movements.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "It goes and just turns abruptly and starts mirroring me. So as I'm coming down, it starts coming up.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}]}, {"loc": "00:08:28.9", "bk": 508, "text": "During the 2004 USS Nimitz encounter, David Fravor observed that the object was aware of his aircraft's presence.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "Yeah, it was aware we were there.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}]}, {"loc": "00:08:30.5", "bk": 508, "text": "During the 2004 USS Nimitz encounter, the observed object was approximately the size of David Fravor's F/A-18 aircraft.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "He said it was about the size of his F-18, with no markings, no wings, no exhaust plumes.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "F/A-18", "type": "object"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}]}, {"loc": "00:08:30.5", "bk": 508, "text": "During the 2004 USS Nimitz encounter, the observed object had no markings.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "He said it was about the size of his F-18, with no markings, no wings, no exhaust plumes.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}]}, {"loc": "00:08:30.5", "bk": 508, "text": "During the 2004 USS Nimitz encounter, the observed object had no wings.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "He said it was about the size of his F-18, with no markings, no wings, no exhaust plumes.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}]}, {"loc": "00:08:30.5", "bk": 508, "text": "During the 2004 USS Nimitz encounter, the observed object had no exhaust plumes.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "He said it was about the size of his F-18, with no markings, no wings, no exhaust plumes.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}]}, {"loc": "00:08:37.0-00:08:40.9", "bk": 516, "text": "During the 2004 USS Nimitz encounter, as David Fravor descended towards the object, the object climbed.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "And it's climbing still. And when it gets right in front of me, it just disappears.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}]}, {"loc": "00:08:40.9", "bk": 520, "text": "During the 2004 USS Nimitz encounter, the observed object disappeared when it reached a position directly in front of David Fravor's aircraft.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "And when it gets right in front of me, it just disappears.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}]}, {"loc": "00:08:47.8", "bk": 524, "text": "During the 2004 USS Nimitz encounter, the observed object disappeared by accelerating away at high speed.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "It had sped off.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}]}, {"loc": "00:08:50.9-00:08:58.3", "bk": 528, "text": "Alex Dietrich initially considered the possibility that the observed object during the 2004 USS Nimitz encounter might be a helicopter or drone.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Dietrich, Alex", "quote": "I'm going to categorize this as maybe a helicopter or maybe a drone.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}]}, {"loc": "00:09:03.3", "bk": 540, "text": "Both David Fravor and Alex Dietrich's weapons-system officers observed the object during the 2004 USS Nimitz encounter.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Dietrich, Alex", "quote": "Yeah.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}]}, {"loc": "00:09:03.5-00:09:08.9", "bk": 540, "text": "Four aviators in two aircraft observed the object during the 2004 USS Nimitz encounter for approximately five minutes.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "There was four of us in the airplanes literally watching this thing for roughly about five minutes.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}]}, {"loc": "00:09:08.9-00:09:14.4", "bk": 548, "text": "During the 2004 USS Nimitz encounter, the USS Princeton radar reacquired the object approximately 100 kilometres away seconds after it disappeared from David Fravor's visual contact.", "att": "", "type": "measurement", "cat": "domain", "spk": "", "quote": "Seconds later, the Princeton reacquired the target, 60 miles away.", "refs": [{"name": "USS Princeton", "type": "object"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}]}, {"loc": "00:09:14.4", "bk": 552, "text": "Another crew managed to briefly lock onto the object with a targeting camera during the 2004 USS Nimitz encounter before it accelerated away.", "att": "", "type": "observation", "cat": "domain", "spk": "", "quote": "Another crew managed to briefly lock onto it with a targeting camera before it zipped off again.", "refs": [{"name": "2004 USS Nimitz UAP Encounter", "type": "event"}]}, {"loc": "00:09:20.8-00:09:31.1", "bk": 560, "text": "Alex Dietrich considers that she would not have reported the 2004 USS Nimitz encounter if she had witnessed it alone due to how implausible the account sounds.", "att": "", "type": "opinion", "cat": "domain", "spk": "Dietrich, Alex", "quote": "You know, I think that over beers, we've sort of said, hey, man, if I saw this solo, I don't know that I would have come back and said anything because it sounds so crazy when I say it.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}]}, {"loc": "00:09:33.1-00:09:37.4", "bk": 572, "text": "David Fravor acknowledges that describing the 2004 USS Nimitz encounter can make him sound unreliable.", "att": "", "type": "opinion", "cat": "domain", "spk": "Fravor, David", "quote": "I've had some people tell me, you know, when you say that, you can sound crazy.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}]}, {"loc": "00:09:37.9-00:09:39.8", "bk": 576, "text": "David Fravor does not identify as someone interested in UFOs generally.", "att": "", "type": "opinion", "cat": "domain", "spk": "Fravor, David", "quote": "I'll be honest. I'm not a UFO guy.", "refs": [{"name": "Fravor, David", "type": "person"}]}, {"loc": "00:09:45.5-00:09:56.5", "bk": 584, "text": "David Fravor observed something during the 2004 USS Nimitz encounter that surpassed the capabilities of his F/A-18 aircraft.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Fravor, David", "quote": "Yes. There's definitely something that, I don't know who's building it, who's got the technology, who's got the brains, but there's something out there that was better than our airplane.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "F/A-18", "type": "object"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}]}, {"loc": "00:09:56.5-00:09:58.7", "bk": 596, "text": "The aircrew involved in the 2004 USS Nimitz encounter filed official reports.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "The air crew filed reports.", "refs": [{"name": "2004 USS Nimitz UAP Encounter", "type": "event"}]}, {"loc": "00:09:58.7-00:10:04.2", "bk": 596, "text": "Official action and public discussion regarding the 2004 USS Nimitz encounter did not occur for five years after the incident.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "Then, like the mysterious flying object, the Nimitz encounter disappeared. Nothing was said or done officially for five years until Lou Elizondo came across the story and investigated.", "refs": [{"name": "2004 USS Nimitz UAP Encounter", "type": "event"}, {"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:10:04.2", "bk": 604, "text": "Luis Elizondo investigated the 2004 USS Nimitz encounter.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "until Lou Elizondo came across the story and investigated.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}]}, {"loc": "00:10:13.2-00:10:27.7", "bk": 612, "text": "Luis Elizondo considers the combination of pilot training expenditure, visual observation, forward-looking infrared (FLIR) data, and radar data from the 2004 USS Nimitz encounter to be compelling evidence.", "att": "", "type": "opinion", "cat": "domain", "spk": "Elizondo, Luis", "quote": "We spend millions of dollars in training these pilots, and they are seeing something that they can't explain. Furthermore, that information's being backed up on electro-optical data, like gun camera footage, and by radar data. Now, to me, that's compelling.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}]}, {"loc": "00:10:27.7-00:10:31.7", "bk": 624, "text": "Luis Elizondo's findings regarding the 2004 USS Nimitz encounter were met with scepticism within the Pentagon.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "Inside the Pentagon, his findings were met with skepticism.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "United States Department of Defense", "type": "organisation"}, {"name": "2004 USS Nimitz UAP Encounter", "type": "event"}]}, {"loc": "00:10:31.7-00:10:39.5", "bk": 628, "text": "The Advanced Aerospace Threat Identification Program (AATIP) funding was eliminated in 2012.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "AATIP's funding was eliminated in 2012, but Elizondo says he and a handful of others kept the mission alive.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:10:31.7-00:10:39.5", "bk": 628, "text": "Luis Elizondo and a small group continued the mission of the Advanced Aerospace Threat Identification Program (AATIP) after its official funding was eliminated in 2012.", "att": "", "type": "administrative", "cat": "domain", "spk": "Elizondo, Luis", "quote": "but Elizondo says he and a handful of others kept the mission alive.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:10:39.5-00:10:48.8", "bk": 636, "text": "Luis Elizondo left the Pentagon in 2017.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "until finally, frustrated, he quit the Pentagon in 2017, but not before getting these three videos declassified.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "United States Department of Defense", "type": "organisation"}]}, {"loc": "00:10:39.5-00:10:48.8", "bk": 636, "text": "Luis Elizondo obtained declassification of three Navy videos before leaving the Pentagon in 2017.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "not before getting these three videos declassified.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "United States Navy", "type": "organisation"}, {"name": "Pentagon declassified Navy UAP videos", "type": "document"}]}, {"loc": "00:10:57.5-00:11:04.3", "bk": 656, "text": "Christopher Mellon served as Deputy Assistant Secretary of Defence for Intelligence under Presidents Clinton and George W. Bush.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush, and had access to top-secret government programs.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "United States Department of Defense", "type": "organisation"}]}, {"loc": "00:11:04.3", "bk": 664, "text": "Christopher Mellon had access to top-secret government programmes.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "and had access to top-secret government programs.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "United States Department of Defense", "type": "organisation"}]}, {"loc": "00:11:08.4-00:11:18.7", "bk": 668, "text": "Christopher Mellon is confident that observed Unidentified Aerial Phenomena (UAP) are not of United States origin, based on his knowledge of government processes and programmes.", "att": "", "type": "opinion", "cat": "domain", "spk": "Mellon, Christopher", "quote": "So it's not us, that's one thing we know.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:11:18.7-00:11:26.2", "bk": 676, "text": "Christopher Mellon grew concerned that no action was being taken regarding Unidentified Aerial Phenomena (UAP) within the government.", "att": "", "type": "opinion", "cat": "domain", "spk": "Mellon, Christopher", "quote": "Mellon says he grew concerned nothing was being done about UAPs, so he decided to do something.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:11:37.0-00:11:46.1", "bk": 696, "text": "Christopher Mellon considers it problematic that a former government official was required to leak classified information to the press to prioritise a national security issue.", "att": "", "type": "opinion", "cat": "domain", "spk": "Mellon, Christopher", "quote": "It's bizarre and unfortunate that someone like myself has to do something like that to get a national security issue like this on the agenda.", "refs": [{"name": "Mellon, Christopher", "type": "person"}]}, {"loc": "00:11:57.6-00:12:07.2", "bk": 716, "text": "Christopher Mellon and Luis Elizondo pursued public engagement with the Unidentified Aerial Phenomena (UAP) issue in order to generate public interest, which would then influence Congress and lead to action by the Department of Defence.", "att": "", "type": "opinion", "cat": "domain", "spk": "Mellon, Christopher", "quote": "We knew and understood that you had to go to the public, get the public interested to get Congress interested, to then circle back to the Defense Department and get them to start taking a look at it.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "United States Senate", "type": "organisation"}, {"name": "United States Department of Defense", "type": "organisation"}]}, {"loc": "00:12:07.2-00:12:15.6", "bk": 724, "text": "The Pentagon resurrected the Advanced Aerospace Threat Identification Program (AATIP) in August 2020 under a new name, the Unidentified Aerial Phenomena (UAP) Task Force.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "This past August, the Pentagon resurrected AATIP. It's now called the UAP Task Force.", "refs": [{"name": "United States Department of Defense", "type": "organisation"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "UAP Task Force", "type": "project"}]}, {"loc": "00:12:15.6-00:12:20.1", "bk": 732, "text": "United States military service members are now encouraged to report Unidentified Aerial Phenomena (UAP) encounters.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "Service members now are encouraged to report strange encounters.", "refs": [{"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:12:22.6", "bk": 740, "text": "Marco Rubio considers any object entering restricted United States airspace to be a national security threat.", "att": "", "type": "opinion", "cat": "domain", "spk": "Rubio, Marco", "quote": "Anything that enters an airspace that's not supposed to be there is a threat.", "refs": [{"name": "Rubio, Marco", "type": "person"}]}, {"loc": "00:12:26.5-00:12:34.0", "bk": 744, "text": "Senator Marco Rubio called for a detailed analysis of Unidentified Aerial Phenomena (UAP) after receiving classified briefings.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "After receiving classified briefings on UAPs, Senator Marco Rubio called for a detailed analysis.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:12:34.0-00:12:46.3", "bk": 752, "text": "In December 2020, Senator Marco Rubio, whilst heading the Senate Select Committee on Intelligence, requested that the Director of National Intelligence and the Pentagon present Congress with an unclassified report on Unidentified Aerial Phenomena (UAP) by the following month.", "att": "", "type": "administrative", "cat": "domain", "spk": "", "quote": "This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "United States Senate Select Committee on Intelligence", "type": "organisation"}, {"name": "Office of the Director of National Intelligence (ODNI)", "type": "organisation"}, {"name": "United States Department of Defense", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:12:59.0-00:13:06.9", "bk": 776, "text": "There is a stigma on Capitol Hill regarding discussion of Unidentified Aerial Phenomena (UAP).", "att": "", "type": "observation", "cat": "domain", "spk": "Rubio, Marco", "quote": "You know, there's a stigma on Capitol Hill. I mean, some of my colleagues are very interested in this topic and some kind of, you know, giggle when you bring it up.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:13:00.8-00:13:12.2", "bk": 780, "text": "Marco Rubio argues that the stigma surrounding Unidentified Aerial Phenomena (UAP) should not prevent serious investigation.", "att": "", "type": "opinion", "cat": "domain", "spk": "Rubio, Marco", "quote": "But I don't think we can allow the stigma to keep us from having an answer to a very fundamental question.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:13:17.3-00:13:25.9", "bk": 796, "text": "Marco Rubio calls for a systematic process to analyse Unidentified Aerial Phenomena (UAP) data and maintain a catalogue of observations.", "att": "", "type": "opinion", "cat": "domain", "spk": "Rubio, Marco", "quote": "I want us to have a process to analyze the data. every time it comes in, that there be a place where this is cataloged and constantly analyzed until we get some answers.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:13:37.3", "bk": 816, "text": "Alex Dietrich experienced a sense of vulnerability regarding the lack of defensive capabilities against observed Unidentified Aerial Phenomena (UAP).", "att": "", "type": "opinion", "cat": "domain", "spk": "Dietrich, Alex", "quote": "I felt the vulnerability of not having anything to defend ourselves.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}], "nodes_by_type": {"organisation": ["60 Minutes", "United States Navy", "United States Department of Defense", "United States Senate", "United States Senate Select Committee on Intelligence", "Office of the Director of National Intelligence (ODNI)", "Top Gun Naval Flight School", "The New York Times", "History Channel", "Carrier Strike Group 11 (CSG-11)", "Strike Fighter Squadron 41 (VFA-41)"], "person": ["Whitaker, Bill", "Elizondo, Luis", "Graves, Ryan", "Fravor, David", "Dietrich, Alex", "Mellon, Christopher", "Rubio, Marco", "Reid, Harry"], "project": ["Advanced Aerospace Threat Identification Program (AATIP)", "UAP Task Force", "Project Blue Book"], "object": ["USS Nimitz", "USS Princeton", "F/A-18"], "place": ["USA, California, San Diego", "USA, Virginia, Virginia Beach", "USA, Florida, Jacksonville", "USA, California, Southern California", "USA, Georgia, Guantanamo Bay", "Afghanistan", "Middle East", "Atlantic Ocean"], "event": ["2004 USS Nimitz UAP Encounter"], "topic": ["Unidentified Aerial Phenomena (UAP)", "Anomalous Aerial Vehicle (AAV)"], "document": ["Naval video footage from 2015 off Atlantic coast", "Naval video footage from 2019 off Atlantic coast", "Naval targeting camera footage from Jacksonville, Florida 2015", "Pentagon declassified Navy UAP videos"]}, "n_claims": 97, "n_nodes": 40, "label": "5: haiku hard rules (FINAL)"}], "sonnet": [{"claims": [{"loc": "00:00:07.6", "bk": 4, "text": "In '60 Minutes', Bill Whitaker states that the U.S. government has made a grudging acknowledgement of Unidentified Aerial Phenomena (UAP), more commonly known as UFOs, after decades of public denial.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "It's the story of the U.S. government's grudging acknowledgement of Unidentified Aerial Phenomena, UAP, more commonly known as ufos after decades of public denial", "refs": [{"name": "Navy pilots describe encounters with UFOs", "type": "document"}, {"name": "US Department of Defense (DoD)", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "60 Minutes", "type": "document"}]}, {"loc": "00:00:09.1", "bk": 8, "text": "The Pentagon admits there is something unidentified in U.S. airspace.", "att": "second_hand", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "the pentagon now admits there's something out there", "refs": [{"name": "US Department of Defense (DoD)", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:00:14.9", "bk": 12, "text": "The US Senate wants to know what the unidentified aerial phenomena (UAP) are, and the US Senate Select Committee on Intelligence has ordered the Director of National Intelligence and the Secretary of Defense to deliver a report on the mysterious sightings by June 2021.", "att": "second_hand", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "the u.s senate wants to know what it is the intelligence committee has ordered the director of national intelligence and the secretary of defense to deliver a report on the mysterious sightings by next month", "refs": [{"name": "US Senate Select Committee on Intelligence", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:00:54.6", "bk": 52, "text": "The U.S. government has officially stated for the record that UAPs (Unidentified Aerial Phenomena) are real.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "The government has already stated for the record that they're real. I'm not telling you that. The United States government is telling you that.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:01:02.4", "bk": 60, "text": "Luis Elizondo spent 20 years running military intelligence operations worldwide, including in Afghanistan, the Middle East, and Guantanamo.", "att": "second_hand", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo.", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:01:11.5", "bk": 68, "text": "Luis Elizondo had not given UFOs a second thought until 2008.", "att": "second_hand", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "He hadn't given UFOs a second thought until 2008.", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:01:15.6", "bk": 72, "text": "In 2008, Luis Elizondo was asked to join the Advanced Aerospace Threat Identification Program (AATIP) at the Pentagon.", "att": "second_hand", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:01:24.1", "bk": 84, "text": "The mission of the Advanced Aerospace Threat Identification Program (AATIP) was to collect and analyze information involving anomalous aerial vehicles (AAVs), commonly called UFOs or UAPs.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs. We call them UAPs.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:01:50.3", "bk": 108, "text": "The Advanced Aerospace Threat Identification Program (AATIP) was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs.", "att": "second_hand", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Buried away in the Pentagon, AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Reid, Harry", "type": "person"}]}, {"loc": "00:02:01.6", "bk": 120, "text": "Luis Elizondo took over the Advanced Aerospace Threat Identification Program (AATIP) in 2010 and focused on the national security implications of UAPs documented by U.S. service members.", "att": "second_hand", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "When Elizondo took over in 2010, he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:02:12.6", "bk": 132, "text": "Luis Elizondo described observed UAP technology as capable of 600 to 700 G-forces, flying at approximately 20,900 kilometres per hour (13,000 miles per hour), evading radar, flying through air and water and possibly space, with no obvious signs of propulsion, no wings, no control surfaces, and the ability to defy Earth's gravity.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:02:37.0", "bk": 156, "text": "The Advanced Aerospace Threat Identification Program (AATIP) was a loose-knit mix of scientists, electro-optical engineers, avionics experts, and intelligence experts, often working part-time.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Elizondo tells us AATIP was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:02:51.7", "bk": 168, "text": "A US Navy aircrew recorded video of a fast-moving unidentified object off the U.S. Atlantic coast in 2015.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "A Navy aircrew struggles to lock onto a fast-moving object off the U.S. Atlantic coast in 2015.", "refs": [{"name": "US Navy", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "UAP Sighting off Jacksonville Florida 2015", "type": "event"}]}, {"loc": "00:03:07.3", "bk": 184, "text": "The Pentagon admits it cannot identify objects seen in recently re
