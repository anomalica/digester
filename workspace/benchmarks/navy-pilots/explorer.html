leased UAP images.", "att": "second_hand", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Recently released images may not convince UFO skeptics, but the Pentagon admits it doesn't know what in the world this is", "refs": [{"name": "US Department of Defense (DoD)", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:06.2", "bk": 244, "text": "Ryan Graves holds the rank of Lieutenant and is a former US Navy pilot.", "att": "second_hand", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Former Navy pilot Lieutenant Ryan Graves calls whatever is out there a security risk.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "US Navy", "type": "organisation"}]}, {"loc": "00:04:06.2", "bk": 244, "text": "Ryan Graves considers UAPs (Unidentified Aerial Phenomena) hovering over restricted airspace to be a security risk.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Graves, Ryan", "quote": "Former Navy pilot Lieutenant Ryan Graves calls whatever is out there a security risk.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:12.9", "bk": 252, "text": "Ryan Graves' F/A-18 Hornet (F-18) squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014, after they updated their jets' radar, which made it possible to zero in with infrared targeting cameras.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Graves, Ryan", "quote": "He told us his F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar, making it possible to zero in with infrared targeting cameras.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "UAP Sightings off Virginia Beach 2014-2019", "type": "event"}, {"name": "USA, Virginia, Virginia Beach", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:29.7", "bk": 268, "text": "UAPs observed by Ryan Graves' squadron were detected simultaneously by radar and infrared targeting camera.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Graves, Ryan", "quote": "So you're seeing it both with the radar and with the infrared, and that tells you that there is something out there.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "UAP Sightings off Virginia Beach 2014-2019", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:38.6", "bk": 276, "text": "Photographs of UAPs were taken in 2019 in the restricted airspace area southeast of Virginia Beach.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "These photographs were taken in 2019 in the same area.", "refs": [{"name": "UAP Sightings off Virginia Beach 2014-2019", "type": "event"}, {"name": "USA, Virginia, Virginia Beach", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:43.0", "bk": 280, "text": "The Pentagon confirmed that photographs taken in 2019 near Virginia Beach show objects it cannot identify.", "att": "second_hand", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "The Pentagon confirms these are images of objects it can't identify.", "refs": [{"name": "US Department of Defense (DoD)", "type": "organisation"}, {"name": "UAP Sightings off Virginia Beach 2014-2019", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:48.2", "bk": 288, "text": "Pilots training off the Atlantic coast saw UAPs every day for at least a couple of years.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Graves, Ryan", "quote": "pilots training off the Atlantic coast see things like that all the time... Every day. Every day for at least a couple of years.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "UAP Sightings off Virginia Beach 2014-2019", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:05:04.3", "bk": 304, "text": "In 2015, a UAP sighting off the coast of Jacksonville, Florida was captured on a targeting camera by members of Ryan Graves' squadron.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "including this one, off the coast of Jacksonville, Florida in 2015, captured on a targeting camera by members of Graves' squadron.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "UAP Sighting off Jacksonville Florida 2015", "type": "event"}, {"name": "USA, Florida, Jacksonville", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:05:12.8", "bk": 312, "text": "During the UAP Sighting off Jacksonville Florida 2015, the object appeared to be rotating and moving against a 120-knot wind from the west.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "", "quote": "It's rotating... They're all going against the wind. The wind's 120 knots far west.", "refs": [{"name": "UAP Sighting off Jacksonville Florida 2015", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:05:35.8", "bk": 332, "text": "Ryan Graves assessed that the UAP captured off Jacksonville in 2015 displayed rotation, high altitudes, and some form of propulsion, but he could not identify what it was.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Graves, Ryan", "quote": "You have rotation, you have high altitudes, you have propulsion, right? I don't know. I don't know what it is, frankly.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "UAP Sighting off Jacksonville Florida 2015", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:05:44.9", "bk": 344, "text": "Pilots who witnessed UAPs speculated they were one of three things: secret U.S. technology, an adversary spy vehicle, or something otherworldly.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Graves, Ryan", "quote": "He told us pilots speculate they are one of three things, secret U.S. technology, an adversary spy vehicle, or something otherworldly.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:05:56.0", "bk": 356, "text": "Ryan Graves assessed the highest probability was that the observed UAPs were part of a threat observation program, possibly Russian or Chinese technology.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "I'd say, you know, the highest probability is it's a threat observation program... I don't see why not.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:06:07.0", "bk": 364, "text": "Ryan Graves expressed that he is worried about the UAP presence, stating that if these were tactical jets from another country hovering in that airspace it would be considered a massive issue.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Graves, Ryan", "quote": "I am worried, frankly. You know, if these were tactical jets from another country that were hanging out up there, it would be a massive issue. But because it looks slightly different, we're not willing to actually look at the problem in the face.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:06:23.4", "bk": 380, "text": "The U.S. government publicly ignored UAPs after closing Project Blue Book in 1969.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "The government has ignored it, at least publicly, since closing its Project Blue Book investigation in 1969.", "refs": [{"name": "Project Blue Book", "type": "project"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:06:30.3", "bk": 388, "text": "Official U.S. government acknowledgement of UAPs began to change after the 2004 incident off Southern California (the Nimitz UAP Encounter 2004), which was documented by radar, camera, and four naval aviators.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "But that began to change after an incident off Southern California in 2004, which was documented by radar, by camera, and four naval aviators.", "refs": [{"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "USA, California, Southern California", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:06:40.8", "bk": 400, "text": "David Fravor is a graduate of the Top Gun Naval Flight School.", "att": "second_hand", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "David Fravor, a graduate of the Top Gun Naval Flight School", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Top Gun Naval Flight School", "type": "organisation"}]}, {"loc": "00:06:40.8", "bk": 400, "text": "David Fravor was commander of the F/A-18 Hornet (F-18) squadron on the USS Nimitz at the time of the Nimitz UAP Encounter 2004.", "att": "second_hand", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "commander of the F-18 squadron on the USS Nimitz", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "USS Nimitz", "type": "object"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}]}, {"loc": "00:06:40.8", "bk": 400, "text": "Alex Dietrich was flying as David Fravor's wingman during the Nimitz UAP Encounter 2004.", "att": "second_hand", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "and flying at his wing, Lieutenant Alex Dietrich", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}]}, {"loc": "00:06:40.8", "bk": 400, "text": "Prior to the '60 Minutes' interview, Alex Dietrich had never spoken publicly about the Nimitz UAP Encounter 2004.", "att": "second_hand", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Lieutenant Alex Dietrich, who has never spoken publicly about the encounter.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "60 Minutes", "type": "document"}]}, {"loc": "00:07:02.7", "bk": 420, "text": "Alex Dietrich agreed to discuss the Nimitz UAP Encounter 2004 publicly because she was in a government aircraft and on duty, and the information is unclassified.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Dietrich, Alex", "quote": "Because I was in a government aircraft, because I was on the clock, and so I feel a responsibility to share what I can, and it is unclassified.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}]}, {"loc": "00:07:14.4", "bk": 432, "text": "During the Nimitz UAP Encounter 2004 in November 2004, the USS Nimitz Carrier Strike Group was training approximately 160 kilometres (100 miles) southwest of San Diego.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego.", "refs": [{"name": "USS Nimitz", "type": "object"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "USA, California, Southern California", "type": "place"}]}, {"loc": "00:07:23.1", "bk": 440, "text": "For a week before 2004-11-14, the advanced radar on the USS Princeton detected multiple anomalous aerial vehicles (AAVs) over the horizon, descending approximately 24,000 metres (80,000 feet) in less than a second.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 80,000 feet in less than a second.", "refs": [{"name": "USS Princeton", "type": "object"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:07:39.3", "bk": 456, "text": "On 2004-11-14, David Fravor and Alex Dietrich, each with a weapons system officer in the backseat, were diverted from training to investigate the anomalous aerial vehicles detected by the USS Princeton.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "USS Princeton", "type": "object"}]}, {"loc": "00:07:47.8", "bk": 464, "text": "During the Nimitz UAP Encounter 2004, the pilots found an area of roiling white water approximately the size of a Boeing 737 in an otherwise calm blue sea.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "They found an area of roiling white water the size of a 737 in an otherwise calm blue sea.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}]}, {"loc": "00:08:06.3", "bk": 484, "text": "During the Nimitz UAP Encounter 2004, David Fravor observed a small white tic-tac-shaped object moving above the white water area.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Fravor, David", "quote": "we saw this little white tic-tac-looking object. And it's just kind of moving above the whitewater area.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:08:17.9", "bk": 496, "text": "During the Nimitz UAP Encounter 2004, as David Fravor spiraled down toward the object, it abruptly mirrored his movements, ascending as he descended.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Fravor, David", "quote": "The tic-tac's still pointing north-south. It goes and just turns abruptly and starts mirroring me. So as I'm coming down, it starts coming up.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:08:28.9", "bk": 508, "text": "David Fravor assessed that the UAP was aware of the presence of the pilots during the Nimitz UAP Encounter 2004.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Fravor, David", "quote": "Yeah, it was aware we were there.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:08:30.5", "bk": 508, "text": "During the Nimitz UAP Encounter 2004, the observed object was approximately the size of an F/A-18 Hornet aircraft, with no markings, no wings, and no exhaust plumes.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Fravor, David", "quote": "He said it was about the size of his F-18, with no markings, no wings, no exhaust plumes.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:08:37.0", "bk": 516, "text": "During the Nimitz UAP Encounter 2004, when David Fravor closed in on the object, it abruptly disappeared.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Fravor, David", "quote": "And when it gets right in front of me, it just disappears... Disappears, like gone. It had sped off.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:09:03.5", "bk": 540, "text": "During the Nimitz UAP Encounter 2004, four crew members in two aircraft watched the UAP for approximately five minutes.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Fravor, David", "quote": "There was four of us in the airplanes literally watching this thing for roughly about five minutes.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:09:08.9", "bk": 548, "text": "Seconds after the UAP disappeared during the Nimitz UAP Encounter 2004, the USS Princeton reacquired the target approximately 97 kilometres (60 miles) away.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Seconds later, the Princeton reacquired the target, 60 miles away.", "refs": [{"name": "USS Princeton", "type": "object"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:09:14.4", "bk": 552, "text": "During the Nimitz UAP Encounter 2004, another crew briefly locked onto the UAP with a targeting camera before it sped off again.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Another crew managed to briefly lock onto it with a targeting camera before it zipped off again.", "refs": [{"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:09:56.5", "bk": 596, "text": "After the Nimitz UAP Encounter 2004, the air crew filed reports, but nothing was said or done officially about the encounter for five years.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "The air crew filed reports. Then, like the mysterious flying object, the Nimitz encounter disappeared. Nothing was said or done officially for five years", "refs": [{"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "USS Nimitz", "type": "object"}]}, {"loc": "00:10:04.2", "bk": 604, "text": "Luis Elizondo came across the Nimitz UAP Encounter 2004 story and investigated it approximately five years after the event, around 2009.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "until Lou Elizondo came across the story and investigated.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}]}, {"loc": "00:10:13.2", "bk": 612, "text": "Luis Elizondo argued that pilot UAP sightings are compelling because the pilots are extensively trained and their sightings are corroborated by electro-optical data such as gun camera footage and radar data.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "We spend millions of dollars in training these pilots, and they are seeing something that they can't explain. Furthermore, that information's being backed up on electro-optical data, like gun camera footage, and by radar data. Now, to me, that's compelling.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:10:27.7", "bk": 624, "text": "Inside the Pentagon, Luis Elizondo's findings from the Advanced Aerospace Threat Identification Program (AATIP) were met with skepticism.", "att": "second_hand", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Inside the Pentagon, his findings were met with skepticism.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "US Department of Defense (DoD)", "type": "organisation"}]}, {"loc": "00:10:31.7", "bk": 628, "text": "The Advanced Aerospace Threat Identification Program (AATIP)'s funding was eliminated in 2012.", "att": "second_hand", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "AATIP's funding was eliminated in 2012", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:10:31.7", "bk": 628, "text": "After AATIP's funding was eliminated in 2012, Luis Elizondo and a handful of others kept the mission alive until he quit the Pentagon in 2017.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "Elizondo says he and a handful of others kept the mission alive. until finally, frustrated, he quit the Pentagon in 2017", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:10:39.5", "bk": 636, "text": "Before quitting the Pentagon in 2017, Luis Elizondo arranged to have three UAP videos declassified.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "not before getting these three videos declassified", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "US Department of Defense (DoD)", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:10:51.9", "bk": 648, "text": "Christopher Mellon tried to help Luis Elizondo elevate the UAP issue within the Department of Defense and get it to the Secretary of Defense.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Mellon, Christopher", "quote": "I tried to help my colleague, Lou Elizondo, elevate the issue in the department and actually get it to the Secretary of Defense.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Elizondo, Luis", "type": "person"}, {"name": "US Department of Defense (DoD)", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:10:57.5", "bk": 656, "text": "Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence under Presidents Clinton and George W. Bush.", "att": "second_hand", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "US Department of Defense (DoD)", "type": "organisation"}]}, {"loc": "00:11:04.3", "bk": 664, "text": "Christopher Mellon had access to top-secret government programs during his time as Deputy Assistant Secretary of Defense for Intelligence.", "att": "second_hand", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "and had access to top-secret government programs.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "US Department of Defense (DoD)", "type": "organisation"}]}, {"loc": "00:11:08.4", "bk": 668, "text": "Christopher Mellon stated with a very high degree of confidence that the observed UAPs are not U.S.-made, based on his knowledge of positions held in the department and the associated processes.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Mellon, Christopher", "quote": "So it's not us, that's one thing we know... I could say that with a very high degree of confidence, in part because of the positions I held in the department, and I know the process.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "US Department of Defense (DoD)", "type": "organisation"}]}, {"loc": "00:11:18.7", "bk": 676, "text": "In 2017, as a private citizen, Christopher Mellon surreptitiously acquired the three declassified US Navy UAP videos and leaked them to The New York Times.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Mellon, Christopher", "quote": "In 2017, as a private citizen, he surreptitiously acquired the three Navy videos Elizondo had declassified and leaked them to The New York Times.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Elizondo, Luis", "type": "person"}, {"name": "The New York Times", "type": "organisation"}, {"name": "US Navy", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:11:57.6", "bk": 716, "text": "Christopher Mellon and Luis Elizondo's strategy was to go to the public to generate interest, which would pressure Congress to push the Department of Defense to take UAPs seriously.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Mellon, Christopher", "quote": "We knew and understood that you had to go to the public, get the public interested to get Congress interested, to then circle back to the Defense Department and get them to start taking a look at it.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Elizondo, Luis", "type": "person"}, {"name": "US Department of Defense (DoD)", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:12:09.1", "bk": 728, "text": "The Pentagon resurrected the Advanced Aerospace Threat Identification Program (AATIP) in August 2020, renaming it the UAP Task Force.", "att": "second_hand", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "This past August, the Pentagon resurrected AATIP. It's now called the UAP Task Force.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "UAP Task Force", "type": "organisation"}, {"name": "US Department of Defense (DoD)", "type": "organisation"}]}, {"loc": "00:12:15.6", "bk": 732, "text": "After the UAP Task Force was established, US military service members are now encouraged to report strange encounters.", "att": "second_hand", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Service members now are encouraged to report strange encounters.", "refs": [{"name": "UAP Task Force", "type": "organisation"}, {"name": "US Department of Defense (DoD)", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:12:22.6", "bk": 740, "text": "Marco Rubio stated that anything that enters airspace that is not supposed to be there is a threat.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Rubio, Marco", "quote": "Anything that enters an airspace that's not supposed to be there is a threat.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:12:26.5", "bk": 744, "text": "After receiving classified briefings on UAPs, Senator Marco Rubio called for a detailed analysis.", "att": "second_hand", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "After receiving classified briefings on UAPs, Senator Marco Rubio called for a detailed analysis.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "US Senate Select Committee on Intelligence", "type": "organisation"}]}, {"loc": "00:12:34.0", "bk": 752, "text": "In December 2020, while Marco Rubio was still head of the US Senate Select Committee on Intelligence, he asked the Director of National Intelligence and the Pentagon to present Congress with an unclassified UAP report by June 2021.", "att": "second_hand", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "US Senate Select Committee on Intelligence", "type": "organisation"}, {"name": "US Department of Defense (DoD)", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:12:59.0", "bk": 776, "text": "Marco Rubio noted that there is a stigma on Capitol Hill around UAPs, with some colleagues interested and others dismissive.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Rubio, Marco", "quote": "there's a stigma on Capitol Hill. I mean, some of my colleagues are very interested in this topic and some kind of, you know, giggle when you bring it up.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:13:14.1", "bk": 792, "text": "Marco Rubio called for UAPs to be taken seriously, with a systematic process to catalog and continuously analyze incoming data until answers are found.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Rubio, Marco", "quote": "I want us to take it seriously and have a process to take it seriously. I want us to have a process to analyze the data. every time it comes in, that there be a place where this is cataloged and constantly analyzed until we get some answers.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:13:37.3", "bk": 816, "text": "Alex Dietrich expressed feeling vulnerable during the Nimitz UAP Encounter 2004 due to having nothing to defend themselves with.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Dietrich, Alex", "quote": "I felt the vulnerability of not having anything to defend ourselves.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}]}, {"loc": "00:09:37.9", "bk": 576, "text": "David Fravor is not someone who previously believed in UFOs.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Fravor, David", "quote": "I'm not a UFO guy.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:09:45.5", "bk": 584, "text": "David Fravor assessed that the UAP observed in the Nimitz UAP Encounter 2004 was technologically superior to his own aircraft.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Fravor, David", "quote": "there's definitely something that, I don't know who's building it, who's got the technology, who's got the brains, but there's something out there that was better than our airplane.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}], "nodes_by_type": {"document": ["Navy pilots describe encounters with UFOs", "60 Minutes"], "person": ["Whitaker, Bill", "Elizondo, Luis", "Graves, Ryan", "Fravor, David", "Dietrich, Alex", "Mellon, Christopher", "Rubio, Marco", "Reid, Harry"], "project": ["Advanced Aerospace Threat Identification Program (AATIP)", "Project Blue Book"], "organisation": ["UAP Task Force", "US Senate Select Committee on Intelligence", "US Department of Defense (DoD)", "US Navy", "The New York Times", "History Channel", "Top Gun Naval Flight School"], "object": ["USS Nimitz", "USS Princeton"], "event": ["Nimitz UAP Encounter 2004", "UAP Sightings off Virginia Beach 2014-2019", "UAP Sighting off Jacksonville Florida 2015"], "place": ["USA, California, Southern California", "USA, Virginia, Virginia Beach", "USA, Florida, Jacksonville"], "topic": ["Unidentified Aerial Phenomena (UAP)"]}, "n_claims": 69, "n_nodes": 28, "label": "baseline"}, {"claims": [{"loc": "00:00:07.6", "bk": 4, "text": "In the segment 'Navy pilots describe encounters with UFOs (60 Minutes, 2021)', Bill Whitaker presents it as the story of the US government's grudging acknowledgement of Unidentified Aerial Phenomena (UAP), more commonly known as UFOs.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "It's the story of the U.S. government's grudging acknowledgement of Unidentified Aerial Phenomena, UAP, more commonly known as ufos", "refs": [{"name": "Navy pilots describe encounters with UFOs (60 Minutes, 2021)", "type": "document"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Whitaker, Bill", "type": "person"}]}, {"loc": "00:00:14.9", "bk": 12, "text": "After decades of public denial, the US Pentagon now admits there is something unidentified out there in the form of UAP.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "after decades of public denial the pentagon now admits there's something out there", "refs": [{"name": "US Pentagon", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:00:14.9", "bk": 12, "text": "The US Senate Intelligence Committee ordered the Director of National Intelligence and the Secretary of Defense to deliver a report on mysterious UAP sightings by June 2021.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "the intelligence committee has ordered the director of national intelligence and the secretary of defense to deliver a report on the mysterious sightings by next month", "refs": [{"name": "US Senate Intelligence Committee", "type": "organisation"}, {"name": "Office of the Director of National Intelligence (ODNI)", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:00:54.6", "bk": 52, "text": "Luis Elizondo stated that the US government has officially stated for the record that UAP are real.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "The government has already stated for the record that they're real. I'm not telling you that. The United States government is telling you that.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:01:02.4", "bk": 60, "text": "Luis Elizondo spent 20 years running military intelligence operations worldwide, including in Afghanistan, the Middle East, and Guantanamo.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Luis Elizondo spent 20 years running military intelligence operations worldwide in Afghanistan, the Middle East, and Guantanamo.", "refs": [{"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:01:11.5", "bk": 68, "text": "Luis Elizondo had not given UAP a second thought until 2008.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "He hadn't given UFOs a second thought until 2008.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:01:15.6", "bk": 72, "text": "In 2008, Luis Elizondo was asked to join the Advanced Aerospace Threat Identification Program (AATIP) at the US Pentagon.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "That's when he was asked to join something at the Pentagon called the Advanced Aerospace Threat Identification Program, or AATIP.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "US Pentagon", "type": "organisation"}]}, {"loc": "00:01:24.1", "bk": 84, "text": "The mission of the Advanced Aerospace Threat Identification Program (AATIP) was to collect and analyze information involving Anomalous Aerial Vehicles (AAV), commonly called UFOs or UAP.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "The mission of AATIP was quite simple. It was to collect and analyze information involving anomalous aerial vehicles, what I guess in the vernacular you call them UFOs. We call them UAPs.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:01:50.3", "bk": 108, "text": "The Advanced Aerospace Threat Identification Program (AATIP) was part of a $22 million program buried away in the US Pentagon.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Buried away in the Pentagon, AATIP was part of a $22 million program", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "US Pentagon", "type": "organisation"}]}, {"loc": "00:01:50.3", "bk": 108, "text": "The Advanced Aerospace Threat Identification Program (AATIP) was sponsored by then-Senate Majority Leader Harry Reid.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "AATIP was part of a $22 million program sponsored by then Senate Majority Leader Harry Reid to investigate UFOs.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Reid, Harry", "type": "person"}]}, {"loc": "00:02:01.6", "bk": 120, "text": "Luis Elizondo took over the Advanced Aerospace Threat Identification Program (AATIP) in 2010.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "When Elizondo took over in 2010", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:02:01.6", "bk": 120, "text": "After taking over AATIP in 2010, Luis Elizondo focused on the national security implications of UAP documented by US service members.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "he focused on the national security implications of unidentified aerial phenomena documented by U.S. service members.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:02:12.6", "bk": 132, "text": "Luis Elizondo described observed UAP capabilities as including: tolerating 600 to 700 G-forces, flying at approximately 20,900 kilometres per hour (13,000 miles per hour), evading radar, flying through air, water, and possibly space, with no obvious signs of propulsion, no wings, and no control surfaces, while defying Earth's gravity.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "Imagine a technology that can do 600 to 700 G-forces, that can fly at 13,000 miles an hour, that can evade radar, and that can fly through air and water and possibly space, and oh, by the way, has no obvious signs of propulsion, no wings, no control surfaces, and yet still can defy the natural effects of Earth's gravity.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:02:37.0", "bk": 156, "text": "The Advanced Aerospace Threat Identification Program (AATIP) was a loose-knit mix of scientists, electro-optical engineers, avionics experts, and intelligence experts, often working part-time.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Elizondo tells us AATIP was a loose-knit mix of scientists, electro-optical engineers, avionics, and intelligence experts, often working part-time.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Elizondo, Luis", "type": "person"}]}, {"loc": "00:02:47.7", "bk": 164, "text": "The AATIP team combed through data and records and analyzed UAP videos.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "They combed through data and records and analyzed videos like this.", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:02:57.7", "bk": 176, "text": "In 2015, a US Navy aircrew struggled to lock onto a fast-moving UAP object off the US Atlantic coast, captured on targeting camera.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "A Navy aircrew struggles to lock onto a fast-moving object off the U.S. Atlantic coast in 2015.", "refs": [{"name": "US Navy", "type": "organisation"}, {"name": "UAP Atlantic Coast Targeting Camera Footage 2015", "type": "document"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Infrared Targeting Camera", "type": "object"}]}, {"loc": "00:03:07.3", "bk": 184, "text": "The US Pentagon admits it cannot identify the UAP objects shown in recently released UAP videos.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "the Pentagon admits it doesn't know what in the world this is", "refs": [{"name": "US Pentagon", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "UAP Navy Videos Declassified (2017)", "type": "document"}]}, {"loc": "00:03:30.4", "bk": 208, "text": "Luis Elizondo acknowledged that in some cases there are simple explanations for UAP sightings, such as refracted light, weather balloons, or rockets, but that some cases remain unexplained after due diligence.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "In some cases, there are simple explanations for what people are witnessing, but there are some that that are not. We're not just simply jumping to a conclusion that's saying, oh, that's a UAP out there. We're going through our due diligence.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:03:44.3", "bk": 224, "text": "Luis Elizondo stated that AATIP investigated whether observed UAP could be a new type of cruise missile technology developed by China, or a high-altitude balloon conducting reconnaissance.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Elizondo, Luis", "quote": "Is it some sort of new type of cruise missile technology that China has developed? Is it some sort of high-altitude balloon that's conducting reconnaissance?", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:03:52.6", "bk": 232, "text": "Luis Elizondo stated that when all alternative explanations are exhausted and an unidentified object is confirmed as real and present in US airspace, the situation becomes compelling and problematic.", "att": "", "type": "opinion", "cat": "domain", "spk": "Elizondo, Luis", "quote": "Ultimately, when you have exhausted all those what-ifs and you're still left with the fact that this is in our airspace and it's real, that's when it becomes compelling and that's when it becomes problematic.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:06.2", "bk": 244, "text": "Ryan Graves is a former US Navy pilot with the rank of Lieutenant.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Former Navy pilot Lieutenant Ryan Graves", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "US Navy", "type": "organisation"}]}, {"loc": "00:04:06.2", "bk": 244, "text": "Ryan Graves considers UAP operating in restricted airspace to be a security risk.", "att": "", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "Former Navy pilot Lieutenant Ryan Graves calls whatever is out there a security risk.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "UAP Sightings off Atlantic Coast 2014-2015", "type": "event"}]}, {"loc": "00:04:12.9", "bk": 252, "text": "Ryan Graves' F/A-18 Super Hornet squadron began seeing UAP hovering over restricted airspace southeast of Virginia Beach in 2014 after they updated their jets' radar.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Whitaker, Bill", "quote": "his F-18 squadron began seeing UAPs hovering over restricted airspace southeast of Virginia Beach in 2014 when they updated their jet's radar", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "F/A-18 Super Hornet", "type": "object"}, {"name": "UAP Sightings off Atlantic Coast 2014-2015", "type": "event"}, {"name": "USA, Virginia, Virginia Beach (restricted airspace)", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:12.9", "bk": 252, "text": "The radar upgrade on Ryan Graves' squadron's jets made it possible to zero in on UAP with infrared targeting cameras.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "when they updated their jet's radar, making it possible to zero in with infrared targeting cameras.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "F/A-18 Super Hornet", "type": "object"}, {"name": "Infrared Targeting Camera", "type": "object"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:37.1", "bk": 276, "text": "Ryan Graves stated that UAP detections confirmed simultaneously by radar and infrared targeting camera are very difficult to spoof or dismiss as false contacts.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "Pretty hard to spoof that.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Infrared Targeting Camera", "type": "object"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:38.6", "bk": 276, "text": "UAP photographs taken in 2019 in restricted airspace off the Atlantic coast show objects the US Pentagon confirms it cannot identify.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "These photographs were taken in 2019 in the same area. The Pentagon confirms these are images of objects it can't identify.", "refs": [{"name": "UAP Photographs off Atlantic Coast 2019", "type": "document"}, {"name": "US Pentagon", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "USA, Virginia, Virginia Beach (restricted airspace)", "type": "place"}]}, {"loc": "00:04:48.2", "bk": 288, "text": "Ryan Graves told the 60 Minutes team that pilots training off the Atlantic coast see UAP every day.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Lieutenant Graves told us pilots training off the Atlantic coast see things like that all the time.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "60 Minutes", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:04:55.3", "bk": 292, "text": "Ryan Graves confirmed that UAP sightings by pilots training off the Atlantic coast occurred every day for at least a couple of years.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Graves, Ryan", "quote": "Every day. Every day for at least a couple of years.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "UAP Sightings off Atlantic Coast 2014-2015", "type": "event"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:05:02.5", "bk": 300, "text": "Ryan Graves noted that the observed UAP showed no visible exhaust plume.", "att": "first_hand", "type": "observation", "cat": "domain", "spk": "Graves, Ryan", "quote": "You know, I don't see an exhaust plume.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:05:04.3", "bk": 304, "text": "In 2015, a UAP was captured on a targeting camera off the coast of Jacksonville, Florida by members of Ryan Graves' squadron.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "including this one, off the coast of Jacksonville, Florida in 2015, captured on a targeting camera by members of Graves' squadron.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "UAP Atlantic Coast Targeting Camera Footage 2015", "type": "document"}, {"name": "USA, Florida, Jacksonville (offshore)", "type": "place"}, {"name": "Infrared Targeting Camera", "type": "object"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:05:12.8", "bk": 312, "text": "The UAP captured on targeting camera off Jacksonville in 2015 appeared to be rotating and moving against the wind, with the wind at approximately 222 kilometres per hour (120 knots) from the west.", "att": "", "type": "observation", "cat": "domain", "spk": "", "quote": "It's rotating... They're all going against the wind. The wind's 120 knots far west.", "refs": [{"name": "UAP Atlantic Coast Targeting Camera Footage 2015", "type": "document"}, {"name": "USA, Florida, Jacksonville (offshore)", "type": "place"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:05:35.8", "bk": 332, "text": "Ryan Graves stated that the UAP object captured on video off Jacksonville showed rotation, high altitude operation, and apparent propulsion, but he could not identify what it was.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Graves, Ryan", "quote": "You have rotation, you have high altitudes, you have propulsion, right? I don't know. I don't know what it is, frankly.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "UAP Atlantic Coast Targeting Camera Footage 2015", "type": "document"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:05:44.9", "bk": 344, "text": "Ryan Graves said pilots speculate observed UAP are one of three things: secret US technology, an adversary spy vehicle, or something otherworldly.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Whitaker, Bill", "quote": "He told us pilots speculate they are one of three things, secret U.S. technology, an adversary spy vehicle, or something otherworldly.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:05:56.0", "bk": 356, "text": "Ryan Graves assessed the highest probability explanation for the observed UAP to be a threat observation programme.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "I'd say, you know, the highest probability is it's a threat observation program.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:06:04.1", "bk": 364, "text": "Ryan Graves stated he could not rule out that the observed UAP are Russian or Chinese technology.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "I don't see why not.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:06:07.0", "bk": 364, "text": "Ryan Graves expressed alarm and worry about UAP operating in US airspace, stating that if the objects were tactical jets from another country, it would be considered a massive issue, but the unusual appearance of the UAP means the problem is being ignored.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Graves, Ryan", "quote": "I am worried, frankly. You know, if these were tactical jets from another country that were hanging out up there, it would be a massive issue. But because it looks slightly different, we're not willing to actually look at the problem in the face. We're happy to just ignore the fact that these are out there watching us every day.", "refs": [{"name": "Graves, Ryan", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "UAP Stigma in Government and Military", "type": "topic"}]}, {"loc": "00:06:23.4", "bk": 380, "text": "The US government publicly ignored UAP investigation after closing Project Blue Book in 1969.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "The government has ignored it, at least publicly, since closing its Project Blue Book investigation in 1969.", "refs": [{"name": "Project Blue Book", "type": "project"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:06:30.3", "bk": 388, "text": "The US government's public posture on UAP began to change after an incident off Southern California in 2004 that was documented by radar, camera, and four naval aviators.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "But that began to change after an incident off Southern California in 2004, which was documented by radar, by camera, and four naval aviators.", "refs": [{"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "USA, California, San Diego (offshore)", "type": "place"}, {"name": "US Navy", "type": "organisation"}]}, {"loc": "00:06:40.8", "bk": 400, "text": "David Fravor is a graduate of the Top Gun Naval Flight School.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "David Fravor, a graduate of the Top Gun Naval Flight School", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Top Gun Naval Flight School", "type": "organisation"}]}, {"loc": "00:06:40.8", "bk": 400, "text": "David Fravor was commander of the F/A-18 Super Hornet squadron on the USS Nimitz at the time of the 2004 encounter.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "David Fravor, a graduate of the Top Gun Naval Flight School and commander of the F-18 squadron on the USS Nimitz", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "F/A-18 Super Hornet", "type": "object"}, {"name": "USS Nimitz", "type": "object"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}]}, {"loc": "00:06:40.8", "bk": 400, "text": "Alex Dietrich was flying at David Fravor's wing during the Nimitz UAP Encounter 2004.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "flying at his wing, Lieutenant Alex Dietrich", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "F/A-18 Super Hornet", "type": "object"}]}, {"loc": "00:06:40.8", "bk": 400, "text": "Alex Dietrich had never spoken publicly about the Nimitz UAP Encounter 2004 before appearing on 60 Minutes in 2021.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Lieutenant Alex Dietrich, who has never spoken publicly about the encounter.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "60 Minutes", "type": "organisation"}]}, {"loc": "00:07:02.7", "bk": 420, "text": "Alex Dietrich chose to speak publicly about the Nimitz UAP Encounter 2004 on 60 Minutes because she was in a government aircraft on the clock and felt a responsibility to share what she could, noting the information is unclassified.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Dietrich, Alex", "quote": "Because I was in a government aircraft, because I was on the clock, and so I feel a responsibility to share what I can, and it is unclassified.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "60 Minutes", "type": "organisation"}]}, {"loc": "00:07:14.4", "bk": 432, "text": "In November 2004, the USS Nimitz Carrier Strike Group was training approximately 160 kilometres (100 miles) southwest of San Diego.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "It was November 2004, and the USS Nimitz Carrier Strike Group was training about 100 miles southwest of San Diego.", "refs": [{"name": "USS Nimitz Carrier Strike Group", "type": "organisation"}, {"name": "USS Nimitz", "type": "object"}, {"name": "USA, California, San Diego (offshore)", "type": "place"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}]}, {"loc": "00:07:23.1", "bk": 440, "text": "For a week before the Nimitz UAP Encounter 2004, the advanced radar on the USS Princeton detected multiple Anomalous Aerial Vehicles (AAV) over the horizon, descending approximately 24,000 metres (80,000 feet) in less than a second.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "For a week, the advanced new radar on a nearby ship, the USS Princeton, had detected what operators called multiple anomalous aerial vehicles over the horizon, descending 80,000 feet in less than a second.", "refs": [{"name": "USS Princeton", "type": "object"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}]}, {"loc": "00:07:39.3", "bk": 456, "text": "On 2004-11-14, David Fravor and Alex Dietrich, each with a weapons system officer in the backseat, were diverted from training to investigate UAP contacts detected by the USS Princeton.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "On November 14, Fravor and Dietrich, each with a weapons system officer in the backseat, were diverted to investigate.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "USS Princeton", "type": "object"}]}, {"loc": "00:07:47.8", "bk": 464, "text": "During the Nimitz UAP Encounter 2004, the aviators found an area of roiling white water approximately the size of a Boeing 737 in an otherwise calm blue sea.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "They found an area of roiling white water the size of a 737 in an otherwise calm blue sea.", "refs": [{"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}]}, {"loc": "00:07:55.9", "bk": 472, "text": "During the Nimitz UAP Encounter 2004, David Fravor observed a small white object described as 'tic-tac-looking' moving above the white water area.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Fravor, David", "quote": "we saw this little white tic-tac-looking object. And it's just kind of moving above the whitewater area.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:08:12.3", "bk": 492, "text": "During the Nimitz UAP Encounter 2004, while Alex Dietrich circled above, David Fravor descended in a spiral toward the UAP object for a closer look.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "As Dietrich circled above, Fravor went in for a closer look. Sort of spiraling down?", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}]}, {"loc": "00:08:18.5", "bk": 496, "text": "During the Nimitz UAP Encounter 2004, the UAP object abruptly turned and began mirroring David Fravor's aircraft movements as he descended toward it, ascending as he descended.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Fravor, David", "quote": "The tic-tac's still pointing north-south. It goes and just turns abruptly and starts mirroring me. So as I'm coming down, it starts coming up.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:08:28.9", "bk": 508, "text": "David Fravor assessed that the UAP object during the Nimitz encounter was aware that the aircraft were present.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Fravor, David", "quote": "Yeah, it was aware we were there.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:08:30.5", "bk": 508, "text": "David Fravor described the UAP object observed during the Nimitz UAP Encounter 2004 as approximately the size of his F/A-18 Super Hornet, with no markings, no wings, and no exhaust plumes.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Fravor, David", "quote": "He said it was about the size of his F-18, with no markings, no wings, no exhaust plumes.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}, {"name": "F/A-18 Super Hornet", "type": "object"}]}, {"loc": "00:08:37.0", "bk": 516, "text": "During the Nimitz UAP Encounter 2004, the UAP object disappeared from sight when David Fravor approached it closely, apparently accelerating away at high speed.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Fravor, David", "quote": "And when it gets right in front of me, it just disappears... Disappears, like gone. It had sped off.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:08:50.9", "bk": 528, "text": "Alex Dietrich recounted that after the UAP disappeared during the Nimitz UAP Encounter 2004, her mind tried to categorise it as a helicopter or drone.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Dietrich, Alex", "quote": "So your mind tries to make sense of it. I'm going to categorize this as maybe a helicopter or maybe a drone. And when it disappeared, I mean, it was just...", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:09:03.5", "bk": 540, "text": "All four crew members in the two aircraft \u2014 David Fravor, Alex Dietrich, and their respective weapons system officers \u2014 witnessed the UAP object during the Nimitz UAP Encounter 2004 for approximately five minutes.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Fravor, David", "quote": "There was four of us in the airplanes literally watching this thing for roughly about five minutes.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:09:08.9", "bk": 548, "text": "Seconds after the UAP disappeared from visual contact during the Nimitz UAP Encounter 2004, the USS Princeton reacquired the target approximately 97 kilometres (60 miles) away.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Seconds later, the Princeton reacquired the target, 60 miles away.", "refs": [{"name": "USS Princeton", "type": "object"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:09:14.4", "bk": 552, "text": "During the Nimitz UAP Encounter 2004, another crew briefly locked onto the UAP object with a targeting camera before it moved away again.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Another crew managed to briefly lock onto it with a targeting camera before it zipped off again.", "refs": [{"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Infrared Targeting Camera", "type": "object"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}]}, {"loc": "00:09:20.8", "bk": 560, "text": "Alex Dietrich reflected that if she had witnessed the UAP alone during the Nimitz UAP Encounter 2004, she might not have reported it because the account sounds so unbelievable.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Dietrich, Alex", "quote": "if I saw this solo, I don't know that I would have come back and said anything because it sounds so crazy when I say it.", "refs": [{"name": "Dietrich, Alex", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "UAP Stigma in Government and Military", "type": "topic"}]}, {"loc": "00:09:33.1", "bk": 572, "text": "David Fravor said he has been told by some people that his account of the Nimitz UAP Encounter 2004 sounds crazy, and acknowledged he is not a 'UFO person'.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Fravor, David", "quote": "I've had some people tell me, you know, when you say that, you can sound crazy. I'll be honest. I'm not a UFO guy.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "UAP Stigma in Government and Military", "type": "topic"}]}, {"loc": "00:09:45.5", "bk": 584, "text": "David Fravor stated that whatever he encountered during the Nimitz UAP Encounter 2004 was definitely real and was better than his aircraft, though he does not know who built it or who has the technology.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Fravor, David", "quote": "There's definitely something that, I don't know who's building it, who's got the technology, who's got the brains, but there's something out there that was better than our airplane.", "refs": [{"name": "Fravor, David", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Anomalous Aerial Vehicle (AAV)", "type": "topic"}, {"name": "F/A-18 Super Hornet", "type": "object"}]}, {"loc": "00:09:56.5", "bk": 596, "text": "The air crew filed reports following the Nimitz UAP Encounter 2004, but no official action was taken for five years.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "The air crew filed reports. Then, like the mysterious flying object, the Nimitz encounter disappeared. Nothing was said or done officially for five years", "refs": [{"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "USS Nimitz Carrier Strike Group", "type": "organisation"}]}, {"loc": "00:10:04.2", "bk": 604, "text": "Luis Elizondo came across the Nimitz UAP Encounter 2004 story approximately five years after it occurred and investigated it as part of his AATIP work.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "until Lou Elizondo came across the story and investigated.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Nimitz UAP Encounter 2004", "type": "event"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:10:13.2", "bk": 612, "text": "Luis Elizondo argued that the US spends millions of dollars training pilots whose UAP sightings are backed up by electro-optical data such as gun camera footage and radar data, which he considered compelling.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Elizondo, Luis", "quote": "We spend millions of dollars in training these pilots, and they are seeing something that they can't explain. Furthermore, that information's being backed up on electro-optical data, like gun camera footage, and by radar data. Now, to me, that's compelling.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "Infrared Targeting Camera", "type": "object"}]}, {"loc": "00:10:27.7", "bk": 624, "text": "Inside the US Pentagon, Luis Elizondo's AATIP findings were met with skepticism.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Inside the Pentagon, his findings were met with skepticism.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "US Pentagon", "type": "organisation"}]}, {"loc": "00:10:31.7", "bk": 628, "text": "The Advanced Aerospace Threat Identification Program's (AATIP) funding was eliminated in 2012.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "AATIP's funding was eliminated in 2012", "refs": [{"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:10:31.7", "bk": 628, "text": "Luis Elizondo stated that after AATIP's funding was eliminated in 2012, he and a handful of others kept the mission alive informally.", "att": "second_hand", "type": "testimony", "cat": "domain", "spk": "Whitaker, Bill", "quote": "but Elizondo says he and a handful of others kept the mission alive.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}]}, {"loc": "00:10:39.5", "bk": 636, "text": "Luis Elizondo resigned from the US Pentagon in 2017, frustrated with the lack of action on UAP, but before leaving he arranged for three UAP videos to be declassified.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "until finally, frustrated, he quit the Pentagon in 2017, but not before getting these three videos declassified.", "refs": [{"name": "Elizondo, Luis", "type": "person"}, {"name": "US Pentagon", "type": "organisation"}, {"name": "UAP Navy Videos Declassified (2017)", "type": "document"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:10:57.5", "bk": 656, "text": "Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence under Presidents Clinton and George W. Bush.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Christopher Mellon served as Deputy Assistant Secretary of Defense for Intelligence for Presidents Clinton and George W. Bush", "refs": [{"name": "Mellon, Christopher", "type": "person"}]}, {"loc": "00:11:04.3", "bk": 664, "text": "Christopher Mellon had access to top-secret government programs during his time as Deputy Assistant Secretary of Defense for Intelligence.", "att": "", "type": "administrative", "cat": "domain", "spk": "Whitaker, Bill", "quote": "and had access to top-secret government programs.", "refs": [{"name": "Mellon, Christopher", "type": "person"}]}, {"loc": "00:10:51.9", "bk": 648, "text": "Christopher Mellon tried to help Luis Elizondo elevate the UAP issue within the US Pentagon and get it to the Secretary of Defense.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Mellon, Christopher", "quote": "I tried to help my colleague, Lou Elizondo, elevate the issue in the department and actually get it to the Secretary of Defense.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Elizondo, Luis", "type": "person"}, {"name": "US Pentagon", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:11:08.4", "bk": 668, "text": "Christopher Mellon stated with a high degree of confidence that the observed UAP are not of US origin, based on the positions he held and his knowledge of US government processes.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Mellon, Christopher", "quote": "So it's not us, that's one thing we know... I could say that with a very high degree of confidence, in part because of the positions I held in the department, and I know the process.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:11:18.7", "bk": 676, "text": "Christopher Mellon grew concerned that nothing was being done about UAP and decided to take action.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Mellon says he grew concerned nothing was being done about UAPs, so he decided to do something.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:11:26.2", "bk": 684, "text": "In 2017, Christopher Mellon, acting as a private citizen, surreptitiously acquired the three declassified US Navy UAP videos that Luis Elizondo had declassified and leaked them to The New York Times.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Mellon, Christopher", "quote": "In 2017, as a private citizen, he surreptitiously acquired the three Navy videos Elizondo had declassified and leaked them to The New York Times.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "UAP Navy Videos Declassified (2017)", "type": "document"}, {"name": "Elizondo, Luis", "type": "person"}, {"name": "The New York Times", "type": "organisation"}, {"name": "US Navy", "type": "organisation"}]}, {"loc": "00:11:37.0", "bk": 696, "text": "Christopher Mellon expressed that it was bizarre and unfortunate that he had to leak the UAP videos as a private citizen to get a national security issue on the agenda.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Mellon, Christopher", "quote": "It's bizarre and unfortunate that someone like myself has to do something like that to get a national security issue like this on the agenda.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "UAP Navy Videos Declassified (2017)", "type": "document"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:11:57.6", "bk": 716, "text": "Christopher Mellon explained the strategy of going public with UAP information to generate public interest, thereby driving Congressional interest, and then circling back to the Defense Department to prompt action.", "att": "first_hand", "type": "testimony", "cat": "domain", "spk": "Mellon, Christopher", "quote": "We knew and understood that you had to go to the public, get the public interested to get Congress interested, to then circle back to the Defense Department and get them to start taking a look at it.", "refs": [{"name": "Mellon, Christopher", "type": "person"}, {"name": "Elizondo, Luis", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "US Pentagon", "type": "organisation"}]}, {"loc": "00:12:09.1", "bk": 728, "text": "The US Pentagon resurrected the Advanced Aerospace Threat Identification Program (AATIP) in August 2020, renaming it the UAP Task Force.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "This past August, the Pentagon resurrected AATIP. It's now called the UAP Task Force.", "refs": [{"name": "US Pentagon", "type": "organisation"}, {"name": "Advanced Aerospace Threat Identification Program (AATIP)", "type": "project"}, {"name": "UAP Task Force", "type": "organisation"}]}, {"loc": "00:12:15.6", "bk": 732, "text": "Following the establishment of the UAP Task Force, US service members are now encouraged to report strange UAP encounters.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "Service members now are encouraged to report strange encounters.", "refs": [{"name": "UAP Task Force", "type": "organisation"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "UAP Stigma in Government and Military", "type": "topic"}]}, {"loc": "00:12:22.6", "bk": 740, "text": "Marco Rubio stated that anything that enters an airspace that is not supposed to be there is a threat.", "att": "", "type": "opinion", "cat": "domain", "spk": "Rubio, Marco", "quote": "Anything that enters an airspace that's not supposed to be there is a threat.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}]}, {"loc": "00:12:26.5", "bk": 744, "text": "After receiving classified UAP briefings, Senator Marco Rubio called for a detailed analysis of UAP.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "After receiving classified briefings on UAPs, Senator Marco Rubio called for a detailed analysis.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "US Senate Intelligence Committee", "type": "organisation"}]}, {"loc": "00:12:34.0", "bk": 752, "text": "While Marco Rubio was still head of the US Senate Intelligence Committee, he asked the Office of the Director of National Intelligence (ODNI) and the US Pentagon to present Congress with an unclassified UAP report by June 2021.", "att": "", "type": "observation", "cat": "domain", "spk": "Whitaker, Bill", "quote": "This past December, while he was still head of the Intelligence Committee, he asked the Director of National Intelligence and the Pentagon to present Congress an unclassified report by next month.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "US Senate Intelligence Committee", "type": "organisation"}, {"name": "Office of the Director of National Intelligence (ODNI)", "type": "organisation"}, {"name": "US Pentagon", "type": "organisation"}, {"name": "Unclassified UAP Report to Congress 2021", "type": "document"}]}, {"loc": "00:12:59.0", "bk": 776, "text": "Marco Rubio acknowledged there is a stigma about UAP on Capitol Hill, with some colleagues giggling when the topic is raised, but argued the stigma should not prevent getting answers to a fundamental question.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Rubio, Marco", "quote": "there's a stigma on Capitol Hill. I mean, some of my colleagues are very interested in this topic and some kind of, you know, giggle when you bring it up. But I don't think we can allow the stigma to keep us from having an answer to a very fundamental question.", "refs": [{"name": "Rubio, Marco", "type": "person"}, {"name": "Unidentified Aerial Phenomena (UAP)", "type": "topic"}, {"name": "UAP Stigma in Government and Military", "type": "topic"}]}, {"loc": "00:13:14.1", "bk": 792, "text": "Marco Rubio stated he wants UAP to be taken seriously, with a systematic process for cataloguing and analysing UAP data every time it comes in until answers are obtained.", "att": "first_hand", "type": "opinion", "cat": "domain", "spk": "Rubio, Marco", "quote": "I want us to take it seriously and have a process to take it seriously. I want us to have a process to analyze the data. every time it comes in, that there be a place where this is cataloged and constantly analyzed until we get some answers.", "refs": [{"name": "Ru
