    - canonical: "electromagnetic propulsion"
      aliases: ["gravity wave propulsion"]
    - canonical: "space-time metric alteration"
      aliases: ["altering the space-time metric"]
    - canonical: "Hypotheses non fingo"
      aliases: ["I feign no hypotheses"]
    - canonical: "non-human intelligence"
      aliases: ["non-human intelligently manufactured technology", "non-human origin technology", "off-world technology"]
    - canonical: "UAP disclosure"
      aliases: ["disclosure"]  # kept per Mark's lean; the policy/theme as an idea
    - canonical: "Special Access Program"
      aliases: ["SAP", "special access programme"]  # the classification mechanism (concept); a specific SAP is a matter
    - canonical: "black projects"
      aliases: ["black world projects", "black world", "black world projects (classified, outside normal oversight)"]
      # Claude's contested calls for Mark's async review (NOT blocking; vetoable):
      #  - DROPPED as document-local ad-hoc theories (not recognised independent
      #    ideas): "test flight theory", "Nazi anti-gravity origins", "new Cold
      #    War technological deception". Defensible either way - flag if you want
      #    them as concepts.
