#                                  would be a document; the title is an org)
#   US patent law               -> NONE (not a node; insufficient to pin)
#   UAP reverse-engineering pgm  -> matter  (no name)            [in matter]
#   US anti-gravity research     -> matter  (cannot be an org)   [in matter]
#   crash-retrieval program      -> matter  (no name)            [in matter]
#   Pais Effect                  -> concept (decision 0025: a named claimed
#                                  phenomenon is a first-class concept) [in concept]
#   TTSA AEV "project"           -> matter  (ends in 'project');  [in matter]
#                                  the vehicle stays object
#   Coulthart's investigation    -> NONE (private one-person; else every
#                                  researcher's own investigation becomes a
#                                  matter - Mark's reasoning)
#   cosmic black-hole collision  -> event   (Mark)               [in event]
#   LIGO observatory-as-org      -> UNRESOLVED; defaulted to receivers-as-object
#                                  only. Revisit only if it recurs.
