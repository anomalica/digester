    - canonical: "anti-gravity propulsion"
      aliases: ["anti-gravity", "antigravity"]
    - canonical: "inertial mass reduction"
      aliases: []  # the *device* is an object, not this
    - canonical: "vacuum polarisation"
      aliases: ["vacuum energy polarisation"]
    - canonical: "quantum vacuum"
      aliases: ["quantum field fluctuations in the vacuum", "quantum field fluctuations"]
    - canonical: "zero-point energy"
      aliases: ["zero point energy"]
    - canonical: "superconductivity"
      aliases: ["zero electrical resistance"]
    - canonical: "room temperature superconductivity"
      aliases: ["holy grail of modern physics"]  # the *superconductor* is an object
    - canonical: "nuclear fusion"
