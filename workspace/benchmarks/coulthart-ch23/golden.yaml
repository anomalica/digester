      aliases: ["NAS Patuxent River", "Pax River", "Patuxent River naval base"]
      # REVIEW: the base IS the place; NAWCAD (org) is the separate actor node.
      # Text says "...on the Patuxent River in Maryland" - names the river, not
      # the base explicitly. Keep as the installation, flagged for Mark.

