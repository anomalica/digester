    - canonical: "Pais hybrid craft"
      aliases: ["hybrid craft", "Craft Using an Inertial Mass Reduction Device (the craft)", "inertial mass reduction craft",
        "Pais's proposed triangular hybrid spacecraft"]
      # KEPT: the text explicitly describes the proposed craft ("his proposed
      # craft", "a craft that can function as a submersible", "Pais's proposed
      # triangular hybrid spacecraft") - not pure inference. Distinct from the
      # patent document of the same name.
    - canonical: "LIGO receivers"
      aliases: ["LIGO detectors", "gravitational wave receivers"]
      # LIGO-the-observatory as a separate organisation node was unresolved;
      # defaulting to receivers-as-object only. Revisit if it recurs.
  # DROPPED (Mark): "1997 triangular craft" - not really an object, just a
  # cited video with a year; "triangular" isn't enough to identify a thing.

  # DOCUMENT NAMING (Mark): write the TYPE first (bibliography-style), then
  # enough specifics to identify a *particular* document. Old phrasings are
  # kept as aliases so matching still works.
  document:
    - canonical: "Patent: Pais - Room Temperature Superconductor"
      aliases: ["Pais patent: Room Temperature Superconductor", "Room Temperature Superconductor patent"]
    - canonical: "Patent: Pais - Electro-magnetic Forcefield Generator"
