      #    consistent with the SAP ruling (the *mechanism/category* is a concept;
      #    a *specific* programme is a matter).
      #  - "disclosure" kept per Mark's earlier lean despite being thematic.
      #  - "non-human intelligence" kept as the umbrella idea; the object-ish
      #    variants (bonded metal, off-world *vehicles*) reclassified to object.

# Things that appeared in model runs but are NOT graph entities - rhetorical
# analogies / illustrative comparisons (prompt rule 3: subject, not illustration).
# Any extraction matching one of these counts as a precision FALSE POSITIVE.
deny:
