  # PLACE RULE (Mark, 2026-05-19): a place is a named location specific and
  # durable enough that a person could go to it and still find it decades
  # later - a base, installation, ranch, named site, town or city. NOT
  # countries, states, oceans, operating areas, or the generic geographic
  # feature a facility is named after. When the text discusses a named
  # installation, the installation is the place (and may also be an
  # organisation if it acts) - do not degrade it to the river/hill/desert
  # in its name. Country-first naming is kept only for places that qualify.
  #
  # Dropped vs the first draft (failed the rule): USA, Louisiana, Washington,
  # Maryland (countries/states); Patuxent River (the river - wrong referent,
  # the base is the place); China, Russia (countries); London, Sydney
  # (incidental scene-setting, not what the text is about).
