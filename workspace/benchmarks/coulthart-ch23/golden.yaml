  # Concept = first-class ingestion node type (decision 0025).
  # CONCEPT must-find. Curated by Claude as critic from the 4-run union (107
  # raw -> ~21 genuine). Test applied: a recognised named idea/theory/
  # principle/phenomenon that exists independent of this document (you could
  # look it up). NOT: touchable (object), time-bound (event/matter), a
  # person/place/org, an effort people run (matter), patent-jargon, a claimed
  # capability, or a document-local ad-hoc theory. "X" = concept,
  # "X device/reactor/craft" = object. Synonyms merged to one node.
