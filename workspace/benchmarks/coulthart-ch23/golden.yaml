# Golden set for In Plain Sight, Chapter 23 ("Dr Salvatore Pais's Puzzling Patents").
#
# Hand-curated from the frozen input.md by reading the chapter in full and
# cross-checking against the union of four model runs (sonnet/opus x
# combined/per_type). This is the MEASURING STICK - it must be trustworthy,
# so it is conservative: an entity is only in the `must_find` list if it is
# unambiguously asserted in the text.
#
# Scoring (see ../runner.py):
#   recall    = (extracted that match a must_find) / (must_find count)
#   precision = 1 - (extracted that match a deny entry) / (total extracted)
# Names are matched alias-tolerant: an extraction matches a golden entity if
# its name equals the canonical OR any alias (case-insensitive, punctuation-
# and rank-stripped). This absorbs model phrasing variation.
#
# `review:` holds genuinely contested taxonomy calls (mostly spec ambiguities
# we already know about). Mark adjudicates these; once decided they move into
# the typed lists. They are NOT scored until adjudicated.

source: "In Plain Sight - Chapter 23: Dr Salvatore Pais's Puzzling Patents"
schema_note: >
  Person canonical names follow decision 0023 (plain legal name, no titles). Place canonical names follow the Country-first
  convention. Documents are individuated (rule 1: each named patent/paper is its own node). #magic___^_^___line
