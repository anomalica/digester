# Tolerance bands - a run outside these flags a regression in history.jsonl.
expected:
  recall_min: 0.85  # should find >=85% of must_find (alias-tolerant)
  precision_min: 0.90  # <=10% of extractions may be deny-list noise
  cost_usd_max: 2.00  # one chapter, all passes; ceiling not a target
  wall_seconds_max: 1200
