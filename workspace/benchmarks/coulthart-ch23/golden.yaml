      # Mark: call it an event (dated discrete occurrence) though it's off-domain
      # scene-setting. Kept per his decision.

  object:
    - canonical: "USS Nimitz"
      aliases: []  # Mark: fine; text doesn't say "aircraft carrier" but that's ok, may not be known here
    - canonical: "Tic Tac UAP"
