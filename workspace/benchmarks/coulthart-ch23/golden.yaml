    - canonical: "USA, California, China Lake"
      aliases: ["China Lake", "China Lake Naval Weapons Station"]
    - canonical: "USA, Nevada, Area 51"
      aliases: ["Area 51"]
    - canonical: "USA, New Mexico, Roswell"
