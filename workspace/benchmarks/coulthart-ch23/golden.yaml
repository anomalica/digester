    - "Three Gorges Dam"
    - "black holes"
    - "asteroid"
    - "conventional batteries"
    - "Anti-Ship Ballistic Missiles"
    - "Radar Evading Cruise Missiles"
    - "Main Battle Tanks"
    - "superconducting wire"
  matter:
    - "Detection of gravitational waves by LIGO"  # that's the event, not a matter
  concept:
    # Patent-jargon mechanisms the models wrongly minted as concepts - not
    # recognised independent ideas, just phrases lifted from Pais's patent text.
    - "non-linear scattering of RF and sonar signals"
    - "electromagnetic field-induced particle repulsion"
    - "vacuum/plasma bubble sheath"
    - "vacuum/plasma bubble propulsion"
    - "g-force effects on occupants"
    - "operability assertion"
    # Claimed capabilities / consequences, not concepts:
    - "asteroid deflection via electromagnetic forcefield"
    - "electricity grid transmission revolution"
    - "superconducting energy storage"
    - "impenetrable defensive shield"
    # Vague catch-alls:
    - "the big secret"
    - "the phenomenon"
    - "US patent law liberal standards"

