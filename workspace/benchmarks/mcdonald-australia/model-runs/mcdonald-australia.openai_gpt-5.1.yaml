    quote: |-
      Professor MacDonald recorded his talk in Sydney on a recent visit to Australia, New Zealand and Tasmania to investigate UFO sightings in this part of the world.
    text: |-
      Professor James E. McDonald recorded his talk in Sydney during a visit to Australia, New Zealand, and Tasmania to investigate Unidentified Flying Object sightings.
