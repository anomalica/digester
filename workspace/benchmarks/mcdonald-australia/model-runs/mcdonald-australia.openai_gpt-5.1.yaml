    quote: why I've been studying this problem of the Australian UFO sightings.
    text: |-
      During his visit, James E. McDonald was studying the problem of Australian Unidentified Flying Object sightings.
  - id: 04f6dd89-c469-4479-bb9b-ac17db41da74
    type: administrative
    attestation: first_hand
    speaker:
      id: 73e3056a-d9b9-42da-ae29-17fb3160308f
