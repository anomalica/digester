      - id: b4232569-a213-4cf2-ad04-9c422eee36b9
        name: Unidentified Flying Object (UFO)
    quote: |-
      but certainly as a scientist, I
      I'm not entirely happy with taking hearsay evidence.
    text: |-
      James E. McDonald stated that, as a scientist, he was not entirely satisfied with relying only on hearsay evidence from publications about Unidentified Flying Objects.
  - id: 6ab09a65-fdf7-4c93-ac99-c590b8a4270b
