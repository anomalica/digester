      It sort of seemed to be hovering.
      And then we saw another one, and that came up towards the first one, and they appeared to be having some sort of rendezvous.
      And then the second one moved off into the horizon, and the first one just stayed there stationary.
    text: |-
      Speaker 6 reported that during the February sighting, the first light appeared to stop and hover while a second light approached it and seemed to rendezvous before moving off to the horizon, leaving the first stationary.
