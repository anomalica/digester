      - id: 6cd05e71-9278-4948-a3b1-270a7ad67c88
        name: New Zealand, Waikato, Wairakei
      - id: e46394e6-e6d6-4f47-9b1f-bd3a3e6c26db
        name: Australia, Tasmania
      - id: 087a2e6d-cd07-4b16-8c81-1bc793223492
        name: USA, Arizona, Tucson
      - id: b4232569-a213-4cf2-ad04-9c422eee36b9
        name: Unidentified Flying Object (UFO)
    quote: |-
      The picture in Australia, with respect to UFO sightings,
      observations of unconventional objects maneuvering, sometimes quite close to ground, sometimes within tens to hundreds of feet of very credible, reliable observers, is just not appreciably different in Australia, New Zealand, and Tasmania from what it is in the States.
      Very strong similarity.
    text: |-
      James E. McDonald concluded that Unidentified Flying Object observations in Australia, New Zealand, and Tasmania involving unconventional objects manoeuvring, sometimes tens to hundreds of feet from reliable observers, are not appreciably different from those in the United States.
  - id: 75706395-ecfd-4820-8091-6fe31e9f5535
    type: opinion
    attestation: first_hand
    speaker:
      id: 73e3056a-d9b9-42da-ae29-17fb3160308f
