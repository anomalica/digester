        name: Unidentified Flying Object (UFO)
    quote: |-
      The thing I've been doing is taping.
      I have about 10,000 feet of tape, I noticed, when I wound this thing up.
      And I've interviewed about 70 Australians or New Zealanders.
    text: |-
      James E. McDonald tape-recorded about 10,000 feet of interviews with approximately 70 Australian and New Zealand Unidentified Flying Object witnesses.
  - id: 4c0cc5af-5a86-4fbe-b80c-f0d83b5a267b
