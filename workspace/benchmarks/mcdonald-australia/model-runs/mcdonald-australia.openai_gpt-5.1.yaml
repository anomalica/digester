        name: Unidentified Flying Object (UFO)
    quote: |-
      I've been down to Hobart, Tasmania, some extremely interesting cases in Tasmania.
    text: |-
      James E. McDonald travelled to Hobart, Tasmania, where he investigated what he described as extremely interesting Unidentified Flying Object cases.
  - id: 5f6d9588-4131-4360-86f0-58bf1672c324
    type: opinion
    attestation: first_hand
    speaker:
      id: 73e3056a-d9b9-42da-ae29-17fb3160308f
