      This is not at all unrepresentative of the kind of panic reaction that animals show.
      I think Jung would have some time explaining that.
    text: |-
      James E. McDonald stated that strong panic reactions from animals such as cattle, dogs, and horses in the presence of Unidentified Flying Objects, as described in the 1963 Mowie farm UFO encounter, are not unrepresentative of other cases.
  - id: 83d8eb27-c1ee-46fd-9919-525c2fdf207a
    type: administrative
    attestation: first_hand
    speaker:
      id: 73e3056a-d9b9-42da-ae29-17fb3160308f
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. MacDonald
    attribution_in_text: true
    location: 00:13:24.4-00:13:40.8
    refs:
      - id: 73e3056a-d9b9-42da-ae29-17fb3160308f
        name: James E. McDonald
      - id: 2205044a-8383-4110-a208-414abf152630
        name: Carl Gustav Jung
      - id: f0a46a0d-9710-41fa-8685-9d34f9aaa703
        name: psychological hypothesis of UFOs
      - id: 7fe14f15-7dad-435b-b60c-413e20d81d0a
        name: archetypal images (Jungian psychology)
      - id: b4232569-a213-4cf2-ad04-9c422eee36b9
        name: Unidentified Flying Object (UFO)
    quote: |-
      Oh, I've read the book, of course, Barry, and talked it over with quite a few psychologists back in the States.
      The main difficulty is Jung was not at all addressing himself to what is the real UFO problem.
      He is talking about psychotic types who have some kind of psychic needs to believe.
    text: |-
      James E. McDonald discussed Carl Gustav Jung's psychological interpretation of certain Unidentified Flying Object reports as psychic projections of archetypal images in psychotic individuals with a need to believe.
  - id: 81ed8c86-3eec-4ed4-8ee4-43a3dd7b8c7f
    type: opinion
    attestation: first_hand
    speaker:
      id: 73e3056a-d9b9-42da-ae29-17fb3160308f
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. MacDonald
    attribution_in_text: true
    location: 00:13:41.6-00:13:59.3
    refs:
      - id: 73e3056a-d9b9-42da-ae29-17fb3160308f
        name: James E. McDonald
      - id: 2205044a-8383-4110-a208-414abf152630
        name: Carl Gustav Jung
      - id: 76e4f06a-b121-4e2c-b156-d81fe478fe90
        name: UFO cultist fringe
      - id: f0a46a0d-9710-41fa-8685-9d34f9aaa703
        name: psychological hypothesis of UFOs
      - id: b4232569-a213-4cf2-ad04-9c422eee36b9
        name: Unidentified Flying Object (UFO)
    quote: |-
      And one does see this sort of thing emerging in the cult and crackpot fringe, which is unfortunately very visible, particularly in America, centered around the UFO problem.
      People who feel that there's a salvation message being brought from Venus and all that sort of rot.
      But this is not the UFO problem.
      This is just more of that old sort of thing.
      Jung was talking about this.
    text: |-
      James E. McDonald stated that Carl Gustav Jung focused on a cult and crackpot fringe around the Unidentified Flying Object problem, particularly in America, involving beliefs such as salvation messages from Venus.
  - id: c2848ce3-7f0c-4628-8177-b4ef2589ab54
    type: opinion
    attestation: first_hand
    speaker:
      id: 73e3056a-d9b9-42da-ae29-17fb3160308f
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. MacDonald
    attribution_in_text: true
    location: 00:14:12.0-00:14:35.7
    refs:
      - id: 73e3056a-d9b9-42da-ae29-17fb3160308f
        name: James E. McDonald
      - id: 2205044a-8383-4110-a208-414abf152630
        name: Carl Gustav Jung
      - id: 7fe14f15-7dad-435b-b60c-413e20d81d0a
        name: archetypal images (Jungian psychology)
      - id: f0a46a0d-9710-41fa-8685-9d34f9aaa703
        name: psychological hypothesis of UFOs
      - id: b4232569-a213-4cf2-ad04-9c422eee36b9
        name: Unidentified Flying Object (UFO)
    quote: |-
      There are lots of cases where animals are present, dogs, horses, cows, and so on.
      Jung says these are psychic projections of archetypal images, you know.
      Well, it poses the puzzling question, you see, Barry, that we have to make the assumption that canine, equine, feline, bovine archetypal images are identical with ours.
      At least it seems to me to pose that problem.
      If you think this is not a real phenomenon, then why does it stampede cattle?
    text: |-
      James E. McDonald argued that if Carl Gustav Jung's explanation of Unidentified Flying Objects as psychic projections of archetypal images were correct, one would have to assume that archetypal images in dogs, horses, cats, and cattle are identical to human archetypal images because animals also react strongly to Unidentified Flying Objects.
