        name: Unidentified Flying Object (UFO)
    quote: |-
      When you contrast that with the kind of press releases that are put out about the great expertise that's used, the thorough investigations, and the indication that there are only two or three percent of unknowns, and probably those would be explained, the Air Force insists, if they add a little more data.
      When you contrast the pronouncements, the assurances there's nothing to it, with the very low level at which it's actually been investigated, when you compare the official explanations with the details of the reports and then go back and check them yourself as I've done, you end up as I have ended up.
    text: |-
      James E. McDonald contrasted United States Air Force press releases claiming substantial expertise, thorough investigation, and only two to three percent unexplained Unidentified Flying Object cases with what he considered a very low actual investigative level.
