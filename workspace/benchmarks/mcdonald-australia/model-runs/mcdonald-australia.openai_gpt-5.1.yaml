        name: |-
          UFOs in Australia – Eyewitnesses Talk to Dr. James E. McDonald During His Investigative Tour (1967)
    quote: |-
      And I've been down here in Australia interviewing witnesses to find out for myself, in direct, face-to-face, or in some cases, phone interviewing, exactly what happened in individual cases and what the credibility of the witness is, how witnesses may be, how thoroughly the cases have been
      checked and so on down the line.
    text: |-
      In Australia, New Zealand, and Tasmania, James E. McDonald conducted face-to-face and telephone interviews with Unidentified Flying Object witnesses to assess what happened in individual cases, witness credibility, and how thoroughly cases had been checked.
  - id: b7e1a75d-ca3c-4830-b0a4-da480bd551b7
    type: opinion
    attestation: first_hand
    speaker:
      id: 73e3056a-d9b9-42da-ae29-17fb3160308f
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: false
    location: 00:29:00.2-00:29:29.6
    refs:
      - id: 73e3056a-d9b9-42da-ae29-17fb3160308f
        name: James E. McDonald
      - id: 1609ac68-0f5a-482d-b554-692007de4121
