        name: Unidentified Flying Object (UFO)
    quote: |-
      Again and again, in interviewing witnesses, you hear about these cases sometimes in a quite roundabout fashion, and then you ask the observer, well, were there any other witnesses?
      And a very common puzzlement arises then.
      The person says, well, no, that was one of the things that really bothered him.
      He would have thought that dozens of people must have seen it,
    text: |-
      James E. McDonald stated that in many witness interviews people report being puzzled that others did not also report seeing the same Unidentified Flying Objects despite there being many potential observers.
  - id: 3a469f9c-1461-42f3-8d20-cfa6ab142677
    type: opinion
    attestation: first_hand
    speaker:
      id: 73e3056a-d9b9-42da-ae29-17fb3160308f
