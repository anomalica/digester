        name: Unidentified Flying Object (UFO)
    quote: |-
      It comes to this, I've spent about 12-13 months in the States in interviewing witnesses in key cases, attempting to unravel this very puzzling and very intriguing mystery.
    text: |-
      James E. McDonald spent approximately 12 to 13 months in the United States interviewing witnesses in key Unidentified Flying Object cases in an effort to understand the problem.
  - id: 4446888b-a881-46e0-b876-ea223a8119a9
    type: administrative
    attestation: first_hand
    speaker:
      id: 73e3056a-d9b9-42da-ae29-17fb3160308f
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: false
    location: 00:28:03.1-00:28:18.4
    refs:
      - id: 73e3056a-d9b9-42da-ae29-17fb3160308f
        name: James E. McDonald
      - id: 1609ac68-0f5a-482d-b554-692007de4121
        name: Australia, Victoria, Melbourne
      - id: b4232569-a213-4cf2-ad04-9c422eee36b9
        name: Unidentified Flying Object (UFO)
    quote: |-
      Well, it turns out that there are large numbers of reports in the publications of various private UFO investigating groups in England, America, Australia, France, and so on, that quite clearly indicate that,
    text: |-
      James E. McDonald reported that many private Unidentified Flying Object investigating groups in England, America, Australia, France, and other countries have published large numbers of reports of similar sightings.
  - id: 4d2da99b-350b-44da-921f-84cd63d3db7a
