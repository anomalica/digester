      - id: b4232569-a213-4cf2-ad04-9c422eee36b9
        name: Unidentified Flying Object (UFO)
    quote: |-
      There's just a little bit of evidence that indicates to me there may even be a few more sightings per square mile or per capita here than in the States.
      But I wouldn't stand firmly on that feeling that I've gotten.
    text: |-
      James E. McDonald felt there was slight evidence that per capita or per square mile there might be more Unidentified Flying Object sightings in Australia, New Zealand, and Tasmania than in the United States, but he did not consider this conclusion firm.
  - id: daf22c88-a190-4e86-852a-e104f253027e
    type: hearsay
    attestation: first_hand
    speaker:
      id: 73e3056a-d9b9-42da-ae29-17fb3160308f
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: true
    location: 00:29:48.2-00:30:09.3
    refs:
      - id: 73e3056a-d9b9-42da-ae29-17fb3160308f
        name: James E. McDonald
      - id: b4232569-a213-4cf2-ad04-9c422eee36b9
        name: Unidentified Flying Object (UFO)
    quote: |-
      One thing I have noticed is that lots of witnesses, after 15 or 20 or 30 minutes of interviewing them, bring up the point that several other friends of theirs have also seen objects at close range.
      Sometimes I've been able to check these, sometimes I just put it aside as evidence that there are other reports.
    text: |-
      Many witnesses interviewed by James E. McDonald reported that several of their friends had also seen Unidentified Flying Objects at close range.
  - id: 98b4f0b4-8a02-45c7-aab9-726638a4680a
