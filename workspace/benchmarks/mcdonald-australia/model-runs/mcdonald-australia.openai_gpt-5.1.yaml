        name: Unidentified Flying Object (UFO)
    quote: |-
      There's a great deal of reluctance to report them.
      That's exactly the same in the States as it seems to be down here.
    text: |-
      James E. McDonald observed that there was great reluctance among Unidentified Flying Object witnesses in Australia, New Zealand, and Tasmania to report their sightings, similar to the situation in the United States.
  - id: 5e2c0c3a-bc37-4125-b22e-ac491e2b2a1d
    type: hearsay
    attestation: first_hand
    speaker:
      id: 73e3056a-d9b9-42da-ae29-17fb3160308f
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: true
    location: 00:30:47.4-00:30:56.7
    refs:
      - id: 73e3056a-d9b9-42da-ae29-17fb3160308f
        name: James E. McDonald
      - id: b4232569-a213-4cf2-ad04-9c422eee36b9
        name: Unidentified Flying Object (UFO)
    quote: |-
      People have been ridiculed and made fun of by official groups, by press and radio and television, and scientists too.
    text: |-
      According to James E. McDonald, Unidentified Flying Object witnesses have been ridiculed and made fun of by official groups, the press, radio, television, and scientists, which has discouraged reporting.
  - id: 9cfdf3c4-f047-41a4-8617-5c9022a0aaa0
    type: opinion
    attestation: first_hand
    speaker:
      id: 73e3056a-d9b9-42da-ae29-17fb3160308f
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: false
    location: 00:30:57.0-00:31:08.6
    refs:
      - id: 73e3056a-d9b9-42da-ae29-17fb3160308f
        name: James E. McDonald
      - id: b4232569-a213-4cf2-ad04-9c422eee36b9
        name: Unidentified Flying Object (UFO)
    quote: |-
      There's been a great deal of completely unbased, and I emphasize that,
      scorning and scoffing about this problem, and that's driven the problem underground.
    text: |-
      James E. McDonald considered much of the scorn and scoffing about the Unidentified Flying Object problem to be completely unfounded.
