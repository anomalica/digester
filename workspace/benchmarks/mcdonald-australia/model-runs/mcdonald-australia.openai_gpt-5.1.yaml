        name: James E. McDonald
      - id: b4232569-a213-4cf2-ad04-9c422eee36b9
        name: Unidentified Flying Object (UFO)
    quote: |-
      And then you say, well, where did you report this?
      Did you report it to the Air Force?
      Did you report it to police or so on?
      And very commonly, the answer is either, no, I didn't report it, fear of ridicule or a little reluctance to have it sensationalized or so on is involved.
      or the kind of thing that you just mentioned is not at all uncommon in the states and evidently here too.
      One reports it to someone and press or official channels and a certain amount of skepticism leads to a ridiculous rebuke of some sort and then nothing more is heard.
    text: |-
      James E. McDonald reported that witnesses commonly either do not report their Unidentified Flying Object sightings to authorities due to fear of ridicule or reluctance to have them sensationalised, or they report them and receive a sceptical or ridiculous rebuke.
  - id: 1f9267b4-0242-4f31-a757-2b624f27d676
