        name: Unidentified Flying Object (UFO)
    quote: |-
      Well, just before Christmas last December, I saw...
      It was a clear night.
      I saw what I thought at first was a shooting star...
      But instead of sort of going down, it went straight across the sky in a straight line.
    text: |-
      In December of the previous year, Speaker 6 observed on a clear night a light she initially thought was a shooting star moving straight across the sky rather than descending.
  - id: 4f8cd8bb-ee7b-4275-bcda-168fdd822e40
    type: testimony
