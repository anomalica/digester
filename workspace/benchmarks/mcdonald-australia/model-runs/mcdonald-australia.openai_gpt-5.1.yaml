      For instance, when I got started looking into this problem intensively about a year ago and got in there, it came as a great surprise to me to find out that Project Blue Book, the American UFO investigation headquarters project, consists of a major, a sergeant, and a secretary.
      Imagine that.
    text: |-
      When James E. McDonald investigated Project Blue Book about a year before this talk, he was surprised to find that it consisted only of a major, a sergeant, and a secretary.
