    quote: |-
      On the 7th of June, I was at the United Nations speaking to the Outer Space Affairs Group about the UFO problem, submitted some formal statements to them, urging UN action on the UFO problem.
    text: |-
      On 1967-06-07, James E. McDonald addressed the United Nations Outer Space Affairs Group on the UFO problem and submitted formal statements urging UN action.
