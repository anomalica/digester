    quote: |-
      who was milking 0700 on February of 1963. All of a sudden, coming out of the overcast was a large disc-like object which hovered over a tree 100 yards away. ... The cattle, he was most impressed by the way in which the cattle jumped and stampeded, the dogs started barking, horses broke loose and so on.
    text: |-
      On 1963-02-01 at 07:00, during the Brew farm disc sighting, a large disc-like object emerged from overcast and hovered over a tree approximately 91 metres away on Brew's farm, causing cattle to jump and stampede, dogs to bark and horses to break loose.
