  - id: 6e8273a1-dcd1-4ffd-8a90-1df09a839c01
    type: observation
    attestation: first_hand
    speaker:
      id: effc9788-a113-4612-a0bd-dd00c04ea839
      name: Speaker 8
    provenance_chain:
      origin_kind: speaker
      origin: Speaker 8
    attribution_in_text: false
    location: 00:17:52.0-00:19:02.0
    date: '1957'
    refs:
      - id: effc9788-a113-4612-a0bd-dd00c04ea839
        name: Speaker 8
      - id: 1ee2199d-721d-43d5-9915-2351cc6fa883
        name: New Zealand, Waikato, Wairakei
      - id: 0d9a8f1d-fdd3-466d-ada2-d90f62d4e9d4
        name: Unidentified Flying Object (UFO)
    quote: |-
      One day I was surveying to set out the pipelines. In the area of the thermal bores. ... And we both quite independently saw this grey object which for want of a better name I'll call a flying saucer, which arose out of the steam board the way over on the horizon, went vertically upwards, it was saucer shaped, it traversed towards us and away from us, it arose in the east and went towards the northwest at a very high speed, faster than any plane we knew of at the time, and what made it more convincing to us was the fact that there was broken cloud at the time, and we kept on seeing these things that would go behind clouds and reappear. And as I say, we both saw it quite independently and mutually drew each other's attention to it, even though we were out of air shot.
    text: |-
      Speaker 8 observed a grey saucer-shaped object that arose vertically out of steam near the horizon in New Zealand, traversed towards the observers and then away, heading east to northwest at very high speed faster than any known aircraft at the time, disappearing behind broken cloud and reappearing.
  - id: 2b5c6565-e9f2-465d-9810-46fbf8914065
    type: administrative
    attestation: first_hand
    speaker:
      id: effc9788-a113-4612-a0bd-dd00c04ea839
      name: Speaker 8
    provenance_chain:
      origin_kind: speaker
      origin: Speaker 8
    attribution_in_text: false
    location: 00:17:42.2-00:17:50.7
    date: '1957'
    refs:
      - id: effc9788-a113-4612-a0bd-dd00c04ea839
        name: Speaker 8
      - id: 1ee2199d-721d-43d5-9915-2351cc6fa883
        name: New Zealand, Waikato, Wairakei
    quote: |-
      I'm a civil engineer, and ten years ago I was employed by contractors building the first geothermal power station in Wairakei in New Zealand.
    text: |-
      Speaker 8 was a civil engineer employed by contractors building the first geothermal power station at Wairakei in New Zealand approximately ten years before the 1967 broadcast.
  - id: 1eaa8fb8-8d8b-40ec-88ec-c82457ad148a
    type: observation
    attestation: first_hand
    speaker:
      id: effc9788-a113-4612-a0bd-dd00c04ea839
      name: Speaker 8
    provenance_chain:
      origin_kind: speaker
      origin: Speaker 8
    attribution_in_text: false
    location: 00:18:02.7-00:18:24.6
    date: '1957'
    refs:
      - id: effc9788-a113-4612-a0bd-dd00c04ea839
        name: Speaker 8
      - id: 1ee2199d-721d-43d5-9915-2351cc6fa883
        name: New Zealand, Waikato, Wairakei
    quote: |-
      And I had a survey assistant at the time, a Maori, who was about 300 feet away. And I just finished setting up the Theodolite, ready to take a sighting. And we both quite independently saw this grey object ... even though we were out of air shot.
    text: |-
      Speaker 8 and a Maori survey assistant observed the grey saucer-shaped object independently while the assistant was approximately 90 metres away and they were out of earshot.
  - id: 2461452c-5f6d-4388-98f8-88ce843afa92
    type: measurement
    attestation: first_hand
    speaker:
      id: effc9788-a113-4612-a0bd-dd00c04ea839
      name: Speaker 8
    provenance_chain:
      origin_kind: speaker
      origin: Speaker 8
    attribution_in_text: false
    location: 00:19:32.5-00:19:47.6
    date: '1957'
    refs:
      - id: effc9788-a113-4612-a0bd-dd00c04ea839
        name: Speaker 8
      - id: 1ee2199d-721d-43d5-9915-2351cc6fa883
        name: New Zealand, Waikato, Wairakei
    quote: |-
      it arose on our horizon, and our horizon was a hill or ridge about, say, a mile and a half away. and I'd estimate the clouds appearing at at least 500 feet, so the height of the thing must have been more than 500 feet.
    text: |-
      The grey saucer-shaped object observed by Speaker 8 arose from a hill or ridge approximately 2.4 kilometres away and reached a height of more than 150 metres.
  - id: 83b1a25e-eacf-40f1-86f3-c4fb4f13b156
    type: testimony
    attestation: first_hand
    speaker:
      id: effc9788-a113-4612-a0bd-dd00c04ea839
      name: Speaker 8
    provenance_chain:
      origin_kind: speaker
      origin: Speaker 8
    attribution_in_text: false
    location: 00:19:57.5-00:20:10.4
    date: '1957'
    refs:
      - id: effc9788-a113-4612-a0bd-dd00c04ea839
        name: Speaker 8
      - id: 1ee2199d-721d-43d5-9915-2351cc6fa883
        name: New Zealand, Waikato, Wairakei
    quote: |-
      However when we got back to the construction site, We sort of both talked to my fellow engineers about it, who immediately rubbished us. ... And the other engineers, as I say, rubbished us and said, well, we shouldn't have stopped at the pub.
    text: |-
      Speaker 8 and the Maori assistant discussed the sighting with fellow engineers at the construction site who ridiculed them and suggested they had been drinking.
  - id: be0b4028-0a7f-42ad-a429-b062d97b4068
    type: testimony
    attestation: first_hand
    speaker:
      id: effc9788-a113-4612-a0bd-dd00c04ea839
      name: Speaker 8
    provenance_chain:
      origin_kind: speaker
      origin: Speaker 8
    attribution_in_text: false
    location: 00:20:20.6-00:20:29.7
    date: '1957'
    refs:
      - id: effc9788-a113-4612-a0bd-dd00c04ea839
        name: Speaker 8
    quote: |-
      And the Maori chainman, of course, didn't like to be made fun of in such a way, so he immediately disclaimed he'd seen it.
    text: |-
      The Maori survey assistant disclaimed having seen the object after being ridiculed by the other engineers.
  - id: 826310a9-3867-4048-af7b-0ab8e3ebcab4
