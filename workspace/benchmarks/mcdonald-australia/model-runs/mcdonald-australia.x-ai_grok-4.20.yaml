    quote: |-
      I just want to verify the fact of flying saucers. I have seen two. ... i was on a train actually that went from Christchurch over to the west coast of New Zealand yes to the um i was going to see the Fox Glacier actually and the day was the 17th of the 11th '55. ... I saw two objects spinning in the sky. They were white in colour and disappeared after a while. ... they seem to be semi-circular. You know, they were just... You couldn't really make out a shape. They just seemed to be spinning at such a terrific speed.
    text: |-
      Speaker 9 observed two white semi-circular spinning objects on 1955-11-17 while on a train from Christchurch to the west coast of New Zealand near Fox Glacier.
