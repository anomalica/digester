    quote: |-
      that type of situation, clear sky, there were no thunderstorms anywhere in the area. ... that rules out plasmoids of the ball lightning type. You're talking about a stationary object together. ... The possibility that it's a meteoric fireball is ruled out... Well, this is the sort of situation. Soundless objects hovering stationary in conditions that do not imply ball lightning, rule out meteors. That's an interesting case, the type of case that if we had an opportunity I'd want to pursue further.
    text: |-
      James E. McDonald considers the 1949 Hawthorn cigar-shaped object sighting rules out plasmoids of the ball lightning type, meteoric fireballs and is the type of case he would want to pursue further.
  - id: 5dc63b7a-b8c1-48fd-803b-12c868e336dc
    type: observation
    attestation: first_hand
    speaker:
      id: 98b251a0-ad31-491c-b394-94ee70be4f89
      name: Speaker 6
    provenance_chain:
      origin_kind: speaker
      origin: Speaker 6
    attribution_in_text: false
    location: 00:04:34.7-00:05:05.1
    date: 1966-12
    refs:
      - id: 98b251a0-ad31-491c-b394-94ee70be4f89
        name: Speaker 6
    quote: |-
      just before Christmas last year in December... I saw what I thought at first was a shooting star... But instead of sort of going down, it went straight across the sky in a straight line. ... when it got about, oh, I couldn't tell you how far it had gone, but it stopped for a little while, for a few minutes, and then it sort of went, started moving towards the horizon again after that.
    text: |-
      In December 1966 on a clear night, Speaker 6 observed a light that at first appeared to be a shooting star but travelled horizontally in a straight line, stopped for a few minutes, then continued moving towards the horizon.
  - id: b6591ceb-9bfd-4942-a842-4e8107aad102
    type: observation
    attestation: first_hand
    speaker:
      id: 98b251a0-ad31-491c-b394-94ee70be4f89
      name: Speaker 6
    provenance_chain:
      origin_kind: speaker
      origin: Speaker 6
    attribution_in_text: false
    location: 00:05:06.6-00:05:41.8
    date: 1967-02
    refs:
      - id: 98b251a0-ad31-491c-b394-94ee70be4f89
        name: Speaker 6
    quote: |-
      And also, in February, now my husband was with me in December, in February, I saw, with my mother-in-law and sister-in-law, we saw two of them. And the first one sort of stopped. It sort of seemed to be hovering. And then we saw another one, and that came up towards the first one, and they appeared to be having some sort of rendezvous. And then the second one moved off into the horizon, and the first one just stayed there stationary.
    text: |-
      In February 1967, Speaker 6 and her mother-in-law and sister-in-law observed two lights: the first appeared to hover, the second came up towards the first as if having a rendezvous, then the second moved off while the first remained stationary.
  - id: 89d958c9-4d63-4909-93c4-1f2970b0e5cb
    type: opinion
    attestation: first_hand
    speaker:
      id: bd4c3c56-b364-4358-9459-4799783e37a5
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: false
    location: 00:06:04.3-00:06:17.3
    date: 1967-06
    refs:
      - id: bd4c3c56-b364-4358-9459-4799783e37a5
        name: James E. McDonald
    quote: |-
      I would make the following remark that lots of persons in the US and Australia and elsewhere are making reports just like that of lights that move across, hover, exhibit maneuvers that do not at all match meteors.
    text: |-
      James E. McDonald notes that reports of lights in the sky that move, hover and exhibit manoeuvres that do not match meteors are common in the United States and Australia.
  - id: 9646022f-212e-4a41-b140-6258983f0118
    type: opinion
    attestation: first_hand
    speaker:
      id: bd4c3c56-b364-4358-9459-4799783e37a5
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: false
    location: 00:06:17.7-00:06:27.9
    date: 1967-06
    refs:
      - id: bd4c3c56-b364-4358-9459-4799783e37a5
        name: James E. McDonald
    quote: |-
      The stopping that you described is not at all uncommon. The fact that another one came up is scarcely meteoric behavior, and I don't know of any hovering meteors in all history of mankind.
    text: |-
      James E. McDonald considers that stopping, hovering and apparent rendezvous manoeuvres are not meteoric behaviour and that hovering meteors are unknown in history.
  - id: accd65f9-8baf-4934-b618-d219dfe84015
    type: opinion
    attestation: first_hand
    speaker:
      id: bd4c3c56-b364-4358-9459-4799783e37a5
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: false
    location: 00:06:33.6-00:06:45.3
    date: 1967-06
    refs:
      - id: bd4c3c56-b364-4358-9459-4799783e37a5
        name: James E. McDonald
    quote: |-
      Helicopters, aircraft, of course, you have to have a helicopter if you're going to have it hover, can mislead us at night. So this cautionary remark has to be made.
    text: |-
      James E. McDonald cautions that lights in the sky reports must be examined carefully because helicopters and aircraft with unusual lights can mislead observers at night.
  - id: 578ceb8a-534d-4f10-87cf-539ae580da74
    type: opinion
    attestation: first_hand
    speaker:
      id: bd4c3c56-b364-4358-9459-4799783e37a5
      name: James E. McDonald
    provenance_chain:
