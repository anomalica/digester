      origin: Speaker 7
    attribution_in_text: false
    location: 00:12:11.8-00:12:19.5
    date: '1962-01-01'
    refs:
      - id: 627d24d5-80bc-4471-acb8-59deb8fd4941
        name: Speaker 7
    quote: |-
      it was a clear, sunny morning. ... it was in the summertime. There was no haze or any description. ... there was absolutely no haze of any description of fog or anything at all like that around the city.
    text: |-
      The weather during the East Melbourne cylindrical object sighting was a clear sunny morning in summertime with no haze or fog.
  - id: c4dd3847-ad2f-49fe-a1e7-771f10b01528
    type: opinion
    attestation: first_hand
    speaker:
      id: bd4c3c56-b364-4358-9459-4799783e37a5
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: false
    location: 00:10:46.9-00:11:05.2
    date: 1967-06
    refs:
      - id: bd4c3c56-b364-4358-9459-4799783e37a5
        name: James E. McDonald
    quote: |-
      Again and again, in interviewing witnesses, you hear about these cases sometimes in a quite roundabout fashion, and then you ask the observer, well, were there any other witnesses? And a very common puzzlement arises then. The person says, well, no, that was one of the things that really bothered him. He would have thought that dozens of people must have seen it.
    text: |-
      James E. McDonald notes that it is common for UFO witnesses to be puzzled why few or no other people reported the same sighting despite expecting dozens to have seen it.
  - id: bcecff4b-52f2-4539-8e26-20b56e36e41b
    type: opinion
    attestation: first_hand
    speaker:
      id: bd4c3c56-b364-4358-9459-4799783e37a5
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: false
    location: 00:11:20.8-00:11:35.3
    date: 1967-06
    refs:
      - id: bd4c3c56-b364-4358-9459-4799783e37a5
        name: James E. McDonald
    quote: |-
      or the kind of thing that you just mentioned is not at all uncommon in the states and evidently here too. One reports it to someone and press or official channels and a certain amount of skepticism leads to a ridiculous rebuke of some sort and then nothing more is heard.
    text: |-
      James E. McDonald notes that fear of ridicule or reluctance to sensationalise often prevents UFO witnesses from reporting sightings to authorities such as the Air Force or police.
  - id: b1007065-f787-4b18-8c83-6f8489acaeab
    type: opinion
    attestation: first_hand
    speaker:
      id: bd4c3c56-b364-4358-9459-4799783e37a5
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: false
    location: 00:12:44.4-00:13:00.9
    date: 1967-06
    refs:
      - id: bd4c3c56-b364-4358-9459-4799783e37a5
        name: James E. McDonald
    quote: |-
      A general rejection of this by persons who usually have almost no knowledge of it but who realize that it sounds at first glance like a lot of nonsense and who jump to that conclusion. And when these people are in paper press or radio and so on, they tend to filter out a lot of the information that should be getting into scientific channels.
    text: |-
      James E. McDonald notes that press, radio and official channels often filter out UFO information due to skepticism from people with little knowledge of the subject, preventing it from reaching scientific channels.
  - id: be416df2-7068-4e24-8575-88cf2935091c
    type: opinion
    attestation: first_hand
    speaker:
      id: bd4c3c56-b364-4358-9459-4799783e37a5
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: false
    location: 00:13:32.0-00:13:40.8
    date: 1967-06
    refs:
      - id: bd4c3c56-b364-4358-9459-4799783e37a5
        name: James E. McDonald
      - id: 4c21973f-c809-4e2c-bb20-9cb07f614755
        name: Carl Gustav Jung
    quote: |-
      Jung was not at all addressing himself to what is the real UFO problem. He is talking about psychotic types who have some kind of psychic needs to believe.
    text: |-
      Carl Gustav Jung's theory on UFOs primarily addressed psychotic types with psychic needs to believe rather than the core UFO problem.
  - id: fa1ec73c-979c-48c5-8007-f929eada7915
    type: opinion
    attestation: first_hand
    speaker:
      id: bd4c3c56-b364-4358-9459-4799783e37a5
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: false
    location: 00:14:30.0-00:15:00.0
    date: 1967-06
    refs:
      - id: bd4c3c56-b364-4358-9459-4799783e37a5
        name: James E. McDonald
    quote: |-
      This is just more of that old sort of thing. Jung was talking about this. ... which is unfortunately very visible, particularly in America, centered around the UFO problem. People who feel that there's a salvation message being brought from Venus and all that sort of rot. But this is not the UFO problem.
    text: |-
      James E. McDonald considers that the cult and crackpot fringe around UFOs, including beliefs in salvation messages from Venus, is distinct from the real UFO problem.
  - id: 72e25bd2-ef3a-49ba-b07d-06fbcae08390
    type: opinion
    attestation: first_hand
    speaker:
      id: bd4c3c56-b364-4358-9459-4799783e37a5
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: false
    location: 00:13:59.9-00:14:09.0
    date: 1967-06
    refs:
      - id: bd4c3c56-b364-4358-9459-4799783e37a5
        name: James E. McDonald
      - id: 4c21973f-c809-4e2c-bb20-9cb07f614755
        name: Carl Gustav Jung
    quote: |-
      If you read the book carefully, you find him near the end of that book taking the problem seriously in terms of the possibility there may be something other than what he's talking about in the psychological art.
    text: |-
      Near the end of his book, Carl Gustav Jung took the UFO problem seriously in terms of the possibility of something other than psychological archetypes.
  - id: c00955ea-9be1-4829-8c8e-e608a7c55b57
    type: opinion
    attestation: first_hand
    speaker:
      id: bd4c3c56-b364-4358-9459-4799783e37a5
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: false
    location: 00:14:12.0-00:14:38.7
    date: 1967-06
    refs:
      - id: bd4c3c56-b364-4358-9459-4799783e37a5
        name: James E. McDonald
      - id: 4c21973f-c809-4e2c-bb20-9cb07f614755
        name: Carl Gustav Jung
    quote: |-
      There are lots of cases where animals are present, dogs, horses, cows, and so on. Jung says these are psychic projections of archetypal images, you know. Well, it poses the puzzling question, you see, Barry, that we have to make the assumption that canine, equine, feline, bovine archetypal images are identical with ours. ... If you think this is not a real phenomenon, then why does it stampede cattle? ... This is not at all unrepresentative of the kind of panic reaction that animals show. I think Jung would have some time explaining that.
    text: |-
      James E. McDonald considers that Carl Gustav Jung's theory of psychic projections of archetypal images is challenged by cases where animals such as dogs, horses and cows react strongly to UFOs, implying identical archetypal images across species or that the phenomenon is real and causes stampedes.
  - id: ba205b7c-d442-437d-bccf-a80314feb787
