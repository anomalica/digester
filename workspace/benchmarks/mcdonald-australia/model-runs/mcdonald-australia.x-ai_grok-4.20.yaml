    refs:
      - id: 87f4db3f-f7c0-495e-9563-2f675128928c
        name: U Thant
      - id: c52d4214-cb18-45ba-a523-4cb36dea7499
        name: Drew Pearson
      - id: 7b4f0e09-32c6-417d-a7e0-e96b721f8204
        name: U Thant UFO statement
    quote: |-
      Subsequently, however, in some kind of an exchange with Drew Pearson, U Thant made a statement now about four or five days ago, I guess six days ago, that the UFO problem is probably the most important international problem, with the present exception of the Vietnam War.
    text: |-
      In approximately June 1967, U Thant stated in an exchange with Drew Pearson that the UFO problem is probably the most important international problem with the present exception of the Vietnam War.
  - id: 1a776c91-acc8-438e-9ac8-7dbe22232250
    type: opinion
    attestation: first_hand
    speaker:
