    date: '1962-01-01'
    refs:
      - id: 627d24d5-80bc-4471-acb8-59deb8fd4941
        name: Speaker 7
    quote: |-
      I went to the Herald Office to report it. And uh fellas at the Herald Office. thought I was a bloomin' nut, I think. ... the chaps in there, well, you could see they had rye grins on their face as much as to say that you... You don't know what you're talking about.
    text: |-
      Speaker 7 reported the East Melbourne cylindrical object sighting to the Herald Office but was met with skepticism and ridicule.
  - id: 8ff6a995-4f46-4947-b4ff-2a9e90b1cdad
    type: observation
    attestation: first_hand
    speaker:
      id: 627d24d5-80bc-4471-acb8-59deb8fd4941
