    quote: |-
      I was sitting at the front of my place in East Preston. On the 8th of March, 1965. And my daughter was with me, married daughter, and she turned around and she said, oh, there's something moving across the sky there, and it looked like a star, but it was moving, and all the other stars were standing still. So I went in and got the binoculars and looked at it, and it was a metallic blue object, iridescent blue, and it was like a spinning top, only the flat type of spinning top. And it was moving in the sky, in the eastern sky, from the south to the north.
    text: |-
      Speaker 5 and her married daughter observed an iridescent blue metallic object shaped like a flat spinning top moving across the eastern sky from south to north on 1965-03-08 at approximately 20:00-20:30 from East Preston.
