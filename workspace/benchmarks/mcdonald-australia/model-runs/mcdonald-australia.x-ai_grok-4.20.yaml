      - id: 87f4db3f-f7c0-495e-9563-2f675128928c
        name: U Thant
    quote: |-
      I cabled U Thant a reply, endorsing the statement, but disagreeing to the extent of saying that, in my opinion, the UFO problem is probably even greater in international importance than the Vietnamese situation.
    text: |-
      James E. McDonald cabled U Thant endorsing his statement on the importance of the UFO problem but disagreeing that it was less important than the Vietnam War, stating instead that in his opinion the UFO problem is probably even greater in international importance than the Vietnamese situation.
  - id: 9538fc99-71d5-4e3b-be5f-70614dbd0a78
    type: opinion
