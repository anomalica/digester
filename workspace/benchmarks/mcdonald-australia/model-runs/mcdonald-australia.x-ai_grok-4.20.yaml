    attribution_in_text: false
    location: 00:08:02.8-00:08:47.6
    date: '1962-01-01'
    refs:
      - id: 627d24d5-80bc-4471-acb8-59deb8fd4941
        name: Speaker 7
      - id: aa843c22-234c-43ca-bd3c-9b7ae260c59c
        name: Australia, Victoria, East Melbourne
    quote: |-
      I was driving a cab about five years ago. ... this was down in um oh that bit that runs uh parallel with victoria street there kind of a shortcut up to east melbourne ... it was around about nine o'clock in the morning ... i saw this object or it appeared to be up over the um around about the eastern hill ... there was a a definite object there hovering in the sky uh cylindrical in in um in shape and uh silvery color ... It was stationary. And then all of a sudden, it just took off in a just flashed off and that was the end of it
    text: |-
      Approximately five years before the broadcast, Speaker 7 while driving a taxi with a passenger in a westerly direction towards Australia, Victoria, East Melbourne observed a silvery cylindrical object hovering stationary over Eastern Hill that then flashed off and disappeared suddenly.
  - id: a810e755-b459-41b2-88a5-045b1717f4c6
