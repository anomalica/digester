        name: Unidentified Flying Object (UFO)
    quote: |-
      The type of sightings that are on record, thousands of cases in the U.S., involve cigar-shaped objects, disks, hovering sometimes at very low altitude. ... Many inexplicable, scientifically inexplicable, baffling phenomena, very high accelerations. sometimes high-speed objects moving without any obvious sonic booms, though I'd hasten to interject that sometimes there are unexplained sonic booms that could be UFOs, many peculiar luminous phenomena
    text: |-
      Thousands of Unidentified Flying Object (UFO) cases in the United States involve cigar-shaped objects and disks hovering at very low altitude, high accelerations, high-speed movement without sonic booms, peculiar luminous phenomena and other baffling observations.
