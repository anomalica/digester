        name: James E. McDonald
    quote: |-
      Nevertheless, I think that's a moderately interesting remark. ... this category of report is not the one on which the strong conclusions need now to be built. Nevertheless, it appears that you've seen something of a rather unconventional nature in that instance.
    text: |-
      James E. McDonald considers the sighting reported by Speaker 6 to be of a rather unconventional nature but states that this category of report is not the one on which strong conclusions need now to be built.
