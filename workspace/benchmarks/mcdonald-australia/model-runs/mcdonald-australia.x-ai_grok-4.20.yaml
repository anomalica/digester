        name: Unidentified Flying Object (UFO)
    quote: |-
      The picture in Australia, with respect to UFO sightings, observations of unconventional objects maneuvering, sometimes quite close to ground, sometimes within tens to hundreds of feet of very credible, reliable observers, is just not appreciably different in Australia, New Zealand, and Tasmania from what it is in the States. Very strong similarity. There's just a little bit of evidence that indicates to me there may even be a few more sightings per square mile or per capita here than in the States.
    text: |-
      James E. McDonald interviewed witnesses during his 1967 Australia-New Zealand investigative tour and found the picture of Unidentified Flying Object (UFO) sightings in Australia, New Zealand and Tasmania is not appreciably different from that in the United States, with very strong similarity and possibly a slightly higher rate per capita.
