    quote: |-
      Certainly as a scientist, I am not entirely happy with taking hearsay evidence, and I've been down here in Australia interviewing witnesses to find out for myself, in direct, face-to-face, or in some cases, phone interviewing, exactly what happened in individual cases and what the credibility of the witness is, how witnesses may be, how thoroughly the cases have been and so on down the line.
    text: |-
      During James E. McDonald 1967 Australia-New Zealand investigative tour, James E. McDonald interviewed witnesses in Australia, Victoria, Melbourne in direct face-to-face meetings, phone calls and other methods to assess what happened in individual cases, witness credibility and case thoroughness.
