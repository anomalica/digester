        name: Unidentified Flying Object (UFO)
    quote: |-
      A general rejection of this by persons who usually have almost no knowledge of it but who realize that it sounds at first glance like a lot of nonsense and who jump to that conclusion.
    text: |-
      James E. MacDonald considered public rejection of the Unidentified Flying Object (UFO) problem in Australia and the United States to be driven by people with little knowledge of the subject.
  - id: f99e53da-ad9e-487f-aef7-2606db7d89ea
    type: opinion
    attestation: first_hand
    speaker:
      id: 975fd36e-2e3b-4a96-99ed-94b0d8b4f379
      name: James E. MacDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. MacDonald
    attribution_in_text: true
    location: 00:12:54.0-00:13:00.9
    refs:
      - id: 975fd36e-2e3b-4a96-99ed-94b0d8b4f379
