      - id: 0b6e21fc-6a8d-47ec-add1-3b5a8608b186
        name: Unidentified Flying Object (UFO)
    quote: |-
      When these people are in paper press or radio and so on, they tend to filter out a lot of the information that should be getting into scientific channels.
    text: |-
      James E. MacDonald considered press and radio dismissal of Unidentified Flying Object (UFO) reports to filter information out of scientific channels.
  - id: 27c4dcb9-91f8-4b5f-8b58-eb393ac57f4a
    type: opinion
    attestation: first_hand
    speaker:
      id: 975fd36e-2e3b-4a96-99ed-94b0d8b4f379
      name: James E. MacDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. MacDonald
    attribution_in_text: true
    location: 00:13:31.2-00:13:40.8
