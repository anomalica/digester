    location: 00:00:00.0-00:00:00.0
    refs:
      - id: 6a56c528-e7ad-49c3-b30d-46cb64be1747
        name: James E. MacDonald
      - id: 1ba8c090-f08f-41ef-8b9a-89daa9ee2a00
        name: Unidentified Flying Object (UFO)
      - name: Australia
    quote: |-
      <!-- speaker: James E. MacDonald -->
      Certainly as a scientist, I am not entirely happy with taking hearsay evidence, and I've been down here in Australia interviewing witnesses to find out for myself, in direct, face-to-face, or in some cases, phone interviewing, exactly what happened in individual cases and what the credibility of the witness is, how witnesses may be, how thoroughly the cases have been
      and so on down the line.
    text: |-
      James E. MacDonald interviewed UFO witnesses face-to-face and by telephone in Australia to determine the credibility of the witnesses and the details of individual cases.
