        name: Peter Surrey
      - id: 2c583327-4696-4bea-9070-63f74ef9fadd
        name: 1965 East Preston UFO Sighting
    quote: |-
      <!-- speaker: Speaker 7 -->
      I was driving a cab about five years ago... uh this was down in um oh that bit that runs uh parallel with victoria street there kind of a shortcut up to east melbourne... i saw this object or it appeared to be up over the um around about the eastern hill you know... uh like up around about the top of a street and uh there was a a definite object there hovering in the sky uh cylindrical in in um in shape and uh silvery color
    text: |-
      Peter Surrey, a cab driver in East Melbourne, observed a silvery, cylindrical UFO hovering over Eastern Hill at 09:00 approximately five years prior to the 1967 broadcast.
