        name: James E. MacDonald
      - name: Australia
      - id: ca8a60bb-9628-4ab4-b1e2-44e92538297e
        name: United States
    quote: |-
      <!-- speaker: James E. MacDonald -->
      ...that's one of the many patterns that I find in my trip down here that's essentially the same in Australia as in the States. A general rejection of this by persons who usually have almost no knowledge of it... And when these people are in paper press or radio and so on, they tend to filter out a lot of the information that should be getting into scientific channels.
    text: |-
      James E. MacDonald finds that witnesses who report UFOs often encounter ridicule from the press or officials, a pattern he observed in both Australia and the United States.
  - id: 72a8ff3c-8782-4af9-b3a6-1321ab1c5fd8
    type: opinion
    speaker:
      id: 6a56c528-e7ad-49c3-b30d-46cb64be1747
      name: James E. MacDonald
    location: 00:13:23.9-00:13:40.8
    refs:
      - id: 6a56c528-e7ad-49c3-b30d-46cb64be1747
        name: James E. MacDonald
      - id: 3305f6f9-5a8b-4207-880e-9bcfe5d72f78
        name: Carl Gustav Jung
      - id: ca8a60bb-9628-4ab4-b1e2-44e92538297e
        name: United States
      - id: 1ba8c090-f08f-41ef-8b9a-89daa9ee2a00
        name: Unidentified Flying Object (UFO)
    quote: |-
      <!-- speaker: James E. MacDonald -->
      Oh, I've read the book, of course, Barry, and talked it over with quite a few psychologists back in the States. The main difficulty is Jung was not at all addressing himself to what is the real UFO problem. He is talking about psychotic types who have some kind of psychic needs to believe.
    text: |-
      James E. MacDonald has read Carl Gustav Jung's book on UFOs and discussed it with psychologists in the United States, finding that Jung addressed psychotic types and psychic needs rather than the real UFO problem.
  - id: 23f61ebc-6fb9-4c44-b50f-7984488c7da9
    type: opinion
    speaker:
      id: 6a56c528-e7ad-49c3-b30d-46cb64be1747
      name: James E. MacDonald
    location: 00:02:20.0-00:02:25.0
    refs:
      - id: 6a56c528-e7ad-49c3-b30d-46cb64be1747
        name: James E. MacDonald
      - id: 3305f6f9-5a8b-4207-880e-9bcfe5d72f78
        name: Carl Gustav Jung
      - id: 1ba8c090-f08f-41ef-8b9a-89daa9ee2a00
        name: Unidentified Flying Object (UFO)
    quote: |-
      <!-- speaker: James E. MacDonald -->
      There are lots of cases where animals are present, dogs, horses, cows, and so on... If you think this is not a real phenomenon, then why does it stampede cattle?
    text: |-
      James E. MacDonald argues against Carl Gustav Jung's psychic projection theory by noting that UFO encounters often provoke physical panic reactions in animals such as cattle, dogs, and horses.
  - id: 5e3b4529-7244-4d88-8b88-09a4c89b14b5
    type: hearsay
    attestation: second_hand
    speaker:
      id: 6a56c528-e7ad-49c3-b30d-46cb64be1747
      name: James E. MacDonald
    location: 00:14:50.4-00:15:14.4
    refs:
      - id: 6a56c528-e7ad-49c3-b30d-46cb64be1747
        name: James E. MacDonald
      - id: 91ba8155-90fb-428e-beb4-37f7ba85d4af
        name: 1963 Moe Farmer UFO Sighting
    quote: |-
      <!-- speaker: James E. MacDonald -->
      We were down in Mowi, in the Gippsland area, talking to a farmer named Brew, who was milking 0700 on February of 1963. All of a sudden, coming out of the overcast was a large disc-like object which hovered over a tree 100 yards away... The cattle, he was most impressed by the way in which the cattle jumped and stampeded, the dogs started barking, horses broke loose and so on.
    text: |-
      James E. MacDonald visited a farmer named Brew in Moe, Gippsland, to investigate a 1963 UFO sighting where a large disc-like object hovered over a tree, causing cattle to stampede, dogs to bark, and horses to break loose.
