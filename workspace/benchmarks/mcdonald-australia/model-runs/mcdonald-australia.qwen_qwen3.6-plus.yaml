        name: 1965 East Preston UFO Sighting
    quote: |-
      <!-- speaker: Speaker 7 -->
      Yes, it was a clear, sunny morning. As a matter of fact, it was in the summertime. There was no haze or any description... And there was absolutely no haze of any description of fog or anything at all like that around the city.
    text: |-
      Peter Surrey observed clear, sunny weather with no haze during the 1965 East Preston UFO Sighting in the summertime.
