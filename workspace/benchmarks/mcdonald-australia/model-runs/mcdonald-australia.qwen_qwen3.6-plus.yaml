  - id: 795b41b5-cf3e-48fe-a040-c31d51dea13a
    type: observation
    attestation: first_hand
    speaker:
      name: Speaker 6
    location: 00:04:33.4-00:05:05.1
    refs:
      - id: 1ba8c090-f08f-41ef-8b9a-89daa9ee2a00
        name: Unidentified Flying Object (UFO)
    quote: |-
      <!-- speaker: Speaker 6 -->
      ...just before Christmas last December, I saw... It was a clear night. I saw what I thought at first was a shooting star... But instead of sort of going down, it went straight across the sky in a straight line... Anyway, when it got about, oh, I couldn't tell you how far it had gone, but it stopped for a little while, for a few minutes, and then it sort of went, started moving towards the horizon again after that.
    text: |-
      A caller identified as Speaker 6 observed a light initially resembling a shooting star that stopped and hovered for a few minutes before moving towards the horizon in December of the year prior to the 1967 broadcast.
  - id: 5f0204ef-8cae-4c5d-a185-65ca3518de54
    type: observation
    attestation: first_hand
    speaker:
      name: Speaker 6
    location: 00:04:50.8-00:05:29.6
    refs:
      - id: 1ba8c090-f08f-41ef-8b9a-89daa9ee2a00
        name: Unidentified Flying Object (UFO)
    quote: |-
      <!-- speaker: Speaker 6 -->
      ...in February... I saw, with my mother-in-law and sister-in-law, we saw two of them. And the first one sort of stopped. It sort of seemed to be hovering. And then we saw another one, and that came up towards the first one, and they appeared to be having some sort of rendezvous. And then the second one moved off into the horizon, and the first one just stayed there stationary.
    text: |-
      In February of the year prior to the 1967 broadcast, Speaker 6, their husband, mother-in-law, and sister-in-law observed two UFOs that appeared to rendezvous and hover before one moved off and the other remained stationary.
  - id: 809074de-2735-4a1b-83fb-36793cc6b31d
    type: opinion
    speaker:
      id: 6a56c528-e7ad-49c3-b30d-46cb64be1747
      name: James E. MacDonald
    location: 00:05:41.8-00:06:11.4
    refs:
      - id: 6a56c528-e7ad-49c3-b30d-46cb64be1747
        name: James E. MacDonald
      - id: 1ba8c090-f08f-41ef-8b9a-89daa9ee2a00
        name: Unidentified Flying Object (UFO)
    quote: |-
      <!-- speaker: James E. MacDonald -->
      Well, that's interesting. I might remark that this general category of observation in which it is simply a light in the sky is an extremely dangerous category with respect to misinterpretation... The stopping that you described is not at all uncommon. The fact that another one came up is scarcely meteoric behavior, and I don't know of any hovering meteors in all history of mankind.
    text: |-
      James E. MacDonald considers observations of lights moving across the sky and hovering to be a dangerous category for misinterpretation but notes that stopping and rendezvous maneuvers do not match meteors.
  - id: ad6ef115-d1b9-4fd1-ab6b-e02423ed486e
    type: observation
    attestation: first_hand
    speaker:
      id: 215eeb8a-5134-4df0-a6a8-6ccd8eb8d2c6
