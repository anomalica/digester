      ...
      It was about 9 to 9:30 p.m. in the evening.
    text: |-
      Mrs. Smith of South Caulfield observed a cigar-shaped Unidentified Flying Object (UFO) in Hawthorn, approximately in 1949 at 21:00–21:30.
