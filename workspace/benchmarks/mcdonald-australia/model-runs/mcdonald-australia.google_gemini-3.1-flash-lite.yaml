    date: '1966-12-01'
    refs:
      - id: afe45981-5fce-4ae1-adf7-e8f68cb98621
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      Speaker 6: Well, just before Christmas last December, I saw... It was a clear night. I saw what I thought at first was a shooting star... But instead of sort of going down, it went straight across the sky in a straight line. ... it stopped for a little while, for a few minutes, and then it sort of went, started moving towards the horizon again after that.
    text: |-
      In December of the previous year, a witness observed a UAP moving in a straight line across the sky before stopping for a few minutes and then proceeding toward the horizon.
  - id: 9b4c62cb-a1ec-444f-ab0e-51f802268e47
    type: testimony
    attestation: second_hand
    speaker:
      name: Speaker 6
    provenance_chain:
      origin_kind: named
      origin: Speaker 6
    attribution_in_text: false
    location: 00:04:18.2-00:05:41.8
    date: '1967-02-01'
    refs:
      - id: afe45981-5fce-4ae1-adf7-e8f68cb98621
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      Speaker 6: And also, in February, now my husband was with me in December, in February, I saw, with my mother-in-law and sister-in-law, we saw two of them. And the first one sort of stopped. It sort of seemed to be hovering. And then we saw another one, and that came up towards the first one, and they appeared to be having some sort of rendezvous. And then the second one moved off into the horizon, and the first one just stayed there stationary.
    text: |-
      In February, a witness observed two UAP, one of which was hovering while the other approached it for a rendezvous before departing toward the horizon.
  - id: 6f2c87da-3a5a-4f82-8fa9-be4d05bcfaf1
