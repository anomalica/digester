    quote: |-
      James E. MacDonald: ... a farmer named Brew, who was milking 0700 on February of 1963. All of a sudden, coming out of the overcast was a large disc-like object which hovered over a tree 100 yards away. ... The cattle, he was most impressed by the way in which the cattle jumped and stampeded, the dogs started barking, horses broke loose and so on.
    text: |-
      In February 1963, a farmer named Brew observed a large disc-like object emerging from an overcast sky and hovering over a tree, causing panic among his livestock.
