    quote: |-
      Mrs. Smith: I saw a cigar-shaped object, approximately 1949 this would be. Barry Jones: Mm-hmm. Mrs. Smith: And I think thousands of others saw it too, actually. It was about 9 to 9:30 p.m. in the evening. ... perfectly stationary. ... Hawthorne. We were living in Hawthorne at the time.
    text: |-
      In 1949, a witness in Hawthorne, Victoria, observed a stationary, cigar-shaped object at approximately 21:00 to 21:30.
