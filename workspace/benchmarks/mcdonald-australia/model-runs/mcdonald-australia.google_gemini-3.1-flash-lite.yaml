        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      Speaker 7: I was driving a cab about five years ago. ... around about nine o'clock in the morning ... I saw this object ... up over the ... eastern hill ... there was a a definite object there hovering in the sky ... cylindrical in in ... shape and ... silvery color
    text: |-
      Approximately five years prior to the interview, a taxi driver observed a stationary, silvery, cylindrical object hovering over Eastern Hill while driving a passenger toward the city at 09:00.
  - id: 27c9646e-d366-49e8-9425-019c50a46112
