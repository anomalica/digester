    quote: |-
      I've been down here in Australia interviewing witnesses to find out for myself, in direct, face-to-face, or in some cases, phone interviewing, exactly what happened in individual cases and what the credibility of the witness is
    text: |-
      James E. McDonald visited Australia to conduct face-to-face and phone interviews with witnesses of Unidentified Aerial Phenomena (UAP) to assess the credibility of their reports.
