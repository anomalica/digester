        name: Unidentified Flying Objects (UFO)
    quote: But planes usually have flashing colored lights on them, don't they at night?
    text: |-
      Aeroplanes typically display flashing coloured lights on them during night flight operations.
  - id: f24a3090-1af8-4a31-a392-4ddcc3c7e66c
    type: opinion
    attestation: first_hand
    speaker:
      id: d8a600f3-f9a6-457f-81b6-a7953286ed02
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: false
    location: 00:06:57.0-00:07:02.9
    refs:
      - id: d8a600f3-f9a6-457f-81b6-a7953286ed02
        name: James E. McDonald
    quote: |-
      Typically, yes, but still there are planes, reconnaissance planes and photo planes with odd and unusual lights
    text: |-
      Some reconnaissance aircraft and photo planes possess unusual and odd lights that differ from typical aeroplane lighting.
  - id: c593bdae-873b-41b6-b8e7-ea672a4825c0
    type: observation
    attestation: second_hand
    provenance_chain:
      origin_kind: anonymous
      origin: an unidentified taxi driver
      origin_ref: speaker-7
    attribution_in_text: false
    location: 00:08:02.8-00:08:33.2
    refs:
      - id: 7cade65d-8488-4075-8db1-81c9ad0e8492
        name: USA, Australia, East Melbourne
    quote: |-
      Yeah, I was driving a cab about five years ago. And... i had a passenger going into into the city... uh this was down in um oh that bit that runs uh parallel with victoria street there kind of a shortcut up to east melbourne... i saw this object or it appeared to be up over the um around about the eastern hill you know... uh there was a definite object there hovering in the sky uh cylindrical in in um in shape and uh silvery color
    text: |-
      An unnamed male taxi driver observed a cylindrical, silvery-coloured object hovering in the sky over East Melbourne, Victoria, approximately five years prior to the 1967 investigation.
  - id: c702e910-1863-4c53-9506-537dfb295461
    type: observation
    attestation: second_hand
    provenance_chain:
      origin_kind: anonymous
      origin: an unidentified taxi driver
      origin_ref: speaker-7
    attribution_in_text: false
    location: 00:08:08.2-00:08:15.0
    refs:
      - id: 7cade65d-8488-4075-8db1-81c9ad0e8492
        name: USA, Australia, East Melbourne
    quote: |-
      it was around about nine o'clock in the morning and um i i i saw this object... There was sun shining brightly and it was a clear sky
    text: |-
      The cylindrical, silvery-coloured object was observed at approximately 9 a.m. in the morning during clear skies and bright sunlight.
  - id: 9872c0cd-d719-4440-98e1-cae84f9d8a27
    type: observation
    attestation: second_hand
    provenance_chain:
      origin_kind: anonymous
      origin: an unidentified taxi driver
      origin_ref: speaker-7
    attribution_in_text: false
    location: 00:08:35.6-00:08:45.0
    refs:
      - id: 7cade65d-8488-4075-8db1-81c9ad0e8492
        name: USA, Australia, East Melbourne
    quote: |-
      To me, this did appear to be an object of some description. I thought so much about it. I brought it to the attention of the Fair. And she saw it also.
    text: |-
      The unnamed taxi driver informed his passenger about the cylindrical, silvery object and the passenger also observed it.
  - id: 046e1126-16e2-4ef5-829a-fb80fc04b9bd
    type: observation
    attestation: second_hand
    provenance_chain:
      origin_kind: anonymous
      origin: an unidentified taxi driver
      origin_ref: speaker-7
    attribution_in_text: false
    location: 00:08:50.2-00:08:54.1
    refs:
      - id: 597e51a2-e43c-4965-9696-37d63d31b8a0
        name: Herald Office
      - id: 7cade65d-8488-4075-8db1-81c9ad0e8492
        name: USA, Australia, East Melbourne
    quote: And uh fellas at the Herald Office. thought I was a bloomin' nut, I think.
    text: |-
      Staff at the Herald Office were dismissive of the unnamed taxi driver's report of the cylindrical, silvery object.
  - id: 0fe8731e-f607-4b68-b11c-dbc27ca3d816
    type: observation
    attestation: second_hand
    provenance_chain:
      origin_kind: anonymous
      origin: an unidentified taxi driver
      origin_ref: speaker-7
    attribution_in_text: false
    location: 00:09:00.1-00:09:18.2
    refs:
      - id: 7cade65d-8488-4075-8db1-81c9ad0e8492
        name: USA, Australia, East Melbourne
    quote: |-
      And it disappeared all of a sudden. This was one of those things that I would say, just, you know. Yes. It's something that would take a little bit of explanation. There was sun shining brightly and it was a clear sky, but there definitely was some object there in the sky.
    text: The cylindrical, silvery object disappeared suddenly during the sighting.
  - id: 76fee7f8-6f23-41d3-b34f-2be3c8c79454
    type: observation
    attestation: second_hand
    provenance_chain:
      origin_kind: anonymous
      origin: an unidentified taxi driver
      origin_ref: speaker-7
    attribution_in_text: false
    location: 00:09:19.5-00:09:23.1
    refs:
      - id: 7cade65d-8488-4075-8db1-81c9ad0e8492
        name: USA, Australia, East Melbourne
    quote: You saw no wings of any sort on the object? No, no. It was a cylindrical object.
    text: The unnamed taxi driver observed no wings on the cylindrical, silvery object.
  - id: 689251c1-0ef3-4c2c-99e2-a7cfce8a29c8
    type: observation
    attestation: second_hand
    provenance_chain:
      origin_kind: anonymous
      origin: an unidentified taxi driver
      origin_ref: speaker-7
    attribution_in_text: false
    location: 00:09:23.7-00:09:35.5
    refs:
      - id: 7cade65d-8488-4075-8db1-81c9ad0e8492
        name: USA, Australia, East Melbourne
    quote: |-
      I see. And when you say hovering, do you mean it was actually stationary, as nearly as you could tell? Stationary, yes. It was stationary. And then all of a sudden, it just took off in a just flashed off and that was the end of it you didn't see any more of it.
    text: |-
      The cylindrical, silvery object remained stationary during the sighting until it suddenly departed at high speed.
  - id: 9d97998e-4454-4068-9303-1f0783992801
    type: opinion
    attestation: first_hand
    speaker:
      id: 3d395b36-3ae5-44da-ad66-ef7744885c7b
      name: Barry Jones
    provenance_chain:
      origin_kind: speaker
      origin: Barry Jones
    attribution_in_text: false
    location: 00:09:57.0-00:10:22.1
    refs:
      - id: 3d395b36-3ae5-44da-ad66-ef7744885c7b
        name: Barry Jones
      - id: 7cade65d-8488-4075-8db1-81c9ad0e8492
        name: USA, Australia, East Melbourne
    quote: |-
      I think the thing that puzzles me about a story like this is not the fact that the gentleman on his fare saw something like this, but the fact that, you know, X number of thousands of people didn't see it. You see, if it's around nine o'clock in the morning, there'd be a lot of people either going to work or wishing they weren't going to work and gazing up at the sky to look away from the problems of the world. And... apparently only a handful of people well two people that we know of but no more than two could see it now
    text: |-
      Barry Jones questions why, if the cylindrical silvery object was observed in clear daylight around 9 a.m. when many people would be outdoors, only a small number of people reported seeing it.
  - id: 52830b88-e72d-418d-ba8b-1d88e667e76a
    type: opinion
    attestation: first_hand
    speaker:
      id: d8a600f3-f9a6-457f-81b6-a7953286ed02
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: false
    location: 00:10:46.9-00:11:05.2
    refs:
      - id: d8a600f3-f9a6-457f-81b6-a7953286ed02
        name: James E. McDonald
    quote: |-
      Again and again, in interviewing witnesses, you hear about these cases sometimes in a quite roundabout fashion, and then you ask the observer, well, were there any other witnesses? And a very common puzzlement arises then. The person says, well, no, that was one of the things that really bothered him. He would have thought that dozens of people must have seen it
    text: |-
      James E. McDonald notes that when interviewing witnesses to UFO events, observers frequently report being puzzled as to why other people did not see or report the same object, despite it apparently being in plain view.
  - id: 76381bae-ed0b-4aae-a4da-617ed4e0862b
    type: opinion
    attestation: first_hand
    speaker:
      id: d8a600f3-f9a6-457f-81b6-a7953286ed02
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: false
    location: 00:11:05.6-00:11:20.0
    refs:
      - id: d8a600f3-f9a6-457f-81b6-a7953286ed02
        name: James E. McDonald
    quote: |-
      And then you say, well, where did you report this? Did you report it to the Air Force? Did you report it to police or so on? And very commonly, the answer is either, no, I didn't report it, fear of ridicule or a little reluctance to have it sensationalized or so on is involved.
    text: |-
      Witnesses frequently cite fear of ridicule or reluctance to have their reports sensationalised as reasons for not reporting UFO sightings to official channels.
  - id: 9fda40a7-f06e-4f63-8b84-c80aa702b6aa
    type: opinion
    attestation: first_hand
    speaker:
      id: d8a600f3-f9a6-457f-81b6-a7953286ed02
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: false
    location: 00:11:20.8-00:11:35.3
    refs:
      - id: d8a600f3-f9a6-457f-81b6-a7953286ed02
        name: James E. McDonald
    quote: |-
      or the kind of thing that you just mentioned is not at all uncommon in the states and evidently here too. One reports it to someone and press or official channels and a certain amount of skepticism leads to a ridiculous rebuke of some sort and then nothing more is heard.
    text: |-
      When witnesses report UFO sightings to press or official channels, skepticism from those channels often leads to ridicule and the matter receives no further attention.
  - id: 8af7f80a-cb68-428f-a2d7-dc404eae9fe6
    type: opinion
    attestation: first_hand
    speaker:
      id: d8a600f3-f9a6-457f-81b6-a7953286ed02
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: false
    location: 00:11:42.8-00:11:53.6
    refs:
      - id: d8a600f3-f9a6-457f-81b6-a7953286ed02
        name: James E. McDonald
      - id: 76c37544-122a-472f-a4f6-a722bbb055e6
        name: Unidentified Flying Objects (UFO)
    quote: |-
      But just to pin that point down, there are cases where dozens of people have seen objects of unconventional sort And so that part of the problem does occur.
    text: |-
      There exist cases of UFO sightings in which dozens of people have observed unconventional objects and subsequently reported them.
  - id: b0acd8fe-2c08-42bc-842b-b4c826ff1c82
    type: observation
    attestation: second_hand
    provenance_chain:
      origin_kind: anonymous
      origin: an unidentified taxi driver
      origin_ref: speaker-7
    attribution_in_text: false
    location: 00:11:59.8-00:12:19.5
    refs:
      - id: 7cade65d-8488-4075-8db1-81c9ad0e8492
        name: USA, Australia, East Melbourne
    quote: |-
      Yes, it was a clear, sunny morning. As a matter of fact, it was in the summertime. There was no haze or any description. And to me, it was as, well, as I said, it was as clear as the nose on your face. And there was absolutely no haze of any description of fog or anything at all like that around the city.
    text: |-
      The unnamed taxi driver recalled that the weather conditions five years prior to the 1967 investigation were clear and sunny, occurring during the summertime with no haze or fog present.
  - id: 244369a2-4fc7-44f8-a40a-054f58a29695
    type: observation
    attestation: second_hand
    provenance_chain:
      origin_kind: anonymous
      origin: an unidentified taxi driver
      origin_ref: speaker-7
    attribution_in_text: false
    location: 00:12:20.4-00:12:34.7
    refs:
      - id: 597e51a2-e43c-4965-9696-37d63d31b8a0
        name: Herald Office
      - id: 7cade65d-8488-4075-8db1-81c9ad0e8492
        name: USA, Australia, East Melbourne
    quote: |-
      And I was adamant about this when I went into the office and recorded it. And the chaps in there, well, you could see they had rye grins on their face as much as to say that you... You don't know what you're talking about. You'd have to know it out of something on the beer.
    text: |-
      The unnamed taxi driver was adamant about the clear conditions when he reported the cylindrical silvery object to the Herald Office, but was met with dismissive attitudes from staff.
  - id: b03cc31d-da00-4581-aad4-7d16c1ce8cee
    type: opinion
    attestation: first_hand
    speaker:
      id: d8a600f3-f9a6-457f-81b6-a7953286ed02
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: false
    location: 00:12:35.3-00:12:53.0
    refs:
      - id: d8a600f3-f9a6-457f-81b6-a7953286ed02
        name: James E. McDonald
    quote: |-
      Yeah, that's extremely unfortunate. That's one of the many patterns that I find in my trip down here that's essentially the same in Australia as in the States. A general rejection of this by persons who usually have almost no knowledge of it but who realize that it sounds at first glance like a lot of nonsense and who jump to that conclusion.
    text: |-
      James E. McDonald notes that a pattern observed during his Australian trip—general rejection of UFO reports by persons with little knowledge of the phenomenon—mirrors similar patterns found in the United States of America.
  - id: c46e9c05-0dc5-4001-b2b1-03ef29034101
    type: opinion
    attestation: first_hand
    speaker:
