      - id: 0b4f81cb-4de6-4d82-a446-eb06829b9785
        name: Sigmund Freud
    quote: |-
      He was, of course, the disciple of Freud, but he's neither the first or the last disciple to break away somewhat from the teachings of his master, which he did when he reached middle life.
    text: |-
      Carl Gustav Jung was a disciple of Sigmund Freud who broke away from Freud's teachings during his middle life.
  - id: a26c6e5c-03ef-44c7-9ce9-050dbfea0654
    type: testimony
    attestation: first_hand
    speaker:
      id: cb674a8e-83b7-42e5-b001-6c6b3c8dd1da
      name: Civil engineer (Wairakei witness)
    provenance_chain:
      origin_kind: speaker
      origin: Civil engineer (Wairakei witness)
    attribution_in_text: false
    location: 00:17:42.2-00:17:57.4
    date: '1957-06-01'
    refs:
      - id: cb674a8e-83b7-42e5-b001-6c6b3c8dd1da
        name: Civil engineer (Wairakei witness)
      - id: 16e0fd5d-2e98-474a-9999-1535d2c76c75
        name: New Zealand, Wairakei
    quote: |-
      I'm a civil engineer, and ten years ago I was employed by contractors building the first geothermal power station in Wairakei in New Zealand. One day I was surveying to set out the pipelines. In the area of the thermal bores.
    text: |-
      A civil engineer employed by contractors building the first geothermal power station in Wairakei, New Zealand, observed a grey object resembling a flying saucer approximately ten years before 1967, during surveying work in the area of thermal bores.
  - id: 3b29c544-e94e-4559-841f-0d95d6fe5809
    type: observation
    attestation: first_hand
    speaker:
      id: cb674a8e-83b7-42e5-b001-6c6b3c8dd1da
      name: Civil engineer (Wairakei witness)
    provenance_chain:
      origin_kind: speaker
      origin: Civil engineer (Wairakei witness)
    attribution_in_text: false
    location: 00:18:02.2-00:18:08.1
    refs:
      - id: cb674a8e-83b7-42e5-b001-6c6b3c8dd1da
        name: Civil engineer (Wairakei witness)
      - id: 16e0fd5d-2e98-474a-9999-1535d2c76c75
        name: New Zealand, Wairakei
    quote: |-
      However, I had a survey assistant at the time, a Maori, who was about 300 feet away.
    text: |-
      The civil engineer was surveying with a survey assistant, a Maori man, approximately 90 metres away.
  - id: 95a7e49d-e19d-4449-9e80-6894ba13ec42
    type: observation
    attestation: first_hand
    speaker:
      id: cb674a8e-83b7-42e5-b001-6c6b3c8dd1da
      name: Civil engineer (Wairakei witness)
    provenance_chain:
      origin_kind: speaker
      origin: Civil engineer (Wairakei witness)
    attribution_in_text: false
    location: 00:18:13.3-00:18:54.9
    date: '1957-06-01'
    refs:
      - id: cb674a8e-83b7-42e5-b001-6c6b3c8dd1da
        name: Civil engineer (Wairakei witness)
      - id: 16e0fd5d-2e98-474a-9999-1535d2c76c75
        name: New Zealand, Wairakei
      - id: f08c0fbc-668d-4732-a84c-75c079282ca2
        name: Flying saucer phenomenon
    quote: |-
      And we both quite independently saw this grey object which for want of a better name I'll call a flying saucer, which arose out of the steam board the way over on the horizon, went vertically upwards, it was saucer shaped, it traversed towards us and away from us, it arose in the east and went towards the northwest at a very high speed, faster than any plane we knew of at the time, and what made it more convincing to us was the fact that there was broken cloud at the time, and we kept on seeing these things that would go behind clouds and reappear.
    text: |-
      The civil engineer and his survey assistant both independently observed a grey, saucer-shaped object that rose out of steam above the horizon, moved vertically upwards, traversed towards and away from them, moved from the east towards the northwest at a very high speed faster than any aircraft known at the time, and passed behind and reappeared from clouds.
  - id: ccd5ce44-4e3e-47cd-a0b6-9c55b4de1f84
    type: observation
    attestation: first_hand
    speaker:
      id: cb674a8e-83b7-42e5-b001-6c6b3c8dd1da
      name: Civil engineer (Wairakei witness)
    provenance_chain:
      origin_kind: speaker
      origin: Civil engineer (Wairakei witness)
    attribution_in_text: false
    location: 00:19:09.1-00:19:22.8
    refs:
      - id: 16e0fd5d-2e98-474a-9999-1535d2c76c75
        name: New Zealand, Wairakei
    quote: |-
      Well, as I say, I was in the area of these in the field of steam boars, which put out a terrific roar, and I don't know whether you've been to Wairakei in New Zealand, but to make anyone else hear you, you have to almost shout in their ear.
    text: |-
      The thermal bore area where the sighting occurred produced a terrific roar of steam, making it difficult to hear sounds from a distance.
  - id: 4d977429-cf3b-4c3f-84e3-2a0571a2816a
    type: measurement
    attestation: first_hand
    speaker:
      id: cb674a8e-83b7-42e5-b001-6c6b3c8dd1da
      name: Civil engineer (Wairakei witness)
    provenance_chain:
      origin_kind: speaker
      origin: Civil engineer (Wairakei witness)
    attribution_in_text: false
    location: 00:19:31.8-00:19:47.6
    refs:
      - id: cb674a8e-83b7-42e5-b001-6c6b3c8dd1da
        name: Civil engineer (Wairakei witness)
      - id: 16e0fd5d-2e98-474a-9999-1535d2c76c75
        name: New Zealand, Wairakei
    quote: |-
      Well, as I say, it arose on our horizon, and our horizon was a hill or ridge about, say, a mile and a half away. and I'd estimate the clouds appearing at at least 500 feet, so the height of the thing must have been more than 500 feet.
    text: |-
      The civil engineer estimated the observed object was at a height of more than approximately 150 metres, based on the horizon being a hill or ridge approximately 1.4 kilometres away and clouds appearing at least 150 metres high.
  - id: b59534fb-6622-4519-9825-a1eff8a71c3d
    type: observation
    attestation: first_hand
    speaker:
      id: cb674a8e-83b7-42e5-b001-6c6b3c8dd1da
      name: Civil engineer (Wairakei witness)
    provenance_chain:
      origin_kind: speaker
      origin: Civil engineer (Wairakei witness)
    attribution_in_text: false
    location: 00:19:48.2-00:19:57.0
    refs:
      - id: cb674a8e-83b7-42e5-b001-6c6b3c8dd1da
        name: Civil engineer (Wairakei witness)
      - id: f08c0fbc-668d-4732-a84c-75c079282ca2
        name: Flying saucer phenomenon
    quote: |-
      It was only a dark grey saucer shaped object and I couldn't return any other detail of it.
    text: |-
      The observed object was a dark grey, saucer-shaped object with no other discernible details.
  - id: e23a276c-b267-4cb8-979d-e0d718c80354
    type: observation
    attestation: first_hand
    speaker:
      id: cb674a8e-83b7-42e5-b001-6c6b3c8dd1da
      name: Civil engineer (Wairakei witness)
    provenance_chain:
      origin_kind: speaker
      origin: Civil engineer (Wairakei witness)
    attribution_in_text: false
    location: 00:19:57.5-00:20:06.7
    refs:
      - id: cb674a8e-83b7-42e5-b001-6c6b3c8dd1da
        name: Civil engineer (Wairakei witness)
    quote: |-
      However when we got back to the construction site, We sort of both talked to my fellow engineers about it, who immediately rubbished us.
    text: |-
      When the civil engineer and his survey assistant returned to the construction site and discussed the sighting with fellow engineers, the other engineers dismissed their account, suggesting they had stopped at a public house.
  - id: 87b6d533-0777-44ee-9065-2f3c53ab7c53
    type: observation
    attestation: first_hand
    speaker:
      id: cb674a8e-83b7-42e5-b001-6c6b3c8dd1da
      name: Civil engineer (Wairakei witness)
    provenance_chain:
      origin_kind: speaker
      origin: Civil engineer (Wairakei witness)
    attribution_in_text: false
    location: 00:20:20.6-00:20:29.7
    refs:
      - id: cb674a8e-83b7-42e5-b001-6c6b3c8dd1da
        name: Civil engineer (Wairakei witness)
    quote: |-
      And the Maori chainman, of course, didn't like to be made fun of in such a way, so he immediately disclaimed he'd seen it.
    text: |-
      The Maori survey assistant, after being ridiculed by the other engineers, subsequently denied having witnessed the sighting.
  - id: c30c7c5d-d3af-4795-ae21-697c60ea92f7
    type: administrative
    attestation: first_hand
    speaker:
      id: cb674a8e-83b7-42e5-b001-6c6b3c8dd1da
      name: Civil engineer (Wairakei witness)
    provenance_chain:
      origin_kind: speaker
      origin: Civil engineer (Wairakei witness)
    attribution_in_text: false
