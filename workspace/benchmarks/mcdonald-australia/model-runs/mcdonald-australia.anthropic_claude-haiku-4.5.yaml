        name: Carl Gustav Jung
    quote: Jung says these are psychic projections of archetypal images, you know.
    text: |-
      Carl Gustav Jung theorises that animal responses to UFO sightings are psychic projections of archetypal images.
  - id: 646d7042-746f-4990-adb4-8fc851c74676
    type: opinion
    attestation: first_hand
    speaker:
      id: d8a600f3-f9a6-457f-81b6-a7953286ed02
