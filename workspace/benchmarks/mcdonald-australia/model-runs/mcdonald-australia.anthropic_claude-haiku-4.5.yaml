  - id: 1b78069f-a48c-4e25-aadb-290f169ca5ca
    type: opinion
    attestation: first_hand
    speaker:
      id: d8a600f3-f9a6-457f-81b6-a7953286ed02
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: false
    location: 00:03:07.0-00:03:32.9
    refs:
      - id: d8a600f3-f9a6-457f-81b6-a7953286ed02
        name: James E. McDonald
      - id: 13b9f841-7678-4346-9918-d8bddafb000c
        name: Ball lightning
    quote: |-
      Yes, that rules out plasmoids of the ball lightning type. You're talking about a stationary object together. Well, we'd have to talk more about that, but let's just take the stationary aspect. The possibility that it's a meteoric fireball is ruled out... Soundless objects hovering stationary in conditions that do not imply ball lightning, rule out meteors. That's an interesting case, the type of case that if we had an opportunity I'd want to pursue further.
    text: |-
      James E. McDonald considers the cigar-shaped object sighting reported by Mrs. Smith to be an interesting case, noting that a stationary, soundless object hovering in clear, non-thunderstorm conditions rules out ball lightning (plasmoids) and meteoric fireballs.
  - id: 9754bb97-902a-41cc-b1cf-a1d8ea2bfb48
    type: observation
    attestation: second_hand
    provenance_chain:
      origin_kind: anonymous
      origin: an unidentified female caller to the radio programme
      origin_ref: speaker-6
    attribution_in_text: false
    location: 00:04:39.8-00:04:50.0
    refs:
      - id: 76c37544-122a-472f-a4f6-a722bbb055e6
        name: Unidentified Flying Objects (UFO)
    quote: |-
      I saw what I thought at first was a shooting star... But instead of sort of going down, it went straight across the sky in a straight line.
    text: |-
      An unnamed female caller reported observing a light in the sky in December that initially appeared to be a shooting star but instead moved straight across the sky in a straight line.
  - id: 05725947-28d1-4276-9057-97a17ba775fe
    type: observation
    attestation: second_hand
    provenance_chain:
      origin_kind: anonymous
      origin: an unidentified female caller to the radio programme
      origin_ref: speaker-6
    attribution_in_text: false
    location: 00:04:51.8-00:05:05.1
    refs:
      - id: 76c37544-122a-472f-a4f6-a722bbb055e6
        name: Unidentified Flying Objects (UFO)
    quote: |-
      Anyway, when it got about, oh, I couldn't tell you how far it had gone, but it stopped for a little while, for a few minutes, and then it sort of went, started moving towards the horizon again after that.
    text: |-
      The light observed by the unnamed female caller stopped moving for a few minutes before resuming movement towards the horizon.
  - id: 35870530-634a-4a7d-bf28-6a862fbe13d2
    type: observation
    attestation: second_hand
    provenance_chain:
      origin_kind: anonymous
      origin: an unidentified female caller to the radio programme
      origin_ref: speaker-6
    attribution_in_text: false
    location: 00:05:07.9-00:05:34.2
    refs:
      - id: 76c37544-122a-472f-a4f6-a722bbb055e6
        name: Unidentified Flying Objects (UFO)
    quote: |-
      In February, now my husband was with me in December, in February, I saw, with my mother-in-law and sister-in-law, we saw two of them. And the first one sort of stopped. It sort of seemed to be hovering. And then we saw another one, and that came up towards the first one, and they appeared to be having some sort of rendezvous.
    text: |-
      In February, the unnamed female caller, her husband, mother-in-law, and sister-in-law observed two lights in the sky that appeared to rendezvous with one another.
  - id: 1ef007ce-9501-4e94-8272-a3eb091e86c6
    type: observation
    attestation: second_hand
    provenance_chain:
      origin_kind: anonymous
      origin: an unidentified female caller to the radio programme
      origin_ref: speaker-6
    attribution_in_text: false
    location: 00:05:36.1-00:05:41.8
    refs:
      - id: 76c37544-122a-472f-a4f6-a722bbb055e6
        name: Unidentified Flying Objects (UFO)
    quote: |-
      And then the second one moved off into the horizon, and the first one just stayed there stationary.
    text: |-
      After the two lights rendezvoused, the second light moved towards the horizon and the first light remained stationary in the sky.
  - id: 46203763-241d-41b1-9434-9936ffb179ee
    type: opinion
    attestation: first_hand
    speaker:
      id: d8a600f3-f9a6-457f-81b6-a7953286ed02
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: false
    location: 00:05:43.7-00:05:53.8
    refs:
      - id: d8a600f3-f9a6-457f-81b6-a7953286ed02
        name: James E. McDonald
    quote: |-
      Well, that's interesting. I might remark that this general category of observation in which it is simply a light in the sky is an extremely dangerous category with respect to misinterpretation
    text: |-
      James E. McDonald considers observation categories of lights in the sky to be extremely dangerous with respect to misinterpretation.
  - id: c3d47b7d-2fc9-4c69-99ab-1d3507ed87ae
    type: opinion
    attestation: first_hand
    speaker:
      id: d8a600f3-f9a6-457f-81b6-a7953286ed02
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: false
    location: 00:06:04.3-00:06:17.3
    refs:
      - id: d8a600f3-f9a6-457f-81b6-a7953286ed02
        name: James E. McDonald
    quote: |-
      I would make the following remark that lots of persons in the US and Australia and elsewhere are making reports just like that of lights that move across, hover, exhibit maneuvers that do not at all match meteors.
    text: |-
      Lights moving across the sky, hovering, and exhibiting manoeuvres that do not match meteoric behaviour are commonly reported by persons in the United States of America, Australia, and elsewhere.
  - id: 270a9ac8-8601-4c58-a631-e31574ef02f2
    type: opinion
    attestation: first_hand
    speaker:
      id: d8a600f3-f9a6-457f-81b6-a7953286ed02
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: false
    location: 00:06:17.7-00:06:27.9
    refs:
      - id: d8a600f3-f9a6-457f-81b6-a7953286ed02
        name: James E. McDonald
    quote: |-
      The stopping that you described is not at all uncommon. The fact that another one came up is scarcely meteoric behavior, and I don't know of any hovering meteors in all history of mankind.
    text: |-
      Hovering behaviour by observed lights in the sky is not uncommon and does not match meteoric behaviour.
  - id: 1f3ace26-b7da-4227-9463-b1f859ec3402
    type: opinion
    attestation: first_hand
    speaker:
      id: d8a600f3-f9a6-457f-81b6-a7953286ed02
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: false
    location: 00:06:33.6-00:06:41.0
    refs:
      - id: d8a600f3-f9a6-457f-81b6-a7953286ed02
        name: James E. McDonald
    quote: |-
      Helicopters, aircraft, of course, you have to have a helicopter if you're going to have it hover, can mislead us at night.
    text: |-
      Helicopters and aircraft, which can exhibit hovering capabilities if helicopters are involved, can mislead observers at night when attempting to identify observed lights.
  - id: f077bd1a-90d1-4148-a40c-a2d637ce1741
