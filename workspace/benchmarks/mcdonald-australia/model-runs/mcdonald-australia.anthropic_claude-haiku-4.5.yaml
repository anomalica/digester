        name: Unidentified Flying Objects (UFO)
    quote: If you think this is not a real phenomenon, then why does it stampede cattle?
    text: |-
      James E. McDonald poses the counter-argument that if UFO sightings are merely psychological phenomena, they would not cause stampedes in cattle herds.
