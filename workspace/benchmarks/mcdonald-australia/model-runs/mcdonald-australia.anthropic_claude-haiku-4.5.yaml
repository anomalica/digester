      - id: 3cbba0cf-9e71-4443-80dd-a0812736e166
        name: Carl Gustav Jung
    quote: |-
      Well, it poses the puzzling question, you see, Barry, that we have to make the assumption that canine, equine, feline, bovine archetypal images are identical with ours. At least it seems to me to pose that problem.
    text: |-
      James E. McDonald questions Carl Gustav Jung's theory of psychic projections by noting that animals would need to share archetypal images identical with humans for the theory to hold.
  - id: 2fdfc236-eb75-4d05-8814-903453830e67
    type: opinion
