      The picture in Australia, with respect to UFO sightings, observations of unconventional objects maneuvering, sometimes quite close to ground, sometimes within tens to hundreds of feet of very credible, reliable observers, is just not appreciably different in Australia, New Zealand, and Tasmania from what it is in the States.
    text: |-
      James E. McDonald found that the pattern of Unidentified Flying Object (UFO) sightings in Australia, New Zealand, and Tasmania—involving observations of unconventional objects maneuvering sometimes close to the ground, sometimes within tens to hundreds of metres of credible, reliable observers—is not appreciably different from the pattern in the United States.
