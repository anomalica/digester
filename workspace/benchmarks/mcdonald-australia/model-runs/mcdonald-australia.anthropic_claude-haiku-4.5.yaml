        name: Drew Pearson
    quote: |-
      Subsequently, however, in some kind of an exchange with Drew Pearson, U Thant made a statement now about four or five days ago, I guess six days ago, that the UFO problem is probably the most important international problem, with the present exception of the Vietnam War.
    text: |-
      U Thant, in an exchange with Drew Pearson approximately 4–6 days before the 1967 radio programme, stated that the UFO problem is probably the most important international problem, second only to the Vietnam War.
