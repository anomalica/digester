    quote: |-
      One of the questions that keeps coming up is the question of Are there sightings of essentially the same type in other parts of the world? Well, it turns out that there are large numbers of reports in the publications of various private UFO investigating groups in England, America, Australia, France, and so on, that quite clearly indicate that
    text: |-
      James E. McDonald's investigative tour of Australia, New Zealand, and Tasmania was undertaken to verify whether Unidentified Flying Object (UFO) sightings of essentially the same type occurred in other parts of the world, as indicated by reports in publications from private UFO investigating groups in England, the United States, Australia, France, and other locations.
