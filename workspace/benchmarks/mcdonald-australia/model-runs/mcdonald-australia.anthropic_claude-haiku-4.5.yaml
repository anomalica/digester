    quote: My father-in-law came out, and he said he thought it was just a plane.
    text: |-
      The unnamed female caller's father-in-law suggested that the observed lights were aeroplanes.
  - id: 2c52a100-42bd-493c-ad45-7c26bfb35eee
    type: opinion
    attestation: second_hand
    provenance_chain:
      origin_kind: anonymous
