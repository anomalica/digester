      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: false
    location: 00:12:53.9-00:13:00.9
    refs:
      - id: d8a600f3-f9a6-457f-81b6-a7953286ed02
        name: James E. McDonald
    quote: |-
      And when these people are in paper press or radio and so on, they tend to filter out a lot of the information that should be getting into scientific channels.
    text: |-
      Press and radio gatekeepers tend to filter out information about UFO reports that should be reaching scientific channels.
  - id: 3fb272cb-d898-4aa6-840d-3a17d79df817
    type: opinion
    attestation: first_hand
    speaker:
      id: d8a600f3-f9a6-457f-81b6-a7953286ed02
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: false
    location: 00:13:31.2-00:13:40.8
    refs:
      - id: d8a600f3-f9a6-457f-81b6-a7953286ed02
        name: James E. McDonald
      - id: d55438a9-31ef-4830-8bc9-a58cc010e726
        name: Carl Gustav Jung's Flying Saucers book
    quote: |-
      The main difficulty is Jung was not at all addressing himself to what is the real UFO problem. He is talking about psychotic types who have some kind of psychic needs to believe.
    text: |-
      Carl Gustav Jung's analysis in his Flying Saucers book primarily addresses psychotic individuals who hold psychological needs to believe in flying saucers, not the core UFO problem.
  - id: 0a7cef78-2d6a-4d47-9f9c-7645e616491d
    type: observation
    attestation: first_hand
    speaker:
      id: d8a600f3-f9a6-457f-81b6-a7953286ed02
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: false
    location: 00:13:41.6-00:13:53.6
    refs:
      - id: d8a600f3-f9a6-457f-81b6-a7953286ed02
        name: James E. McDonald
      - id: 76c37544-122a-472f-a4f6-a722bbb055e6
        name: Unidentified Flying Objects (UFO)
    quote: |-
      And one does see this sort of thing emerging in the cult and crackpot fringe, which is unfortunately very visible, particularly in America, centered around the UFO problem. People who feel that there's a salvation message being brought from Venus and all that sort of rot.
    text: |-
      Fringe cult and crackpot groups organised around the UFO problem exist, particularly in the United States of America, who believe salvation messages are being brought from Venus.
  - id: b9e87d77-91db-432b-bbe6-6f059f429995
    type: opinion
    attestation: first_hand
    speaker:
      id: d8a600f3-f9a6-457f-81b6-a7953286ed02
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: false
    location: 00:13:59.9-00:14:09.0
    refs:
      - id: d55438a9-31ef-4830-8bc9-a58cc010e726
        name: Carl Gustav Jung's Flying Saucers book
    quote: |-
      If you read the book carefully, you find him near the end of that book taking the problem seriously in terms of the possibility there may be something other than what he's talking about in the psychological art.
    text: |-
      Carl Gustav Jung, in his Flying Saucers book, addresses the possibility of a phenomenon other than psychological archetypes near the end of his work.
