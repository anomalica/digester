      Among Unidentified Flying Object (UFO) witnesses, some are incompetent observers who have misidentified something but are genuinely reporting what they saw; some are unreliable persons; many involve genuine misidentifications of planets, ball lightning, fireballs, luminous phenomena, and aircraft.
