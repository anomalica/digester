    quote: |-
      there are lots of cases where animals are present, dogs, horses, cows, and so on. Jung says these are psychic projections of archetypal images, you know. Well, it poses the puzzling question, you see, Barry, that we have to make the assumption that canine, equine, feline, bovine archetypal images are identical with ours.
    text: |-
      James E. McDonald challenged Carl Gustav Jung's psychological explanation for UFO sightings by noting that animals, including dogs, horses, cows, and cattle, react to UFOs, which would require their archetypal images to be identical to those of humans under Jung's framework.
