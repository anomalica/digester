      - id: 37be3389-1968-453c-a2e4-06bfd1b08259
        name: Australia
    quote: |-
      The picture in Australia, with respect to UFO sightings, observations of unconventional objects maneuvering, sometimes quite close to ground, sometimes within tens to hundreds of feet of very credible, reliable observers, is just not appreciably different in Australia, New Zealand, and Tasmania from what it is in the States. Very strong similarity.
    text: |-
      James E. McDonald found that the pattern of UFO sightings in Australia, New Zealand, and Tasmania—including observations of unconventional objects manoeuvring, sometimes within tens to hundreds of metres of credible observers—is not appreciably different from the pattern in the United States.
  - id: 290cd055-389b-4e20-8705-908a65e2727e
