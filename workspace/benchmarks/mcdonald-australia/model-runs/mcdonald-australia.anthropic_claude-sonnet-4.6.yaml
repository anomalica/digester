      I've spent about 12-13 months in the States in interviewing witnesses in key cases
    text: |-
      During the James E. McDonald Australian UFO Investigation Tour (1967), James E. McDonald spent approximately twelve to thirteen months in the United States interviewing witnesses in key UFO cases before travelling to Australia.
