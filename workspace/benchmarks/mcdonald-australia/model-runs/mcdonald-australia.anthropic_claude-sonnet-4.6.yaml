        name: Australia, Victoria, Melbourne
    quote: |-
      just before Christmas last December, I saw... It was a clear night. I saw what I thought at first was a shooting star... But instead of sort of going down, it went straight across the sky in a straight line... it stopped for a little while, for a few minutes, and then it sort of went, started moving towards the horizon again after that.
    text: |-
      An anonymous female caller reported observing, just before Christmas in December of the previous year, a clear-night object that initially resembled a shooting star but moved in a straight horizontal line across the sky before stopping for a few minutes and then moving toward the horizon.
  - id: f471bae0-a5ea-4084-a015-a8dab90cc12c
