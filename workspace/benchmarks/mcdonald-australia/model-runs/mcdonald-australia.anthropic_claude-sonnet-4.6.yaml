    quote: |-
      in February, now my husband was with me in December, in February, I saw, with my mother-in-law and sister-in-law, we saw two of them. And the first one sort of stopped. It sort of seemed to be hovering. And then we saw another one, and that came up towards the first one, and they appeared to be having some sort of rendezvous. And then the second one moved off into the horizon, and the first one just stayed there stationary.
    text: |-
      An anonymous female caller reported that in the following February, she and her mother-in-law and sister-in-law observed two UFOs, one of which hovered and was then approached by a second, the two appearing to have a rendezvous before the second moved toward the horizon while the first remained stationary.
