        name: Australia
    quote: |-
      There's just a little bit of evidence that indicates to me there may even be a few more sightings per square mile or per capita here than in the States. But I wouldn't stand firmly on that feeling that I've gotten.
    text: |-
      James E. McDonald formed a tentative impression that there may be slightly more UFO sightings per square kilometre or per capita in Australia, New Zealand, and Tasmania than in the United States, but did not hold this view firmly.
