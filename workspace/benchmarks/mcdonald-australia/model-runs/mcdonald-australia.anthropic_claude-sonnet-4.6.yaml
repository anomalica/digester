    quote: |-
      The main difficulty is Jung was not at all addressing himself to what is the real UFO problem. He is talking about psychotic types who have some kind of psychic needs to believe.
    text: |-
      James E. McDonald assessed that Carl Gustav Jung's book on flying saucers did not address the real UFO problem, but instead addressed psychotic types with psychic needs to believe in UFOs.
