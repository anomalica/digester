    attribution_in_text: true
    location: 00:32:51.3-00:33:06.2
    refs:
      - id: 5a1cb0b2-29ff-4c3e-8ea0-92ba08791fd2
        name: Project Blue Book
      - id: 2166bb80-114d-4ff3-8b36-28130ade99ba
        name: United States Air Force
      - id: 299cdc01-de4d-4dac-a9bb-3cabfa0aadf2
