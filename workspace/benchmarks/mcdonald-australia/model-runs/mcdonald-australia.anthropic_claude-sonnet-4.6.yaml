        name: Australia
    quote: |-
      One of the questions that keeps coming up is the question of Are there sightings of essentially the same type in other parts of the world?... I'm not entirely happy with taking hearsay evidence. And I've been down here in Australia interviewing witnesses to find out for myself
    text: |-
      James E. McDonald's purpose in coming to Australia was to determine whether UFO sightings of essentially the same type as those in the United States were occurring in other parts of the world, by interviewing witnesses directly rather than relying on published reports.
  - id: 6fc3d794-6a6a-480b-9429-719d376e1a4b
