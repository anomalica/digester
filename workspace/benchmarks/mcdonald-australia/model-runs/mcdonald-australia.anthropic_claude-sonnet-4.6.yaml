      - id: 831e52af-3c75-4e0f-ba84-3a0dbe82ac20
        name: Unidentified Flying Object (UFO)
    quote: |-
      the kind of press releases that are put out about the great expertise that's used, the thorough investigations, and the indication that there are only two or three percent of unknowns, and probably those would be explained, the Air Force insists, if they add a little more data
    text: |-
      Project Blue Book's public communications claimed it used extensive expertise, conducted thorough investigations, and found only two to three percent of UFO reports as unknowns, with the United States Air Force asserting those too would be explained with more data.
  - id: d2156043-afac-4744-8acd-e221e3961dff
    type: opinion
    attestation: first_hand
    speaker:
      id: 299cdc01-de4d-4dac-a9bb-3cabfa0aadf2
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: false
    location: 00:33:24.5-00:33:52.6
    refs:
      - id: 299cdc01-de4d-4dac-a9bb-3cabfa0aadf2
        name: James E. McDonald
      - id: 5a1cb0b2-29ff-4c3e-8ea0-92ba08791fd2
        name: Project Blue Book
      - id: 2166bb80-114d-4ff3-8b36-28130ade99ba
        name: United States Air Force
      - id: 831e52af-3c75-4e0f-ba84-3a0dbe82ac20
        name: Unidentified Flying Object (UFO)
    quote: |-
      you end up as I have ended up. with a conclusion that this problem has been completely lost sight of in America, and perhaps it's not unjustified to suggest that in other parts of the world the large amounts of money that seem to be at the disposal of our Air Force are misconstrued as indicating we've probably done a very large, very extensive, very thorough study of the problem. That is absolutely incorrect.
    text: |-
      James E. McDonald concludes that the UFO problem has been completely neglected in the United States, and that other countries have mistakenly inferred from the United States Air Force's large budget that extensive and thorough UFO studies have been conducted, when this is incorrect.
  - id: 00ac04cf-13ef-4888-81d9-000a0d7f1ffd
    type: observation
    attestation: first_hand
    speaker:
      id: 299cdc01-de4d-4dac-a9bb-3cabfa0aadf2
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: false
    location: 00:33:54.3-00:34:19.0
    refs:
      - id: 299cdc01-de4d-4dac-a9bb-3cabfa0aadf2
        name: James E. McDonald
      - id: 831e52af-3c75-4e0f-ba84-3a0dbe82ac20
        name: Unidentified Flying Object (UFO)
    quote: |-
      the type of sightings that are on record, thousands of cases in the U.S., involve cigar-shaped objects, disks, hovering sometimes at very low altitude... very high accelerations. sometimes high-speed objects moving without any obvious sonic booms... many peculiar luminous phenomena
    text: |-
      UFO cases on record in the United States number in the thousands and include sightings of cigar-shaped and disc-shaped objects, objects hovering at low altitude, very high accelerations, high-speed objects moving without sonic booms, and various luminous phenomena.
  - id: d098b1ae-2a5c-4349-b9da-132dccff3e9d
    type: opinion
    attestation: first_hand
