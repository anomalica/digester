      - id: 37be3389-1968-453c-a2e4-06bfd1b08259
        name: Australia
    quote: |-
      There's a great deal of reluctance to report them. That's exactly the same in the States as it seems to be down here.
    text: |-
      James E. McDonald found a great reluctance among Australian UFO witnesses to report their sightings, mirroring the situation in the United States.
  - id: d9b5bd70-552f-47f8-84bb-9e31af350e7f
    type: opinion
    attestation: first_hand
    speaker:
      id: 299cdc01-de4d-4dac-a9bb-3cabfa0aadf2
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: false
    location: 00:30:47.4-00:31:08.6
    refs:
      - id: 299cdc01-de4d-4dac-a9bb-3cabfa0aadf2
        name: James E. McDonald
      - id: c3f99576-90f5-4099-97b9-506bc0a11289
        name: UFO witness ridicule and underreporting
      - id: 831e52af-3c75-4e0f-ba84-3a0dbe82ac20
        name: Unidentified Flying Object (UFO)
      - id: 37be3389-1968-453c-a2e4-06bfd1b08259
        name: Australia
    quote: |-
      People have been ridiculed and made fun of by official groups, by press and radio and television, and scientists too. There's been a great deal of completely unbased, and I emphasize that, scorning and scoffing about this problem, and that's driven the problem underground.
    text: |-
      UFO witnesses in Australia and the United States have been ridiculed by official groups, the press, radio and television, and scientists, which has driven underreporting of UFO sightings.
  - id: 261e6567-b5d2-4308-af56-3aef6ad91b27
    type: testimony
    attestation: second_hand
    speaker:
      id: 299cdc01-de4d-4dac-a9bb-3cabfa0aadf2
      name: James E. McDonald
    provenance_chain:
      origin_kind: anonymous
      origin: |-
        an unnamed woman UFO witness interviewed by James E. McDonald during his Australian tour
      origin_ref: unnamed-woman-witness
      relay:
        - James E. McDonald
    attribution_in_text: true
    location: 00:31:26.9-00:31:36.9
    refs:
      - id: 299cdc01-de4d-4dac-a9bb-3cabfa0aadf2
        name: James E. McDonald
      - id: 006a59e4-15ee-42e2-bde4-9fcea7f4ed10
