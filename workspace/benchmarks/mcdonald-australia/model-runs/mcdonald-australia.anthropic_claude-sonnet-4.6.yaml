      - id: c3f99576-90f5-4099-97b9-506bc0a11289
        name: UFO witness ridicule and underreporting
      - id: 831e52af-3c75-4e0f-ba84-3a0dbe82ac20
        name: Unidentified Flying Object (UFO)
    quote: |-
      One woman that I interviewed not so long ago pointed out that she described her case in some detail. The reporter asked her why she didn't use more water in what she's been drinking.
    text: |-
      A woman interviewed by James E. McDonald during the James E. McDonald Australian UFO Investigation Tour (1967) reported that when she described her UFO case to a reporter, the reporter asked her why she had not consumed more water in what she had been drinking, implying she was intoxicated.
  - id: 0ba514a2-dd63-412b-a2ab-e7ac14f3da83
    type: opinion
    attestation: first_hand
    speaker:
      id: 299cdc01-de4d-4dac-a9bb-3cabfa0aadf2
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: false
    location: 00:31:41.8-00:32:09.7
    refs:
      - id: 299cdc01-de4d-4dac-a9bb-3cabfa0aadf2
        name: James E. McDonald
      - id: 5a1cb0b2-29ff-4c3e-8ea0-92ba08791fd2
        name: Project Blue Book
      - id: 2166bb80-114d-4ff3-8b36-28130ade99ba
        name: United States Air Force
      - id: c3f99576-90f5-4099-97b9-506bc0a11289
        name: UFO witness ridicule and underreporting
      - id: 831e52af-3c75-4e0f-ba84-3a0dbe82ac20
        name: Unidentified Flying Object (UFO)
    quote: |-
      this whole attitude of ridicule has been engendered and I'm afraid greatly encouraged by the the American Air Force investigation Project Blue Book which has been in operation for about 14 years and which is presented certainly within the States and i've learned down here uh regarded quite highly in other parts of the world and that's completely unjustified
    text: |-
      James E. McDonald considers the attitude of ridicule towards UFO witnesses to have been greatly encouraged by the United States Air Force's Project Blue Book investigation, which has been in operation for approximately fourteen years and is regarded highly in other parts of the world, including Australia, despite being unjustified.
  - id: b268f95c-c487-492e-9376-1db967266e1d
    type: opinion
    attestation: first_hand
    speaker:
      id: 299cdc01-de4d-4dac-a9bb-3cabfa0aadf2
      name: James E. McDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. McDonald
    attribution_in_text: false
    location: 00:32:16.4-00:32:29.7
    refs:
      - id: 299cdc01-de4d-4dac-a9bb-3cabfa0aadf2
        name: James E. McDonald
      - id: 5a1cb0b2-29ff-4c3e-8ea0-92ba08791fd2
        name: Project Blue Book
      - id: 2166bb80-114d-4ff3-8b36-28130ade99ba
        name: United States Air Force
      - id: 831e52af-3c75-4e0f-ba84-3a0dbe82ac20
        name: Unidentified Flying Object (UFO)
    quote: |-
      to put it briefly, it's been done superficially and by persons of extremely low scientific competence. It has to be regarded as essentially zero. It is not a scientific investigation.
    text: |-
      James E. McDonald assessed that Project Blue Book's UFO investigation has been conducted superficially and by personnel of extremely low scientific competence, and is essentially not a scientific investigation.
  - id: 398e683b-6b84-4a98-8191-f0b8b415e2b9
    type: observation
    attestation: second_hand
    speaker:
      id: 299cdc01-de4d-4dac-a9bb-3cabfa0aadf2
      name: James E. McDonald
    provenance_chain:
