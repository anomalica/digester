    quote: |-
      ten years ago I was employed by contractors building the first geothermal power station in Wairakei in New Zealand... we both quite independently saw this grey object which for want of a better name I'll call a flying saucer, which arose out of the steam board the way over on the horizon, went vertically upwards, it was saucer shaped, it traversed towards us and away from us, it arose in the east and went towards the northwest at a very high speed
    text: |-
      A civil engineer observed a grey saucer-shaped object arise from steam near thermal bores at Wairakei, New Zealand, traverse at high speed, pass behind broken cloud and reappear approximately ten years before the 1967 discussion.
