        name: Unidentified Flying Object (UFO)
    quote: |-
      I saw a cigar-shaped object, approximately 1949 this would be. ... It was about 9 to 9:30 p.m. in the evening. ... And it was perfectly stationary. had a dull light inside and then as though it had an electric light globe going up and down from, you know, top to bottom continuously.
    text: |-
      Mrs. Smith observed a stationary cigar-shaped Unidentified Flying Object with a dull internal light and a moving electric-light-globe effect at approximately 21:00 to 21:30 in 1949 over Hawthorne, Melbourne, Victoria.
