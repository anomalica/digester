    quote: |-
      Only A Very Short Time Ago, A Very Interesting Statement Was Made By U Thant To Drew Pearson That The Problem Of The UFOs... saying that the problem of the UFOs is the greatest international problem second only to the present one of the Vietnam War.
    text: |-
      An unnamed source reported that U Thant, the Secretary-General of the United Nations, stated in a conversation with Drew Pearson that the problem of Unidentified Flying Objects (UFOs) is the greatest international problem second only to the Vietnam War.
