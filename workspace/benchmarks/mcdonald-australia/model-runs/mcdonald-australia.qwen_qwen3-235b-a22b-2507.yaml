    quote: |-
      you find yourself ending up with the seemingly absurd, seemingly improbable hypothesis These things may be coming from somewhere else.
    text: |-
      James E. MacDonald believes that Unidentified Flying Objects (UFOs) that pass scrutiny and are not attributable to fireballs or planets may originate from elsewhere beyond Earth, possibly from extraterrestrial sources.
  - id: 2257bbef-da20-4a5c-9309-d441895a6097
    type: opinion
    attestation: first_hand
    speaker:
      id: 235f5561-39eb-41d3-896d-73998454cbe5
