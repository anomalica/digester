        name: New Zealand, West Coast, Fox Glacier
    quote: |-
      I saw two objects spinning in the sky. They were white in colour and disappeared after a while. ... Oh, they seem to be semi-circular. ... the day was the 17th of the 11th '55.
    text: |-
      Speaker 9 observed two semi-circular, white, spinning Unidentified Flying Objects (UFOs) on 1965-11-17 while on a train journey from Christchurch to the west coast of New Zealand toward Fox Glacier.
