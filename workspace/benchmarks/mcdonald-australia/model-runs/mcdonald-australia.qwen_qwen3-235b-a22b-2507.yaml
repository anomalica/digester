      Jung was not at all addressing himself to what is the real UFO problem. He is talking about psychotic types who have some kind of psychic needs to believe.
    text: |-
      James E. MacDonald stated that Carl Gustav Jung's theory focused on psychological projections and psychotic types rather than the physical reality of UFOs.
