      - id: e36319bf-3f74-4dd8-a2fc-648b3612c008
        name: interstellar travel
    quote: |-
      when you confront that distance and look at it in terms of present day terrestrial technology of propulsion... it's very very baffling essentially not possible to explain how any kind of objects surveillance probes or what have you could be got into the earth's environment from an extra solar that is across interstellar distances
    text: |-
      James E. MacDonald considers it very baffling and essentially impossible with present-day or foreseeable terrestrial propulsion technology to explain how any object could travel to Earth from interstellar distances, such as from Tau Ceti or Epsilon Eridani, which are 10 or 15 light years away.
  - id: 38a4637b-8779-4d8a-b3b1-8e63645fd08b
    type: opinion
    attestation: first_hand
    speaker:
      id: 235f5561-39eb-41d3-896d-73998454cbe5
