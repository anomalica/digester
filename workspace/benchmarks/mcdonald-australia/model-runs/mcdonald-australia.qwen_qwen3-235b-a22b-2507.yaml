        name: Unidentified Flying Object (UFO)
    quote: |-
      There's a great deal of reluctance to report them. That's exactly the same in the States as it seems to be down here. People have been ridiculed and made fun of by official groups, by press and radio and television, and scientists too.
    text: |-
      James E. MacDonald noted that witnesses in Australia and New Zealand are often reluctant to report Unidentified Flying Object (UFO) sightings due to fear of ridicule from official groups, the press, and scientists.
