        name: UFO sighting by Brew (1963)
    quote: |-
      we were down in Mowi, in the Gippsland area, talking to a farmer named Brew, who was milking 0700 on February of 1963... The cattle, he was most impressed by the way in which the cattle jumped and stampeded, the dogs started barking, horses broke loose and so on.
    text: |-
      James E. MacDonald investigated a 1963 UFO sighting by a farmer named Brew in Gippsland, Australia, during which animals including cattle, dogs, and horses exhibited panic reactions.
