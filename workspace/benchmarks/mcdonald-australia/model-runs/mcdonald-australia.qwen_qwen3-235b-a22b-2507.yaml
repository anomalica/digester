        name: interstellar travel
    quote: |-
      given another hundred years or a thousand years, terrestrial technology will be an entirely different thing from what it is now... it is entirely conceivable in fact it's almost probable that elsewhere in the galaxy are advanced civilizations
    text: |-
      James E. MacDonald acknowledges that while current science cannot explain interstellar travel, it is conceivable that advanced extraterrestrial civilizations exist elsewhere in the galaxy whose technologies are far beyond terrestrial capabilities.
  - id: d2da2ad0-33ec-400a-9c3d-9b80a7f89d10
    type: opinion
    attestation: first_hand
    speaker:
      id: 235f5561-39eb-41d3-896d-73998454cbe5
      name: James E. MacDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. MacDonald
    attribution_in_text: true
    location: 00:40:17.3-00:40:42.0
    refs:
      - id: 235f5561-39eb-41d3-896d-73998454cbe5
        name: James E. MacDonald
      - id: 918c84c7-5a46-45f6-af5b-8ba7d500299d
        name: advanced extraterrestrial civilization
      - id: e36319bf-3f74-4dd8-a2fc-648b3612c008
        name: interstellar travel
    quote: |-
      It's generally granted by astronomers that far from here, in the reaches of the galaxy, there must be other societies that are essentially sentient beings whose technologies are swept far beyond ours. But what nobody grants and what everybody stalls on... is nobody thinks they can get here.
    text: |-
      James E. MacDonald observes that while astronomers generally accept the possibility of advanced extraterrestrial civilizations in distant parts of the galaxy, there is widespread reluctance to accept that such beings could reach Earth.
  - id: 47f804a6-2c4d-455b-a393-624bb229d986
    type: opinion
    attestation: first_hand
