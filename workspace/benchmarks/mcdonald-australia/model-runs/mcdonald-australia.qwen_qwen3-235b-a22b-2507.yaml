    quote: |-
      I suppose one good place to begin with my remarks on the UFO problem is to tell you briefly why I happen to be down in Australia, New Zealand, and Tasmania, why I've been studying this problem of the Australian UFO sightings. It comes to this, I've spent about 12-13 months in the States in interviewing witnesses in key cases, attempting to unravel this very puzzling and very intriguing mystery.
    text: |-
      James E. MacDonald is investigating Unidentified Flying Object (UFO) sightings in Australia, New Zealand, and Tasmania as part of a global inquiry into similar phenomena.
