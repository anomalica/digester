        name: Australia, Tasmania, Hobart
    quote: |-
      The picture in Australia, with respect to UFO sightings, observations of unconventional objects maneuvering, sometimes quite close to ground, sometimes within tens to hundreds of feet of very credible, reliable observers, is just not appreciably different in Australia, New Zealand, and Tasmania from what it is in the States. Very strong similarity.
    text: |-
      James E. MacDonald found the pattern of Unidentified Flying Object (UFO) sightings in Australia, New Zealand, and Tasmania to be very similar to that in the United States.
  - id: ad7528d7-6cd0-448f-aaa2-265a26cc2c30
    type: observation
    attestation: first_hand
    speaker:
      id: 235f5561-39eb-41d3-896d-73998454cbe5
