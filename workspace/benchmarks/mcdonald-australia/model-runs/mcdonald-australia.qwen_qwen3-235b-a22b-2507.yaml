        name: University of Arizona
    quote: |-
      these are sightings that are being investigated include a lot of quite unconventional phenomena that are not any product of our technology or Australia or Russian or English technology. They are not plasma phenomena they are not Sun dogs and pelicans and all the rest of the things that one hears about. They are beyond the present pale of science
    text: |-
      James E. MacDonald considers Unidentified Flying Objects (UFOs) to include phenomena that are not products of Australian, Russian, or English technology, nor plasma phenomena, Sun dogs, or other conventional explanations, and that are beyond the current understanding of science.
  - id: ad1b7024-c52c-4f9d-b10c-7f93c8130000
    type: opinion
    attestation: first_hand
    speaker:
