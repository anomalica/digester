        name: Unidentified Flying Object (UFO)
    quote: |-
      I cabled Secretary-General U Thant and strongly endorsed his statement, except I expressed disagreement. In my opinion, the UFO problem is the greatest scientific problem, the greatest international problem that stands before us.
    text: |-
      James E. MacDonald strongly endorsed U Thant's statement on Unidentified Flying Objects (UFOs) but expressed disagreement, asserting that in his opinion the UFO problem is the greatest scientific and international problem facing humanity.
