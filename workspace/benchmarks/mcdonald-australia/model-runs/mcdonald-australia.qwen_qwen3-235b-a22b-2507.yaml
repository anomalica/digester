        name: University of Arizona
    quote: |-
      in looking at the situation looking at Australian, American and other sightings, examining the credibility of the observers looking at the content of these observations, I'm afraid that it boils down to to craft of some kind machine-like objects that have been around for 20 years, ignored by all of us scientists, swept aside and ridiculed
    text: |-
      James E. MacDonald concludes from his examination of Australian, American, and other Unidentified Flying Object (UFO) sightings and the credibility of observers that the phenomena likely represent machine-like craft that have been present for at least 20 years and have been ignored or ridiculed by the scientific community.
  - id: 10b76229-0286-46e5-8aa9-8fc3dc403591
    type: opinion
    attestation: first_hand
    speaker:
      id: 235f5561-39eb-41d3-896d-73998454cbe5
      name: James E. MacDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. MacDonald
    attribution_in_text: true
    location: 00:41:27.0-00:41:44.7
    refs:
      - id: 235f5561-39eb-41d3-896d-73998454cbe5
        name: James E. MacDonald
      - id: ee1f47de-fb15-4182-b744-38450414a4bf
        name: Unidentified Flying Object (UFO)
      - id: 2f9bbb67-d00a-4aec-a140-36892a7b77ab
        name: University of Arizona
    quote: |-
      All these years have been wasted scientifically. We've got to get at this right away. We've got to get on it on a global scale. And with the best scientific talent, not just in United States or not just in Australia but the world's best scientific talent has to get on that.
    text: |-
      James E. MacDonald believes that scientific investigation of Unidentified Flying Object (UFO) phenomena has been wasted for decades and that immediate, global scientific attention from the world's best scientific talent is urgently required.
