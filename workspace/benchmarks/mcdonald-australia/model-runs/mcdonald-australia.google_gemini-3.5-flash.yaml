    text: |-
      During the 1957 Wairakei UAP Sighting in New Zealand, Waikato, Wairakei, an anonymous civil engineer and their assistant independently observed a grey, saucer-shaped Unidentified Aerial Phenomena rise vertically from the horizon, travel towards and away from them from the east to the northwest at a high speed.
