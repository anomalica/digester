    quote: |-
      I've been down here in Australia interviewing witnesses to find out for myself, in direct, face-to-face, or in some cases, phone interviewing, exactly what happened in individual cases and what the credibility of the witness is, how witnesses may be, how thoroughly the cases have been and so on down the line.
    text: |-
      James E. McDonald is interviewing witnesses in Australia to personally assess the credibility of Unidentified Flying Object (UFO) reports and the thoroughness of investigations.
