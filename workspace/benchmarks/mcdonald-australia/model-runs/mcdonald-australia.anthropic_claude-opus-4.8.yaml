    quote: |-
      in February, I saw, with my mother-in-law and sister-in-law, we saw two of them. And the first one sort of stopped. It sort of seemed to be hovering. And then we saw another one, and that came up towards the first one, and they appeared to be having some sort of rendezvous. And then the second one moved off into the horizon, and the first one just stayed there stationary.
    text: |-
      The same caller, together with her mother-in-law and sister-in-law, saw two objects in February, one of which appeared to hover while a second came up towards it in an apparent rendezvous, after which the second moved off into the horizon and the first stayed stationary.
