        name: Unidentified Flying Object (UFO)
    quote: |-
      Again and again, in interviewing witnesses, you hear about these cases... And a very common puzzlement arises then. The person says, well, no, that was one of the things that really bothered him... the answer is either, no, I didn't report it, fear of ridicule or a little reluctance to have it sensationalized
    text: |-
      James E. MacDonald found that when he asks witnesses whether other people saw an object, a common puzzlement arises because the witness would have expected many others to have seen it, and witnesses commonly did not report it out of fear of ridicule or reluctance to have it sensationalised.
