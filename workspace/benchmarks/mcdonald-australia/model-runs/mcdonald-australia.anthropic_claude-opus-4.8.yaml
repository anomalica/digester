      James E. MacDonald noted there are many Unidentified Flying Object (UFO) cases where animals such as dogs, horses and cows are present, and argued that Carl Gustav Jung's explanation of these as psychic projections of archetypal images would require assuming that canine, equine, feline and bovine archetypal images are identical with human ones.
