    text: |-
      When James E. McDonald began looking into the Unidentified Flying Object (UFO) problem intensively about a year before 1967, he was surprised to find Project Blue Book consists of a major, a sergeant, and a secretary.
  - id: ac362e6c-592a-43ea-a6ed-633d7c01d992
    type: observation
    attestation: first_hand
    speaker:
