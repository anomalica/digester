        name: Unidentified Flying Objects (UFOs)
    quote: |-
      I'm afraid that it boils down to to craft of some kind machine-like objects that have been around for 20 years, ignored by all of us scientists, swept aside and ridiculed, and nobody has any good knowledge of this problem.
    text: |-
