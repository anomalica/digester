        name: Barry Jones
    quote: |-
      I was sitting at the front of my place in East Preston. On the 8th of March, 1965. And my daughter was with me, married daughter, and she turned around and she said, oh, there's something moving across the sky there, and it looked like a star, but it was moving, and all the other stars were standing still. So I went in and got the binoculars and looked at it, and it was a metallic blue object, iridescent blue, and it was like a spinning top, only the flat type of spinning top. And it was moving in the sky, in the eastern sky, from the south to the north. ... it was about eight o'clock or half past eight at night. ... it was a lovely starry night it was a summer night. ... it was like made out of a metal an iridescent blue color.
    text: |-
      On 1965-03-08 at approximately 20:00 or 20:30 on a starry summer night, Speaker 5, sitting at the front of her home in East Preston, Victoria, Australia, with her married daughter, observed through binoculars a metallic iridescent blue object shaped like a flat spinning top moving from south to north in the eastern sky.
