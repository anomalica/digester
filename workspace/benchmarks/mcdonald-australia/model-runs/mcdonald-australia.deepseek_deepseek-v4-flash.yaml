  - id: 4187980e-b990-4438-b81d-e8be6fa1494c
    type: observation
    attestation: first_hand
    speaker:
      name: Speaker 8
    provenance_chain:
      origin_kind: speaker
      origin: Speaker 8
    attribution_in_text: false
