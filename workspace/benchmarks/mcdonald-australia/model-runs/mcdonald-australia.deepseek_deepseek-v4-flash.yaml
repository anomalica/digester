      - id: bcb81c8c-9384-41e9-a892-29526e9d1a3e
        name: Unidentified Flying Objects (UFOs)
    quote: |-
      We've got to get on it on a global scale. And with the best scientific talent, not just in United States or not just in Australia but the world's best scientific talent has to get on that.
    text: |-
