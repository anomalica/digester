        name: Extraterrestrial hypothesis
    quote: |-
      But what nobody grants and what everybody stalls on and blocks their further thoughts on with respect to UFOs is nobody thinks they can get here.
    text: |-
      Nobody grants that extraterrestrial civilizations can get to Earth, and that blocks further thought on UFOs.
