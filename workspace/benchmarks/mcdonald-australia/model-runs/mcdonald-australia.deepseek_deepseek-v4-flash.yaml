    date: 1957-09-01/1957-11-01
    refs:
      - id: c3460ab5-f65f-44fa-b9ff-376386b546af
        name: Wairakei, New Zealand
      - id: 1c396be5-eb75-40b1-ba08-64d0a6e9c45d
        name: Wairakei New Zealand sighting (~1957)
      - id: 0e660114-9a80-405c-af4e-6b602f3eeb97
        name: James E. McDonald
      - id: 86593cbe-6780-48c8-be2f-39e5d7d0fa6e
        name: Barry Jones
    quote: |-
      I'm a civil engineer, and ten years ago I was employed by contractors building the first geothermal power station in Wairakei in New Zealand. One day I was surveying to set out the pipelines. In the area of the thermal bores. And there's a lot of noise in these bores. However, I had a survey assistant at the time, a Maori, who was about 300 feet away. And I just finished setting up the Theodolite, ready to take a sighting. And we both quite independently saw this grey object which for want of a better name I'll call a flying saucer, which arose out of the steam board the way over on the horizon, went vertically upwards, it was saucer shaped, it traversed towards us and away from us, it arose in the east and went towards the northwest at a very high speed, faster than any plane we knew of at the time, and what made it more convincing to us was the fact that there was broken cloud at the time, and we kept on seeing these things that would go behind clouds and reappear. ... it arose on our horizon, and our horizon was a hill or ridge about, say, a mile and a half away. and I'd estimate the clouds appearing at at least 500 feet, so the height of the thing must have been more than 500 feet. It was only a dark grey saucer shaped object
    text: |-
      Civil engineer Speaker 8, employed by contractors building the first geothermal power station at Wairakei, New Zealand, and a Maori survey assistant both independently observed a dark grey saucer-shaped object arise from the steam board on the horizon, go vertically upwards, traverse towards them and away from them, rise in the east and go towards the northwest at very high speed faster than any known plane, behind broken cloud, at a distance of about a mile and a half, at a height greater than approximately 150 metres.
  - id: b4daa54a-f555-4720-9429-0fa0bce1914c
    type: observation
    attestation: first_hand
    speaker:
      name: Speaker 8
    provenance_chain:
      origin_kind: speaker
      origin: Speaker 8
    attribution_in_text: false
    location: 00:19:09.1-00:19:22.8
    refs:
      - id: c3460ab5-f65f-44fa-b9ff-376386b546af
        name: Wairakei, New Zealand
      - id: 1c396be5-eb75-40b1-ba08-64d0a6e9c45d
        name: Wairakei New Zealand sighting (~1957)
      - id: 0e660114-9a80-405c-af4e-6b602f3eeb97
        name: James E. McDonald
    quote: |-
      Well, as I say, I was in the area of these in the field of steam boars, which put out a terrific roar, and I don't know whether you've been to Wairakei in New Zealand, but to make anyone else hear you, you have to almost shout in their ear.
    text: |-
      Speaker 8 could not hear any sound from the object because he was in the area of steam bores that produced a tremendous roar requiring people to shout to be heard.
  - id: e914570b-97e7-4c37-a537-04acc6fc7fd0
    type: administrative
    attestation: first_hand
