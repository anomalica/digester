      - id: 0e660114-9a80-405c-af4e-6b602f3eeb97
        name: James E. McDonald
      - id: 86593cbe-6780-48c8-be2f-39e5d7d0fa6e
        name: Barry Jones
    quote: |-
      However when we got back to the construction site, We sort of both talked to my fellow engineers about it, who immediately rubbished us. ... And the other engineers, as I say, rubbished us and said, well, we shouldn't have stopped at the pub. And the Maori chainman, of course, didn't like to be made fun of in such a way, so he immediately disclaimed he'd seen it.
    text: |-
      Speaker 8's fellow engineers at the construction site dismissed his sighting, and the Maori survey assistant denied seeing it after being made fun of.
