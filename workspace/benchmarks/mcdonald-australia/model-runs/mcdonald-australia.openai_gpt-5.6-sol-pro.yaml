        name: Unidentified Flying Object (UFO)
    quote: or a little reluctance to have it sensationalized or so on is involved.
    text: |-
      James E. McDonald found that reluctance to have an Unidentified Flying Object (UFO) observation sensationalised sometimes discouraged witnesses from reporting it.
