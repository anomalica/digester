        name: James E. McDonald
      - id: eb648179-8b27-4286-9ee2-9245d033a943
        name: Unidentified Flying Object (UFO)
    quote: |-
      And very commonly, the answer is either, no, I didn't report it, fear of ridicule
    text: |-
      James E. McDonald found that fear of ridicule commonly discouraged witnesses from reporting Unidentified Flying Object (UFO) observations.
