        name: Unidentified Flying Object (UFO)
    quote: |-
      One reports it to someone and press or official channels and a certain amount of skepticism leads to a ridiculous rebuke of some sort and then nothing more is heard.
    text: |-
      James E. McDonald found that sceptical reactions in press or official channels sometimes caused Unidentified Flying Object (UFO) reports to receive no further attention.
