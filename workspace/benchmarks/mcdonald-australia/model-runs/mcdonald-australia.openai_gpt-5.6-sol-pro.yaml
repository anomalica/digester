    quote: |-
      That's one of the many patterns that I find in my trip down here that's essentially the same in Australia as in the States.
      A general rejection of this by persons who usually have almost no knowledge of it but who realize that it sounds at first glance like a lot of nonsense and who jump to that conclusion.
    text: |-
      James E. McDonald found during his 1967 Australia and New Zealand UFO investigative tour that uninformed people in both Australia and the United States often rejected the UFO subject as nonsense.
