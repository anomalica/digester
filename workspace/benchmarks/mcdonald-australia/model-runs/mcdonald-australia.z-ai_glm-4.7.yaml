        name: Unidentified Flying Object (UFO)
    quote: |-
      and naturally, before I sighted this thing, I was extremely skeptical of flying saucers or UFOs myself... And the result has been that since then, I do believe most, although I'm still skeptical of some.
    text: |-
      Speaker 8 was skeptical of Unidentified Flying Objects (UFOs) prior to the sighting but believes in most sightings since, while remaining skeptical of some.
