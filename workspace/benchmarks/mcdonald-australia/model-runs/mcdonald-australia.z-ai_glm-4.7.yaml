      origin: Speaker 8
    attribution_in_text: false
    location: 00:17:42.2-00:18:31.8
    date: '1957-01-01'
    refs:
      - id: 494454c2-95ab-4cd0-a4d5-05d9e46da482
        name: New Zealand, North Island, Wairakei
      - id: f4225134-5519-4f55-bc80-025882e41c9a
        name: Unidentified Flying Object (UFO)
    quote: |-
      I'm a civil engineer, and ten years ago I was employed by contractors building the first geothermal power station in Wairakei in New Zealand... I just finished setting up the Theodolite, ready to take a sighting. And we both quite independently saw this grey object which for want of a better name I'll call a flying saucer, which arose out of the steam board the way over on the horizon, went vertically upwards, it was saucer shaped, it traversed towards us and away from us, it arose in the east and went towards the northwest at a very high speed, faster than any plane we knew of at the time...
    text: |-
      A civil engineer working at the Wairakei geothermal power station and a Maori survey assistant observed a dark grey saucer-shaped object rise out of steam and travel east to northwest at high speed.
  - id: e0136984-bf14-4e89-ba4d-c0a87b1db22a
    type: testimony
    attestation: second_hand
    speaker:
      name: Speaker 8
    provenance_chain:
      origin_kind: named
      origin: Speaker 8
    attribution_in_text: false
    location: 00:18:57.0-00:19:10.6
    date: '1957-01-01'
    refs:
      - id: f4225134-5519-4f55-bc80-025882e41c9a
        name: Unidentified Flying Object (UFO)
    quote: |-
      And as I say, we both saw it quite independently and mutually drew each other's attention to it, even though we were out of air shot. ...what made it more convincing to us was the fact that there was broken cloud at the time, and we kept on seeing these things that would go behind clouds and reappear.
    text: |-
      The saucer-shaped object observed in Wairakei was seen to travel behind broken clouds and reappear.
  - id: 7f374f6d-37f6-4e2b-baee-71fc3ebc2d3e
    type: measurement
    attestation: second_hand
    speaker:
      name: Speaker 8
    provenance_chain:
      origin_kind: named
      origin: Speaker 8
    attribution_in_text: false
    location: 00:19:31.8-00:19:47.6
    date: '1957-01-01'
    refs:
      - id: f4225134-5519-4f55-bc80-025882e41c9a
        name: Unidentified Flying Object (UFO)
    quote: |-
      Well, as I say, it arose on our horizon, and our horizon was a hill or ridge about, say, a mile and a half away. and I'd estimate the clouds appearing at at least 500 feet, so the height of the thing must have been more than 500 feet.
    text: |-
      The saucer-shaped object observed in Wairakei was estimated to be at a height greater than approximately 152 metres (500 feet) based on cloud height.
  - id: 4cb1a14e-9b79-4c41-8371-a3815aab5004
    type: testimony
    attestation: second_hand
    speaker:
      name: Speaker 8
    provenance_chain:
      origin_kind: named
      origin: Speaker 8
    attribution_in_text: false
    location: 00:20:14.8-00:20:29.7
    date: '1957-01-01'
    quote: |-
      And the other engineers, as I say, rubbished us and said, well, we shouldn't have stopped at the pub. And the Maori chainman, of course, didn't like to be made fun of in such a way, so he immediately disclaimed he'd seen it.
    text: |-
      Speaker 8 reported that the Maori survey assistant later disclaimed seeing the object due to ridicule from other engineers.
  - id: d2bc6207-7ab7-4a7a-b665-fc20ce94be0f
    type: opinion
    attestation: second_hand
    speaker:
      name: Speaker 8
    provenance_chain:
