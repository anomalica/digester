        name: Metallic blue spinning object
    quote: |-
      My father-in-law came out, and he said he thought it was just a plane. But planes usually have flashing colored lights on them, don't they at night?
    text: |-
      Speaker 6's father-in-law suggested the object was a plane, but Speaker 6 noted that planes usually have flashing colored lights at night.
  - id: 72356e71-dabb-46c7-bf2c-cc34cab3137e
    type: testimony
    attestation: first_hand
    speaker:
