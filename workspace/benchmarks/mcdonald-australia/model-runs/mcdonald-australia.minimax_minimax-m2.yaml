      That's Professor MacDonald. Oh, very nice. Very nice to meet you too, Mr. James. Well, thanks very much. Talkback 638151. Professor James MacDonald, the University of Arizona, talking about unidentified flying objects. Let's hear from you on 638151. Well, good morning.
