      and when you confront that distance and look at it in terms of present day terrestrial technology of propulsion we're just beginning of course so to speak we're just beginning in that business on earth and that has to be kept in mind but when you when you look at it in terms of present day or foreseeable propulsion techniques it's very very baffling essentially not possible to explain how
    text: |-
      James E. MacDonald states that with present-day or foreseeable terrestrial propulsion technology, it would be very difficult or impossible to explain how objects could be sent to Earth from interstellar distances.
