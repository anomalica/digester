    quote: |-
      Yes, it was a clear, sunny morning. As a matter of fact, it was in the summertime. There was no haze or any description. And to me, it was as, well, as I said, it was as clear as the nose on your face. And there was absolutely no haze of any description of fog or anything at all like that around the city.
    text: |-
      The weather was clear and sunny when Speaker 7 observed the cylindrical object, with no haze or fog around the city.
  - id: 8ba2de63-591b-43c8-930c-1cb8533c50b8
    type: opinion
    attestation: first_hand
    speaker:
      id: 90dee097-5845-4f3a-8493-43e9879a686a
      name: James E. MacDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. MacDonald
    attribution_in_text: false
    location: 00:12:35.3-00:13:00.9
    date: '1967'
    refs:
      - id: 90dee097-5845-4f3a-8493-43e9879a686a
        name: James E. MacDonald
    quote: |-
      Yeah, that's extremely unfortunate. That's one of the many patterns that I find in my trip down here that's essentially the same in Australia as in the States. A general rejection of this by persons who usually have almost no knowledge of it but who realize that it sounds at first glance like a lot of nonsense and who jump to that conclusion. And when these people are in paper press or radio and so on, they tend to filter out a lot of the information that should be getting into scientific channels.
    text: |-
      James E. MacDonald stated that it is extremely unfortunate that many UFO witnesses face rejection and ridicule from press and radio personnel who usually have almost no knowledge of the subject and jump to conclusions, which filters out information that should reach scientific channels.
  - id: 14b77889-ffc7-4157-a565-4c42903a00f2
    type: opinion
    attestation: first_hand
    speaker:
      id: 90dee097-5845-4f3a-8493-43e9879a686a
      name: James E. MacDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. MacDonald
    attribution_in_text: false
    location: 00:13:24.4-00:13:57.2
    date: '1967'
    refs:
      - id: 90dee097-5845-4f3a-8493-43e9879a686a
        name: James E. MacDonald
      - id: a9790215-5ceb-4c6f-a5a5-1ba260ca6e14
        name: Carl Gustav Jung
    quote: |-
      Oh, I've read the book, of course, Barry, and talked it over with quite a few psychologists back in the States. The main difficulty is Jung was not at all addressing himself to what is the real UFO problem. He is talking about psychotic types who have some kind of psychic needs to believe. And one does see this sort of thing emerging in the cult and crackpot fringe, which is unfortunately very visible, particularly in America, centered around the UFO problem. People who feel that there's a salvation message being brought from Venus and all that sort of rot. But this is not the UFO problem. This is just more of that old sort of thing.
    text: |-
      James E. MacDonald stated that Carl Gustav Jung was not addressing the real UFO problem when he wrote about psychotic types with psychic needs to believe, but was instead discussing the cult and crackpot fringe surrounding UFO phenomena.
  - id: db333df0-8042-4f7d-9eeb-63c42b3d3faa
    type: testimony
    attestation: first_hand
    speaker:
      id: 90dee097-5845-4f3a-8493-43e9879a686a
      name: James E. MacDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. MacDonald
    attribution_in_text: false
    location: 00:14:09.4-00:14:35.7
    date: '1967'
    refs:
      - id: 90dee097-5845-4f3a-8493-43e9879a686a
        name: James E. MacDonald
      - id: a9790215-5ceb-4c6f-a5a5-1ba260ca6e14
        name: Carl Gustav Jung
    quote: |-
      Let me just wind up this point. There are lots of cases where animals are present, dogs, horses, cows, and so on. Jung says these are psychic projections of archetypal images, you know. Well, it poses the puzzling question, you see, Barry, that we have to make the assumption that canine, equine, feline, bovine archetypal images are identical with ours. At least it seems to me to pose that problem. If you think this is not a real phenomenon, then why does it stampede cattle?
    text: |-
      James E. MacDonald noted that Carl Gustav Jung's theory about archetypal images fails to explain why UFO sightings cause animals like cattle to stampede, as it would require assuming that canine, equine, feline, and bovine archetypal images are identical to human ones.
  - id: e9c74a5d-4fe2-4c7d-8efe-1452e5757c0b
    type: testimony
    attestation: first_hand
    speaker:
      id: 90dee097-5845-4f3a-8493-43e9879a686a
      name: James E. MacDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. MacDonald
    attribution_in_text: false
    location: 00:14:50.9-00:15:24.8
    date: '1963-02-01'
    refs:
      - id: 90dee097-5845-4f3a-8493-43e9879a686a
        name: James E. MacDonald
      - id: c8095ec0-8d08-4794-b31b-11ae940b324b
        name: Mowi, Gippsland, Victoria, Australia
      - id: 26bdd91a-dcf0-4557-b469-ebf0c476587d
        name: 1963 cow milking incident at Mowi
      - id: f33a7368-59e6-4a16-bb65-e83461f9a87e
        name: Disc-shaped object
      - id: 8e5cbaf4-096c-4745-b10c-1a061b05e368
        name: Victorian Flying Saucers Society
    quote: |-
      Let me tell you, we were down with the Melbourne UFO group, the Victorian Flying Saucer Society, very helpfully have been taking me around the countryside to some of the key witnesses. We were down in Mowi, in the Gippsland area, talking to a farmer named Brew, who was milking 0700 on February of 1963. All of a sudden, coming out of the overcast was a large disc-like object which hovered over a tree 100 yards away. I was on the spot a few days ago looking at it. The cattle, he was most impressed by the way in which the cattle jumped and stampeded, the dogs started barking, horses broke loose and so on.
    text: |-
      James E. MacDonald described witnessing animal panic reactions (cattle jumping and stampeding, dogs barking, horses breaking loose) during a UFO sighting while visiting a farmer named Brew in Mowi, Gippsland area in February 1963 at 7 a.m. while the farmer was milking.
  - id: f0468413-f1ae-4660-855d-7a48d871fbdd
    type: testimony
    attestation: first_hand
    speaker:
      id: 90dee097-5845-4f3a-8493-43e9879a686a
      name: James E. MacDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. MacDonald
    attribution_in_text: false
    location: 00:15:56.1-00:16:14.1
    date: '1967-06-07'
    refs:
      - id: 90dee097-5845-4f3a-8493-43e9879a686a
        name: James E. MacDonald
      - id: 47cb6bfa-2495-4707-996a-133797f76d0e
        name: United Nations
      - id: 6421b64f-ca54-4372-9749-06f013aced6e
        name: Outer Space Affairs Group
      - id: 709c0b46-1a36-47f4-a43b-bda30e117fa2
        name: U Thant
    quote: |-
      Yes, that's a very important point. On the 7th of June, I was at the United Nations speaking to the Outer Space Affairs Group about the UFO problem, submitted some formal statements to them, urging UN action on the UFO problem. I had a date to see U Thant, but the Mideast crisis interfered.
    text: |-
      On 7 June, James E. MacDonald spoke at the United Nations to the Outer Space Affairs Group about the UFO problem, submitting formal statements and urging UN action on the UFO problem.
  - id: d7f9eb97-d328-481c-a43a-b7e639825fda
    type: testimony
    attestation: first_hand
    speaker:
      id: 90dee097-5845-4f3a-8493-43e9879a686a
      name: James E. MacDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. MacDonald
    attribution_in_text: false
    location: 00:16:15.3-00:16:35.9
    date: '1967-08-05'
    refs:
      - id: 709c0b46-1a36-47f4-a43b-bda30e117fa2
        name: U Thant
      - id: 7dbeeb92-8583-485e-8729-05274a142d24
        name: Drew Pearson
    quote: |-
      Subsequently, however, in some kind of an exchange with Drew Pearson, U Thant made a statement now about four or five days ago, I guess six days ago, that the UFO problem is probably the most important international problem, with the present exception of the Vietnam War. rather interesting and somewhat striking statement.
    text: |-
      U Thant made a statement through Drew Pearson approximately four to six days before the interview, stating that the UFO problem is probably the most important international problem, with the present exception of the Vietnam War.
  - id: 7e2bfaa9-c5e4-4bec-bbd5-b7a3b1c69a3c
    type: testimony
    attestation: first_hand
    speaker:
      id: 90dee097-5845-4f3a-8493-43e9879a686a
      name: James E. MacDonald
    provenance_chain:
      origin_kind: speaker
      origin: James E. MacDonald
    attribution_in_text: false
    location: 00:16:36.3-00:16:55.7
    date: '1967-08-06'
    refs:
      - id: 90dee097-5845-4f3a-8493-43e9879a686a
        name: James E. MacDonald
      - id: 709c0b46-1a36-47f4-a43b-bda30e117fa2
