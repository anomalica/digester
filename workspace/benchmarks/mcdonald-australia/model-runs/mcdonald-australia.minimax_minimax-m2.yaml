        name: United States
      - id: cc8b0e5a-6427-4226-9904-c7607a23b949
        name: Meteoric fireball
    quote: |-
      Well, that's interesting. I might remark that this general category of observation in which it is simply a light in the sky is an extremely dangerous category with respect to misinterpretation, but taking what you've described for the moment as a very accurate description, since we can't, again, probe and question very carefully here, I would make the following remark that lots of persons in the US and Australia and elsewhere are making reports just like that of lights that move across, hover, exhibit maneuvers that do not at all match meteors.
    text: |-
      James E. MacDonald stated that observations of lights in the sky are an extremely dangerous category with respect to misinterpretation, but noted that reports of lights moving across, hovering, and exhibiting maneuvers that do not match meteors are common in both the US and Australia.
  - id: 52e6b810-7ac7-490f-b5b7-4c11a9589016
    type: testimony
    attestation: first_hand
    speaker:
      name: Speaker 6
    provenance_chain:
