      I went to the Herald Office to report it. And uh fellas at the Herald Office. thought I was a bloomin' nut, I think. But there definitely was some object there. And it disappeared all of a sudden.
    text: |-
      Speaker 7 reported the cylindrical object sighting to the Herald Office, where the staff thought he was crazy.
  - id: 9e9aef8b-ef07-43db-a1cc-75c314680a90
    type: testimony
