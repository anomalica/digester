        name: James E. MacDonald
    quote: |-
      Typically, yes, but still there are planes, reconnaissance planes and photo planes with odd and unusual lights, and this category of report is not the one on which the strong conclusions need now to be built. Nevertheless, it appears that you've seen something of a rather unconventional nature in that instance.
    text: |-
      James E. MacDonald stated that while planes typically have flashing colored lights, reconnaissance planes and photo planes can have odd and unusual lights, and this category of report requires careful analysis.
