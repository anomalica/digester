        name: James E. MacDonald
    quote: |-
      It's generally granted by astronomers that far from here, in the reaches of the galaxy, there must be other societies that are essentially sentient beings whose technologies are swept far beyond ours. But what nobody grants and what everybody stalls on and blocks their further thoughts on with respect to UFOs is nobody thinks they can get here.
    text: |-
      James E. MacDonald states that astronomers generally grant that advanced societies with technologies far beyond ours must exist elsewhere in the galaxy, but nobody believes they could travel here.
  - id: 093d62a3-ba2b-4fd5-a074-1505096c974c
