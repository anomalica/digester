        name: James E. MacDonald
    quote: |-
      When you look at these various hypotheses, psychological, advanced technology, hoax, fabrication, fraud, poorly understood geophysical phenomena, you run through all of those. This is certainly what I've done in the past year of checking. You find yourself ending up with the seemingly absurd, seemingly improbable hypothesis These things may be coming from somewhere else.
    text: |-
      James E. MacDonald states that after examining various hypotheses about UFOs, including psychological, advanced technology, hoax, fabrication, fraud, and poorly understood geophysical phenomena, he concluded the seemingly absurd hypothesis that these things may be coming from somewhere else.
  - id: 82e545f6-b33a-444c-8ae1-df4acf343a0f
    type: testimony
    attestation: first_hand
    speaker:
      id: 90dee097-5845-4f3a-8493-43e9879a686a
