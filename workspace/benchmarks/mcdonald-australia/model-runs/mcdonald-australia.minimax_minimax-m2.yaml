    refs:
      - id: 90dee097-5845-4f3a-8493-43e9879a686a
        name: James E. MacDonald
    quote: |-
      All that we know about the astronomy and planetary meteorology of the solar system seems to argue against a planetary, that is, intrasolar system origin of the objects. All that we know about the structure of the galaxy makes quite clear that the next nearest source of origin is quite an embarrassing number of light years away.
    text: |-
      James E. MacDonald states that astronomical knowledge about the solar system and galactic structure argues against an intrasolar system origin for UFOs, with the nearest possible source being many light years away.
  - id: ef8eb5ee-8db6-41a0-ae47-3a56e79200aa
