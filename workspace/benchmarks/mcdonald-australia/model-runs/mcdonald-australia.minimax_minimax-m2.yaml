    quote: |-
      Yes. Well, just before Christmas last December, I saw... It was a clear night. I saw what I thought at first was a shooting star... But instead of sort of going down, it went straight across the sky in a straight line.
    text: |-
      Speaker 6 observed a light in the sky just before Christmas in December that initially appeared as a shooting star but moved straight across the sky in a straight line rather than downward.
  - id: b7e60f03-19b3-4535-8bd5-010899ef81aa
    type: testimony
    attestation: first_hand
