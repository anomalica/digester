    date: '1966-12-01'
    refs:
      - id: 1e2876ab-79d5-43b1-911e-5d8217707210
        name: Metallic blue spinning object
    quote: |-
      Anyway, when it got about, oh, I couldn't tell you how far it had gone, but it stopped for a little while, for a few minutes, and then it sort of went, started moving towards the horizon again after that.
    text: |-
      The object observed by Speaker 6 in December stopped for a few minutes and then started moving toward the horizon again.
  - id: 572c8473-c7e4-4f2c-adfb-9d4b95f526df
    type: testimony
    attestation: first_hand
