    quote: |-
      Stationary, yes. It was stationary. And then all of a sudden, it just took off in a just flashed off and that was the end of it you didn't see any more of it.
    text: |-
      The cylindrical silvery object observed by Speaker 7 was stationary (hovering) and then suddenly disappeared after taking off.
  - id: 4bc9202d-a736-438c-8268-41d9f4a0b5be
