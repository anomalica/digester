    location: 00:38:04.0-00:38:15.7
    quote: |-
      All that we know about the structure of the galaxy makes quite clear that the next nearest source of origin is quite an embarrassing number of light years away.
    text: The next nearest source of origin is an embarrassing number of light years away.
