    attribution_in_text: true
    location: 00:39:36.1-00:39:55.1
    quote: |-
      you have only looked back a hundred years and things like radio, television, lasers, nuclear fusion, fission, countless other technological devices and systems that we take for granted now are of course incredible a hundred odd years ago
    text: |-
      Technologies such as radio, television, lasers, nuclear fusion, and nuclear fission, which are taken for granted in 1967, would have been incredible a hundred years earlier.
