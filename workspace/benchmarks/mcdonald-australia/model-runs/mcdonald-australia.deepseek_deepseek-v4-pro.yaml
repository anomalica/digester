    attribution_in_text: true
    location: 00:39:24.2-00:39:33.2
    quote: |-
      You have to realize that given another hundred years or a thousand years, terrestrial technology will be an entirely different thing from what it is now.
    text: |-
      Given another hundred years or a thousand years, terrestrial technology will be an entirely different thing from what it is now.
  - id: 0370db0c-667f-4d43-9907-66e0674b3498
    type: observation
    attestation: first_hand
