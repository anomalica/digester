    location: 00:40:03.6-00:40:30.2
    quote: |-
      it is entirely conceivable in fact it's almost probable that elsewhere in the galaxy are advanced civilizations ... It's generally granted by astronomers that far from here, in the reaches of the galaxy, there must be other societies that are essentially sentient beings whose technologies are swept far beyond ours.
    text: |-
      It is almost probable that elsewhere in the galaxy are advanced civilisations of sentient beings whose technologies are swept far beyond those of Earth.
  - id: 90281f73-53cb-4c2c-85d9-914d07f205d8
