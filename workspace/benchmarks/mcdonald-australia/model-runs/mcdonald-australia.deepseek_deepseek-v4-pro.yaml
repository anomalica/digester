    location: 00:39:00.4-00:39:10.4
    quote: |-
      but the rub there the thing to keep your eye on seems to me is the proviso in terms of our present knowledge or foreseeable technology
    text: |-
      The key proviso to the interstellar travel impossibility is that it is framed in terms of present human knowledge or foreseeable technology.
  - id: 80ed575c-9251-47a1-b0ff-cc36d027a815
    type: opinion
    attestation: first_hand
