    quote: |-
      when you look at it in terms of present day or foreseeable propulsion techniques it's very very baffling essentially not possible to explain how any kind of objects surveillance probes or what have you could be got into the earth's environment from an extra solar that is across interstellar distances
    text: |-
      Explaining how any kind of objects or surveillance probes could reach Earth across interstellar distances is essentially not possible using present day or foreseeable propulsion techniques.
  - id: 368ec1d8-75cb-41a9-95c9-54e37e650bf1
