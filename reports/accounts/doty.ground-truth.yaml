  - title: The New Mexico Air National Guard A-7 pilot with contact in the air and on the ground
    subject: An unnamed Air National Guard A-7 jet pilot in New Mexico who reported contact both airborne and on the ground
    summary: Mentioned in passing as an illustration of why a cleared witness cannot be given the standard cover story. Doty
      says he handled the whole case of an Air Force pilot flying A-7s with the New Mexico Air National Guard who had contact
      in the air and on the ground. He could not tell the pilot it had been Air Force hardware because the pilot would have
      known otherwise, so he told him he had probably encountered a real object that then went away. Because such a report
      takes a pilot off flying status and the man wanted to fly again, Doty had him sign an undertaking never to talk about
      it, and he agreed. A whole case compressed into eight lines, with no highlighting from the human reviewer. It may or
      may not be the same man as the A-7D captain in the fishing account 3,100 lines later; the transcript neither states
      nor rules it out, and the details given differ.
