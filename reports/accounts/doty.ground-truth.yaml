    - account: Chris Ramsay's account of David Copperfield's father's 1945 Roswell identity card (lines 1689-1740)
      claims_orphaned: 1 claim, correctly attributed to Chris Ramsay as speaker. But 51 lines of narration produced one claim,
        and Doty's repeated statements that he had never heard any of it are not extracted.
      why_it_matters: The speaker field saves this from outright misattribution, which is worth noting - it is the one structural
        defence the current schema has. But 3 of 388 claims name Ramsay as speaker, so the mechanism is barely exercised,
        and it records who uttered a sentence, not whose story it is.
    - account: Doty's two truths and a lie (lines 4441-4497) - the frame itself
      claims_orphaned: 'ZERO claims in the frame''s own span, but 3 sub-telling claims sit inside it, each stated as flat
        fact: ''In 1980, Richard Doty and a friend saw an object following a tram up to Sandia Crest''; ''In approximately
        1965, Richard Doty wrestled at the 130-pound weight class...''; ''In 2014, Richard Doty went to Laos with a group
        searching for evidence of POWs at Lima Site 85 and found remnants indicating something.'' A search of all 388 claim
        texts and quotes for ''two truths'' or the lie frame returns nothing.'
      why_it_matters: The worst single loss in the digest. Doty's own stated condition is that exactly one of the three is
        false and he will not say which. The digest asserts all three as first_hand fact and promotes two of them to event
        nodes ('Albuquerque tram UFO sighting (1980)', 'Laos POW search (2014)'). A downstream article would cite a UFO sighting
        that its source flagged as possibly fabricated, and there is no data anywhere in the file from which the error could
        be caught.
      why_the_extractor_missed_it: The frame is a property of the TELLING, not of any fact inside it - which is precisely
        the thing an account layer exists to hold and a claim layer structurally cannot. No amount of better claim extraction
        fixes this.
  claim_binding: '"No. Neither refs nor location will bind a claim to its account, and I checked both.\n\nBy refs: only 88
    of 388 domain claims (23%) reference ANY event node; 300 reference none. 43 claims have EMPTY refs and are attached to
    nothing at all. 283 claims (73%) reference ''Richard Doty'', which is uninformative in a Doty interview. Of the 17 event
    nodes, 6 are referenced by zero claims (Doty UFO briefing 1979, Kingman crash 1953, Laughlin UFO convention 2019, Warm
    Springs crash incident, Sedona time portal incident, Sandia time travel experiments) - correct labels with nothing filed
    under them. Where refs do exist they can be wrong across accounts: ''Kirtland AFB landing incident (1979)'' is referenced
    by 29 claims spanning four different ground-truth accounts, including all 10 claims of the Warm Springs, Nevada callout,
    whose claim text was rewritten around the wrong incident. The result is not merely lost structure but false statements:
    ''The government contracted a trucking company from Hawthorne, Nevada to transport the craft from the Kirtland Air Force
    Base landing incident (1979) on a flatbed.''\n\nBy location: no. Three failures, each independently fatal.\n(a) Granularity.
    Location spans have a median of 9.5 seconds (p90 25.2s, max 123.8s) against a 14,252-second recording - 0.07% of the source.
    They are sentence pointers, not narrative pointers. 376 of 388 locations are distinct, so they group nothing.\n(b) Interleaving.
    Accounts are not contiguous. The Sandia guard account''s 20 claims sit at transcript lines 383-390 and then 770-878, with
    39 claims from three unrelated accounts (the 1979 briefing, the FBI visits, Laughlin 2019) in the gap. The abducted sergeant''s
    claims sit at 2204-2242 and 2425-2962 with the surveillance-night account''s 9 claims in between. Worse, 8 claims about
    that sergeant sit at lines 163-222 - roughly 90 minutes earlier in the recording, separated by six unrelated accounts.
    No contiguous partition of the timeline can recover any of these; the timestamps are correct and still insufficient, because
    narration order is not account order.\n(c) The field is not even reliably populated. 3 claims have a null location. 3
    more have quote text in the location field where a timestamp should be (''we had a unit within a 7602nd Air Intelligence
    Wing at Fort Belvoir...''). 6 of 388 (1.5%) cannot be placed in the recording at all, and one of those is a Laughlin claim
    whose account already has a claimless node.\n\nMethod note: I recovered ground truth line numbers for claims by exact-matching
    269 of the 388 quotes into the transcript (69%), then calibrating timestamp-to-line by piecewise interpolation on those
    anchors. Only 1 inversion in 269 anchors, and the 42 fuzzy-matched claims agree with the interpolation to a median of
    5 lines - so the binning below is sound, and the point stands that this reconstruction required the source text. Nothing
    in the digest alone permits it."'
  verdict: '"Of 39 ground-truth accounts, 13 have some corresponding event node and 26 have none; 118 of the 388 domain claims
    fall inside an account with no container, and only 88 claims in total reference any event node at all. What survives is
    the entity layer - people, places, aircraft, agencies - so a 151-line counterintelligence operation becomes ten facts
    about an F-117, and an unnamed captain''s thirteen hours of missing time becomes five facts about a misspelled lake. The
    misses share one property above all others: no named protagonist. Every account whose subject is a named person or a famous
    case got a node; almost every account whose subject is ''a civilian'', ''a sergeant'', ''a rancher'', ''two investigators''
    did not, because this extractor names events after entities it already has rather than after episodes it detects. Two
    consequences go beyond lost structure: claims from the Warm Springs, Nevada crash were rewritten to assert they happened
    at Kirtland Air Force Base, and all three items of Doty''s ''two truths and a lie'' - one of which he states is false
    - are recorded as flat first-hand fact, two of them promoted to event nodes."'
