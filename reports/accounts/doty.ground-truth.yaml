  - title: The Sandia security guard and the craft that landed over a Kirtland weapons bunker
    subject: An unnamed civilian Sandia National Laboratories security guard, a former army military policeman, who reported
      a saucer landing and two entities at an experimental underground nuclear weapons bunker in a classified area of Kirtland
      Air Force Base
    summary: 'Doty was the case agent. Responding to an alarm on a bunker built with blast doors and a platform that lowered
      weapons sixty feet underground, the guard saw a saucer-shaped craft hover and land; his patrol vehicle engine, mobile
      radio and portable radio all failed. Two entities in silvery metallic suits and helmets, with arms disproportionate
      to their bodies, heavy boots and devices in both hands, walked to the front of the bunker. When he chambered a round
      in his shotgun the weapon left his hands and dropped to the ground, and he could not draw his sidearm; the entities
      returned to the craft and it left. Doty checked radar approach control, which had an unknown return in the same period;
      the guard was hypnotised by psychologists and still could not describe how the entities emerged, and passed a polygraph
      with no deception indicated. He had a twelve-to-fourteen-year unblemished record, personnel reliability programme status
      and a special access clearance covering an area involving alien technology, so a cover story was not viable and a senior
      agent took the case over. The narration is split: it is opened at line 383, interrupted by the indoctrination briefing
      and three unrelated digressions, and resumed at line 754.'
    confidence: high
