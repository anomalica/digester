        receipt of the MJ-12 document at headquarters''; ''The FBI determined that the postmark on the MJ-12 document was
        not a genuine postal marking.'''
      why_it_matters: This is a chain-of-custody narrative - dead drop, seizure, courier, headquarters, silence - and the
        sequence IS the evidence. Reduced to 13 facts about a document node, the causal chain is unrecoverable. Doty's conclusion
        (a DIA Special Means Committee deception operation) sits as one more fact beside the postmark analysis, with nothing
        marking it as his inference from the preceding chain rather than an observation.
      why_the_extractor_missed_it: 'There IS a strong named entity here, but it is a document, not a person or an event, so
        the extractor made a document node and hung everything on it. The account has a named subject and still got no event
        node, which shows the failure is not only about anonymity: the extractor produces event nodes only for things already
        labelled ''incident'', ''case'' or ''crash''.'
    - account: The paid prostitute informants around the Nellis range and the F-117 major who talked (lines 1400-1551)
