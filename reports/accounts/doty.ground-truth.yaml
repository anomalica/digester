  - title: The taping of the UFO Cover-Up television special in which Doty appeared as Falcon
    subject: Doty's scripted on-camera appearance under the alias Falcon, alongside Bob Collins as Condor, recorded about
      fifteen months before broadcast as part of a joint OSI and FBI operation
    summary: 'Doty corrects the interviewer twice: the programme was not live, and it was recorded about fifteen months before
      it aired, in October 1987. It was part of another operation, run by OSI with the FBI, intended to draw out somebody
      who had disclosed classified information to a third party; he was not involved in that side and did not know at the
      time what would happen a year later. He worked from a script. Most of what he said, he maintains, was real, with some
      misinformation mixed in that he no longer remembers. Challenged on the strawberry ice cream detail he insists it was
      real, tracing it to Linda Howe''s 1980 interview with the captain said to have lived with EBE-1 from 1947, while agreeing
      that its function was that nobody would believe it. He is sure the project had a name but cannot recall it.'
