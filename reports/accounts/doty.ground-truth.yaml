        one person - and the graph cannot say she is one person. The human reviewer highlighted none of these 149 lines, so
        this loss is invisible to review as well.
      why_the_extractor_missed_it: Unnamed protagonist ('a female dependent wife of a captain'), and the episode moves across
        four locations. With no person node to name the event after, each geographic move started a new cluster of place-anchored
        claims.
    - account: The MJ-12 document reaching Jaime Shandera and the seizure of Bill Moore's copy in San Francisco (lines 1134-1240)
      claims_orphaned: '13 claims, the largest orphan block. All hang off the document node ''Majestic 12 (MJ-12) documents''
