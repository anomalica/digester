  - title: The three uniformed Air Force officers at the 2019 Laughlin UFO convention
    subject: Two captains and a senior master sergeant in Air Force uniform in the audience at a UFO convention where Doty
      spoke about Area 51, and his exchange with the female captain
    summary: Robert Dean pointed out three people in Air Force uniform in the audience at the 2019 Laughlin convention. Doty
      introduced himself; they said they already knew who he was, and the female captain said they were there because they
      were interested in the subject. When he said there was no classified material in his briefing, she replied that they
      would decide that later. He told George Knapp, who had already seen them, and suggested Knapp ask for an interview;
      one of the officers stood at the back during Doty's interview with Knapp and attended his presentation. They stayed
      two to four days. The episode grows directly out of the preceding account - the OSI contractor who telephoned him in
      2018 was also at this convention - and it too interrupts the indoctrination-briefing narration.
