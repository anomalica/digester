  - title: Recruiting and handling Bill Moore inside the UFO research groups
    subject: Bill Moore, a UFO researcher already inside the civilian groups, recruited and run by Doty as a reporting asset
      and later used to pass disinformation
    summary: 'Doty says there is a Bill Moore in every UFO group, and that Moore was a person he recruited and handled, already
      a member, initially tasked only to report back essential elements of information affecting national security. Disseminating
      disinformation came later. He says he was part of providing Moore with disinformation to send into the groups to discredit
      them, and that somebody in the CIA was doing the same, because Moore was being handled by both: Moore had contacts inside
      the Soviet Union and knew scientists in the Soviet Academy of Sciences, which made him a very important asset. Another
      person was actually feeding Moore the disinformation that reached the groups. Doty names this as the one part of his
      service he still regrets, while maintaining he did everything by the book.'
