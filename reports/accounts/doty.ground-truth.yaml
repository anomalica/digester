  - title: Digging up a South Dakota rancher's buried craft for Hal Puthoff's institute
    subject: An unnamed rancher who buried an object that crashed on his land in the 1950s or early 1960s and told nobody,
      his grandson who eventually passed word on, and the excavation arranged decades later
    summary: Working for Hal Puthoff, Doty was sent to interview people with connections. A UFO had crashed on a rancher's
      land, he thinks around 1958, and the rancher buried it and never told anyone; both the grandfather and the father were
      dead, and only the grandson was left, who passed word along a chain that reached Puthoff. Doty went to South Dakota
      with others from the laboratory to establish what had been buried. The only marker the grandson had was a patch where
      nothing would grow however much it was watered - that was the place. He says they saw a lot, that somebody saw what
      was taken out of the ground, and that it was turned over to the government, probably going to Groom Lake. He places
      the dig around 2000 to 2002 and the site in the south-west corner of the state south of Keystone, a couple of hundred
      miles from Ellsworth Air Force Base and near a later Minuteman site, and says he set everything up but handled and analysed
      nothing.
