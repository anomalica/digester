  - title: The civilian who saw the Aurora prototype and was given an invented UFO sighting
    subject: An unnamed civilian who witnessed what Doty identifies as the first prototype of the Aurora aircraft, and the
      fabricated UFO sighting he was given to account for it
    summary: 'Asked directly what he passed on knowing it to be false, Doty gives this case. A civilian saw a real experimental
      craft, which Doty identifies as the first Aurora prototype, developed in the same period the F-117 was at Tonopah. OSI
      invented a UFO sighting said to have occurred at the same time as the real one, and Doty fed it to him: everything he
      told the man about that UFO was false, it came down from headquarters, and he probably embellished it further himself
      to be convincing. The man was thoroughly convinced, and Doty then had him sign a non-disclosure agreement. The clearest
      first-person admission in the interview of a manufactured UFO event injected into the record, attached to a witness
      who has never been identified.'
    confidence: high
