  - title: The indoctrination briefing into the programme Doty calls NineQ, with the Roswell and Kingman recovery films
    subject: A several-hour classified briefing at the Air Force special security office at Kirtland on US government contact
      with extraterrestrials from 1947, at which Doty says films of two crash recoveries were screened to about ten people
    summary: 'After Doty''s report on the Sandia guard, headquarters ordered him briefed into a programme he calls NineQ.
      An Air Force colonel and a civilian briefed roughly ten people - intelligence staff, Sandia and Department of Energy
      contractors, Air Force Weapons Laboratory scientists - of whom Doty was the only OSI agent. Documents and film were
      shown: the Roswell/Corona recovery, with the craft, bodies outside it on a dirt mound, military tents, personnel in
      army uniforms and debris laid out on tables, narrated by a voice added afterwards; and a second recovery at Kingman,
      Arizona around 1953 with two differently-shaped bodies and a truck marked United States Air Force. Driving back he pulled
      into a car park and sat trying to decide whether the whole thing was a psychological operation run on him; back at the
      office his boss John told him it was all real. He says the material is now unclassified but his own freedom-of-information
      request produced a refusal to confirm or deny, and that the Air Force gave Congress some of the footage but not all
      of it. This account is causally and physically inside the Sandia guard narration - it was ordered because of that report
      - but its claims are about the briefing, not about 1947 or 1953.'
    confidence: high
