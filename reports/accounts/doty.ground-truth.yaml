  - title: Pressuring two Nevada MUFON investigators away from a close-encounter witness
    subject: Two unnamed MUFON field investigators out of Nevada, and the unnamed man near the Nellis Test and Training Range
      whose close encounter they were documenting
    summary: 'Asked what he would have done differently, Doty names one occasion: he would not have targeted people inside
      a UFO group. Two MUFON investigators from Nevada were legitimately collecting very good information from a man who had
      had a close encounter not far from the Nellis Test and Training Range. Doty was part of an attempt to convince them
      the witness was a liar already investigated and discredited, while both they and Doty knew he was not. Another agent
      was brought in to apply more pressure. Doty says the investigators did not believe any of it, that they won and OSI
      lost, that deception operations were not always successful, and that even the thugs from the 7602nd Intelligence Wing
      had to operate mostly within the law. Three unnamed protagonists, and the only failed deception operation he narrates.'
