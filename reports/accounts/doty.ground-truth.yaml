  - title: Showing Linda Moulton Howe a presidential briefing document at Kirtland
    subject: Linda Moulton Howe, brought onto Kirtland Air Force Base to read a document under controlled conditions, and
      the headquarters operation to identify her Pentagon source
    summary: 'Doty was tasked about a week ahead to make an appointment and let Howe read material that would be sent to him.
      A package arrived by armed forces courier which he only skimmed; on the morning of the meeting he read it properly and
      judged it a presidential briefing document, while wondering how much of it was real. A room with a two-way mirror was
      prepared and everything was recorded on audio and video. He cleared her through the gate and set the rules - she could
      read it, take no notes, take no photographs - and she read it several times over about 35 to 40 minutes before he repackaged
      it and returned it to headquarters. The wider operation was run from headquarters, not by him: Howe was making a UFO
      documentary for HBO with information from an Air Force officer at the Pentagon, and Doty''s job was to get that officer''s
      name so a case could be run against him. He says he was totally unsuccessful; she gave him other information but never
      names.'
    confidence: high
