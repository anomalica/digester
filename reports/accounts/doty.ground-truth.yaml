  - title: The paid prostitute informants around the Nellis range and the F-117 major who talked
    subject: An AFOSI programme paying prostitutes around the Nellis Test and Training Range as informants, one of them in
      Pahrump, and the unnamed married Air Force major flying the F-117 whom she reported
    summary: Because prostitution was legal in Nye County and the surrounding counties in the late 1970s and 1980s, Doty's
      job included recruiting and paying every prostitute around the Nellis range to report any Air Force person who talked
      about his work; he calls them the best sources of information they had. One woman in Pahrump reported a regular client,
      a major flying the F-117, who impressed her with stories about the aircraft, including that they could chase flying
      saucers with it. On Doty's instruction she reported his next appointment; they bugged the room and recorded about twenty
      minutes of him talking. Doty collected him from his suite at the Tonopah dormitory, left him waiting in a camera-monitored
      interrogation room, opened by reciting his rank, flying hours, aircraft, wife at Edwards and two children, at which
      the major started crying, then read him his Article 31 rights, had him sign, and obtained a full admission. He was taken
      off flying status, returned to Edwards and removed from the programme.
    confidence: high
