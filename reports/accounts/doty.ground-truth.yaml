  - title: The Myrna Hansen report and the two DIA agents who visited Kirtland
    subject: Doty's 1980 interview of Myrna Hansen, and the two Defense Intelligence Agency agents from a branch that investigates
      abductions who came to the Kirtland OSI office about his report
    summary: Leo Sprinkle and Allen Hynek brought Myrna Hansen to Doty when he knew nothing about abductions and did not believe
      in them; he interviewed her, privately concluded she was psychologically unstable, and filed a report to headquarters.
      About a week later two cleared visitors arrived at the Kirtland OSI office asking to discuss the Hansen case. Asked
      what branch they were with, one answered that the branch investigates abductions. They found he was not briefed into
      the relevant special access programme and had him read in, at which point he realised a DIA unit had been working the
      subject for years - inside an agency that itself only came into existence in 1961. The subject of this account is the
      visit and the existence of the DIA branch, not Hansen's experience, which is only referenced.
