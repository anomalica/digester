  - title: The FBI visits and the OSI phone call after Doty began speaking publicly
    subject: 'Official approaches to Doty after his non-disclosure agreement expired in 2002: two FBI visits and one telephone
      call from a former OSI civilian working as a contractor'
    summary: 'Doty''s non-disclosure agreement expired in 2002 and he began speaking publicly. Since then FBI agents have
      visited him twice to say he had said something on camera he should not have: once over an item he knew at the time was
      still a special access programme and tried unsuccessfully to talk around, once over a document with classified information
      that he had given to somebody, material he maintains had been on the internet for years. Separately, around his eleventh
      Gaia episode in 2018, a man he knew - a former OSI civilian who had returned as a contractor - telephoned to ask why
      he had mentioned particular items and told him they were still classified when Doty had assumed they were not. No visit
      followed, so he concluded the material had been declassified. This account physically interrupts the indoctrination-briefing
      narration; it arises from the interviewer''s question about freedom-of-information attempts.'
