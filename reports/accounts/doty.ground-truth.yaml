  - title: The Mario Woods interrogation at Ellsworth Air Force Base, 1977
    subject: Sergeant Mario Woods, a US Air Force security policeman interrogated by AFOSI after an encounter near Ellsworth
      Air Force Base, and the second policeman, Michael Johnson, held in a separate room
    summary: 'Doty was at Ellsworth on temporary duty for an unrelated espionage case when the Woods incident occurred. Detachment
      commander John Brisboy sent him to the base hospital to collect Woods''s medical records, which he carried into the
      interview room where agent Jack Green was questioning Woods. He stood there about 45 minutes, left, returned later and
      found the questioning still running, putting the total at roughly ten hours rather than the four or five Woods recalls,
      and by then an interrogation rather than an interview. The second security policeman, Michael Johnson, was brought from
      the base hospital and held in a room Doty never entered. Doty explains the several minutes agents spent feeling inside
      Woods''s mouth: Woods had said something at the hospital about his voice changing, so OSI suspected an implant in the
      mouth or throat. He says a later classified OSI report treated the incident as real, and that Woods had six hours of
      missing time.'
    confidence: high
