  - title: The MJ-12 document reaching Jaime Shandera and the seizure of Bill Moore's copy in San Francisco
    subject: The Majestic 12 briefing document delivered to Jaime Shandera, and Doty's seizure and onward transmission of
      a copy taken from Bill Moore
    summary: 'Doty says the story starts two weeks earlier: Shandera, an asset then being used by the Naval Investigative
      Service, went to Washington and met somebody at the Botanical Gardens, where he was told certain things. About two weeks
      later the document appeared postmarked Albuquerque, but FBI analysis found the marking was not a genuine postal mark,
      so it was never mailed - it was placed in his box, a dead drop. Shandera contacted Moore, who later showed Doty a copy
      of a copy in a San Francisco hotel room while the two were there on unrelated business. Doty seized it as a federal
      agent because it bore classification markings, took it to the OSI office at Travis Air Force Base in Fairfield to be
      packaged for the armed forces courier system, had it mailed to him at Kirtland, then forwarded it to headquarters. A
      contact called Benjamin confirmed arrival; a month later he was told it had been passed on and that he did not need
      to know. He concluded a deception operation had occurred and points to the Special Means Committee within DIA, which
      produces such documents for counter-espionage passage material. He notes the FBI targeted DIA when this was investigated
      in 1987-88 and that DIA denied it.'
    confidence: high
