  - title: The disc found in a mine shaft, pulled out by the DART team and stored at Tonopah
    subject: A disc about five feet across, said to have crashed in the 1960s and been placed in a mine shaft by miners, found
      by a mining exploration team around 1980-81 and recovered by a government Down Aircraft Recovery Team
    summary: Doty says he was physically at one crash site where the crash itself had happened years earlier and had only
      just been discovered. A mining exploration team working a shaft found the object; investigators assumed it had come
      down outside the shaft and that the miners, not knowing what to do with it, put it inside, with no record of any report.
      He went as part of a team doing the counterintelligence work on the people who found it, and watched the Special Down
      Aircraft Recovery Team pull it out. He describes a disc about five feet in diameter with one indented section, possibly
      from impact, and no opening anyone could find. It went to Tonopah, and when he was there in 1984 it was still unopened;
      he understood it was opened three or four years after recovery but was never told what was inside, speculating that
      occupants would have had to be about two feet tall and that someone told him it was probably a scout craft. He identifies
      this as the first craft he saw with his own eyes.
