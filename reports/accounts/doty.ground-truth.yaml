  - title: Colonel Law's remark about the MJ-12 documents at a UFO convention
    subject: Colonel Law, chief of counterintelligence for AFOSI, and what he told Doty years later about whether the MJ-12
      material was genuine
    summary: 'Doty says he learned this years afterwards, not during the 1980s. He collected Colonel Law, then chief of counterintelligence
      for OSI, from the airport and brought him to a UFO convention near its end. Sitting talking, the subject of Ryan Wood''s
      father came up, and Law remarked that he never thought that material would end up where it ended up. Doty asked him
      directly whether it was real; Law replied by asking how many counter-espionage operations Doty had run and reminding
      him that you have to give them some of the real stuff. That was all he said. Doty takes it to mean the MJ-12 documents
      mix legitimate information with fabricated material, while stating he cannot confirm it because he was not the author.
      Distinct from the seizure account in time, place, participants and evidential status: this is a remark he interprets,
      not an operation he ran.'
