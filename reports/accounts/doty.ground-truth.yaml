boundary_notes: 'Where boundaries actually fall in this record, and what makes them hard.


  1. ACCOUNT SPANS ARE NOT CONTIGUOUS, AND THE INTERRUPTIONS ARE NOT DIGRESSIONS - THEY ARE OTHER ACCOUNTS. The worst case
  in this transcript runs from line 383 to 905. The Sandia guard case opens at 383; the indoctrination briefing (a distinct
  account, caused by the guard report) is narrated at 394-535; the briefing narration is then interrupted by the FBI-visits
  account (529-590), which is interrupted by the Laughlin convention account (591-660), followed by general exposition on
  briefing types and a hypothetical crash callout Doty explicitly says he is inventing (660-717); the briefing then resumes
  at 718 with the boss John exchange; and only at 754 does the guard case resume, running to 905. That is four accounts and
  two non-accounts interleaved inside one 520-line stretch. A window-based or paragraph-based segmenter will get every boundary
  in this region wrong. The signal that a resumption is happening is conversational, not lexical: at line 716 the interviewer
  himself loses the thread and re-anchors wrongly (''so to get back to you''re in this parking lot ... now you''re on your
  way to meet a witness''), and Doty corrects him (''no no no no ... that was later''). Interviewer re-anchoring attempts
  and speaker corrections about ordering are the strongest available cue that a span has been suspended and is being resumed.


  2. THE SAME ACCOUNT IS INTRODUCED THOUSANDS OF LINES BEFORE IT IS TOLD. The Kirtland sergeant is first mentioned at line
  165 - one paragraph, the object under her tongue, the congressional whistleblower status, the derived counter-abduction
  technology - and not narrated until 2203-2960. Nothing lexical links them: the first mention gives no name (there is none),
  no place (Kirtland is only supplied later), and no date. The only linkage is a conjunction of attributes (female Air Force
  sergeant + abducted + implant + whistleblower listed in Congress + techniques developed from her case). Any extraction stage
  that segments locally will produce two accounts and split her claims across them. Coreference for unnamed subjects has to
  run over the whole document, on attribute bundles, not on strings.


  3. NARRATION ORDER IS NOT EVENT ORDER, AND THE SPEAKER SIGNALS THE JUMP WITH A STOCK PHRASE. Within the sergeant case, the
  climax (the thwarted abduction) is told first at 2264 and the origin (her first injuries, the psychiatric hospital, the
  polygraphs, the bug) second at 2469. The transition markers are ''Well, let me go back a little bit'' (2629) and ''Well,
  there was part of that'' (2469). Similar markers elsewhere: ''Now jump ahead many many 30, some 40 years'' (3240, the shift
  from the 1980s S2 Annex episode to the recent Vermont trip), ''And now jump ahead'' (1960s mine-shaft disc to Tonopah 1984).
  These phrases mark a time jump inside one account roughly as often as they mark a new account, so they are a trigger to
  check, not a boundary.


  4. THE THINNEST ACCOUNTS ARE COMPLETE AND ALMOST INVISIBLE. The A-7 National Guard pilot case (910-925) is a whole investigation
  - contact in the air and on the ground, a witness with a clearance who cannot be given the cover story, a signed undertaking
  of silence - in about eight lines, introduced mid-sentence as an example illustrating a general point, and highlighted by
  the human reviewer not at all. The fabricated Aurora sighting (1382-1396) is fourteen lines and is the single clearest admission
  in the interview. The fabric-of-space observation (4312-4328) is sixteen lines. Length is anti-correlated with importance
  here, and ''introduced as an example of a general point'' is a common frame for a real account: ''if a pilot and i had these
  happened at an A7...''.


  5. THE HUMAN REVIEWER''S HIGHLIGHTS ARE NOT A USABLE SIGNAL FOR ACCOUNT PRESENCE. The captain''s wife taken near Springer
  (3530-3678) runs 148 lines of dense specifics - named towns, distances, a state trooper, two fishermen, a hospital, a forensic
  exclusion - and carries zero highlighted passages. So do the Space Force / Defense Inspector General episode, the Nellis
  road encounter that the interviewer explicitly frames as the most serious incident, the A-7 National Guard pilot, and the
  whole two-truths-and-a-lie set. Meanwhile the mine-shaft disc drew roughly fifteen highlights. If highlight density is used
  as the account detector, about a fifth of the record vanishes.


  6. NESTING IS REAL AND HAS TWO DIFFERENT SHAPES. (a) Causal-and-contained: the indoctrination briefing sits inside the Sandia
  guard case because the guard''s report is what triggered it. (b) An episode inside a long case: the one-night surveillance
  operation inside the sergeant''s multi-year case, with its own agencies, its own outcome and a second protagonist (the FBI
  agent) who exists nowhere else. A third shape appears with the two-truths-and-a-lie set, where the parent is a frame rather
  than an event and the children are unrelated to each other - but the frame determines the truth value of every child, so
  flattening it would let the platform record an admitted fabrication as testimony.


  7. THE HARDEST NEGATIVE CASES ARE THE ONES THAT LOOK LIKE ACCOUNTS. Four things in this transcript have the texture of an
  account and are not one: the naming of the aviary (a contested identification with no episode), Doty''s employment with
  Puthoff (biography, containing a loaded silent nod), the strawberry ice cream provenance chain (a sourcing statement about
  a person who never appears), and the truck driver''s ''I''ve done it before ... these round things'' (an implied prior recovery
  with nothing bounded around it). Each carries a claim worth keeping. The design consequence: an account layer needs somewhere
  for a significant claim that has no account, or the pressure to create a spurious account will be constant.


  8. AND THE HARDEST POSITIVE CASES ARE THE ONES THAT LOOK LIKE COMMENTARY. The hypothetical crash callout at 660-717 is narrated
  in full operational detail and is explicitly invented (''I''m making this up, okay?'') - then at 2009 Doty says ''The story
  I gave you earlier about being on call and getting a call, I did'', and narrates the real one at Warm Springs. A detector
  keying on narrative texture will take the fabricated illustration as an account and may then merge it with the real episode
  1,300 lines later.


  9. WHO IS SPEAKING IS PART OF THE BOUNDARY. The Copperfield identity-card account is narrated entirely by the interviewer,
  with a physical artefact he says he holds, and Doty says four times that he had never heard of it. Attributing it to Doty
  would turn a podcast host''s private research into a former intelligence officer''s claim. Speaker attribution has to be
  an account-level field, not left implicit in the span.


  10. EVIDENTIAL DISTANCE VARIES WITHIN A SINGLE ACCOUNT AND IS THE THING MOST EASILY LOST. Doty is repeatedly precise about
  the limits of what he saw - the Warm Springs bodies were covered, so he will not say he saw them; he heard about ten seconds
  of the sergeant''s audio and never saw the video; he took the initial report on the Springer case and learned the outcome
  as a one-sentence remark months later; the Sidewinder engagement is a file he held, not an event he attended. That qualification
  lives in the account and is exactly what atomising into claims destroys. Recording doty_role per account (direct participant
  / peripheral participant / briefed only / hearsay / none) is not decoration; it is the field that keeps the record honest,
  and it should be allowed to differ between a parent account and a nested one.'
