  - title: The Paul Bennewitz deception operation and the drone programme it concealed
    subject: Paul Bennewitz, the Albuquerque businessman and APRO field investigator photographing objects near Kirtland Air
      Force Base, and the headquarters-written operations plan Doty executed against him
    summary: Doty describes the mechanics rather than the whole case. His reports went up through CIA to DIA, which sent back
      a task list of roughly ten items including neighbour enquiries and a local agency check; after a call on a KY-3 secure
      phone between him, his boss and headquarters, an operations plan was written at headquarters and passed to him to carry
      out. He states plainly that the disinformation was planned at headquarters and that he did what he was told. What Bennewitz
      was photographing, he says, was an Air Force drone programme in its infancy, drones launched from a C-130 or an RC-135/137
      with a controller aboard the aircraft, which had to stay in close proximity. Because Bennewitz was already an APRO field
      investigator and a believer who had had his own family sighting, the whole deception amounted to agreeing that the objects
      were flying saucers. Doty says at the close of the interview that the fuller Bennewitz story was not covered here.
    confidence: high
