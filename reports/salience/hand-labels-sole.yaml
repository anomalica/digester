# Hand-labelled SOLE-REFERENCE edges: calibration for the instrument, not the model.
#
# A STRATIFIED SAMPLE, and that is the point of it. The random 40 pairs in
# hand-labels.yaml contained only 18 that sole_reference_score selects, too few
# to say how often its assumption holds. These 30 are drawn ONLY from claims
# with exactly one reference - the population the instrument scores.
#
# So this file measures THE INSTRUMENT. It must never be used for the model's
# overall role accuracy: the sample is deliberately biased towards claims whose
# subject was never extracted, which is where the instrument's assumption fails.
# hand-labels.yaml is the unbiased set.
#
# Labelled by reading under claims v6 - the four tests applied IN ORDER, first
# fit wins, `participant` covering a node acted upon as well as one that acts.
