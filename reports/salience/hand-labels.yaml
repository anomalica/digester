    model: mentioned
    gold: participant
    note: >-
      "Fowler wrote five books: A; B; C; D; E." This was the one real taxonomy gap the sample found: deleting a title changes
      what is asserted, so `mentioned` failed its own test, and a book does not act, so `participant` failed too. Closed 2026-09-08
      by widening `participant` to "acts OR IS ACTED UPON" rather than adding a fifth value - the book is what the writing
      was done to. Still an error, and now an unambiguous one.
