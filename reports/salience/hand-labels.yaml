# Hand-labelled reference roles: the calibration set for every automatic measure.
#
# Forty claim/reference pairs drawn at random (seed 5) from the haiku digest of
# 2026-08-08-video-raymond-fowler, labelled by reading the claim and applying the
# four deletion tests in prompts/claims.txt literally.
#
# It exists because both automatic instruments in salience.py ASSUME an answer
# rather than knowing one, and nothing had ever checked those assumptions against
# a human reading. Scored by reports/salience/score_labels.py.
#
# `ambiguous: true` marks a pair where two roles are defensible under the
# definitions as written - not a hard case for the model, a GAP IN THE TAXONOMY.
# Four of the five were closed on 2026-09-08 by widening `participant` to "acts
# OR IS ACTED UPON" and by ruling that the four tests apply IN ORDER, first fit
# wins. THE WIDENING DID NOT RAISE THE MODEL'S SCORE - it removed the excuse for
# three of its errors, so the strict and clean figures converged rather than the
# model improving. One pair (i=37) stays open and says why.
schema: anomalica/salience-labels/1
record: 2026-08-08-video-raymond-fowler
digest: haiku
sample: random seed 5, 40 claim/reference pairs
labelled_by: reading, against the deletion tests in prompts/claims.txt
